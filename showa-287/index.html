<script>
const D={"name": "ワールドリーグ初優勝", "file": "287_編集用", "dur": 921.95, "segs": [], "subs": [{"t": 0.0, "x": "東京体育館のリングで3本目のゴングが\n鳴ったのは、1966年5月13日の夜でした。"}, {"t": 7.133333333333334, "x": "そこから1分35秒しかたたないうちに、\n試合は終わってしまいます。"}, {"t": 11.95, "x": "アメリカから来た元世界王者がリングの外に\n出たまま、戻ってこられなかったからです。"}, {"t": 17.45, "x": "勝ち名乗りを受けたのは、\nジャイアント馬場でした。"}, {"t": 20.616666666666667, "x": "第8回ワールド・リーグ戦の、\n優勝が決まる試合です。"}, {"t": 24.516666666666666, "x": "馬場の公式年表にも、\nこの日のことが載っています。"}, {"t": 28.25, "x": "東京体育館で決勝の相手を下し、\n第8回ワールド・リーグ戦で"}, {"t": 33.2, "x": "初めて優勝した、とあります。"}, {"t": 35.516666666666666, "x": "この大会は、力道山が始めた春の大会でした。"}, {"t": 39.31666666666667, "x": "なぜ馬場は、この年に初めて勝てたのでしょうか？"}, {"t": 42.8, "x": "力道山がいなくなってから、\nこの大会では何が起きていたのでしょうか？"}, {"t": 47.56666666666667, "x": "今回は、1966年5月13日の\n決勝の夜を追います。"}, {"t": 52.88333333333333, "x": "大会の始まりから、順に見ていきます。"}, {"t": 55.833333333333336, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 60.4, "x": "新聞の記事や公式年表も合わせて見ていきます。"}, {"t": 63.8, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.3, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.86666666666666, "x": "まず、この大会の始まりです。"}, {"t": 74.46666666666667, "x": "ワールド・リーグ戦は、\n日本プロレスが開いた大会です。"}, {"t": 78.28333333333333, "x": "第1回は1959年でした。"}, {"t": 81.26666666666667, "x": "最初の5回までは\nワールド大リーグ戦という名前でした。"}, {"t": 84.83333333333333, "x": "第6回から\nワールド・リーグ戦という名前になっています。"}, {"t": 88.3, "x": "試合の形は1人と1人の総当たりです。"}, {"t": 91.15, "x": "外国人の選手と日本の選手が向かい合う形でした。"}, {"t": 94.73333333333333, "x": "日本の選手どうしの試合は、\n組まれなかったとされています。"}, {"t": 98.8, "x": "第1回で優勝したのは力道山です。"}, {"t": 101.58333333333333, "x": "次の年も、その次の年も、力道山が勝ちました。"}, {"t": 105.81666666666666, "x": "1963年の第5回まで、\n優勝は5回とも力道山です。"}, {"t": 110.93333333333334, "x": "第5回の決勝は、\n1963年5月17日の東京体育館でした。"}, {"t": 117.01666666666667, "x": "相手は外国人のレスラーです。"}, {"t": 119.15, "x": "東京スポーツは力道山が\n2対1で勝ったと書いています。"}, {"t": 122.75, "x": "力道山が亡くなる、およそ7か月前の試合でした。"}, {"t": 126.65, "x": "この第5回には馬場も出ていました。"}, {"t": 128.85, "x": "アメリカから帰ったばかりの年です。"}, {"t": 131.13333333333333, "x": "リーグ戦の試合は、8分3ラウンドの形でした。"}, {"t": 134.88333333333333, "x": "3月29日は滋賀県の大津です。"}, {"t": 137.61666666666667, "x": "馬場は3ラウンド2分40秒、\n押さえ込みで勝ちました。"}, {"t": 141.55, "x": "3月31日は徳島で、これも勝ちです。"}, {"t": 145.18333333333334, "x": "4月6日は山口県の防府でした。"}, {"t": 147.86666666666667, "x": "相手は外国人のレスラーです。"}, {"t": 150.0, "x": "馬場は3ラウンドに押さえ込まれ、負けました。"}, {"t": 153.36666666666667, "x": "4月14日は沖縄の離れ島での試合です。"}, {"t": 156.7, "x": "このころの沖縄はアメリカが治めていました。"}, {"t": 159.43333333333334, "x": "会場は女子高校の校庭でした。"}, {"t": 161.81666666666666, "x": "馬場は1ラウンド6分8秒、\n逆エビ固めで勝っています。"}, {"t": 166.43333333333334, "x": "5月1日は秋田県の東由利で、\n会場は家畜の市場でした。"}, {"t": 171.25, "x": "この試合は、馬場の反則負けと記録されています。"}, {"t": 174.86666666666667, "x": "4月23日の大阪府立体育会館は\n時間切れの引き分けでした。"}, {"t": 179.63333333333333, "x": "5月4日の函館では相手の反則で勝ちました。"}, {"t": 182.86666666666667, "x": "優勝したのは力道山でした。"}, {"t": 184.93333333333334, "x": "その年の12月です。"}, {"t": 186.65, "x": "12月8日の夜、力道山は\n東京・赤坂で刺されました。"}, {"t": 191.1, "x": "12月15日、力道山は39歳で亡くなりました。"}, {"t": 195.56666666666666, "x": "大会を始めた人が、いなくなりました。"}, {"t": 198.5, "x": "年が明けて1964年です。"}, {"t": 201.21666666666667, "x": "4月3日、第6回ワールド・リーグ戦が\n始まりました。"}, {"t": 205.4, "x": "東京スポーツは、力道山が亡くなってから\n初めてのリーグ戦だったと書いています。"}, {"t": 210.63333333333333, "x": "4月7日は愛知県の豊橋です。"}, {"t": 213.15, "x": "馬場は外国人の強豪と初めて当たりました。"}, {"t": 216.21666666666667, "x": "45分3本勝負で、どちらも\n1本も取れずに時間切れでした。"}, {"t": 221.11666666666667, "x": "4月17日は香川県の高松です。"}, {"t": 224.03333333333333, "x": "同じ相手と、今度はリーグ戦の公式の試合です。"}, {"t": 227.8, "x": "8分3ラウンドの試合でした。"}, {"t": 229.96666666666667, "x": "最後は馬場が押さえ込みに行ったところで、\nゴングが鳴りました。"}, {"t": 234.01666666666668, "x": "引き分けです。"}, {"t": 235.03333333333333, "x": "東京スポーツの見出しには\n相手の言葉が載っています。"}, {"t": 238.3, "x": "馬場もなかなかやる。"}, {"t": 239.53333333333333, "x": "上からの言い方でした。"}, {"t": 241.13333333333333, "x": "この年の決勝は5月12日、\n東京都体育館でした。"}, {"t": 245.58333333333334, "x": "勝ったのは、日本プロレスの先輩のレスラーです。"}, {"t": 248.93333333333334, "x": "東京スポーツによると、先輩はリーグ戦を\n7戦7勝で勝ち上がっていました。"}, {"t": 254.23333333333332, "x": "決勝の相手は、場外に落ちてひざを痛めます。"}, {"t": 257.7, "x": "試合は3ラウンド2分45秒、\nリングアウトで終わっています。"}, {"t": 262.31666666666666, "x": "力道山のほかに、この大会で\n優勝した人は初めてでした。"}, {"t": 266.6333333333333, "x": "東京スポーツはそう書いています。"}, {"t": 268.78333333333336, "x": "1965年の第7回も、\n同じ先輩のレスラーが勝ちました。"}, {"t": 273.75, "x": "2年続けての優勝です。"}, {"t": 275.6166666666667, "x": "馬場も、この年のリーグ戦に出ていました。"}, {"t": 278.56666666666666, "x": "4月20日の大阪は、8分3ラウンドの\n時間切れで引き分けです。"}, {"t": 283.26666666666665, "x": "5月17日は石川県の小松で、\n相手のリングアウトで勝っています。"}, {"t": 288.28333333333336, "x": "ただ、優勝には届きませんでした。"}, {"t": 290.98333333333335, "x": "その年の11月24日です。"}, {"t": 293.46666666666664, "x": "馬場は大阪で、インターナショナル王座の\nチャンピオンになりました。"}, {"t": 297.75, "x": "力道山が持っていたベルトです。"}, {"t": 299.8666666666667, "x": "この話は、以前の動画で詳しく取り上げました。"}, {"t": 303.3666666666667, "x": "そして1966年です。"}, {"t": 305.8666666666667, "x": "春の大会の前に、\n日本プロレスは大きく揺れました。"}, {"t": 309.6166666666667, "x": "2年続けて優勝した先輩のレスラーは、\n会社の社長でもありました。"}, {"t": 314.4166666666667, "x": "東京スポーツによると、\n1月に社長を辞めています。"}, {"t": 318.26666666666665, "x": "試合の記録では、日本プロレスが社長の\n辞任を発表したのは1月5日です。"}, {"t": 323.71666666666664, "x": "同じ日に、アジア・タッグ王座も\n空位とされました。"}, {"t": 327.26666666666665, "x": "そして3月には、\n日本プロレスから除名されました。"}, {"t": 330.93333333333334, "x": "前の年まで勝っていた人が\n大会からいなくなったのです。"}, {"t": 334.3666666666667, "x": "もう1つの知らせもありました。"}, {"t": 336.28333333333336, "x": "若手の猪木は、このころ\nアメリカで試合をしていました。"}, {"t": 339.95, "x": "この年の大会に出る予定だった、と\n記録されています。"}, {"t": 343.8, "x": "3月21日、日本プロレスは猪木の\n出場を取りやめると発表しました。"}, {"t": 349.26666666666665, "x": "3月25日、\n第8回ワールド・リーグ戦が始まります。"}, {"t": 353.9166666666667, "x": "最初の大会は、東京の\nリキ・スポーツパレスでした。"}, {"t": 357.65, "x": "試合の記録によると、大会は\n5月13日までに38回開かれています。"}, {"t": 363.46666666666664, "x": "リーグ戦に出た外国人は8人でした。"}, {"t": 366.18333333333334, "x": "日本の選手は7人です。"}, {"t": 368.1666666666667, "x": "今回も、日本の選手は外国人とだけ戦いました。"}, {"t": 372.03333333333336, "x": "外国人の中に、ひときわ目立つ経歴の\nレスラーがいました。"}, {"t": 376.0833333333333, "x": "このあと決勝で馬場と戦う相手です。"}, {"t": 378.6166666666667, "x": "この春が、日本に初めて来た時でした。"}, {"t": 381.55, "x": "もとはアメリカンフットボールの選手です。"}, {"t": 384.0833333333333, "x": "アメリカのプロのチームにいました。"}, {"t": 386.0833333333333, "x": "カナダのチームでもプレーしています。"}, {"t": 388.21666666666664, "x": "プロレスに入ったのは1952年でした。"}, {"t": 391.3833333333333, "x": "東京スポーツは、\n元AWA世界ヘビー級王者と紹介しています。"}, {"t": 396.46666666666664, "x": "1964年1月には、当時の\nNWA世界ヘビー級王者に挑みました。"}, {"t": 402.73333333333335, "x": "60分の時間切れ引き分けで、\n名勝負になったと記事は書いています。"}, {"t": 407.48333333333335, "x": "場所はアメリカの\nデトロイトだったとされています。"}, {"t": 410.23333333333335, "x": "馬場も1964年の2月に、\nデトロイトで同じ王者に挑んでいました。"}, {"t": 415.4, "x": "得意な技は、危ないパイルドライバーでした。"}, {"t": 418.65, "x": "馬場は、このレスラーと大会の\n途中で1度当たっています。"}, {"t": 422.53333333333336, "x": "4月2日の大阪です。"}, {"t": 424.3666666666667, "x": "結果は引き分けでした。"}, {"t": 425.9, "x": "ほかの日には、各地で外国人の\n選手と1人ずつ戦っています。"}, {"t": 430.3666666666667, "x": "4月4日の広島は、馬場の勝ちです。"}, {"t": 433.4, "x": "4月9日の熊本も馬場が勝ちました。"}, {"t": 436.06666666666666, "x": "相手はこの大会のために\n呼ばれた外国人の1人です。"}, {"t": 439.53333333333336, "x": "4月20日は広島県の福山です。"}, {"t": 442.21666666666664, "x": "4月28日は兵庫県の西宮でした。"}, {"t": 445.43333333333334, "x": "5月2日は福井です。"}, {"t": 447.1666666666667, "x": "5月6日は栃木県の足利でした。"}, {"t": 449.76666666666665, "x": "5月9日は山梨県の甲府です。"}, {"t": 452.3833333333333, "x": "試合の記録では、このどれもが\n馬場の勝ちとなっています。"}, {"t": 456.1166666666667, "x": "タッグの試合では、様子が違いました。"}, {"t": 459.06666666666666, "x": "決勝の相手が入った組に、\n馬場の組は何度も負けています。"}, {"t": 463.28333333333336, "x": "3月31日は兵庫県の姫路です。"}, {"t": 466.3333333333333, "x": "4月1日は大阪でした。"}, {"t": 468.4166666666667, "x": "4月6日は福岡です。"}, {"t": 470.3, "x": "4月17日は山口県の岩国でした。"}, {"t": 473.35, "x": "4月24日は徳島です。"}, {"t": 475.6, "x": "どの試合も、相手の組の勝ちと記録されています。"}, {"t": 479.1, "x": "4月27日は大阪の布施市の体育館でした。"}, {"t": 482.65, "x": "空いていたアジア・タッグ王座をかけた試合です。"}, {"t": 485.5, "x": "馬場は日本プロレスの先輩と組みました。"}, {"t": 488.0833333333333, "x": "相手の組には、決勝の相手が入っています。"}, {"t": 491.46666666666664, "x": "結果は1対1の引き分けでした。"}, {"t": 493.71666666666664, "x": "ベルトは預かりのままになっています。"}, {"t": 495.9166666666667, "x": "リーグ戦の勝ち点は、外国人と日本の\n選手で分けて数えられていました。"}, {"t": 500.98333333333335, "x": "外国人の側で一番多かったのは、\n6点のこのレスラーです。"}, {"t": 505.3833333333333, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
