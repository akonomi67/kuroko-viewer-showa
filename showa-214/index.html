<script>
const D={"name": "鶴田のAWA世界王座", "file": "214_編集用", "dur": 863.46665625, "segs": [], "subs": [{"t": 0.0, "x": "1984年2月23日、東京都台東区蔵前。"}, {"t": 5.2, "x": "蔵前国技館。"}, {"t": 6.466666666666667, "x": "イメージ映像"}, {"t": 6.466666666666667, "x": "この日のメインイベントは、\nダブルタイトルマッチでした。"}, {"t": 10.2, "x": "AWA世界ヘビー級王座と、\nインターナショナル・ヘビー級王座。"}, {"t": 15.033333333333333, "x": "2本のベルトが同時に懸けられています。"}, {"t": 17.483333333333334, "x": "AWA世界ヘビー級王者は\nニック・ボックウィンクル。"}, {"t": 21.05, "x": "インターナショナル・\nヘビー級王者はジャンボ鶴田です。"}, {"t": 24.183333333333334, "x": "特別レフェリーを務めたのは、\n前の年に引退したテリー・ファンクでした。"}, {"t": 28.783333333333335, "x": "イメージ映像"}, {"t": 28.783333333333335, "x": "試合時間は32分0秒。"}, {"t": 31.166666666666668, "x": "鶴田がバックドロップ・ホールドでボック\nウィンクルから3カウントを奪います。"}, {"t": 35.333333333333336, "x": "AWA世界ヘビー級王座が、\n日本人の腰に渡りました。"}, {"t": 39.93333333333333, "x": "第30代王者です。"}, {"t": 41.61666666666667, "x": "このとき鶴田は32歳。"}, {"t": 43.53333333333333, "x": "ボックウィンクルは49歳でした。"}, {"t": 45.95, "x": "当時を伝える記事には、\n「どうせタイトルは移動しない」と"}, {"t": 49.35, "x": "言われていた、という書き方が残っています。"}, {"t": 52.31666666666667, "x": "海外の団体が持つ世界王座が日本の会場で\n動くことは、それだけ珍しいことでした。"}, {"t": 58.38333333333333, "x": "今回は、この1984年2月23日に何が\n動いたのかを、日付と数字だけで追いかけます。"}, {"t": 65.98333333333333, "x": "それでは本編です。"}, {"t": 67.51666666666667, "x": "よろしければ、チャンネル\n登録と高評価をお願いします。"}, {"t": 71.4, "x": "まず、ベルトを持っていた側から見ていきます。"}, {"t": 74.71666666666667, "x": "イメージ映像"}, {"t": 74.71666666666667, "x": "ニック・ボックウィンクルは1934\n年12月6日、アメリカ・ミズーリ"}, {"t": 79.78333333333333, "x": "州セントルイスの生まれです。"}, {"t": 81.45, "x": "イメージ映像"}, {"t": 81.45, "x": "身長188センチ、全盛期の体重は\n120キロと記録されています。"}, {"t": 87.2, "x": "奨学金でオクラホマ大学に入りましたが、\n膝を負傷してカリフォルニア大学"}, {"t": 92.28333333333333, "x": "イメージ映像"}, {"t": 92.28333333333333, "x": "ロサンゼルス校へ移り、在学中の1954\n年にプロレスラーとしてデビューしました。"}, {"t": 98.36666666666666, "x": "イメージ映像"}, {"t": 98.36666666666666, "x": "ボックウィンクルがAWAに\n移ったのは1970年12月以降です。"}, {"t": 103.7, "x": "ここからマネージャーの\nボビー・ヒーナンが付きました。"}, {"t": 106.46666666666667, "x": "1972年1月20日には、\nレイ・スティーブンスと組んでAWA"}, {"t": 111.68333333333334, "x": "世界タッグ王座を奪っています。"}, {"t": 113.65, "x": "このタッグ王座は通算3回獲得しました。"}, {"t": 116.65, "x": "ニックネームは「金髪狼」。"}, {"t": 118.61666666666666, "x": "反則負けを重ねながら王座を守っていく\nスタイルで知られた選手です。"}, {"t": 122.93333333333334, "x": "彼が王者を務めていたAWAは、\n1960年5月に生まれた団体です。"}, {"t": 129.0, "x": "イメージ映像"}, {"t": 129.0, "x": "ミネソタ地区のプロモーターとバーン・\nガニアがNWAから離れて設立し、"}, {"t": 133.56666666666666, "x": "本部はミネアポリスに置かれました。"}, {"t": 136.2, "x": "シカゴ、ミルウォーキー、オマハ、\nデンバー、カナダのウィニペグなど、"}, {"t": 141.8, "x": "アメリカ北部が主な興行圏でした。"}, {"t": 144.61666666666667, "x": "イメージ映像"}, {"t": 144.61666666666667, "x": "形の上ではNWAと同じくプロモーターの\n連合でしたが、実際には1つの"}, {"t": 150.11666666666667, "x": "団体として動いていたと記録されています。"}, {"t": 152.61666666666667, "x": "イメージ映像"}, {"t": 152.61666666666667, "x": "実権を握っていたのはバーン・ガニアで、\nガニアはプロモーターであり、"}, {"t": 157.01666666666668, "x": "同時に選手でもありました。"}, {"t": 159.18333333333334, "x": "自分で興行を打ち、自分でベルトを巻く。"}, {"t": 162.53333333333333, "x": "AWA世界ヘビー級王座は、\nそういう仕組みの中にあったベルトです。"}, {"t": 167.63333333333333, "x": "そのAWA世界ヘビー級王座に、ボック\nウィンクルは1975年11月、ミネソタ州セント"}, {"t": 175.56666666666666, "x": "ポールでバーン・ガニアを破って就いています。"}, {"t": 178.0, "x": "なお、この日付は資料によって11月\n8日と11月18日に分かれています。"}, {"t": 183.95, "x": "ここでは日にちを断定せず、\n1975年11月とだけ書いておきます。"}, {"t": 189.65, "x": "イメージ映像"}, {"t": 189.65, "x": "その後の変遷を並べます。"}, {"t": 191.56666666666666, "x": "1980年7月18日、イリノイ州シカゴ。"}, {"t": 196.03333333333333, "x": "ボックウィンクルはガニアに\n敗れて王座を失います。"}, {"t": 199.21666666666667, "x": "イメージ映像"}, {"t": 199.21666666666667, "x": "1981年5月19日、ガニアが引退で王座を\n返上したことを受け、2度目の王者になります。"}, {"t": 207.1, "x": "1982年8月29日、\nオットー・ワンツに敗れて失冠。"}, {"t": 212.41666666666666, "x": "1982年10月9日、イリノイ州シカゴ。"}, {"t": 216.65, "x": "イメージ映像"}, {"t": 216.65, "x": "ワンツから王座を奪い返します。"}, {"t": 218.78333333333333, "x": "そして1984年2月23日、\n蔵前国技館で鶴田に敗れました。"}, {"t": 224.9, "x": "ボックウィンクルは全日本\nプロレスに何度も来ています。"}, {"t": 228.1, "x": "1978年の世界最強タッグ決定\nリーグ戦への参加、1982年と1983"}, {"t": 236.05, "x": "イメージ映像"}, {"t": 236.05, "x": "年のタイトル戦、1984年と1985\n年の世界最強タッグ決定リーグ戦。"}, {"t": 242.96666666666667, "x": "現役最後の来日は1987年でした。"}, {"t": 246.65, "x": "2015年11月14日、\nアルツハイマー病により80歳で亡くなっています。"}, {"t": 252.61666666666667, "x": "次に、挑戦した側の記録です。"}, {"t": 255.3, "x": "ジャンボ鶴田の本名は鶴田友美といいます。"}, {"t": 258.1666666666667, "x": "1951年3月25日、山梨県東山梨郡牧丘町、\n現在の山梨市の生まれです。"}, {"t": 266.6, "x": "中央大学法学部政治学科に進みます。"}, {"t": 269.6666666666667, "x": "ただし最初はレスリングの\n選手ではありませんでした。"}, {"t": 272.81666666666666, "x": "大学1年まではバスケットボールの選手でした。"}, {"t": 276.01666666666665, "x": "その後バスケットボール部を退部し、レスリング\n部への入部を希望しましたが、断られています。"}, {"t": 282.56666666666666, "x": "そこで自衛隊体育学校で練習を始めました。"}, {"t": 285.93333333333334, "x": "練習を始めてから1年半で、鶴田は全日本選手権の\nフリースタイルとグレコローマンスタイルの"}, {"t": 292.23333333333335, "x": "100キロ超級を両方で制しています。"}, {"t": 294.75, "x": "1971年と1972年の2年連続でした。"}, {"t": 299.4, "x": "大学4年になってから、中央大学\nレスリング部に入部しています。"}, {"t": 304.0833333333333, "x": "1972年、ミュンヘン\nオリンピックに出場します。"}, {"t": 308.55, "x": "種目はレスリングのグレコローマン\nスタイル100キロ以上級。"}, {"t": 312.1, "x": "成績は2戦2敗でした。"}, {"t": 314.03333333333336, "x": "オリンピックが終わったその年、\n1972年10月31日に全日本"}, {"t": 319.75, "x": "プロレス入団の記者会見が開かれます。"}, {"t": 322.28333333333336, "x": "全日本プロレスの旗揚げ戦から\n9日後のことでした。"}, {"t": 325.75, "x": "この会見で鶴田はこう話しています。"}, {"t": 328.25, "x": "「全日本プロレスが一番\n適した会社かと思いまして」"}, {"t": 331.6333333333333, "x": "この言葉が「全日本プロレスに就職します」と\nいう形で報じられました。"}, {"t": 336.01666666666665, "x": "デビュー戦は1973年3月24日、\nアメリカ・テキサス州アマリロです。"}, {"t": 342.2, "x": "日本でのデビューは同じ年の10\n月6日、後楽園ホールでした。"}, {"t": 346.78333333333336, "x": "そして1983年8月31日、蔵前国技館。"}, {"t": 352.0, "x": "鶴田はブルーザー・ブロディを破り、\nインターナショナル・ヘビー級王座の"}, {"t": 356.3333333333333, "x": "第14代王者になります。"}, {"t": 358.1166666666667, "x": "この日の蔵前国技館は、テリー・ファンクの\n引退試合が組まれた日でもありました。"}, {"t": 363.35, "x": "13,600人が入ったと記録されています。"}, {"t": 366.71666666666664, "x": "鶴田は、この1983年8月\n31日に獲ったベルトを持って、"}, {"t": 372.26666666666665, "x": "半年後に同じ会場へ立つことになります。"}, {"t": 375.26666666666665, "x": "ここからが1984年2月23日の記録です。"}, {"t": 379.4166666666667, "x": "その前に、ひとつ付け加えておきます。"}, {"t": 382.3, "x": "ボックウィンクルは1983年にも\n来日し、鶴田を相手にAWA世界"}, {"t": 388.3, "x": "ヘビー級王座の防衛戦を行っています。"}, {"t": 391.0, "x": "イメージ映像"}, {"t": 391.0, "x": "つまり1984年2月23日は、\n鶴田にとって初めての挑戦ではありませんでした。"}, {"t": 397.76666666666665, "x": "では、この試合のルールから見ていきます。"}, {"t": 400.75, "x": "この試合は、場外のカウントを\n20とする特別ルールで行われました。"}, {"t": 405.6666666666667, "x": "そのうえで、反則やリングアウトの裁定でも王座が\n移動する、PWFのルールが採用されています。"}, {"t": 413.03333333333336, "x": "海外の団体が持つ世界王座は、反則や\nリングアウトでは動かないのが通例でした。"}, {"t": 418.73333333333335, "x": "挑戦者がフォールを奪うか、ギブアップを奪うか。"}, {"t": 422.21666666666664, "x": "その2つ以外では王座が\n移らない、という決まりです。"}, {"t": 426.03333333333336, "x": "この日はその条件が外されていたことになります。"}, {"t": 429.0833333333333, "x": "特別レフェリーはテリー・ファンク。"}, {"t": 430.95, "x": "1983年8月31日に同じ会場で\n引退試合を行った選手が、半年後に"}, {"t": 438.0, "x": "レフェリーとしてリングに立ちました。"}, {"t": 439.78333333333336, "x": "イメージ映像"}, {"t": 439.78333333333336, "x": "決着は32分0秒。"}, {"t": 441.85, "x": "鶴田のバックドロップ・ホールドでした。"}, {"t": 443.95, "x": "ダブルタイトルマッチだったため、\nこの1試合で鶴田はAWA世界ヘビー級王座を"}, {"t": 449.56666666666666, "x": "イメージ映像"}, {"t": 449.56666666666666, "x": "獲得し、同時にインターナショナル・\nヘビー級王座を防衛しています。"}, {"t": 454.3, "x": "この試合は日本テレビの特別番組枠、\n「土曜トップスペシャル」で、"}, {"t": 459.0, "x": "ゴールデンタイムに放送されました。"}, {"t": 461.51666666666665, "x": "なお、この日の観客数については、\n確認できる記録が見つかりませんでした。"}, {"t": 467.25, "x": "数字が取れないものは、この動画では出しません。"}, {"t": 470.55, "x": "会場についても記録があります。"}, {"t": 472.71666666666664, "x": "蔵前国技館は1954年9月に竣工した建物で、\n収容は約11,000人です。"}, {"t": 479.56666666666666, "x": "大相撲の本場所は1984年9月場所を\n最後に両国国技館へ移りました。"}, {"t": 485.35, "x": "イメージ映像"}, {"t": 485.35, "x": "プロレスの興行も1984年8\n月2日が最後になっています。"}, {"t": 490.15, "x": "鶴田がAWA世界ヘビー級王座を獲ったのは、\nこの建物が使われた最後の年でした。"}, {"t": 496.31666666666666, "x": "ベルトを持ったあとの記録に移ります。"}, {"t": 498.68333333333334, "x": "王座を獲った鶴田は、日本と\nアメリカでベルトを持って回ります。"}, {"t": 502.9166666666667, "x": "この期間の防衛回数は16回と記録されています。"}, {"t": 506.5, "x": "そして1984年5月13日、\nミネソタ州セントポール。"}, {"t": 511.75, "x": "鶴田はリック・マーテルに敗れ、\nAWA世界ヘビー級王座を失いました。"}, {"t": 517.2333333333333, "x": "1984年2月23日から5月13日まで。"}, {"t": 521.6833333333333, "x": "保持期間は80日間でした。"}, {"t": 523.9166666666666, "x": "AWA世界ヘビー級王座はその後も動き続けます。"}, {"t": 527.8, "x": "1986年 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
