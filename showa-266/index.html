<script>
const D={"name": "カルガリーの日本人", "file": "266_編集用", "dur": 865.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1974年3月18日、カナダのアルバータ州。"}, {"t": 4.75, "x": "日本人レスラーを乗せた車が、\nハイウェイの途中で動けなくなりました。"}, {"t": 9.4, "x": "レスラーは車の外に出ていました。"}, {"t": 11.633333333333333, "x": "そこへ別の車両がぶつかってきます。"}, {"t": 13.933333333333334, "x": "この事故で、男は右足を\n切断することになりました。"}, {"t": 17.716666666666665, "x": "故郷での凱旋試合は、\n8日後に予定されていました。"}, {"t": 21.666666666666668, "x": "レスラーの名は大剛鉄之助といいます。"}, {"t": 24.3, "x": "大剛は、その凱旋試合の\nリングに上がっていません。"}, {"t": 28.066666666666666, "x": "日本に戻るはずだった男は、\nそのままカナダに残ります。"}, {"t": 32.016666666666666, "x": "そして43年後、カナダの\nカルガリーで亡くなりました。"}, {"t": 35.95, "x": "同じ町にはもう1人の日本人がいました。"}, {"t": 38.61666666666667, "x": "ミスター・ヒトです。"}, {"t": 39.78333333333333, "x": "ヒトもまた晩年に右足を失っています。"}, {"t": 42.6, "x": "亡くなったのは大阪でした。"}, {"t": 44.4, "x": "右足を失った男は、その後の43年間を\nカナダで何をして過ごしたのでしょうか？"}, {"t": 50.56666666666667, "x": "今回は、カナダのカルガリーという町にいた2人の\n日本人を追っていきます。"}, {"t": 55.45, "x": "具体的な日付と、2人を知る人たちの\n証言をもとに辿っていきます。"}, {"t": 60.21666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.71666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.3, "x": "まず、2人がどこから来たのかを\n確かめておきます。"}, {"t": 72.0, "x": "大剛鉄之助は仙台の生まれです。"}, {"t": 74.5, "x": "最初の世界は大相撲でした。"}, {"t": 76.63333333333334, "x": "1966年に、土俵を離れています。"}, {"t": 80.4, "x": "同じ年に東京プロレスへ入門しました。"}, {"t": 83.2, "x": "翌1967年には国際プロレスに移っています。"}, {"t": 87.25, "x": "ミスター・ヒトの本名は安達勝治です。"}, {"t": 89.71666666666667, "x": "こちらは大阪の生まれです。"}, {"t": 91.55, "x": "やはり大相撲の出身でした。"}, {"t": 93.65, "x": "入ったのは出羽海部屋です。"}, {"t": 95.68333333333334, "x": "四股名は浪速海といいました。"}, {"t": 97.66666666666667, "x": "最高位は幕下17枚目です。"}, {"t": 100.1, "x": "1967年の春に、\n日本プロレスへ入門しています。"}, {"t": 104.81666666666666, "x": "2人はどちらも相撲からプロレスに入りました。"}, {"t": 107.73333333333333, "x": "ただし入った団体は別々です。"}, {"t": 110.0, "x": "大剛は国際プロレスでした。"}, {"t": 112.06666666666666, "x": "安達は日本プロレスでした。"}, {"t": 113.91666666666667, "x": "大剛が日本を出たのは1970年代の初めです。"}, {"t": 117.88333333333334, "x": "カナダには、プロレスの記事を\n書いてきた記者がいます。"}, {"t": 121.3, "x": "その記者は、大剛の足どりも書いています。"}, {"t": 124.43333333333334, "x": "その記事では、大剛の最初の行き先の\n1つはモントリオールでした。"}, {"t": 129.08333333333334, "x": "そのあと、カルガリーとアメリカの\n中西部でも試合をしています。"}, {"t": 133.35, "x": "カナダで名乗った名前は、\nトーキョー・ジョーでした。"}, {"t": 136.45, "x": "安達が初めて北米に渡ったのは1973年です。"}, {"t": 140.66666666666666, "x": "同じ記者の記事があります。"}, {"t": 142.4, "x": "アメリカの\nセントラル・ステーツという地区での記録です。"}, {"t": 145.48333333333332, "x": "そこで安達は、トーキョー・ジョーを\n名乗っていました。"}, {"t": 148.63333333333333, "x": "カルガリーで名乗った名前が、\nミスター・ヒトです。"}, {"t": 151.81666666666666, "x": "2人の日本人が、別々の土地で\n同じ名前を使っていたことになります。"}, {"t": 156.7, "x": "カルガリーはカナダ西部の町です。"}, {"t": 158.86666666666667, "x": "アルバータ州にあります。"}, {"t": 160.46666666666667, "x": "ここには、\nスタンピード・レスリングという団体がありました。"}, {"t": 164.18333333333334, "x": "率いていたのはスチュ・ハートです。"}, {"t": 166.18333333333334, "x": "スチュ・ハートの練習場は、\n「ダンジョン」と呼ばれていました。"}, {"t": 169.8, "x": "地下牢という意味です。"}, {"t": 171.3, "x": "ここからは、事故の日のことを\n記録に沿って見ていきます。"}, {"t": 174.91666666666666, "x": "1974年3月18日です。"}, {"t": 178.06666666666666, "x": "大剛は、レスブリッジという町で\n試合を終えました。"}, {"t": 181.65, "x": "レスブリッジはカルガリーの南にある町です。"}, {"t": 184.5, "x": "大剛はカルガリーに戻る途中でした。"}, {"t": 186.95, "x": "走っていた車が道を外れて動けなくなります。"}, {"t": 190.08333333333334, "x": "大剛は車を降りていました。"}, {"t": 192.06666666666666, "x": "そこへ別の車両がぶつかってきます。"}, {"t": 194.38333333333333, "x": "この車両が何だったのかは、\n資料によって分かれます。"}, {"t": 198.06666666666666, "x": "カナダの通信社の当時の記事があります。"}, {"t": 200.71666666666667, "x": "そこでは、向こうから来た車が\nスピンしてぶつかったとされています。"}, {"t": 204.98333333333332, "x": "国際プロレスの後輩にアニマル浜口がいます。"}, {"t": 208.06666666666666, "x": "浜口の証言は、これとは違います。"}, {"t": 211.08333333333334, "x": "スリップして倒れたバイクが\nぶつかった、とされています。"}, {"t": 214.81666666666666, "x": "どちらの記録でも、\n大剛はこのとき右足を失いました。"}, {"t": 219.0, "x": "右足はカルガリーの病院で切断されています。"}, {"t": 222.15, "x": "浜口によれば左足も大きなけがを負いました。"}, {"t": 225.21666666666667, "x": "浜口は、事故の直後の大剛に\nついても話しています。"}, {"t": 229.16666666666666, "x": "大剛は、ぶつかってきた相手に\n向かっていこうとしました。"}, {"t": 232.9, "x": "そしてそのまま気を失ったそうです。"}, {"t": 235.26666666666668, "x": "地元の実況アナウンサーも、\n病院で聞いた言葉を伝えています。"}, {"t": 240.06666666666666, "x": "病院の人たちはこう話していたそうです。"}, {"t": 242.83333333333334, "x": "これほど勇敢な人はめったに見たことがない。"}, {"t": 245.48333333333332, "x": "この事故で、レスラーとしての\n大剛は終わりました。"}, {"t": 248.81666666666666, "x": "8日後の凱旋試合は、\n仙台の会場で組まれていました。"}, {"t": 252.98333333333332, "x": "国際プロレスのチャレンジシリーズの一戦です。"}, {"t": 255.85, "x": "大剛はその会場に立っていません。"}, {"t": 258.25, "x": "大剛は木の義足をつけるようになります。"}, {"t": 260.8833333333333, "x": "そして日本には帰りませんでした。"}, {"t": 263.1333333333333, "x": "カナダに残り、国際プロレスの\n北米支部長という役に就きます。"}, {"t": 267.71666666666664, "x": "北米のレスラーを日本に送る役です。"}, {"t": 270.28333333333336, "x": "日本から来る若手の面倒を見る役でもありました。"}, {"t": 273.46666666666664, "x": "その若手の1人がアニマル浜口でした。"}, {"t": 276.06666666666666, "x": "浜口は1976年6月16日に、\n2度目の海外遠征に出ています。"}, {"t": 282.18333333333334, "x": "行き先はカナダでした。"}, {"t": 283.71666666666664, "x": "試合を組んだのは大剛です。"}, {"t": 285.73333333333335, "x": "浜口はカナダで、\n大剛とスパーリングをしています。"}, {"t": 289.46666666666664, "x": "大剛は義足を外していました。"}, {"t": 291.6333333333333, "x": "床に組み合っての練習です。"}, {"t": 293.56666666666666, "x": "浜口は後に、大剛のことを\n「眼力世界一の男」と呼んでいます。"}, {"t": 298.9, "x": "「ナメられたらいかん」という人だった、とも\n話しています。"}, {"t": 302.56666666666666, "x": "この写真は、国際プロレスの\n時代に撮られたものです。"}, {"t": 306.25, "x": "右が大剛鉄之助です。"}, {"t": 308.1333333333333, "x": "浜口がカナダで組んだ相手には、\nミスター・ヒトもいました。"}, {"t": 311.8333333333333, "x": "カナダの記者の記事があります。"}, {"t": 313.7, "x": "浜口はヒトと組んで、カルガリーの\nタッグ王座を取っています。"}, {"t": 317.85, "x": "フロリダとダラスでも、\n2人でベルトを巻きました。"}, {"t": 321.06666666666666, "x": "足を失った大剛が試合を組みます。"}, {"t": 323.68333333333334, "x": "リングではヒトが日本から来た浜口と組みます。"}, {"t": 326.6333333333333, "x": "カナダでの2人の日本人の役割は、\nこうして分かれていました。"}, {"t": 330.85, "x": "ヒトはカルガリーで長く試合を続けました。"}, {"t": 333.5, "x": "カルガリーのインターナショナル・タッグ王座は、\n通算8回です。"}, {"t": 337.68333333333334, "x": "組んだ相手は浜口のほかにも何人もいました。"}, {"t": 340.7, "x": "1981年9月には、\n北米ヘビー級王座も取っています。"}, {"t": 345.73333333333335, "x": "記録には、その試合の相手の名前も残っています。"}, {"t": 349.3666666666667, "x": "ただヒトにも事故がありました。"}, {"t": 351.1333333333333, "x": "1982年に、自動車の事故に遭っています。"}, {"t": 355.1, "x": "この事故のあと試合は少なくなりました。"}, {"t": 357.51666666666665, "x": "ヒトはリングに立つ一方で、\nダンジョンにもいました。"}, {"t": 360.8833333333333, "x": "スチュ・ハートの練習場で、\n若いレスラーを教えていたのです。"}, {"t": 365.05, "x": "教わった1人がスチュ・ハートの息子です。"}, {"t": 367.55, "x": "ブレット・ハート。"}, {"t": 368.6333333333333, "x": "ブレットは地元の新聞にコラムを書いています。"}, {"t": 371.53333333333336, "x": "カルガリー・サンという新聞です。"}, {"t": 373.6333333333333, "x": "その中でブレットはこう書きました。"}, {"t": 375.8333333333333, "x": "ミスター・ヒトがいなければ、\nブレット・ハートはどこにいただろうか。"}, {"t": 379.6666666666667, "x": "2004年にも、ヒトのことを話しています。"}, {"t": 382.7, "x": "父が最も信頼した現場監督の\n1人だ、という言葉です。"}, {"t": 387.1333333333333, "x": "ダンジョンには日本からも若手が来ました。"}, {"t": 389.6166666666667, "x": "カナダの記者の記事には、\n日本の選手の名前も並びます。"}, {"t": 393.5, "x": "ヒトがそこで教えた選手たちです。橋本真也。"}, {"t": 396.95, "x": "佐々木健介。"}, {"t": 398.1166666666667, "x": "獣神サンダー・ライガー。馳浩。"}, {"t": 400.6333333333333, "x": "いずれも、新日本プロレスで\n名前を知られる選手たちです。"}, {"t": 404.6333333333333, "x": "カルガリーで鍛えられた外国人もいました。"}, {"t": 407.26666666666665, "x": "その中から、日本の団体へ渡る選手も出てきます。"}, {"t": 411.01666666666665, "x": "大きな騒ぎになったのは1984年の秋でした。"}, {"t": 414.8666666666667, "x": "この年、スチュ・ハートは\nカルガリーの興行の権利を売りました。"}, {"t": 419.15, "x": "売った先は、アメリカのWWFです。"}, {"t": 422.53333333333336, "x": "多くのレスラーが職を失いました。"}, {"t": 424.81666666666666, "x": "その中に、ダイナマイト・キッドと\nデイビーボーイ・スミスがいました。"}, {"t": 428.95, "x": "2人は、カルガリーを\n主な仕事場にしていた選手です。"}, {"t": 432.68333333333334, "x": "1984年11月13日、\n2人は日本にやって来ます。"}, {"t": 438.03333333333336, "x": "本来は、新日本プロレスの\nタッグリーグ戦に出る予定でした。"}, {"t": 442.3333333333333, "x": "ところが、空港で2人を出迎えたのは\n全日本プロレスの渉外部長です。"}, {"t": 447.4, "x": "成田の空港で、2人が出迎えを\n受ける写真も残っています。"}, {"t": 451.71666666666664, "x": "キッドは、全日本のタッグリーグ戦に\n出ると明かしました。"}, {"t": 455.65, "x": "翌14日、2人は東京のホテルで\n移籍の事情を説明しました。"}, {"t": 460.48333333333335, "x": "その席にいたのがミスター・ヒトです。"}, {"t": 462.68333333333334, "x": "この移籍を仕掛けたのは\nヒトだ、と言われていました。"}, {"t": 466.0, "x": "会見でヒトは、新日本プロレスへの\n不満を口にしています。"}, {"t": 470.26666666666665, "x": "1984年11月、東京のキャピトル東急ホテルで\n撮られた写真が残っています。"}, {"t": 476.9, "x": "右に写っているのがヒトです。"}, {"t": 4   if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
