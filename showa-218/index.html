<script>
const D={"name": "218", "file": "218_編集用", "dur": 872.05, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1968年1月3日、東京の日大講堂。"}, {"t": 4.733333333333333, "x": "この日、ある団体のテレビ中継が始まりました。"}, {"t": 8.2, "x": "番組名は『TWWAプロレス中継』。"}, {"t": 11.466666666666667, "x": "放送はTBSの全国ネットです。"}, {"t": 14.1, "x": "イメージ映像"}, {"t": 14.1, "x": "メインイベントに組まれたのはルー・テーズが持つ\nTWWA世界ヘビー級王座への挑戦試合でした。"}, {"t": 20.55, "x": "挑んだのは、その団体が新しいエースとして\n売り出そうとしていた25歳の選手です。"}, {"t": 26.333333333333332, "x": "イメージ映像"}, {"t": 26.333333333333332, "x": "名前を、グレート草津といいます。"}, {"t": 28.933333333333334, "x": "イメージ映像"}, {"t": 28.933333333333334, "x": "試合は3本勝負でした。"}, {"t": 30.933333333333334, "x": "1本目、草津はテーズのバックドロップを\n受けて後頭部を打ち、失神します。"}, {"t": 36.666666666666664, "x": "2本目は放棄されました。"}, {"t": 38.45, "x": "全国に流れた中継の第1回は、\nそこで終わっています。"}, {"t": 42.56666666666667, "x": "この団体が会社として消えるのは\n13年8か月後の1981年9月30日です。"}, {"t": 49.0, "x": "設立から数えれば14年11か月の歴史でした。"}, {"t": 52.583333333333336, "x": "その終わり方までが、\nこの1日で決まってしまった。"}, {"t": 56.2, "x": "イメージ映像"}, {"t": 56.2, "x": "1968年1月3日の一戦は、\n長くそう語られてきた試合です。"}, {"t": 61.85, "x": "今回は、この日に何が起きたのかを、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 67.76666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 70.26666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 75.83333333333333, "x": "まず、この団体がテレビを\n持つまでを確認しておきます。"}, {"t": 79.88333333333334, "x": "国際プロレスの設立は1966年10月5日。"}, {"t": 84.08333333333333, "x": "設立したのは日本プロレスを\n退社した吉原功でした。"}, {"t": 87.86666666666666, "x": "旗揚げ戦は1967年1月5日の\n大阪府立体育館です。"}, {"t": 93.08333333333333, "x": "ただし、この旗揚げの時点では\n放映契約がありませんでした。"}, {"t": 97.58333333333333, "x": "イメージ映像"}, {"t": 97.58333333333333, "x": "放送が無いということが、\nどう出たのかも記録に残っています。"}, {"t": 101.71666666666667, "x": "1967年8月14日の大阪です。"}, {"t": 105.4, "x": "同じ日に日本プロレスは大阪球場で、\n国際プロレスは大阪府立体育館で"}, {"t": 110.85, "x": "興行を打ちました。"}, {"t": 112.06666666666666, "x": "のちに大阪夏の陣と呼ばれる興行戦争です。"}, {"t": 115.36666666666666, "x": "先に開催を発表していたのは\n国際プロレスのほうでした。"}, {"t": 119.18333333333334, "x": "日本プロレスは宣伝に飛行機から\nビラを撒く作戦まで使っています。"}, {"t": 123.45, "x": "結果は日本プロレスが2万人。"}, {"t": 125.63333333333334, "x": "国際プロレスは4200人です。"}, {"t": 128.16666666666666, "x": "同じ日の同じ街で5倍近い差がつきました。"}, {"t": 131.0, "x": "イメージ映像"}, {"t": 131.0, "x": "そこでテレビです。"}, {"t": 132.21666666666667, "x": "TBSは1967年1月に\n国際プロレスの信用調査を開始しました。"}, {"t": 138.03333333333333, "x": "そして同年2月に、定期放送に\n値する団体であると結論づけています。"}, {"t": 143.3, "x": "最終的にはフジテレビも\nゴーサインを出しましたが、"}, {"t": 146.43333333333334, "x": "吉原はTBSを選びました。"}, {"t": 149.08333333333334, "x": "放映契約が結ばれたのは\n1967年9月11日です。"}, {"t": 153.86666666666667, "x": "イメージ映像"}, {"t": 153.86666666666667, "x": "資金の面でも動きがありました。"}, {"t": 156.06666666666666, "x": "吉原は早稲田大学時代の友人の仲介で広島の\n乳業会社の社長に株を譲渡し、融資を仰ぎます。"}, {"t": 163.4, "x": "この社長が国際プロレスの\n新しいオーナーになりました。"}, {"t": 166.86666666666667, "x": "1967年11月7日、TBSが\n全国中継開始の記者会見を行います。"}, {"t": 173.76666666666668, "x": "イメージ映像"}, {"t": 173.76666666666668, "x": "発表されたのは、来年1月からの中継開始でした。"}, {"t": 177.81666666666666, "x": "同年12月22日、\nTBS側がもう一度会見を開きます。"}, {"t": 183.01666666666668, "x": "ここで発表されたのは、番組名と団体名を\n『TBSプロレス』とするという内容でした。"}, {"t": 189.01666666666668, "x": "イメージ映像"}, {"t": 189.01666666666668, "x": "団体の名前そのものをテレビ局の\n名前に変えたことになります。"}, {"t": 192.9, "x": "1968年1月、\n国際プロレスは『TBSプロレス』と"}, {"t": 197.83333333333334, "x": "改称して第1弾シリーズを開幕しました。"}, {"t": 200.61666666666667, "x": "イメージ映像"}, {"t": 200.61666666666667, "x": "外国人選手も揃えられています。"}, {"t": 203.03333333333333, "x": "ルー・テーズ。"}, {"t": 203.88333333333333, "x": "ダニー・ホッジ。"}, {"t": 204.86666666666667, "x": "ハンス・シュミット。"}, {"t": 206.0, "x": "そして新人のグレート草津が\nエース候補に抜擢されました。"}, {"t": 209.71666666666667, "x": "抜擢を決めたのは放送責任者だった\nTBSの運動部副部長です。"}, {"t": 214.41666666666666, "x": "ここで、そのグレート草津という人物を\n確認しておきます。"}, {"t": 218.58333333333334, "x": "本名は草津正武。"}, {"t": 220.3, "x": "1942年2月13日の生まれです。"}, {"t": 223.73333333333332, "x": "イメージ映像"}, {"t": 223.73333333333332, "x": "プロレスに来る前はラグビーの選手でした。"}, {"t": 226.33333333333334, "x": "熊本工業高校から八幡製鐵へ進み、\nポジションはロック。"}, {"t": 230.83333333333334, "x": "社会人時代の体格は189センチ、93キロ。"}, {"t": 235.45, "x": "イメージ映像"}, {"t": 235.45, "x": "当時の日本のラグビーでは規格外の大きさです。"}, {"t": 238.58333333333334, "x": "八幡製鐵の黄金時代を支えた1人で、\n日本代表としてのキャップも持っています。"}, {"t": 244.15, "x": "プロレスに転じたのは1965年7月30日の\n日本プロレス入団です。"}, {"t": 249.7, "x": "出身が熊本だったことから、\n豊登が加藤清正にあやかって草津清正という"}, {"t": 255.26666666666668, "x": "リングネームを与えました。"}, {"t": 256.75, "x": "付け人として付いたのはジャイアント馬場です。"}, {"t": 259.3333333333333, "x": "デビューは1966年3月21日でした。"}, {"t": 263.21666666666664, "x": "イメージ映像"}, {"t": 263.21666666666664, "x": "ここははっきりさせておきたいところです。"}, {"t": 265.65, "x": "草津のデビュー戦の相手はテーズではありません。"}, {"t": 268.51666666666665, "x": "デビューは1966年3月の\n日本プロレスのリングです。"}, {"t": 272.85, "x": "その年のうちに草津は日本プロレスを\n退団し、吉原とともに国際プロレスの"}, {"t": 278.35, "x": "旗揚げに加わりました。"}, {"t": 279.8, "x": "同年12月からは北米へ渡っています。"}, {"t": 282.7, "x": "つまり1968年1月3日の時点で、\n草津はプロレス入りから2年半足らずでした。"}, {"t": 289.3333333333333, "x": "イメージ映像"}, {"t": 289.3333333333333, "x": "しかも海外から戻ったばかりで、\n国内での試合の実績はほとんどありません。"}, {"t": 294.5833333333333, "x": "その選手が中継の第1回のメインで\n世界王座に挑むことになります。"}, {"t": 299.03333333333336, "x": "記録には、この起用は新しいスターを\n求めたテレビ局側の強い要望であったとも"}, {"t": 304.43333333333334, "x": "いわれる、と書かれています。"}, {"t": 306.4, "x": "イメージ映像"}, {"t": 306.4, "x": "次に、1968年1月3日という日\nそのものを見ていきます。"}, {"t": 311.53333333333336, "x": "この日、東京では2つの興行がぶつかりました。"}, {"t": 315.1, "x": "日本プロレスは蔵前国技館。"}, {"t": 317.28333333333336, "x": "TBSプロレスは日大講堂です。"}, {"t": 319.85, "x": "2つの会場は隅田川をはさんだ位置にありました。"}, {"t": 323.1, "x": "そのためこの日は隅田川の対決、\nあるいは隅田川決戦と呼ばれています。"}, {"t": 328.4, "x": "イメージ映像"}, {"t": 328.4, "x": "日本プロレスはもともと1月4日に\n岡山でシリーズを開幕させる予定でした。"}, {"t": 333.4, "x": "ところが日大講堂の大会が\n開かれることを聞きつけ、割増の"}, {"t": 337.8833333333333, "x": "使用料を払って蔵前に変更しています。"}, {"t": 340.55, "x": "イメージ映像"}, {"t": 340.55, "x": "カードも見ておきます。"}, {"t": 342.0, "x": "日本プロレスのメインはジャイアント馬場と\nクラッシャー・リソワスキーの"}, {"t": 345.6166666666667, "x": "インターナショナル・ヘビー級王座戦でした。"}, {"t": 348.03333333333336, "x": "当日は水曜日でしたが、\n日本テレビは午後5時30分から"}, {"t": 352.28333333333336, "x": "1時間の特別番組枠で中継しています。"}, {"t": 355.26666666666665, "x": "TBSプロレスのメインはテーズに\n草津が挑むTWWA世界ヘビー級王座戦。"}, {"t": 361.0, "x": "こちらは午後7時からの\n放送開始に合わせて組まれました。"}, {"t": 364.56666666666666, "x": "イメージ映像"}, {"t": 364.56666666666666, "x": "挑む相手のことも確認しておきます。"}, {"t": 367.0, "x": "TWWAという組織は、\n国際プロレスの外国人招聘を任された"}, {"t": 372.4166666666667, "x": "ブッカーが設立したものでした。"}, {"t": 374.31666666666666, "x": "代表に据えられたのはカナダの\nトロント地区のプロモーターです。"}, {"t": 378.0, "x": "テーズはその初代王者に認定されています。"}, {"t": 380.85, "x": "認定の時期は1967年6月と記録されています。"}, {"t": 385.0833333333333, "x": "イメージ映像"}, {"t": 385.0833333333333, "x": "そして試合です。"}, {"t": 386.35, "x": "3本勝負の1本目、\nテーズのバックドロップが出ます。"}, {"t": 390.25, "x": "イメージ映像"}, {"t": 390.25, "x": "草津は後頭部を打ち、失神しました。"}, {"t": 393.35, "x": "2本目は放棄され、テーズが防衛に成功します。"}, {"t": 397.1666666666667, "x": "新しいエースを1試合で作るという\nTBSの構想は、この日に崩れました。"}, {"t": 402.65, "x": "イメージ映像"}, {"t": 402.65, "x": "なぜ1本も許されなかったのか。"}, {"t": 404.81666666666666, "x": "この点についてはテーズ自身が\n後年に語った言葉が残っています。"}, {"t": 409.1333333333333, "x": "テーズはこう語っていました。"}, {"t": 410.93333333333334, "x": "通常3本勝負の試合なら1本は\n相手選手に花を持たせてやる物だけど、"}, {"t": 415.8333333333333, "x": "草津はまだまだグリーンボーイに\n毛が生えた程度の選手だからね。"}, {"t": 419.95, "x": "全米で未だにメインイベントを取っている私が、\nそんな駆け出しの選手に1本でも"}, {"t": 425.23333333333335, "x": "許すだなんて冗談じゃないよ。"}, {"t": 427.0, "x": "イメージ映像"}, {"t": 427.0, "x": "テーズ側の証言によれば、放送していた\nTBSから草津に花を持たせることを要求され、"}, {"t": 433.06666666666666, "x": "それに憤慨して返り討ちにしたということです。"}, {"t": 436.3333333333333, "x": "あくまでテーズの側から見た説明であり、当時の\n報道にそう書かれていたわけではありません。"}, {"t": 442.15, "x": "ただし、その言葉を\n裏づけるような日程も残っています。"}, {"t": 446.26666666666665, "x": "草津戦のあと、テーズはTWWA選手権をかけて\nサンダー杉山と豊登に防衛戦を行いました。"}, {"t": 453.75, "x": "イメージ映像"}, {"t": 453.75, "x": "この2人にはいずれも\n3本勝負の1本を許しています。"}, {"t": 457.35, "x": "テーズはこの点についても、\n杉山や豊登と草津にはそれだけ実力の"}, {"t": 462.3, "x": "差があったよね、と述べています。"}, {"t": 464.55, "x": "イメージ映像"}, {"t": 464.55, "x": "売り出し方そのものへの\n批判も活字で残っています。"}, {"t": 467.8, "x": "新間寿の記事には、プロレスのスターなど一夜で\n作れるというTBSのプロデューサーの"}, {"t": 473.5, "x": "考えは甘く、グレート草津の売り出し方などは\n完全にTBSの失敗であった、という趣旨の"}, {"t": 480.43333333333334, "x": "批判が書かれています。"}, {"t": 481.78333333333336, "x": "ここから先の1か const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
