 {"t": 616.0666666666667, "i": 183}, {"t": 619.6166666666667, "i": 184}, {"t": 624.25, "i": 185}, {"t": 629.0833333333334, "i": 186}, {"t": 633.0, "i": 187}, {"t": 637.3666666666667, "i": 188}, {"t": 638.7, "i": 189}, {"t": 641.65, "i": 190}, {"t": 646.5333333333333, "i": 191}, {"t": 653.0333333333333, "i": 192}, {"t": 654.8333333333334, "i": 193}, {"t": 657.0, "i": 194}, {"t": 660.2666666666667, "i": 195}, {"t": 662.0666666666667, "i": 196}, {"t": 663.5666666666667, "i": 197}, {"t": 665.0666666666667, "i": 198}, {"t": 666.2333333333333, "i": 199}, {"t": 672.4833333333333, "i": 200}, {"t": 678.5, "i": 201}, {"t": 681.5333333333333, "i": 202}, {"t": 685.4, "i": 203}, {"t": 688.3666666666667, "i": 204}, {"t": 692.2166666666667, "i": 205}, {"t": 696.6333333333333, "i": 206}, {"t": 702.7833333333333, "i": 207}, {"t": 704.1833333333333, "i": 208}, {"t": 708.85, "i": 209}, {"t": 711.1833333333333, "i": 210}, {"t": 715.8166666666667, "i": 211}, {"t": 718.9333333333333, "i": 212}, {"t": 726.3, "i": 213}, {"t": 731.15, "i": 214}, {"t": 736.5166666666667, "i": 215}, {"t": 739.3, "i": 216}, {"t": 742.65, "i": 217}, {"t": 748.6333333333333, "i": 218}], "subs": [{"t": 0.0, "x": "1990年5月14日、東京体育館。"}, {"t": 4.316666666666666, "x": "全日本プロレスのタッグマッチが\n行われていました。"}, {"t": 7.516666666666667, "x": "タイガーマスクと川田利明の組。"}, {"t": 9.8, "x": "相手は、谷津嘉章とサムソン冬木の組です。"}, {"t": 13.4, "x": "カードとしては、その日の\nメインではありません。"}, {"t": 16.466666666666665, "x": "シリーズの途中にある、普通の試合でした。"}, {"t": 19.716666666666665, "x": "その試合の最中に、タイガーマスクが\nパートナーの川田を呼び寄せます。"}, {"t": 24.616666666666667, "x": "そして、自分のマスクの\n紐を外すように言いました。"}, {"t": 28.25, "x": "紐が解かれ、タイガーマスクは\n自分の手でマスクを脱ぎました。"}, {"t": 32.35, "x": "そして、そのマスクを客席に投げ入れています。"}, {"t": 35.68333333333333, "x": "リングに置いたのではありません。"}, {"t": 37.55, "x": "客のほうへ投げました。"}, {"t": 39.06666666666667, "x": "そのまま素顔で試合を続け、\n勝負を終えています。"}, {"t": 42.78333333333333, "x": "会場は、一瞬何が起きたのか\n分からない状態になりました。"}, {"t": 47.03333333333333, "x": "実況の声も、そのまま驚きの声になっています。"}, {"t": 50.733333333333334, "x": "マスクの下から出てきたのは、\n27歳の三沢光晴でした。"}, {"t": 55.0, "x": "6年間、その名前でリングに\n上がっていなかった選手です。"}, {"t": 59.166666666666664, "x": "今回は、2代目タイガーマスクがマスクを\n脱いだ1990年5月14日に何が"}, {"t": 65.01666666666667, "x": "起きていたのかを、具体的な日付と\n数字をもとに辿っていきます。"}, {"t": 69.13333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 71.63333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 77.21666666666667, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 81.01666666666667, "x": "三沢光晴、1962年6月18日の生まれ。"}, {"t": 85.65, "x": "高校時代はアマチュアレスリングの\n選手で、全国大会で結果を出しています。"}, {"t": 90.83333333333333, "x": "全日本プロレスに入門したのは、\n1981年3月27日。"}, {"t": 96.36666666666666, "x": "18歳です。"}, {"t": 97.6, "x": "デビュー戦は同じ年の\n1981年8月21日でした。"}, {"t": 102.4, "x": "場所は、浦和競馬場の正門前の駐車場。"}, {"t": 105.98333333333333, "x": "相手は越中詩郎です。"}, {"t": 107.75, "x": "体育館ですらありません。"}, {"t": 109.55, "x": "駐車場に組んだリングで、\n若手同士がやる試合です。"}, {"t": 113.46666666666667, "x": "これがスタートでした。"}, {"t": 114.81666666666666, "x": "そこから3年、三沢は前座の\n選手として過ごします。"}, {"t": 118.86666666666666, "x": "転機は1984年に来ました。"}, {"t": 121.65, "x": "ただし、その転機は本人が\n望んだ形ではありません。"}, {"t": 125.76666666666667, "x": "このころ、新日本プロレスでは\n初代タイガーマスクの佐山聡が引退していました。"}, {"t": 131.13333333333333, "x": "初代タイガーマスクがどれだけの\n存在だったかは、数字よりも影響で分かります。"}, {"t": 136.4, "x": "1981年4月23日に\n蔵前国技館でデビューし、"}, {"t": 141.05, "x": "それまで前座扱いだったジュニアヘビー級の\n試合を、興行の目玉に変えました。"}, {"t": 146.75, "x": "子どもがプロレスを見るようになり、\nアニメと現実が同じ名前でつながった。"}, {"t": 151.73333333333332, "x": "そして1983年8月、人気が最も\n高い時期に、自分から辞めています。"}, {"t": 158.33333333333334, "x": "タイガーマスクという名前は、\nそういう名前でした。"}, {"t": 161.8, "x": "アニメと漫画から来た、日本で最も\n知名度のある覆面レスラーの名前です。"}, {"t": 166.91666666666666, "x": "そのキャラクターを、今度は\n全日本プロレスが引き継ぐことになりました。"}, {"t": 171.41666666666666, "x": "名前だけを別の団体が使う、という形です。"}, {"t": 175.03333333333333, "x": "そして、その中身に選ばれたのが三沢でした。"}, {"t": 178.4, "x": "まだ22歳、前座の若手です。"}, {"t": 181.11666666666667, "x": "1984年7月22日、三沢は\n海外から極秘に帰国します。"}, {"t": 186.93333333333334, "x": "正体を悟られないための帰国でした。"}, {"t": 189.43333333333334, "x": "そして1984年8月26日、田園コロシアム。"}, {"t": 194.7, "x": "2代目タイガーマスクとしてデビューします。"}, {"t": 197.23333333333332, "x": "相手はラ・フィエラでした。"}, {"t": 198.8, "x": "ここから6年間、三沢光晴と\nいう名前はリングから消えます。"}, {"t": 203.41666666666666, "x": "2代目タイガーマスクの\n立場は、はっきりしていました。"}, {"t": 206.96666666666667, "x": "初代がやっていたような空中殺法をやり、\nジュニアヘビー級の試合で会場を沸かせる。"}, {"t": 212.8, "x": "それが求められた役割です。"}, {"t": 214.78333333333333, "x": "問題は、比べられる相手が\n初代タイガーマスクだったことです。"}, {"t": 218.91666666666666, "x": "初代は、当時のプロレスの\n常識を変えた選手でした。"}, {"t": 222.83333333333334, "x": "どれだけ良い試合をしても、\n「初代とは違う」と言われます。"}, {"t": 226.61666666666667, "x": "それは、努力でどうにかなる\n比較ではありません。"}, {"t": 229.9, "x": "さらに、体の問題もありました。"}, {"t": 232.63333333333333, "x": "三沢はもともとアマチュアレスリング出身です。"}, {"t": 235.53333333333333, "x": "組んで投げる形が体に入っている\n選手で、体格もジュニアヘビー級に長く"}, {"t": 240.7, "x": "収まるものではありませんでした。"}, {"t": 242.55, "x": "年齢とともに体は大きくなります。"}, {"t": 245.01666666666668, "x": "大きくなればなるほど、\nタイガーマスクとして求められる軽い"}, {"t": 248.76666666666668, "x": "動きとは合わなくなっていきました。"}, {"t": 250.68333333333334, "x": "覆面をかぶった選手は、\nキャラクターに縛られます。"}, {"t": 254.3, "x": "名前が先にあり、その名前に合う\n試合をしなければならない。"}, {"t": 258.45, "x": "自分の得意な形ではなく、名前の\n得意な形をやることになります。"}, {"t": 263.23333333333335, "x": "しかも、その名前は自分のものではありません。"}, {"t": 266.53333333333336, "x": "やめたければ返すしかなく、\n続ける限りは比較され続ける。"}, {"t": 270.53333333333336, "x": "6年間、三沢はその中にいました。"}, {"t": 273.53333333333336, "x": "20代の6年間です。"}, {"t": 275.3333333333333, "x": "プロレスラーにとって、体が一番\n動く時期をそこで使っています。"}, {"t": 279.9, "x": "そして1990年、全日本プロレスに\n大きな穴が空きます。"}, {"t": 284.8666666666667, "x": "同じ年の4月、天龍源一郎が退団しました。"}, {"t": 288.8, "x": "新団体SWSへの移籍です。"}, {"t": 291.48333333333335, "x": "天龍だけでなく、谷津嘉章やサムソン冬木と\nいった選手も、この時期に団体を離れています。"}, {"t": 298.26666666666665, "x": "全日本プロレスに残ったのは、ジャンボ鶴田を\n除けば、若い選手が中心の陣容でした。"}, {"t": 304.81666666666666, "x": "興行を組む立場から見れば、看板が足りません。"}, {"t": 308.3333333333333, "x": "当時の全日本プロレスは、\n日本武道館を満員にできる団体です。"}, {"t": 313.03333333333336, "x": "その武道館のメインに、誰を置くのか。"}, {"t": 316.2, "x": "鶴田1人では、毎回同じ\nカードになってしまいます。"}, {"t": 319.9, "x": "ここで前に出る選手がいなければ、\n団体はそのまま小さくなります。"}, {"t": 324.4, "x": "1990年春の全日本プロレスは、\nそういう場所でした。"}, {"t": 329.0833333333333, "x": "その状態で迎えたのが、\n1990年5月14日の東京体育館でした。"}, {"t": 335.05, "x": "タイガーマスクは、試合中に\n自分でマスクを外しました。"}, {"t": 339.0, "x": "試合後、三沢はこう話しています。"}, {"t": 341.8666666666667, "x": "もう虎のマスクは捨てた。"}, {"t": 343.46666666666664, "x": "素顔の三沢光晴に戻って勝負したい。"}, {"t": 346.3, "x": "天龍さんにも脱いだ方がいいと言われていた。"}, {"t": 348.96666666666664, "x": "ここは重要な部分です。"}, {"t": 350.73333333333335, "x": "この行為は、三沢1人の\n思いつきではありませんでした。"}, {"t": 354.55, "x": "団体を出ていった天龍源一郎から、脱いだほうが\nいいと言われていた、と本人が語っています。"}, {"t": 361.15, "x": "2日後の5月16日、リングネームを本名の\n三沢光晴に戻すことが発表されました。"}, {"t": 367.48333333333335, "x": "同じ16日には愛知の大会で素顔の\nままシングルマッチに出ています。"}, {"t": 371.95, "x": "17日の広島では、小橋建太と\n保持していたアジアタッグ王座の"}, {"t": 376.55, "x": "防衛戦を行い、そのあと王座を返上しました。"}, {"t": 380.1666666666667, "x": "このときの裏話も残っています。"}, {"t": 382.4166666666667, "x": "マスクを脱いだ翌日、17日の\n広島に間に合うようにと、"}, {"t": 386.51666666666665, "x": "新しいマスクの発注が入ったそうです。"}, {"t": 389.46666666666664, "x": "ところが半日ほどして、やはり\n必要ありませんとキャンセルされました。"}, {"t": 394.03333333333336, "x": "つまり、周りはまだ\n半信半疑だったということです。"}, {"t": 397.76666666666665, "x": "明日にはまた被るのではないか。"}, {"t": 399.8, "x": "そう考えた人がいたということになります。"}, {"t": 402.4166666666667, "x": "ここからの動きが早い。"}, {"t": 404.03333333333336, "x": "1990年6月8日、日本武道館。"}, {"t": 407.85, "x": "三沢は、ジャンボ鶴田と\nシングルマッチで対戦します。"}, {"t": 411.53333333333336, "x": "鶴田は、当時の全日本プロレスの\n絶対的なエースでした。"}, {"t": 415.6166666666667, "x": "1972年のミュンヘンオリンピックにレスリングで\n出場し、そのままプロレスに入った選手です。"}, {"t": 422.56666666666666, "x": "体格、体力、技術のどれも\n上で、しかも大きな試合で崩れません。"}, {"t": 428.46666666666664, "x": "若い世代がどれだけ挑んでも、\n勝てない相手として置かれていました。"}, {"t": 432.8666666666667, "x": "天龍でさえ、鶴田を倒しきることを\n団体の物語の中心に置いていたほどです。"}, {"t": 438.4, "x": "その鶴田から、三沢が勝ちました。"}, {"t": 441.01666666666665, "x": "決着は、こういう形でした。"}, {"t": 443.55, "x": "三沢がブレーンバスターを狙い、\n鶴田が逆にブレーンバスターにいく。"}, {"t": 448.03333333333336, "x": "それを空中で切り返した三沢が\nバックドロップを狙うと、"}, {"t": 451.55, "x": "鶴田は体をひねって\nボディープレスで"}, {"t": 454.0, "x": "押し潰しにいきました。"}, {"t": 455.3333333333333, "x": "押さえ込まれた三沢は、\nそこから後転してエビ固め。"}, {"t": 459.03333333333336, "x": "カウント3が入っています。"}, {"t": 460.8833333333333, "x": "技で叩き潰した勝ち方ではありません。"}, {"t": 463.4166666666667, "x": "潰されにいった体勢から、\nそのまま丸め込んだ形です。"}, {"t": 467.35, "x": "これが、下の世代が初めて壁を\n越えた試合として記録されています。"}, {"t": 471.98333333333335, "x": "マスクを脱いでから、25日後のことでした。"}, {"t": 475.1333333333333, "x": "この25日という間隔は、かなり異常です。"}, {"t": 478.6166666666667, "x": "6年間ジュニアの覆面選手だった27歳が、\n素顔に戻って1か月も経たずに団体の"}, {"t": 484.71666666666664, "x": "エースを倒している。"}, {"t": 485.8333333333333, "x": "興行としても、ここまで一気に\n進めるのは危ない賭けでした。"}, {"t": 489.93333333333334, "x": "それでも通ったのは、5月14日の東京体育館で\n客が示した反応があったからだと考えられます。"}, {"t": 496.81666666666666, "x": "マスクを脱いだ選手を、会場が受け入れた。"}, {"t": 499.9, "x": "その手応えがあったから、次を武道館の\nシングルに置けた、という順番です。"}, {"t": 505.48333333333335, "x": "ここから、全日本プロレスは形を変えます。"}, {"t": 508.78333333333336, "x": "三沢光晴、川田利明、小橋建太、田上明。"}, {"t": 513.8833333333333, "x": "のちに四天王と呼ばれる\n4人が興行の中心になり、"}, {"t": 517.2166666666667, "x": "日本人同士の激しい試合で\n客を呼ぶ団体になりました。"}, {"t": 521.3, "x": "1990年代の全日本プロレスは、\nこの形で黄金期を迎えます。"}, {"t": 526.7333333333333, "x": "同時に、その試合は年々\n激しくなっていきました。"}, {"t": 530.4166666666666, "x": "頭から落とす技が当たり前になり、\n受ける側の負担も増えていきます。"}, {"t": 535.2666666666667, "x": "この激しさが、のちに選手の体を壊したと\nいう議論を生むことにもなりました。"}, {"t": 540.3666666666667, "x": "つまり、1990年5月14日に始まったのは\n黄金期であり、同時に消耗の始まりでもあった、と"}, {"t": 548.6833333333333, "x": "いうことです。"}, {"t": 549.4333333333333, "x": "三沢自身の記録も並べておきます。"}, {"t": 551.9333333333333, "x": "1992年8月22日、スタン・ハンセンを\n破って三冠ヘビー級王座を初めて獲得。"}, {"t": 559.1, "x": "1999年5月、ジャイアント馬場の\n死去を受けて全日本プロレスの社長に就任。"}, {"t": 565.6166666666667, "x": "2000年6月13日に退団を発表し、\n同年8月5日にプロレスリング・ノアを"}, {"t": 571.5666666666667, "x": "旗揚げしました。"}, {"t": 572.5833333333334, "x": "そして2009年6月13日、\n広島県立総合体育館の試合中に倒れ、"}, {"t": 578.7166666666667, "x": "午後10時10分に亡くなっています。"}, {"t": 581.35, "x": "46歳でした。"}, {"t": 582.8333333333334, "x": "ここまでが、記録に残っている事実です。"}, {"t": 585.8666666666667, "x": "改めて、1990年5月14日と\nいう日を考えてみます。"}, {"t": 590.9, "x": "マスクを脱ぐという行為は、\nプロレスでは特別な意味を持ちます。"}, {"t": 595.1, "x": "覆面レスラーにとって、\nマスクは商品そのものです。"}, {"t": 598.95, "x": "負けてマスクを取られることはあっても、\n自分から捨てることは普通ありません。"}, {"t": 603.6833333333333, "x": "しかも三沢は、興行の\n主役ではありませんでした。"}, {"t": 607.3166666666667, "x": "その日のメインイベントですらない試合の\n途中で、自分の商品を捨てています。"}, {"t": 612.5, "x": "これは、団体の都合だけでは説明がつきません。"}, {"t": 616.0666666666667, "x": "天龍が抜けて人手が\n足りないから素顔に戻す、と"}, {"t": 619.6166666666667, "x": "いうだけなら、興行の大きな場面で\n発表する形にもできたはずです。"}, {"t": 624.25, "x": "そうしなかったということは、この行為に\n別の意味があったということになります。"}, {"t": 629.0833333333334, "x": "6年間、三沢は他人の\n名前で試合をしてきました。"}, {"t": 633.0, "x": "その名前は、日本で最も知られた\n覆面レスラーの名前です。"}, {"t": 637.3666666666667, "x": "知名度はあります。"}, {"t": 638.7, "x": "しかしその知名度は、初代のものでした。"}, {"t": 641.65, "x": "初代と比べられ続ける限り、自分の\n評価は自分のものになりません。"}, {"t": 646.5333333333333, "x": "天龍が抜けて団体の柱が空いたとき、そこに\n入るには、他人の名前のままでは無理だった。"}, {"t": 653.0333333333333, "x": "そう考えることもできます。"}, {"t": 654.8333333333334, "x": "マスクを捨てたのは、\nキャラクターを"}, {"t": 657.0, "x": "降りたということではなく、\n比較の対象から降りたと"}, {"t": 660.2666666666667, "x": "いうことだったのではないでしょうか。"}, {"t": 662.0666666666667, "x": "そして、そう言ったのが\n天龍だったという点も見逃せません。"}, {"t": 666.2333333333333, "x": "天龍は1987年から、全日本プロレスの\n中身を作り替えてきた選手です。"}, {"t": 672.4833333333333, "x": "その天龍が団体を出ていく直前に、次に前へ\n出る人間へ「脱いだほうがいい」と伝えていた。"}, {"t": 678.5, "x": "記録の上では、そういう順番になります。"}, {"t": 681.5333333333333, "x": "結果として、その25日後に\n鶴田を倒しています。"}, {"t": 685.4, "x": "そして9年後には団体の社長になりました。"}, {"t": 688.3666666666667, "x": "もう1つ、この日について\n押さえておきたいことがあります。"}, {"t": 692.2166666666667, "x": "タイガーマスクという名前は、もともと\n漫画とアニメの主人公です。"}, {"t": 696.6333333333333, "x": "そのアニメの続編にあたる作品の最終回では、\n主人公が自らマスクを脱いで正体を"}, {"t": 702.7833333333333, "x": "明かす場面がありました。"}, {"t": 704.1833333333333, "x": "三沢がやったことは、結果として\nその場面と同じ形になっています。"}, {"t": 708.85, "x": "狙ってやったのかどうかは分かりません。"}, {"t": 711.1833333333333, "x": "ただ、日本で最も有名な\n覆面レスラーの物語の終わり方と、"}, {"t": 715.8166666666667, "x": "2代目の終わり方が重なったことは事実です。"}, {"t": 718.9333333333333, "x": "1990年5月14日の東京体育館は、\nシリーズの途中の、何でもない一日でした。"}, {"t": 726.3, "x": "その日に、全日本プロレスの\n1990年代が始まっています。"}, {"t": 731.15, "x": "今回の物語を通して、皆様の中に\n三沢光晴という1人のプロレスラーの"}, {"t": 736.5166666666667, "x": "新 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
