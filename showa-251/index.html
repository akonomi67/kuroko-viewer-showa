<script>
const D={"name": "阿修羅原", "file": "251_編集用", "dur": 852.7833125, "segs": [], "subs": [{"t": 0.0, "x": "「全日本プロレスは昨日付けで\n阿修羅・原を解雇しました」"}, {"t": 3.3666666666666667, "x": "1988年11月19日、ジャイアント馬場は\n記者団の前でこう発表しました。"}, {"t": 9.95, "x": "この日、栃木県の足利市民体育館で、\n世界最強タッグ決定リーグ戦が開幕しました。"}, {"t": 16.966666666666665, "x": "原はその前の年、天龍源一郎と組んで、\nこのリーグ戦を2位で終えています。"}, {"t": 22.916666666666668, "x": "2人は龍原砲と呼ばれていました。"}, {"t": 25.216666666666665, "x": "日本テレビの全日本プロレス中継も、\n番組の冒頭でこの解雇を伝えています。"}, {"t": 30.866666666666667, "x": "開幕の当日に、2人組の\n片方がいなくなったのです。"}, {"t": 34.833333333333336, "x": "天龍の新しいパートナーには、\n天龍同盟の若手だった川田利明が選ばれました。"}, {"t": 40.666666666666664, "x": "元ラグビー日本代表。"}, {"t": 42.38333333333333, "x": "国際プロレスに次期エース候補として迎えられ、\n全日本では天龍とともに人気を支えた男です。"}, {"t": 48.96666666666667, "x": "その男の解雇が、なぜシリーズの開幕の日に、\nテレビで伝えられることになったのでしょうか。"}, {"t": 55.28333333333333, "x": "今回は、阿修羅・原という1人の\nレスラーの歩みを、記録に残る日付と、"}, {"t": 60.85, "x": "本人を知る人たちの言葉で辿っていきます。"}, {"t": 63.95, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.45, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 72.03333333333333, "x": "阿修羅・原は、1947年、\n長崎県に生まれました。"}, {"t": 77.55, "x": "中学と高校では、柔道と相撲に打ち込んでいます。"}, {"t": 81.43333333333334, "x": "ラグビーを始めたのは、\n長崎県立諫早農業高校の2年生のときでした。"}, {"t": 86.96666666666667, "x": "その後、東洋大学を経て近鉄に入社します。"}, {"t": 90.65, "x": "入社からわずか1年後、\n原は日本代表に選ばれました。"}, {"t": 94.73333333333333, "x": "1970年3月22日、\n東京の秩父宮ラグビー場。"}, {"t": 100.05, "x": "ブリティッシュ・コロンビア代表との試合に、\n原は日本代表として出場しています。"}, {"t": 105.4, "x": "当時の体格は、身長182センチ、\n体重87キロと伝えられています。"}, {"t": 111.9, "x": "翌1971年9月には、\nイングランド代表が来日しました。"}, {"t": 117.06666666666666, "x": "9月24日は大阪の近鉄花園ラグビー場、\n9月28日は秩父宮ラグビー場で、"}, {"t": 123.85, "x": "2試合が行われています。"}, {"t": 125.88333333333334, "x": "このとき原は、監督の命令で、\nナンバー8からプロップへ転向しました。"}, {"t": 131.33333333333334, "x": "スクラムの最前列で、\n相手と直接ぶつかり合う位置です。"}, {"t": 135.5, "x": "原は日本代表のプロップとして、\n1976年まで戦い続けました。"}, {"t": 140.93333333333334, "x": "獲得したキャップの数は、\n資料によって17とも16とも伝えられています。"}, {"t": 146.11666666666667, "x": "そして1976年、原は日本人として初めて、\nラグビーの世界選抜のメンバーに選ばれました。"}, {"t": 153.85, "x": "1977年、社会人として仕事との\n両立が求められ、原がラグビーの練習に"}, {"t": 160.63333333333333, "x": "あてられる時間は大きく減っていました。"}, {"t": 162.88333333333333, "x": "この年、原は近鉄を退社します。"}, {"t": 165.85, "x": "30歳でのラグビー引退でした。"}, {"t": 168.21666666666667, "x": "次に選んだのは、プロレスです。"}, {"t": 170.68333333333334, "x": "声をかけたのは、同じラグビー出身の\nプロレスラー、グレート草津でした。"}, {"t": 175.93333333333334, "x": "入門先は国際プロレス。"}, {"t": 177.9, "x": "団体の次期エース候補としての入門でした。"}, {"t": 180.88333333333333, "x": "国際プロレスで原と同じ時期を\n過ごしたのが、アニマル浜口です。"}, {"t": 185.46666666666667, "x": "浜口と原は同じ1947年の生まれでした。"}, {"t": 189.33333333333334, "x": "浜口は、初めて見た原の\n身体能力に驚いたと語っています。"}, {"t": 193.96666666666667, "x": "日本代表のプロップで、\n世界選抜にまで選ばれる。"}, {"t": 197.78333333333333, "x": "当時の日本人選手としては\n考えられないことだった、と"}, {"t": 201.68333333333334, "x": "浜口は振り返っています。"}, {"t": 203.45, "x": "浜口が驚いたのは、原の走る姿でした。"}, {"t": 206.91666666666666, "x": "180センチを超える体が、\n上下に揺れることなく、地面を"}, {"t": 211.75, "x": "滑るように速く走っていたといいます。"}, {"t": 214.08333333333334, "x": "1978年6月29日、大阪府立体育館。"}, {"t": 219.03333333333333, "x": "覆面レスラーとして試合の経験を積んだ後、\n原は素顔で、国際プロレスの"}, {"t": 224.7, "x": "正式なデビュー戦を迎えます。"}, {"t": 226.68333333333334, "x": "相手は寺西勇。"}, {"t": 228.21666666666667, "x": "試合は15分時間切れの引き分けでした。"}, {"t": 231.1, "x": "寺西はのちに、この試合をこう振り返っています。"}, {"t": 234.73333333333332, "x": "「潰してはいけないし、\n甘やかしてもいけないし。"}, {"t": 238.01666666666668, "x": "それなりに苦労した試合」"}, {"t": 239.75, "x": "デビューのわずか4日後、\n原は海外へ出発しました。"}, {"t": 243.55, "x": "向かった先はカナダです。"}, {"t": 245.2, "x": "ファイティング・ハラという\nリングネームで試合に出て、わずか2戦目で"}, {"t": 249.46666666666667, "x": "英連邦ジュニアヘビー級王座を手にしました。"}, {"t": 252.2, "x": "その後は西ドイツを転戦し、\n12月に帰国しています。"}, {"t": 256.43333333333334, "x": "帰国後に開かれた国際プロレスの納会で、\n原は新しいリングネームを贈られます。"}, {"t": 262.05, "x": "名付けたのは、近鉄時代から\n原を応援していた作家でした。"}, {"t": 266.23333333333335, "x": "その名前が、阿修羅・原です。"}, {"t": 268.9, "x": "1979年5月6日、阿修羅・原は\nWWU世界ジュニアヘビー級王座を奪います。"}, {"t": 276.18333333333334, "x": "防衛戦では、ジプシー・ジョー、そして\nダイナマイト・キッドの挑戦を退けました。"}, {"t": 281.85, "x": "シングルマッチでは、\nニック・ボックウィンクル、バーン・ガニア、"}, {"t": 286.0, "x": "ディック・ザ・ブルーザーといった大物との\n対戦も組まれています。"}, {"t": 289.81666666666666, "x": "1980年には新日本プロレスの\nリングに上がり、藤波辰爾が持つ"}, {"t": 295.15, "x": "WWFジュニアヘビー級王座に挑戦しています。"}, {"t": 298.75, "x": "この年の暮れ、原はアメリカへ渡りました。"}, {"t": 301.9166666666667, "x": "ルイジアナ地区などで、\nおよそ100試合をこなしています。"}, {"t": 305.51666666666665, "x": "そして帰国した原は、ジュニアヘビー級から\nヘビー級へ転向しました。"}, {"t": 310.26666666666665, "x": "1981年4月7日、埼玉県大宮市。"}, {"t": 314.6666666666667, "x": "国際プロレスの新しい合宿所が完成し、\nこの日、公開練習が行われました。"}, {"t": 321.1166666666667, "x": "ここで原は、コーナーの上から\n相手を投げ落とす技を見せています。"}, {"t": 325.51666666666665, "x": "4月16日の東京スポーツの紙面は、\nこの新技を5枚の連続写真で載せました。"}, {"t": 331.6, "x": "見出しは「名付けて雪崩式ブレーンバスター」。"}, {"t": 334.18333333333334, "x": "日本で雪崩式ブレーンバスターが\n紹介されたのは、これが初めてでした。"}, {"t": 338.96666666666664, "x": "撮影から戻ったカメラマンは、\n社内で「阿修羅がすごい技やってたよ」と"}, {"t": 343.56666666666666, "x": "話していたといいます。"}, {"t": 344.8666666666667, "x": "1981年5月16日、後楽園ホール。"}, {"t": 349.3833333333333, "x": "原はマイティ井上と組み、\n金網の中のタッグマッチで勝って、"}, {"t": 353.6, "x": "IWA世界タッグ王座を獲得します。"}, {"t": 356.9166666666667, "x": "このころの原は、国際プロレスの\n名物だった金網デスマッチや"}, {"t": 361.1, "x": "チェーン・デスマッチを数多くこなし、\n人気を高めていました。"}, {"t": 365.15, "x": "しかし、国際プロレスに\n残された時間はわずかでした。"}, {"t": 369.1166666666667, "x": "8月8日、北海道の根室市青少年センター。"}, {"t": 373.01666666666665, "x": "原と井上は、同じ金網の\nタッグマッチで王座を守ります。"}, {"t": 377.28333333333336, "x": "これが、国際プロレスで最後の\nタイトルマッチになりました。"}, {"t": 381.1333333333333, "x": "国際プロレスは、この年の\nうちに活動を終えています。"}, {"t": 384.9, "x": "リングを失った原は、プロレスを引退し、\n郷里に帰って実家の農業を"}, {"t": 390.3333333333333, "x": "継ぐ決意を固めようとしていました。"}, {"t": 392.4166666666667, "x": "その話を聞いたのが、\n全日本プロレスのジャイアント馬場です。"}, {"t": 396.6, "x": "馬場はこう言ったと伝えられています。"}, {"t": 398.8333333333333, "x": "「原が田舎に帰るって本当なの？"}, {"t": 401.28333333333336, "x": "やる気あるなら引き止めてくれないかなー。」\n馬場は、原と親しかったプロレス評論家に、"}, {"t": 406.73333333333335, "x": "仲立ちを頼みました。"}, {"t": 408.46666666666664, "x": "ある夜、午前0時を回ったころ、その評論家の\n自宅に馬場から電話がかかってきたといいます。"}, {"t": 415.03333333333336, "x": "馬場が描いた道筋は、まず原がフリーの\n立場で天龍源一郎と戦い、その後に"}, {"t": 421.25, "x": "全日本へ入団する、というものでした。"}, {"t": 424.1666666666667, "x": "1982年1月15日、千葉県の木更津大会。"}, {"t": 429.0833333333333, "x": "新日本プロレスから移ってきた\nスタン・ハンセンの、全日本での"}, {"t": 433.2, "x": "最初の試合の相手が原でした。"}, {"t": 435.25, "x": "試合時間はわずか2分25秒。"}, {"t": 437.75, "x": "ハンセンのラリアットを受けた原は場外へ落ち、\n試合の後、担架で病院へ運ばれています。"}, {"t": 444.18333333333334, "x": "全日本では、マイティ井上と組んで\nアジアタッグ王座を獲得しました。"}, {"t": 448.96666666666664, "x": "原の得意技は、雪崩式ブレーンバスターと、\nヒットマン・ラリアット。"}, {"t": 453.76666666666665, "x": "ラリアットは、あのハンセンから\n身につけた技とされています。"}, {"t": 457.68333333333334, "x": "1987年3月、全日本の\nリングで戦っていた長州力らが、"}, {"t": 463.31666666666666, "x": "新日本プロレスへ戻りました。"}, {"t": 465.56666666666666, "x": "同じ年の5月、天龍源一郎はジャンボ鶴田との\nタッグの解散を発表しました。"}, {"t": 471.45, "x": "1987年6月4日、名古屋。"}, {"t": 475.25, "x": "巡業が休みのこの日、天龍は宿泊先の\nホテルで、原と相談の場を持ちました。"}, {"t": 481.48333333333335, "x": "ここから始まったのが、天龍革命です。"}, {"t": 484.55, "x": "目指したのは、全日本のリングの活性化でした。"}, {"t": 488.01666666666665, "x": "2人のタッグは、龍原砲と呼ばれます。"}, {"t": 491.0, "x": "そこにサムソン冬木と川田利明が加わり、\n天龍同盟ができあがっていきました。"}, {"t": 496.7, "x": "天龍同盟は、地方の会場でも毎試合20分以上の\n全力の試合を続けたといいます。"}, {"t": 503.01666666666665, "x": "1987年8月21日、\n宮城県スポーツセンター。"}, {"t": 508.35, "x": "メインイベントは、\n天龍と原の龍原砲が、ジャンボ鶴田と"}, {"t": 512.8333333333334, "x": "ザ・グレート・カブキに挑む一戦でした。"}, {"t": 514.9666666666667, "x": "試合の途中、ジャンボ鶴田に襲いかかったのは、\nリングに飛び込んできた川田利明でした。"}, {"t": 521.0833333333334, "x": "この乱入で、天龍同盟への注目は\n一気に高まったと伝えられています。"}, {"t": 526.3333333333334, "x": "そして1987年9月、龍原砲は\nPWF世界タッグ王座を奪いました。"}, {"t": 532.8166666666667, "x": "その年の暮れ、世界最強タッグ決定リーグ戦。"}, {"t": 536.6333333333333, "x": "12月2日の大阪府立体育会館では、\nアブドーラ・ザ・ブッチャーの組を相手に、"}, {"t": 542.1833333333333, "x": "メインイベントを戦っています。"}, {"t": 544.4, "x": "12月4日の福岡では、\nジャンボ鶴田と谷津嘉章の組と引き分け。"}, {"t": 549.3, "x": "12月11日の日本武道館では、\nスタン・ハンセンとテリー・ゴディの"}, {"t": 553.8666666666667, "x": "組と両者リングアウトでした。"}, {"t": 555.6166666666667, "x": "龍原砲の勝ち点は14点。"}, {"t": 557.9166666666666, "x": "優勝した鶴田と谷津の組に、わずか\n1点届かず2位でした。"}, {"t": 562.1833333333333, "x": "それでもこの年、2人は\n東京スポーツ新聞社が選ぶプロレス大賞で、"}, {"t": 567.15, "x": "最優秀タッグ賞を受けています。"}, {"t": 569.7166666666667, "x": "のちに天龍は、鶴田とは\n戦うときは全力で行けたが、組むと"}, {"t": 574.3333333333334, "x": "タイミングが合わなかったと語っています。"}, {"t": 576.6166666666667, "x": "そして原という相棒を得て「生き返った」\n「毎日が楽しかった」と振り返っています。"}, {"t": 581.4333333333333, "x": "リングの外の原について、\nアニマル浜口はこんな証言を残しています。"}, {"t": 586.5, "x": "遠征先のホテルでは、冷房を\n強く効かせた部屋で、パンツ一枚で眠っていた。"}, {"t": 592.2, "x": "浜口の妻が浅草で営む店では、\n大きな焼き魚を頭から骨ごと食べた。"}, {"t": 597.8, "x": "酒を飲んでも静かで、暴れることはなかった。"}, {"t": 601.2, "x": "口ひげをたくわえたその姿を、浜口は\n「まるでチャールズ・ブロンソンみたい」と"}, {"t": 606.05, "x": "言い表しています。"}, {"t": 607.2166666666667, "x": "そして「原ちゃんは超人でしたよ」と語りました。"}, {"t": 610.1, "x": "1988年1月28日、岩手県花巻市。"}, {"t": 615.0666666666667, "x": "雪が舞い始めるなか、宿舎の旅館から昼食に\n向かう途中で、天龍は原たち天龍同盟の面々に"}, {"t": 622.1, "x": "声をかけています。「走るぞ！」この日の\n写真には、つららを頭に乗せておどける天龍と、"}, {"t": 628.5166666666667, "x": "それを見て笑う原たちの姿が残っています。"}, {"t": 631.6333333333333, "x": "1988年3月、秋田の大会。"}, {"t": 635.4, "x": "天龍と原は、スタン・ハンセンを前と後ろから\n挟み、延髄斬りを同時に浴びせました。"}, {"t": 641.4666666666667, "x": "ハンセンはこの一撃で失神しています。"}, {"t": 644.1333333333333, "x": "6年前、移籍第1戦で原を2分25秒で\n病院送りにした相手でした。"}, {"t": 649.9166666666666, "x": "そして迎えた、1988年11月19日。"}, {"t": 654.3333333333334, "x": "冒頭でお伝えした、解雇が発表された日です。"}, {"t": 657.8833333333333, "x": "理由について、馬場はこう話しています。"}, {"t": 660.9666666666667, "x": "「生活態度というのが、今後、会社なり多くの\n人たちに迷惑をかけることをやりかねないんでね。"}, {"t": 667.6666666666666, "x": "いい選手ではあったけれど」報道では、\n理由は「私生活の乱れ」と伝えられました。"}, {"t": 672.7333333333333, "x": "7年前、田舎に帰ろうとしていた原を\n引き止めたのも、馬場でした。"}, {"t": 677.9666666666667, "x": "龍原砲が世界最強タッグに出たのは、\n前の年の1987年が最後になりました。"}, {"t": 684.4666666666667, "x": "1990年、天龍は全日本を離れます。"}, {"t": 688.6166666666667, "x": "そして1991年8月、天龍が\n所属した新しい団体、SWSのリングで、"}, {"t": 696.1833333333333, "x": "原はおよそ3年ぶりにプロレスに戻ってきます。"}, {"t": 699.45, "x": "1991年、横浜アリーナで開かれた\nSWS創立1周年の記念大会では、"}, {"t": 706.6166666666667, "x": "天龍と原が並んでリングに立っています。"}, {"t": 709.5333333333333, "x": "SWSが活動を終えた後も、\n原は天龍とともにWARへ移りました。"}, {"t": 715.25, "x": "そこでは新日本プロレスの\n藤波辰爾や長州力とも戦っています。"}, {"t": 719.7833333333333, "x": "国際、全日本、SWS、WAR。"}, {"t": 725.0, "x": "原が上がった団体は4つ。"}, {"t": 726.95, "x": "そのうち全日本、SWS、WARの3つで、\n原の隣には天龍がいました。"}, {"t": 734.5333333333333, "x": "1994年10月29日、\n阿修羅・原は現役を引退します。"}, {"t": 740.3333333333334, "x": "東京スポーツの記事では、\n引退の舞台は後楽園ホールとされています。"}, {"t": 745.2833333333333, "x": "龍原砲が世界最強タッグで優勝することは、\n最後までありませんでした。"}, {"t": 750.4, "x": "天龍自身は、このリーグ戦で3度優勝しています。"}, {"t": 754.35, "x": "1984年と1986年はジャンボ鶴田と、\n1989年はスタン・ハンセンと組んだ年でした。"}, {"t": 762.6666666666666, "x": "引退した原は、故郷の長崎に戻りました。"}, {"t": 766.0, "x": "母校の諫早農業高校で、\nラグビー部の指導にあたっています。"}, {"t": 770.5833333333334, "x": "ひざを痛めて杖をつくようになっていましたが、\n元気な姿を見せていたと伝えられています。"}, {"t": 776.3166666666667, "x": "その後、原は体調を崩しました。"}, {"t": 779.05, "x": "関係者によれば、亡くなる前の3、\n4年ほどは入院していたようだといいます。"}, {"t": 784.8833333333333, "x": "2015年4月28日午前5時15分。"}, {"t": 788.3666666666667, "x": "長崎県雲仙市の病院で、\n阿修羅・原は亡くなりました。"}, {"t": 792.8, "x": "68歳でした。"}, {"t": 794.3333333333334, "x": "心筋梗塞で入院していましたが、\n死因は肺炎と伝えられています。"}, {"t": 799.4, "x": "この日、天龍は会見の前に訃報を聞いていました。"}, {"t": 803.2666666666667, "x": "しかし会見では何も語らず、\n黙って原をしのんだと報じられています。"}, {"t": 808.3333333333334, "x": "天龍はこの年の11月、\n自らも現役を引退しました。"}, {"t": 813.0166666666667, "x": "引退の会見で天龍は、\nあるビールについて語っています。"}, {"t": 817.2, "x": "「俺が原とやりはじめた時に、\n最初に世の中に出たビールだったんですよね」"}, {"t": 822.0, "x": "ラグビーのスクラムの最前列から、\nプロレスのリングへ。"}, {"t": 825.8166666666667, "x": "雪崩式ブレーンバスターを日本で\n初めて見せ、天龍とともに地方の"}, {"t": 830.5, "x": "会場まで全力で戦い続けた阿修羅・原。"}, {"t": 833.4, "x": "テレビで解雇が伝えられた男は、\n3年後、同じ相棒の隣に戻っていました。"}, {"t": 839.1333333333333, "x": "最後までご視聴いただき、\n誠にありがとうございました。"}, {"t": 843.0833333333334, "x": "阿修羅・原という名前を、今日\nあらためて思い出した方がいらっしゃれば、"}, {"t": 847.6666666666666, "x": "チャンネル登録と高評価で\n教えていただけると励みになります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
