<script>
const D={"name": "阿修羅原", "file": "251_編集用", "dur": 875.26665625, "segs": [], "subs": [{"t": 0.0, "x": "「全日本プロレスは昨日付けで\n阿修羅・原を解雇しました」"}, {"t": 3.3833333333333333, "x": "ジャイアント馬場がそう口にしたのは、\n1988年11月19日のことでした。"}, {"t": 9.416666666666666, "x": "ちょうどその日、足利市民体育館で\n世界最強タッグ決定リーグ戦が開幕しています。"}, {"t": 15.583333333333334, "x": "ひとつ前の年、このリーグ戦で\n2位まで勝ち上がったのが、"}, {"t": 19.483333333333334, "x": "天龍源一郎と阿修羅・原でした。"}, {"t": 22.25, "x": "ふたりの呼び名は龍原砲。"}, {"t": 24.066666666666666, "x": "そのかたわれが、開幕の当日にいなくなりました。"}, {"t": 27.7, "x": "日本テレビの中継も、\n番組のはじめにこの解雇を伝えています。"}, {"t": 32.31666666666667, "x": "天龍のとなりには、天龍同盟の\n若手だった川田利明が入りました。"}, {"t": 37.36666666666667, "x": "元ラグビー日本代表。"}, {"t": 39.083333333333336, "x": "国際プロレスに\n次期エース候補として迎えられた男です。"}, {"t": 42.68333333333333, "x": "全日本では天龍とともに人気を支えました。"}, {"t": 45.68333333333333, "x": "その男の解雇は、シリーズの開幕の日でした。"}, {"t": 49.233333333333334, "x": "なぜテレビで\n伝えられることになったのでしょうか。"}, {"t": 51.96666666666667, "x": "今回は阿修羅・原という1人の\nレスラーの歩みを辿ります。"}, {"t": 55.666666666666664, "x": "手がかりは記録に残る日付と、\n本人を知る人たちの言葉です。"}, {"t": 60.083333333333336, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.583333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.16666666666667, "x": "阿修羅・原は1947年、\n長崎県に生まれました。"}, {"t": 73.2, "x": "中学と高校では柔道と相撲に打ち込んでいます。"}, {"t": 76.51666666666667, "x": "ラグビーを始めたのは高校の2年生のときです。"}, {"t": 79.65, "x": "学校は、長崎県立諫早農業高校でした。"}, {"t": 83.75, "x": "その後は東洋大学を経て近鉄に入社します。"}, {"t": 87.06666666666666, "x": "入社からわずか1年後、\n原は日本代表に選ばれました。"}, {"t": 91.15, "x": "1970年3月22日、\n東京の秩父宮ラグビー場。"}, {"t": 96.46666666666667, "x": "相手はブリティッシュ・コロンビア代表。"}, {"t": 98.73333333333333, "x": "原は日本代表として、\nこの試合に出場しています。"}, {"t": 102.63333333333334, "x": "当時の身長は182センチ。"}, {"t": 105.13333333333334, "x": "体重は87キロと伝えられています。"}, {"t": 107.93333333333334, "x": "翌1971年9月には、\nイングランド代表が来日しました。"}, {"t": 113.1, "x": "1試合目は9月24日、\n大阪の近鉄花園ラグビー場です。"}, {"t": 118.1, "x": "2試合目は9月28日、\n秩父宮ラグビー場でした。"}, {"t": 122.53333333333333, "x": "このとき原は監督の命令で、\nナンバー8からプロップへ移りました。"}, {"t": 127.26666666666667, "x": "スクラムの最前列で、\n相手と直接ぶつかり合う位置です。"}, {"t": 131.41666666666666, "x": "原は日本代表のプロップとして、\n1976年まで戦い続けました。"}, {"t": 136.85, "x": "獲得したキャップの数は資料によって違います。"}, {"t": 139.86666666666667, "x": "17とも16とも伝えられています。"}, {"t": 142.38333333333333, "x": "そして1976年。"}, {"t": 144.6, "x": "原は日本人として初めて、ラグビーの\n世界選抜のメンバーに選ばれました。"}, {"t": 149.81666666666666, "x": "1977年になると、仕事との\n両立が求められるようになります。"}, {"t": 155.03333333333333, "x": "ラグビーの練習にあてられる時間は\n大きく減っていました。"}, {"t": 158.5, "x": "この年、原は近鉄を退社します。"}, {"t": 161.48333333333332, "x": "30歳でのラグビー引退でした。"}, {"t": 163.85, "x": "次に選んだのはプロレスです。"}, {"t": 165.8, "x": "声をかけたのはグレート草津。"}, {"t": 167.73333333333332, "x": "同じラグビー出身のプロレスラーでした。"}, {"t": 170.26666666666668, "x": "入門先は国際プロレス。"}, {"t": 172.25, "x": "団体の次期エース候補としての入門でした。"}, {"t": 175.23333333333332, "x": "国際プロレスで同じ時期を\n過ごしたのが、アニマル浜口です。"}, {"t": 179.5, "x": "浜口と原は同じ1947年の生まれでした。"}, {"t": 183.36666666666667, "x": "浜口は初めて見た原の身体能力に\n驚いたと語っています。"}, {"t": 187.51666666666668, "x": "日本代表のプロップで、\n世界選抜にまで選ばれる。"}, {"t": 191.33333333333334, "x": "当時の日本人選手としては\n考えられないことだった。"}, {"t": 194.65, "x": "浜口はそう振り返っています。"}, {"t": 196.81666666666666, "x": "浜口が驚いたのは、原の走る姿でした。"}, {"t": 200.28333333333333, "x": "180センチを超える体が、\n上下に揺れることなく走る。"}, {"t": 204.56666666666666, "x": "地面を滑るように速かったといいます。"}, {"t": 207.08333333333334, "x": "1978年6月29日、大阪府立体育館。"}, {"t": 212.01666666666668, "x": "原はそれまで覆面レスラーとして試合の\n経験を積んでいました。"}, {"t": 216.03333333333333, "x": "この日は素顔です。"}, {"t": 217.4, "x": "正式なデビュー戦を迎えます。"}, {"t": 219.55, "x": "相手は寺西勇。"}, {"t": 221.08333333333334, "x": "試合は15分時間切れの引き分けでした。"}, {"t": 223.96666666666667, "x": "寺西はのちに、この試合をこう振り返っています。"}, {"t": 227.61666666666667, "x": "「潰してはいけないし、\n甘やかしてもいけないし。"}, {"t": 230.88333333333333, "x": "それなりに苦労した試合」"}, {"t": 232.61666666666667, "x": "デビューのわずか4日後、\n原は海外へ出発しました。"}, {"t": 236.43333333333334, "x": "向かった先はカナダです。"}, {"t": 238.08333333333334, "x": "名乗ったリングネームはファイティング・ハラ。"}, {"t": 240.35, "x": "わずか2戦目で、\n英連邦ジュニアヘビー級王座を手にしました。"}, {"t": 244.81666666666666, "x": "その後は西ドイツを転戦し、\n12月に帰国しています。"}, {"t": 249.05, "x": "帰国後には国際プロレスの納会が開かれました。"}, {"t": 252.25, "x": "その席で、原は新しいリングネームを贈られます。"}, {"t": 255.95, "x": "名付けたのは、近鉄時代から\n原を応援していた作家でした。"}, {"t": 260.1333333333333, "x": "その名前が阿修羅・原です。"}, {"t": 262.1166666666667, "x": "1979年5月6日。"}, {"t": 264.76666666666665, "x": "阿修羅・原は\nWWU世界ジュニアヘビー級王座を奪います。"}, {"t": 269.1666666666667, "x": "防衛戦ではジプシー・ジョーの挑戦を退けました。"}, {"t": 272.3666666666667, "x": "ダイナマイト・キッドの挑戦も退けています。"}, {"t": 275.25, "x": "シングルマッチでは大物との\n対戦も組まれています。"}, {"t": 278.48333333333335, "x": "ニック・ボックウィンクルとバーン・ガニア。"}, {"t": 280.6166666666667, "x": "そしてディック・ザ・ブルーザーです。"}, {"t": 282.5, "x": "1980年には新日本プロレスの\nリングに上がりました。"}, {"t": 286.65, "x": "藤波辰爾が持つ\nWWFジュニアヘビー級王座への挑戦です。"}, {"t": 291.31666666666666, "x": "この年の暮れ、原はアメリカへ渡りました。"}, {"t": 294.48333333333335, "x": "ルイジアナ地区などで、\nおよそ100試合をこなしています。"}, {"t": 298.0833333333333, "x": "帰国した原は、ジュニアヘビー級から\nヘビー級へ転向しました。"}, {"t": 302.5, "x": "1981年4月7日、埼玉県大宮市。"}, {"t": 306.9, "x": "国際プロレスの新しい合宿所が完成しました。"}, {"t": 310.2, "x": "この日は公開練習が行われています。"}, {"t": 312.96666666666664, "x": "ここで原は、コーナーの上から\n相手を投げ落とす技を見せました。"}, {"t": 317.2, "x": "4月16日の東京スポーツは、\nこの新技を紙面に載せました。"}, {"t": 322.0, "x": "5枚の連続写真でした。"}, {"t": 323.8666666666667, "x": "見出しは「名付けて雪崩式ブレーンバスター」。"}, {"t": 326.43333333333334, "x": "日本で雪崩式ブレーンバスターが\n紹介されたのは、これが初めてでした。"}, {"t": 331.21666666666664, "x": "撮影から戻ったカメラマンは、\n社内でこう話していたといいます。"}, {"t": 335.6666666666667, "x": "「阿修羅がすごい技やってたよ」"}, {"t": 337.65, "x": "1981年5月16日、後楽園ホール。"}, {"t": 342.15, "x": "原はマイティ井上と組みました。"}, {"t": 344.1333333333333, "x": "金網の中のタッグマッチに勝ち、\nIWA世界タッグ王座を獲得します。"}, {"t": 349.5833333333333, "x": "このころの原は、金網デスマッチを\n数多くこなしていました。"}, {"t": 353.76666666666665, "x": "チェーン・デスマッチも同じです。"}, {"t": 355.68333333333334, "x": "どちらも国際プロレスの名物です。"}, {"t": 358.03333333333336, "x": "原はこうした試合で人気を高めていきました。"}, {"t": 360.93333333333334, "x": "しかし国際プロレスに\n残された時間はわずかでした。"}, {"t": 364.2, "x": "8月8日、北海道の根室市青少年センター。"}, {"t": 368.1, "x": "原と井上は、同じ金網の\nタッグマッチで王座を守ります。"}, {"t": 372.3666666666667, "x": "これが国際プロレスで最後の\nタイトルマッチになりました。"}, {"t": 375.6666666666667, "x": "国際プロレスは、この年の\nうちに活動を終えています。"}, {"t": 379.43333333333334, "x": "リングを失った原は、\nプロレスを引退しようとしていました。"}, {"t": 383.48333333333335, "x": "郷里に帰って、実家の農業を\n継ぐつもりだったのです。"}, {"t": 387.35, "x": "その話を聞いたのが、\n全日本プロレスのジャイアント馬場です。"}, {"t": 391.53333333333336, "x": "馬場はこう言ったと伝えられています。"}, {"t": 393.76666666666665, "x": "「原が田舎に帰るって本当なの？"}, {"t": 396.21666666666664, "x": "やる気あるなら引き止めてくれないかなー。」\n馬場は、原と親しかった"}, {"t": 400.55, "x": "プロレス評論家に仲立ちを頼みました。"}, {"t": 402.8333333333333, "x": "ある夜のことです。"}, {"t": 404.0833333333333, "x": "時計は午前0時を回っていました。"}, {"t": 406.46666666666664, "x": "その評論家の自宅に、馬場から\n電話がかかってきたといいます。"}, {"t": 410.73333333333335, "x": "馬場が描いた道筋はこうでした。"}, {"t": 413.01666666666665, "x": "まず原がフリーの立場で天龍源一郎と戦います。"}, {"t": 416.55, "x": "そして、その後に全日本へ\n入団するというものでした。"}, {"t": 420.4, "x": "1982年1月15日、千葉県の木更津大会。"}, {"t": 425.31666666666666, "x": "この日は、スタン・ハンセンの\n全日本での最初の試合でした。"}, {"t": 429.3, "x": "ハンセンは新日本プロレスから\n移ってきたばかりです。"}, {"t": 432.53333333333336, "x": "その相手が原でした。"}, {"t": 434.1, "x": "試合時間はわずか2分25秒。"}, {"t": 436.6, "x": "原はハンセンのラリアットを\n受けて場外へ落ちました。"}, {"t": 439.78333333333336, "x": "試合の後、担架で病院へ運ばれています。"}, {"t": 443.18333333333334, "x": "全日本でも、原はマイティ井上と組みました。"}, {"t": 446.46666666666664, "x": "2人はアジアタッグ王座を獲得しています。"}, {"t": 449.28333333333336, "x": "原の得意技は2つ。"}, {"t": 450.95, "x": "雪崩式ブレーンバスターと、\nヒットマン・ラリアットです。"}, {"t": 454.53333333333336, "x": "ラリアットは、あのハンセンから\n身につけた技とされています。"}, {"t": 458.45, "x": "1987年3月。"}, {"t": 460.85, "x": "長州力らが新日本プロレスへ戻りました。"}, {"t": 463.78333333333336, "x": "それまでは全日本のリングで\n戦っていた選手たちです。"}, {"t": 467.25, "x": "同じ年の5月、天龍源一郎はジャンボ鶴田との\nタッグの解散を発表しました。"}, {"t": 473.1333333333333, "x": "1987年6月4日、名古屋。"}, {"t": 476.93333333333334, "x": "この日は巡業が休みでした。"}, {"t": 479.0, "x": "天龍は宿泊先のホテルで、\n原と相談の場を持ちました。"}, {"t": 483.1666666666667, "x": "ここから始まったのが天龍革命です。"}, {"t": 485.73333333333335, "x": "目指したのは、全日本のリングの活性化でした。"}, {"t": 489.2, "x": "2人のタッグは龍原砲と呼ばれます。"}, {"t": 491.6666666666667, "x": "そこにサムソン冬木と川田利明が加わりました。"}, {"t": 494.98333333333335, "x": "こうして天龍同盟ができあがっていきます。"}, { const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
