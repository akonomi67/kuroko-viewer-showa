<title>日米レスリングサミット</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;
  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 26px;box-shadow:0 2px 14px rgba(0,0,0,.10)}
#now{margin:0;text-align:center;white-space:pre-wrap;word-break:break-word;font-weight:700;
  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);
  font-size:12px;padding:3px 9px;border-radius:20px;line-height:1.6;letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}
.marks i{position:absolute;top:0;width:1px;height:7px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:48px;flex:none;padding-top:2px}
.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}
  .bar button{padding:9px 11px;font-size:14px}.stage{padding:42px 14px 22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
<div class="wrap">
<h1 id="ttl"></h1>
<div class="stage"><div class="badge" id="bdg"></div>
  <p id="now"></p><p id="nextline"></p></div>
<div class="bar">
  <button class="play" id="pp">▶ 再生</button>
  <button id="pv">◀ 前の字幕</button>
  <button id="nx">次の字幕 ▶</button>
  <button id="sp">等速</button>
  <span class="time" id="tm">0:00 / 0:00</span>
</div>
<input type="range" id="sk" min="0" max="1000" value="0">
<div class="marks" id="mk"></div>
<div class="tabs"><button class="on">字幕</button></div>
<div class="list" id="subs"></div>
<p class="tip">スペース＝再生/停止　←→＝5秒送り　↑↓＝字幕送り。字幕をタップするとそこへ飛びます。</p>
</div>
<audio id="a" src="audio.mp3" preload="auto"></audio>
<script>
const D={"name": "日米レスリングサミット", "file": "230_編集用", "dur": 863.5, "segs": [], "subs": [{"t": 0.0, "x": "1990年4月13日、東京ドーム。"}, {"t": 4.166666666666667, "x": "この日のリングには、\n3つの団体の選手が並びました。"}, {"t": 7.95, "x": "新日本プロレス、全日本プロレス、そして\nアメリカのWWFです。"}, {"t": 13.7, "x": "興行の名前は、日米レスリングサミット。"}, {"t": 16.9, "x": "組まれた試合は12。"}, {"t": 18.45, "x": "出場した選手は36人でした。"}, {"t": 21.116666666666667, "x": "発表された観衆は5万3742人です。"}, {"t": 25.0, "x": "セミファイナルでは、ジャイアント馬場と\nアンドレ・ザ・ジャイアントが"}, {"t": 28.75, "x": "同じ側に立ちました。"}, {"t": 30.083333333333332, "x": "メインイベントは、ハルク・ホーガンと\nスタン・ハンセンの一騎打ちです。"}, {"t": 34.266666666666666, "x": "新日本と全日本とWWFが合同で興行を\n打ったのは、この日が最初でした。"}, {"t": 40.31666666666667, "x": "そして、この日が最後になっています。"}, {"t": 43.03333333333333, "x": "なぜこの3つが、1990年の\n春にだけ同じリングへ乗ったのでしょうか。"}, {"t": 48.46666666666667, "x": "今回はその1日を、確認できた日付と\n数字だけで辿っていきます。"}, {"t": 53.266666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 55.766666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 61.35, "x": "はじめに、混同されやすい別の\n興行を分けておきます。"}, {"t": 65.31666666666666, "x": "1990年2月10日、東京ドーム。"}, {"t": 68.96666666666667, "x": "新日本プロレスの、\n90スーパーファイトin闘強導夢です。"}, {"t": 73.33333333333333, "x": "発表された観衆は6万3900人、\n超満員札止めでした。"}, {"t": 78.38333333333334, "x": "これは日米レスリングサミットの2か月前に\n行われた、まったく別の大会です。"}, {"t": 84.1, "x": "ただし、全日本プロレスの選手が\n新日本のドームに立ったのは、"}, {"t": 88.55, "x": "この2月10日が先でした。"}, {"t": 90.65, "x": "この大会の目玉として予定されていたのは、\nリック・フレアーとグレート・ムタの一戦です。"}, {"t": 96.1, "x": "イメージ映像"}, {"t": 96.1, "x": "ところが、フレアーの派遣は中止になりました。"}, {"t": 99.36666666666666, "x": "背景にあったのは、\nアメリカ側の団体どうしの関係です。"}, {"t": 103.55, "x": "イメージ映像"}, {"t": 103.55, "x": "新日本がWWFと組むことが表に出ました。"}, {"t": 107.05, "x": "これでWCWが心証を害し、\nフレアーを送らなかったと記録されています。"}, {"t": 112.65, "x": "新日本の社長だった坂口征二は、\nこれをWCWのドタキャンと表現しています。"}, {"t": 118.85, "x": "フレアーは、全日本プロレスとの協定の\n対象になっていた選手でもありました。"}, {"t": 124.08333333333333, "x": "当時、新日本と全日本の間には、\n引き抜きを防ぐための協定が結ばれています。"}, {"t": 130.3, "x": "契約している選手を文書ではっきりさせ、\n破った側は年俸の5倍を払うという内容でした。"}, {"t": 137.2, "x": "1980年代の引き抜き合戦で両団体が\n疲弊した末に、こうなっています。"}, {"t": 143.1, "x": "イメージ映像"}, {"t": 143.1, "x": "坂口は馬場に相談しました。"}, {"t": 145.28333333333333, "x": "馬場が出した条件は、1人の選手の交換でした。"}, {"t": 148.98333333333332, "x": "フレアーの代わりにスティーブ・ウィリアムスを\n回す、という内容だったとされています。"}, {"t": 154.28333333333333, "x": "プロレス記者の小佐野景浩は、\nこれを事実上のトレードだったと書いています。"}, {"t": 159.08333333333334, "x": "イメージ映像"}, {"t": 159.08333333333334, "x": "さらに馬場は、ハンセンどころか天龍と\n鶴田も貸す、と言ったと記録されています。"}, {"t": 164.76666666666668, "x": "理由として挙げられたのは、\n坂口の社長就任祝いでした。"}, {"t": 168.93333333333334, "x": "こうして2月10日、全日本から\n5人が新日本のリングに上がります。"}, {"t": 173.7, "x": "ジャンボ鶴田、天龍源一郎、谷津嘉章、\nタイガーマスク、そしてスタン・ハンセンです。"}, {"t": 181.08333333333334, "x": "第7試合は鶴田・谷津組と木村健吾・木戸修組。"}, {"t": 184.55, "x": "15分6秒、鶴田が体固めで取っています。"}, {"t": 188.13333333333333, "x": "第8試合は天龍・タイガーマスク組と\n長州力・ジョージ高野組。"}, {"t": 192.36666666666667, "x": "18分59秒、リングアウトで\n天龍組の勝ちでした。"}, {"t": 196.68333333333334, "x": "ハンセンはIWGPヘビー級選手権で\nビッグバン・ベイダーに挑戦しています。"}, {"t": 202.06666666666666, "x": "こちらは15分47秒、\n両者リングアウトでした。"}, {"t": 206.2, "x": "イメージ映像"}, {"t": 206.2, "x": "この日は、新日本側にも記録の\n残る試合が並んでいます。"}, {"t": 210.48333333333332, "x": "マサ斎藤がラリー・ズビスコを破り、\nAWA世界ヘビー級王座を獲得しました。"}, {"t": 216.48333333333332, "x": "14分29秒、首固めでの戴冠です。"}, {"t": 220.25, "x": "元横綱の北尾光司が、\nこの日デビュー戦を行っています。"}, {"t": 224.36666666666667, "x": "9分58秒、\nクラッシャー・バンバン・ビガロに勝ちました。"}, {"t": 228.46666666666667, "x": "アントニオ猪木の国内復帰戦も組まれています。"}, {"t": 231.58333333333334, "x": "猪木と坂口の組が、橋本真也・\n蝶野正洋組に15分43秒で勝ちました。"}, {"t": 237.68333333333334, "x": "イメージ映像"}, {"t": 237.68333333333334, "x": "猪木が日本のリングに立ったのは、\n1989年5月25日以来のことです。"}, {"t": 243.8, "x": "そして馬場が回した\nスティーブ・ウィリアムスも出場しました。"}, {"t": 247.23333333333332, "x": "サルマン・ハシミコフを9分\nちょうどで破っています。"}, {"t": 250.35, "x": "イメージ映像"}, {"t": 250.35, "x": "ここまでが2月の話です。"}, {"t": 252.23333333333332, "x": "イメージ映像"}, {"t": 252.23333333333332, "x": "そしてWWFを含む3団体の興行は、\nこの2月10日より前に、"}, {"t": 257.56666666666666, "x": "すでに発表されていました。"}, {"t": 259.6, "x": "WWFと新日本プロレスは、\n1970年代から選手の行き来がありました。"}, {"t": 265.9166666666667, "x": "一方、1989年にWWFの\nビンス・マクマホン・ジュニアが"}, {"t": 271.3, "x": "日本進出を視野に入れます。"}, {"t": 273.15, "x": "このとき交渉の相手になったのは、\n全日本プロレスの馬場でした。"}, {"t": 277.43333333333334, "x": "1990年1月27日、\nマクマホンは後楽園ホールの"}, {"t": 282.75, "x": "全日本プロレスの大会に姿を見せます。"}, {"t": 285.4, "x": "イメージ映像"}, {"t": 285.4, "x": "リング上で馬場と握手し、その場で\n3団体による合同興行が発表されました。"}, {"t": 291.1333333333333, "x": "そのあと馬場が坂口に参加を求め、\n共催という形になっています。"}, {"t": 295.93333333333334, "x": "日付は1990年4月13日。"}, {"t": 299.18333333333334, "x": "会場は東京ドームです。"}, {"t": 301.03333333333336, "x": "発表された観衆は5万3742人。"}, {"t": 304.6666666666667, "x": "有料の入場者を\n約4万3000人とする記録もあります。"}, {"t": 308.6666666666667, "x": "2か月前の新日本の単独興行は\n6万3900人の発表でした。"}, {"t": 313.81666666666666, "x": "3団体を集めたこの日のほうが、\n発表の数字では1万人ほど下回っています。"}, {"t": 319.46666666666664, "x": "イメージ映像"}, {"t": 319.46666666666664, "x": "カードを順に確認します。"}, {"t": 321.31666666666666, "x": "第1試合は6人タッグでした。"}, {"t": 323.6666666666667, "x": "ファーナス、クロファット、マレンコの組と、\n川田利明、サムソン冬木、北原の組です。"}, {"t": 331.71666666666664, "x": "クロファットが北原をエビ固めで押さえました。"}, {"t": 334.5, "x": "第2試合はライガーと野上彰。"}, {"t": 336.78333333333336, "x": "8分37秒、ライガーが\n片エビ固めで勝っています。"}, {"t": 341.15, "x": "第3試合は、ジミー・スヌーカと\nティト・サンタナの組が、"}, {"t": 344.78333333333336, "x": "渕正信と小橋健太の組に勝ちました。"}, {"t": 347.7, "x": "第4試合はタイガーマスクと\nブレット・ハートです。"}, {"t": 350.76666666666665, "x": "このタイガーマスクは三沢光晴でした。"}, {"t": 353.4, "x": "イメージ映像"}, {"t": 353.4, "x": "20分、時間切れ引き分けです。"}, {"t": 356.1333333333333, "x": "この日の12試合で、\n最も長い試合になりました。"}, {"t": 359.93333333333334, "x": "三沢がこのマスクを脱ぐのは、およそ1か月後の\n1990年5月14日のことです。"}, {"t": 366.21666666666664, "x": "つまり東京ドームのこの20分は、\nタイガーマスクとしての終盤にあたります。"}, {"t": 371.48333333333335, "x": "第5試合はザ・グレート・カブキと\nグレッグ・バレンタイン。"}, {"t": 374.65, "x": "カブキがエビ固めで勝っています。"}, {"t": 376.68333333333334, "x": "第6試合はジェイク・ロバーツと\nビッグ・ボスマン。"}, {"t": 379.48333333333335, "x": "10分25秒、ロバーツが体固めで勝ちました。"}, {"t": 383.21666666666664, "x": "イメージ映像"}, {"t": 383.21666666666664, "x": "ベルトが懸かった試合は、2つありました。"}, {"t": 386.2, "x": "イメージ映像"}, {"t": 386.2, "x": "1つ目は第7試合、IWGPタッグ選手権です。"}, {"t": 390.85, "x": "イメージ映像"}, {"t": 390.85, "x": "王者のマサ斎藤・橋本真也組に、\n長州力・蝶野正洋組が挑みました。"}, {"t": 396.21666666666664, "x": "13分ちょうど、斎藤が蝶野を片エビ固めで\n押さえ、王者組が防衛しています。"}, {"t": 402.45, "x": "第8試合は、ジャンボ鶴田と\nキング・ハクの組でした。"}, {"t": 406.1333333333333, "x": "イメージ映像"}, {"t": 406.1333333333333, "x": "相手はリック・マーテルとカート・ヘニングです。"}, {"t": 408.68333333333334, "x": "10分53秒、鶴田が\nマーテルを体固めで取りました。"}, {"t": 412.9166666666667, "x": "イメージ映像"}, {"t": 412.9166666666667, "x": "鶴田のパートナーは、\n当初は谷津嘉章と発表されていました。"}, {"t": 417.23333333333335, "x": "谷津が負傷で欠場したため、\n全日本出身のキング・ハクに代わっています。"}, {"t": 422.26666666666665, "x": "第9試合は天龍源一郎とランディ・サベージ。"}, {"t": 425.45, "x": "10分49秒、天龍がエビ固めで勝っています。"}, {"t": 429.45, "x": "イメージ映像"}, {"t": 429.45, "x": "ベルトの2つ目は第10試合、\nWWF世界ヘビー級選手権でした。"}, {"t": 435.26666666666665, "x": "王者はアルティメット・ウォリアー、\n挑戦者はテッド・デビアスです。"}, {"t": 439.3, "x": "イメージ映像"}, {"t": 439.3, "x": "6分12秒、ウォリアーが体固めで防衛しました。"}, {"t": 443.3666666666667, "x": "ウォリアーがこのベルトを獲ったのは、\n12日前の4月1日です。"}, {"t": 447.85, "x": "ここで、その4月1日の話をしておきます。"}, {"t": 451.3666666666667, "x": "場所はカナダ、トロントのスカイドーム。"}, {"t": 454.05, "x": "WWFのレッスルマニア6です。"}, {"t": 456.71666666666664, "x": "発表された観衆は6万7678人でした。"}, {"t": 460.85, "x": "メインは、WWF世界ヘビー級王者の\nホーガンでした。"}, {"t": 465.6666666666667, "x": "相手はインターコンチネンタル王者の\nウォリアーです。"}, {"t": 468.71666666666664, "x": "両者のベルトを賭けた一騎打ちで、\nウォリアーが勝ちました。"}, {"t": 472.6166666666667, "x": "イメージ映像"}, {"t": 472.6166666666667, "x": "この12日後が、東京ドームです。"}, {"t": 475.3833333333333, "x": "つまり東京でのウォリアー対デビアスは、\n王座交代の直後に組まれた最初の"}, {"t": 480.4166666666667, "x": "防衛戦にあたります。"}, {"t": 481.81666666666666, "x": "そして、この日の12試合の\nうち最も短い試合でもありました。"}, {"t": 486.4166666666667, "x": "イメージ映像"}, {"t": 486.4166666666667, "x": "セミファイナルが、この興行の山場の1つです。"}, {"t": 489.85, "x": "ジャイアント馬場とアンドレ・ザ・ジャイアントの\n組が、デモリッションと対戦しました。"}, {"t": 494.75, "x": "アックスとスマッシュの2人組です。"}, {"t": 497.0, "x": "イメージ映像"}, {"t": 497.0, "x": "6分39秒、アンドレがスマッシュを\n体固めで押さえています。"}, {"t": 501.5833333333333, "x": "イメージ映像"}, {"t": 501.5833333333333, "x": "この顔合わせにも、\nレッスルマニア6が関わっています。"}, {"t": 505.3833333333333, "x": "4月1日のトロントで、アンドレは\ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);

document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);

  if(k===' '){e.preventDefault();pp.onclick()}
