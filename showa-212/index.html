<script>
const D={"name": "天龍源一郎の廃業", "file": "212_編集用", "dur": 834.0833125, "segs": [], "subs": [{"t": 0.0, "x": "1976年9月場所。"}, {"t": 2.466666666666667, "x": "東前頭13枚目の力士が、\n8勝7敗で場所を終えました。"}, {"t": 7.266666666666667, "x": "勝ち越しです。"}, {"t": 8.266666666666667, "x": "前頭の下位で勝ち越せば、番付は上がります。"}, {"t": 11.75, "x": "翌場所も幕内で相撲を取れます。"}, {"t": 14.066666666666666, "x": "しかしこの力士は、この場所を\n最後に土俵を降りました。廃業です。"}, {"t": 18.866666666666667, "x": "26歳でした。"}, {"t": 20.25, "x": "四股名を天龍源一郎といいます。"}, {"t": 22.683333333333334, "x": "13歳で相撲部屋に入り、13年目のことでした。"}, {"t": 26.7, "x": "天龍は相撲を辞めた翌月、\n全日本プロレスに入団します。"}, {"t": 31.183333333333334, "x": "そしてその年の11月、アメリカ・テキサス州の\nリングでプロレスラーとしてデビューしました。"}, {"t": 37.06666666666667, "x": "なぜ勝ち越した幕内力士が、\n番付を捨ててプロレスに行ったのでしょうか。"}, {"t": 41.81666666666667, "x": "今回は、1975年に二所ノ関部屋で\n起きたことから、1977年6月"}, {"t": 48.81666666666667, "x": "11日の日本デビュー戦までを、\n具体的な日付と記録をもとに辿っていきます。"}, {"t": 54.11666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 56.61666666666667, "x": "それでは本編に入る前に、チャンネル\n登録と高評価をよろしくお願いいたします。"}, {"t": 62.2, "x": "天龍源一郎の本名は嶋田源一郎といいます。"}, {"t": 65.78333333333333, "x": "1950年2月2日、\n福井県勝山市に生まれました。"}, {"t": 70.43333333333334, "x": "嶋田は勝山市立北郷小学校を卒業し、\n勝山市立北部中学校に進みます。"}, {"t": 77.0, "x": "相撲を志して部屋の門を叩いた、と\nいう入り方ではありませんでした。"}, {"t": 81.9, "x": "きっかけは、父親が床屋で散髪をしていた\nときのことだったと伝えられています。"}, {"t": 87.1, "x": "その床屋の店主が、二所ノ関部屋の後援者から\n「この辺りに相撲に入れられるような身体の"}, {"t": 92.96666666666667, "x": "大きい子はいないか」と尋ねられていました。"}, {"t": 95.15, "x": "それを聞いた父親が\n「うちの息子は大きいよ」と答えたのです。"}, {"t": 98.93333333333334, "x": "その後、二所ノ関部屋の巡業が地元を\n訪れた際、部屋の後援会が嶋田を"}, {"t": 104.61666666666666, "x": "大鵬に会わせました。大鵬幸喜。"}, {"t": 107.33333333333333, "x": "当時の二所ノ関部屋の横綱です。"}, {"t": 109.63333333333334, "x": "この場で嶋田は大相撲へ勧誘されました。"}, {"t": 112.4, "x": "嶋田が入門したのは1963年、\n中学2年生のときでした。"}, {"t": 117.93333333333334, "x": "入門した月は1963年12月です。"}, {"t": 121.6, "x": "初土俵は1964年1月場所。"}, {"t": 124.81666666666666, "x": "このとき13歳11か月でした。"}, {"t": 127.3, "x": "嶋田が入った二所ノ関部屋は、\n当時の相撲界でも屈指の名門でした。"}, {"t": 132.36666666666667, "x": "部屋の師匠は8代二所ノ関、\n元大関の佐賀ノ花です。"}, {"t": 136.68333333333334, "x": "8代二所ノ関が師匠を務めていたのは\n1951年9月から1975年3月まで。"}, {"t": 143.53333333333333, "x": "その間に横綱・大鵬幸喜、大関・\n大麒麟將能をはじめ、多くの関取を育てています。"}, {"t": 150.46666666666667, "x": "二所ノ関一門の総帥と呼ばれるまでに\n部屋を大きくした人物でした。"}, {"t": 154.86666666666667, "x": "その名門に、13歳の少年が\n入ったことになります。"}, {"t": 158.83333333333334, "x": "四股名は最初、本名のままの島田源一郎でした。"}, {"t": 162.73333333333332, "x": "その後、嶋田源一郎、また島田源一郎と\n表記が変わっています。"}, {"t": 168.15, "x": "十両に上がったのは1971年9月場所でした。"}, {"t": 172.13333333333333, "x": "入門から7年9か月です。"}, {"t": 174.36666666666667, "x": "そしてこの場所から、\n四股名が天龍源一郎になりました。"}, {"t": 178.45, "x": "新入幕は1973年1月場所。"}, {"t": 181.93333333333334, "x": "そして1974年1月場所で\n西前頭筆頭まで上がります。"}, {"t": 186.88333333333333, "x": "これが天龍の最高位でした。"}, {"t": 188.9, "x": "前頭筆頭は、幕内の中で横綱・\n大関・関脇・小結に次ぐ位置です。"}, {"t": 194.33333333333334, "x": "あと一枚上がれば三役、つまり小結です。"}, {"t": 197.75, "x": "この時点の天龍は、\n幕内の上位で相撲を取る力士でした。"}, {"t": 202.06666666666666, "x": "天龍の幕内在位は、通算で16場所になります。"}, {"t": 206.0, "x": "その天龍が所属していた二所ノ関部屋に、1975\n年3月28日、大きな出来事が起こります。"}, {"t": 214.11666666666667, "x": "師匠である8代二所ノ関が亡くなったのです。"}, {"t": 217.06666666666666, "x": "元大関・佐賀ノ花。"}, {"t": 218.65, "x": "死因は急性白血病でした。急逝です。"}, {"t": 222.06666666666666, "x": "師匠を務めて23年半での死でした。"}, {"t": 224.98333333333332, "x": "相撲部屋の師匠が亡くなると、\n部屋を誰が継ぐかという問題が生じます。"}, {"t": 229.93333333333334, "x": "まして二所ノ関部屋は一門の\n総帥を務めた部屋です。"}, {"t": 233.55, "x": "後継に名乗りを上げた人物は複数いました。"}, {"t": 236.53333333333333, "x": "1人は17代押尾川。"}, {"t": 238.61666666666667, "x": "元大関の大麒麟です。"}, {"t": 240.43333333333334, "x": "8代二所ノ関が育てた力士の1人であり、\n部屋の後継者として名乗りを上げました。"}, {"t": 246.0, "x": "もう1人は大鵬です。"}, {"t": 247.63333333333333, "x": "48代横綱で、一代年寄でした。"}, {"t": 251.11666666666667, "x": "8代二所ノ関の通夜の晩に、\n後継に名乗りを上げています。"}, {"t": 255.26666666666668, "x": "この大鵬こそ、13歳の嶋田を\n勧誘した場に立ち会った人物でした。"}, {"t": 260.3, "x": "そしてもう1つの立場が、\n8代二所ノ関の未亡人でした。"}, {"t": 264.48333333333335, "x": "未亡人は、部屋の関脇である金剛に\n部屋を継がせたいと考えていました。"}, {"t": 269.55, "x": "3者の話し合いは決着がつかず、\n後継者争いは長期化します。"}, {"t": 274.46666666666664, "x": "師匠が亡くなってから半年近く、\n部屋の行き先が決まらない状態が続きました。"}, {"t": 279.93333333333334, "x": "決着がついたのは1975年9月場所の前でした。"}, {"t": 284.06666666666666, "x": "関脇の金剛が、8代二所ノ関の\n次女との婚約を発表したのです。"}, {"t": 289.15, "x": "娘婿になるということです。"}, {"t": 291.05, "x": "これによって金剛が後継争いに\n事実上の決着をつけました。"}, {"t": 295.35, "x": "この結果に不満を持ったのが、\n17代押尾川でした。"}, {"t": 299.4, "x": "1975年9月3日、押尾川は\n自分を慕う16名の力士を連れて、"}, {"t": 305.5, "x": "東京・谷中の瑞輪寺に立てこもります。"}, {"t": 308.26666666666665, "x": "そして二所ノ関部屋からの\n分家独立を申し出ました。"}, {"t": 311.68333333333334, "x": "相撲部屋の分裂です。"}, {"t": 313.4, "x": "師匠の死から5か月あまりで、\n二所ノ関部屋は割れました。"}, {"t": 317.4, "x": "この騒動には11代花籠が\n調停役として入っています。"}, {"t": 321.46666666666664, "x": "この立てこもりは、1975\n年9月場所後に決着します。"}, {"t": 326.26666666666665, "x": "押尾川部屋の分家独立は承認されました。"}, {"t": 329.4, "x": "ただし、条件がつきました。"}, {"t": 331.8333333333333, "x": "連れて行けるのは16名の\nうち6名だけ、というものです。"}, {"t": 336.03333333333336, "x": "この6名には、その場所で\n新小結になった青葉城らが含まれていました。"}, {"t": 341.01666666666665, "x": "そして、幕内力士だった天龍は、\nこの6名に入っていませんでした。"}, {"t": 346.43333333333334, "x": "移籍が認められなかったのです。"}, {"t": 348.45, "x": "天龍はこの結果を不服としています。"}, {"t": 350.95, "x": "移籍が認められなかった天龍は、金剛が\n継承する二所ノ関部屋に残ることになりました。"}, {"t": 356.96666666666664, "x": "金剛の本名は北村正裕といいます。"}, {"t": 359.78333333333336, "x": "1948年11月18日生まれ。"}, {"t": 363.3333333333333, "x": "最高位は東関脇でした。"}, {"t": 365.45, "x": "天龍より2歳年上です。"}, {"t": 367.4, "x": "その金剛が正式に二所ノ関の年寄名跡を\n継承したのは、1976年9月3日のことでした。"}, {"t": 374.98333333333335, "x": "10代二所ノ関の誕生です。"}, {"t": 377.1, "x": "そしてこの1976年9月というのは、天龍が\n最後の場所を迎える、まさにその月でした。"}, {"t": 384.46666666666664, "x": "戻された後、天龍は部屋の\n中で難しい立場に置かれます。"}, {"t": 388.8833333333333, "x": "部屋の力士からのけ者にされ、\n稽古相手がいなくなるという扱いを"}, {"t": 393.3333333333333, "x": "受けたと記録されています。"}, {"t": 394.8333333333333, "x": "相撲は稽古で強くなる競技です。"}, {"t": 397.25, "x": "番付は場所の成績で決まりますが、\nその成績をつくるのは日々の稽古です。"}, {"t": 402.53333333333336, "x": "稽古相手がいないということは、\n力士として上を目指す道が事実上"}, {"t": 407.06666666666666, "x": "閉ざされるということでもありました。"}, {"t": 409.0, "x": "その状態のまま、天龍は1年間、\n土俵に上がり続けました。"}, {"t": 414.18333333333334, "x": "そして1976年9月場所。"}, {"t": 416.98333333333335, "x": "東前頭13枚目で8勝7敗。"}, {"t": 419.93333333333334, "x": "勝ち越しでした。"}, {"t": 421.0, "x": "天龍はこの場所を最後に廃業します。"}, {"t": 423.6666666666667, "x": "26歳でした。"}, {"t": 425.05, "x": "1963年12月の入門から、\n12年9か月が経っていました。"}, {"t": 430.68333333333334, "x": "廃業の理由として資料に挙げられているものは\n1つではありません。"}, {"t": 434.71666666666664, "x": "部屋の後継問題で居場所を失ったこと。"}, {"t": 437.5, "x": "交際していた女性が亡くなったこと。"}, {"t": 439.75, "x": "そしてプロレスに転向するという決意。"}, {"t": 442.15, "x": "この3つが挙げられています。"}, {"t": 444.0, "x": "どれか1つが決定的だったとは断定できません。"}, {"t": 447.1333333333333, "x": "廃業した翌月、1976年10月15日、\n天龍源一郎は全日本プロレスに入団しました。"}, {"t": 455.5, "x": "全日本プロレスは、ジャイアント馬場が\n1972年に旗揚げした団体です。"}, {"t": 461.26666666666665, "x": "天龍が入団した1976年の時点で、\nまだ設立4年でした。"}, {"t": 466.76666666666665, "x": "天龍の動きは早いものでした。"}, {"t": 468.9, "x": "入団の2日後には、\n新潟県三条から巡業に合流しています。"}, {"t": 473.73333333333335, "x": "イメージ映像"}, {"t": 473.73333333333335, "x": "相撲を辞めてまだ1か月あまりでの合流でした。"}, {"t": 476.9, "x": "そして全日本の道場で、天龍は\n最初の衝撃を受けることになります。"}, {"t": 481.8833333333333, "x": "ジャンボ鶴田のボディスラムを\n初めて受けたときのことです。"}, {"t": 485.15, "x": "ボディスラムは、相手を持ち上げて\nマットに叩きつける基本的な技です。"}, {"t": 489.93333333333334, "x": "天龍は大相撲の幕内で16場所を務め、\n前頭筆頭まで上がった力士でした。"}, {"t": 495.98333333333335, "x": "イメージ映像"}, {"t": 495.98333333333335, "x": "体を鍛えることでも、人と\n組み合うことでも、素人ではありません。"}, {"t": 500.9, "x": "その天龍が、鶴田の技を受けて、\n大相撲で積み上げてきた自信が"}, {"t": 506.0, "x": "崩れ去ったと後に語っています。"}, {"t": 507.98333333333335, "x": "プロレスは相撲とは別の競技である、と\nいうことを最初に教えられたのがこの場面でした。"}, {"t": 513.75, "x": "入団した天龍は、その後アメリカへ渡ります。"}, {"t": 517.2666666666667, "x": "修行先はザ・ファンクスのもとでした。"}, {"t": 519.6, "x": "テリー・ファンクとドリー・ファンク・\nジュニアの兄弟が拠点としていた、"}, {"t": 523.0666666666667, "x": "テキサス州アマリロです。"}, {"t": 524.9833333333333, "x": "天龍のプロレスデビュー戦は、1976年\n11月13日、テキサス州で行われました。"}, {"t": 532.6666666666666, "x": "イメージ映像"}, {"t": 532.6666666666666, "x": "廃業からわずか2か月後のことです。"}, {"t": 535.1833333333333, "x": "対戦相手はテッド・デビアスでした。"}, {"t": 537.4166666666666, "x": "後にミリオンダラーマンとして\n知られることになる選手です。"}, {"t": 540.7666666666667, "x": "そして天龍がこのとき名乗ったリング\nネームは、テン・ルーというものでした。"}, {"t" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
