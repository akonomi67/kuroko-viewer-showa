<script>
const D={"name": "全日本旗揚げ", "file": "232_編集用", "dur": 911.2333125, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1972年10月21日、\n東京都町田市の町田市体育館。"}, {"t": 5.683333333333334, "x": "その夜、新しいプロレス団体の\n最初の興行が行われました。"}, {"t": 10.333333333333334, "x": "興行の名前は、旗揚げ前夜祭といいます。"}, {"t": 13.616666666666667, "x": "観衆は3,500人と報じられました。"}, {"t": 16.483333333333334, "x": "そしてこの興行を、\n日本テレビが生中継しています。"}, {"t": 20.383333333333333, "x": "メインイベントに出たのは、\nジャイアント馬場とサンダー杉山の組でした。"}, {"t": 25.0, "x": "相手はブルーノ・サンマルチノと\nテリー・ファンク。"}, {"t": 27.516666666666666, "x": "結果は、日本人組のリングアウト負けです。"}, {"t": 30.683333333333334, "x": "当時の東京スポーツの見出しには、\nこう出ています。"}, {"t": 34.166666666666664, "x": "馬場開幕戦飾れず。"}, {"t": 35.8, "x": "無残な場外昇天。"}, {"t": 37.43333333333333, "x": "イメージ映像"}, {"t": 37.43333333333333, "x": "団体の名前は、全日本プロレスといいました。"}, {"t": 40.833333333333336, "x": "イメージ映像"}, {"t": 40.833333333333336, "x": "翌10月22日、両国の日大講堂で\n旗揚げ戦が行われています。"}, {"t": 46.36666666666667, "x": "イメージ映像"}, {"t": 46.36666666666667, "x": "この団体には、最初から\n揃っていたものが1つありました。"}, {"t": 50.333333333333336, "x": "テレビです。"}, {"t": 51.21666666666667, "x": "旗揚げの2週間前から、すでに\n全国ネットの中継枠が動いていました。"}, {"t": 56.38333333333333, "x": "なぜ、興行を1度も打っていない団体に、\n土曜夜8時の全国中継が付いていたのでしょうか。"}, {"t": 63.43333333333333, "x": "今回は、全日本プロレスが\n始まった1972年10月を、"}, {"t": 68.35, "x": "確認できた日付と数字だけで辿っていきます。"}, {"t": 71.56666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 74.06666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 79.63333333333334, "x": "イメージ映像"}, {"t": 79.63333333333334, "x": "まず、その年の日本プロレスの\n状況を短く確認しておきます。"}, {"t": 84.43333333333334, "x": "1971年12月、アントニオ猪木が\n日本プロレスを除名されました。"}, {"t": 90.16666666666667, "x": "理由として発表されたのは、\nクーデターを画策したというものです。"}, {"t": 94.68333333333334, "x": "猪木は翌1972年1月13日に\n新日本プロレスを設立し、3月6日に"}, {"t": 101.45, "x": "大田区体育館で旗揚げしています。"}, {"t": 103.68333333333334, "x": "イメージ映像"}, {"t": 103.68333333333334, "x": "問題は、そのあとに起きたテレビの話でした。"}, {"t": 107.01666666666667, "x": "当時の日本プロレスは、日本テレビと\nNETテレビの2局が中継していました。"}, {"t": 112.35, "x": "この2局の間には取り決めがあります。"}, {"t": 114.86666666666666, "x": "NETは馬場の試合を\n放送しない、というものです。"}, {"t": 118.78333333333333, "x": "ところが、NETの\n看板だった猪木がいなくなりました。"}, {"t": 122.76666666666667, "x": "NETは馬場の出場を要求します。"}, {"t": 125.5, "x": "そして日本プロレスの幹部が、\nこの要求を通しました。"}, {"t": 129.46666666666667, "x": "1972年4月3日、\nワールド大リーグ戦の新潟大会。"}, {"t": 134.71666666666667, "x": "馬場がNETの中継に登場します。"}, {"t": 137.43333333333334, "x": "イメージ映像"}, {"t": 137.43333333333334, "x": "日本テレビは、中継の\nスポンサーだった三菱電機と協議しました。"}, {"t": 142.1, "x": "そして契約不履行を理由に、\n中継の打ち切りを決めます。"}, {"t": 146.28333333333333, "x": "最後の放送は、1972年5月12日の\n東京体育館大会でした。"}, {"t": 152.48333333333332, "x": "1954年2月19日から続いた中継が、\nここで止まっています。"}, {"t": 158.0, "x": "イメージ映像"}, {"t": 158.0, "x": "打ち切りの発表の席で、日本テレビの\n運動部長だった松根光雄がこう述べています。"}, {"t": 163.63333333333333, "x": "日プロの幹部は常識のある社会人かと\n思ったが、子供みたいな感覚しかない。"}, {"t": 169.05, "x": "こちらが馬鹿負けしたので\n中継から手を引きました。"}, {"t": 172.06666666666666, "x": "空いた枠は、力道山や馬場や猪木の\n過去の名勝負集でつなぎました。"}, {"t": 176.88333333333333, "x": "そして7月から、同じ枠で\n刑事ドラマの放送が始まります。"}, {"t": 181.23333333333332, "x": "『太陽にほえろ!』です。"}, {"t": 183.53333333333333, "x": "イメージ映像"}, {"t": 183.53333333333333, "x": "ここから、日本テレビが動きました。"}, {"t": 186.15, "x": "イメージ映像"}, {"t": 186.15, "x": "当時の日本テレビの社長は小林與三次です。"}, {"t": 189.16666666666666, "x": "小林は、のちに中継の責任者となる\nプロデューサーの原章とともに、"}, {"t": 194.06666666666666, "x": "極秘に馬場と接触しました。"}, {"t": 196.28333333333333, "x": "そして馬場に独立を促したとされています。"}, {"t": 199.13333333333333, "x": "イメージ映像"}, {"t": 199.13333333333333, "x": "このとき提示された条件が、\n記録に残っています。"}, {"t": 202.8, "x": "旗揚げに対しての資金は\n全て日本テレビが負担する。"}, {"t": 206.3, "x": "放映権料も最大限用意する。"}, {"t": 208.66666666666666, "x": "馬場がいる限り、プロレス人気が\n下火になっても放送は打ち切らない。"}, {"t": 213.18333333333334, "x": "馬場が動いたのは、その2か月後でした。"}, {"t": 216.15, "x": "1972年7月29日、\n馬場は記者会見を開きます。"}, {"t": 221.46666666666667, "x": "日本プロレスの退団と、\n新団体の設立を表明しました。"}, {"t": 225.9, "x": "イメージ映像"}, {"t": 225.9, "x": "7年間保持していた\nインターナショナル・ヘビー級王座も"}, {"t": 229.18333333333334, "x": "返上しています。"}, {"t": 230.3, "x": "そして8月18日、宮城県石巻市での\n試合を最後に日本プロレスを離れました。"}, {"t": 236.66666666666666, "x": "馬場が日本プロレスを出た理由については、\n複数の説が語られています。"}, {"t": 241.55, "x": "記録の上で確認できるのは、日本テレビの\n中継が打ち切られた直後に接触があったこと。"}, {"t": 247.41666666666666, "x": "そして退団の会見で、馬場自身が\n日本テレビの協力に触れていることです。"}, {"t": 252.7, "x": "退団後の馬場は、プロデューサーの\n原とともにアメリカへ渡りました。"}, {"t": 257.15, "x": "現地で試合をこなしながら、\n有力者に協力を要請しています。"}, {"t": 261.76666666666665, "x": "接触した相手として名前が残っているのは、\nドリー・ファンク・シニア、"}, {"t": 266.01666666666665, "x": "フリッツ・フォン・エリック、\nブルーノ・サンマルチノです。"}, {"t": 269.5833333333333, "x": "1972年9月9日、\n全日本プロ・レスリング株式会社が"}, {"t": 274.68333333333334, "x": "設立されました。"}, {"t": 275.8, "x": "代表取締役社長は、馬場正平。"}, {"t": 279.06666666666666, "x": "団体名について、会見ではこう説明されています。"}, {"t": 283.0833333333333, "x": "日本、国際、\n新日本があって6年前には東京があった。"}, {"t": 288.03333333333336, "x": "もう、これしかない。"}, {"t": 289.85, "x": "旗揚げ時の日本人選手も記録されています。"}, {"t": 292.8333333333333, "x": "大熊元司、マシオ駒、\nサムソン・クツワダ、佐藤昭夫。"}, {"t": 297.8, "x": "一時現役を離れていた藤井誠之。"}, {"t": 300.4, "x": "レフェリーはジョー樋口です。"}, {"t": 302.1333333333333, "x": "日本プロレスの\n若手だった百田光雄も加わりました。"}, {"t": 305.5, "x": "リングアナウンサー兼取締役として百田義浩。"}, {"t": 308.81666666666666, "x": "そして役員には、力道山の\n未亡人である田中敬子が名を連ねています。"}, {"t": 313.96666666666664, "x": "イメージ映像"}, {"t": 313.96666666666664, "x": "ここで、1つのベルトが動きました。"}, {"t": 316.6, "x": "力道山の死後、百田家に保管されていた\nチャンピオンベルトです。"}, {"t": 320.95, "x": "インターナショナル・ヘビー級王座と、\nWWA世界ヘビー級王座に"}, {"t": 326.28333333333336, "x": "使われていたベルトでした。"}, {"t": 327.78333333333336, "x": "これが旗揚げの直前に、馬場へ贈られています。"}, {"t": 331.3666666666667, "x": "全日本プロレスは、このベルトを\n世界ヘビー級王座と呼ぶことにしました。"}, {"t": 336.2, "x": "のちにPWFヘビー級王座となるベルトです。"}, {"t": 339.51666666666665, "x": "イメージ映像"}, {"t": 339.51666666666665, "x": "手薄だった日本人選手については、\n他団体の協力もありました。"}, {"t": 344.15, "x": "国際プロレスの社長は吉原功です。"}, {"t": 346.93333333333334, "x": "イメージ映像"}, {"t": 346.93333333333334, "x": "この吉原との会談で、\nサンダー杉山が加わりました。"}, {"t": 350.93333333333334, "x": "イメージ映像"}, {"t": 350.93333333333334, "x": "旗揚げシリーズには、国際プロレスの\n前座の選手も参戦しています。"}, {"t": 355.7, "x": "毎シリーズ、入れ替わりで送り込まれる形でした。"}, {"t": 359.3, "x": "一方で、新しい団体を\n止めようとする動きも記録されています。"}, {"t": 363.95, "x": "日本プロレスは、過去にも\n同じことをしていました。"}, {"t": 367.26666666666665, "x": "東京プロレス、国際プロレス、新日本プロレス。"}, {"t": 371.4, "x": "いずれのときも、外国人選手の\n招聘を妨害しています。"}, {"t": 375.6333333333333, "x": "イメージ映像"}, {"t": 375.6333333333333, "x": "今回も、アメリカのプロモーターへ\n圧力がかけられました。"}, {"t": 379.51666666666665, "x": "イメージ映像"}, {"t": 379.51666666666665, "x": "フリッツ・フォン・エリックは、\n日本プロレスの最終シリーズに特別参加します。"}, {"t": 384.48333333333335, "x": "アイアンクロー・シリーズです。"}, {"t": 386.18333333333334, "x": "イメージ映像"}, {"t": 386.18333333333334, "x": "そのため、ダラスからの招聘ルートが\n一時使えなくなりました。"}, {"t": 390.6333333333333, "x": "イメージ映像"}, {"t": 390.6333333333333, "x": "日本プロレスのブッキングを\n担当していたミスター・モトも、"}, {"t": 393.95, "x": "直前になって協力を断っています。"}, {"t": 396.8, "x": "イメージ映像"}, {"t": 396.8, "x": "それでも、招聘ルートは止まりませんでした。"}, {"t": 399.96666666666664, "x": "馬場がアメリカでの武者修行時代に\n築いた信用があったこと。"}, {"t": 403.75, "x": "日本テレビが全面的に支援する姿勢を見せたこと。"}, {"t": 407.25, "x": "そしてドリー・ファンク・シニアが協力したこと。"}, {"t": 409.8666666666667, "x": "この3つが記録に残っている理由です。"}, {"t": 412.45, "x": "エリックも、日本プロレスの最終シリーズで\n義理を果たしたあと全日本に参戦しました。"}, {"t": 418.06666666666666, "x": "イメージ映像"}, {"t": 418.06666666666666, "x": "会場を使わせない、という妨害も\n通りませんでした。"}, {"t": 421.9166666666667, "x": "日本テレビが会場を借り、そこへ\n全日本プロレスを招く形にしたためです。"}, {"t": 427.21666666666664, "x": "そして、テレビです。"}, {"t": 429.05, "x": "イメージ映像"}, {"t": 429.05, "x": "1972年10月7日、日本テレビは\n『全日本プロレス中継』の放送を開始しました。"}, {"t": 435.6333333333333, "x": "枠は土曜20時台。"}, {"t": 437.23333333333335, "x": "全国29局ネットです。"}, {"t": 439.31666666666666, "x": "日本テレビでプロレス中継が\n復活したのは、5か月ぶりでした。"}, {"t": 443.73333333333335, "x": "キャッチコピーはこうです。"}, {"t": 445.3833333333333, "x": "お待たせしました。"}, {"t": 446.55, "x": "リングの王者ジャイアント馬場、\n日本テレビに再登場。"}, {"t": 450.18333333333334, "x": "イメージ映像"}, {"t": 450.18333333333334, "x": "ただし、この時点で全日本プロレスは\nまだ1試合も日本で行っていません。"}, {"t": 455.28333333333336, "x": "第1回の放送で流れたのは、\n馬場の海外遠征の試合でした。"}, {"t": 460.06666666666666, "x": "1972年9月20日、\nホノルルでのザ・シーク戦です。"}, {"t": 464.6333333333333, "x": "第2回も、海外サーキットの\n試合が中継されました。"}, {"t": 468.683333333333 function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

function mark(pane,i){

  const t=el.children[i]; if(!t) return; t.classList.add('on');

}

let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
