<script>
const D={"name": "馬場とハンセン1982", "file": "293_編集用", "dur": 916.7833125, "segs": [], "subs": [{"t": 0.0, "x": "1982年2月4日の東京体育館で、\nメインイベントは12分39秒で終わりました。"}, {"t": 7.4, "x": "リングにいたのはジャイアント馬場と\nスタン・ハンセンです。"}, {"t": 10.4, "x": "2人が1対1で向き合うのは、\nこの夜が初めてでした。"}, {"t": 14.3, "x": "勝ち負けはつきません。"}, {"t": 15.75, "x": "裁定は両者反則です。"}, {"t": 17.7, "x": "それでもこの試合は、その年の\n年間最高試合に選ばれました。"}, {"t": 22.266666666666666, "x": "この年、2人のシングルはあと3度組まれます。"}, {"t": 25.633333333333333, "x": "4度のうち、3カウントで\n決まった試合は1つもありません。"}, {"t": 29.883333333333333, "x": "初めての一騎打ちの前に、2人は何度\n同じリングに立っていたのでしょうか？"}, {"t": 34.93333333333333, "x": "4度のシングルは、それぞれ\nどう終わったのでしょうか？"}, {"t": 38.61666666666667, "x": "今回は、1982年の馬場とハンセンを追います。"}, {"t": 42.95, "x": "1月のシリーズから、\n9月の刈谷までが中心です。"}, {"t": 46.8, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 51.36666666666667, "x": "馬場の公式年表と、\n新聞の記事も合わせて見ていきます。"}, {"t": 55.6, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.083333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 63.666666666666664, "x": "まず、馬場の公式年表を開きます。"}, {"t": 66.95, "x": "1982年のところには、こう書かれています。"}, {"t": 70.95, "x": "東京体育館でスタン・ハンセンと初の一騎打ち。"}, {"t": 74.06666666666666, "x": "年間最高試合に輝く大熱戦を展開した。"}, {"t": 77.58333333333333, "x": "日付は2月4日です。"}, {"t": 79.3, "x": "勝ち負けは書かれていません。"}, {"t": 81.06666666666666, "x": "試合の時間もありません。"}, {"t": 82.88333333333334, "x": "この年に2人が何度当たったのかも、\n年表にはありません。"}, {"t": 86.91666666666667, "x": "そこで今回は、試合の記録と新聞の\n記事でその1年をたどります。"}, {"t": 91.73333333333333, "x": "ハンセンが全日本プロレスに来るまでの話は、\n以前の動画で取り上げました。"}, {"t": 96.78333333333333, "x": "ここでは、試合の記録に残る日付から始めます。"}, {"t": 100.36666666666666, "x": "その年の正月のシリーズは、\n新春ジャイアント・シリーズという名前でした。"}, {"t": 105.31666666666666, "x": "記録では、1月2日に始まっています。"}, {"t": 108.43333333333334, "x": "終わったのは2月4日です。"}, {"t": 110.26666666666667, "x": "大会の数は29でした。"}, {"t": 112.35, "x": "記録には、外国人のレスラーの欄があります。"}, {"t": 115.7, "x": "そこにハンセンの名前が載っています。"}, {"t": 117.98333333333333, "x": "横に書かれた日付は、\n1月15日から2月4日までです。"}, {"t": 122.5, "x": "シリーズの途中から加わり、\n最終戦まで出たことになります。"}, {"t": 126.8, "x": "1月15日は、千葉県の木更津です。"}, {"t": 130.11666666666667, "x": "観客は6700人と記録されています。"}, {"t": 133.13333333333333, "x": "この夜は、10の試合が組まれました。"}, {"t": 135.95, "x": "ハンセンが出たのは9試合目です。"}, {"t": 138.16666666666666, "x": "相手は日本のレスラーでした。"}, {"t": 140.11666666666667, "x": "試合は2分25秒で終わっています。"}, {"t": 142.85, "x": "ハンセンの押さえ込みです。"}, {"t": 144.46666666666667, "x": "10試合目のメインイベントは、\n馬場の組のタッグマッチでした。"}, {"t": 148.63333333333333, "x": "馬場の組は7分42秒で勝っています。"}, {"t": 151.6, "x": "2人は同じ大会に出ていました。"}, {"t": 153.75, "x": "それでも、まだ同じ試合には入っていません。"}, {"t": 157.03333333333333, "x": "2人が初めて同じ試合に入ったのは、\n2日後の1月17日です。"}, {"t": 161.98333333333332, "x": "場所は埼玉県の深谷でした。"}, {"t": 164.16666666666666, "x": "組み合わせは、3人と3人の6人タッグです。"}, {"t": 167.76666666666668, "x": "6人タッグは、3人ずつの組が戦う試合です。"}, {"t": 171.58333333333334, "x": "リングに入れるのは、各組の1人ずつです。"}, {"t": 174.55, "x": "ハンセンの組には、\n外国人のレスラーが2人いました。"}, {"t": 178.26666666666668, "x": "馬場の組には、日本のレスラーが2人いました。"}, {"t": 181.43333333333334, "x": "勝ったのはハンセンの組です。"}, {"t": 183.26666666666668, "x": "試合の時間は、記録に書かれていません。"}, {"t": 186.41666666666666, "x": "ここから、6人タッグでの対戦が続きます。"}, {"t": 189.83333333333334, "x": "シリーズの記録に並ぶ日付を、\n順に読んでいきます。"}, {"t": 193.53333333333333, "x": "1月21日の熊本県の水俣は、\nハンセンの組の勝ちです。"}, {"t": 198.26666666666668, "x": "1月22日の長崎は、馬場の組の勝ちでした。"}, {"t": 202.15, "x": "1月24日の大分県の別府も、\n馬場の組が勝っています。"}, {"t": 206.75, "x": "1月25日の福岡県の久留米は、\nハンセンの組の勝ちでした。"}, {"t": 211.33333333333334, "x": "1月28日の徳島県の池田は、\n馬場の組の勝ちです。"}, {"t": 215.83333333333334, "x": "1月30日の広島県の府中は、\nハンセンの組が勝ちました。"}, {"t": 220.48333333333332, "x": "1月31日の広島県の尾道も、\nハンセンの組の勝ちです。"}, {"t": 225.28333333333333, "x": "そして2月1日の京都です。"}, {"t": 227.43333333333334, "x": "数えると、1月17日から\n2月1日までで9つの夜になります。"}, {"t": 232.6, "x": "ハンセンの組の勝ちが6つです。"}, {"t": 234.68333333333334, "x": "馬場の組の勝ちが3つでした。"}, {"t": 236.68333333333334, "x": "組む仲間は、試合ごとに入れ替わっています。"}, {"t": 239.75, "x": "ハンセンの横にいたのは外国人の\nレスラーだけではありません。"}, {"t": 243.41666666666666, "x": "日本のレスラーと組んだ夜もありました。"}, {"t": 245.81666666666666, "x": "ただし、9つの夜はどれも6人タッグです。"}, {"t": 249.35, "x": "1対1の試合は、 .05, "x": "この年の1月23日に\n44歳になったばかりでした。"}, {"t": 378.15, "x": "試合の中身を、集英社の\nスポルティーバの記事で見ていきます。"}, {"t": 382.31666666666666, "x": "試合の前の館内は、ハンセンへの\n声援が多かったと書いています。"}, {"t": 386.9166666666667, "x": "その声援が、試合の中で\n馬場への声援に変わりました。"}, {"t": 391.05, "x": "記事が挙げる馬場の技は、河津掛けです。"}, {"t": 394.1, "x": "左腕へのアームブリーカーでも攻めています。"}, {"t": 396.9, "x": "東京スポーツの記事には、\nこの夜の写真も1枚載っています。"}, {"t": 401.18333333333334, "x": "写真の説明はこうです。"}, {"t": 403.15, "x": "ハンセンに32文ドロップキックを放つ馬場。"}, {"t": 406.15, "x": "試合時間は12分39秒です。"}, {"t": 409.06666666666666, "x": "裁定は両者反則でした。"}, {"t": 411.1166666666667, "x": "両者反則は、2人ともに反則が取られる裁定です。"}, {"t": 415.0833333333333, "x": "どちらの勝ちにもなりません。"}, {"t": 416.78333333333336, "x": "試合の記録にも、\n12分39秒の両者反則とあります。"}, {"t": 421.53333333333336, "x": "記事によると、馬場はこれで\n9度目の防衛に成功しました。"}, {"t": 425.8, "x": "初めての一騎打ちは、決着がつかない\nまま終わったことになります。"}, {"t": 430.21666666666664, "x": "この試合は、その年の暮れに賞を受けました。"}, {"t": 433.5, "x": "東京スポーツ新聞社が決める\nプロレス大賞の年間最高試合賞です。"}, {"t": 438.15, "x": "東京スポーツの記事は、\n1982年度の賞だと書いています。"}, {"t": 443.01666666666665, "x": "デイリースポーツの記事も、プロレス大賞の\n年間最高試合に選ばれたと書いています。"}, {"t": 448.55, "x": "中継の実況とテレビの視聴率の話は、\n以前の動画で取り上げました。"}, {"t": 453.5833333333333, "x": "ここでは、この試合のあとの\n記録を追っていきます。"}, {"t": 457.05, "x": "最終戦の2週間後、馬場はアメリカにいました。"}, {"t": 460.73333333333335, "x": "2月18日はカンザスシティです。"}, {"t": 463.1333333333333, "x": "パートナーと組んだタッグマッチに勝っています。"}, {"t": 465.85, "x": "2月20日からは、フロリダ州を回りました。"}, {"t": 469.1333333333333, "x": "20日はセントピーターズバーグです。"}, {"t": 471.4, "x": "22日はオーランドでした。"}, {"t": 473.31666666666666, "x": "23日はタンパです。"}, {"t": 475.0833333333333, "x": "25日はジャクソンビルでした。"}, {"t": 477.1333333333333, "x": "27日はレイクランドです。"}, {"t": 479.18333333333334, "x": "そして2月28日は、ジョージア州アトランタの\nオムニという会場です。"}, {"t": 484.18333333333334, "x": "馬場は、アメリカのレスラーを\n相手にPWFの王座を守りました。"}, {"t": 488.95, "x": "11分47秒の押さえ込みでの勝ちです。"}, {"t": 492.05, "x": "日本に戻ると、春の大会が始まります。"}, {"t": 495.18333333333334, "x": "3月19日から4月16日までは、\n第10回のチャンピオン・カーニバルでした。"}, {"t": 500.81666666666666, "x": "馬場の最初の試合は、\n3月19日の後楽園ホールです。"}, {"t": 505 function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;

    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
