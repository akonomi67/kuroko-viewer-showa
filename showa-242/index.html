<script>
const D={"name": "藤波辰爾", "file": "242_編集用", "dur": 855.2, "segs": [], "subs": [{"t": 0.0, "x": "1978年1月23日、ニューヨークの\nマディソン・スクエア・ガーデン。"}, {"t": 5.75, "x": "イメージ映像"}, {"t": 5.75, "x": "WWWFジュニアヘビー級選手権試合の\nリングに、1人の日本人が立っていました。"}, {"t": 12.15, "x": "相手は王者、カルロス・ホセ・エストラーダ。"}, {"t": 15.133333333333333, "x": "イメージ映像"}, {"t": 15.133333333333333, "x": "試合の終盤、日本人は王者を背後から\n羽交い締めにしたまま、後ろへ反り投げます。"}, {"t": 21.483333333333334, "x": "イメージ映像"}, {"t": 21.483333333333334, "x": "そのままブリッジで押さえ込み、3カウント。"}, {"t": 24.75, "x": "イメージ映像"}, {"t": 24.75, "x": "場内の歓声は、少し遅れてから\n大きくなったと伝えられています。"}, {"t": 29.383333333333333, "x": "この技には、まだ名前がありませんでした。"}, {"t": 32.4, "x": "投げたのは、24歳の藤波辰巳です。"}, {"t": 35.63333333333333, "x": "イメージ映像"}, {"t": 35.63333333333333, "x": "ところが控室に戻ると、ベルトを巻いた新王者に\n声をかける選手は1人もいませんでした。"}, {"t": 41.666666666666664, "x": "イメージ映像"}, {"t": 41.666666666666664, "x": "そして1か月後、この若者が日本に\n帰ってくると、新日本プロレスの"}, {"t": 46.93333333333333, "x": "会場の客席が変わり始めます。"}, {"t": 49.083333333333336, "x": "24歳の凱旋帰国は、\n団体に何を持ち込んだのでしょうか。"}, {"t": 53.666666666666664, "x": "今回は、藤波辰巳の\nWWWFジュニアヘビー級王座戴冠と、"}, {"t": 59.1, "x": "その後の凱旋帰国を、確認できた日付と\n本人の証言をもとに辿っていきます。"}, {"t": 64.91666666666667, "x": "イメージ映像"}, {"t": 64.91666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 67.41666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 73.0, "x": "藤波辰巳は、1953年12月28日、\n大分県東国東郡武蔵町の生まれです。"}, {"t": 81.01666666666667, "x": "現在の国東市にあたります。"}, {"t": 83.1, "x": "1970年6月、16歳で\n日本プロレスに入門しました。"}, {"t": 88.21666666666667, "x": "デビュー戦は1971年5月9日です。"}, {"t": 91.9, "x": "同じ年の暮れ、アントニオ猪木が日本プロレスを\n離れると、藤波もそのあとを追います。"}, {"t": 98.05, "x": "1972年3月6日、新日本プロレスの\n旗揚げ戦のリングにも上がりました。"}, {"t": 104.16666666666667, "x": "1974年には、\nカール・ゴッチ杯争奪リーグ戦で優勝しています。"}, {"t": 109.7, "x": "1975年6月、藤波は海外遠征に出発します。"}, {"t": 114.81666666666666, "x": "最初の行き先は西ドイツでした。"}, {"t": 117.01666666666667, "x": "同じ年の11月からは、\nアメリカ・フロリダ州タンパにある"}, {"t": 120.98333333333333, "x": "カール・ゴッチの自宅で練習を積みます。"}, {"t": 123.35, "x": "イメージ映像"}, {"t": 123.35, "x": "Number Webの記事によると、\nゴッチの練習はブリッジで始まって"}, {"t": 127.5, "x": "ブリッジに終わるようなもので、\n特に首を鍛えることに重点が置かれていました。"}, {"t": 132.41666666666666, "x": "イメージ映像"}, {"t": 132.41666666666666, "x": "1976年3月にはノースカロライナ州の\nジム・クロケット・プロモーションズに"}, {"t": 137.46666666666667, "x": "参戦し、ドクター・フジナミという\nリングネームで戦いました。"}, {"t": 141.48333333333332, "x": "イメージ映像"}, {"t": 141.48333333333332, "x": "1977年3月、アメリカでの修行を終えると、\n次はメキシコのUWAに移ります。"}, {"t": 149.0, "x": "ここではカネックというマスクマンと、\n何度もシングルマッチで対戦しました。"}, {"t": 153.81666666666666, "x": "ヨーロッパ、アメリカ、メキシコ。"}, {"t": 156.8, "x": "藤波は後に、この3か所に\nついてこう振り返っています。"}, {"t": 160.9, "x": "この３つを経験したことで、どんなスタイルにも\n対応できるようなレスラーに成長できたと思う。"}, {"t": 166.93333333333334, "x": "その修行の途中で、ゴッチは藤波に\n1つの投げ技を教えていました。"}, {"t": 171.9, "x": "Number Webのインタビューで、\n藤波はゴッチの言葉をこう紹介しています。"}, {"t": 176.83333333333334, "x": "スープレックスにはまだ種類がある。"}, {"t": 179.0, "x": "イメージ映像"}, {"t": 179.0, "x": "誰もやったことがないし、危険も\n伴うけれど、相手を羽交い絞めにして、"}, {"t": 184.2, "x": "そのまま反って投げるものもある。"}, {"t": 186.33333333333334, "x": "相手の両腕をフルネルソンという形で\n固めたまま、後ろへ投げる技です。"}, {"t": 191.51666666666668, "x": "イメージ映像"}, {"t": 191.51666666666668, "x": "藤波は、80キロほどのダミー人形を\n相手に練習を重ねました。"}, {"t": 196.26666666666668, "x": "その練習では、藤波自身が何度も\n顔面から落ちたといいます。"}, {"t": 200.86666666666667, "x": "イメージ映像"}, {"t": 200.86666666666667, "x": "人を相手に試すことについて、\n藤波はこう語っています。"}, {"t": 204.93333333333334, "x": "まさか、ゴッチさんを試しに\n投げるわけにもいかない。"}, {"t": 208.48333333333332, "x": "1978年1月、メキシコにいた藤波に、\nニューヨークでのタイトル挑戦が決まります。"}, {"t": 215.53333333333333, "x": "イメージ映像"}, {"t": 215.53333333333333, "x": "舞台は、WWWFの本拠地である\nマディソン・スクエア・ガーデンでした。"}, {"t": 221.28333333333333, "x": "イメージ映像"}, {"t": 221.28333333333333, "x": "WWWFのジュニアヘビー級王座は、\n1965年10月15日に創設されたベルトです。"}, {"t": 228.93333333333334, "x": "イメージ映像"}, {"t": 228.93333333333334, "x": "その後しばらく途絶えていましたが、\n1978年1月に復活していました。"}, {"t": 234.76666666666668, "x": "藤波は、このベルトの第3代王者になります。"}, {"t": 238.21666666666667, "x": "ゴッチからは、試合に\n臨む心構えも授けられていました。"}, {"t": 242.31666666666666, "x": "どんな相手であろうと自分の\nイメージした動きをぶつけろ。"}, {"t": 245.71666666666667, "x": "1月23日、藤波はエストラーダを相手に、\n人形でしか試したことのない投げ技を"}, {"t": 252.25, "x": "初めて実戦で使います。"}, {"t": 253.98333333333332, "x": "イメージ映像"}, {"t": 253.98333333333332, "x": "結果は3カウント。"}, {"t": 255.56666666666666, "x": "東京スポーツの連載で、\n藤波は、当時は名前すらなく、"}, {"t": 260.0833333333333, "x": "ゴッチでさえやったことのない技だったと\n振り返っています。"}, {"t": 263.8666666666667, "x": "イメージ映像"}, {"t": 263.8666666666667, "x": "のちにこの技は、藤波の愛称から\nドラゴン・スープレックスと"}, {"t": 267.93333333333334, "x": "呼ばれるようになります。"}, {"t": 269.21666666666664, "x": "日本語では飛龍原爆固めです。"}, {"t": 271.56666666666666, "x": "イメージ映像"}, {"t": 271.56666666666666, "x": "しかし、勝った直後の控室は、\n祝福の空気ではありませんでした。"}, {"t": 276.8666666666667, "x": "藤波の言葉です。"}, {"t": 278.3, "x": "意気揚々控え室に戻ったら、針のむしろですよ。"}, {"t": 281.9, "x": "控室には、ブルーノ・サンマルチノらWWWFの\nトップ選手たちがいました。"}, {"t": 287.56666666666666, "x": "イメージ映像"}, {"t": 287.56666666666666, "x": "それでも、\n声をかけてくる選手はいなかったといいます。"}, {"t": 291.3, "x": "藤波は、その理由をこう考えています。"}, {"t": 294.46666666666664, "x": "それだけ危険な技に映ったのだろう。"}, {"t": 296.8666666666667, "x": "そんな藤波に、新日本プロレスの新間寿は、\nいや、すごい、よかったよ、と声をかけました。"}, {"t": 305.2, "x": "イメージ映像"}, {"t": 305.2, "x": "藤波はこう返しています。"}, {"t": 307.1333333333333, "x": "何がよかったんですか。"}, {"t": 308.6666666666667, "x": "イメージ映像"}, {"t": 308.6666666666667, "x": "控室行ってみてくださいよ。"}, {"t": 310.55, "x": "人の気も知らないで。"}, {"t": 311.93333333333334, "x": "イメージ映像"}, {"t": 311.93333333333334, "x": "一方で、プロモーターの\nビンス・マクマホン・シニアは、よかったよ、"}, {"t": 316.4166666666667, "x": "フィニッシュも素晴らしかった、と\n試合をほめたと語られています。"}, {"t": 320.81666666666666, "x": "藤波は、あの試合をこう振り返っています。"}, {"t": 324.1, "x": "もし大怪我させていたら、\nリングから永久追放されたでしょうね。"}, {"t": 328.4, "x": "イメージ映像"}, {"t": 328.4, "x": "ベルトを取った藤波は、\nすぐには日本に戻りませんでした。"}, {"t": 332.43333333333334, "x": "イメージ映像"}, {"t": 332.43333333333334, "x": "週刊プロレスの記事によると、帰国した時点で、\nすでにロサンゼルスとニューヨークで"}, {"t": 338.01666666666665, "x": "2度の防衛に成功していました。"}, {"t": 340.03333333333336, "x": "そして1978年2月、\n藤波は羽田空港に降り立ちます。"}, {"t": 345.26666666666665, "x": "イメージ映像"}, {"t": 345.26666666666665, "x": "1975年6月に日本を出てから、\n2年8か月が経っていました。"}, {"t": 350.6, "x": "空港の様子について、藤波はこう話しています。"}, {"t": 354.26666666666665, "x": "行くときは誰も見送ってくれなかったのに、\nファンがいっぱいいるんです。"}, {"t": 358.53333333333336, "x": "イメージ映像"}, {"t": 358.53333333333336, "x": "半分はサクラで新日本プロレスの\n仕掛けだったのかもしれないけれど。"}, {"t": 362.68333333333334, "x": "イメージ映像"}, {"t": 362.68333333333334, "x": "凱旋シリーズの開幕は、1978年3月3日、\n群馬県の高崎市体育館です。"}, {"t": 370.1166666666667, "x": "相手はマスクド・カナディアン。"}, {"t": 371.9, "x": "マスクの下は、当時まだ無名だった\nロディ・パイパーでした。"}, {"t": 375.51666666666665, "x": "イメージ映像"}, {"t": 375.51666666666665, "x": "藤波はこの試合を、日本で初めて見せた\nドラゴン・スープレックスで締めくくります。"}, {"t": 380.81666666666666, "x": "試合後、リング上でマイクを向けられた藤波の\n口から、ある英語が出ました。"}, {"t": 386.3333333333333, "x": "アイ・ネバー・ギブアップ。"}, {"t": 387.6333333333333, "x": "イメージ映像"}, {"t": 387.6333333333333, "x": "東京スポーツの連載によると、\n藤波は何も用意していませんでした。"}, {"t": 392.3666666666667, "x": "それでもこの言葉は、その後の藤波の\nキャッチコピーになっていきます。"}, {"t": 396.8666666666667, "x": "イメージ映像"}, {"t": 396.8666666666667, "x": "このシリーズの日程は、\n日本国内だけでは終わりませんでした。"}, {"t": 401.05, "x": "3月18日に愛知県豊明市で試合をすると、\n現地時間の3月20日にはニューヨークの"}, {"t": 407.45, "x": "マディソン・スクエア・ガーデンで防衛戦。"}, {"t": 409.68333333333334, "x": "そして3月22日には、\n滋賀県大津市のリングに立っています。"}, {"t": 414.35, "x": "週刊プロレスはこの日程を、\nニューヨーク日帰りと表現しました。"}, {"t": 418.98333333333335, "x": "太平洋を往復しながら、1本の\nベルトを守っていたことになります。"}, {"t": 423.6666666666667, "x": "イメージ映像"}, {"t": 423.6666666666667, "x": "会場の空気も変わっていきました。"}, {"t": 425.85, "x": "新日本プロレスの会場に、\n若い女性ファンが集まるようになったのです。"}, {"t": 430.76666666666665, "x": "藤波の人気は、ドラゴン・ブームと呼ばれました。"}, {"t": 434.0833333333333, "x": "Wikipediaは、この時期の藤波が、\nそれまでのプロレスファンに加えて女性や"}, {"t": 439.26666666666665, "x": "子供のファンからも支持を得たと記しています。"}, {"t": 441.85, "x": "さらに、日本のプロレス界に\nジュニアヘビー級というジャンルを"}, {"t": 445.65, "x": "定着させた、とも書いています。"}, {"t": 447.95, "x": "イメージ映像"}, {"t": 447.95, "x": "ヘビー級より体重の軽い選手たちの階級が、\n日本のリングで1つの看板になっていきました。"}, {"t": 454.18333333333334, "x": "ブームは、本人に新しい重さも持ち込みました。"}, {"t": 457.78333333333336, "x": "連載で藤波は、新間から、何かやれよ、今日また\n何かないのか、と言われたと明かしています。"}, {"t": 465.1, "x": "藤波は、何か新しいことをしないと、と\n考え続けたといいます。"}, {"t": 470.1333333333333, "x": "ドラゴン・ス 3333333333, "x": "イメージ映像"}, {"t": 601.2333333333333, "x": "当時の自分については、こうも話しています。"}, {"t": 604.4833333333333, "x": "頭の中はカール・ゴッチに\nマインドコントロールされていて、"}, {"t": 607.8833333333333, "x": "まったく恐怖心のないイケイケだった。"}, {"t": 610.7, "x": "イメージ映像"}, {"t": 610.7, "x": "ベルトの歴史にも、数字が残っています。"}, {"t": 613.6666666666666, "x": "1979年10月2日、大阪府立体育会館で、\n藤波は剛竜馬に敗れて王座を失いました。"}, {"t": 621.8833333333333, "x": "しかし2日後の10月4日、\n蔵前国技館で取り返しています。"}, {"t": 626.6166666666667, "x": "この頃、団体の名前が変わったことで、\nベルトはWWFジュニアヘビー級王座と"}, {"t": 632.75, "x": "呼ばれるようになっていました。"}, {"t": 634.2833333333333, "x": "ドラゴン・スープレックスは、\n1980年3月に対戦相手が相次いで"}, {"t": 639.5666666666667, "x": "首を痛めたとされ、使用が封印されます。"}, {"t": 642.7166666666667, "x": "ただしこの負傷は、技の破壊力を見せるための\n筋書きだったとも伝えられています。"}, {"t": 648.0166666666667, "x": "封印が解かれたのは、1985年のことでした。"}, {"t": 652.1666666666666, "x": "1981年4月23日、蔵前国技館で、\n1人のマスクマンがデビューします。"}, {"t": 659.3, "x": "初代タイガーマスクです。"}, {"t": 660.9833333333333, "x": "イメージ映像"}, {"t": 660.9833333333333, "x": "藤波は連載で、この年を\n転機の年と振り返っています。"}, {"t": 665.2666666666667, "x": "イメージ映像"}, {"t": 665.2666666666667, "x": "結婚して生活に余裕が生まれ、\n体が自然と大きくなったこと。"}, {"t": 669.9666666666667, "x": "そしてタイガーマスクの台頭が、\nヘビー級への転向を後押ししたこと。"}, {"t": 674.7666666666667, "x": "結婚は、1981年12月のことでした。"}, {"t": 678.95, "x": "1981年10月16日、地元の大分で\n行った防衛戦が、ジュニア王者としての"}, {"t": 686.0, "x": "最後の防衛戦になりました。"}, {"t": 687.8, "x": "藤波はその年のうちにベルトを返上します。"}, {"t": 690.8333333333334, "x": "このベルトの最長保持記録として、\n藤波の789日という数字が残っています。"}, {"t": 696.9666666666667, "x": "そして1982年1月1日、\n後楽園ホールで、このベルトは"}, {"t": 702.8333333333334, "x": "タイガーマスクの腰に巻かれました。"}, {"t": 704.8, "x": "イメージ映像"}, {"t": 704.8, "x": "藤波が持ち帰ったジュニアヘビー級という舞台は、\n次の選手に引き継がれたことになります。"}, {"t": 710.7166666666667, "x": "イメージ映像"}, {"t": 710.7166666666667, "x": "このベルトは、WWFと\n新日本プロレスの提携が終わったことで、"}, {"t": 716.0166666666667, "x": "1985年10月31日に封印されました。"}, {"t": 720.4666666666667, "x": "ヘビー級に転向した藤波は、\n1982年1月から飛龍十番勝負に臨みます。"}, {"t": 727.1, "x": "イメージ映像"}, {"t": 727.1, "x": "同じ年の8月30日には、再び\nマディソン・スクエア・ガーデンで、今度は"}, {"t": 732.5, "x": "WWFインターナショナル・ヘビー級王座を\n獲得しました。"}, {"t": 736.4333333333333, "x": "その2か月後の10月8日、後楽園ホールで、\n長州力が藤波に反旗を翻します。"}, {"t": 743.3333333333334, "x": "ここから先は、また別の物語です。"}, {"t": 746.1833333333333, "x": "イメージ映像"}, {"t": 746.1833333333333, "x": "では、24歳の凱旋帰国は、\n新日本プロレスの何を変えたのでしょうか。"}, {"t": 751.9666666666667, "x": "イメージ映像"}, {"t": 751.9666666666667, "x": "記録を並べると、変わったものは\n少なくとも3つあったように見えます。"}, {"t": 756.5833333333334, "x": "1つ目は客席です。"}, {"t": 758.1833333333333, "x": "それまでの観客に加えて、若い女性や\n子供が会場に来るようになりました。"}, {"t": 763.4166666666666, "x": "イメージ映像"}, {"t": 763.4166666666666, "x": "2つ目は、リングの上の試合の種類です。"}, {"t": 766.4666666666667, "x": "日本のプロレス界にジュニアヘビー級という\nジャンルが根づき、3年後には"}, {"t": 771.0333333333333, "x": "タイガーマスクがその場所を受け継ぎました。"}, {"t": 773.3833333333333, "x": "3つ目は、団体の中の順番です。"}, {"t": 776.2666666666667, "x": "帰国したその年の5月には、藤波は師匠の\n猪木と一騎打ちをする位置にいました。"}, {"t": 781.7833333333333, "x": "イメージ映像"}, {"t": 781.7833333333333, "x": "周囲からは、全日本の鶴田と\n並べて見られる立場にもなっていました。"}, {"t": 786.45, "x": "一方で、その変化を背負った本人は、毎回何か\n新しいものを見せることを求められ、代名詞の"}, {"t": 794.05, "x": "技を乱発してしまったと振り返っています。"}, {"t": 796.7, "x": "MSGの控室で浴びた冷たい視線と、\n日本の会場で浴びた歓声。"}, {"t": 801.8166666666667, "x": "その両方は、ゴッチから教わった同じ1つの\n投げ技から生まれていました。"}, {"t": 806.7666666666667, "x": "そして、たまたま口から出た\nネバー・ギブアップという言葉は、その後、"}, {"t": 811.45, "x": "藤波の座右の銘として語られていきます。"}, {"t": 814.4166666666666, "x": "藤波辰巳は、1990年に\nリングネームを藤波辰爾へ改めています。"}, {"t": 820.1666666666666, "x": "イメージ映像"}, {"t": 820.1666666666666, "x": "2015年3月28日、\nアメリカ・カリフォルニア州サンノゼで、"}, {"t": 825.0333333333333, "x": "藤波辰爾はWWEの殿堂入りを果たしました。"}, {"t": 828.9833333333333, "x": "イメージ映像"}, {"t": 828.9833333333333, "x": "37年前、控室で誰にも\n声をかけられなかった若者の名前は、"}, {"t": 834.2166666666667, "x": "その団体の歴史に刻まれています。"}, {"t": 836.7833333333333, "x": "今回の物語を通して、皆様の中に\n藤波辰巳という1人のプロレスラーの"}, {"t": 842.0666666666667, "x": "新しい一面が刻まれていれば幸いです。"}, {"t": 844.85, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 848.2, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
