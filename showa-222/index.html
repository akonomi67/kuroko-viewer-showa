<script>
const D={"name": "全日本プロレス中継のゴールデン撤退", "file": "222_編集用", "dur": 844.1833125, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1988年3月26日、土曜日の夜7時。"}, {"t": 5.05, "x": "茨城県古河市立体育館からの生中継でした。"}, {"t": 8.433333333333334, "x": "カードは、\nチャンピオン・カーニバルの開幕戦です。"}, {"t": 11.85, "x": "この放送が、土曜7時の\n全日本プロレス中継の最後になりました。"}, {"t": 16.666666666666668, "x": "翌月から、放送は日曜の\n夜10時33分に移ります。"}, {"t": 21.2, "x": "そして同じ1988年の4月、\n新日本プロレスのワールドプロレスリングも、"}, {"t": 27.1, "x": "月曜の夜8時から土曜の夕方4時へ移りました。"}, {"t": 30.8, "x": "イメージ映像"}, {"t": 30.8, "x": "この春、テレビの夜の時間帯から、\nレギュラーのプロレス中継が無くなります。"}, {"t": 36.25, "x": "なぜ、ゴールデンタイムに戻ってわずか\n2年半で、プロレスはまた画面から"}, {"t": 41.7, "x": "降ろされたのでしょうか。"}, {"t": 43.0, "x": "今回は、日本テレビの\n全日本プロレス中継という番組の"}, {"t": 47.13333333333333, "x": "放送枠が、どう動いていったのかを、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 53.166666666666664, "x": "最後までご覧いただければ幸いです。"}, {"t": 55.666666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 61.233333333333334, "x": "イメージ映像"}, {"t": 61.233333333333334, "x": "まず、この番組がどこから\n始まったのかを確認しておきます。"}, {"t": 65.61666666666666, "x": "放送開始は1972年10月7日、土曜日です。"}, {"t": 70.26666666666667, "x": "時間は夜8時から8時55分まででした。"}, {"t": 73.53333333333333, "x": "当初は全国29局ネットです。"}, {"t": 76.06666666666666, "x": "イメージ映像"}, {"t": 76.06666666666666, "x": "1975年10月からは、\n終わりが8時54分になりました。"}, {"t": 81.45, "x": "視聴率の記録も、専門誌の資料に残っています。"}, {"t": 85.28333333333333, "x": "1973年の7月から9月にかけての数字は、\n7パーセントから9パーセントでした。"}, {"t": 91.88333333333334, "x": "同じ年の8月には、\n4パーセントという回もあります。"}, {"t": 95.85, "x": "もちろん、数字が跳ねた日もありました。"}, {"t": 98.8, "x": "1973年11月24日、\n柔道のアントン・ヘーシンクのデビュー戦の"}, {"t": 104.68333333333334, "x": "中継は、およそ18パーセントです。"}, {"t": 107.53333333333333, "x": "イメージ映像"}, {"t": 107.53333333333333, "x": "ただ、この時間帯には強い相手がいました。"}, {"t": 110.66666666666667, "x": "裏に立っていたのは、30パーセントを\n超えていた土曜8時のバラエティです。"}, {"t": 115.45, "x": "1975年4月からは、もう1つ別の\n人気番組も並びました。"}, {"t": 120.75, "x": "イメージ映像"}, {"t": 120.75, "x": "そして1979年です。"}, {"t": 123.28333333333333, "x": "1979年3月31日、\n新潟県三条市厚生福祉会館。"}, {"t": 129.45, "x": "チャンピオン・カーニバル第25戦の\n生中継でした。"}, {"t": 132.76666666666668, "x": "この放送をもって、\n土曜の夜8時という枠は終わります。"}, {"t": 137.03333333333333, "x": "6年半で降りたことになります。"}, {"t": 139.1, "x": "1979年4月7日からの新しい枠は、土曜の\n夕方5時30分から6時24分まででした。"}, {"t": 147.08333333333334, "x": "区分も変わっています。"}, {"t": 148.55, "x": "全国同時に売る枠ではなく、\nローカルセールス枠になりました。"}, {"t": 152.85, "x": "当時の日本テレビで、夕方5時台の\n合格ラインは7パーセントから"}, {"t": 157.41666666666666, "x": "8パーセントだったと記録されています。"}, {"t": 159.66666666666666, "x": "そして、この移動で中継の中身が変わりました。"}, {"t": 163.08333333333334, "x": "1つ目です。"}, {"t": 164.13333333333333, "x": "レギュラーの放送が、\n生中継から原則録画中継になりました。"}, {"t": 168.75, "x": "2つ目です。"}, {"t": 169.78333333333333, "x": "リングを囲んでいたスポンサー付きの横幕が消え、\n提供スポンサーの読み上げもなくなりました。"}, {"t": 175.81666666666666, "x": "試合後の花束贈呈の口上も変わります。"}, {"t": 178.86666666666667, "x": "それまでスポンサー名が読まれていたところが、\n日本テレビと地方の協力局より花束の"}, {"t": 184.48333333333332, "x": "贈呈です、という形になりました。"}, {"t": 187.36666666666667, "x": "イメージ映像"}, {"t": 187.36666666666667, "x": "3つ目です。"}, {"t": 188.35, "x": "ローカルセールス枠になったため、\n同時にネットする局が減りました。"}, {"t": 192.85, "x": "週末の午後や深夜のローカル枠に\n回した地域がほとんどです。"}, {"t": 196.9, "x": "一時的に打ち切った局もありました。"}, {"t": 199.28333333333333, "x": "長崎県では、この1979年4月で\nレギュラーの生中継が完全に消えています。"}, {"t": 205.88333333333333, "x": "もう1つ、録画中継になったことで\n起きたことがあります。"}, {"t": 209.86666666666667, "x": "局の判断で、試合の\n中身が切られるようになりました。"}, {"t": 213.63333333333333, "x": "1980年4月18日、大阪府立体育館の\nテリー・ファンク対アブドーラ・ザ・ブッチャー。"}, {"t": 220.33333333333334, "x": "この試合は、途中から静止画に\n切り替えられています。"}, {"t": 224.11666666666667, "x": "同じ年の5月2日、後楽園ホールの\nブッチャー対ザ・シーク。"}, {"t": 228.53333333333333, "x": "この試合は放送されませんでした。"}, {"t": 230.88333333333333, "x": "実況を担当していたアナウンサーが場外で\n襲われ、額を割って病院へ運ばれた試合です。"}, {"t": 237.2, "x": "生中継であれば、\nそのまま流れていたはずのものでした。"}, {"t": 241.1, "x": "イメージ映像"}, {"t": 241.1, "x": "録画だからできた処理です。"}, {"t": 242.83333333333334, "x": "この夕方の枠が、6年半続きます。"}, {"t": 246.03333333333333, "x": "イメージ映像"}, {"t": 246.03333333333333, "x": "なお、この時代の中継で実際に\n流れていた試合は、そう多くありません。"}, {"t": 251.66666666666666, "x": "1984年当時に実況を担当し始めた\nアナウンサーによれば、テレビに"}, {"t": 257.3333333333333, "x": "乗るのは、だいたい3試合でした。"}, {"t": 259.71666666666664, "x": "セミファイナルとメインは、チーフの\nアナウンサーが担当したといいます。"}, {"t": 264.2, "x": "1試合の長い興行のうち、視聴者が見ていたのは\n3試合ぶんだった、ということになります。"}, {"t": 270.78333333333336, "x": "ただし、特別番組では数字が出ていました。"}, {"t": 274.3666666666667, "x": "土曜トップスペシャルという枠です。"}, {"t": 276.55, "x": "1983年2月26日、\nハーリー・レイス対ジャイアント馬場の"}, {"t": 281.76666666666665, "x": "PWF戦の録画中継で16.4パーセント。"}, {"t": 285.5, "x": "1984年2月23日、\nニック・ボックウィンクル対ジャンボ鶴田の"}, {"t": 290.96666666666664, "x": "AWA戦の生中継で14.9パーセント。"}, {"t": 294.46666666666664, "x": "1984年3月24日、\n馬場対スタン・ハンセンと、"}, {"t": 299.3, "x": "鶴田対ボックウィンクルを\n並べた生中継で16.5パーセント。"}, {"t": 303.73333333333335, "x": "レギュラーの側の数字も1つ残っています。"}, {"t": 306.5, "x": "1985年3月9日、船橋市民体育館の\n録画中継で13.6パーセントです。"}, {"t": 313.71666666666664, "x": "イメージ映像"}, {"t": 313.71666666666664, "x": "同じ日の両国国技館のこけら落としは、\n土曜トップスペシャルの生中継で"}, {"t": 318.7, "x": "10.9パーセントでした。"}, {"t": 320.4, "x": "そして1985年8月、\n日本テレビが発表します。"}, {"t": 325.1666666666667, "x": "10月19日から、土曜の\n夜7時に戻す、という内容でした。"}, {"t": 330.3833333333333, "x": "1985年10月19日、後楽園ホール。"}, {"t": 334.8, "x": "ワールド・チャンピオン・カーニバル第12戦の\n生中継です。"}, {"t": 338.3333333333333, "x": "枠は土曜の7時から7時54分まで。"}, {"t": 341.3666666666667, "x": "6年半ぶりのゴールデンタイム復帰でした。"}, {"t": 344.06666666666666, "x": "この復帰について、当時この番組の\nプロデューサーだった人物が、"}, {"t": 348.53333333333336, "x": "後年こういう趣旨のことを語っています。"}, {"t": 351.4, "x": "ゴールデンタイムへの復帰は、必ずしも\n長州力らの参戦が決め手になったわけではない。"}, {"t": 357.18333333333334, "x": "土曜トップスペシャルでの実績が試金石になった。"}, {"t": 360.3666666666667, "x": "つまり、看板が増えたからではなく、\n特番で出した数字が根拠だった、という説明です。"}, {"t": 367.4, "x": "復帰して変わったことも記録されています。"}, {"t": 369.93333333333334, "x": "レギュラーの実況生中継が復活しました。"}, {"t": 372.8833333333333, "x": "イメージ映像"}, {"t": 372.8833333333333, "x": "生中継の日は、通常18時30分開始の\n興行を、17時開始や18時開始に"}, {"t": 379.6333333333333, "x": "繰り上げて対応しています。"}, {"t": 381.23333333333335, "x": "同時にネットする局は、\n土曜8時台のころより多くなりました。"}, {"t": 385.6166666666667, "x": "熊本県では13年5か月ぶり、\n長野県では1年半ぶりに、"}, {"t": 390.53333333333336, "x": "レギュラーの生中継が戻っています。"}, {"t": 393.2, "x": "花束贈呈の口上にも、番組の\nスポンサーより、という言葉が戻りました。"}, {"t": 398.8666666666667, "x": "1986年11月1日には、\n七尾総合市民体育館からの生中継で"}, {"t": 405.1666666666667, "x": "17.1パーセントを記録しています。"}, {"t": 407.6666666666667, "x": "元横綱の輪島大士のデビュー戦でした。"}, {"t": 410.3833333333333, "x": "イメージ映像"}, {"t": 410.3833333333333, "x": "そして1988年3月26日です。"}, {"t": 414.1, "x": "冒頭の放送です。"}, {"t": 415.6166666666667, "x": "茨城県古河市立体育館、\nチャンピオン・カーニバルの開幕戦。"}, {"t": 420.06666666666666, "x": "この生中継で、土曜7時の枠は終わりました。"}, {"t": 423.75, "x": "レギュラーの生中継も、ここで終わっています。"}, {"t": 427.0, "x": "その翌日の3月27日には、\n日本武道館で鶴田対ブルーザー・ブロディ、"}, {"t": 432.3333333333333, "x": "天龍源一郎対ハンセンが組まれていました。"}, {"t": 435.5, "x": "カードとしては、\n大きなものが並んでいた時期です。"}, {"t": 438.95, "x": "ここで、正直に書いておきます。"}, {"t": 441.48333333333335, "x": "1988年4月に、なぜ土曜7時から\n外されたのか。"}, {"t": 446.3833333333333, "x": "その理由を書いた記録は、\n今回確認できませんでした。"}, {"t": 450.35, "x": "視聴率が落ちたからだ、裏番組に\n負けたからだ、とは書けません。"}, {"t": 455.21666666666664, "x": "確認できるのは、編成の事実だけです。"}, {"t": 458.31666666666666, "x": "空いた土曜7時台には、\n2時間の特番枠が入りました。"}, {"t": 462.45, "x": "移った先の日曜10時30分台は、\nそれまで海外ドラマを流していた枠です。"}, {"t": 468.1, "x": "そのドラマを一度中断して、\nプロレスが入りました。"}, {"t": 471.71666666666664, "x": "新しい枠は、日曜の\n22時33分から23時26分まで。"}, {"t": 477.1666666666667, "x": "22時30分から33分までは予告の番組でした。"}, {"t": 481.28333333333336, "x": "イメージ映像"}, {"t": 481.28333333333336, "x": "区分はローカル枠に戻り、\n中継も録画に戻ります。"}, {"t": 485.0833333333333, "x": "生中継は、ここで消えました。"}, {"t": 487.6, "x": "プロ野球の延長で放送が\n動かされることは無くなりました。"}, {"t": 491.26666666666665, "x": "延長のときは、そのまま後ろへずれるだけです。"}, {"t": 494.6, "x": "そして、同時にネットする局は、また減りました。"}, {"t": 498.48333333333335, "x": "同じ1988年の4月、\n新日本プロレスの中継も月曜の夜8時から"}, {"t": 504.48333333333335, "x": "土曜の夕方4時へ移っています。"}, {"t": 506.6166666666667, "x": "後年、この時期について\nこう記した書き手がいます。"}, {"t": 510.23333333333335, "x": "日本テレビの全日本プロレス中継も\n1988年4月に土曜夜7時から"}, {"t": 515.8, "x": "日曜夜10時半に移行した。"}, {"t": 517.7333333333333, "x": "フツーのテレビのプロレス番組は、\n昭和の終わりにはゴールデンタイムから"}, {"t": 522.15, "x": "完全に姿を消したのだった。"}, {"t": 524.05, "x": "昭和は、この翌年の1月に終わります。"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);

  if(i+1<D.subs.length) go(D.subs[i+1].t)};

  if(k===' '){e.preventDefault();pp.onclick()}

  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
