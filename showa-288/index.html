<script>
const D={"name": "ネックブリーカー初公開の夜", "file": "288_編集用", "dur": 933.7, "segs": [], "subs": [{"t": 0.0, "x": "走ってきた相手の首に左の腕を掛ける。"}, {"t": 2.6333333333333333, "x": "そのまま後ろへ倒れ込む。"}, {"t": 4.383333333333334, "x": "相手は後頭部からマットにたたきつけられる。"}, {"t": 7.1, "x": "ジャイアント馬場の、\nランニング・ネックブリーカー・ドロップです。"}, {"t": 10.85, "x": "馬場の公式年表は、この技が\n初めて出た試合を書き残しています。"}, {"t": 15.666666666666666, "x": "相手は、アメリカから来た\nNWA世界ヘビー級王者でした。"}, {"t": 20.216666666666665, "x": "試合は60分を戦い切って、\n時間切れになりました。"}, {"t": 24.216666666666665, "x": "場所は東京体育館、\n1969年12月3日の夜です。"}, {"t": 29.583333333333332, "x": "この試合は、なぜこの日に組まれたのでしょうか？"}, {"t": 32.96666666666667, "x": "前の晩の大阪のリングでは、\n何が起きていたのでしょうか？"}, {"t": 37.11666666666667, "x": "今回は、1969年12月3日の\n60分を追います。"}, {"t": 42.233333333333334, "x": "王者が日本に来た日から順に見ていきます。"}, {"t": 44.93333333333333, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 49.5, "x": "新聞の記事や公式年表も、\n合わせて見ていきます。"}, {"t": 53.4, "x": "最後までご覧いただければ幸いです。"}, {"t": 55.9, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 61.46666666666667, "x": "まずこの夜の相手です。"}, {"t": 63.083333333333336, "x": "王者は1941年2月3日に生まれました。"}, {"t": 66.76666666666667, "x": "生まれたのは、アメリカの\nインディアナ州のインディアナポリスです。"}, {"t": 70.66666666666667, "x": "父親もプロレスラーでした。"}, {"t": 72.46666666666667, "x": "弟ものちにプロレスラーになっています。"}, {"t": 74.91666666666667, "x": "王者は大学で、アメリカンフットボールの\n選手をしていました。"}, {"t": 79.11666666666666, "x": "1962年には、大学のチームで\nサンボウルという大きな試合に勝っています。"}, {"t": 84.98333333333333, "x": "1969年2月11日、\nアメリカのフロリダ州タンパです。"}, {"t": 90.31666666666666, "x": "王者は前の王者を破りました。"}, {"t": 92.43333333333334, "x": "そしてNWA世界ヘビー級王座を取りました。"}, {"t": 95.71666666666667, "x": "東京スポーツによるとこのとき28歳でした。"}, {"t": 98.81666666666666, "x": "当時のプロレスで一番上とされたベルトです。"}, {"t": 101.65, "x": "得意な技はスピニング・トーホールドでした。"}, {"t": 104.26666666666667, "x": "相手の足を取って締め上げる技です。"}, {"t": 106.71666666666667, "x": "足を取ったまま自分がその場で回ります。"}, {"t": 109.4, "x": "東京スポーツは、王者の\nオリジナルの技だと書いています。"}, {"t": 113.35, "x": "日本で世界王座がかけられた試合には、\n前の例がありました。"}, {"t": 117.58333333333333, "x": "1957年の春、力道山はアメリカの\nセントルイスで当時の世界王者に会っています。"}, {"t": 124.03333333333333, "x": "王者はここで、日本で王座を\n守る試合をする契約に名前を書きました。"}, {"t": 128.93333333333334, "x": "10月2日その王者が日本に来ます。"}, {"t": 131.48333333333332, "x": "日本に来た初めての世界ヘビー級王者でした。"}, {"t": 134.56666666666666, "x": "10月7日東京の後楽園球場です。"}, {"t": 137.55, "x": "力道山がこの王者に挑みました。"}, {"t": 139.81666666666666, "x": "日本で初めての世界ヘビー級王座の試合です。"}, {"t": 143.03333333333333, "x": "観客は3万人でした。"}, {"t": 144.91666666666666, "x": "試合は時間切れの引き分けです。"}, {"t": 147.13333333333333, "x": "王座は、動いていません。"}, {"t": 149.35, "x": "日本でNWA世界王座がかけられる次の試合は、\n1969年の冬まで待つことになります。"}, {"t": 156.55, "x": "馬場がNWA世界王座に挑むのも、\n初めてではありませんでした。"}, {"t": 161.23333333333332, "x": "1962年3月9日アメリカのシカゴです。"}, {"t": 165.01666666666668, "x": "馬場は当時のNWA世界王者に挑みました。"}, {"t": 168.3, "x": "結果は0対2の負けでした。"}, {"t": 170.23333333333332, "x": "試合の記録では、この年、馬場はアメリカの\n各地で同じ王者に何度も挑んでいます。"}, {"t": 176.41666666666666, "x": "どれも王座は動きませんでした。"}, {"t": 178.43333333333334, "x": "1964年に3つの世界王座へ挑んだ話は、\n以前の動画で取り上げました。"}, {"t": 184.48333333333332, "x": "そして1969年です。"}, {"t": 187.0, "x": "馬場は日本プロレスのエースでした。"}, {"t": 189.2, "x": "1965年11月24日に、\nインターナショナル王座の"}, {"t": 194.06666666666666, "x": "チャンピオンになっています。"}, {"t": 195.51666666666668, "x": "1967年10月31日には、猪木と組みました。"}, {"t": 200.36666666666667, "x": "そして、インターナショナル・タッグ王座を\n取っています。"}, {"t": 203.95, "x": "2人の頭文字から、BI砲と呼ばれたコンビです。"}, {"t": 207.7, "x": "試合の記録では、1969年の秋も、\nこのベルトは2人のものでした。"}, {"t": 213.65, "x": "11月1日は蔵前国技館です。"}, {"t": 216.46666666666667, "x": "BI砲がタッグのベルトを守る試合でした。"}, {"t": 219.3, "x": "相手は、覆面のレスラーと\n外国人のレスラーの組です。"}, {"t": 223.3, "x": "1本目は、わずか59秒でした。"}, {"t": 226.25, "x": "馬場が覆面のレスラーから取りました。"}, {"t": 228.55, "x": "2本目は、17分3秒です。"}, {"t": 231.38333333333333, "x": "覆面のレスラーが猪木を押さえ込みました。"}, {"t": 234.0, "x": "3本目は、7分49秒でした。"}, {"t": 237.23333333333332, "x": "馬場が逆片エビ固めで決めました。"}, {"t": 239.53333333333333, "x": "2対1でベルトを守っています。"}, {"t": 241.71666666666667, "x": "この秋のシリーズで、馬場は\n毎日のようにリングに立っていました。"}, {"t": 246.0, "x": "11月3日は千葉県の市原、\n4日は静岡県の浜松です。"}, {"t": 251.06666666666666, "x": "5日は横浜で1人で戦って勝っています。"},   d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
