<script>
const D={"name": "ミスター・ポーゴ", "file": "269_編集用", "dur": 844.96665625, "segs": [], "subs": [{"t": 0.0, "x": "2017年6月22日、埼玉県内の病院。"}, {"t": 4.533333333333333, "x": "66歳の男が、手術のために麻酔を受けました。"}, {"t": 8.483333333333333, "x": "その途中で血圧が下がり、不整脈が起きます。"}, {"t": 12.283333333333333, "x": "続いて脳梗塞を起こしました。"}, {"t": 14.433333333333334, "x": "手術は中断され、男は別の\n病院へ救急車で運ばれます。"}, {"t": 19.1, "x": "翌日の昼過ぎ、男は息を引き取りました。"}, {"t": 22.416666666666668, "x": "本名は関川哲夫。"}, {"t": 24.116666666666667, "x": "リングの上では、\nミスター・ポーゴと名乗っていました。"}, {"t": 27.366666666666667, "x": "亡くなる前の晩、ポーゴから\n1本の電話が入っています。"}, {"t": 31.483333333333334, "x": "受けたのは、長く敵として戦った大仁田厚でした。"}, {"t": 35.13333333333333, "x": "2人の間には1つの約束がありました。"}, {"t": 37.85, "x": "最後は電流爆破の試合で、\nお互いを送り出すという約束です。"}, {"t": 42.56666666666667, "x": "その試合は行われないまま終わりました。"}, {"t": 45.2, "x": "もう1つ、ポーゴには最初から\n消えていたものがあります。"}, {"t": 49.03333333333333, "x": "本当に名乗るはずだった名前です。"}, {"t": 51.266666666666666, "x": "ポーゴという名前は、\n1文字の読み違いから生まれました。"}, {"t": 55.083333333333336, "x": "読み違いが起きたのはアメリカです。"}, {"t": 57.31666666666667, "x": "新日本プロレスの\n若手だった群馬の青年がいました。"}, {"t": 60.81666666666667, "x": "その青年は、なぜ別の名前の\n悪役として生涯を終えたのでしょうか？"}, {"t": 65.83333333333333, "x": "今回はミスター・ポーゴの歩みを追っていきます。"}, {"t": 68.7, "x": "記録に残った日付と数字をもとに辿っていきます。"}, {"t": 71.9, "x": "最後までご覧いただければ幸いです。"}, {"t": 74.4, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 79.98333333333333, "x": "関川哲夫は1951年、\n群馬県伊勢崎市に生まれました。"}, {"t": 85.23333333333333, "x": "父親は群馬県議会の議員を6期務めた政治家です。"}, {"t": 89.0, "x": "県議会の議長にもなっています。"}, {"t": 91.18333333333334, "x": "関川は地元の県立伊勢崎工業高校を出ました。"}, {"t": 94.8, "x": "そのあと中央大学に進みます。"}, {"t": 97.16666666666667, "x": "しかし大学は途中でやめています。"}, {"t": 99.51666666666667, "x": "次に入ったのは大相撲の世界でした。"}, {"t": 102.08333333333333, "x": "大鵬部屋への入門です。"}, {"t": 103.98333333333333, "x": "ただし相撲の道は長く続きませんでした。"}, {"t": 106.76666666666667, "x": "関川は相撲を廃業し、プロレスへ移ります。"}, {"t": 110.33333333333333, "x": "関川がプロレスに入ったのは、\nある団体の誕生のころです。"}, {"t": 114.61666666666666, "x": "1971年の暮れ、アントニオ猪木は\n日本プロレスを追われます。"}, {"t": 119.86666666666666, "x": "猪木は自分の団体を作ることを決めました。"}, {"t": 122.75, "x": "それが新日本プロレスです。"}, {"t": 124.73333333333333, "x": "旗揚げ戦は1972年3月6日でした。"}, {"t": 128.41666666666666, "x": "こちらの写真は、その旗揚げ戦の\nリングを写したものです。"}, {"t": 132.48333333333332, "x": "右端に立っているのが山本小鉄です。"}, {"t": 135.0, "x": "山本は猪木と一緒にこの団体を\n最初から支えた1人でした。"}, {"t": 139.08333333333334, "x": "関川はこの生まれたばかりの団体に入門します。"}, {"t": 142.41666666666666, "x": "デビュー戦は1972年3月でした。"}, {"t": 145.68333333333334, "x": "相手は藤波辰巳です。"}, {"t": 147.46666666666667, "x": "藤波は1953年12月の生まれです。"}, {"t": 151.06666666666666, "x": "このときはまだ18歳の若手でした。"}, {"t": 153.56666666666666, "x": "2人は旗揚げの月にリングで\n向き合ったことになります。"}, {"t": 156.83333333333334, "x": "その月の大会の様子を書き残した本があります。"}, {"t": 160.15, "x": "1972年3月23日、\n茨城県水戸市の茨城県立スポーツセンター。"}, {"t": 166.68333333333334, "x": "旗上げオープニング・シリーズの8戦目でした。"}, {"t": 169.53333333333333, "x": "この日、1人の高校生がカメラを\n手に会場へ来ていました。"}, {"t": 173.63333333333333, "x": "当時16歳です。"}, {"t": 175.13333333333333, "x": "のちに猪木を\n半世紀にわたって撮り続ける写真家でした。"}, {"t": 178.75, "x": "高校生は友人と2人でした。"}, {"t": 180.96666666666667, "x": "降りたのは水戸の1つ手前の赤塚駅です。"}, {"t": 183.66666666666666, "x": "そこから会場まで歩いています。"}, {"t": 185.86666666666667, "x": "選んだ席は1階席の後ろです。"}, {"t": 188.21666666666667, "x": "リングサイドで写真を撮るためでした。"}, {"t": 190.46666666666667, "x": "その写真家の本によると、\nパンフレットは300円でした。"}, {"t": 194.65, "x": "当日の試合の組み合わせは青い\nインクで書き込まれていました。"}, {"t": 198.33333333333334, "x": "押されたスタンプでは第1試合は\n藤波辰巳対関川哲夫です。"}, {"t": 202.65, "x": "ところが実際に行われたのは、別の試合でした。"}, {"t": 206.3, "x": "藤波と、同じ新日本の若手の一騎打ちです。"}, {"t": 209.88333333333333, "x": "関川の名前は、この試合にはありませんでした。"}, {"t": 213.43333333333334, "x": "関川はこの日、バトルロイヤルに出ています。"}, {"t": 216.66666666666666, "x": "同じリングには山本小鉄らも上がっていました。"}, {"t": 219.51666666666668, "x": "パンフレットの第1試合にあった関川の名前。"}, {"t": 222.68333333333334, "x": "その名前は、第1試合の\nリングにはありませんでした。"}, {"t": 226.71666666666667, "x": "新日本での関川の時間は長くありません。"}, {"t": 229.78333333333333, "x": "関川はほどなく新日本を退団します。"}, {"t": 232.56666666666666, "x": "行き先はアメリカでした。"}, {"t": 234.18333333333334, "x": "旗揚げの年に入った若手が海を渡ったのです。"}, {"t": 237.35, "x": "アメリカで、関川は日本人の\n悪役として各地を回ります。"}, {"t": 241.66666666666666, "x": "そのとき名乗るつもりだった名前があります。"}, {"t": 244.21666666666667, "x": "ミスター・トーゴーです。"}, {"t": 245.61666666666667, "x": "アメリカのプロレスでトーゴーと\nいえば1人の男がいました。"}, {"t": 248.95, "x": "グレート東郷です。"}, {"t": 250.35, "x": "東郷は1950年代のアメリカで、\n日系の悪役として名を上げました。"}, {"t": 255.75, "x": "東京スポーツは、東郷を日系の\n流血王と紹介しています。"}, {"t": 260.28333333333336, "x": "下駄をはき、法被や浴衣を\n着てリングに上がりました。"}, {"t": 263.95, "x": "試合の前には塩をまきます。"}, {"t": 266.0833333333333, "x": "謝るふりをして相手を油断させ、\n反則を重ねました。"}, {"t": 270.05, "x": "この姿は、のちの日系レスラーの\n決まった型になりました。"}, {"t": 273.9166666666667, "x": "東郷のあと、各地の興行主は\n日系のレスラーを求めました。"}, {"t": 278.3833333333333, "x": "東京スポーツはそう伝えています。"}, {"t": 280.6666666666667, "x": "日本プロレスでは、\n外国人選手を呼ぶ役も務めています。"}, {"t": 284.93333333333334, "x": "関川が選んだのは、\nその先輩と同じ響きの名前でした。"}, {"t": 289.18333333333334, "x": "ところが、ここで読み違いが起きます。"}, {"t": 291.9, "x": "TOGOの最初の文字が、\nPと間違えられました。"}, {"t": 295.6666666666667, "x": "TOGOは、POGOになったのです。"}, {"t": 298.93333333333334, "x": "こうしてミスター・ポーゴという名前が\n広まりました。"}, {"t": 301.85, "x": "関川は、この名前を最後まで使い続けています。"}, {"t": 305.55, "x": "2017年の訃報も、\nミスター・ポーゴの名前で出ました。"}, {"t": 309.6666666666667, "x": "1976年、ポーゴは日本の\nリングに戻ってきます。"}, {"t": 314.2, "x": "上がったのは古巣の新日本ではありませんでした。"}, {"t": 317.26666666666665, "x": "選んだのは国際プロレスです。"}, {"t": 319.26666666666665, "x": "レスラー名鑑の記録では、\nこのときの名前はミスター・セキです。"}, {"t": 323.43333333333334, "x": "本名の関川から取った名前でした。"}, {"t": 325.98333333333335, "x": "ポーゴの名前は、\nこのとき日本では使われていません。"}, {"t": 329.6166666666667, "x": "そしてポーゴは、再び北米へ戻りました。"}, {"t": 332.78333333333336, "x": "その国際プロレスは\n1981年8月9日に幕を閉じています。"}, {"t": 337.93333333333334, "x": "15年の歴史でした。"}, {"t": 339.56666666666666, "x": "カナダに、はっきりとした日付が残っています。"}, {"t": 342.8333333333333, "x": "カナダ西部には\nスタンピード・レスリングという団体がありました。"}, {"t": 346.5, "x": "本拠地はカルガリーです。"}, {"t": 348.1666666666667, "x": "1979年12月8日、カナダのエドモントン。"}, {"t": 352.6166666666667, "x": "ポーゴはこの団体で、\n北米ヘビー級王座を取りました。"}, {"t": 356.5833333333333, "x": "王座の記録表に書かれた名前は、\nミスター・セキガワです。"}, {"t": 360.4, "x": "記録表で次の王者が記されているのは\n1980年1月22日です。"}, {"t": 365.73333333333335, "x": "ベルトを持っていた期間は、\n1か月半ほどでした。"}, {"t": 369.31666666666666, "x": "ここまでで、同じ男の名前は4つ出てきました。"}, {"t": 372.93333333333334, "x": "本名の関川。"}, {"t": 374.3, "x": "国際プロレスでのミスター・セキ。"}, {"t": 376.28333333333336, "x": "カナダでのミスター・セキガワ。"}, {"t": 378.03333333333336, "x": "そして読み違いから生まれた\nミスター・ポーゴです。"}, {"t": 380.85, "x": "場所が変わるたびにリングで\n呼ばれる名前も変わっていました。"}, {"t": 384.1666666666667, "x": "1980年代の半ば、\nポーゴは新日本に戻ってきます。"}, {"t": 388.93333333333334, "x": "今度は1人ではありませんでした。"}, {"t": 391.03333333333336, "x": "組んだ相手はケンドー・ナガサキです。"}, {"t": 393.23333333333335, "x": "本名は桜田一男。"}, {"t": 394.9166666666667, "x": "ナガサキもまた海外で名を上げたレスラーでした。"}, {"t": 397.8333333333333, "x": "そのあとで日本に戻っています。"}, {"t": 399.95, "x": "2人はタッグを組み、新日本に参戦しています。"}, {"t": 403.6333333333333, "x": "こちらの写真は1986年11月のナガサキです。"}, {"t": 407.95, "x": "新日本のタッグリーグ戦で撮られました。"}, {"t": 410.6333333333333, "x": "旗揚げの月に第1試合の予定から外れた若手。"}, {"t": 414.03333333333336, "x": "その若手が10年あまりたって戻ってきました。"}, {"t": 416.9, "x": "今度は外から来た悪役としてです。"}, {"t": 419.3, "x": "2人は海の向こうでも組んでいました。"}, {"t": 421.6, "x": "カリブ海の島、プエルトリコです。"}, {"t": 424.18333333333334, "x": "王座の記録では、2人は1987年10月に\n世界タッグ王座を取っています。"}, {"t": 430.26666666666665, "x": "この島の団体の王座です。"}, {"t": 432.2, "x": "1988年1月にも、もう一度取りました。"}, {"t": 436.45, "x": "3月19日に王座はいったん空位になります。"}, {"t": 439.6166666666667, "x": "4月12日、サンフアンで取り返しました。"}, {"t": 443.06666666666666, "x": "5月14日に、また失っています。"}, {"t": 445.93333333333334, "x": "ポーゴの戦う場所は日本と\nプエルトリコにまたがっていました。"}, {"t": 449.5, "x": "その1988年の7月です。"}, {"t": 452.48333333333335, "x": "プエルトリコの会場で事件が起きます。"}, {"t": 454.96666666666664, "x": "7月16日、バヤモンという町の野球場です。"}, {"t": 459.03333333333336, "x": "試合の控室で、ブルーザー・ブロディが\n刃物で刺されました。"}, {"t": 463.06666666666666, "x": "ブロディは翌17日に亡くなっています。"}, {"t": 465.6166666666667, "x": "42歳でした。"}, {"t": 467.0, "x": "日本でも人気の高かった外国人レスラーです。"}, {"t": 470.1166666666667, "x": "ポーゴが王座を取ったのと\n同じ島での出来事でした。"}, {"t": 473.3333333333333, "x": "ここから先、ポーゴは日本の\n小さな団体へ移ります。"}, {"t": 477.28333333333336, "x const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
