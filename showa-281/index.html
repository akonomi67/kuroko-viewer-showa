<script>
const D={"name": "ルスカ", "file": "281_編集用", "dur": 952.3333125, "segs": [], "subs": [{"t": 0.0, "x": "1976年2月6日の夜、\n日本武道館のリングで、柔道着の"}, {"t": 5.916666666666667, "x": "大男が背中からマットに落ちました。"}, {"t": 8.15, "x": "投げたのはアントニオ猪木です。"}, {"t": 10.083333333333334, "x": "同じバックドロップが、3回続けて入りました。"}, {"t": 13.516666666666667, "x": "男の名は、ウィリエム・ルスカ。"}, {"t": 15.766666666666667, "x": "ミュンヘン五輪で、金メダルを\n2つ首に掛けたオランダの柔道家です。"}, {"t": 20.366666666666667, "x": "その柔道家は、この夜より前に、\n柔道の舞台から自分で降りていました。"}, {"t": 25.766666666666666, "x": "東京スポーツの記録では、猪木の\n異種格闘技戦はここから始まっています。"}, {"t": 30.75, "x": "アリとの一戦より4か月\nあまり早い、もう1つの世界一決定戦でした。"}, {"t": 36.2, "x": "金メダルを2つ持つ男は、なぜ柔道を\n手放したのでしょうか？"}, {"t": 40.766666666666666, "x": "そして武道館で敗れたあと、\nどこへ去ったのでしょうか？"}, {"t": 44.7, "x": "今回はルスカという1人の柔道家を追います。"}, {"t": 47.65, "x": "日本のリングに上がってから降りるまでの話です。"}, {"t": 50.61666666666667, "x": "新聞や雑誌の記事と、当事者の\n証言に残った日付をもとに辿ります。"}, {"t": 55.71666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.2, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 63.78333333333333, "x": "ルスカは1940年8月29日に生まれました。"}, {"t": 67.73333333333333, "x": "場所は、オランダのアムステルダムです。"}, {"t": 70.4, "x": "五輪の記録をまとめた資料があります。"}, {"t": 72.86666666666666, "x": "それによれば、柔道を始めたのは\n20歳ごろでした。"}, {"t": 76.73333333333333, "x": "遅い始まりです。"}, {"t": 78.03333333333333, "x": "それから7年ほどで世界の頂点に立ちます。"}, {"t": 80.98333333333333, "x": "それでも、日本の指導者のもとで\n稽古を重ねたと記されています。"}, {"t": 85.38333333333334, "x": "1967年には、重量級で\n世界の王者になりました。"}, {"t": 90.18333333333334, "x": "1971年にも、同じ重量級で勝っています。"}, {"t": 94.46666666666667, "x": "ヨーロッパの大会では、7回勝ちました。"}, {"t": 97.4, "x": "オランダの大会では、10回勝っています。"}, {"t": 100.48333333333333, "x": "レスリングとサンボでも、\nオランダの王者になりました。"}, {"t": 103.95, "x": "日本との縁は早くからありました。"}, {"t": 106.23333333333333, "x": "1964年、東京五輪の年です。"}, {"t": 109.96666666666667, "x": "ルスカは、日本大学の柔道部の道場に、\n練習をしに来ていました。"}, {"t": 114.95, "x": "その隣には、日大の\nレスリング部の道場がありました。"}, {"t": 118.8, "x": "そこにいた1人の学生と、\nルスカは友人になります。"}, {"t": 122.56666666666666, "x": "この学生は、のちに日本レスリング協会の\n名誉会長になる人です。"}, {"t": 127.38333333333334, "x": "12年後、この縁が武道館の試合につながります。"}, {"t": 131.18333333333334, "x": "講道館での練習の話も残っています。"}, {"t": 134.03333333333333, "x": "ルスカは、高校生や強化選手を\n次々に投げたといいます。"}, {"t": 138.35, "x": "その中には、高校生だった山下泰裕もいました。"}, {"t": 142.23333333333332, "x": "相手にならなかったと、\n東京スポーツは伝えています。"}, {"t": 145.91666666666666, "x": "1972年、ミュンヘン五輪の柔道です。"}, {"t": 149.88333333333333, "x": "ルスカは、まず重量級で金メダルを取りました。"}, {"t": 153.33333333333334, "x": "93キロを超える選手が戦う階級です。"}, {"t": 156.48333333333332, "x": "さらに、無差別級でも金メダルを取ります。"}, {"t": 159.71666666666667, "x": "こちらは、体重で分けない階級です。"}, {"t": 162.65, "x": "1つの五輪で柔道の金を2つ取ったのは、\nルスカが初めてでした。"}, {"t": 167.13333333333333, "x": "東京スポーツは、史上初の同一\n大会2階級制覇と書いています。"}, {"t": 172.05, "x": "ところが、この大会のあと、\nルスカは選手をやめます。"}, {"t": 176.11666666666667, "x": "五輪の記録の資料に、\nその理由が書かれています。"}, {"t": 179.71666666666667, "x": "この大会の期間中に、\n選手村が襲われる事件が起きました。"}, {"t": 184.11666666666667, "x": "そのため、2つの金メダルには\nあまり注目が集まりませんでした。"}, {"t": 188.75, "x": "ルスカはそれに失望して身を\n引いた、と資料にあります。"}, {"t": 192.6, "x": "金メダル2つの柔道家の名前は、\n競技の場から消えました。"}, {"t": 196.8, "x": "その名前を、日本のリングへ呼んだのは、\nあの日大の学生でした。"}, {"t": 201.68333333333334, "x": "1975年、猪木はモハメド・アリに\n挑戦状を届けていました。"}, {"t": 206.83333333333334, "x": "そこへ、新日本プロレスの\n側から問い合わせが届きます。"}, {"t": 211.0, "x": "世界一強い男は誰か。"}, {"t": 213.05, "x": "その答えとして、学生時代の\n友人の名前が挙がりました。"}, {"t": 217.31666666666666, "x": "そして、本人が間に立ちます。"}, {"t": 219.88333333333333, "x": "ルスカの代理人を務めたのです。"}, {"t": 222.0, "x": "この話は、本人が東京スポーツの\n取材に語っています。"}, {"t": 226.2, "x": "この異種格闘技戦の企画を\n作ったのは、新間寿です。"}, {"t": 230.3, "x": "新日本プロレスの営業本部長を務めた人です。"}, {"t": 233.76666666666668, "x": "web Sportivaの連載は、\nアイデアマンの新間が"}, {"t": 237.16666666666666, "x": "プロデュースしたと書いています。"}, {"t": 238.88333333333333, "x": "1976年1月、ルスカが日本に来ました。"}, {"t": 243.06666666666666, "x": "会見では、柔道を引退すると発表します。"}, {"t": 246.6, "x": "プロレスに移ることも発表しました。"}, {"t": 248.88333333333333, "x": "そして、猪木と格闘技世界一決定戦を\n行うと告げます。"}, {"t": 253.31666666666666, "x": "この会見の様子を、プロレス記者が\n雑誌のNumberに書き残しています。"}, {"t": 257.95, "x": "会見では、食べ物をめぐる対決がありました。"}, {"t": 261.43333333333334, "x": "集まった記者たちからは、\n笑いが起きたといいます。"}, {"t": 264.85, "x": "2月6日の試合まで、1か月もない時期でした。"}, {"t": 268.48333333333335, "x": "日本に着いたルスカの練習の\n場所を用意した人がいます。"}, {"t": 271.96666666666664, "x": "代理人になった、あの日大の学生です。"}, {"t": 275.23333333333335, "x": "用意したのは講道館と日大の道場でした。"}, {"t": 278.3333333333333, "x": "本人が東京スポーツの取材にそう語っています。"}, {"t": 281.6166666666667, "x": "東京スポーツは、ルスカを\n赤鬼という呼び名で紹介しています。"}, {"t": 285.8833333333333, "x": "ここで、この写真をご覧ください。"}, {"t": 288.48333333333335, "x": "1976年2月、日本武道館での2人です。"}, {"t": 292.93333333333334, "x": "東京スポーツは、初対決の\n名場面として載せています。"}, {"t": 296.96666666666664, "x": "上にいるのが猪木です。"}, {"t": 298.48333333333335, "x": "この夜、猪木は32歳です。"}, {"t": 301.25, "x": "ルスカは35歳でした。"}, {"t": 303.1333333333333, "x": "2人の年の差は3つです。"}, {"t": 305.01666666666665, "x": "試合は、時間無制限の一本勝負です。"}, {"t": 308.45, "x": "看板は、格闘技世界一決定戦でした。"}, {"t": 311.9, "x": "実況は、NETの舟橋慶一です。"}, {"t": 315.1333333333333, "x": "舟橋は、web Sportivaの\n取材でこう話しています。"}, {"t": 318.93333333333334, "x": "私が実況で強調したのは、\nプロレスvs柔道という論点。"}, {"t": 323.6166666666667, "x": "猪木の狙いについては、こう語りました。"}, {"t": 326.55, "x": "プロレスは柔道よりも強いとアピールする。"}, {"t": 329.2, "x": "柔道は日本で生まれた競技です。"}, {"t": 331.48333333333335, "x": "プロレスは力道山の手で日本に広まりました。"}, {"t": 334.3833333333333, "x": "舟橋は実況で、2つの競技の歴史の\n違いも伝えたと話しています。"}, {"t": 339.46666666666664, "x": "ルスカは、柔道着のままリングに上がりました。"}, {"t": 342.65, "x": "これについて、舟橋はこう話しています。"}, {"t": 345.75, "x": "猪木さん側が希望したんでしょうね。"}, {"t": 348.03333333333336, "x": "舟橋は、ルスカの動きをこう振り返ります。"}, {"t": 351.28333333333336, "x": "ルスカの動きも相当に\n速かったことを覚えています。"}, {"t": 354.6, "x": "一方で、東京スポーツはこう書いています。"}, {"t": 357.8333333333333, "x": "ルスカは、猪木の変幻自在の戦い方に翻弄された。"}, {"t": 361.85, "x": "柔道の試合には、ロープも場外もありません。"}, {"t": 365.25, "x": "最後は、猪木のバックドロップでした。"}, {"t": 368.0, "x": "1発、2発、3発と続きます。"}, {"t": 371.3833333333333, "x": "ルスカは敗れました。"}, {"t": 372.76666666666665, "x": "勝ったのは猪木です。"}, {"t": 374.1166666666667, "x": "猪木は初の異種格闘技戦を白星で飾った。"}, {"t": 377.2, "x": "東京スポーツはそう記しています。"}, {"t": 379.46666666666664, "x": "舟橋は、この場面をこう語りました。"}, {"t": 382.3833333333333, "x": "あれはアントニオ猪木でなければ見せられない\n瞬間でした。"}, {"t": 385.75, "x": "そしてこうも話しています。"}, {"t": 387.53333333333336, "x": "プロレスは強いということを、\nリング上でフルに表現していました。"}, {"t": 391.8333333333333, "x": "試合のあと、ルスカは再戦を望みました。"}, {"t": 395.06666666666666, "x": "そのときの言葉が、東京スポーツに残っています。"}, {"t": 398.6666666666667, "x": "猪木が使ったようなプロのトリックを\n身につけなければならないだろう。"}, {"t": 402.4, "x": "柔道着の王者が、柔道の外の\n技が要ると口にしたのです。"}, {"t": 406.71666666666664, "x": "この夜から約1か月半後の3月25日です。"}, {"t": 410.3, "x": "猪木とアリの試合の調印が\nニューヨークで行われました。"}, {"t": 413.78333333333336, "x": "ルスカ戦はアリ戦の前の\n試合として位置づけられていました。"}, {"t": 417.3, "x": "6月26日のアリ戦は、\n異種格闘技戦の2戦目にあたります。"}, {"t": 422.1166666666667, "x": "このころ、高校生だった柔道の選手がいました。"}, {"t": 425.6166666666667, "x": "山下泰裕です。"}, {"t": 427.1166666666667, "x": "山下は2003年の講演で、\nこのときのことを話しています。"}, {"t": 431.53333333333336, "x": "猪木とルスカの試合で、\n柔道が弱いと見られる形になりました。"}, {"t": 435.9, "x": "山下はそれに反発したといいます。"}, {"t": 438.35, "x": "自分もやってやろう。"}, {"t": 439.75, "x": "そんな気持ちが頭をよぎったと話しています。"}, {"t": 442.56666666666666, "x": "けれども当時はプロとアマの\n交流がない時代でした。"}, {"t": 445.75, "x": "プロの世界に触れれば引きずり込まれる。"}, {"t": 447.98333333333335, "x": "そう考えて、柔道1本に\n絞ったと山下は話しています。"}, {"t": 452.31666666666666, "x": "山下がプロの世界へ進む道は、ここで消えました。"}, {"t": 456.05, "x": "山下はその後、東海大学に進みます。"}, {"t": 459.26666666666665, "x": "そこでルスカと乱取りをしています。"}, {"t": 461.4166666666667, "x": "周りの選手は手を\n止めて2人を見ていたといいます。"}, {"t": 464.55, "x": "山下は、ルスカは強かったと評しています。"}, {"t": 467.75, "x": "総合格闘技のルールなら\nどうか、とも聞かれました。"}, {"t": 471.3, "x": "答えは、どうですかね、の一言でした。"}, {"t": 474.56666666666666, "x": "そしてこうも話しています。"}, {"t": 476.35, "x": "街なかでは喧嘩したくない相手。"}, {"t": 478.48333333333335, "x": "ルスカの方は柔道着を脱ぎ、\nプロレスラーになります。"}, {"t": 482.06666666666666, "x": "1976年11月15日に、\n再び日本に来ました。"}, {"t": 487.05, "x": "東京スポーツの記録です。"}, {"t": 488.8333333333333, "x": "再戦の日まで、24日しかありません。"}, {"t": 492.01666666666665, "x": "そして猪木の師である\nカール・ゴッチに弟子入りします。"}, {"t": 495.1, "x": "プロレスの技を一から学ぶためでした。"}, {"t": 497.55, "x": "東京スポーツは、この2人を、\n漫画の巨人の星の親子になぞらえています。"}, {"t": 503.0833333333333, "x": "藤原喜明も、このころのルスカと\nスパーリングを重ねています。"}, {"t": 507. , "x": "勝ちはありません。"}, {"t": 625.75, "x": "1979年10月5日には\n韓国で猪木の王座に挑みます。"}, {"t": 630.5666666666667, "x": "猪木が持っていた格闘技の世界王座です。"}, {"t": 633.25, "x": "最後は弓矢固めでした。"}, {"t": 635.1, "x": "ルスカはギブアップしています。"}, {"t": 636.9166666666666, "x": "猪木のほかにも、柔道を知る日本人の\nレスラーがルスカと戦っています。"}, {"t": 641.7, "x": "坂口征二です。"}, {"t": 643.0833333333334, "x": "坂口は柔道で日本一になった経歴を持つ選手です。"}, {"t": 646.9333333333333, "x": "1978年3月20日、\n2人はニューヨークで戦いました。"}, {"t": 651.9166666666666, "x": "会場はマディソン・スクエア・ガーデンです。"}, {"t": 654.4333333333333, "x": "観客は約2万2千人です。"}, {"t": 656.6833333333333, "x": "場内は満員でした。"}, {"t": 658.2833333333333, "x": "柔道着を着たままの試合です。"}, {"t": 660.3666666666667, "x": "2人とも黒帯を締めて入場しました。"}, {"t": 662.9166666666666, "x": "身長196センチのルスカは、\nプロレスでは赤いタイツで戦っていました。"}, {"t": 668.1666666666666, "x": "ルスカが巴投げを決めます。"}, {"t": 670.0666666666667, "x": "坂口も、腰の技で投げ返しました。"}, {"t": 673.1, "x": "やがて2人は柔道着を脱ぎ、\n殴り合いになります。"}, {"t": 676.9666666666667, "x": "サカグチ、カモン。"}, {"t": 678.9833333333333, "x": "ルスカはそう言って坂口を\n呼び込んだと記事にあります。"}, {"t": 682.2833333333333, "x": "ルスカは自分のコーナーから\n取った黒帯で坂口の首を絞めました。"}, {"t": 686.35, "x": "レフェリーはルスカの反則負けを告げます。"}, {"t": 688.9333333333333, "x": "試合時間は10分45秒でした。"}, {"t": 691.6666666666666, "x": "坂口はルスカをこう非難しています。"}, {"t": 694.1333333333333, "x": "柔道家ではなく、\nプロレスのクレイジーファイター。"}, {"t": 697.45, "x": "2人は1979年12月13日、\n京都で再び戦いました。"}, {"t": 703.0833333333334, "x": "今度は4分5ラウンドを戦い抜きます。"}, {"t": 705.7833333333333, "x": "結果は時間切れの引き分けでした。"}, {"t": 707.9833333333333, "x": "ルスカがプロレスから離れたのは\n1980年11月です。"}, {"t": 712.2833333333333, "x": "東京スポーツによれば、\n新日本のタッグリーグ戦が最後でした。"}, {"t": 716.7833333333333, "x": "日本のリングに上がってから4年9か月です。"}, {"t": 719.6833333333333, "x": "柔道着の男はリングから去りました。"}, {"t": 722.15, "x": "1986年10月です。"}, {"t": 724.7333333333333, "x": "プロレスを離れて、6年がたっていました。"}, {"t": 727.7833333333333, "x": "東京スポーツのカメラマンが\nオランダでルスカに会っています。"}, {"t": 731.2166666666667, "x": "女子柔道の世界選手権を取材した折のことでした。"}, {"t": 734.6833333333333, "x": "第4回の大会はオランダの\nマーストリヒトで開かれました。"}, {"t": 738.2666666666667, "x": "ルスカはアムステルダムで\n飲食店を開いていました。"},   }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
