<style>

<script>
const D={"name": "UWFインター解散", "file": "256_編集用", "dur": 900.41665625, "segs": [], "subs": [{"t": 0.0, "x": "1996年12月27日、後楽園ホール。"}, {"t": 4.8, "x": "この夜の興行の名前は「UWF FINAL」。"}, {"t": 8.566666666666666, "x": "これが、UWFインターナショナルという団体の\n最後の夜になります。"}, {"t": 13.466666666666667, "x": "旗揚げ戦を行ったのも、\n5年7か月前の同じホールでした。"}, {"t": 17.966666666666665, "x": "東京ドームに6万7000人が入ったと\n発表された秋から、まだ1年2か月です。"}, {"t": 23.8, "x": "その秋に戦った相手は、新日本プロレスでした。"}, {"t": 27.45, "x": "看板の高田延彦が天龍源一郎に\n敗れたのは、わずか2週間前。"}, {"t": 32.7, "x": "場所は両国国技館でした。"}, {"t": 34.71666666666667, "x": "満員のドームから最後の後楽園まで、\n何が起きていたのか。"}, {"t": 39.1, "x": "今回は、UWFインターナショナルの\n5年7か月を辿ります。"}, {"t": 43.86666666666667, "x": "使うのは、記録に残る日付と数字です。"}, {"t": 47.0, "x": "最後までご覧いただければ幸いです。"}, {"t": 49.5, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 55.083333333333336, "x": "1991年5月10日、後楽園ホール。"}, {"t": 59.15, "x": "UWFインターナショナルは、\nここで旗揚げ戦を行いました。"}, {"t": 63.65, "x": "前の年の暮れに、新生UWFは\n活動を止めていました。"}, {"t": 68.18333333333334, "x": "選手たちは3つの団体に分かれます。"}, {"t": 70.75, "x": "そのうちの1つが、この団体です。"}, {"t": 73.5, "x": "社長として中心に立ったのは、高田延彦でした。"}, {"t": 77.25, "x": "分かれるまでの話は以前の回で取り上げています。"}, {"t": 80.31666666666666, "x": "今回は、ここから先を追います。"}, {"t": 82.91666666666667, "x": "旗揚げから7か月後の1991年12月22日。"}, {"t": 87.5, "x": "団体は両国国技館に進出します。"}, {"t": 90.36666666666666, "x": "高田の相手は、ボクシングの\n元世界ヘビー級王者でした。"}, {"t": 94.45, "x": "当時の団体の規模からすると、\n両国での興行は大きな賭けでした。"}, {"t": 99.06666666666666, "x": "そう伝えられています。"}, {"t": 100.56666666666666, "x": "試合は、ルールを書面で決めた競技の\n試合として契約されていました。"}, {"t": 105.36666666666666, "x": "高田は始まってすぐ、\n相手の脚にローキックを打ち続けます。"}, {"t": 109.66666666666667, "x": "相手は嫌がって、やめるよう求めました。"}, {"t": 112.73333333333333, "x": "コーナーに下がったところに、\n高田の左のハイキックが入ります。"}, {"t": 116.96666666666667, "x": "相手はロープをくぐってリングを降りました。"}, {"t": 119.46666666666667, "x": "レフェリーが促しても戻りません。"}, {"t": 121.58333333333333, "x": "記録は1ラウンド2分52秒、\n相手の試合放棄です。"}, {"t": 125.85, "x": "怒った観客はリングに物を投げ込みました。"}, {"t": 128.63333333333333, "x": "場内は騒然となったと伝えられています。"}, {"t": 131.36666666666667, "x": "1992年3月、団体は1人の\n男の参戦を発表しました。"}, {"t": 137.13333333333333, "x": "元横綱の北尾光司です。"}, {"t": 139.1, "x": "北尾は相撲の時代、公称で身長199センチ。"}, {"t": 143.38333333333333, "x": "22歳11か月で横綱に上がった力士でした。"}, {"t": 146.8, "x": "プロレスのデビューは1990年2月10日です。"}, {"t": 150.36666666666667, "x": "新日本プロレスの東京ドーム大会でした。"}, {"t": 153.3, "x": "1992年5月8日、横浜アリーナ。"}, {"t": 157.23333333333332, "x": "北尾はこのリングで、\n山崎一夫をKOで下しました。"}, {"t": 161.26666666666668, "x": "同じ1992年、\n団体はもう1つ看板を手に入れます。"}, {"t": 166.31666666666666, "x": "往年の名レスラー、ルー・テーズが古い\nNWA世界王座のベルトを団体に託したのです。"}, {"t": 172.43333333333334, "x": "王座の名前は\n「プロレスリング世界ヘビー級王座」。"}, {"t": 175.58333333333334, "x": "1992年9月21日、大阪で\n高田がアメリカの選手を破りました。"}, {"t": 181.65, "x": "これで高田が初代王者です。"}, {"t": 183.6, "x": "テーズは、この王座を認める立場で\n団体と関わっていきます。"}, {"t": 187.75, "x": "そして1992年10月23日、日本武道館。"}, {"t": 192.73333333333332, "x": "高田と北尾の一戦が組まれます。"}, {"t": 194.9, "x": "発表された観衆は1万6500人です。"}, {"t": 198.18333333333334, "x": "超満員の札止めでした。"}, {"t": 199.93333333333334, "x": "試合はもともと、時間無制限の\n1本勝負とされていました。"}, {"t": 204.25, "x": "ところが試合の直前に、\n3分5ラウンドへの変更が発表されます。"}, {"t": 209.16666666666666, "x": "場内からはブーイングが起きました。"}, {"t": 211.43333333333334, "x": "Numberの記事は、この変更を北尾の\n側の強い求めによるものとしています。"}, {"t": 216.5, "x": "高田はこの試合で、\n北尾をハイキックでKOしています。"}, {"t": 220.48333333333332, "x": "この年、高田は東京スポーツのプロレス大賞で\n年間最優秀選手に選ばれました。"}, {"t": 226.46666666666667, "x": "同じ1992年10月には、新日本プロレスとの\nあいだでも動きがありました。"}, {"t": 232.36666666666667, "x": "新日本の蝶野は、当時アメリカで\nNWA世界王者でした。"}, {"t": 236.96666666666667, "x": "その蝶野が、雑誌で\n「高田さんと闘ってみたい」と話したのです。"}, {"t": 241.35, "x": "これを受けて、団体の取締役3人が\n新日本の事務所を訪ねました。"}, {"t": 246.38333333333333, "x": "手にしていたのは、対戦を求める書面です。"}, {"t": 249.61666666666667, "x": "この団体は旗揚げの頃から、\n新日本を向き合う相手に挙げてきました。"}, {"t": 254.41666666666666, "x": "ただ、この時は対戦は実現していません。"}, {"t": 257.6666666666667, "x": "1993年12月5日、明治神宮野球場。"}, {"t": 262.46666666666664, "x": "高田はスーパー・ベイダーと戦い、勝ちました。"}, {"t": 265.7, "x": "この夜の観衆は、記録では\n4万6168人とされています。"}, {"t": 270.98333333333335, "x": "ベイダーは、この1993年に団体の\nリングへ移ってきた外国人レスラーでした。"}, {"t": 277.18333333333334, "x": "翌1994年、団体は1つの\n大会の計画を打ち出します。"}, {"t": 282.56666666666666, "x": "名前は「プロレスリング・ワールド・トーナメント」。"}, {"t": 285.2, "x": "優勝賞金は1億円です。"}, {"t": 287.48333333333335, "x": "手本はテニスやゴルフの全米オープンです。"}, {"t": 290.3333333333333, "x": "同じような大会をプロレスでも、という考えから\n出た計画だったとされています。"}, {"t": 295.56666666666666, "x": "団体は現金で1億円を用意しました。"}, {"t": 298.5, "x": "そして国内の主な団体のエース5人に、\n出場を呼びかけます。"}, {"t": 303.0833333333333, "x": "呼ばれた中には、WARの天龍源一郎がいました。"}, {"t": 307.6, "x": "パンクラスの船木誠勝もいました。"}, {"t": 309.85, "x": "新日本プロレスの橋本真也もいました。"}, {"t": 312.65, "x": "天龍と船木は、日程などを\n理由に出場を断りました。"}, {"t": 316.81666666666666, "x": "返事は会社を通じた書面でした。"}, {"t": 319.18333333333334, "x": "橋本が口を開いたのは、団体の会見の\n2日後にあたる1994年2月17日です。"}, {"t": 326.15, "x": "両国国技館での試合の後、団体とは\n絶縁するという考えを示しました。"}, {"t": 331.78333333333336, "x": "もう1つの相手、リングスとの\n話し合いは長引きました。"}, {"t": 335.6, "x": "この年の1月、リングスの前田日明は\nトーナメントで優勝しています。"}, {"t": 340.51666666666665, "x": "その優勝インタビューで、\n前田はこう話していました。"}, {"t": 344.3333333333333, "x": "「自分がこのリング上でやりたいのは格闘技であって、\n残念ながらプロレスじゃありません」"}, {"t": 349.71666666666664, "x": "この言葉が、前田の出場資格を\nめぐる問題の発端になったとされています。"}, {"t": 354.9166666666667, "x": "リングスが求めたのは、\n8人以上の選手による全面対抗戦でした。"}, {"t": 359.8333333333333, "x": "団体は、前田を含む4人までなら\n認めると譲りました。"}, {"t": 363.93333333333334, "x": "それでも折り合いは付きません。"}, {"t": 365.73333333333335, "x": "話し合いは3月9日に決裂しました。"}, {"t": 368.6, "x": "2日後の3月11日、団体は取締役3人が\n出席して記者会見を開きます。"}, {"t": 375.18333333333334, "x": "招待した選手の出場が\n無くなったことの報告でした。"}, {"t": 378.75, "x": "各団体のエースが集まるという大会の\n看板は、実現しませんでした。"}, {"t": 383.76666666666665, "x": "Numberの記事は、この年の12月以降に\n団体の観客動員が大きく減ったと書いています。"}, {"t": 390.05, "x": "同じ1994年の8月18日、\n団体の王座は高田の手を離れます。"}, {"t": 396.21666666666664, "x": "東京で開かれたトーナメントの決勝で、\nベイダーが新しい王者になりました。"}, {"t": 401.45, "x": "高田がベルトを取り返したのは\n1995年4月20日。"}, {"t": 405.68333333333334, "x": "場所は名古屋でした。"}, {"t": 407.06666666666666, "x": "1995年6月、高田はリングの\n上でマイクを持ちました。"}, {"t": 412.15, "x": "話したのは、この言葉です。"}, {"t": 414.4, "x": "「近い将来、引退します」翌7月、\n高田は参議院議員選挙に立候補しました。"}, {"t": 421.0, "x": "さわやか新党からの出馬です。"}, {"t": 423.21666666666664, "x": "結果は落選でした。"}, {"t": 424.71666666666664, "x": "この頃、団体の外でも動きがありました。"}, {"t": 427.85, "x": "山崎一夫が団体を離れ、すぐに\n新日本プロレスのリングに上がったのです。"}, {"t": 433.2, "x": "団体側は契約違反だと主張しました。"}, {"t": 436.05, "x": "2つの団体のあいだで、\n言い合いが続くことになります。"}, {"t": 439.9, "x": "1995年8月23日、新横浜駅。"}, {"t": 444.46666666666664, "x": "東京スポーツの記者が高田を取材しました。"}, {"t": 447.23333333333335, "x": "この時の高田は、新日本のリングに\n上がる可能性にも触れました。"}, {"t": 451.68333333333334, "x": "記者は後にそう振り返っています。"}, {"t": 453.95, "x": "翌8月24日、高田は午後2時から\n会見を開くと発表しました。"}, {"t": 459.3, "x": "新日本プロレスも、同じ時刻に\n会見を開くとマスコミに知らせます。"}, {"t": 464.1, "x": "新日本の現場を仕切っていたのは長州力でした。"}, {"t": 467.43333333333334, "x": "長州は会見の前に、\n高田と直接電話で話しています。"}, {"t": 471.8333333333333, "x": "その後、新日本の営業担当者から\n電話が入りました。"}, {"t": 476.01666666666665, "x": "長州の指示は、こうでした。"}, {"t": 478.3333333333333, "x": "「よし、押さえろ！」押さえるのは、\n東京ドームの日程です。"}, {"t": 482.93333333333334, "x": "ドームに確かめると、\n10月9日が空いていました。"}, {"t": 486.5, "x": "発表から本番まで、わずか1か月半ほどでした。"}, {"t": 490.4166666666667, "x": "1995年9月には、旗揚げから団体を\n支えてきた取締役の1人も団体を離れています。"}, {"t": 497.55, "x": "新日本プロレスの側にも事情がありました。"}, {"t": 500.43333333333334, "x": "この年の4月28日と29日、\n新日本は北朝鮮の平壌で大会を開いています。"}, {"t": 507.03333333333336, "x": "「平和の祭典」という大会です。"}, {"t": 509.23333333333335, "x": "新日本はここで多額の負債を\n抱えたと伝えられています。"}, {"t": 512.95, "x": "1995年9月23日には、\n横浜アリーナで前の戦いが行われました。"}, {"t": 519.2333333333333, "x": "長州と安生が、タッグマッチで\n向かい合っています。"}, {"t": 522.9333333333333, "x": "1995年10月2日。"}, {"t": 525.55, "x": "東京ドームの1週間前です。"}, {"t": 527.7166666666667, "x": "ルー・テーズが、自分のベルトを\n認める立場から手を引きました。"}, {"t": 531.7666666666667, "x": "そう記録されています。"}, {"t": 533.3, "x": "1992年から団体の看板だった王座は、\nここで無くなりました。"}, {"t": 538.5, "x": "高田が名古屋でベルトを取り返してから、\n5か月あまり後のことです。"}, {"t": 542.95, "x": "1995年10月9日、東京ドーム。"}, {"t": 546.9166666666666, "x": "大会の名前は「激突 新日本プロレス対\nUWFインターナショナル全面戦争」。"}, {"t": 552.9833333333333, "x": "チケットはすぐに売り切れました。"}, {"t": 554.9833333333333, "x": "観衆は6万7000人、\n超満員の札止めと発表されています。"}, {"t": 559.7833333333333, "x": "Numberの記事は、この数字を当時の\n東京ドームの観客動員の新記録としています。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
