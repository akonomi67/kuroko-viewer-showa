<script>
const D={"name": "新間寿", "file": "272_編集用", "dur": 931.46665625, "segs": [], "subs": [{"t": 0.0, "x": "1983年8月24日の夜、東京の\n赤坂プリンスホテルで血判が押されました。"}, {"t": 6.9, "x": "誓約書を囲んだのは、\n新日本プロレスの選手と社員です。"}, {"t": 11.183333333333334, "x": "狙いは、2人の男が反撃に\n出る前に結束を固めることでした。"}, {"t": 15.85, "x": "1人は社長のアントニオ猪木です。"}, {"t": 18.116666666666667, "x": "もう1人は同じ24日に帰国したばかりでした。"}, {"t": 21.333333333333332, "x": "翌25日の緊急役員会で、\nその名前が呼ばれました。"}, {"t": 25.816666666666666, "x": "新間さんも辞めていただきたい。"}, {"t": 27.716666666666665, "x": "男の名は新間寿、48歳です。"}, {"t": 31.183333333333334, "x": "肩書きは専務取締役、そして営業本部長でした。"}, {"t": 35.45, "x": "モハメド・アリを呼び、\nタイガーマスクをリングに上げた男です。"}, {"t": 39.483333333333334, "x": "猪木の右腕と呼ばれた席が、\nこの日に消えました。"}, {"t": 43.06666666666667, "x": "下された処分は謹慎3か月でした。"}, {"t": 45.733333333333334, "x": "ところが謹慎が明ける前に、\n社長の猪木は席に戻っています。"}, {"t": 50.18333333333333, "x": "新間の席だけは、戻りませんでした。"}, {"t": 53.06666666666667, "x": "この男は11年間、猪木のために\n何をしてきたのでしょうか？"}, {"t": 57.68333333333333, "x": "そしてなぜ、自分だけが\n戻れなかったのでしょうか？"}, {"t": 61.45, "x": "今回は、新間寿という1人の\n裏方の90年を追います。"}, {"t": 66.01666666666667, "x": "残された日付と本人の\n言葉をもとに辿っていきます。"}, {"t": 69.43333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 71.93333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 77.5, "x": "新間寿は1935年3月22日に生まれました。"}, {"t": 81.96666666666667, "x": "中央大学では柔道部に入ります。"}, {"t": 84.53333333333333, "x": "柔道の神様と呼ばれた三船十段とも、\n稽古をしました。"}, {"t": 88.75, "x": "組んでも相手の体重を感じなかったそうです。"}, {"t": 91.65, "x": "亡くなる2年前の取材で、本人が明かしました。"}, {"t": 95.2, "x": "同じ学生の頃、力道山の道場にも通い始めました。"}, {"t": 99.3, "x": "卒業して就いたのは、プロレスではありません。"}, {"t": 102.46666666666667, "x": "化粧品会社の営業の仕事でした。"}, {"t": 104.98333333333333, "x": "転機は1966年に来ます。"}, {"t": 107.75, "x": "まだ会社員だった新間は、豊登に誘われます。"}, {"t": 111.43333333333334, "x": "新しい団体の立ち上げでした。"}, {"t": 113.55, "x": "東京プロレスです。"}, {"t": 114.95, "x": "そこに猪木も加わります。"}, {"t": 116.73333333333333, "x": "ところが団体は金の問題ですぐに行き詰まります。"}, {"t": 119.88333333333334, "x": "1967年1月、猪木は豊登と\n新間父子を告訴すると発表しました。"}, {"t": 126.18333333333334, "x": "新間の側も訴え返しました。"}, {"t": 128.46666666666667, "x": "週刊ファイトの記事によれば、\nどちらも起訴には至っていません。"}, {"t": 132.66666666666666, "x": "それから5年後の1972年、\n猪木は新日本プロレスを旗揚げします。"}, {"t": 138.4, "x": "新間はそこに入社しました。"}, {"t": 140.43333333333334, "x": "かつて訴え合った相手の下で働き始めたのです。"}, {"t": 143.63333333333333, "x": "旗揚げの時点で、所属はたったの6人でした。"}, {"t": 147.16666666666666, "x": "猪木は新間に、ある男を口説くよう頼みます。"}, {"t": 150.68333333333334, "x": "1970年2月に引退していた豊登です。"}, {"t": 154.35, "x": "新間は当時、豊登の生活の面倒も見ていました。"}, {"t": 158.55, "x": "頼むと言っても1円も出してくれない、と\n新間は話しています。"}, {"t": 162.8, "x": "1972年3月6日、\n大田区体育館の旗揚げ戦です。"}, {"t": 167.93333333333334, "x": "約5000人の前で、\n猪木が豊登に出場を呼びかけました。"}, {"t": 172.43333333333334, "x": "豊登はタイツが無いと言い出します。"}, {"t": 174.8, "x": "山本小鉄が自分のタイツを貸しました。"}, {"t": 177.41666666666666, "x": "豊登は山本小鉄と組み、2対1で勝っています。"}, {"t": 181.23333333333332, "x": "このあと新間は、猪木と豊登の\nマネジャーを任されました。"}, {"t": 185.38333333333333, "x": "テレビ中継はありません。"}, {"t": 187.1, "x": "放映権料が入り始めるのは、\n翌年の4月からでした。"}, {"t": 191.18333333333334, "x": "観衆が200人の会場もありました。"}, {"t": 193.76666666666668, "x": "外国人選手の宿は、新宿の\n京王プラザホテルに新間が話をつけています。"}, {"t": 199.43333333333334, "x": "本人はのちに、こう振り返っています。"}, {"t": 202.4, "x": "あるのはレスラーと社員のやる気だけだったね。"}, {"t": 205.0, "x": "旗揚げから1年で、集めた資金は約2億円です。"}, {"t": 209.1, "x": "当時の大卒の初任給は4万円でした。"}, {"t": 212.05, "x": "これがなかったら新日本は1年もたなかった。"}, {"t": 215.0, "x": "話しているのは新間本人です。"}, {"t": 217.23333333333332, "x": "新間の仕事は資金集めだけではありません。"}, {"t": 220.15, "x": "旗揚げの頃の外国人選手は、\nカール・ゴッチが呼んでいました。"}, {"t": 224.51666666666668, "x": "ところが来るのは無名の選手ばかりです。"}, {"t": 227.05, "x": "客が増えないので、\n新間はゴッチに手紙を書きます。"}, {"t": 230.8, "x": "手紙には一流選手の名前が並んでいました。"}, {"t": 233.83333333333334, "x": "ゴッチは怒って猪木に電話をかけています。"}, {"t": 236.55, "x": "おまえら、そんな選手を呼べるほどの団体か。"}, {"t": 239.71666666666667, "x": "別の道を開いたのはアメリカでした。"}, {"t": 242.15, "x": "新間がロサンゼルスを訪ねた時のことです。"}, {"t": 245.0, "x": "その場にニューヨークの大物が居合わせました。"}, {"t": 247.71666666666667, "x": "ビンス・マクマホン・シニアです。"}, {"t": 249.5, "x": "新間は駄目で元々と、こう頼みました。"}, {"t": 252.48333333333332, "x": "うちに選手を送ってくれないか。"}, {"t": 254.53333333333333, "x": "返事は承諾でした。"}, {"t": 256.06666666666666, "x": "話がまとまったのは1974年の初めです。"}, {"t": 259.76666666666665, "x": "その年の2月には、アンドレ・ザ・ジャイアントが\n新日本に来ています。"}, {"t": 264.25, "x": "アメリカのWWFとの関係は\nここから始まりました。"}, {"t": 268.05, "x": "当時のWWFは、アメリカ東部だけの団体でした。"}, {"t": 272.26666666666665, "x": "アンドレを毎回出せば、客に飽きられます。"}, {"t": 275.35, "x": "新間によれば、他の地域に\n貸し出すのが普通でした。"}, {"t": 279.15, "x": "提携は1985年まで続いています。"}, {"t": 282.51666666666665, "x": "新間はのちに、名誉職ながら\nWWFの会長も務めています。"}, {"t": 287.6166666666667, "x": "1976年6月、猪木と\nモハメド・アリの一戦が実現します。"}, {"t": 293.01666666666665, "x": "新間は、この試合を形にした1人です。"}, {"t": 296.21666666666664, "x": "翌1977年の調印式にも記録が残っています。"}, {"t": 300.51666666666665, "x": "プロ空手家のザ・モンスターマンを、\n新間が一本背負いで投げたのです。"}, {"t": 304.93333333333334, "x": "この写真は1977年7月の調印式の新間です。"}, {"t": 309.53333333333336, "x": "選手を作る仕事もしました。"}, {"t": 311.6, "x": "藤波辰巳はのちにこう語っています。"}, {"t": 314.15, "x": "ぼくは新間さんの作品のひとつ。"}, {"t": 316.4, "x": "1981年4月23日、蔵前国技館に\n初代タイガーマスクが立ちます。"}, {"t": 322.8833333333333, "x": "話の始まりは原作者の\n梶原一騎と新間の会話でした。"}, {"t": 326.85, "x": "中身の佐山聡に、新間が\n初めて会ったのは1973年頃です。"}, {"t": 332.3833333333333, "x": "背が足りず、170センチ以上になったら\n連絡しなさいと伝えたといいます。"}, {"t": 337.6333333333333, "x": "翌1974年、佐山は\n172センチになっていました。"}, {"t": 342.73333333333335, "x": "新間の指示で後楽園ホールに来ています。"}, {"t": 345.5833333333333, "x": "佐山はその後、猪木の付け人になります。"}, {"t": 348.6666666666667, "x": "その佐山は1981年、イギリスにいました。"}, {"t": 352.95, "x": "サミー・リーの名前で戦っていました。"}, {"t": 355.25, "x": "新間が国際電話を入れたのは4月10日ごろです。"}, {"t": 358.6, "x": "デビューの2週間ほど前でした。"}, {"t": 360.7, "x": "帰国の話を佐山は一度断っています。"}, {"t": 363.55, "x": "1試合でいいから帰ってきてくれ、と\n新間は頼みました。"}, {"t": 367.6166666666667, "x": "最後の言葉はこうでした。"}, {"t": 369.48333333333335, "x": "猪木の顔を潰す気か。"}, {"t": 371.1, "x": "帰国の時には、現地の空港で\n出国できない問題が起きました。"}, {"t": 375.65, "x": "新間は親交のあった元首相の力を借りて、\nこれを切り抜けています。"}, {"t": 380.51666666666665, "x": "佐山は試合の2日前に極秘で帰国します。"}, {"t": 383.6, "x": "宿は京王プラザホテルでした。"}, {"t": 385.68333333333334, "x": "準備の時間はほとんどありません。"}, {"t": 387.8666666666667, "x": "マントは布切れの縫い合わせでした。"}, {"t": 390.05, "x": "マスクは小さすぎました。"}, {"t": 391.73333333333335, "x": "新間は物置で佐山にかぶせ、\n格好いいと褒め続けました。"}, {"t": 396.28333333333336, "x": "そのマスクの男に手紙が月に\n何百通も届くようになります。"}, {"t": 400.28333333333336, "x": "テレビの視聴率は、24パーセントから\n25パーセントに達しました。"}, {"t": 405.23333333333335, "x": "シリーズごとに特別ボーナスも出ました。"}, {"t": 407.7, "x": "選手と社員に、10万円から30万円です。"}, {"t": 411.35, "x": "会場の人気は猪木より上だったと\n新間は話しています。"}, {"t": 414.93333333333334, "x": "1983年に海外へ出す案が出た時は、\n営業部の全員が大反対しました。"}, {"t": 421.5, "x": "前田日明を入門させたのも新間です。"}, {"t": 424.1666666666667, "x": "プロレスファンではなかった前田に、\nこう言いました。"}, {"t": 427.45, "x": "それならアメリカに行って、\nモハメド・アリの弟子になればいい。"}, {"t": 431.23333333333335, "x": "前田本人が、この誘いを証言しています。"}, {"t": 434.6, "x": "そして1983年5月、\n新間の大きな構想が動きます。"}, {"t": 439.73333333333335, "x": "第1回のIWGPです。"}, {"t": 443.1666666666667, "x": "世界の王座を1つにまとめる企画でした。"}, {"t": 445.85, "x": "決勝は6月2日、蔵前国技館です。"}, {"t": 449.28333333333336, "x": "猪木はハルク・ホーガンの一撃を\n受け、場外で失神しました。"}, {"t": 453.65, "x": "東京医大病院に運ばれた夜に、\n奇妙な話が残っています。"}, {"t": 458.26666666666665, "x": "運んだ若手選手の証言では、新間の指示で\n病室の前田にシーツがかけられました。"}, {"t": 464.01666666666665, "x": "本当の猪木は、午前2時に\n家族の車で病院を出ています。"}, {"t": 468.4, "x": "東京スポーツは、絶対安静とされた猪木の\n帰宅を隠す狙いと見ています。"}, {"t": 473.6166666666667, "x": "会社の中では別の話が進んでいました。"}, {"t": 476.45, "x": "6月30日の株主総会です。"}, {"t": 479.03333333333336, "x": "売り上げは二十億円に迫っていました。"}, {"t": 481.6166666666667, "x": "ところが繰り越し利益は1000万円に\n届かず、配当はありません。"}, {"t": 486.2, "x": "選手や社員のあいだに不信が広がります。"}, {"t": 488.98333333333335, "x": "猪木の事業アントン・ハイセルの\n中身は別の回でお伝えしました。"}, {"t": 492.8833333333333, "x": "今回見るのは新間の立場です。"}, {"t": 495.06666666666666, "x": "ハイセルの運営資金のため、\n選手と社員は社債を買わされていました。"}, {"t": 499.8833333333333, "x": "新間とつながりの強い藤波も、かなりの\n額を協力しています。"}, {"t": 504.46666666666664, "x": "猪木は前の年に重い糖尿病を発症していました。"}, {"t": 507.95, "x": "治療しながらリングに上がる状態です。"}, {"t": 510.46666666666664, "x": "営業部長たちは新しい団体を作ろうと動きました。"}, {"t": 514.1166666666667, "x": "目標の資金は3億円です。"}, {"t": 516.4666666666667, "x": "相手は猪木だけではありません。"}, {"t": 518.4166666666666, "x": "猪木と新間に組まれたら\n勝ち目はない、と判断したのです。"}, {"t": 522.35, "x": "資金が足りず、話は社 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
