<script>
const D={"name": "義兄弟コンビ", "file": "295_編集用", "dur": 948.7833125, "segs": [], "subs": [{"t": 0.0, "x": "1988年10月28日、横浜文化体育館です。"}, {"t": 5.466666666666667, "x": "この夜の客席は、5400人で満員でした。"}, {"t": 9.266666666666667, "x": "7つ目の試合のリングに\nジャイアント馬場が上がります。"}, {"t": 12.483333333333333, "x": "同じ側のコーナーには、\nラッシャー木村が立っていました。"}, {"t": 16.2, "x": "試合は7分44秒で終わります。"}, {"t": 19.083333333333332, "x": "相手を押さえ込んだのは木村でした。"}, {"t": 21.35, "x": "前の夜の群馬の前橋では、\n木村は馬場の向かい側にいました。"}, {"t": 25.8, "x": "その前の大会もそうでした。"}, {"t": 27.8, "x": "さらにその前の大会もそうでした。"}, {"t": 30.183333333333334, "x": "馬場の公式年表は、この夜を1行で書いています。"}, {"t": 34.1, "x": "横浜大会でラッシャー木村との\n「義兄弟コンビ」が実現、とあります。"}, {"t": 39.516666666666666, "x": "馬場と木村はそれまで何回\n向かい合っていたのでしょうか？"}, {"t": 42.95, "x": "前の夜まで戦っていた2人が、なぜ同じ側に\n立ったのでしょうか？"}, {"t": 47.61666666666667, "x": "今回は1988年10月28日の\n横浜の1試合を追います。"}, {"t": 53.0, "x": "1984年の暮れから\n1988年の暮れまでが中心です。"}, {"t": 58.35, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 62.9, "x": "馬場の公式年表とも1つずつ照らし合わせます。"}, {"t": 66.15, "x": "最後までご覧いただければ幸いです。"}, {"t": 68.63333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 74.21666666666667, "x": "まず馬場の公式年表を開きます。"}, {"t": 76.66666666666667, "x": "1988年のところにあるのは、\nこの1つだけでした。"}, {"t": 81.08333333333333, "x": "日付は10月28日です。"}, {"t": 83.33333333333333, "x": "場所は横浜大会と書かれています。"}, {"t": 85.8, "x": "中身は木村との「義兄弟コンビ」が\n実現した、ということです。"}, {"t": 90.5, "x": "相手の名前は書かれていません。"}, {"t": 92.56666666666666, "x": "勝ったのかどうかもありません。"}, {"t": 94.33333333333333, "x": "何分の試合だったのかもありません。"}, {"t": 96.71666666666667, "x": "そこで今回は、試合の記録で\nその前とあとをたどります。"}, {"t": 100.75, "x": "この動画で、名前を読むのは\n馬場と木村の2人だけです。"}, {"t": 104.7, "x": "ほかのレスラーは、「相棒」や\n「相手の2人」と呼ぶことにします。"}, {"t": 109.26666666666667, "x": "実は馬場と木村が組んだのは、\nこの夜が初めてではありません。"}, {"t": 113.51666666666667, "x": "試合の記録を4年さかのぼります。"}, {"t": 115.86666666666666, "x": "行き着くのは1984年の秋です。"}, {"t": 118.86666666666666, "x": "1984年11月22日、千葉の松戸です。"}, {"t": 123.53333333333333, "x": "馬場は木村と組んで外国人の2人組に勝ちました。"}, {"t": 126.88333333333334, "x": "8分37秒で、相手を\n押さえ込んだのは木村でした。"}, {"t": 131.18333333333334, "x": "この年の暮れの\n世界最強タッグ決定リーグ戦の時期です。"}, {"t": 135.03333333333333, "x": "11月23日は、後楽園ホールでした。"}, {"t": 138.8, "x": "2人の組は反則勝ちです。"}, {"t": 140.8, "x": "11月25日は、長野で両者リングアウトでした。"}, {"t": 144.8, "x": "11月28日は札幌です。"}, {"t": 147.4, "x": "10分40秒で木村が押さえ込まれました。"}, {"t": 150.26666666666668, "x": "12月1日は盛岡です。"}, {"t": 152.43333333333334, "x": "3人目の相棒を加えて、\n6人タッグに出ています。"}, {"t": 156.43333333333334, "x": "12月2日の後楽園ホールも\n6人タッグで、こちらは勝ちました。"}, {"t": 161.26666666666668, "x": "12月3日は千葉公園体育館でした。"}, {"t": 164.25, "x": "10分36秒で、馬場が押さえ込んで勝ちました。"}, {"t": 168.08333333333334, "x": "12月4日は、福岡で14分33秒の\nリングアウト負けです。"}, {"t": 173.16666666666666, "x": "12月6日は、大分で10分28秒の\nリングアウト負けでした。"}, {"t": 178.15, "x": "11月28日の札幌はリーグ戦の試合です。"}, {"t": 181.81666666666666, "x": "12月4日と12月6日もリーグ戦でした。"}, {"t": 184.96666666666667, "x": "2人は1つの組としてリーグ戦に出ていました。"}, {"t": 187.86666666666667, "x": "そして12月8日、名古屋の愛知県体育館です。"}, {"t": 191.86666666666667, "x": "リーグ戦の相手は、日本人の2人組でした。"}, {"t": 195.2, "x": "記録には8分20秒で、\n木村の組の負けと残っています。"}, {"t": 199.5, "x": "決まり手の欄には、試合放棄とあります。"}, {"t": 202.43333333333334, "x": "百科事典の記事を開きます。"}, {"t": 204.53333333333333, "x": "この試合の途中で木村は\n馬場を攻撃した、とあります。"}, {"t": 208.43333333333334, "x": "そこへ別のレスラー2人が\n加わった、と書かれています。"}, {"t": 212.26666666666668, "x": "馬場と木村の組は、ここで終わりました。"}, {"t": 215.15, "x": "最初に組んでから16日後のことです。"}, {"t": 217.8, "x": "それから4日後の12月12日です。"}, {"t": 220.48333333333332, "x": "会場は横浜文化体育館でした。"}, {"t": 223.08333333333334, "x": "4年後に義兄弟コンビが実現する、あの会場です。"}, {"t": 227.13333333333333, "x": "この夜の馬場は、2人の相棒と\n組んで6人タッグを戦いました。"}, {"t": 231.66666666666666, "x": "向かい側には木村がいました。"}, {"t": 233.58333333333334, "x": "木村の組も3人です。"}, {"t": 235.33333333333334, "x": "8分3秒で、押さえ込んだのは木村でした。"}, {"t": 238.75, "x": "押さえ込まれたのは馬場の組の1人です。"}, {"t": 241.16666666666666, "x": "同じ会場で、木村は先に馬場の\n向かい側に立っていたことになります。"}, {"t": 245.78333333333333, "x": "ここから、2人が向かい合う日が続きます。"}, {"t": 248.78333333333333, "x": "1985年の記録で、\n馬場の試合は192試合ありました。"}, {"t": 254.26666666666668, "x": "そのうち、木村が\n向かい側にいたのは69試合です。"}, {" function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

  const t=el.children[i]; if(!t) return; t.classList.add('on');

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
