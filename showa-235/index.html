<script>
const D={"name": "新生UWF分裂", "file": "235_編集用", "dur": 902.85, "segs": [], "subs": [{"t": 0.0, "x": "1990年12月1日、\n長野県の松本運動公園総合体育館。"}, {"t": 6.383333333333334, "x": "観衆は4,000人、満員でした。"}, {"t": 9.55, "x": "この日のメインイベントは、船木誠勝と\nウエイン・シャムロックの一戦です。"}, {"t": 14.15, "x": "決まり手は逆エビ固め。"}, {"t": 15.85, "x": "18分4秒でした。"}, {"t": 17.633333333333333, "x": "試合が終わったあと、船木はリングの\n上からある人物を呼びました。"}, {"t": 22.166666666666668, "x": "このとき出場停止処分を受けていた前田日明です。"}, {"t": 25.55, "x": "前田がリングに上がり、\n出場していた選手が全員そこに並びました。"}, {"t": 30.45, "x": "そして全員で万歳三唱をしています。"}, {"t": 33.11666666666667, "x": "イメージ映像"}, {"t": 33.11666666666667, "x": "その1か月後、この団体は解散しました。"}, {"t": 36.46666666666667, "x": "イメージ映像"}, {"t": 36.46666666666667, "x": "リングに並んでいた選手たちは、\n3つに分かれます。"}, {"t": 40.016666666666666, "x": "なぜ、同じリングで万歳をした者たちが、1か月で\n3か所に分かれることになったのでしょうか。"}, {"t": 46.78333333333333, "x": "イメージ映像"}, {"t": 46.78333333333333, "x": "今回は、新生UWFが3つに割れるまでを、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 53.833333333333336, "x": "最後までご覧いただければ幸いです。"}, {"t": 56.333333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 61.916666666666664, "x": "イメージ映像"}, {"t": 61.916666666666664, "x": "はじめに、名前の整理をしておきます。"}, {"t": 64.81666666666666, "x": "UWFという団体は、2つあります。"}, {"t": 68.15, "x": "1つは1984年に始まり、\n1985年に活動を終えた団体です。"}, {"t": 74.68333333333334, "x": "イメージ映像"}, {"t": 74.68333333333334, "x": "これを第1次UWFと呼びます。"}, {"t": 77.28333333333333, "x": "イメージ映像"}, {"t": 77.28333333333333, "x": "もう1つが、1988年5月12日に\n旗揚げした団体です。"}, {"t": 82.65, "x": "こちらを第2次UWF、または\n新生UWFと呼びます。"}, {"t": 87.51666666666667, "x": "今回扱うのは、後者のほうです。"}, {"t": 90.26666666666667, "x": "イメージ映像"}, {"t": 90.26666666666667, "x": "新生UWFの始まりだけ、\n先に押さえておきます。"}, {"t": 94.61666666666666, "x": "1988年5月12日、後楽園ホール。"}, {"t": 99.05, "x": "観客は2,300人でした。"}, {"t": 101.28333333333333, "x": "所属選手は6人だけで、\nテレビ中継はありません。"}, {"t": 105.18333333333334, "x": "そして翌年の1989年11月29日には、\n東京ドームで6万人を集めています。"}, {"t": 112.26666666666667, "x": "この大会の名前はU-COSMOS。"}, {"t": 115.0, "x": "メガネスーパーの協賛による興行でした。"}, {"t": 117.8, "x": "イメージ映像"}, {"t": 117.8, "x": "2,300人から6万人まで、1年半でした。"}, {"t": 121.75, "x": "その団体が止まるのは、\n旗揚げから2年半後になります。"}, {"t": 125.58333333333333, "x": "イメージ映像"}, {"t": 125.58333333333333, "x": "この団体の興行のやり方も、\n先に確認しておきます。"}, {"t": 129.61666666666667, "x": "新生UWFは、シリーズ巡業の\n形を取りませんでした。"}, {"t": 134.31666666666666, "x": "月に1回の単発興行に絞り、各地の\n主要な会場を回るビッグマッチ形式です。"}, {"t": 140.4, "x": "イメージ映像"}, {"t": 140.4, "x": "連戦による選手の\nコンディション低下を防ぐためでした。"}, {"t": 143.76666666666668, "x": "そのぶん興行の数は少なくなります。"}, {"t": 146.3, "x": "そこを補ったのが、物販です。"}, {"t": 148.93333333333334, "x": "大会ごとに記念グッズを用意して売り、\n前の大会を完全収録した"}, {"t": 153.81666666666666, "x": "ビデオソフトを次の大会で早く売る。"}, {"t": 156.1, "x": "この形で収益を上げていました。"}, {"t": 158.35, "x": "イメージ映像"}, {"t": 158.35, "x": "つまりこの団体は、試合の数ではなく、1回の\n大会の売り上げで回していたことになります。"}, {"t": 164.8, "x": "その仕組みを動かしていたのが、フロントでした。"}, {"t": 168.06666666666666, "x": "ここから、止まるまでの日付を順に見ていきます。"}, {"t": 171.43333333333334, "x": "1989年8月13日の横浜アリーナ大会から、\nUWFにはスポンサーが付いていました。"}, {"t": 179.08333333333334, "x": "メガネスーパーです。"}, {"t": 180.48333333333332, "x": "創業者は田中八郎。"}, {"t": 182.3, "x": "1976年にメガネスーパーを創業した人物です。"}, {"t": 186.5, "x": "そしてその田中八郎は、1990年5月に\nSWSというプロレス団体を設立しました。"}, {"t": 193.58333333333334, "x": "UWFを後援している会社が、別の\nプロレス団体を自分で作ったことになります。"}, {"t": 199.46666666666667, "x": "イメージ映像"}, {"t": 199.46666666666667, "x": "1990年10月25日、大阪城ホール。"}, {"t": 203.86666666666667, "x": "この日、前田日明は船木誠勝と\n対戦し、勝っています。"}, {"t": 208.76666666666668, "x": "試合のあと、前田はフロントの\n業務について公の場で発言しました。"}, {"t": 213.93333333333334, "x": "リング外の問題が選手に\n影響している、という内容です。"}, {"t": 218.25, "x": "船木のような選手を、リング外の\nゴチャゴチャでかき回したくない。"}, {"t": 222.36666666666667, "x": "この言葉が記録に残っています。"}, {"t": 224.5, "x": "会社側の動きは早いものでした。"}, {"t": 226.83333333333334, "x": "イメージ映像"}, {"t": 226.83333333333334, "x": "10月27日、臨時取締役会。"}, {"t": 230.2, "x": "そして10月28日、社長の神新二が、\n前田に5か月間の出場停止処分を"}, {"t": 236.76666666666668, "x": "科すことを発表しました。"}, {"t": 238.31666666666666, "x": "理由は、フロントの業務の遂行が\n不適切であるかのような発言を"}, {"t": 243.03333333333333, "x": "公にしたこと、とされています。"}, {"t": 245.45, "x": "この会見では、社長の側から\n前田の別の発言も示されました。"}, {"t": 250.06666666666666, "x": "選手の代わりはいないが、\nフロントの代わりはいっぱいいる。"}, {"t": 253.8, "x": "イメージ映像"}, {"t": 253.8, "x": "前田が若手選手に対してそう話し、別会社の\n設立と移籍を示唆していた、という内容です。"}, {"t": 260.81666666666666, "x": "1990年11月3日、前田は\n中央大学での講演でこの件に触れています。"}, {"t": 267.5833333333333, "x": "じつは内部で不正があった。"}, {"t": 269.5, "x": "前田はそう発言しました。"}, {"t": 271.3666666666667, "x": "これは前田の側の\n主張として記録されているものです。"}, {"t": 274.6333333333333, "x": "会社側が認めた事実ではありません。"}, {"t": 277.15, "x": "イメージ映像"}, {"t": 277.15, "x": "そして12月1日の松本大会になります。"}, {"t": 280.28333333333336, "x": "この日のカードを並べておきます。"}, {"t": 282.35, "x": "第1試合は田村潔司と垣原賢人。"}, {"t": 285.2, "x": "田村がアキレス腱固めで14分58秒。"}, {"t": 288.5, "x": "第2試合は安生洋二と鈴木みのる。"}, {"t": 291.0, "x": "安生が24分16秒でTKO勝ち。"}, {"t": 294.23333333333335, "x": "第3試合はバート・ベイルと山崎一夫。"}, {"t": 296.9, "x": "ベイルが逆片エビ固めで10分53秒。"}, {"t": 300.01666666666665, "x": "第4試合は藤原喜明と宮戸成夫。"}, {"t": 302.98333333333335, "x": "藤原がアキレス腱固めで11分11秒。"}, {"t": 306.25, "x": "イメージ映像"}, {"t": 306.25, "x": "この宮戸成夫が、のちの宮戸優光です。"}, {"t": 309.4, "x": "第5試合は高田延彦と中野龍雄。"}, {"t": 311.98333333333335, "x": "高田が腕ひしぎ逆十字固めで18分49秒。"}, {"t": 315.8, "x": "そしてメインが、船木とシャムロックでした。"}, {"t": 318.73333333333335, "x": "イメージ映像"}, {"t": 318.73333333333335, "x": "この時点で、リングに\n立っていない主力が1人います。"}, {"t": 322.31666666666666, "x": "出場停止中の前田です。"}, {"t": 324.35, "x": "その前田を、メイン終了後に船木が呼びました。"}, {"t": 327.96666666666664, "x": "全員で万歳をしたのは、その直後のことです。"}, {"t": 331.4, "x": "万歳から6日後の1990年12月7日、\n会社は会見を開きました。"}, {"t": 337.4, "x": "発表されたのは、\n所属する12選手との契約解除です。"}, {"t": 341.65, "x": "事実上の解雇通告でした。"}, {"t": 343.71666666666664, "x": "その3日後の12月10日、\n選手の側も動いています。"}, {"t": 347.8666666666667, "x": "前田を筆頭とする12名が、\n新会社を設立する意志を表明しました。"}, {"t": 353.15, "x": "イメージ映像"}, {"t": 353.15, "x": "つまりこの時点では、12人は\n同じ方向を向いていたことになります。"}, {"t": 357.85, "x": "イメージ映像"}, {"t": 357.85, "x": "その12人が分かれたのが、\n1991年1月7日です。"}, {"t": 362.8833333333333, "x": "場所は横浜市内にある前田の自宅でした。"}, {"t": 365.73333333333335, "x": "ここに選手が集まり、会議が行われています。"}, {"t": 369.3833333333333, "x": "藤原喜明は、この会議に出席していません。"}, {"t": 373.05, "x": "会議の席で出た言葉が残っています。"}, {"t": 375.51666666666665, "x": "前田さんの言う事だけを\n一方的に信用するのは不可能。"}, {"t": 379.25, "x": "イメージ映像"}, {"t": 379.25, "x": "宮戸優光の発言です。"}, {"t": 381.1333333333333, "x": "なんか強制されてるみたいで嫌だなぁ。"}, {"t": 383.55, "x": "イメージ映像"}, {"t": 383.55, "x": "安生洋二の発言です。"}, {"t": 385.43333333333334, "x": "話し合いはまとまりませんでした。"}, {"t": 387.6, "x": "そして前田が、その場で解散を宣言しています。"}, {"t": 391.25, "x": "イメージ映像"}, {"t": 391.25, "x": "この会議には、前提がありました。"}, {"t": 393.93333333333334, "x": "解散が目的の集まりではなかったということです。"}, {"t": 397.0833333333333, "x": "前田が先頭に立ち、\n選手が主体になる新しい団体を作る。"}, {"t": 401.65, "x": "そのための話し合いでした。"}, {"t": 403.48333333333335, "x": "イメージ映像"}, {"t": 403.48333333333335, "x": "この構想は、当時のプロレス誌で\n第3次UWFとも呼ばれています。"}, {"t": 408.5, "x": "その第3次UWFを作るための会議が、\nそのまま解散の場になりました。"}, {"t": 413.9166666666667, "x": "なお、前田に科された出場停止は5か月間です。"}, {"t": 418.1166666666667, "x": "イメージ映像"}, {"t": 418.1166666666667, "x": "1990年10月28日の発表なので、\n期限が明けるのは1991年3月末でした。"}, {"t": 425.8833333333333, "x": "処分が明ける前に、団体のほうが\n無くなったことになります。"}, {"t": 430.0, "x": "新生UWFは、これで終わりました。"}, {"t": 433.31666666666666, "x": "1988年5月12日から、\n1991年1月7日まで。"}, {"t": 439.45, "x": "2年8か月です。"}, {"t": 440.9, "x": "この解散について、藤原喜明は\n記者会見でひと言だけ答えています。"}, {"t": 446.0, "x": "知らねぇよ。"}, {"t": 446.98333333333335, "x": "会議に出ていない人物の、当時のコメントです。"}, {"t": 450.35, "x": "ここから、3つの団体に分かれます。"}, {"t": 453.15, "x": "1つ目が、藤原組です。"}, {"t": 455.48333333333335, "x": "藤原喜明、船木誠勝、鈴木みのる、冨宅祐輔。"}, {"t": 460.6666666666667, "x": "設立当初の団体名は、新UWF藤原組でした。"}, {"t": 465.28333333333336, "x": "2つ目が、UWFインターナショナルです。"}, {"t": 468.68333333333334, "x": "高田延彦と山崎一夫を中心に、\n安生洋二、宮戸優光、中野龍雄、"}, {"t": 475.1666666666667, "x": "田村潔司、垣原賢人が参加しました。"}, {"t": 478.95, "x": "イメージ映像"}, {"t": 478.95, "x": "高田は代表取締役社長を務めています。"}, {"t": 482.06666666666666, "x": "3つ目が、リングスです。"}, {"t": 484.03333333333336, "x": "設立したのは前田日明。"}, {"t": 485.93333333333334, "x": "イメージ映像"}, {"t": 485.93333333333334, "x": "所属選手は、前田1人だけの\n状態でのスタートでした。"}, {"t": 489.95, "x": "イメージ映像"}, {"t": 489.95, let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
