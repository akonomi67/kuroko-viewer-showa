<title>デストロイヤーの覆面</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;
  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 26px;box-shadow:0 2px 14px rgba(0,0,0,.10)}

  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);
  font-size:12px;padding:3px 9px;border-radius:20px;line-height:1.6;letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}

button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}

.marks{position:relative;height:7px;margin:2px 0 14px}

.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}

.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:48px;flex:none;padding-top:2px}
.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}

<script>
const D={"name": "デストロイヤーの覆面", "file": "216_編集用", "dur": 823.0, "segs": [], "subs": [{"t": 0.0, "x": "1993年7月29日、日本武道館。"}, {"t": 4.466666666666667, "x": "この日、1人の外国人レスラーが\n引退試合を行いました。"}, {"t": 8.75, "x": "ジャイアント馬場と、自分の息子である\nカート・ベイヤーとの3人組です。"}, {"t": 13.483333333333333, "x": "試合は、相手チームの1人を足4の\n字固めで押さえて終わりました。"}, {"t": 18.333333333333332, "x": "リングを下りるときに流れたのは、和田\nアキ子の「あの鐘を鳴らすのはあなた」でした。"}, {"t": 23.233333333333334, "x": "この選手は、この日も\n白い覆面をかぶったままです。"}, {"t": 26.983333333333334, "x": "名前をザ・デストロイヤーといいます。"}, {"t": 29.233333333333334, "x": "日本のリングに初めて上がったのは\n1963年5月。"}, {"t": 33.36666666666667, "x": "この引退試合まで、30年が経っていました。"}, {"t": 36.78333333333333, "x": "その30年のあいだ、この人はプロレスの\n試合だけでなく、日本のテレビの"}, {"t": 42.05, "x": "バラエティー番組にも出ています。"}, {"t": 43.916666666666664, "x": "そのときも覆面をかぶったままでした。"}, {"t": 46.36666666666667, "x": "イメージ映像"}, {"t": 46.36666666666667, "x": "今回は、1963年5月の初来日から\n2019年3月7日までを、"}, {"t": 52.61666666666667, "x": "具体的な日付と記録をもとに辿っていきます。"}, {"t": 55.8, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.3, "x": "それでは本編に入る前に、チャンネル\n登録と高評価をよろしくお願いいたします。"}, {"t": 63.88333333333333, "x": "ザ・デストロイヤーの本名は、\nリチャード・ジョン・ベイヤーといいます。"}, {"t": 67.9, "x": "1930年7月11日、アメリカの\nニューヨーク州バッファローの生まれです。"}, {"t": 73.81666666666666, "x": "学歴の記録が残っています。"}, {"t": 75.86666666666666, "x": "シラキュース大学の教育学部を卒業し、\n同じ大学の大学院で修士課程を修めています。"}, {"t": 82.45, "x": "イメージ映像"}, {"t": 82.45, "x": "大学ではアメリカンフットボールの選手でした。"}, {"t": 85.4, "x": "卒業後は母校のコーチも務めています。"}, {"t": 88.1, "x": "同時にレスリングでも実績を残していました。"}, {"t": 90.93333333333334, "x": "イメージ映像"}, {"t": 90.93333333333334, "x": "プロレスラーとしての\n活動を始めたのは1954年です。"}, {"t": 95.1, "x": "イメージ映像"}, {"t": 95.1, "x": "その後1960年代の初めまでは、\n覆面をかぶらず、ディック・ベイヤーと"}, {"t": 100.9, "x": "いう本名のままの名前で試合をしていました。"}, {"t": 103.6, "x": "覆面をかぶるようになったのは1962年です。"}, {"t": 107.31666666666666, "x": "白い生地に赤と青の縁取りを入れたマスクをかぶり、\nザ・デストロイヤーになりました。"}, {"t": 112.8, "x": "覆面をかぶった理由については、\nいくつかの説明が残っています。"}, {"t": 117.31666666666666, "x": "当時プロレスラーの免許を\n取っていなかったため、大きな団体で"}, {"t": 121.45, "x": "試合をするには正体を隠す必要があったこと。"}, {"t": 124.48333333333333, "x": "さまざまな競技をやってきた\nせいで前歯が折れていたこと。"}, {"t": 127.81666666666666, "x": "そして素顔が優しい顔立ちだったこと。"}, {"t": 130.35, "x": "いずれも「といわれている」という形で\n伝えられているもので、本人が理由を"}, {"t": 134.83333333333334, "x": "これと断定した記録は確認できません。"}, {"t": 137.33333333333334, "x": "このマスク自体についても、記録が残っています。"}, {"t": 140.81666666666666, "x": "マスクの生地は、女性用の下着である\nガードルから作られたものでした。"}, {"t": 145.28333333333333, "x": "マスクマンになるとき、妻と一緒に\n女性用下着の売り場に行って生地を買い、"}, {"t": 150.11666666666667, "x": "妻が手作りで縫い上げたものだといいます。"}, {"t": 152.96666666666667, "x": "そして覆面をかぶったその年、1962年7月\n27日、ロサンゼルスでフレッド・ブラッシーを"}, {"t": 160.75, "x": "破ってWWA世界ヘビー級王座を獲得しました。"}, {"t": 164.53333333333333, "x": "イメージ映像"}, {"t": 164.53333333333333, "x": "覆面をかぶったレスラーが世界王者になったのは、\nこれが初めてのことだったと記録されています。"}, {"t": 170.5, "x": "このマスクをかぶったまま、\n1963年5月、日本にやって来ます。"}, {"t": 176.25, "x": "呼んだのは日本プロレスです。"}, {"t": 178.11666666666667, "x": "相手は力道山でした。"}, {"t": 179.78333333333333, "x": "その来日中の1963年5月23日、\n静岡県の駿府会館でジャイアント馬場と"}, {"t": 186.81666666666666, "x": "時間無制限の試合を行っています。"}, {"t": 189.21666666666667, "x": "イメージ映像"}, {"t": 189.21666666666667, "x": "このときデストロイヤーは、\nいつもの白い覆面ではなく、デビルマスクと"}, {"t": 194.23333333333332, "x": "呼ばれる黒い覆面をかぶってリングに上がりました。"}, {"t": 197.13333333333333, "x": "日本での試合で黒い覆面をかぶったのは、\nこの一戦だけです。"}, {"t": 201.53333333333333, "x": "イメージ映像"}, {"t": 201.53333333333333, "x": "そして翌1963年5月24日、\n東京・千駄ヶ谷の東京体育館。"}, {"t": 207.78333333333333, "x": "力道山を相手にしたWWA世界\nヘビー級選手権試合が行われました。"}, {"t": 213.13333333333333, "x": "この試合の平均視聴率は64\nパーセントを記録しています。"}, {"t": 217.38333333333333, "x": "この数字は現在でも、日本のテレビの\n歴代視聴率の4位に入っています。"}, {"t": 222.55, "x": "試合は決着がつきませんでした。"}, {"t": 224.9, "x": "デストロイヤーは足4の字固めで力道山を\nとらえましたが、力道山はギブアップせず、体を"}, {"t": 231.43333333333334, "x": "反転させて逆にデストロイヤーの足を攻めています。"}, {"t": 234.55, "x": "両者とも譲らないまま、\nレフェリーが引き分けを宣言しました。"}, {"t": 238.75, "x": "イメージ映像"}, {"t": 238.75, "x": "デストロイヤーと力道山のシングルマッチの\n通算成績は、1勝1敗2分と記録されています。"}, {"t": 245.5, "x": "なお、来日そのものについては、\nこういう話も残っています。"}, {"t": 250.66666666666666, "x": "力道山の夫人によると、デストロイヤーは\n太平洋戦争のことがあって当初は日本に行くことを"}, {"t": 256.75, "x": "断っていた、1試合だけという約束で\n引き受けたものだった、ということです。"}, {"t": 262.23333333333335, "x": "これはデストロイヤー本人から\n聞いた話として語られているものです。"}, {"t": 266.3333333333333, "x": "1963年12月8日、力道山が刺されます。"}, {"t": 270.8833333333333, "x": "デストロイヤーはこの日の\n1次会の席に同席していました。"}, {"t": 274.5, "x": "イメージ映像"}, {"t": 274.5, "x": "翌日の早朝の飛行機でアメリカに\n帰る予定だったため、2次会には行っていません。"}, {"t": 280.0833333333333, "x": "後年、そのことを悔やむ言葉を残しています。"}, {"t": 283.55, "x": "イメージ映像"}, {"t": 283.55, "x": "力道山が亡くなった後も、\nデストロイヤーは日本に来続けました。"}, {"t": 288.01666666666665, "x": "1965年6月3日、札幌。"}, {"t": 291.68333333333334, "x": "義理の兄弟にあたるビリー・レッド・\nライオンと組み、豊登とジャイアント馬場の"}, {"t": 296.5, "x": "組からアジアタッグ王座を奪っています。"}, {"t": 298.9166666666667, "x": "1966年2月8日には、アメリカのテキサス\n州ダラスで、当時アメリカで修行をしていた"}, {"t": 306.03333333333336, "x": "アントニオ猪木の組からタッグ王座を奪いました。"}, {"t": 308.8666666666667, "x": "猪木とのシングルマッチも、\n通算1勝1敗2分と記録されています。"}, {"t": 313.9166666666667, "x": "そして1972年、全日本プロレスが\n旗揚げした後の来日のときに、"}, {"t": 319.51666666666665, "x": "デストロイヤーはこう宣言します。"}, {"t": 321.95, "x": "馬場に負けたら、助っ人として日本に残る。"}, {"t": 325.1166666666667, "x": "デストロイヤーはこの試合に敗れました。"}, {"t": 327.6, "x": "そして1973年3月から1979年6月まで、\n全日本プロレスの所属選手として日本で"}, {"t": 335.53333333333336, "x": "イメージ映像"}, {"t": 335.53333333333336, "x": "活動することになります。"}, {"t": 337.03333333333336, "x": "ここからが、この回の本題です。"}, {"t": 339.6166666666667, "x": "1973年10月5日、日本テレビで「\n金曜10時! うわさのチャンネル!!」と"}, {"t": 346.51666666666665, "x": "いうバラエティー番組が始まりました。"}, {"t": 348.7, "x": "放送は毎週金曜の夜10時から。"}, {"t": 351.23333333333335, "x": "生放送です。"}, {"t": 352.48333333333335, "x": "デストロイヤーは、この番組の\n開始からレギュラー出演しました。"}, {"t": 356.71666666666664, "x": "プロレスの中継ではありません。"}, {"t": 358.71666666666664, "x": "歌手やタレントが出るバラエティー番組です。"}, {"t": 361.35, "x": "出演の話は、当時「全日本プロレス中継」を\n担当していたプロデューサーの"}, {"t": 366.51666666666665, "x": "発案だったと記録されています。"}, {"t": 368.43333333333334, "x": "初回の視聴率は4.7パーセントでした。"}, {"t": 371.51666666666665, "x": "しかし和田アキ子、せんだみつお、\nデストロイヤーのやり取りが人気になり、"}, {"t": 376.46666666666664, "x": "1か月ほどで20パーセントを超えています。"}, {"t": 379.6666666666667, "x": "番組の中では、和田アキ子が仲間の悪ガキたちを\n叱り飛ばすという形のコーナーがありました。"}, {"t": 385.8, "x": "イメージ映像"}, {"t": 385.8, "x": "デストロイヤーはその悪ガキの1人です。"}, {"t": 388.28333333333336, "x": "白い覆面のまま、なぜかドイツ軍の兵士の\nヘルメットをかぶって出ていた回もあります。"}, {"t": 393.9, "x": "和田アキ子から「おい、デストロイヤー、\nこっちこい」と乱暴に呼ばれて戸惑ってみせる。"}, {"t": 399.56666666666666, "x": "それがこの人の役どころでした。"}, {"t": 401.5833333333333, "x": "イメージ映像"}, {"t": 401.5833333333333, "x": "このコーナーでは、ゲストがデストロイヤーの\n足4の字固めをかけられて悶絶するのが"}, {"t": 406.8666666666667, "x": "決まりごとのようになっていました。"}, {"t": 408.6333333333333, "x": "当時、日本テレビの\nアナウンサーだった徳光和夫もその1人です。"}, {"t": 413.05, "x": "足4の字固めをかけられながら\n「俺はギャラがないんだぞ」"}, {"t": 416.3333333333333, "x": "「数日後には父親参観なんだよ、\n俺」と叫ぶ姿が放送されています。"}, {"t": 421.48333333333335, "x": "デストロイヤーがこの番組に出ていたのは、\n1978年までと記録されています。"}, {"t": 427.4166666666667, "x": "番組そのものは1979年\n6月29日まで続きました。"}, {"t": 432.21666666666664, "x": "テレビ以外の記録もあります。"}, {"t": 434.1, "x": "1974年、日本のレコード会社から「\nデストロイヤーの楽しいクリスマス」と"}, {"t": 439.65, "x": "いうアルバムが発売されました。"}, {"t": 441.46666666666664, "x": "クリスマスの曲を日本語と英語で\n歌ったもので、妻も参加しています。"}, {"t": 446.26666666666665, "x": "このアルバムは1万2000枚、\nそこから出たシングルは8万枚を"}, {"t": 450.6666666666667, "x": "売り上げたと記録されています。"}, {"t": 452.3666666666667, "x": "1975年には、和田アキ子が\n主演した映画に助演として出ています。"}, {"t": 457.85, "x": "一方、リングでの記録も並行して残っています。"}, {"t": 461.6166666666667, "x": "1974年7月25日から1976年\n8月28日にかけて、デストロイヤーは"}, {"t": 469.1666666666667, "x": "「覆面十番勝負」という一連の試合を行いました。"}, {"t": 472.5, "x": "世界の覆面レスラー10人と戦うという企画です。"}, {"t": 475.98333333333335, "x": "第1戦の相手はミル・マスカラスでした。"}, {"t": 478.6166666666667, "x": "1975年3月12日には、静岡県富士宮で、\n当時のNWA世界ヘビー級王者ジャック・"}, {"t": 486.65, "x": "ブリスコの王座に挑戦しています。"}, {"t": 488.73333333333335, "x": "全日本プロレスでは、PWF認定US\nヘビー級王座を通算4回獲得しています。"}, {"t": 495.48333333333335, "x": "また、白い覆面とは別の\n覆面をかぶっていた時期もあります。"}, {"t": 499.81666666666666, "x": "1968年、アメリカのAWAという団体で、\nドクターXという名前で黒い覆面をかぶり、8月"}, {"t": 508.71666666666664, "x": "17日にAWA世界ヘビー級王座を獲得しました。"}, {"t": 512.5833333333334, "x": "イメージ映像"}, {"t": 512.5833333333334, "x": "ただしこの王座は8月\n31日に奪い返されています。"}, {"t": 516.4666666666667, "x": "保持したのは2週間ほどでした。"}, {"t": 518.5333333333333, "x": "全日本プロレスでは若手選手の\nコーチも務めました。"}, {"t": 521.8833333333333, "x": "ジャンボ鶴田や渕正信が、\nこの人から教わっています。"}, {"t": 525.8333333333334, "x": "1975年度のプロレス大賞では、\n大衆賞を受けています。"}, {"t": 530.7833333333333, "x": "では、素顔はどうだったのでしょうか。"}, {"t": 533.55, "x": "空港でもマスクを外さず「ボク、デストロイヤー」と\n言って搭乗口を出ようとしたことがあった、と"}, {"t": 540.0, "x": "いう話が伝わっています。"}, {"t": 541.6166666666667, "x": "マスクをかぶったまま自動車を運転していたのを\n目撃されたという話も残っています。"}, {"t": 546.85, "x": "ただし、素顔が出た記録もあります。"}, {"t": 549.6666666666666, "x": "1974年2月10日のスポーツ報知に「\nデストロイヤーのマスクをはぐ」という特集記事が"}, {"t": 555.4833333333333, "x": "載り、そこで素顔が公開されました。"}, {"t": 558.2, "x": "またゴルフの練習場では、暑かったのか\nその場でマスクを脱いでクラブを"}, {"t": 562.7333333333333, "x": "振っていた、という話も残っています。"}, {"t": 565.55, "x": "イメージ映像"}, {"t": 565.55, "x": "つまり「一度も素顔を見せなかった」\nわけではありません。"}, {"t": 568.6666666666666, "x": "記録の上で確認できるのは、公の場では\nほとんど外さなかった、ということです。"}, {"t": 574.6, "x": "1979年6月、デストロイヤーは\n日本でのレギュラー参戦を終えます。"}, {"t": 580.4333333333333, "x": "そのときに「日本陣営引退記念試合」\nとして組まれたのが、馬場との特別試合でした。"}, {"t": 585.9666666666667, "x": "デストロイヤーは入場式の後に後楽園ホールの\n放送席へ行き、視聴者へのプレゼントとして、"}, {"t": 592.4, "x": "実際に試合で使ったマスクや、\n試合で着たガウンをサイン入りで渡しています。"}, {"t": 597.8, "x": "この日の花束の贈呈には、番組で共演していた和田\nアキ子とせんだみつおも来ていました。"}, {"t": 603.6666666666666, "x": "その後も毎年1回、全日本プロレスの\n夏のシリーズに特別参戦を続けます。"}, {"t": 609.3833333333333, "x": "イメージ映像"}, {"t": 609.3833333333333, "x": "そして1993年7月29日、\n日本武道館での引退試合を迎えました。"}, {"t": 615.8333333333334, "x": "イメージ映像"}, {"t": 615.8333333333334, "x": "引退後はアメリカで高校の体育の教師になり、\n水泳教室の指導もしています。"}, {"t": 621.4833333333333, "x": "日本との関わりは、その後も続きました。"}, {"t": 624.5333333333333, "x": "デストロイヤーは、およそ6年間、\n東京都港区の三ノ橋の近くに住んでいます。"}, {"t": 630.6166666666667, "x": "麻布十番のすぐそばです。"}, {"t": 632.55, "x": "毎年、麻布十番の夏祭りでチャリティーの\nサイン会を開いていました。"}, {"t": 637.4666666666667, "x": "自分が作った少年レスリングのチームを\n連れて来日したこともあります。"}, {"t": 641.8833333333333, "x": "アメリカの自宅には、\n特別に作らせた和室があります。"}, {"t": 645.7, "x": "1999年5月2日、東京ドーム。"}, {"t": 649.6666666666666, "x": "この年の1月に亡くなったジャイアント馬場の\n引退記念試合が組まれ、デストロイヤーは"}, {"t": 655.1333333333333, "x": "最後のタッグパートナーに指名されました。"}, {"t": 657.5833333333334, "x": "試合後のあいさつでは、日本語で「社長、\nほんとうにお疲れさまでした」と言っています。"}, {"t": 663.3333333333334, "x": "2017年、日本政府は秋の叙勲で、\nデストロイヤーに旭日双光章を"}, {"t": 669.2, "x": "贈ることを発表しました。"}, {"t": 670.8166666666667, "x": "プロレスラーの時代から日米の友好と青少年の\n交流に貢献してきたことが理由とされています。"}, {"t": 676.9333333333333, "x": "イメージ映像"}, {"t": 676.9333333333333, "x": "体調を考えて来日はせず、翌2018年2月、\nアメリカのニューヨーク州バッファローで"}, {"t": 683.6833333333333, "x": "叙勲の伝達式が行われました。"}, {"t": 685.9166666666666, "x": "2019年3月7日、デストロイヤーはニューヨーク\n州バッファローの自宅で亡くなりました。"}, {"t": 691.85, "x": "88歳でした。"}, {"t": 693.3833333333333, "x": "長男のカートによると、7日の正午過ぎ、\n家族に囲まれて自宅のベッドで"}, {"t": 698.8, "x": "息を引き取ったということです。"}, {"t": 700.5333333333333, "x": "最後に、日付を並べ直します。"}, {"t": 703.1833333333333, "x": "1930年7月11日、\nニューヨーク州バッファローに生まれる。"}, {"t": 708.25, "x": "1954年、プロレスラーとしての活動を始める。"}, {"t": 712.4666666666667, "x": "1962年、覆面をかぶり\nザ・デストロイヤーになる。"}, {"t": 716.8666666666667, "x": "同年7月27日、覆面をかぶった\nレスラーとして初めて世界王者になる。"}, {"t": 722.55, "x": "1963年5月、日本プロレスに初来日。"}, {"t": 726.8666666666667, "x": "5月23日、駿府会館で\n黒い覆面をかぶって馬場と対戦。"}, {"t": 731.8, "x": "5月24日、東京体育館で力道山と引き分ける。"}, {"t": 736.2166666666667, "x": "この試合の平均視聴率は64パーセント。"}, {"t": 739.5333333333333, "x": "1973年3月、\n全日本プロレスの所属選手になる。"}, {"t": 744.5166666666667, "x": "同年10月5日、日本テレビのバラエティー\n番組にレギュラー出演を始める。"}, {"t": 749.7833333333333, "x": "1974年、レコードを出す。"}, {"t": 752.85, "x": "1974年7月25日、覆面十番勝負が始まる。"}, {"t": 758.1833333333333, "x": "1979年6月、日本での\nレギュラー参戦を終える。"}, {"t": 762.85, "x": "1993年7月29日、日本武道館で引退。"}, {"t": 767.7833333333333, "x": "2017年、旭日双光章。"}, {"t": 770.6833333333333, "x": "2019年3月7日、88歳で死去。"}, {"t": 774.5333333333333, "x": "イメージ映像"}, {"t": 774.5333333333333, "x": "日本のリングに立ったのが1963年、\n亡くなったのが2019年です。"}, {"t": 780.6166666666667, "x": "その間、56年になります。"}, {"t": 783.3333333333334, "x": "イメージ映像"}, {"t": 783.3333333333334, "x": "この人が日本で覆面を外さなかったことは、\n記録の上でもだいたい一貫しています。"}, {"t": 788.9166666666666, "x": "ただし外した記録も残っています。"}, {"t": 791.15, "x": "断定できるのは、1963年に1試合だけの\n約束で来た男が、そのマスクをかぶった"}, {"t": 798.1, "x": "イメージ映像"}, {"t": 798.1, "x": "まま日本のリングとテレビに出続け、最後は\n日本の勲章を受け取った、というところまでです。"}, {"t": 804.5166666666667, "x": "今回の物語を通して、皆様の中にザ・\nデストロイヤーという1人のプロレスラーの"}, {"t": 809.8666666666667, "x": "新しい一面が刻まれていれば幸いです。"}, {"t": 812.65, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 816.0166666666667, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 960, "h": 540, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
