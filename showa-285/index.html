<script>
const D={"name": "猪木と熊殺しウィリー", "file": "285_編集用", "dur": 914.16665625, "segs": [], "subs": [{"t": 0.0, "x": "1980年2月27日。"}, {"t": 2.8333333333333335, "x": "東京の蔵前国技館です。"}, {"t": 4.9, "x": "リングの上には、\nアントニオ猪木が立っていました。"}, {"t": 8.283333333333333, "x": "向かい合ったのは空手家の\nウィリー・ウィリアムスです。"}, {"t": 11.033333333333333, "x": "熊殺しと呼ばれた男でした。"}, {"t": 13.033333333333333, "x": "第4ラウンド、2人はもつれた\nままリングの下へ落ちました。"}, {"t": 17.033333333333335, "x": "猪木は場外で腕ひしぎ十字固めを決めていました。"}, {"t": 20.3, "x": "周りでは両方のセコンドが入り乱れていました。"}, {"t": 23.216666666666665, "x": "試合は4ラウンド1分24秒で止められました。"}, {"t": 26.65, "x": "結果は両者ドクターストップの引き分けです。"}, {"t": 29.35, "x": "勝った人も負けた人もいない試合でした。"}, {"t": 31.8, "x": "それでも、この一戦は\n特別な試合として語られています。"}, {"t": 35.916666666666664, "x": "猪木の異種格闘技戦で、最も殺気に\n満ちた試合と書かれているのです。"}, {"t": 40.766666666666666, "x": "この夜の蔵前国技館では、\n何が起きていたのでしょうか？"}, {"t": 44.93333333333333, "x": "そしてこの試合は、どこから\n始まっていたのでしょうか？"}, {"t": 48.666666666666664, "x": "今回は猪木とウィリー・ウィリアムスの\n一戦を、始まりから順に追います。"}, {"t": 53.25, "x": "新聞や雑誌の記事と関係者の証言を、\n日付に沿って辿っていきます。"}, {"t": 58.3, "x": "最後までご覧いただければ幸いです。"}, {"t": 60.8, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 66.38333333333334, "x": "まずウィリー・ウィリアムスという空手家です。"}, {"t": 68.76666666666667, "x": "生まれはアメリカです。"}, {"t": 70.16666666666667, "x": "身長は2メートル近くありました。"}, {"t": 72.48333333333333, "x": "極真会館のアメリカの\nコネチカット支部で空手を学んでいます。"}, {"t": 76.5, "x": "1975年には極真会館の\n世界大会に出場しました。"}, {"t": 81.23333333333333, "x": "名前が日本で広く知られたのは、\n1本の映画からです。"}, {"t": 85.16666666666667, "x": "1976年に公開された、\n地上最強のカラテPART2です。"}, {"t": 90.3, "x": "この映画でウィリーは大きな熊と闘いました。"}, {"t": 93.08333333333333, "x": "ここから熊殺しと呼ばれるようになります。"}, {"t": 95.56666666666666, "x": "ただ記事は、実際には熊を\n殺していないと書いています。"}, {"t": 99.41666666666667, "x": "当時の極真会館は大きな団体でした。"}, {"t": 102.25, "x": "最も多い時で、世界に500万人の\n門下生がいたとされています。"}, {"t": 107.08333333333333, "x": "一方の新日本プロレスはどうだったでしょうか。"}, {"t": 110.08333333333333, "x": "全国に2000万人の\nファンがいると言われていました。"}, {"t": 113.2, "x": "この2つの勢力が、当時の格闘技の\n人気を引っ張っていました。"}, {"t": 117.66666666666667, "x": "次は猪木です。"}, {"t": 118.86666666666666, "x": "1976年2月6日、場所は日本武道館です。"}, {"t": 123.6, "x": "猪木は、ウィリエム・ルスカと戦いました。"}, {"t": 126.41666666666667, "x": "柔道の金メダリストです。"}, {"t": 128.26666666666668, "x": "猪木がTKOで勝ちました。"}, {"t": 130.26666666666668, "x": "これが猪木の異種格闘技戦の始まりでした。"}, {"t": 133.01666666666668, "x": "同じ年の6月26日には、\nモハメド・アリと戦いました。"}, {"t": 137.28333333333333, "x": "ボクシングの世界王者です。"}, {"t": 139.15, "x": "判定は引き分けでした。"}, {"t": 140.78333333333333, "x": "10月7日には、蔵前国技館で\nアンドレ・ザ・ジャイアントと戦いました。"}, {"t": 145.6, "x": "これも猪木のTKO勝ちです。"}, {"t": 147.7, "x": "12月9日には、ルスカとの2度目の試合です。"}, {"t": 151.2, "x": "これも猪木の勝ちでした。"}, {"t": 152.73333333333332, "x": "その3日後は12月12日です。"}, {"t": 155.26666666666668, "x": "猪木はパキスタンのカラチで試合をしました。"}, {"t": 157.93333333333334, "x": "地元の英雄が相手でした。"}, {"t": 159.81666666666666, "x": "1977年8月2日には、\nザ・モンスターマンと戦っています。"}, {"t": 165.05, "x": "アメリカのプロ空手の王者でした。"}, {"t": 167.16666666666666, "x": "5ラウンドのKO勝ちです。"}, {"t": 169.0, "x": "猪木はプロレスこそ最強と言い続けていました。"}, {"t": 171.9, "x": "柔道やボクシングや空手の相手と、\n次々に試合を重ねていきました。"}, {"t": 176.76666666666668, "x": "試合の数は、その後も増えていきます。"}, {"t": 179.75, "x": "1978年6月7日、福岡で\nモンスターマンと再び戦いました。"}, {"t": 185.36666666666667, "x": "モンスターマンが再戦を求めていました。"}, {"t": 187.83333333333334, "x": "猪木は神輿に乗って入場しています。"}, {"t": 190.35, "x": "7ラウンドでKO勝ちでした。"}, {"t": 192.33333333333334, "x": "1978年11月9日は、\n西ドイツのフランクフルトです。"}, {"t": 197.58333333333334, "x": "相手はボクサーでした。"}, {"t": 199.11666666666667, "x": "ヨーロッパを回るシリーズの1試合です。"}, {"t": 201.66666666666666, "x": "猪木もグローブを着けて戦いました。"}, {"t": 203.9, "x": "1979年4月3日は福岡です。"}, {"t": 207.4, "x": "相手は空手とカンフーの打撃を使う選手でした。"}, {"t": 210.61666666666667, "x": "最後はバックドロップの連発でした。"}, {"t": 212.96666666666667, "x": "1979年6月17日は、\nパキスタンのラホールです。"}, {"t": 217.85, "x": "3年前のカラチの相手の弟が、\n一族の名誉を懸けて挑んできました。"}, {"t": 222.95, "x": "10分5ラウンドの、変わったルールでした。"}, {"t": 225.96666666666667, "x": "試合は時間切れの引き分けでした。"}, {"t": 228.25, "x": "1979年10月5日は、韓国のソウルです。"}, {"t": 232.66666666666666, "x": "ルスカとの3度目の試合でした。"}, {"t": 234.71666666666667, "x": "ルスカは柔道着を着て上がりました。"}, {"t": 236.93333333333334, "x": "そして途中で、柔道着を脱ぎ捨てました。"}, {"t": 239.96666666666667, "x": "最後は猪木が弓矢固めで勝っています。"}, {"t": 242.68333333333334, "x": "ここで、話を少し戻します。"}, {"t": 245.2, "x": "新日本プロレスと極真会館の\n間には、もっと前から因縁がありました。"}, {"t": 250.4, "x": "始まりは1975年です。"}, {"t": 253.01666666666668, "x": "この年、極真会館は世界大会を\n開くと発表しました。"}, {"t": 257.46666666666664, "x": "第1回オープントーナメント\n全世界空手道選手権大会です。"}, {"t": 261.8, "x": "表明の場は、週刊少年マガジンの誌面でした。"}, {"t": 265.55, "x": "どんな格闘技の挑戦も受ける、という内容です。"}, {"t": 269.23333333333335, "x": "新日本プロレスはこれに反発しました。"}, {"t": 271.96666666666664, "x": "当時の新日本の幹部だった新間寿の\n証言が残っています。"}, {"t": 276.05, "x": "新間は所属する選手13人分の\n出場の申込書を書きました。"}, {"t": 280.6333333333333, "x": "その中には猪木や坂口征二の名前もありました。"}, {"t": 283.9, "x": "新間はそれを、東京・池袋の極真会館の\n本部道場へ持って行きました。"}, {"t": 289.3, "x": "新間はこのとき、\n選手にこう言ったと話しています。"}, {"t": 292.8666666666667, "x": "全員反則負けでいいから、\n腕でもヘシ折ってやれ。"}, {"t": 296.53333333333336, "x": "極真の大会はつかむことを禁じたルールでした。"}, {"t": 299.6333333333333, "x": "極真の側は、大会がプロレスラーに\n荒らされることを心配しました。"}, {"t": 304.23333333333335, "x": "後日、極真会館の館長が新間と\n直接会って話し合います。"}, {"t": 309.0, "x": "こうして両者はいったん和解しました。"}, {"t": 311.3333333333333, "x": "それでも、わだかまりは消えませんでした。"}, {"t": 314.28333333333336, "x": "極真の門下生の間には、\n新日本への敵意が残ったとされています。"}, {"t": 319.23333333333335, "x": "話が再び動いたのは1978年4月です。"}, {"t": 323.23333333333335, "x": "4月4日、猪木はアメリカの\nフィラデルフィアで試合をしました。"}, {"t": 327.56666666666666, "x": "アメリカで開かれた格闘技の大会でした。"}, {"t": 330.26666666666665, "x": "坂口征二も、同じ大会で戦っています。"}, {"t": 333.5833333333333, "x": "猪木の相手は、全米プロ空手の王者です。"}, {"t": 336.8666666666667, "x": "モンスターマンの\n好敵手という触れ込みの選手でした。"}, {"t": 340.1166666666667, "x": "猪木は3ラウンドでKO勝ちしています。"}, {"t": 342.76666666666665, "x": "同じ月、ウィリーの師匠が動きました。"}, {"t": 345.75, "x": "極真のアメリカの支部長です。"}, {"t": 347.85, "x": "支部長はウィリーを連れて、\n猪木への挑戦を表明しました。"}, {"t": 352.0833333333333, "x": "記事にはその言葉が残っています。"}, {"t": 354.3333333333333, "x": "プロ空手ごときに勝っただけで、\n格闘技世界一を名乗ることは許さん。"}, {"t": 358.98333333333335, "x": "この挑戦には、後ろで\n動いた人物がいたとされています。"}, {"t": 363.1666666666667, "x": "劇画の原作者の、梶原一騎です。"}, {"t": 366.1166666666667, "x": "新間の証言があります。"}, {"t": 367.93333333333334, "x": "ウィリーとの試合は、\n梶原の側から持ち込まれた話でした。"}, {"t": 372.1166666666667, "x": "梶原は極真会館を描いた劇画、\n空手バカ一代の原作者です。"}, {"t": 377.2, "x": "1978年からは、もう1つの連載がありました。"}, {"t": 381.65, "x": "週刊少年マガジンの、四角いジャングルです。"}, {"t": 385.01666666666665, "x": "梶原は、この原作も手がけていました。"}, {"t": 387.93333333333334, "x": "この四角いジャングルでも、\nウィリーは大きく取り上げられています。"}, {"t": 392.0, "x": "1979年2月6日、猪木は\n大阪府立体育館で試合をしました。"}, {"t": 397.96666666666664, "x": "相手は、覆面をかぶった空手家です。"}, {"t": 400.9, "x": "四角いジャングルに\n出てくる登場人物だった選手です。"}, {"t": 404.31666666666666, "x": "猪木は3ラウンドで勝ちました。"}, {"t": 406.3, "x": "逆十字固めでした。"}, {"t": 407.8333333333333, "x": "ウィリーとの試合の話は、\n3人で進められました。"}, {"t": 411.46666666666664, "x": "新間と梶原、そして梶原の\n側の格闘技の道場の会長です。"}, {"t": 416.25, "x": "1979年11月、ウィリーは\n極真会館の第2回の世界大会に出ました。"}, {"t": 422.73333333333335, "x": "結果は3位です。"}, {"t": 424.1666666666667, "x": "猪木との対戦の話がまとまると、\n極真会館の館長は声明を出しました。"}, {"t": 429.55, "x": "他流試合は許さない。"}, {"t": 431.1666666666667, "x": "強行すれば、ウィリーは破門とする。"}, {"t": 433.93333333333334, "x": "ウィリーは試合の前に破門されました。"}, {"t": 436.3333333333333, "x": "師匠の支部長も処分を受けています。"}, {"t": 438.8833333333333, "x": "新間は、館長の破門の判断をこう見ています。"}, {"t": 442.5, "x": "極真と新日本の戦争を\n避けるためだった、という見方です。"}, {"t": 447.0, "x": "それでもこの試合は、プロレスと\n極真の頂上対決と見られ続けました。"}, {"t": 451.98333333333335, "x": "東京スポーツの記事は、\nこの試合を代理戦争と書いています。"}, {"t": 456.21666666666664, "x": "極真空手と、新日本プロレスの代理戦争です。"}, {"t": 459.96666666666664, "x": "1979年12月13日、猪木は\n京都府立体育館で別の空手家と戦いました。"}, {"t": 467.06666666666666, "x": "猪木は3ラウンドで勝ちました。"}, {"t": 469.05, "x": "KO勝ちです。"}, {"t": 470.25, "x": "ウィリーとの試合を前にした一戦でした。"}, {"t": 472.8333333333333, "x": "試合の前から、周りは騒がしくなっていました。"}, {"t": 476.3333333333333, "x": "新日本の事務所には、脅しの電話が\n何本もかかってきたとされています。"}, {"t": 481.25, "x": "プロレスのファンの側も熱くなっていました。"}, {"t": 483.75, "x": "空手の道場の看板が\n壊されたという話も残っています。"}, {"t": 487.6666666666667, "x": "新日本の側は、蔵前警察署に何度も\n呼ばれたと証言されています。"}, {"t": 492.68333333333334, "x": "警察官40人では足りないとされました。"}, {"t": 495.56666666666666, "x": "そこでガードマンを100人雇いました。"}, {"t": 497.983333333 const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
