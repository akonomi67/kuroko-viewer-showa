<script>
const D={"name": "ケンドー・ナガサキ", "file": "265_編集用", "dur": 841.9, "segs": [], "subs": [{"t": 0.0, "x": "2020年1月12日、千葉県市原市。"}, {"t": 3.85, "x": "自宅で倒れている71歳の\n男を知人が見つけました。"}, {"t": 7.666666666666667, "x": "男はすでに亡くなっていました。"}, {"t": 9.583333333333334, "x": "名前は桜田一男です。"}, {"t": 11.416666666666666, "x": "リングでは、ケンドー・ナガサキと\n名乗っていました。"}, {"t": 14.6, "x": "死因は公表されていません。"}, {"t": 16.75, "x": "近い親族もいませんでした。"}, {"t": 18.716666666666665, "x": "そのため、葬儀の日取りも決められませんでした。"}, {"t": 22.066666666666666, "x": "翌日には、大日本プロレスの\n会長が呼びかけています。"}, {"t": 26.083333333333332, "x": "親族の方がいたら団体に連絡してほしい。"}, {"t": 29.083333333333332, "x": "そういう呼びかけでした。"}, {"t": 30.65, "x": "この男は、アメリカのリングで\n素顔を見せませんでした。"}, {"t": 34.5, "x": "顔には色を塗っていました。"}, {"t": 36.2, "x": "手には竹刀を持っていました。"}, {"t": 37.93333333333333, "x": "日本人の悪役として北米の各地を回った人です。"}, {"t": 41.46666666666667, "x": "網走で生まれた若者は、なぜ顔を塗った別の\n名前で戦うことになったのでしょうか？"}, {"t": 47.13333333333333, "x": "今回は桜田一男という1人の\nプロレスラーの71年を追っていきます。"}, {"t": 51.88333333333333, "x": "具体的な日付と残された記録をもとに\n辿っていきます。"}, {"t": 55.416666666666664, "x": "最後までご覧いただければ幸いです。"}, {"t": 57.916666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 63.483333333333334, "x": "桜田一男は、\n1948年9月26日に生まれました。"}, {"t": 68.61666666666666, "x": "生まれた町は北海道の網走市です。"}, {"t": 71.15, "x": "父親は網走刑務所の職員でした。"}, {"t": 73.85, "x": "東京スポーツによれば、幼い頃は\n刑務所の敷地の中で育ったといいます。"}, {"t": 79.08333333333333, "x": "最初に入った世界は大相撲です。"}, {"t": 81.55, "x": "1964年に、立浪部屋で初土俵を踏みました。"}, {"t": 86.06666666666666, "x": "15歳の年です。"}, {"t": 87.51666666666667, "x": "相撲の記録では、1966年9月場所で\n序二段の優勝をしています。"}, {"t": 93.2, "x": "最高位は幕下の13枚目でした。"}, {"t": 95.85, "x": "そして1971年3月に、土俵を去りました。"}, {"t": 100.16666666666667, "x": "次の行き先は日本プロレスです。"}, {"t": 102.41666666666667, "x": "デビューは、1971年6月27日でした。"}, {"t": 106.9, "x": "この日付は、東京スポーツの\n記事に合わせています。"}, {"t": 110.48333333333333, "x": "海外の資料には、\n6月21日とするものもあります。"}, {"t": 114.61666666666666, "x": "日本プロレスの頃から、\n桜田にはある呼び名がありました。"}, {"t": 118.55, "x": "ケンカ最強です。"}, {"t": 119.9, "x": "東京スポーツは、\nそう言われていたと伝えています。"}, {"t": 123.43333333333334, "x": "体は身長188センチです。"}, {"t": 126.18333333333334, "x": "体重は120キロありました。"}, {"t": 128.33333333333334, "x": "得意な技は、パイルドライバーでした。"}, {"t": 131.18333333333334, "x": "この呼び名には、\nいくつもの話がついて回りました。"}, {"t": 134.68333333333334, "x": "東京スポーツの記事には、\nその話がまとめて載っています。"}, {"t": 138.7, "x": "巡業の途中で30人ほどの暴走族に\n囲まれたことがあったそうです。"}, {"t": 143.35, "x": "その時は、750ccのバイクを\n1台ずつ壊していったといいます。"}, {"t": 148.46666666666667, "x": "高速道路で燃える軽自動車から女性を\n助け出そうとした話もあります。"}, {"t": 153.01666666666668, "x": "女性が中からドアに鍵をかけていました。"}, {"t": 155.58333333333334, "x": "そのため、ドアを壊して助けたそうです。"}, {"t": 158.73333333333332, "x": "どれも記事の中で伝えられている話です。"}, {"t": 161.38333333333333, "x": "ところがその日本プロレスは、\n2年ほどでなくなります。"}, {"t": 164.9, "x": "1973年のことです。"}, {"t": 167.33333333333334, "x": "桜田はジャイアント馬場の\n全日本プロレスへ移りました。"}, {"t": 170.86666666666667, "x": "ここまでは、相撲から来た若手の1人です。"}, {"t": 173.96666666666667, "x": "まだ顔に色は塗っていません。"}, {"t": 175.9, "x": "1976年に、桜田は1人でアメリカへ渡ります。"}, {"t": 180.58333333333334, "x": "名乗った名前は、ミスター・サクラダでした。"}, {"t": 183.46666666666667, "x": "日本人の悪役として北米の\nリングに上がり始めます。"}, {"t": 187.0, "x": "主な舞台の1つがカナダのカルガリーでした。"}, {"t": 189.66666666666666, "x": "スタンピード・レスリングという団体があった町です。"}, {"t": 192.75, "x": "1978年5月に、桜田はこの団体の\n北米ヘビー級王座を取りました。"}, {"t": 198.95, "x": "取った日には、2つの記録があります。"}, {"t": 201.71666666666667, "x": "1つは5月19日のカルガリーです。"}, {"t": 204.28333333333333, "x": "もう1つは、翌日のエドモントンです。"}, {"t": 207.28333333333333, "x": "王座は9月1日に手放しました。"}, {"t": 209.66666666666666, "x": "同じ1978年の7月8日には、\n大きな試合に出ています。"}, {"t": 214.88333333333333, "x": "場所はエドモントンです。"}, {"t": 216.48333333333332, "x": "NWA世界ヘビー級王座への挑戦でした。"}, {"t": 219.8, "x": "その試合の記録が今も残っています。"}, {"t": 222.35, "x": "カルガリーでは、もう1人の\n日本人と組んでいました。"}, {"t": 225.88333333333333, "x": "ミスター・ヒトです。"}, {"t": 227.03333333333333, "x": "1979年2月に、\n2人はタッグ王座を取りました。"}, {"t": 231.65, "x": "この時に破った組には、\n地元の若い選手がいました。"}, {"t": 235.56666666666666, "x": "ブレット・ハートです。"}, {"t": 236.88333333333333, "x": "同じ年の7月には、別の組から\nこのベルトを取り返しています。"}, {"t": 241.35, "x": "ブレット・ハートは、のちに\nアメリカで世界王者になる選手です。"}, {"t": 245.45, "x": "そのブレットは、1977年に\nこの仕事を始めました。"}, {"t": 250.15, "x": "その時に教えた1人が桜田だったと、\n海外の専門サイトは伝えています。"}, {"t": 255.45, "x": "ミスター・ヒトも教えた側にいました。"}, {"t": 257.6333333333333, "x": "1980年代に入ると、桜田は姿を変えます。"}, {"t": 262.15, "x": "顔に色を塗った別の人物になりました。"}, {"t": 264.73333333333335, "x": "リングネームは、ケンドー・ナガサキです。"}, {"t": 267.5, "x": "実はこの名前には、先に使っていた人がいます。"}, {"t": 271.06666666666666, "x": "イギリスのプロレスラーです。"}, {"t": 272.78333333333336, "x": "こちらは覆面をかぶっていました。"}, {"t": 274.9, "x": "桜田は覆面をかぶりませんでした。"}, {"t": 277.3833333333333, "x": "素顔の上に色を塗ったのです。"}, {"t": 279.4166666666667, "x": "そして剣道の竹刀を武器として手に持ちました。"}, {"t": 282.26666666666665, "x": "この写真は、1983年11月に出た\nアメリカのプロレス雑誌に載ったものです。"}, {"t": 288.56666666666666, "x": "殴っているのは、プエルトリコの\nカルロス・コロンです。"}, {"t": 291.98333333333335, "x": "殴られているのがケンドー・ナガサキです。"}, {"t": 294.35, "x": "こちらは、1984年7月の同じ雑誌の写真です。"}, {"t": 299.1, "x": "手には竹刀があります。"}, {"t": 300.5833333333333, "x": "この姿で桜田はいくつものベルトを巻きました。"}, {"t": 303.6166666666667, "x": "記録では、1982年に地元の\n看板選手を破っています。"}, {"t": 308.6666666666667, "x": "場所はアメリカ南部のメンフィスの周りです。"}, {"t": 311.3, "x": "取ったのは、AWA南部ヘビー級王座でした。"}, {"t": 315.1333333333333, "x": "ただしこのベルトは、\nその相手に取り返されました。"}, {"t": 318.5, "x": "1984年1月22日には、また王者になりました。"}, {"t": 323.26666666666665, "x": "場所はフロリダのオーランドです。"}, {"t": 325.23333333333335, "x": "NWAフロリダ・ヘビー級王座です。"}, {"t": 327.93333333333334, "x": "次の王者が生まれたのは、3月29日です。"}, {"t": 331.45, "x": "桜田がこのベルトを持っていたのは、\n2か月ほどでした。"}, {"t": 335.18333333333334, "x": "記録には、ほかの有名な選手との\n試合も残っています。"}, {"t": 339.0833333333333, "x": "1983年5月13日のことです。"}, {"t": 342.6, "x": "場所はテキサス州のヒューストンでした。"}, {"t": 344.96666666666664, "x": "相手はミル・マスカラスで、1対1の試合です。"}, {"t": 348.55, "x": "マスカラスは、日本でも\n人気のあった覆面の選手です。"}, {"t": 352.35, "x": "名前を変えたのは、これが最後ではありません。"}, {"t": 355.6, "x": "1985年には、日本の\n新日本プロレスにも上がっています。"}, {"t": 360.53333333333336, "x": "記録では、この時は\nランボー・サクラダという名前でした。"}, {"t": 364.25, "x": "その年の終わりには、また\nケンドー・ナガサキに戻っています。"}, {"t": 368.1333333333333, "x": "1989年には、アメリカの\nWCWという団体にいました。"}, {"t": 373.7, "x": "そこでの名前は、ドラゴン・マスターです。"}, {"t": 376.5, "x": "1987年から1988年にかけては、\nプエルトリコにもいました。"}, {"t": 382.68333333333334, "x": "日本人の相棒と組んでいました。"}, {"t": 384.8333333333333, "x": "世界タッグ王座を3回取ったと、\n海外の専門サイトは伝えています。"}, {"t": 389.81666666666666, "x": "この写真は、1986年11月に新日本プロレスの\nタッグリーグ戦で撮られたものです。"}, {"t": 396.73333333333335, "x": "首をムチで絞められているのは、\n若い頃の武藤敬司です。"}, {"t": 400.6166666666667, "x": "絞めているのがケンドー・ナガサキです。"}, {"t": 402.85, "x": "1990年に、桜田は日本に戻ってきました。"}, {"t": 407.03333333333336, "x": "海外の資料では、最初に\n上がったのはFMWという団体です。"}, {"t": 411.8666666666667, "x": "加わったのは、天龍源一郎も\n移ったSWSという団体です。"}, {"t": 416.93333333333334, "x": "しかしSWSは、長く続きませんでした。"}, {"t": 420.45, "x": "団体は分かれました。"}, {"t": 421.96666666666664, "x": "桜田は自分の団体を立ち上げます。"}, {"t": 424.46666666666664, "x": "名前はNOWでした。"}, {"t": 425.81666666666666, "x": "このNOWの台所事情を、のちに\nグレート小鹿が語っています。"}, {"t": 430.05, "x": "小鹿は日本プロレス時代からの先輩です。"}, {"t": 432.9, "x": "小鹿によれば、NOWは\n利益が出なかったといいます。"}, {"t": 436.35, "x": "タイガー・ジェット・シンらを\n呼んでももうからなかったそうです。"}, {"t": 439.6, "x": "最後には、借りたお金のかたに\nリングを取られたといいます。"}, {"t": 443.55, "x": "そこで、桜田は小鹿に電話をかけました。"}, {"t": 446.8666666666667, "x": "その時の言葉を小鹿は、こう覚えています。"}, {"t": 450.1333333333333, "x": "話聞いてくださいよ。"}, {"t": 451.68333333333334, "x": "困っていることがあるんですよ。"}, {"t": 453.55, "x": "小鹿はある人から無利子で\nお金を借りる話をまとめました。"}, {"t": 457.23333333333335, "x": "額は三千万円です。"}, {"t": 459.03333333333336, "x": "そのお金を当てにして横浜の\n鴨居に道場を作りました。"}, {"t": 462.68333333333334, "x": "ところが1週間後に貸す側の言い分が変わります。"}, {"t": 465.96666666666664, "x": "やっぱり2千万円しか貸せない。"}, {"t": 468.0833333333333, "x": "そういう話でした。"}, {"t": 469.5833333333333, "x": "小鹿は2022年の取材でそう振り返っています。"}, {"t": 473.1166666666667, "x": "それでも、ナガサキは小鹿に\n礼を言ったといいます。"}, {"t": 476.7, "x": "やっぱり小鹿さんに来てもらってよかった。"}, {"t": 479.15, "x": "小鹿の話では、そういう言葉だったそうです。"}, {"t": 482.48333333333335, "x": "それでも新しい団体は、動き出しました。"}, {"t": 485.76666666666665, "x": "小鹿が1994年に作った、\n大日本プロレスです。"}, {"t": 490.43333333333334, "x": "ナガサキは、その立ち上げから加わりました。"}, {"t": 493.53333333333336, "x": "この写真は、1994年12月に横浜市内の\n道場を開いた日に撮られたものです。"}, {"t": 500.13333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
