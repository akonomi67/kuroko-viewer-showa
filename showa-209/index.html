3333333, "x": "アントニオ猪木は、ボクシングの\n世界ヘビー級王者モハメド・アリと対戦しました。"}, {"t": 9.783333333333333, "x": "結果は15ラウンド、引き分け。"}, {"t": 12.266666666666667, "x": "この試合は、日本でも世界でも酷評されました。"}, {"t": 15.716666666666667, "x": "猪木がリングに寝転んだまま蹴りを出し続け、\n立ち技の攻防がほとんど起きなかったからです。"}, {"t": 21.7, "x": "「世紀の凡戦」。"}, {"t": 22.916666666666668, "x": "翌日の紙面には、そういう言葉が並びました。"}, {"t": 26.383333333333333, "x": "この評価は、長く残ります。"}, {"t": 28.783333333333335, "x": "猪木がその後何をやっても、アリ戦の\n話になると「あの試合はつまらなかった」と"}, {"t": 33.766666666666666, "x": "いう前提から始まる。"}, {"t": 35.1, "x": "そういう状態がしばらく続きました。"}, {"t": 37.516666666666666, "x": "その1年2か月後です。"}, {"t": 39.4, "x": "1977年8月2日、同じ日本武道館。"}, {"t": 43.78333333333333, "x": "猪木は、身長190センチの\n空手家と向かい合いました。"}, {"t": 47.88333333333333, "x": "名前は、ザ・モンスターマン。"}, {"t": 50.03333333333333, "x": "この試合は、\n5ラウンド1分38秒で終わります。"}, {"t": 53.983333333333334, "x": "猪木のKO勝ちでした。"}, {"t": 55.65, "x": "そして現在まで、猪木の異種格闘技戦で最も\n評価の高い試合として語られています。"}, {"t": 61.55, "x": "今回は、1977年8月2日に\n日本武道館で行われた試合を、"}, {"t": 67.43333333333334, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 70.56666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 73.05, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 78.63333333333334, "x": "まず、猪木が何をやろうとしていたのかを\n確認しておきます。"}, {"t": 82.86666666666666, "x": "1970年代の中頃、猪木は\n「異種格闘技戦」というシリーズを始めました。"}, {"t": 88.58333333333333, "x": "プロレスラーが、他の競技の\n選手と戦うという企画です。"}, {"t": 92.5, "x": "記録に残っている順番を並べます。"}, {"t": 94.93333333333334, "x": "1976年2月6日、日本武道館。"}, {"t": 98.88333333333334, "x": "相手は柔道のウィリエム・ルスカ。"}, {"t": 100.95, "x": "ミュンヘンオリンピックの金メダリストです。"}, {"t": 103.48333333333333, "x": "結果は20分35秒、猪木のTKO勝ち。"}, {"t": 107.4, "x": "1976年6月26日、日本武道館。"}, {"t": 111.9, "x": "相手はモハメド・アリ。"}, {"t": 113.35, "x": "結果は15ラウンド、引き分け。"}, {"t": 115.83333333333333, "x": "1976年12月9日、蔵前国技館。"}, {"t": 120.21666666666667, "x": "ルスカとの再戦。"}, {"t": 121.5, "x": "21分27秒、レフェリーストップで\n猪木の勝ちです。"}, {"t": 125.73333333333333, "x": "この時点で、猪木は柔道の\n金メダリストに2回勝っています。"}, {"t": 129.98333333333332, "x": "それでも世間が覚えていたのは、\nアリ戦のほうでした。"}, {"t": 133.68333333333334, "x": "理由は単純です。"}, {"t": 135.18333333333334, "x": "アリは、当時世界で最も\n有名なスポーツ選手でした。"}, {"t": 139.21666666666667, "x": "その相手との試合が、動きの\n少ない内容で終わった。"}, {"t": 143.13333333333333, "x": "そこだけが記憶に残ります。"}, {"t": 145.05, "x": "猪木にとって、この評価は重いものでした。"}, {"t": 148.2, "x": "異種格闘技戦は、プロレスラーが他の\n競技より強いことを見せるための企画です。"}, {"t": 153.46666666666667, "x": "その最大の舞台で、\n何もできなかったと受け取られた。"}, {"t": 157.16666666666666, "x": "企画そのものが否定されかねない状況でした。"}, {"t": 160.03333333333333, "x": "さらに、この試合には金の問題もありました。"}, {"t": 163.45, "x": "アリ戦は、当時としては\n桁違いの金額が動いた興行です。"}, {"t": 167.9, "x": "その負担は、その後の\n新日本プロレスに残りました。"}, {"t": 171.66666666666666, "x": "つまり猪木は、批判と負債の両方を抱えた\n状態で次の相手を探すことになります。"}, {"t": 177.46666666666667, "x": "ここで普通なら、企画を畳みます。"}, {"t": 180.21666666666667, "x": "プロレスに戻って、プロレスの\n試合で稼ぐほうが確実だからです。"}, {"t": 184.6, "x": "猪木はそうしませんでした。"}, {"t": 186.36666666666667, "x": "そして、次の相手として出てきたのが\nザ・モンスターマンです。"}, {"t": 190.18333333333334, "x": "この選手について確認しておきます。"}, {"t": 192.6, "x": "本名はエベレット・エディ。"}, {"t": 194.25, "x": "資料によって差がありますが、生年は\n1946年12月4日とされています。"}, {"t": 200.48333333333332, "x": "身長190センチ、体重110キロ。"}, {"t": 204.16666666666666, "x": "肩書きは、全米プロ空手の\n世界ヘビー級王者でした。"}, {"t": 208.2, "x": "ここで言う全米プロ空手は、当時アメリカで\n新しく始まっていた興行です。"}, {"t": 213.45, "x": "グローブをつけて、蹴りを使って戦う。"}, {"t": 216.36666666666667, "x": "いまのキックボクシングに近い競技でした。"}, {"t": 218.98333333333332, "x": "つまりモンスターマンは、\n型を見せる空手家ではありません。"}, {"t": 222.75, "x": "試合で相手を倒すことを\n仕事にしていた選手です。"}, {"t": 226.08333333333334, "x": "そして、この体格です。"}, {"t": 228.18333333333334, "x": "190センチという身長は、蹴りの届く距離が\nそのまま長いということを意味します。"}, {"t": 233.93333333333334, "x": "日本での紹介のされ方も特徴的です。"}, {"t": 236.75, "x": "モハメド・アリのボディガードを\n務めていた、という触れ込みがありました。"}, {"t": 241.05, "x": "つまり、アリと縁のある強い男が、アリ戦の\n借りを返す相手として連れてこられた形です。"}, {"t": 247.6, "x": "興行としては、非常に\n分かりやすい作り方でした。"}, {"t": 251.26666666666668, "x": "そして実際に、この選手は強かった。"}, {"t": 254.38333333333333, "x": "モンスターマンは手足が\n長く、動きが速い選手です。"}, {"t": 258.28333333333336, "x": "蹴りの回転が早く、距離を\n取ったまま攻撃を当ててきます。"}, {"t": 262.3666666666667, "x": "プロレスラーにとって、この\n距離は最も嫌なものです。"}, {"t"
