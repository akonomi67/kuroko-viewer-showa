66666667, "i": 187}, {"t": 638.75, "i": 188}, {"t": 640.0166666666667, "i": 189}, {"t": 641.5166666666667, "i": 190}, {"t": 641.9666666666667, "i": 191}, {"t": 648.2, "i": 192}, {"t": 653.8, "i": 193}, {"t": 658.1666666666666, "i": 194}, {"t": 666.1833333333333, "i": 195}, {"t": 669.55, "i": 196}, {"t": 675.5333333333333, "i": 197}], "subs": [{"t": 0.0, "x": "1988年4月16日の午前中。"}, {"t": 3.6166666666666667, "x": "プロレスの興行チケットが、\n発売から5分で消えました。"}, {"t": 7.6, "x": "プロレスショップやプレイガイドの分も、\n5分から10分で無くなっています。"}, {"t": 12.266666666666667, "x": "全体では、およそ15分でした。"}, {"t": 15.066666666666666, "x": "売り切れたのは、3試合しかない\n興行のチケットです。"}, {"t": 18.766666666666666, "x": "出場する選手は6人だけ。"}, {"t": 20.95, "x": "どの選手も20代です。"}, {"t": 22.716666666666665, "x": "会場は後楽園ホール。"}, {"t": 24.566666666666666, "x": "収容は2,300人でした。"}, {"t": 26.85, "x": "この日、チケットを買えなかった\nファンが会場の外に列を作り、"}, {"t": 31.05, "x": "事務所には問い合わせが殺到しています。"}, {"t": 33.95, "x": "団体の名前は、UWF。"}, {"t": 36.68333333333333, "x": "旗揚げ戦は、1988年5月12日でした。"}, {"t": 41.2, "x": "今回は、新生UWFが旗揚げした\n1988年に何が起きていたのかを、"}, {"t": 47.516666666666666, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 50.65, "x": "最後までご覧いただければ幸いです。"}, {"t": 53.15, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 58.733333333333334, "x": "まず、この団体ができるまでの\n経緯を確認しておきます。"}, {"t": 62.8, "x": "UWFという名前は、1988年に\n初めて出てきたものではありません。"}, {"t": 68.75, "x": "1984年に、同じ名前の団体がありました。"}, {"t": 72.91666666666667, "x": "第1次UWFと呼ばれる団体です。"}, {"t": 75.83333333333333, "x": "新日本プロレスから選手が移り、\n独立した会社として興行を打ちました。"}, {"t": 81.28333333333333, "x": "この団体が打ち出したのは、それまでの\nプロレスとは違う見せ方でした。"}, {"t": 85.83333333333333, "x": "派手なロープワークや大技を減らし、\n蹴りと関節技を中心にする。"}, {"t": 90.73333333333333, "x": "場外乱闘も、凶器も使わない。"}, {"t": 93.5, "x": "反則も使わない。"}, {"t": 94.91666666666667, "x": "覆面レスラーも、悪役も出しません。"}, {"t": 97.8, "x": "技を受けて、耐えて、返す。"}, {"t": 100.75, "x": "その往復で見せるのが\n従来のプロレスだとすれば、"}, {"t": 103.8, "x": "UWFは相手を倒すための\n動きだけを残そうとしました。"}, {"t": 108.06666666666666, "x": "当時の言葉で言えば\n「リアル」を目指した形です。"}, {"t": 110.86666666666666, "x": "そして、この方向は当時の日本のプロレスの\n主流とは真っ向から対立するものでした。"}, {"t": 116.6, "x": "この団体には、もう1つ特徴がありました。"}, {"t": 119.76666666666667, "x": "所属選手が少なく、外国人も呼べないため、\n同じ相手と何度も戦うしかなかったことです。"}, {"t": 126.46666666666667, "x": "普通の団体なら、それは弱点になります。"}, {"t": 129.66666666666666, "x": "飽きられるからです。"}, {"t": 130.95, "x": "ところがUWFでは逆でした。"}, {"t": 133.35, "x": "同じ相手と何度もやることで、前の\n試合の続きとして見えるようになった。"}, {"t": 138.15, "x": "今回はこの技を防いだ、今回は先に\n取られた、という積み上げが起きます。"}, {"t": 143.71666666666667, "x": "これは、いまの格闘技の見せ方に近い形でした。"}, {"t": 147.36666666666667, "x": "ただし、この団体は長く続きませんでした。"}, {"t": 150.8, "x": "1985年に活動を終え、所属していた\n選手は新日本プロレスに合流しています。"}, {"t": 157.53333333333333, "x": "そして、その合流した選手の\n1人が前田日明でした。"}, {"t": 161.48333333333332, "x": "新日本プロレスに戻った前田は、\n団体の中で難しい立場に置かれます。"}, {"t": 166.68333333333334, "x": "前田がやろうとしているプロレスと、新日本の\nリングでやるプロレスは、方向が違いました。"}, {"t": 172.7, "x": "その差は、試合のたびに表面化します。"}, {"t": 175.78333333333333, "x": "当時の前田は、20代後半。"}, {"t": 178.38333333333333, "x": "身長は190センチを超え、\nキックの威力があり、"}, {"t": 182.28333333333333, "x": "外国人選手とも見劣りしない\n体格を持っていました。"}, {"t": 186.15, "x": "素材としては、次の時代の\n看板になれる選手です。"}, {"t": 189.96666666666667, "x": "一方で、新日本プロレスには\nすでに藤波辰巳と長州力がいます。"}, {"t": 194.9, "x": "その上には、まだアントニオ猪木がいました。"}, {"t": 197.93333333333334, "x": "前田が自分のやり方を通そうとすれば、\n上とぶつかります。"}, {"t": 202.18333333333334, "x": "順番を待てば、自分のやり方は薄まります。"}, {"t": 205.58333333333334, "x": "その板挟みが、1987年に表面化しました。"}, {"t": 210.1, "x": "決定的だったのが、\n1987年11月19日です。"}, {"t": 215.06666666666666, "x": "この日、前田は試合中に\n長州力の顔面を蹴りました。"}, {"t": 219.36666666666667, "x": "長州は負傷し、前田は出場停止処分を受けます。"}, {"t": 223.46666666666667, "x": "この事件が特別だったのは、\n映像が残っていることです。"}, {"t": 227.51666666666668, "x": "テレビ中継のカメラがその\n瞬間を捉えていました。"}, {"t": 230.73333333333332, "x": "プロレスでは、選手同士のいざこざは\n控室で終わるのが普通です。"}, {"t": 235.26666666666668, "x": "リングの上で、しかも中継の中で起きたことで、\nこれは全国のファンが見ました。"}, {"t": 240.93333333333334, "x": "そして見た人の多くが、\n同じ受け取り方をしました。"}, {"t": 244.58333333333334, "x": "あれは決まっていた動きではない。"}, {"t": 246.55, "x": "その一点が、このあとの\nUWFの人気の土台になります。"}, {"t": 250.96666666666667, "x": "そして翌1988年、前田は\n新日本プロレスを解   document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
