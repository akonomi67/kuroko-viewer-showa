<title>タイガーマスクデビュー戦</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:#000;border-radius:10px;overflow:hidden;position:relative;line-height:0;

.stage img{width:100%;height:100%;object-fit:contain;display:block}
.badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.62);color:#fff;

.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:8px 13px;font-size:14px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:76px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}
.marks i{position:absolute;top:0;width:1px;height:7px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--dim);padding:7px 12px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.row{display:flex;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:46px;flex:none;padding-top:1px}
.row span{white-space:pre-wrap;flex:1}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;
  max-height:46vh;overflow:auto;padding:2px}
.thumbs figure{margin:0;cursor:pointer;border-radius:7px;overflow:hidden;
  border:2px solid transparent;position:relative;background:#000;aspect-ratio:16/9}
.thumbs figure.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs em{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.62);color:#fff;

.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}

@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

": 607.75, "i": 192}, {"t": 613.7166666666667, "i": 193}], "subs": [{"t": 0.0, "x": "1981年4月23日、蔵前国技館。"}, {"t": 4.7, "x": "発表された観客数は8,500人でした。"}, {"t": 7.95, "x": "ただし、記録を見る限り、会場には\n空席が目立っていたとされています。"}, {"t": 13.55, "x": "超満員の中で歴史が始まった、と\nいう日ではありませんでした。"}, {"t": 18.016666666666666, "x": "この日の第2試合、いわゆる前座の位置に、\n1人の覆面レスラーが登場します。"}, {"t": 23.9, "x": "黄色と黒の縞模様のマスク。"}, {"t": 25.966666666666665, "x": "名前は、タイガーマスクです。"}, {"t": 28.35, "x": "対戦相手は、ダイナマイト・キッド。"}, {"t": 31.05, "x": "試合は、それまで日本のリングで\n誰も見たことのない速度で進みました。"}, {"t": 35.85, "x": "ロープの上に飛び乗り、そこから飛ぶ。"}, {"t": 38.56666666666667, "x": "場外へ体ごと飛び出す。"}, {"t": 40.31666666666667, "x": "相手の技をかわして、着地と\n同時に次の動きに入る。"}, {"t": 44.25, "x": "当時の日本のプロレスに、\nこの速さはありません。"}, {"t": 47.666666666666664, "x": "最後はジャーマン・スープレックス・ホールドで、\nタイガーマスクが勝ちました。"}, {"t": 52.25, "x": "そのフィニッシュの瞬間、会場から\n出た声は「ウワー」ではなく「オー」"}, {"t": 56.5, "x": "だったと、当時の記録に残っています。"}, {"t": 59.15, "x": "熱狂ではありません。"}, {"t": 60.65, "x": "何が起きたのか分からない、という声です。"}, {"t": 63.8, "x": "今回は、初代タイガーマスクが\n生まれた1981年4月23日を、"}, {"t": 69.61666666666666, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 72.75, "x": "最後までご覧いただければ幸いです。"}, {"t": 75.25, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 80.83333333333333, "x": "まず、マスクの中にいた\n人物を確認しておきます。"}, {"t": 84.73333333333333, "x": "佐山聡、1957年11月27日の生まれ。"}, {"t": 89.71666666666667, "x": "出身は山口県下関市の長府です。"}, {"t": 92.73333333333333, "x": "身長172センチ。"}, {"t": 94.68333333333334, "x": "体重は時期によって幅がありますが、\n90キロから115キロと記録されています。"}, {"t": 100.36666666666666, "x": "プロレスラーとしては、\n明らかに小さい部類でした。"}, {"t": 103.88333333333334, "x": "新日本プロレスの道場に\n入ったのは1975年7月。"}, {"t": 108.48333333333333, "x": "デビューは1976年5月28日、\n相手は魁勝司です。"}, {"t": 114.11666666666666, "x": "当時の新日本プロレスは、\nアントニオ猪木を中心とした団体でした。"}, {"t": 119.0, "x": "道場は厳しいことで知られ、同じ時期には藤原喜明、\n木戸修、前田日明といった選手がいます。"}, {"t": 126.91666666666667, "x": "そして当時のプロレスは、体の\n大きい選手が上に行く世界です。"}, {"t": 131.5, "x": "メインイベントに置かれるのは、190センチを\n超える日本人か、それ以上の外国人でした。"}, {"t": 138.06666666666666, "x": "172センチの選手が上に行く\n道は、事実上ありません。"}, {"t": 142.65, "x": "どれだけ技術があっても、番付は変わらない。"}, {"t": 145.9, "x": "これは実力の問題ではなく、\n興行の作り方の問題でした。"}, {"t": 150.36666666666667, "x": "1978年6月、佐山はメキシコに出ます。"}, {"t": 154.78333333333333, "x": "メキシコは、体の小さい選手が\n主役になれる数少ない場所でした。"}, {"t": 159.5, "x": "ルチャリブレという文化があり、\n覆面レスラーが当たり前に存在します。"}, {"t": 164.36666666666667, "x": "ここで佐山は、日本ではできなかった\n動きを身につけました。"}, {"t": 168.35, "x": "ロープを使い、空中で体を\n回し、相手より速く動く。"}, {"t": 173.2, "x": "体格差を、速度で埋める戦い方です。"}, {"t": 176.26666666666668, "x": "日本のプロレスは、当時\n「重さ」で見せるものでした。"}, {"t": 179.71666666666667, "x": "大きい選手が正面からぶつかり、耐える。"}, {"t": 182.98333333333332, "x": "そこに、跳ぶ選手はほとんどいません。"}, {"t": 185.91666666666666, "x": "メキシコはその逆でした。"}, {"t": 187.6, "x": "小さい選手が跳び、回り、客がそれで沸きます。"}, {"t": 191.66666666666666, "x": "同じプロレスでも、価値の置き方が\nまったく違いました。"}, {"t": 195.28333333333333, "x": "その後イギリスにも渡っています。"}, {"t": 197.38333333333333, "x": "1980年10月8日、ロンドンで\n「サミー・リー」という名前でデビューしました。"}, {"t": 202.98333333333332, "x": "ここでも人気を得ています。"}, {"t": 204.71666666666667, "x": "つまり、佐山聡という選手は、\n日本の外で完成した選手でした。"}, {"t": 210.05, "x": "一方、日本では別の話が進んでいます。"}, {"t": 213.51666666666668, "x": "1981年、テレビでアニメの\n新シリーズが始まることになりました。"}, {"t": 219.0, "x": "タイガーマスクを題材にした作品です。"}, {"t": 221.63333333333333, "x": "タイガーマスクは、もともと\n漫画とアニメの主人公でした。"}, {"t": 225.53333333333333, "x": "覆面レスラーとしてリングに上がり、その\n稼ぎを育った孤児院に送る、という物語です。"}, {"t": 232.05, "x": "1960年代の終わりから\n70年代にかけて放送され、"}, {"t": 236.36666666666667, "x": "日本の子どもがほぼ全員知っている\nキャラクターになりました。"}, {"t": 240.03333333333333, "x": "プロレスを見ない家庭の\n子どもでも、名前は知っている。"}, {"t": 243.6, "x": "そういう規模の知名度です。"}, {"t": 245.4, "x": "そのアニメの新作放送に合わせて、実際の\nリングに本物のタイガーマスクを登場させる。"}, {"t": 251.41666666666666, "x": "これが新日本プロレスの企画でした。"}, {"t": 253.85, "x": "問題は、中身です。"}, {"t": 255.75, "x": "タイガーマスクは、原作の中で\n空中殺法を使う設定になっています。"}, {"t": 260.78333333333336, "x": "アニメと同じ動きができる選手が必要でした。"}, {"t": 263.8666666666667, "x": "日本の団体に、そんな選手はいません。"}, {"t": 266.9166666666667, "x": "ただし、メキシコと\nイギリスに1人だけいました。"}, {"t": 270.23333333333335, "x": "佐山聡です。"}, {"t": 271.53333333333336, "x": "1981年4月21日、\n佐山は日本に帰国します。"}, {"t": 276.93333333333334, "x": "そして2日後の4月23日、\n蔵前国技館のリングに上がりました。"}, {"t": 282.15, "x": "準備の期間は、ほとんどありません。"}, {"t": 284.81666666666666, "x": "最初のコスチュームも急ごしらえのものでした。"}, {"t": 287.65, "x": "対戦相手のダイナマイト・キッドに\nついても触れておきます。"}, {"t": 291.1, "x": "キッドはイギリス出身の\n選手で、当時20代前半。"}, {"t": 295.1333333333333, "x": "本名はトム・ビリントン。"}, {"t": 296.81666666666666, "x": "体は大きくありませんが、動きが速く、受け身が\n正確で、危険な技を平気で使う選手でした。"}, {"t": 304.31666666666666, "x": "自分の体を守るという発想が薄く、\nそのぶん試合が生々しく見えます。"}, {"t": 309.6333333333333, "x": "のちに、その無理が体を\n壊す原因にもなりました。"}, {"t": 313.31666666666666, "x": "この2人は、すでにイギリスで\n対戦経験がありました。"}, {"t": 317.1166666666667, "x": "つまり、初対面ではありません。"}, {"t": 319.68333333333334, "x": "互いの動きを知っている相手同士が、\n日本のリングで組まれたということです。"}, {"t": 324.48333333333335, "x": "これは偶然ではなく、\n成立させるために必要な条件でした。"}, {"t": 329.0, "x": "どんなに速い技を出しても、受ける側が\n合わせられなければ試合になりません。"}, {"t": 334.0, "x": "タイガーマスクという企画が\n最初から破綻しなかったのは、"}, {"t": 337.3833333333333, "x": "相手がキッドだったからだと言えます。"}, {"t": 339.93333333333334, "x": "そして1981年4月23日の\n試合が行われました。"}, {"t": 344.73333333333335, "x": "結果は前に述べたとおりです。"}, {"t": 346.68333333333334, "x": "タイガーマスクが勝ちました。"}, {"t": 348.4166666666667, "x": "ただし、その日の会場の反応は、いま\n伝えられているほど熱狂的ではありません。"}, {"t": 354.3333333333333, "x": "発表は8,500人ですが、\n空席は目立っていました。"}, {"t": 358.5, "x": "そして最後の場内の声は、驚きの声でした。"}, {"t": 362.1166666666667, "x": "日本のプロレスファンにとって、その日の\n光景は、理解が追いつかないものだったと"}, {"t": 367.5, "x": "いうことです。"}, {"t": 368.25, "x": "熱が動いたのは、テレビが入ってからでした。"}, {"t": 371.45, "x": "この試合は、5月1日に\n録画で放送されています。"}, {"t": 375.43333333333334, "x": "ここから、状況が変わりました。"}, {"t": 377.93333333333334, "x": "これまでプロレスを見ていなかった層、特に\n子どもがテレビの前に集まるようになります。"}, {"t": 383.35, "x": "アニメで知っているタイガーマスクが、\n現実のリングで同じ動きをしている。"}, {"t": 388.1666666666667, "x": "そういう見え方です。"}, {"t": 389.6666666666667, "x": "ここが重要な点です。"}, {"t": 391.31666666666666, "x": "プロレスファンにとっては\n「速すぎて分からない試合」でしたが、"}, {"t": 394.65, "x": "アニメを見ていた子どもにとっては\n「知っているキャラクターが"}, {"t": 398.03333333333336, "x": "本当にいる」という話でした。"}, {"t": 399.8666666666667, "x": "つまり、この企画が最初に届いたのは、\nプロレスの客ではありません。"}, {"t": 404.8333333333333, "x": "プロレスを見ていなかった人たちでした。"}, {"t": 407.1, "x": "新しい客が入ってくると、\n興行の作り方も変わります。"}, {"t": 411.26666666666665, "x": "グッズが売れ、会場に子どもが来て、\n家族連れが増えました。"}, {"t": 415.8, "x": "新日本プロレスの中継の中で、\n前座であるはずのジュニアヘビー級の試合が、"}, {"t": 421.1166666666667, "x": "最も注目される時間になりました。"}, {"t": 423.8333333333333, "x": "ここが、この日の本当の意味です。"}, {"t": 426.45, "x": "それまで日本のプロレスでは、体の小さい選手の\n試合は「メインの前にやるもの」でした。"}, {"t": 432.1166666666667, "x": "番付が下という意味です。"}, {"t": 433.9, "x": "タイガーマスクは、その位置を変えました。"}, {"t": 436.73333333333335, "x": "体の小さい選手の試合が、興行の\n目玉になり得ることを証明したからです。"}, {"t": 442.0833333333333, "x": "その後の記録も並べておきます。"}, {"t": 444.25, "x": "1982年1月1日、タイガーマスクは\nダイナマイト・キッドを破り、"}, {"t": 449.93333333333334, "x": "WWFジュニアヘビー級王座を獲得しています。"}, {"t": 454.6166666666667, "x": "この2人の試合は、その後も繰り返し\n行われ、いずれも当時の日本で最も"}, {"t": 460.31666666666666, "x": "評価される試合になりました。"}, {"t": 462.0833333333333, "x": "このころには、状況が完全に変わっています。"}, {"t": 465.43333333333334, "x": "デビュー戦では空席のあった\n会場が、タイガーマスクの試合を"}, {"t": 469.6666666666667, "x": "目当てに埋まるようになりました。"}, {"t": 471.3666666666667, "x": "テレビ中継でも、ジュニアヘビー級の\n試合が番組の柱として扱われます。"}, {"t": 476.6666666666667, "x": "日本のプロレスの中で、体の\n小さい選手の値段が上がった。"}, {"t": 481.01666666666665, "x": "これは、それ以前には無かったことでした。"}, {"t": 483.8833333333333, "x": "そして1983年8月10日。"}, {"t": 487.0, "x": "佐山は新日本プロレスに契約解除を\n告げ、引退を宣言します。"}, {"t": 492.05, "x": "タイガーマスクとしての活動期間は、\nおよそ2年4か月でした。"}, {"t": 496.55, "x": "ここまでが、記録に残っている事実です。"}, {"t": 499.5833333333333, "x": "改めて、1981年4月23日と\nいう日を考えてみます。"}, {"t": 505.1166666666667, "x": "この日は、伝説の初日として語られます。"}, {"t": 508.15, "x": "しかし当日の記録を見る限り、会場は\n満員ではなく、反応も静かでした。"}, {"t": 514.0333333333333, "x": "つまり、この日に何かが\n完成したわけではありません。"}, {"t": 517.7666666666667, "x": "完成していたのは、佐山聡と\nいう選手のほうです。"}, {"t": 521.55, "x": "日本では小さすぎて上に行けなかった選手が、\nメキシコとイギリスで自分の形を作り、"}, {"t": 527.45, "x": "帰ってきた。"}, {"t": 528.8666666666667, "x": "そこにタイガーマスクという名前が乗った。"}, {"t": 531.3666666666667, "x": "順番としては、そういうことになります。"}, {"t": 534.2333333333333, "x": "もし佐山が日本にとどまっていたら、\nこの試合はありません。"}, {"t": 538.15, "x": "体格で上に行けない選手が、\n日本の外で別の価値を"}, {"t": 541.9, "x": "身につけて戻ってきたから成立した企画でした。"}, {"t": 544.7, "x": "そしてもう1つ。"}, {"t": 545.9166666666666, "x": "この日、リングの上に立っていたのは、\n当時ほとんど無名の23歳と、"}, {"t": 551.0666666666667, "x": "20代前半の外国人選手でした。"}, {"t": 553.9833333333333, "x": "その2人がやった前座の1試合が、日本のプロレスで\n最も語られる試合のひとつになっています。"}, {"t": 560.2, "x": "興行の中心に置かれていた\nカードではありません。"}, {"t": 563.2666666666667, "x": "会場で見ていた人のほとんどは、その日の主役が\n第2試合だったとは思っていませんでした。"}, {"t": 569.1166666666667, "x": "そして、この日から始まった流れは、\n佐山が辞めたあとも残ります。"}, {"t": 574.0166666666667, "x": "ジュニアヘビー級という区分は、その後も\n日本のプロレスの主要な商品であり続けました。"}, {"t": 579.7833333333333, "x": "小さい選手が跳んで、速く\n動いて、客を沸かせる。"}, {"t": 583.9833333333333, "x": "いまの日本のプロレスで\n当たり前になっているこの形の出発点が、"}, {"t": 587.9666666666667, "x": "1981年4月23日の蔵前国技館です。"}, {"t": 592.6166666666667, "x": "空席の目立つ会場の、前座の1試合でした。"}, {"t": 596.0666666666667, "x": "今回の物語を通して、皆様の中に\n初代タイガーマスクという1人の"}, {"t": 600.8666666666667, "x": "プロレスラーの新しい一面が\n刻まれていれば幸いです。"}, {"t": 604.3833333333333, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 607.75, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 194};
const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
