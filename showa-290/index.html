<script>
const D={"name": "第1回チャンピオン・カーニバル", "file": "290_編集用", "dur": 934.05, "segs": [], "subs": [{"t": 0.0, "x": "福井市体育館の決勝は、\n3本目の2分25秒で決まりました。"}, {"t": 4.916666666666667, "x": "押さえ込んだのはジャイアント馬場です。"}, {"t": 7.083333333333333, "x": "1973年4月21日のことです。"}, {"t": 10.616666666666667, "x": "観客は5000人と記録されています。"}, {"t": 13.15, "x": "相手は、この春に\n初めて日本に来た外国人のレスラーでした。"}, {"t": 17.566666666666666, "x": "馬場の団体は、旗揚げからまだ半年です。"}, {"t": 20.783333333333335, "x": "この春に始めた大会で、\n最初の優勝者が決まりました。"}, {"t": 24.85, "x": "その前の日には、1つの団体が\n最後の興行を終えています。"}, {"t": 29.116666666666667, "x": "場所は群馬県の吉井町です。"}, {"t": 31.333333333333332, "x": "馬場が育った日本プロレスです。"}, {"t": 33.43333333333333, "x": "1つの団体が消えた次の日に、\nどんな決勝が戦われたのでしょうか？"}, {"t": 38.333333333333336, "x": "旗揚げから半年の団体は、\n春の大会をどう組み立てたのでしょうか？"}, {"t": 43.18333333333333, "x": "今回は、第1回チャンピオン・カーニバルを\n追います。"}, {"t": 47.06666666666667, "x": "1973年3月17日の開幕から、\n4月21日の決勝までです。"}, {"t": 53.43333333333333, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 58.0, "x": "馬場の公式年表と、全日本プロレスの\n公式サイトも合わせて見ていきます。"}, {"t": 63.3, "x": "最後までご覧いただければ幸いです。"}, {"t": 65.8, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.36666666666666, "x": "まず、この大会が始まる前の全日本プロレスです。"}, {"t": 75.3, "x": "馬場は1972年に日本プロレスを離れました。"}, {"t": 79.08333333333333, "x": "そして10月21日に、\n初めての興行を開きました。"}, {"t": 83.3, "x": "会場は東京の町田市体育館です。"}, {"t": 85.95, "x": "新しい団体の名前は全日本プロレスです。"}, {"t": 89.0, "x": "この旗揚げの話は、\n以前の動画で取り上げています。"}, {"t": 92.81666666666666, "x": "1973年3月16日には、馬場は\n世界ヘビー級の初代王者に認められました。"}, {"t": 99.51666666666667, "x": "公式年表は、この王座を\nPWFの王座と書いています。"}, {"t": 104.01666666666667, "x": "この話も以前の動画で取り上げました。"}, {"t": 106.53333333333333, "x": "その次の日から、新しいシリーズが始まります。"}, {"t": 110.06666666666666, "x": "シリーズの名前は、\n第1回チャンピオン・カーニバルです。"}, {"t": 114.08333333333333, "x": "全日本プロレスの公式サイトは、\nこの大会をこう書いています。"}, {"t": 118.5, "x": "ジャイアント馬場の、\n世界のチャンピオンを集めて雌雄を"}, {"t": 122.01666666666667, "x": "決したいという壮大なる夢を現実としたもの。"}, {"t": 124.86666666666666, "x": "公式サイトは、この大会を\n春の祭典とも呼んでいます。"}, {"t": 128.9, "x": "馬場には、日本プロレスの時代にも\n春の大会の記録がありました。"}, {"t": 133.23333333333332, "x": "ワールド・リーグ戦という大会です。"}, {"t": 135.45, "x": "公式年表には、馬場がこの大会で\n通算6度優勝したと書かれています。"}, {"t": 140.71666666666667, "x": "その馬場が、自分の団体で\n新しい大会を始めたのです。"}, {"t": 145.01666666666668, "x": "第1回の仕組みを見ておきます。"}, {"t": 147.23333333333332, "x": "出場したのは15人のレスラーです。"}, {"t": 149.8, "x": "勝ち抜きのトーナメントで優勝を争いました。"}, {"t": 152.66666666666666, "x": "決勝だけが60分3本勝負です。"}, {"t": 155.33333333333334, "x": "ほかの試合は30分1本勝負でした。"}, {"t": 158.21666666666667, "x": "15人のうち、日本のレスラーは\n馬場を入れて7人です。"}, {"t": 162.31666666666666, "x": "外国人のレスラーは8人でした。"}, {"t": 164.7, "x": "馬場は1回戦を戦いません。"}, {"t": 166.86666666666667, "x": "2回戦から出ることになっていました。"}, {"t": 169.08333333333334, "x": "試合の記録では、シリーズは\n3月17日から4月25日までです。"}, {"t": 174.45, "x": "シリーズの大会は、全部で26でした。"}, {"t": 177.73333333333332, "x": "記録を見ると、馬場は26の\n大会のすべてに出ています。"}, {"t": 181.91666666666666, "x": "最初の大会は、東京の世田谷区体育館でした。"}, {"t": 185.8, "x": "観客は4000人です。"}, {"t": 187.63333333333333, "x": "そこから群馬、岩手、青森、\n福島、山形と回ります。"}, {"t": 193.48333333333332, "x": "3月22日の青森の八戸には、\n5200人が入りました。"}, {"t": 198.45, "x": "3月30日には、東京の\n後楽園ホールで大会が開かれています。"}, {"t": 203.56666666666666, "x": "4月に入ると、岐阜と愛知を回りました。"}, {"t": 206.76666666666668, "x": "そして兵庫と広島に寄って、西へ向かいます。"}, {"t": 210.26666666666668, "x": "4月7日の鹿児島県体育館には、\n5500人が入っています。"}, {"t": 215.18333333333334, "x": "そのあと熊本と福岡と大分を回りました。"}, {"t": 218.18333333333334, "x": "トーナメントの試合は、この旅の\n途中で1つずつ組まれていきました。"}, {"t": 222.66666666666666, "x": "開幕の3月17日、\n馬場はタッグの試合に出ています。"}, {"t": 227.15, "x": "組んだのは覆面のレスラーです。"}, {"t": 229.2, "x": "相手の組には、初来日のレスラーがいました。"}, {"t": 232.48333333333332, "x": "試合は馬場の組が2対0で勝ちました。"}, {"t": 235.15, "x": "3月23日の岩手の久慈では、\n1対1の試合に出ています。"}, {"t": 240.05, "x": "相手は外国人のレスラーです。"}, {"t": 242.18333333333334, "x": "馬場は14分45秒に押さえ込んで勝ちました。"}, {"t": 245.6, "x": "1回戦は7試合です。"}, {"t": 247.51666666666668, "x": "最初は3月17日の世田谷です。"}, {"t": 250.3, "x": "外国人のレスラーが、\n日本のレスラーに勝ちました。"}, {"t": 253.81666666666666, "x": "11分40秒の押さえ込みです。"}, {"t": 256.28333333333336, "x": "3月18日は群馬の渋川です。"}, {"t": 259.06666666666666, "x": function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
