<script>
const D={"name": "馬場のNWA世界王座", "file": "213_編集用", "dur": 890.65, "segs": [], "subs": [{"t": 0.0, "x": "1974年12月2日、鹿児島市下荒田。"}, {"t": 4.383333333333334, "x": "鹿児島県立体育館。"}, {"t": 6.2, "x": "イメージ映像"}, {"t": 6.2, "x": "この日のメインイベントは、\nNWA世界ヘビー級選手権試合でした。"}, {"t": 11.283333333333333, "x": "王者はジャック・ブリスコ。"}, {"t": 12.816666666666666, "x": "挑戦者はジャイアント馬場。"}, {"t": 14.666666666666666, "x": "3本勝負です。"}, {"t": 16.05, "x": "1本目を取ったのは馬場でした。"}, {"t": 18.133333333333333, "x": "河津落としで3カウントを奪っています。"}, {"t": 20.783333333333335, "x": "イメージ映像"}, {"t": 20.783333333333335, "x": "2本目はブリスコが取り返します。"}, {"t": 23.066666666666666, "x": "バックドロップから足4の字固め。"}, {"t": 25.316666666666666, "x": "馬場がギブアップしました。"}, {"t": 26.95, "x": "1本ずつを取り合って、3本目に入ります。"}, {"t": 30.3, "x": "決着はランニング・ネック\nブリーカー・ドロップでした。"}, {"t": 33.233333333333334, "x": "馬場が3カウントを奪い、2対1で\nNWA世界ヘビー級王座を獲得します。"}, {"t": 38.983333333333334, "x": "第49代王者です。"}, {"t": 40.93333333333333, "x": "日本人がこのベルトを腰に巻いたのは、\nこれが初めてでした。"}, {"t": 44.96666666666667, "x": "このとき馬場は36歳。"}, {"t": 46.86666666666667, "x": "ブリスコは33歳です。"}, {"t": 48.9, "x": "そしてこのベルトは、7日後には\nブリスコの腰に戻っています。"}, {"t": 53.0, "x": "イメージ映像"}, {"t": 53.0, "x": "日本人が初めて手にした世界最高峰のベルトは、\n1週間で海の向こうへ帰っていきました。"}, {"t": 59.18333333333333, "x": "その7日間に、記録の上では何が起きていたのか。"}, {"t": 62.85, "x": "今回は、1974年12月2日の鹿児島から、\n馬場が3度目の戴冠を果たす1980年9月"}, {"t": 71.25, "x": "4日までを、日付と数字だけで追いかけます。"}, {"t": 74.25, "x": "それでは本編です。"}, {"t": 75.78333333333333, "x": "チャンネル登録と高評価を押していただけると、\n次の1本を作る力になります。"}, {"t": 81.1, "x": "まず、ベルトを持っていた側から見ていきます。"}, {"t": 84.41666666666667, "x": "ジャック・ブリスコは1941年9月21日、\nアメリカ・オクラホマ州セミノールの生まれです。"}, {"t": 91.41666666666667, "x": "ブリスコはプロレスに入る前、\nアマチュアレスリングの選手でした。"}, {"t": 95.76666666666667, "x": "オクラホマ州立大学に進み、NCAA\n全米学生選手権では1964年に2位、"}, {"t": 102.75, "x": "1965年に優勝しています。"}, {"t": 105.93333333333334, "x": "日本のリングに初めて上がったのは1967\n年11月、日本プロレスへの来日でした。"}, {"t": 112.65, "x": "1971年8月5日には、愛知県体育館で\nアントニオ猪木のUN王座に挑戦しています。"}, {"t": 120.26666666666667, "x": "イメージ映像"}, {"t": 120.26666666666667, "x": "この試合でブリスコは勝てませんでした。"}, {"t": 122.68333333333334, "x": "そして1973年7月20日、\nテキサス州ヒューストン。"}, {"t": 127.53333333333333, "x": "ブリスコはハーリー・レイスを破り、\n第48代NWA世界ヘビー級王者になります。"}, {"t": 133.86666666666667, "x": "NWA世界ヘビー級のベルトは、この戴冠に\n合わせて3代目のものへ作り替えられました。"}, {"t": 140.1, "x": "1キロの金が使われたと記録されています。"}, {"t": 142.88333333333333, "x": "ブリスコが全日本プロレスのリングに\n初めて上がったのは1974年1月です。"}, {"t": 148.5, "x": "このとき王者として来日し、\n馬場とジャンボ鶴田の挑戦を退けています。"}, {"t": 153.76666666666668, "x": "イメージ映像"}, {"t": 153.76666666666668, "x": "つまり1974年12月2日の鹿児島は、\n馬場にとって初めての挑戦ではありませんでした。"}, {"t": 160.73333333333332, "x": "次に、挑戦した側の記録を見ていきます。"}, {"t": 163.98333333333332, "x": "ジャイアント馬場の本名は馬場正平といいます。"}, {"t": 167.13333333333333, "x": "1938年1月23日、\n新潟県三条市の生まれです。"}, {"t": 172.81666666666666, "x": "身長は209センチと記録されています。"}, {"t": 175.71666666666667, "x": "馬場はプロレスの前に、プロ野球の選手でした。"}, {"t": 179.15, "x": "1955年10月13日に読売\nジャイアンツへ入団しています。"}, {"t": 184.11666666666667, "x": "ただし一軍で投げたのは\n1957年の3試合だけでした。"}, {"t": 188.58333333333334, "x": "1960年1月に自由契約となり、\n球団を離れます。"}, {"t": 193.65, "x": "イメージ映像"}, {"t": 193.65, "x": "プロレスのデビュー戦は1960\n年9月30日、台東体育館でした。"}, {"t": 199.43333333333334, "x": "同じ日に、アントニオ猪木もデビューしています。"}, {"t": 202.58333333333334, "x": "イメージ映像"}, {"t": 202.58333333333334, "x": "1961年7月、馬場はアメリカへ渡ります。"}, {"t": 207.15, "x": "ロサンゼルスでは「ショーヘイ・ビッグ・ババ」、\nニューヨークでは「ババ・ザ・ジャイアント」と"}, {"t": 211.61666666666667, "x": "いうリングネームを使っていました。"}, {"t": 213.5, "x": "このアメリカ遠征の期間に、\n馬場は世界王座への挑戦を重ねています。"}, {"t": 218.6, "x": "イメージ映像"}, {"t": 218.6, "x": "1963年2月、ロサンゼルス。"}, {"t": 222.15, "x": "ザ・デストロイヤーが持っていたWWA世界\nヘビー級王座に挑戦し、反則勝ちを収めました。"}, {"t": 228.9, "x": "ただし規定により王座は移動していません。"}, {"t": 231.51666666666668, "x": "1964年2月5日、デトロイト。"}, {"t": 235.31666666666666, "x": "ルー・テーズのNWA世界\nヘビー級王座に挑戦し、敗れています。"}, {"t": 240.66666666666666, "x": "1964年には、NWA、WWWF、"}, {"t": 247.1, "x": "WWAという当時の3つの世界"}, {"t": 250.75, "x": "タイトルに続けて挑戦したと記録されています。"}, {"t": 253.53333333333333, "x": "つまり馬場は、NWA世界ヘビー級王座に\n10年以上前から手を伸ばしていました。"}, {"t": 259.48333333333335, "x": "その馬場が自分の団体を持つのは1972年です。"}, {"t": 263.6, "x": "1972年7月29日に日本プロレスへ\n辞表を提出し、新団体の設立を宣言します。"}, {"t": 271.3, "x": "日本プロレスでの最後の試合は1972\n年8月18日、宮城県石巻市でした。"}, {"t": 278.35, "x": "イメージ映像"}, {"t": 278.35, "x": "ここで、全日本プロレスと\nNWAの関係にも触れておきます。"}, {"t": 283.01666666666665, "x": "馬場が全日本プロレスを旗揚げしたのは1972\n年10月22日、東京の日大講堂でした。"}, {"t": 290.6, "x": "その3か月後の1973年1月、\n全日本プロレスはNWAに加盟します。"}, {"t": 297.28333333333336, "x": "アマリロのプロモーターだったドリー・ファンク・\nシニアが動いた結果だと記録されています。"}, {"t": 301.8833333333333, "x": "NWAは、アメリカ各地の\nプロモーターが集まった連合体です。"}, {"t": 306.6333333333333, "x": "NWA世界ヘビー級王者は\n加盟している地区を巡回し、その土地の"}, {"t": 311.71666666666664, "x": "トップ選手を相手に防衛戦を行います。"}, {"t": 314.4166666666667, "x": "イメージ映像"}, {"t": 314.4166666666667, "x": "日本の団体が加盟したということは、\nその巡回先に日本が入るということでした。"}, {"t": 319.93333333333334, "x": "このベルトがどういうものだったかも、\n記録に残っています。"}, {"t": 323.73333333333335, "x": "NWAが設立されたのは1948年です。"}, {"t": 327.8333333333333, "x": "初代王者はオーヴィル・ブラウン。"}, {"t": 329.8, "x": "ブラウンが交通事故で現役を退いたため、\n1949年にルー・テーズが第2"}, {"t": 335.76666666666665, "x": "代王者として認定されました。"}, {"t": 337.68333333333334, "x": "そして、この王座には独特のルールがありました。"}, {"t": 341.06666666666666, "x": "反則やリングアウトの裁定では、\n王座が移動しないというものです。"}, {"t": 345.6166666666667, "x": "オーバー・ザ・トップロープも\n反則とされていました。"}, {"t": 348.45, "x": "つまり、挑戦者が相手をフォールするか、\nギブアップさせるか。"}, {"t": 353.01666666666665, "x": "その2つ以外の勝ち方では、ベルトは動きません。"}, {"t": 356.6333333333333, "x": "王者側は引き分けや反則負けを\n重ねながら防衛していく、と"}, {"t": 361.06666666666666, "x": "いう戦い方が成り立つ仕組みでした。"}, {"t": 363.18333333333334, "x": "馬場の前にこの王座を長く持っていたのが、\nドリー・ファンク・ジュニアです。"}, {"t": 367.6, "x": "1941年2月3日、インディアナ\n州インディアナポリスの生まれ。"}, {"t": 372.9, "x": "1969年2月11日にフロリダ州タンパで\n戴冠し、1973年5月24日にミズーリ州"}, {"t": 381.26666666666665, "x": "イメージ映像"}, {"t": 381.26666666666665, "x": "カンザスシティでハーリー・レイスに敗れるまで、\n約4年3か月にわたって王座を保ちました。"}, {"t": 387.06666666666666, "x": "ドリー・ファンク・ジュニアは\n1969年12月以降、日本プロレスの"}, {"t": 392.1333333333333, "x": "リングでも防衛戦を行っています。"}, {"t": 394.31666666666666, "x": "その相手のひとりが馬場でした。"}, {"t": 396.28333333333336, "x": "日本のリングと「世界」の看板の関係は、\nそれ以前にもありました。"}, {"t": 400.78333333333336, "x": "1958年8月27日、ロサンゼルス。"}, {"t": 405.2, "x": "力道山はルー・テーズとの試合に\n勝ち、インターナショナル・"}, {"t": 408.95, "x": "ヘビー級王座を手にしています。"}, {"t": 410.85, "x": "力道山はこのベルトで19回の\n連続防衛を記録し、1963年の"}, {"t": 416.81666666666666, "x": "死去によって王座は空位になりました。"}, {"t": 419.1, "x": "そのインターナショナル・ヘビー級王座は、\n1965年11月24日に馬場が"}, {"t": 425.1333333333333, "x": "第3代王者となっています。"}, {"t": 426.9166666666667, "x": "日本には、日本で作られた\n「世界」の看板がありました。"}, {"t": 430.71666666666664, "x": "しかしNWA世界ヘビー級王座のほうは、\nアメリカ側が持ったままで、"}, {"t": 435.9166666666667, "x": "日本人が巻いたことはありませんでした。"}, {"t": 438.53333333333336, "x": "全日本プロレスも、自分たちの\n看板になるベルトを作っています。"}, {"t": 443.06666666666666, "x": "旗揚げ後、全日本プロレスはハワイ州\nホノルルに本部を置くPWF、パシフィック・"}, {"t": 449.3833333333333, "x": "レスリング・フェデレーションを設立しました。"}, {"t": 451.71666666666664, "x": "PWFヘビー級王座が創設されたのは\n1973年1月27日です。"}, {"t": 457.98333333333335, "x": "初代王者は馬場でした。"}, {"t": 459.68333333333334, "x": "1973年3月16日、日本大学講堂。"}, {"t": 464.3333333333333, "x": "8人の選手による王座争奪戦を\n勝ち抜いての戴冠です。"}, {"t": 468.21666666666664, "x": "こうして1974年12月2日の鹿児島には、PWF\nヘビー級王者の馬場が、NWA世界ヘビー級王者の"}, {"t": 477.53333333333336, "x": "ブリスコに挑む、という形が整いました。"}, {"t": 480.6166666666667, "x": "イメージ映像"}, {"t": 480.6166666666667, "x": "会場となった鹿児島県立体育館の\n記録も残っています。"}, {"t": 484.51666666666665, "x": "正式名称は鹿児島県総合体育センター体育館。"}, {"t": 488.4, "x": "イメージ映像"}, {"t": 488.4, "x": "1960年10月に開館した建物です。"}, {"t": 491.8666666666667, "x": "現在の収容人数は、\n本館で4,400人とされています。"}, {"t": 496.7, "x": "この日の試合が3本勝負で\n行われたこと、そして決着がランニング・"}, {"t": 501.35, "x": "ネックブリーカー・ドロップだったことは、\n複数の記録で一致しています。"}, {"t": 505.68333333333334, "x": "1本目、馬場が河津落としで先取。"}, {"t": 508.71666666666664, "x": "2本目、ブリスコがバックドロップから\n足4の字固めを極めて奪い返し、"}, {"t": 513.6666666666666, "x": "3本目を馬場が取りました。"}, {"t": 515.85, "x": "この決着で、NWA世界ヘビー級王座が\n初めて日本で移動しました。"}, {"t": 521.3833333333333, "x": "日付を並べると、この夜の位置がはっきりします。"}, {"t": 524.8666666666667, "x": "馬場のデビュー戦、1960年\n9月30日から14年2か月。"}, {"t": 530.1666666666666, "x": "全日本プロレスの旗揚げ、1972年\n10月22日から2年1か月あまり。"}, {"t": 536.55, "x": "イメージ映像"}, {"t": 536.55, "x": "そしてブリスコが王座に就いた1973年7 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
