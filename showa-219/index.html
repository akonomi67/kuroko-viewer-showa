<script>
const D={"name": "国際軍団解散", "file": "219_編集用", "dur": 889.81665625, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1983年2月7日、東京の蔵前国技館。"}, {"t": 4.666666666666667, "x": "リングの上には4人が立っていました。"}, {"t": 7.0, "x": "片側に1人。"}, {"t": 8.2, "x": "反対側に3人です。"}, {"t": 10.05, "x": "1人に対して3人でぶつかるという、\n変則の試合が組まれていました。"}, {"t": 14.716666666666667, "x": "その3人は、1年半ほど前まで\n同じ団体の所属選手でした。"}, {"t": 19.483333333333334, "x": "団体の名前は国際プロレスといいます。"}, {"t": 22.166666666666668, "x": "1981年に活動を止め、\n会社としても消えています。"}, {"t": 27.016666666666666, "x": "帰る場所を失った3人が、よその団体の\nリングで組んだチームでした。"}, {"t": 31.9, "x": "イメージ映像"}, {"t": 31.9, "x": "そしてこの日が、3人そろって同じ相手の\n前に立った最後の夜になります。"}, {"t": 36.85, "x": "この形の試合が組まれたのは2回だけで、\nこの日がその2回目でした。"}, {"t": 41.516666666666666, "x": "3人が並んで戦えたのは、\n1981年10月8日から"}, {"t": 46.46666666666667, "x": "1983年2月7日まで。"}, {"t": 49.11666666666667, "x": "1年4か月でした。"}, {"t": 50.75, "x": "イメージ映像"}, {"t": 50.75, "x": "今回は、団体を失った3人がその1年4か月を\nどう過ごし、どこへ散っていったのかを、"}, {"t": 57.4, "x": "確認できた日付と数字だけで辿っていきます。"}, {"t": 60.6, "x": "最後までご覧いただければ幸いです。"}, {"t": 63.1, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.68333333333334, "x": "イメージ映像"}, {"t": 68.68333333333334, "x": "まず、3人がどういう選手だったのかを\n1人ずつ確認しておきます。"}, {"t": 73.4, "x": "1人目はラッシャー木村です。"}, {"t": 75.28333333333333, "x": "本名は木村政雄。"}, {"t": 76.83333333333333, "x": "イメージ映像"}, {"t": 76.83333333333333, "x": "1941年6月30日の生まれ。"}, {"t": 80.16666666666667, "x": "大相撲の宮城野部屋に入門し、幕下20枚目まで\n上がったところで廃業しています。"}, {"t": 86.26666666666667, "x": "イメージ映像"}, {"t": 86.26666666666667, "x": "1964年10月に日本プロレスへ入団し、\n翌1965年4月2日にデビューしました。"}, {"t": 93.91666666666667, "x": "1966年に東京プロレスの旗揚げに参加し、\nその崩壊後に国際プロレスへ移っています。"}, {"t": 101.16666666666667, "x": "リングネームをラッシャー木村に\n改めたのは1969年1月1日でした。"}, {"t": 106.61666666666666, "x": "1975年4月19日、\nマッドドッグ・バションを金網デスマッチで"}, {"t": 112.36666666666666, "x": "破りIWA世界ヘビー級王座を獲得。"}, {"t": 115.4, "x": "以後、団体が消える1981年の\n夏まで6年間エースを務めました。"}, {"t": 121.2, "x": "1976年から1979年にかけての\n26回連続防衛は、この王座の最多記録です。"}, {"t": 129.08333333333334, "x": "イメージ映像"}, {"t": 129.08333333333334, "x": "最後の防衛戦は1981年8月6日の室蘭でした。"}, {"t": 133.85, "x": "これが最後の金網デスマッチにもなっています。"}, {"t": 136.75, "x": "2人目はアニマル浜口です。"}, {"t": 138.71666666666667, "x": "本名は濱口平吾。"}, {"t": 140.46666666666667, "x": "1947年8月31日の生まれ。"}, {"t": 144.06666666666666, "x": "イメージ映像"}, {"t": 144.06666666666666, "x": "島根県浜田市で9人兄弟の8番目として生まれ、\n家計を助けるため高校への進学を断念しました。"}, {"t": 151.68333333333334, "x": "17歳でボディビルを始め、1969年に\nミスター兵庫コンテストで準優勝しています。"}, {"t": 158.53333333333333, "x": "同じ年の8月に国際プロレスへ入団しました。"}, {"t": 161.81666666666666, "x": "デビュー戦は9月20日、\n岡山県高梁市民会館での本郷清吉戦です。"}, {"t": 167.48333333333332, "x": "結果は反則負けでした。"}, {"t": 169.26666666666668, "x": "入門と同時に付き人として付いたのが\nグレート草津です。"}, {"t": 172.78333333333333, "x": "イメージ映像"}, {"t": 172.78333333333333, "x": "リングネームは1970年に決まりました。"}, {"t": 175.96666666666667, "x": "東京オリンピックの\nレスリング金メダリストだった渡辺長武の"}, {"t": 179.78333333333333, "x": "異名アニマルを、吉原功が\n譲り受ける形で名づけています。"}, {"t": 184.16666666666666, "x": "3人目は寺西勇です。"}, {"t": 186.25, "x": "本名は寺西等。"}, {"t": 187.91666666666666, "x": "イメージ映像"}, {"t": 187.91666666666666, "x": "1946年1月30日の生まれ。"}, {"t": 191.26666666666668, "x": "この人も相撲出身で、\n立浪部屋に入門し1963年5月場所で"}, {"t": 197.03333333333333, "x": "初土俵を踏んでいます。"}, {"t": 198.53333333333333, "x": "最高位は三段目1枚目。"}, {"t": 200.66666666666666, "x": "1966年5月場所を最後に廃業しました。"}, {"t": 204.53333333333333, "x": "イメージ映像"}, {"t": 204.53333333333333, "x": "その年に東京プロレスへ入り、\n10月21日の旗揚げ戦でデビューしています。"}, {"t": 210.26666666666668, "x": "東京プロレスの崩壊後は木村らとともに\n国際プロレスへ移りました。"}, {"t": 214.53333333333333, "x": "1975年3月13日、茨城県の境町体育館で\n稲妻二郎を破りIWAのミッドヘビー級王座を"}, {"t": 223.4, "x": "獲得し、3度防衛しています。"}, {"t": 225.93333333333334, "x": "1976年にはプロレス大賞の\n技能賞を受賞しました。"}, {"t": 230.33333333333334, "x": "イメージ映像"}, {"t": 230.33333333333334, "x": "大相撲出身ですがパワー一辺倒ではなく、\n素早い動きと連発のドロップキックを"}, {"t": 236.06666666666666, "x": "持ち味にした選手です。"}, {"t": 237.58333333333334, "x": "体が大きく見えるようにという助言を受けて、\n白いトランクスと白いシューズで通していました。"}, {"t": 243.53333333333333, "x": "技術を買われて、新人や初参戦の選手の\n力量をはかる試合に起用されることが"}, {"t": 249.13333333333333, "x": "イメージ映像"}, {"t": 249.13333333333333, "x": "多かった選手でもあります。"}, {"t": 250.76666666666668, "x": "1979年7月に初来日した\nダイナマイト・キッドの第一戦の相手も、"}, {"t": 256.18333333333334, "x": "イメージ映像"}, {"t": 256.18333333333334, "x": "阿修羅・原のデビュー戦の相手も寺西でした。"}, {"t": 259.4166666666667, "x": "国際プロレスでビル・ロビンソンから\n仕込まれていたため、寝技の"}, {"t": 263.51666666666665, "x": "心得もあったと記録されています。"}, {"t": 265.55, "x": "イメージ映像"}, {"t": 265.55, "x": "この3人が同じ団体からリングへ\n出ることになったのが1981年です。"}, {"t": 270.73333333333335, "x": "国際プロレスは1981年8月に\n興行機能を失いました。"}, {"t": 275.73333333333335, "x": "代表の吉原功は新日本プロレスとの\n対抗戦を模索し、1981年10月8日の"}, {"t": 282.9166666666667, "x": "蔵前国技館で全面対抗戦が企画されます。"}, {"t": 286.1, "x": "ところが、この大会のポスターに名前が\n載っていた選手の多くが反発しました。"}, {"t": 291.23333333333335, "x": "マイティ井上、米村天心、菅原伸義、\n冬木弘道は全日本プロレスへ移籍。"}, {"t": 298.3833333333333, "x": "イメージ映像"}, {"t": 298.3833333333333, "x": "阿修羅・原は一旦フリーになった後、\n全日本へ参戦します。"}, {"t": 302.8833333333333, "x": "鶴見五郎、マッハ隼人、高杉正彦、ミスター珍、\n若松市政は海外に活路を求めました。"}, {"t": 311.4166666666667, "x": "イメージ映像"}, {"t": 311.4166666666667, "x": "長期欠場中だったグレート草津と、\n最後のシリーズでデビューした新人は、"}, {"t": 316.4, "x": "解散と同時に引退しています。"}, {"t": 318.8833333333333, "x": "結果として、当日新日本のリングに上がったのは\n木村、浜口、寺西の3人だけでした。"}, {"t": 326.06666666666666, "x": "浜口が新日本へ移ったきっかけは、\n吉原功への恩義だったと本人が語っています。"}, {"t": 332.31666666666666, "x": "なお、国際プロレスの最後の\nシリーズのポスターでは、寺西の名前が"}, {"t": 337.46666666666664, "x": "寺西修と誤って印刷されていました。"}, {"t": 340.21666666666664, "x": "団体が最後に刷った紙に、エース以外の名前が\n正しく載っていなかったことになります。"}, {"t": 345.8333333333333, "x": "その3人が国際軍団の結成を\n宣言したのが、この10月8日です。"}, {"t": 351.1333333333333, "x": "かつてのエースだったストロング小林を\n加えた4人で、プロレス界の"}, {"t": 355.46666666666664, "x": "第3勢力になるとアピールしました。"}, {"t": 357.73333333333335, "x": "イメージ映像"}, {"t": 357.73333333333335, "x": "前月の9月23日には、木村と浜口が新日本の\n田園コロシアム大会に姿を見せています。"}, {"t": 364.75, "x": "木村の第一声が挨拶になったのは、\nこの夜のことでした。"}, {"t": 368.78333333333336, "x": "その場面については別の回で\n扱っていますので、ここでは先へ進みます。"}, {"t": 373.8666666666667, "x": "10月8日のメインは、\nアントニオ猪木と木村の一騎討ちでした。"}, {"t": 378.28333333333336, "x": "この試合の結果を、はっきり確認しておきます。"}, {"t": 381.8333333333333, "x": "決着は10分35秒。"}, {"t": 383.9, "x": "イメージ映像"}, {"t": 383.9, "x": "猪木が腕ひしぎ逆十字固めを極めたまま、\nレフェリーのブレイク要請を"}, {"t": 388.75, "x": "無視したとして反則を取られました。"}, {"t": 390.8833333333333, "x": "つまり猪木の反則負け、木村の反則勝ちです。"}, {"t": 394.46666666666664, "x": "イメージ映像"}, {"t": 394.46666666666664, "x": "記録の上では、乗り込んだ側が勝っています。"}, {"t": 397.6166666666667, "x": "ただし遺恨を残す形の決着でした。"}, {"t": 400.23333333333335, "x": "イメージ映像"}, {"t": 400.23333333333335, "x": "対抗戦の第1戦のカードも記録に残っています。"}, {"t": 403.6166666666667, "x": "寺西とアニマル浜口に対して、\n長州力と木戸修でした。"}, {"t": 407.8833333333333, "x": "両団体とも、何かあったときに\n対処できる寝技の強い選手を出したかたちです。"}, {"t": 413.23333333333335, "x": "イメージ映像"}, {"t": 413.23333333333335, "x": "そこから、3人の立ち位置が変わっていきます。"}, {"t": 416.5, "x": "再戦を求めるアピールのために、私服姿での\n会場への乱入も辞さないようになりました。"}, {"t": 422.6666666666667, "x": "実況していたテレビ朝日の\nアナウンサーを襲撃したこともあります。"}, {"t": 426.71666666666664, "x": "その過程で、3人は\nヒール軍団として扱われるようになりました。"}, {"t": 431.31666666666666, "x": "マスコミからは、はぐれ国際軍団、\n剣が峰に立たされた崖っぷち"}, {"t": 436.26666666666665, "x": "国際軍団といった呼び方をされています。"}, {"t": 438.8666666666667, "x": "自分たちで名乗った第3勢力という言葉は、1年\nたたないうちに別の呼び名に置き換わりました。"}, {"t": 445.1333333333333, "x": "イメージ映像"}, {"t": 445.1333333333333, "x": "猪木戦も続きます。"}, {"t": 446.6333333333333, "x": "1981年11月5日、同じ蔵前国技館。"}, {"t": 451.4166666666667, "x": "ランバージャック・デスマッチとして\n組まれた再戦でした。"}, {"t": 454.48333333333335, "x": "イメージ映像"}, {"t": 454.48333333333335, "x": "猪木が腕ひしぎ逆十字固めで執拗に木村を\n攻め、骨折寸前と察知した国際軍団の"}, {"t": 460.8, "x": "セコンド陣がタオルを投入。"}, {"t": 462.6, "x": "今度は木村のTKO負けです。"}, {"t": 464.9166666666667, "x": "1982年9月21日、大阪府立体育会館。"}, {"t": 470.05, "x": "負けた側が髪を切られる\nヘア・ベンド・マッチが組まれました。"}, {"t": 473.3833333333333, "x": "試合は猪木が制しています。"}, {"t": 475.4166666666667, "x": "イメージ映像"}, {"t": 475.4166666666667, "x": "ところが勝負が決まる前の場外乱闘で、\nリングサイドにいたストロング小林が"}, {"t": 480.5, "x": "浜口にハサミを渡しました。"}, {"t": 482.3333333333333, "x": "そして浜口が、猪木の髪を切り刻みます。"}, {"t": 485.71666666666664, "x": "イメージ映像"}, {"t": 485.71666666666664, "x": "さらに国際軍団は、勝負が決まるや\n否や会場から逃走しました。"}, {"t": 49 function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

function mark(pane,i){

}

D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
