<script>
const D={"name": "オープン選手権の馬場", "file": "292_編集用", "dur": 930.35, "segs": [], "subs": [{"t": 0.0, "x": "最後の公式戦が、まだ1つ残っていました。"}, {"t": 3.566666666666667, "x": "1975年12月18日、\n神奈川の川崎市体育館です。"}, {"t": 9.316666666666666, "x": "ジャイアント馬場は、この夜の\n公式戦に10分5秒で勝ちました。"}, {"t": 13.8, "x": "そのあとに、もう1つ公式戦が組まれていました。"}, {"t": 17.333333333333332, "x": "それでも、優勝はこの時点で決まっていました。"}, {"t": 20.633333333333333, "x": "次の試合の結果にかかわらず、馬場が優勝した。"}, {"t": 24.483333333333334, "x": "試合の記録には、そう書かれています。"}, {"t": 27.333333333333332, "x": "大会の名前はオープン選手権です。"}, {"t": 29.916666666666668, "x": "全日本プロレスが、この年の暮れに\n開いたシングルのリーグ戦でした。"}, {"t": 34.5, "x": "出場した20人と、\n馬場はどう戦ったのでしょうか？"}, {"t": 38.65, "x": "13の夜に何があったのでしょうか？"}, {"t": 41.2, "x": "今回は、1975年のオープン選手権を追います。"}, {"t": 45.7, "x": "12月6日の開幕から、\n12月18日の川崎までです。"}, {"t": 50.45, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 55.0, "x": "東京スポーツの記事と、\n馬場の公式年表も合わせて見ていきます。"}, {"t": 59.6, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.083333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 67.66666666666667, "x": "まず馬場の公式年表を開きます。"}, {"t": 70.11666666666666, "x": "1975年のところに、\nこの大会の名前はありません。"}, {"t": 74.61666666666666, "x": "年表に書かれているのは別のタッグの試合です。"}, {"t": 77.73333333333333, "x": "そこで今回は、試合の記録と新聞の\n記事で、この2週間をたどります。"}, {"t": 83.18333333333334, "x": "年表には、馬場が1938年1月23日に\n新潟県の三条市で生まれたとあります。"}, {"t": 90.48333333333333, "x": "この暮れの馬場は37歳でした。"}, {"t": 92.9, "x": "東京スポーツは、この大会をこう書いています。"}, {"t": 96.28333333333333, "x": "全日本プロレスが、12月6日から\n総当たりのリーグ戦を開いた。"}, {"t": 101.05, "x": "名前はオープン選手権。"}, {"t": 102.86666666666666, "x": "国際プロレスと外国人の\n強い選手を、20人集めた。"}, {"t": 107.11666666666666, "x": "試合の記録でも、公式戦に\n出てくる名前を数えると20人です。"}, {"t": 111.9, "x": "日本のレスラーは全日本プロレスの\n選手だけではありません。"}, {"t": 115.58333333333333, "x": "国際プロレスの選手も、\nこのリーグ戦に出ています。"}, {"t": 119.25, "x": "記録では、シリーズの大会は12です。"}, {"t": 122.3, "x": "そこに12月11日の1つの大会が加わります。"}, {"t": 125.9, "x": "これは、オープン選手権とは別の大会でした。"}, {"t": 129.43333333333334, "x": "馬場は、この13の夜のすべてに出ています。"}, {"t": 132.68333333333334, "x": "公式戦は8つでした。"}, {"t": 134.43333333333334, "x": "残りの5つの夜はタッグの試合です。"}, {"t": 137.0, "x": "12月6日は東京の足立区体育館です。"}, {"t": 140.16666666666666, "x": "観客は3200人と記録されています。"}, {"t": 143.13333333333333, "x": "この夜は公式戦が6つ組まれました。"}, {"t": 145.73333333333332, "x": "外国人のレスラーどうしの試合もあります。"}, {"t": 148.51666666666668, "x": "1つは10分41秒の押さえ込みで決まりました。"}, {"t": 151.96666666666667, "x": "もう1つは10分2秒、\n反則で勝負がつきました。"}, {"t": 155.75, "x": "負けたのは、アメリカから来たレスラーです。"}, {"t": 158.68333333333334, "x": "このレスラーの名前は、公式年表の\n1969年のところに出てきます。"}, {"t": 164.28333333333333, "x": "馬場と60分を戦った、\n当時の世界の王者でした。"}, {"t": 168.28333333333333, "x": "この夜の最後は馬場の最初の公式戦です。"}, {"t": 171.31666666666666, "x": "相手は外国人のレスラーでした。"}, {"t": 173.53333333333333, "x": "8分9秒の押さえ込みで馬場が勝っています。"}, {"t": 176.46666666666667, "x": "12月7日は埼玉の川越市です。"}, {"t": 179.23333333333332, "x": "観客は3900人でした。"}, {"t": 181.61666666666667, "x": "馬場の2つ目の公式戦は、\n別の外国人のレスラーとの試合です。"}, {"t": 186.41666666666666, "x": "12分45秒で両者リングアウトになりました。"}, {"t": 189.7, "x": "勝ち負けはつきません。"}, {"t": 191.15, "x": "同じ夜、6年前の世界の王者も公式戦に出ました。"}, {"t": 195.25, "x": "相手は、開幕の夜に勝った外国人のレスラーです。"}, {"t": 199.16666666666666, "x": "30分を戦って、時間切れの引き分けでした。"}, {"t": 202.8, "x": "12月8日は広島の呉市です。"}, {"t": 205.31666666666666, "x": "観客は3000人でした。"}, {"t": 207.2, "x": "この夜、馬場は覆面の\nレスラーとタッグを組みました。"}, {"t": 210.93333333333334, "x": "相手の組には、6年前の世界の王者がいます。"}, {"t": 214.5, "x": "19分47秒、馬場が相手を\n押さえ込んで勝ちました。"}, {"t": 218.98333333333332, "x": "公式戦ではありません。"}, {"t": 220.66666666666666, "x": "同じ夜、国際プロレスの\n選手は公式戦に勝っています。"}, {"t": 224.78333333333333, "x": "相手は、開幕の夜に馬場に\n敗れた外国人のレスラーでした。"}, {"t": 229.28333333333333, "x": "11分14秒の押さえ込みです。"}, {"t": 231.75, "x": "12月9日は福岡です。"}, {"t": 233.9, "x": "観客は5700人と記録されています。"}, {"t": 236.9, "x": "ここまでで一番多い数です。"}, {"t": 238.91666666666666, "x": "馬場の3つ目の公式戦の\n相手は外国人のレスラーです。"}, {"t": 242.68333333333334, "x": "6日の夜に、10分41秒の\n押さえ込みで勝っていたレスラーでした。"}, {"t": 247.53333333333333, "x": "試合は30分を戦っても終わりません。"}, {"t": 250.4, "x": "時間切れの引き分けです。"}, {"t": 252.08333333333334, "x": "同じ夜、6年前の世界の\n王者は公式戦に勝ちました。"}, {"t": 256.3333333333333, "x": let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
