<script>
const D={"name": "グレート・カブキ", "file": "240_編集用", "dur": 939.31665625, "segs": [], "subs": [{"t": 0.0, "x": "1982年12月25日、クリスマスの夜。"}, {"t": 4.566666666666666, "x": "アメリカ・ジョージア州アトランタの\nオムニ・コロシアムで、"}, {"t": 7.516666666666667, "x": "6人タッグマッチが行われていました。"}, {"t": 10.383333333333333, "x": "片側のチームには、アンドレ・ザ・ジャイアントと\nスタン・ハンセンがいました。"}, {"t": 14.8, "x": "イメージ映像"}, {"t": 14.8, "x": "その反対側のコーナーに、顔を赤と\n緑に塗った1人の日本人がいました。"}, {"t": 19.9, "x": "試合の途中、その男が口から霧を吹き上げます。"}, {"t": 23.783333333333335, "x": "イメージ映像"}, {"t": 23.783333333333335, "x": "霧を浴びたアンドレは叫び声を上げてリング下に\n転げ落ち、そのまま客席の間を歩き回りました。"}, {"t": 30.3, "x": "イメージ映像"}, {"t": 30.3, "x": "会場は大騒ぎになったと、\n男は後に振り返っています。"}, {"t": 34.35, "x": "イメージ映像"}, {"t": 34.35, "x": "この男は、10年あまり前には、\nアメリカ人に名前を"}, {"t": 38.65, "x": "覚えてもらうことにすら苦労していました。"}, {"t": 40.916666666666664, "x": "イメージ映像"}, {"t": 40.916666666666664, "x": "日本では、前座から叩き上げてきた中堅の\nレスラーの1人でした。"}, {"t": 45.38333333333333, "x": "その男がなぜ、アメリカでアンドレやハンセンと\n同じリングに立つ大物になったのでしょうか。"}, {"t": 51.4, "x": "イメージ映像"}, {"t": 51.4, "x": "そして、後に多くのレスラーが\n真似をすることになる毒霧は、"}, {"t": 55.46666666666667, "x": "いったいどこから生まれたのでしょうか。"}, {"t": 57.8, "x": "今回は、ザ・グレート・カブキという男が、\n東洋の神秘と呼ばれるまでの道のりを、本人の"}, {"t": 64.38333333333334, "x": "イメージ映像"}, {"t": 64.38333333333334, "x": "証言と記録に残る日付をもとに辿っていきます。"}, {"t": 67.45, "x": "最後までご覧いただければ幸いです。"}, {"t": 69.95, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 75.53333333333333, "x": "イメージ映像"}, {"t": 75.53333333333333, "x": "ザ・グレート・カブキ、本名は米良明久。"}, {"t": 78.55, "x": "1948年9月8日、\n宮崎県延岡市で生まれました。"}, {"t": 83.6, "x": "父は元海軍で、戦後は自転車店を営んでいました。"}, {"t": 87.66666666666667, "x": "イメージ映像"}, {"t": 87.66666666666667, "x": "その父は、米良が小学校5年生の\nころに亡くなり、以後は母が食堂を"}, {"t": 93.16666666666667, "x": "開いて子どもたちを育てています。"}, {"t": 95.15, "x": "米良が初めてプロレスを見たのは\n中学1年生のときでした。"}, {"t": 98.95, "x": "隣の家がテレビを買い、そこで\n力道山の試合を見たのがきっかけです。"}, {"t": 103.78333333333333, "x": "中学2年で愛知県知立市に引っ越した後、\n卒業したらプロレスラーになると決めました。"}, {"t": 109.58333333333333, "x": "イメージ映像"}, {"t": 109.58333333333333, "x": "1963年11月9日、米良は夜行列車で東京・\n赤坂にあった日本プロレスの合宿所を訪ね、"}, {"t": 117.41666666666667, "x": "イメージ映像"}, {"t": 117.41666666666667, "x": "力道山に入門を直訴しようとします。"}, {"t": 120.33333333333333, "x": "イメージ映像"}, {"t": 120.33333333333333, "x": "しかし、この日は会うことができませんでした。"}, {"t": 123.55, "x": "その1か月後の12月8日、\n力道山は刺され、1週間後に亡くなります。"}, {"t": 129.46666666666667, "x": "米良はあきらめず、\n翌年1月にもう一度上京しました。"}, {"t": 133.78333333333333, "x": "応対した豊登から年齢を聞かれ、\n中学3年の15歳だと答えると、"}, {"t": 139.05, "x": "イメージ映像"}, {"t": 139.05, "x": "卒業したらおいで、と言われます。"}, {"t": 141.86666666666667, "x": "米良は口約束では困ると考え、\nその場で念書を書いてもらいました。"}, {"t": 146.63333333333333, "x": "1964年、日本プロレスに入門。"}, {"t": 150.33333333333334, "x": "同じ年の10月31日、\n宮城県石巻市の特設リングで、"}, {"t": 155.36666666666667, "x": "山本小鉄を相手にデビューしました。"}, {"t": 158.01666666666668, "x": "翌年からは、出身地の宮崎に\nちなんだ高千穂明久という"}, {"t": 162.31666666666666, "x": "リングネームを名乗ります。"}, {"t": 163.71666666666667, "x": "転機は1970年9月に訪れます。"}, {"t": 166.91666666666666, "x": "イメージ映像"}, {"t": 166.91666666666666, "x": "高千穂は、アメリカへの武者修行に出発しました。"}, {"t": 170.68333333333334, "x": "イメージ映像"}, {"t": 170.68333333333334, "x": "出発の前日には、\n当時交際していた女性と結婚しています。"}, {"t": 175.33333333333334, "x": "イメージ映像"}, {"t": 175.33333333333334, "x": "最初の土地は、\nカリフォルニア州ロサンゼルスでした。"}, {"t": 178.95, "x": "イメージ映像"}, {"t": 178.95, "x": "本人によれば、当時のアメリカで\n日本人レスラーが選べる役は、"}, {"t": 183.45, "x": "悪役のヒールしかありませんでした。"}, {"t": 186.05, "x": "太平洋戦争が終わってから、\nまだ25年しか経っていなかった時代です。"}, {"t": 191.03333333333333, "x": "ロサンゼルスのメイン会場だった\nオリンピック・オーディトリアムでは、"}, {"t": 194.61666666666667, "x": "2週間に1回の興行に毎回6000人から\n7000人が入っていたといいます。"}, {"t": 199.98333333333332, "x": "この地で行動をともにしたのが、マサ斎藤でした。"}, {"t": 203.48333333333332, "x": "イメージ映像"}, {"t": 203.48333333333332, "x": "半年後の1971年2月、高千穂は\nミシガン州デトロイトへ移ります。"}, {"t": 209.6, "x": "イメージ映像"}, {"t": 209.6, "x": "本人は、当時のデトロイトは\n反日感情がとても強かったと語っています。"}, {"t": 214.73333333333332, "x": "イメージ映像"}, {"t": 214.73333333333332, "x": "試合を終えて帰ろうとすると、\n日本人だからという理由で客が"}, {"t": 218.9, "x": "イメージ映像"}, {"t": 218.9, "x": "殴りかかってくることが何度もあり、\n殴り返したところ、今度は客から"}, {"t": 224.1, "x": "訴えられたこともあったそうです。"}, {"t": 225.96666666666667, "x": "イメージ映像"}, {"t": 225.96666666666667, "x": "それでも高千穂は、\nヒールという仕事を楽しんでいました。"}, {"t": 229.85, "x": "客を怒らせると、\n翌週にはさらに多くの客が集まる。"}, {"t": 233.93333333333334, "x": "イメージ映像"}, {"t": 233.93333333333334, "x": "あまりに客が興奮するので、\nプロモーターから、あまりヒートを出すな、"}, {"t": 238.76666666666668, "x": "つまり客を怒らせすぎるなと\n注意されたこともあったと振り返っています。"}, {"t": 243.4, "x": "1972年9月、高千穂は一度帰国します。"}, {"t": 247.81666666666666, "x": "経営が傾いていた日本プロレスの\n最後のツアーに出てほしいと、"}, {"t": 251.78333333333333, "x": "師匠の芳の里から頼まれたためでした。"}, {"t": 254.56666666666666, "x": "イメージ映像"}, {"t": 254.56666666666666, "x": "1973年4月20日、日本プロレスは\n最終戦を迎え、事実上活動を停止します。"}, {"t": 262.05, "x": "高千穂はアメリカに戻るつもりでしたが、\n芳の里の顔を立てる形で、ジャイアント馬場の"}, {"t": 268.1166666666667, "x": "全日本プロレスに移ることになりました。"}, {"t": 270.48333333333335, "x": "全日本では、1973年10月からの\nオーストラリア遠征や、1976年10月の"}, {"t": 278.18333333333334, "x": "イメージ映像"}, {"t": 278.18333333333334, "x": "アジアタッグ王座獲得を経験しました。"}, {"t": 280.7, "x": "イメージ映像"}, {"t": 280.7, "x": "そして1978年2月、高千穂は日本を\n離れると決め、再びアメリカへ渡ります。"}, {"t": 287.93333333333334, "x": "イメージ映像"}, {"t": 287.93333333333334, "x": "最初の土地はフロリダでした。"}, {"t": 289.85, "x": "ここで名乗ったリングネームが、\nミスター・サトです。"}, {"t": 293.06666666666666, "x": "師匠である芳の里の、\nサトの部分だけを借りた名前でした。"}, {"t": 297.23333333333335, "x": "本人はその理由を、短い方が\nアメリカ人が発音しやすく、"}, {"t": 301.7, "x": "覚えやすいからだと説明しています。"}, {"t": 304.43333333333334, "x": "イメージ映像"}, {"t": 304.43333333333334, "x": "日本でのリングネームの高千穂、タカチホは、\nアメリカでは長すぎたというのです。"}, {"t": 310.26666666666665, "x": "フロリダでは、マサ斎藤と組んで、\nサイトー・アンド・サトという"}, {"t": 314.45, "x": "タッグになりました。"}, {"t": 315.53333333333336, "x": "イメージ映像"}, {"t": 315.53333333333336, "x": "本人によれば、どこへ行ってもソールドアウト。"}, {"t": 318.68333333333334, "x": "イメージ映像"}, {"t": 318.68333333333334, "x": "土曜と日曜は昼と夜の2回興行で、\nそのほとんどでメインイベントを務め、"}, {"t": 323.9, "x": "プロモーターはファイトマネーに\nボーナスまで上乗せしたといいます。"}, {"t": 327.8, "x": "イメージ映像"}, {"t": 327.8, "x": "1978年3月には、このコンビで\nフロリダ地区のタッグ王座を獲得しました。"}, {"t": 333.85, "x": "1979年3月には、\nテキサス州アマリロに移ります。"}, {"t": 338.73333333333335, "x": "イメージ映像"}, {"t": 338.73333333333335, "x": "野球場で行われる興行には、4万人から\n5万人の客が外野席の端まで入ったといいます。"}, {"t": 345.43333333333334, "x": "イメージ映像"}, {"t": 345.43333333333334, "x": "遠くの客には細かい動きが見えないため、\nコーナーから何度も飛んで受け身を取ってみせた。"}, {"t": 351.1666666666667, "x": "大きい会場では、大きい\nプロレスをしなければいけない。"}, {"t": 354.95, "x": "イメージ映像"}, {"t": 354.95, "x": "会場の大きさによって動き方を変えることを、\nこの時期に学んだと本人は語っています。"}, {"t": 360.75, "x": "同じ1979年8月、高千穂は、\nプロレス夢のオールスター戦に"}, {"t": 366.78333333333336, "x": "出場するため一時帰国しました。"}, {"t": 368.9, "x": "しかしこのとき、馬場から全日本に\n戻ってこいとは言われなかったといいます。"}, {"t": 373.81666666666666, "x": "本人も戻るつもりはありませんでした。"}, {"t": 376.25, "x": "アメリカでのギャラは、日本時代の\n何十倍にもなっていたからです。"}, {"t": 380.48333333333335, "x": "イメージ映像"}, {"t": 380.48333333333335, "x": "1980年、高千穂は\nミズーリ州カンザスシティーに拠点を移し、"}, {"t": 385.85, "x": "アメリカの永住権を申請します。"}, {"t": 388.68333333333334, "x": "この地で5月に出会ったのが、\nまだ中堅だったブルーザー・ブロディでした。"}, {"t": 393.1333333333333, "x": "イメージ映像"}, {"t": 393.1333333333333, "x": "そのブロディから、ある知らせを受け取ります。"}, {"t": 396.1333333333333, "x": "テキサス州ダラスで団体を運営している\nフリッツ・フォン・エリックが、"}, {"t": 399.9, "x": "お前を探していた、というものでした。"}, {"t": 402.95, "x": "イメージ映像"}, {"t": 402.95, "x": "永住権を取るとすぐにフォン・エリックに\n連絡し、その年の暮れ、"}, {"t": 407.4, "x": "高千穂はダラスに入りました。"}, {"t": 409.78333333333336, "x": "空港で出迎えたのは、\nマネージャーのゲーリー・ハートです。"}, {"t": 413.48333333333335, "x": "このハートが、ある日、\n日本文化を紹介する雑誌を見せてきます。"}, {"t": 418.48333333333335, "x": "そこに載っていたのは、\n歌舞伎役者の写真でした。"}, {"t": 421.9166666666667, "x": "お前、こういう格好はできるか。"}, {"t": 424.6333333333333, "x": "イメージ映像"}, {"t": 424.6333333333333, "x": "そう聞かれた高千穂は、できなくはない、と\n答えます。"}, {"t": 428.56666666666666, "x": "イメージ映像"}, {"t": 428.56666666666666, "x": "着物や袴はもともと持っていたので、\nそこに化粧を加えてみることにしました。"}, {"t": 433.55, "x": "名前は、本人がカブキで\nいいのではないかと提案しました。"}, {"t": 437.55, "x": "アメリカ人にも覚えやすい、という理由です。"}, {"t": 440.93333333333334, "x": "そこにハートが、ザ・グレートを付け加えました。"}, {"t": 444.1333333333333, "x": "ザ・グレート・カブキという名前は、\nこうして2人の合作で生まれています。"}, {"t": 448.7, "x": "顔の化粧には、あまり苦労しなかったと\n本人は語っています。"}, {"t": 453.01666666666665, "x": "イメージ映像"}, {"t": 453.01666666666665, "x": "鏡を見ながら、怖そうに見えればいいと\n思いつきで描き、赤や緑を入れていった。"}, {"t": 459.15, "x": "頭巾や衣装も自分で縫いました。"}, {"t": 461.3, "x": "ヌンチャクは、\nカブキになる少し前から始めていました。"}, {"t": 464.98333333333335, "x": "イメージ映像"}, {"t": 464.98333333333335, "x": "ロサンゼルスの自宅の向かいに住む子どもが\n道路で振り回しているのを見て、"}, {"t": 469.1333333333333, "x": "教えてもらったところ、2時間ほどで\n扱えるようになったといいます。"}, {"t": 473.81666666666666, "x": "リングでヌンチャクを使う\nレスラーはまだいなかったため、"}, {"t": 476.85, "x": "取り入れることにしました。"}, {"t": 478.75, "x": "自伝によれば、アメリカでの出身地は\n日本ではなく、シンガポールとされました。"}, {"t": 484.51666666666665, "x": "イメージ映像"}, {"t": 484.51666666666665, "x": "すでに日本製の車や電化製品が\n広まっていたアメリカでは、日本出身では"}, {"t": 489.78333333333336, "x": "謎めいた印象を出せないと考えたためです。"}, {"t": 492.51666666666665, "x": "イメージ映像"}, {"t": 492.51666666666665, "x": "本人は当初チベット出身という設定を\n考えましたが、ハートが"}, {"t": 497.15, "x": "チベットを知らなかったため、\nシンガポールになったと記されています。"}, {"t": 501.3666666666667, "x": "1981年1月10日、\nザ・グレート・カブキとしての"}, {"t": 505.75, "x": "最初の試合が行われました。"}, {"t": 507.6666666666667, "x": "イメージ映像"}, {"t": 507.6666666666667, "x": "最初に食いついたのは\n子どもたちだったといいます。"}, {"t": 510.55, "x": "侍の格好で出てくるのか、\n忍者の格好で出てくるのか。"}, {"t": 514.7166666666667, "x": "イメージ映像"}, {"t": 514.7166666666667, "x": "客は対戦相手よりも、今日はどういう姿で\n現れるのかを楽しみにするようになりました。"}, {"t": 520.6, "x": "カブキはさらに、日本式の\nデスマッチを考案します。"}, {"t": 524.3333333333334, "x": "リングの中央に竹刀を1本置き、先に\n取った方が武器として使えるというルールで、"}, {"t": 529.7666666666667, "x": "イメージ映像"}, {"t": 529.7666666666667, "x": "名前はドラゴン・シアイ・マッチ。"}, {"t": 531.9, "x": "当時のアメリカでは竹刀を見たことがある人は\n少なく、叩いたときの大きな音に"}, {"t": 537.0333333333333, "x": "客は興奮したといいます。"}, {"t": 538.8, "x": "イメージ映像"}, {"t": 538.8, "x": "抗争の決着はこの試合で、という流れができ、\nどこの会場もソールドアウトになったと"}, {"t": 545.0833333333334, "x": "本人は語っています。"}, {"t": 546.5166666666667, "x": "プロモーターのフォン・エリックは喜び、\n毎週ギャラとは別にボーナスを出しました。"}, {"t": 551.6333333333333, "x": "その額は、週に2000ドルから\n3000ドルだったといいます。"}, {"t": 555.6333333333333, "x": "毒霧が生まれたのは、\nカブキになってから数か月後のことでした。"}, {"t": 559.9333333333333, "x": "イメージ映像"}, {"t": 559.9333333333333, "x": "それまで日本人のヒールは、\n相撲の塩まきにならって、"}, {"t": 563.75, "x": "相手に塩を投げつけるのが定番でした。"}, {"t": 566.7, "x": "しかし1970年代には、\nそれも古くなっていました。"}, {"t": 570.9666666666667, "x": "カブキはずっと、塩に代わる何かはないかと\n考えていたといいます。"}, {"t": 575.4166666666666, "x": "ひらめいたのは、シャワーで\n化粧を落としていたときでした。"}, {"t": 579.0833333333334, "x": "アメリカのシャワーは、\n日本より高い位置についています。"}, {"t": 582.6833333333333, "x": "イメージ映像"}, {"t": 582.6833333333333, "x": "浴びていると自然に顔が上を向き、口に水が入る。"}, {"t": 586.5333333333333, "x": "その水を何となく照明に\n向かって吹き出したところ、虹がかかりました。"}, {"t": 591.1333333333333, "x": "これだ、と思ったと本人は語っています。"}, {"t": 594.2666666666667, "x": "イメージ映像"}, {"t": 594.2666666666667, "x": "そこから試行錯誤が始まりました。"}, {"t": 596.5833333333334, "x": "いろいろな色を試し、\n照明によってどう見えるかを確かめた。"}, {"t": 600.85, "x": "その結果、相手がコーナーから飛んでくるときに\n下から吹き上げると、霧が照明を受けて光の"}, {"t": 607.3333333333334, "x": "イメージ映像"}, {"t": 607.3333333333334, "x": "筋が見えることが分かったといいます。"}, {"t": 609.5, "x": "色は最初の緑だけでなく、\n赤も使うようにしました。"}, {"t": 613.3166666666667, "x": "赤なら血の色にも見え、客が、\nどうなっているんだと興味を持つからです。"}, {"t": 618.6166666666667, "x": "イメージ映像"}, {"t": 618.6166666666667, "x": "竹刀、ヌンチャク、日本刀、\n手作りの頭巾と衣装、そして毒霧。"}, {"t": 624.4833333333333, "x": "こうしてスタイルが固まると、カブキの\n人気はアメリカで一気に広がりました。"}, {"t": 629.3833333333333, "x": "1981年9月25日には、フォン・エリック家の\nケリー・フォン・エリックを破り、"}, {"t": 635.2, "x": "NWAアメリカン・ヘビー級王座を\n獲得しています。"}, {"t": 639.3666666666667, "x": "イメージ映像"}, {"t": 639.3666666666667, "x": "他の地区からの依頼も相次ぎ、ダラスと\n遠征先での試合がおよそ半々になりました。"}, {"t": 645.2666666666667, "x": "イメージ映像"}, {"t": 645.2666666666667, "x": "そして1982年12月25日、冒頭の\nアトランタでの6人タッグマッチに至ります。"}, {"t": 652.2, "x": "1983年5月23日には、アメリカ東部の\n別の団体でテレビ王座を獲得し、11月24日の"}, {"t": 660.95, "x": "イメージ映像"}, {"t": 660.95, "x": "第1回スターケードで敗れるまで保持しました。"}, {"t": 663.7333333333333, "x": "イメージ映像"}, {"t": 663.7333333333333, "x": "その間の1983年2月、カブキのもとに、\n日本から1本の依頼が届きます。"}, {"t": 670.5666666666667, "x": "声をかけたのは、全日本プロレスで\n試合の組み立てを担当していた、"}, {"t": 675.15, "x": "日本プロレス時代の後輩、佐藤昭雄でした。"}, {"t": 678.8166666666667, "x": "イメージ映像"}, {"t": 678.8166666666667, "x": "このシリーズは馬場が終盤まで\nアメリカ遠征で欠場する予定で、"}, {"t": 682.9666666666667, "x": "客の入りが心配されていたのです。"}, {"t": 685.4666666666667, "x": "カブキは、日本で自分が\n知られているとは思っておらず、一度は、"}, {"t": 690.2833333333333, "x": "イメージ映像"}, {"t": 690.2833333333333, "x": "俺が行ってもしょうがない、と断りました。"}, {"t": 693.5, "x": "それでも頼まれ、帰国を決めています。"}, {"t": 696.3666666666667, "x": "1983年2月11日、後楽園ホール。"}, {"t": 700.9333333333333, "x": "カブキは、アメリカでの姿のまま、\n日本のリングに初めて登場しました。"}, {"t": 706.2666666666667, "x": "相手はジム・デュラン。"}, {"t": 707.6, "x": "会場は超満員で、カメラマンは\n50人ほど集まっていたといいます。"}, {"t": 712.5, "x": "子どもたちは毒霧を喜び、\n真似をする子が増えたため、学校で"}, {"t": 717.75, "x": "イメージ映像"}, {"t": 717.75, "x": "禁止されたという話も耳にしたそうです。"}, {"t": 720.3333333333334, "x": "シリーズはその後も2週間から3週間、\nどこも超満員になりました。"}, {"t": 725.4666666666667, "x": "馬場が欠場していたにもかかわらず、\nテレビ放映権料を除いた興行収益で、2月の"}, {"t": 731.8, "x": "イメージ映像"}, {"t": 731.8, "x": "シリーズとしては全日本プロレスの設立以来\n初めての黒字になったと伝えられています。"}, {"t": 737.0, "x": "ところが、アメリカから戻った馬場の\n機嫌はよくなかったといいます。"}, {"t": 741.3, "x": "イメージ映像"}, {"t": 741.3, "x": "カブキは帰国した馬場から、先輩たちより\n給料は上げられないぞ、とくぎを刺されました。"}, {"t": 747.3666666666667, "x": "自伝には、若手のコーチ役を\n任されていたにもかかわらず、"}, {"t": 751.3166666666667, "x": "イメージ映像"}, {"t": 751.3166666666667, "x": "提示された昇給が1試合あたり100円、\n後に500円だったという話も記されています。"}, {"t": 758.15, "x": "カブキは、やっていられないと感じ、\nすぐにダラスへ戻りました。"}, {"t": 762.7666666666667, "x": "その年の12月12日、蔵前国技館で、\nアメリカでも戦ったリック・フレアーの"}, {"t": 769.0, "x": "NWA世界ヘビー級王座に挑戦しています。"}, {"t": 772.2833333333333, "x": "カブキの影響は、その後の世代にも及びました。"}, {"t": 775.6833333333333, "x": "1988年の暮れ、\nアメリカで活動していた武藤敬司は、"}, {"t": 780.7, "x": "WCWという団体から声をかけられます。"}, {"t": 784.6666666666666, "x": "そこで武藤のマネージャーについたのが、\nゲーリー・ハートでした。"}, {"t": 788.6, "x": "武藤によれば、ペイントした姿を見た\nハートのアイデアで、カブキの息子、"}, {"t": 793.85, "x": "グレート・ムタとして戦うことになったと\nいいます。"}, {"t": 796.9166666666666, "x": "イメージ映像"}, {"t": 796.9166666666666, "x": "毒霧も最初から吹いたわけではなく、\n少しずつ見せていったと武藤は語っています。"}, {"t": 802.4166666666666, "x": "2023年1月22日、横浜アリーナ。"}, {"t": 806.5166666666667, "x": "グレート・ムタの引退試合で、\nカブキはヌンチャクと毒霧を披露しました。"}, {"t": 811.2833333333333, "x": "本人は、息子のためにやるのが最後というのも\nいいと思った、と語り、これが自身の最後の"}, {"t": 818.0833333333334, "x": "パフォーマンスになったとしています。"}, {"t": 819.9333333333333, "x": "イメージ映像"}, {"t": 819.9333333333333, "x": "1981年に生まれた毒霧は、42年後、\nその息子の最後の舞台で封印されました。"}, {"t": 827.2333333333333, "x": "ここで、ザ・グレート・カブキが生まれるまでの\n日付を、順番に並べ直してみます。"}, {"t": 832.7, "x": "1970年9月、ロサンゼルスへ。"}, {"t": 836.1833333333333, "x": "ここで日本人にはヒールしかないことを知る。"}, {"t": 838.8666666666667, "x": "1971年2月、デトロイトへ。"}, {"t": 842.7166666666667, "x": "客を怒らせるほど、翌週の客が増えることを知る。"}, {"t": 846.4166666666666, "x": "1978年2月、フロリダへ。"}, {"t": 849.8, "x": "名前をミスター・サトと短くし、\nマサ斎藤とのタッグでソールドアウトが続く。"}, {"t": 855.1166666666667, "x": "1979年3月、アマリロへ。"}, {"t": 858.7166666666667, "x": "4万人から5万人が入る球場で、\n大きな会場では大きな動きが要ることを学ぶ。"}, {"t": 864.6666666666666, "x": "1979年8月、一時帰国。"}, {"t": 868.3166666666667, "x": "馬場から、戻ってこいとは言われない。"}, {"t": 870.95, "x": "1980年、カンザスシティーでブロディと\n出会い、その年の暮れにダラスへ。"}, {"t": 876.9333333333333, "x": "1981年1月10日、\nザ・グレート・カブキとして最初の試合。"}, {"t": 882.2, "x": "そして数か月後、シャワーの\n水から毒霧が生まれます。"}, {"t": 886.0333333333333, "x": "歌舞伎役者の写真を持ち込んだのは、\nゲーリー・ハートでした。"}, {"t": 890.0666666666667, "x": "ザ・グレートという冠を付けたのも、ハートです。"}, {"t": 893.35, "x": "一方で、カブキという名前を出し、化粧を描き、\n頭巾と衣装を縫い、ヌンチャクを覚え、"}, {"t": 900.5833333333334, "x": "イメージ映像"}, {"t": 900.5833333333334, "x": "毒霧の吹き方と色を決めたのは、\n本人だったと語られています。"}, {"t": 905.4833333333333, "x": "そして変身したのは、\n初めてアメリカに渡ってから10年"}, {"t": 909.4333333333333, "x": "あまりが経った後のことでした。"}, {"t": 911.15, "x": "東洋の神秘は、ダラスで突然現れたのではなく、\nアメリカ各地を回った10年の"}, {"t": 917.2833333333333, "x": "後に生まれていたことになります。"}, {"t": 919.0333333333333, "x": "イメージ映像"}, {"t": 919.0333333333333, "x": "前座から叩き上げた1人のレスラーが、\n東洋の神秘と呼ばれるまでの10年"}, {"t": 923.9166666666666, "x": "あまりを、今回はたどってきました。"}, {"t": 926.3833333333333, "x": "最後までご覧いただいた皆様に、\n感謝申し上げます。"}, {"t": 930.2333333333333, "x": "毒霧やヌンチャクの記憶がある方は、ぜひ\nコメント欄で教えてください。"}, {"t": 934.9666666666667, "x": "チャンネル登録と高評価もよろしく\nお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
