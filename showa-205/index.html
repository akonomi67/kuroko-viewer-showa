 661.2666666666667, "i": 183}, {"t": 664.1666666666666, "i": 184}, {"t": 668.5833333333334, "i": 185}, {"t": 671.5166666666667, "i": 186}, {"t": 677.8833333333333, "i": 187}, {"t": 679.6, "i": 188}, {"t": 683.7, "i": 189}, {"t": 687.4833333333333, "i": 190}, {"t": 692.4333333333333, "i": 191}, {"t": 696.3833333333333, "i": 192}, {"t": 701.3833333333333, "i": 193}, {"t": 705.7833333333333, "i": 194}, {"t": 709.3166666666667, "i": 195}, {"t": 712.6833333333333, "i": 196}, {"t": 718.6666666666666, "i": 197}], "subs": [{"t": 0.0, "x": "2000年5月13日、午後5時。"}, {"t": 3.1333333333333333, "x": "フィリピンの首都マニラにある病院で、\n1人の日本人が亡くなりました。49歳。"}, {"t": 8.85, "x": "死因は、肝臓移植手術中の大量出血です。"}, {"t": 12.816666666666666, "x": "名前は、鶴田友美。"}, {"t": 14.8, "x": "リングネームは、ジャンボ鶴田。"}, {"t": 17.083333333333332, "x": "全日本プロレスで20年以上エースを務め、\nジャイアント馬場の後継者と呼ばれ続けた選手です。"}, {"t": 23.733333333333334, "x": "その人が、日本ではなくフィリピンの\n手術台の上で亡くなりました。"}, {"t": 28.05, "x": "この結果につながる最初の記録は、\n1985年8月に残っています。"}, {"t": 33.7, "x": "15年前の、1枚の検査結果です。"}, {"t": 36.96666666666667, "x": "今回は、ジャンボ鶴田という選手の\n体に何が起きていたのかを、"}, {"t": 41.28333333333333, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 44.43333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 46.916666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 52.5, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 56.3, "x": "鶴田友美、1951年3月25日の生まれ。"}, {"t": 60.81666666666667, "x": "出身は山梨県です。"}, {"t": 62.733333333333334, "x": "学生時代はバスケットボールをやり、\nその後レスリングに転向しました。"}, {"t": 67.6, "x": "転向してからの上がり方が異常に早い選手です。"}, {"t": 70.76666666666667, "x": "1972年、ミュンヘンオリンピックに\nレスリングの日本代表として出場しています。"}, {"t": 77.06666666666666, "x": "階級はグレコローマンの100キロ超級。"}, {"t": 79.68333333333334, "x": "記録は2戦2敗でした。"}, {"t": 81.43333333333334, "x": "このときの登録は、\n身長193センチ、体重110キロ。"}, {"t": 86.88333333333334, "x": "日本人のレスリング選手として、\n当時としては規格外の体格です。"}, {"t": 91.51666666666667, "x": "オリンピックが終わったあと、\n鶴田はプロレスに入ります。"}, {"t": 95.18333333333334, "x": "声をかけたのは、ジャイアント馬場でした。"}, {"t": 98.06666666666666, "x": "このときの鶴田の言葉が、いまも残っています。"}, {"t": 101.48333333333333, "x": "プロレス界に入るのではなく、\n全日本プロレスに就職します。"}, {"t": 105.83333333333333, "x": "そういう趣旨の言い方をしたと\n伝えられています。"}, {"t": 108.75, "x": "当時のプロレスは、身を投げ出して\n飛び込む世界という扱いでした。"}, {"t": 113.01666666666667, "x": "そこに「就職」という言葉を\n持ち込んだ選手は、それまでいません。"}, {"t": 117.31666666666666, "x": "この一言だけで、この人がどういう\n頭の作りをしていたかが分かります。"}, {"t": 122.06666666666666, "x": "入団は1972年10月、全日本プロレスが\n旗揚げした、まさにその月です。"}, {"t": 128.76666666666668, "x": "つまりこの選手は、全日本プロレスと\n同い年ということになります。"}, {"t": 133.16666666666666, "x": "デビューは1973年3月24日、\nアメリカでした。"}, {"t": 138.15, "x": "修行先はテキサスで、ファンク一家のもとで\n基礎を教わっています。"}, {"t": 142.58333333333334, "x": "日本でのデビューは、同じ年の10月6日です。"}, {"t": 146.11666666666667, "x": "修行の期間は短いものでした。"}, {"t": 148.43333333333334, "x": "普通、日本のプロレスラーは\n若手として何年も下積みをします。"}, {"t": 152.93333333333334, "x": "鶴田の場合は、最初から売り出す\n前提で組まれていました。"}, {"t": 156.86666666666667, "x": "理由は単純です。"}, {"t": 158.36666666666667, "x": "オリンピックに出た日本人で、\n身長196センチ、"}, {"t": 162.3, "x": "体重127キロまで大きくできる\n素材は、他にいませんでした。"}, {"t": 167.48333333333332, "x": "そして期待どおりに伸びます。"}, {"t": 169.21666666666667, "x": "1984年2月23日には、\nAWA世界ヘビー級王座を奪取しました。"}, {"t": 175.93333333333334, "x": "アメリカの主要な世界王座を、\n日本人が海外で巻いたということです。"}, {"t": 180.6, "x": "さらに1989年には、それまで\n別々にあった全日本プロレスの3つの"}, {"t": 186.26666666666668, "x": "王座を統一し、三冠ヘビー級王座の\n最初の王者になっています。"}, {"t": 191.0, "x": "この時期の鶴田は、日本人選手として\n考えうる最高の位置にいました。"}, {"t": 195.71666666666667, "x": "ただし、この選手には\n長く付いて回った評価があります。"}, {"t": 199.93333333333334, "x": "「善戦マン」という呼ばれ方です。"}, {"t": 202.01666666666668, "x": "大きな試合で外国人のトップ選手と\n好勝負をするが、最後のところで勝ち切らない。"}, {"t": 207.61666666666667, "x": "だから物語が盛り上がらない。"}, {"t": 209.6, "x": "そういう批判でした。"}, {"t": 211.06666666666666, "x": "実際には王座も獲っていますし、\n負けが多い選手でもありません。"}, {"t": 215.78333333333333, "x": "それでも、常に安定していて\n崩れないことが、かえって"}, {"t": 219.93333333333334, "x": "物足りなさとして受け取られていました。"}, {"t": 222.08333333333334, "x": "強すぎる選手は、応援されにくい。"}, {"t": 225.01666666666668, "x": "鶴田はずっと、その位置にいました。"}, {"t": 227.68333333333334, "x": "しかし、その翌年です。"}, {"t": 230.05, "x": "1985年8月。"}, {"t": 232.33333333333334, "x": "鶴田がB型肝炎ウイルスの\nキャリアであることが判明します。"}, {"t": 236.2, "x": "キャリアというのは、ウイルスを\n体の中に持っている状態です。"}, {"t": 240.46666666666667, "x": "この時点では、発症していません。"}, {"t": 243.05, "x": "試合もできますし、動きも落ちません。"}, {"t": 246.03333333333333, "x": "ただし、プロレスは体が\nぶつかり、血が出る競技です。"}, {"t": 250.33333333333334, "x": "自分の体調の問題だけでは終わらない\n性質があります。"}, {"t": 253.93333333333334, "x": "この事実を抱えたまま、\n鶴田は現役を続けました。"}, {"t": 257.81666666666666, "x": "ここで、時代の前提を確認しておきます。"}, {"t": 261.0833333333333, "x": "1985年当時、B型肝炎に対する社会の\n理解は、いまとは大きく違いました。"}, {"t": 268.03333333333336, "x": "治療の選択肢も限られています。"}, {"t": 270.35, "x": "そして、感染そのものに\n対する偏見も強い時代でした。"}, {"t": 274.4, "x": "プロレスは、流血する競技です。"}, {"t": 277.0, "x": "選手同士が汗と血の付いた状態で組み合います。"}, {"t": 280.1333333333333, "x": "その競技で、ウイルスを持っていることが\n広く知られたらどうなるか。"}, {"t": 284.6, "x": "本人だけの問題では済まなくなります。"}, {"t": 287.1333333333333, "x": "この時期の記録に、鶴田がこの\n件を公にした形跡はありません。"}, {"t": 291.71666666666664, "x": "そして、試合は続いています。"}, {"t": 294.18333333333334, "x": "その評価が変わったのが、\n1980年代の終わりです。"}, {"t": 298.55, "x": "1980年代後半、鶴田の前に\n立ちはだかったのが天龍源一郎でした。"}, {"t": 304.5, "x": "天龍革命と呼ばれる動きで、鶴田は同じ団体の\n後輩から本気で狙われる立場になります。"}, {"t": 310.73333333333335, "x": "このとき、鶴田は受けて立ちました。"}, {"t": 313.21666666666664, "x": "そして、それまで見せていなかった\n荒い攻撃をするようになります。"}, {"t": 317.53333333333336, "x": "同じ団体の後輩を、容赦なく潰しにいく。"}, {"t": 320.9, "x": "1990年前後の鶴田は、ファンから\n「怪物」と呼ばれるようになりました。"}, {"t": 326.15, "x": "善戦マンと言われていた\n選手が、日本で最も"}, {"t": 329.45, "x": "怖い選手として扱われるようになったのが、\nこの時期です。"}, {"t": 333.1666666666667, "x": "1990年に天龍が退団すると、\n今度は下の世代が上がってきます。"}, {"t": 338.6166666666667, "x": "1990年6月8日、日本武道館。"}, {"t": 342.45, "x": "素顔に戻ったばかりの\n三沢光晴に、鶴田は敗れました。"}, {"t": 346.65, "x": "この試合は、下の世代が初めて壁を\n越えた試合として記録されています。"}, {"t": 351.6, "x": "逆に言えば、鶴田はこの日まで\n「越えられない壁」でした。"}, {"t": 355.3, "x": "その壁が崩れたあとも、\n鶴田はしばらく第一線にいます。"}, {"t": 359.43333333333334, "x": "しかし、体のほうが先に動きました。"}, {"t": 362.56666666666666, "x": "1992年11月、B型肝炎が発症します。"}, {"t": 367.4, "x": "入院は長期になりました。"}, {"t": 369.26666666666665, "x": "ここで、鶴田のプロレスラーとしての\n時間は事実上止まります。"}, {"t": 373.48333333333335, "x": "41歳でした。"}, {"t": 374.98333333333335, "x": "その後は復帰しても、以前と\n同じ位置には戻っていません。"}, {"t": 379.15, "x": "若手の指導や、団体の役員としての\n仕事が中心になっていきます。"}, {"t": 384.0, "x": "1999年2月20日、引退の\n記者会見が開かれました。"}, {"t": 389.23333333333335, "x": "そして1999年3月6日、引退セレモニー。"}, {"t": 393.78333333333336, "x": "同じ年の1月にジャイアント馬場が\n亡くなっています。"}, {"t": 396.95, "x": "全日本プロレスにとって、社長と\nエースを続けて失った年でした。"}, {"t": 401.6, "x": "ここで、引退後の道を確認しておきます。"}, {"t": 404.93333333333334, "x": "1993年、鶴田は一度リングに戻り、同じ\n時期に筑波大学の大学院に入っています。"}, {"t": 412.3333333333333, "x": "プロレスラーをやりながら、\n大学院で学び始めたということです。"}, {"t": 416.7, "x": "そして1999年3月、アメリカの\nポートランド州立大学に客員教授として"}, {"t": 423.21666666666664, "x": "赴任しました。"}, {"t": 424.1333333333333, "x": "指導者やタレントではなく、研究して\n教える側に回ったことになります。"}, {"t": 429.1, "x": "これも、この人らしい選び方でした。"}, {"t": 431.93333333333334, "x": "プロレスに就職した人が、次の就職先として\n大学を選んだ、という言い方もできます。"}, {"t": 438.23333333333335, "x": "しかし、その赴任は1年もちませんでした。"}, {"t": 441.6666666666667, "x": "1999年の暮れ、肝臓の\n状態が悪化して帰国します。"}, {"t": 446.68333333333334, "x": "2000年4月11日まで、岐阜県内の\n病院で治療を受けていました。"}, {"t": 451.6333333333333, "x": "そこからオーストラリアの\nブリスベンにある病院へ移り、さらに"}, {"t": 455.73333333333335, "x": "フィリピンのマニラへ移っています。"}, {"t": 457.6666666666667, "x": "半年のあいだに、日本、オーストラリア、\nフィリピンと病院を移ったことになります。"}, {"t": 464.01666666666665, "x": "そしてマニラで、肝臓移植の手術を受けました。"}, {"t": 467.45, "x": "2000年5月13日、\n手術中に大量出血が起きます。"}, {"t": 472.1166666666667, "x": "通常の倍の量の輸血を受けましたが、\n容体は戻りませんでした。"}, {"t": 476.7, "x": "49歳でした。"}, {"t": 478.23333333333335, "x": "訃報の伝わり方も、普通ではありませんでした。"}, {"t": 481.65, "x": "5月14日の午後から、鶴田が\n亡くなったらしいという話が流れます。"}, {"t": 486.55, "x": "しかし確かな情報が無く、各社は\n確認が取れないまま動けませんでした。"}, {"t": 491.65, "x": "遺族から連絡が入って事実が\n確認されたのは、5月16日の未明です。"}, {"t": 497.01666666666665, "x": "遺体が成田空港に着いたのは\n5月17日の夜でした。"}, {"t": 500.8, "x": "報道陣がおよそ50人集まり、その\n場で遺族を守って車まで先導したのが、"}, {"t": 506.46666666666664, "x": "当時全日本プロレスの社長だった三沢光晴です。"}, {"t": 510.1166666666667, "x": "ここまでが、記録に残っている事実です。"}, {"t": 513.1666666666666, "x": "ここで、当時の事情を\n確認しておく必要があります。"}, {"t": 517.0166666666667, "x": "なぜ、日本ではなくフィリピンだったのか。"}, {"t": 520.05, "x": "2000年前後の日本は、臓器移植が\nほとんど行われていない国でした。"}, {"t": 525.05, "x": "法律が整ったのは1997年です。"}, {"t": 528.4833333333333, "x": "それ以前には、脳死からの臓器提供と\nいう枠組み自体がありませんでした。"}, {"t": 533.4833333333333, "x": "法律ができたあとも、実際の件数は\n極めて少ない状態が続いています。"}, {"t": 538.8333333333334, "x": "成人が肝臓の移植を待つ場合、日本国内で\n順番が回ってくることを前提に計画を"}, {"t": 544.95, "x": "立てるのは、現実的ではありませんでした。"}, {"t": 547.85, "x": "そのため当時、移植を必要とする\n日本人が海外に渡る例がありました。"}, {"t": 552.9833333333333, "x": "鶴田の場合も、その1つです。"}, {"t": 555.4166666666666, "x": "つまりこれは、個人の思いつきというより、\n当時の日本の医療の枠組みが背景にある話でした。"}, {"t": 562.1, "x": "そして、海外での移植には\n別の問題もありました。"}, {"t": 565.8833333333333, "x": "渡航先の医療体制、術後の管理、言葉。"}, {"t": 569.8, "x": "条件が揃わないまま手術に臨むことになります。"}, {"t": 572.9666666666667, "x": "鶴田は手術中に亡くなりました。"}, {"t": 575.0666666666667, "x": "移植を待つ間に亡くなったのではなく、\n手術の最中に亡くなっています。"}, {"t": 579.8666666666667, "x": "記録としては、そこまでです。"}, {"t": 582.0833333333334, "x": "もう1つ、この人の人生を\n眺めたときに気づくことがあります。"}, {"t": 586.4666666666667, "x": "鶴田は、1985年8月の検査結果を抱えた\nまま、7年間リングに上がり続けました。"}, {"t": 593.8666666666667, "x": "発症したのが1992年11月ですから、\nその間はキャリアの状態です。"}, {"t": 599.8, "x": "その7年は、天龍革命の時期と重なります。"}, {"t": 603.5, "x": "全日本プロレスが、外国人中心の\n興行から日本人同士の"}, {"t": 608.1333333333333, "x": "激しい試合へと変わっていった時期です。"}, {"t": 610.5, "x": "その中心で受け続けたのが鶴田でした。"}, {"t": 613.2, "x": "体の中に問題を抱えている状態で、\n最も激しい試合を最も多く受けていた。"}, {"t": 619.15, "x": "記録を並べると、そういうことになります。"}, {"t": 622.1166666666667, "x": "ジャンボ鶴田という選手は、生前から「強すぎて\n物語が作りにくい選手」と言われてきました。"}, {"t": 628.1666666666666, "x": "崩れないので、ドラマが\n起きないという意味です。"}, {"t": 631.2833333333333, "x": "しかし、崩れないように見えていた7年間の\n裏に、1985年8月の検査結果がありました。"}, {"t": 638.8333333333334, "x": "物語が無かったのではありません。"}, {"t": 641.0333333333333, "x": "外に出していなかっただけだった、と\nいうことなのではないでしょうか。"}, {"t": 645.3166666666667, "x": "1972年のミュンヘンから、\n2000年のマニラまで、28年。"}, {"t": 650.8666666666667, "x": "その大半を、この人は日本のプロレスで\n最も丈夫な体として扱われ続けました。"}, {"t": 656.4833333333333, "x": "全日本プロレスと同じ月に入り、\n団体のエースを20年務め、"}, {"t": 661.2666666666667, "x": "社長が亡くなった翌年に亡くなっています。"}, {"t": 664.1666666666666, "x": "ジャイアント馬場の死が1999年1月31日。"}, {"t": 668.5833333333334, "x": "ジャンボ鶴田の死が2000年5月13日。"}, {"t": 671.5166666666667, "x": "1年4か月のあいだに、団体を作った\n人と、その団体が最初に作った看板が、"}, {"t": 677.8833333333333, "x": "続けていなくなりました。"}, {"t": 679.6, "x": "1990年代の全日本プロレスを\n支えた四天王は、"}, {"t": 683.7, "x": "その2人がいなくなったあとの\n団体を引き継ぐことになります。"}, {"t": 687.4833333333333, "x": "2000年6月13日、\n三沢光晴が全日本プロレスの退団を"}, {"t": 692.4333333333333, "x": "発表するのは、鶴田の死から\nちょうど1か月後のことでした。"}, {"t": 696.3833333333333, "x": "成田で遺族を守った社長が、その\n1か月後に会社を出たことになります。"}, {"t": 701.3833333333333, "x": "今回の物語を通して、皆様の\n中にジャンボ鶴田という1人の"}, {"t": 705.7833333333333, "x": "プロレスラーの新しい一面が\n刻まれていれば幸いです。"}, {"t": 709.3166666666667, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 712.6833333333333, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 198};

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
