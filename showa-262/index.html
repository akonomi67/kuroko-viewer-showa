<style>

<script>
const D={"name": "マイティ井上", "file": "262_編集用", "dur": 845.6, "segs": [], "subs": [{"t": 0.0, "x": "2010年5月22日、東京の後楽園ホール。"}, {"t": 4.25, "x": "プロレスリング・ノアの大会です。"}, {"t": 6.2, "x": "この日、1人のレフェリーが\n最後の試合を裁きました。"}, {"t": 9.85, "x": "客席からは、マイティの声が何度も上がりました。"}, {"t": 13.283333333333333, "x": "試合のあと、レフェリーは\n選手たちに胴上げされます。"}, {"t": 17.033333333333335, "x": "名前はマイティ井上。"}, {"t": 18.7, "x": "61歳でした。"}, {"t": 20.2, "x": "井上は、もとはレスラーです。"}, {"t": 22.5, "x": "デビューした団体は、\nこの日にはもうありませんでした。"}, {"t": 26.133333333333333, "x": "国際プロレスです。"}, {"t": 27.516666666666666, "x": "1981年8月、国際プロレスは\n最後の興行を終えて消えました。"}, {"t": 33.28333333333333, "x": "井上はその最後の日まで、\nリングに上がっていた1人です。"}, {"t": 37.18333333333333, "x": "そして2024年11月27日。"}, {"t": 40.28333333333333, "x": "井上は75歳で亡くなりました。"}, {"t": 42.71666666666667, "x": "死因は心室細動と伝えられています。"}, {"t": 45.6, "x": "デビューした団体が消えたあと、\n井上はどうやって29年も"}, {"t": 50.03333333333333, "x": "リングに残ったのでしょうか？"}, {"t": 51.68333333333333, "x": "今回はマイティ井上という1人の\nプロレスラーの歩みを追います。"}, {"t": 55.56666666666667, "x": "具体的な日付と本人の\n言葉をもとに辿っていきます。"}, {"t": 59.03333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 61.53333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 67.11666666666666, "x": "本名は井上末雄。"}, {"t": 68.75, "x": "1949年4月12日、大阪市の生まれです。"}, {"t": 73.35, "x": "子どものころ、井上は大阪でプロレスを見ました。"}, {"t": 76.75, "x": "力道山とシャープ兄弟の試合です。"}, {"t": 79.21666666666667, "x": "この試合でプロレスラーに憧れたと、\n東京スポーツは伝えています。"}, {"t": 83.8, "x": "中学生のとき、井上は入門を願い出ました。"}, {"t": 87.36666666666666, "x": "行き先は力道山の日本プロレスです。"}, {"t": 89.91666666666667, "x": "応対したのは吉村道明でした。"}, {"t": 92.33333333333333, "x": "答えは、高校生になったら来て、というものです。"}, {"t": 96.33333333333333, "x": "この日の入門は叶いませんでした。"}, {"t": 98.63333333333334, "x": "高校に進んだ井上は、柔道に打ち込みます。"}, {"t": 102.18333333333334, "x": "ボディビルでも体を鍛えました。"}, {"t": 104.21666666666667, "x": "通っていたジムの会長は、\n国際プロレスと縁のある人でした。"}, {"t": 108.5, "x": "その縁で、井上は高校2年で上京します。"}, {"t": 112.26666666666667, "x": "入ったのは日本プロレスではありません。"}, {"t": 114.75, "x": "国際プロレスでした。"}, {"t": 116.21666666666667, "x": "1967年7月21日、名古屋市の金山体育館。"}, {"t": 121.73333333333333, "x": "井上はここでデビューしました。"}, {"t": 123.68333333333334, "x": "まだ18歳です。"}, {"t": 125.13333333333334, "x": "国際プロレスが旗揚げしてから、\n1年もたっていない時期でした。"}, {"t": 129.45, "x": "この写真は1968年4月、\n羽田空港で撮られたものです。"}, {"t": 134.71666666666667, "x": "初めて日本に来た\nビル・ロビンソンが写っています。"}, {"t": 137.71666666666667, "x": "担ぎ上げられているのが、若手の井上です。"}, {"t": 140.86666666666667, "x": "1970年、井上は海を渡りました。"}, {"t": 144.66666666666666, "x": "行き先はヨーロッパです。"}, {"t": 146.3, "x": "デイリースポーツの記事では、\n武者修行は1972年まで続きました。"}, {"t": 151.56666666666666, "x": "フランスにいたとき、\n井上は1人の大男と知り合います。"}, {"t": 155.55, "x": "アンドレ・ザ・ジャイアントです。"}, {"t": 157.16666666666666, "x": "2人はのちに親友と呼ばれる仲になりました。"}, {"t": 160.0, "x": "この写真は1970年、\n国際プロレスのリングです。"}, {"t": 164.48333333333332, "x": "アンドレと向き合っているのが井上です。"}, {"t": 166.86666666666667, "x": "アンドレはこの年に初めて日本に来ました。"}, {"t": 169.58333333333334, "x": "見いだしたのは、国際プロレスの吉原功社長です。"}, {"t": 173.43333333333334, "x": "その招きに井上が力を尽くしたと、\n東京スポーツは書いています。"}, {"t": 178.08333333333334, "x": "ヨーロッパから戻った井上は、\n覚えた技をリングで見せます。"}, {"t": 182.2, "x": "人気は、団体のエース級の\n選手と並ぶほどになりました。"}, {"t": 186.26666666666668, "x": "スポルティーバの記事は、そう書いています。"}, {"t": 189.16666666666666, "x": "必殺技はサマーソルト・ドロップでした。"}, {"t": 191.66666666666666, "x": "大きく跳んでぶつかる技も得意です。"}, {"t": 194.08333333333334, "x": "フライング・ショルダー・アタックといいます。"}, {"t": 196.33333333333334, "x": "異名は和製マットの魔術師でした。"}, {"t": 198.68333333333334, "x": "体は175センチ、105キロ。"}, {"t": 201.81666666666666, "x": "国際プロレスの中では、\n大きな選手ではありません。"}, {"t": 205.58333333333334, "x": "社長の吉原は、こう話していたといいます。"}, {"t": 208.9, "x": "井上と浜口に、あと10センチ背があればと。"}, {"t": 212.2, "x": "その浜口とは、アニマル浜口のことです。"}, {"t": 215.45, "x": "浜口は井上の強さをこう話しています。"}, {"t": 218.3, "x": "「柔道をされていたから、受け身ができて、\n関節・絞め技がうまい。」井上は"}, {"t": 223.9, "x": "ベンチプレスで200キロを挙げていました。"}, {"t": 226.2, "x": "同じ重さを挙げていたのは、\nラッシャー木村です。"}, {"t": 229.53333333333333, "x": "これも浜口の証言です。"}, {"t": 231.45, "x": "浜口は、井上を見ていて伝わってきたことも\n話しています。"}, {"t": 235.53333333333333, "x": "プロレスが好きで、好きでたまらない。"}, {"t": 238.03333333333333, "x": "それが浜口の言葉でした。"}, {"t": 239.95, "x": "1974年、国際プロレスの\n顔ぶれが変わりました。"}, {"t": 244.43333333333334, "x": "エースだったストロング小林が\n団体を離れたのです。"}, {"t": 247.71666666666667, "x": "移った先は新日本プロレスでした。"}, {"t": 250.16666666666666, "x": "この時代について、\n井上はのちにこう語っています。"}, {"t": 253.88333333333333, "x": "「新日本プロレスは\n信用できなかった。」"}, {"t": 256.3833333333333, "x": "「国際は全部、アントニオ猪木と\n新日本にいいところを持っていかれた。"}, {"t": 261.43333333333334, "x": "いわば踏み台にされたわけだ」"}, {"t": 263.26666666666665, "x": "同じ年の9月、1人の\nアメリカ人が初めて日本に来ます。"}, {"t": 267.48333333333335, "x": "スーパースター・ビリー・グラハムです。"}, {"t": 269.55, "x": "その1か月ほど前に、\nグラハムは王座を奪っていました。"}, {"t": 273.55, "x": "ビル・ロビンソンから取った\nIWA世界ヘビー級王座です。"}, {"t": 277.4, "x": "日本での最初の試合は9月15日、後楽園ホール。"}, {"t": 281.76666666666665, "x": "相手は若手のアニマル浜口でした。"}, {"t": 284.1666666666667, "x": "このシリーズから、\n国際プロレスの中継も始まりました。"}, {"t": 288.01666666666665, "x": "局は東京12チャンネルです。"}, {"t": 290.1333333333333, "x": "グラハムは入場のときに曲を流しました。"}, {"t": 292.9166666666667, "x": "ミュージカルの\nジーザス・クライスト・スーパースターの曲です。"}, {"t": 296.18333333333334, "x": "リングネームも、\nこのミュージカルから取られていました。"}, {"t": 299.56666666666666, "x": "日本で入場テーマ曲を使った草分けだと、\n東京スポーツは書いています。"}, {"t": 304.71666666666664, "x": "1974年10月7日、埼玉の越谷市体育館。"}, {"t": 309.55, "x": "井上はそのグラハムと戦いました。"}, {"t": 311.85, "x": "懸かっていたのはIWA世界ヘビー級王座です。"}, {"t": 315.26666666666665, "x": "国際プロレスの看板のベルトでした。"}, {"t": 317.65, "x": "井上はグラハムを破り、\n第9代の王者になります。"}, {"t": 321.6666666666667, "x": "25歳でした。"}, {"t": 322.96666666666664, "x": "当時の国際プロレスを\n担当した東京スポーツの元記者がいます。"}, {"t": 327.03333333333336, "x": "その元記者は、井上を\n小さな実力者と振り返りました。"}, {"t": 331.18333333333334, "x": "体格で劣りながら、若い\nエースとして奮闘したという評価です。"}, {"t": 335.68333333333334, "x": "同じ年の11月21日、大阪府立体育館。"}, {"t": 340.0, "x": "相手はAWA世界ヘビー級王者の\nバーン・ガニアでした。"}, {"t": 343.85, "x": "2本のベルトを同時に懸けた試合です。"}, {"t": 346.31666666666666, "x": "結果は引き分けでした。"}, {"t": 347.85, "x": "井上もガニアも、自分のベルトを守っています。"}, {"t": 351.3, "x": "ただ、王者の時間は長くありませんでした。"}, {"t": 354.53333333333336, "x": "1975年4月10日、東京の足立区体育館。"}, {"t": 359.0833333333333, "x": "井上はマッドドッグ・バションに敗れます。"}, {"t": 361.6333333333333, "x": "王座を失ったのは、\n獲得から半年ほどのことでした。"}, {"t": 365.46666666666664, "x": "このあと井上が口にした言葉が残っています。"}, {"t": 368.43333333333334, "x": "「はっきり言って、せいせいしたね。」\n「これで肩の荷が降りた。"}, {"t": 372.48333333333335, "x": "伸び伸びプロレスができるよ」"}, {"t": 374.21666666666664, "x": "その9日後の4月19日、\n札幌中島スポーツセンター。"}, {"t": 378.98333333333335, "x": "金網デスマッチで、ラッシャー木村が\nバションを破りました。"}, {"t": 382.9166666666667, "x": "決め技は逆エビ固めです。"}, {"t": 384.93333333333334, "x": "国際プロレスの看板のベルトは、\n木村に移りました。"}, {"t": 388.6666666666667, "x": "このあと井上は、木村に何度も挑みます。"}, {"t": 391.8, "x": "相手は同じ団体の王者です。"}, {"t": 393.8833333333333, "x": "その姿は、多くのファンに支持されました。"}, {"t": 397.01666666666665, "x": "王座を離れた井上は、タッグで結果を残します。"}, {"t": 400.85, "x": "グレート草津と組んで、\nIWA世界タッグ王座を取りました。"}, {"t": 405.3, "x": "アニマル浜口とも組んでいます。"}, {"t": 407.4, "x": "この2人の組は、\n和製ハイ・フライヤーズと呼ばれました。"}, {"t": 411.1, "x": "1977年11月6日、後楽園ホール。"}, {"t": 415.51666666666665, "x": "相手は全日本から来ていた\nグレート小鹿と大熊元司です。"}, {"t": 419.28333333333336, "x": "井上と浜口の組は、\nアジアタッグ王座を奪いました。"}, {"t": 423.3333333333333, "x": "1979年2月23日、千葉公園体育館。"}, {"t": 428.31666666666666, "x": "2人は新日本の山本小鉄と\n星野勘太郎の組と戦いました。"}, {"t": 432.48333333333335, "x": "奪われていたIWA世界タッグ王座を、\nここで取り返します。"}, {"t": 437.0, "x": "ベルトは、浜口と草津の\n組が失っていたものでした。"}, {"t": 440.8, "x": "2人はIWA世界タッグ王座を\n2度手にしています。"}, {"t": 444.3666666666667, "x": "防衛は通算16度でした。"}, {"t": 446.46666666666664, "x": "この王座の最多の記録です。"}, {"t": 448.3666666666667, "x": "井上はのちに、こう話しています。"}, {"t": 450.98333333333335, "x": "「タッグパートナーとして\nベストはアニマル浜口。」"}, {"t": 453.75, "x": "「彼は俺と同じでガンガンいくから、\n組んでいてやりやすかったよね」"}, {"t": 458.56666666666666, "x": "国際プロレスの名物は、金網デスマッチでした。"}, {"t": 462.18333333333334, "x": "その金網について、井上はこう振り返っています。"}, {"t": 466.03333333333336, "x": "「貧乏団体が生き残るためには、\n金網デスマッチを毎日やるしかないとなれば、"}, {"t": 471.2, "x": "木村さんだけに任せちゃおれんということで、\nみんな交代でケージに入りましたよ。」"}, {"t": 476.55, "x": "1981年8月9日、\n北海道の羅臼小学校のグラウンド。"}, {"t": 482.1166666666667, "x": "ここが国際プロレスの最後の興行になりました。"}, {"t": 485.2, "x": "このとき浜口は、長く欠場していました。"}, {"t": 488.3666666666667, "x": "井上は浜口の代わりに木村と組みます。"}, {"t": 491.1, "x": "出たのはセミファイナルでし const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
