<script>
const D={"name": "猪木の死", "file": "228_編集用", "dur": 915.4833125, "segs": [], "subs": [{"t": 0.0, "x": "2022年10月1日、午前7時40分。"}, {"t": 4.333333333333333, "x": "東京都港区の自宅で、\n1人の男が息を引き取りました。"}, {"t": 8.5, "x": "アントニオ猪木、79歳。"}, {"t": 11.2, "x": "死因は心不全でした。"}, {"t": 13.05, "x": "その10日前にあたる9月21日、\n猪木はベッドの上でカメラを回させています。"}, {"t": 18.733333333333334, "x": "自分の力では上体を起こすことができず、\n人に助け上げられてようやく体を"}, {"t": 24.05, "x": "起こした状態でした。"}, {"t": 25.333333333333332, "x": "その映像の中で、猪木はこう言っています。"}, {"t": 28.583333333333332, "x": "「だいたい見せたくないでしょう、\nこんなザマを」そう言いながら、"}, {"t": 32.1, "x": "撮影は最後まで止めさせませんでした。"}, {"t": 35.0, "x": "この映像は、猪木が亡くなった\nその日のうちに公開されています。"}, {"t": 39.333333333333336, "x": "なぜ猪木は、いちばん見せたくないはずの姿を、\n死ぬ直前まで人前に出し続けたのでしょうか。"}, {"t": 45.95, "x": "今回は、猪木が自分の病名を\n公表した2021年11月27日から、"}, {"t": 52.13333333333333, "x": "亡くなったあとに起きたことまでを、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 57.56666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 60.06666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 65.65, "x": "まず、体の記録から確認しておきます。"}, {"t": 68.96666666666667, "x": "猪木の体に最初の異常が出たのは、\n現役の真っ只中でした。"}, {"t": 73.35, "x": "1982年8月、糖尿病が判明します。"}, {"t": 77.88333333333334, "x": "血糖値は通常の5倍という検査結果でした。"}, {"t": 81.03333333333333, "x": "体がだるく、思うように\n動かせなくなっていたと本人が語っています。"}, {"t": 85.9, "x": "現役を引退したのは1998年4月4日です。"}, {"t": 90.11666666666666, "x": "その後は団体の運営と政治活動を続け、\n2019年6月5日に参議院選挙への"}, {"t": 96.48333333333333, "x": "不出馬を表明して政界を離れました。"}, {"t": 99.0, "x": "リングに立つ人間としての最後の記録は、\n2020年2月28日です。"}, {"t": 104.41666666666667, "x": "この日、プロレスリング・マスターズの\n全試合終了後に"}, {"t": 107.9, "x": "『燃える闘魂60周年メモリアルセレモニー』が\n行われました。"}, {"t": 111.68333333333334, "x": "猪木は挨拶でこう話しています。"}, {"t": 113.81666666666666, "x": "「本当は去年2か月半入院して、もう\nどうしようかなと思っている時に」"}, {"t": 118.6, "x": "「これに出会い、新たな闘魂に火が付きました」\nその後、長州力が武藤敬司を"}, {"t": 124.06666666666666, "x": "羽交い絞めにしたところへ闘魂ビンタを見舞い、\n続いて蝶野正洋にも見舞いました。"}, {"t": 129.18333333333334, "x": "観客からは長州コールが起こり、さらに\n前田コールも起こりました。"}, {"t": 133.76666666666668, "x": "猪木は「前田もやるのか。"}, {"t": 135.4, "x": "変わったな」と笑い、\nこの日4度目の闘魂注入を行っています。"}, {"t": 139.93333333333334, "x": "これが猪木の最後のリングになりました。"}, {"t": 142.26666666666668, "x": "もう歩くのも大変そうだったと、\n武藤は後に語っています。"}, {"t": 146.33333333333334, "x": "その2週間前にあたる2020年2月14日、\n猪木は1つのチャンネルを開設しています。"}, {"t": 152.95, "x": "YouTubeの「アントニオ猪木\n『最後の闘魂』」です。"}, {"t": 155.86666666666667, "x": "ここから、猪木は自分の体の\n状態を自分で発信し始めます。"}, {"t": 160.63333333333333, "x": "2020年7月26日、\n猪木は自身のツイッターで、難病の"}, {"t": 166.05, "x": "「心アミロイドーシス」にかかっていることを\n告白しました。"}, {"t": 169.13333333333333, "x": "同じ年の12月28日、\n青森で療養していた最中に腰痛が出て、"}, {"t": 174.61666666666667, "x": "敗血症で緊急搬送されます。"}, {"t": 177.28333333333333, "x": "ここから入退院を繰り返すことになりました。"}, {"t": 180.16666666666666, "x": "2021年1月からは腰の\n治療でも入院しています。"}, {"t": 184.25, "x": "同じ年の3月には、リハビリをしている自分の\n姿をYouTubeで公開しました。"}, {"t": 189.71666666666667, "x": "5月の中旬には腸捻転で手術を受けています。"}, {"t": 193.11666666666667, "x": "術後はおよそ2週間、\n食事をとることができませんでした。"}, {"t": 197.26666666666668, "x": "このときも猪木は自分で動画を出しています。"}, {"t": 200.01666666666668, "x": "「腸が剥がれちゃったみたいで、\nまた再入院してます」そう報告する映像でした。"}, {"t": 205.18333333333334, "x": "体重が大きく落ちたことは当時から\n報じられていますが、具体的な数字が記録に"}, {"t": 210.5, "x": "残っているものは確認できていません。"}, {"t": 212.78333333333333, "x": "そして2021年11月27日を迎えます。"}, {"t": 216.66666666666666, "x": "この日の午後8時30分から10時まで、\nNHK BSプレミアムで1本の"}, {"t": 222.23333333333332, "x": "ドキュメンタリーが放送されました。"}, {"t": 224.21666666666667, "x": "題名は『燃える闘魂 ラストスタンド 〜\nアントニオ猪木 病床からのメッセージ〜』です。"}, {"t": 231.81666666666666, "x": "猪木の闘病を\n9か月間にわたって追いかけた番組でした。"}, {"t": 235.56666666666666, "x": "この中で猪木は、正式な病名を初めて明かします。"}, {"t": 239.6, "x": "正しい病名は、それまで公表されていた\n「心アミロイドーシス」ではなく"}, {"t": 244.2, "x": "「全身性トランスサイレチンアミロイドーシス」。"}, {"t": 246.83333333333334, "x": "アミロイドという物質が心臓を含む全身に\nたまり、血液の循環が悪くなる病気です。"}, {"t": 252.93333333333334, "x": "この番組を作ったのはKENSO、\n本名を鈴木健三という人物でした。"}, {"t": 258.6666666666667, "x": "共同テレビに所属するプロデューサーであり、\n同時に現役のプロレスラーで、"}, {"t": 263.6333333333333, "x": "猪木の弟子にあたります。"}, {"t": 265.48333333333335, "x": "外部から持ち込まれた企画をNHKが受けるのは\n極めて異例だったと記録されています。"}, {"t": 270.8666666666667, "x": "番組には、リハビリの様子も、\n緊急入院の場面も、そのまま映されました。"}, {"t": 276.98333333333335, "x": "猪木自身が、この映像に\nついて番組の中でこう語っています。"}, {"t": 281.55, "x": "「本当はこう\nいう映像は見せたくなかったんですけど」"}, {"t": 284.5, "x": "「これもひとつの、\n強いイメージばっかりじゃなくて」"}, {"t": 287.35, "x": "「こんなにもろい、弱い」\n「どうとるかは知りませんよ、見た人たちが」"}, {"t": 291.8333333333333, "x": "「そういうひとりの\n人間として弱い面があってもいいかなと。"}, {"t": 295.1666666666667, "x": "あえて見てもらって」制作側には、\n猪木が「いいから全部撮れ」と"}, {"t": 299.1666666666667, "x": "言っていたという記録が残っています。"}, {"t": 301.26666666666665, "x": "放送は大きな反響を呼び、\n翌2022年3月2日には45分に"}, {"t": 306.78333333333336, "x": "編集した版がNHK総合でも放送されました。"}, {"t": 310.21666666666664, "x": "2022年の記録を追っていきます。"}, {"t": 312.81666666666666, "x": "3月1日、新日本プロレスが日本武道館で\n旗揚げ50周年の大会を開きました。"}, {"t": 319.25, "x": "猪木が作った団体の50年の節目でしたが、\n猪木本人は会場に来ていません。"}, {"t": 324.98333333333335, "x": "2月20日の札幌大会で、オカダ・カズチカが\n猪木の新日本登場を熱望する発言をしています。"}, {"t": 331.71666666666664, "x": "藤波辰爾は「猪木さんには次回\n必ず来てもらいましょう」と話し、"}, {"t": 335.55, "x": "大会を「1、2、3、ダー」で締めました。"}, {"t": 340.6333333333333, "x": "5月22日、猪木は青森県十和田市の蔦温泉に、\n自分でデザインした「アントニオ猪木家の墓」を"}, {"t": 347.78333333333336, "x": "建てて建立式を行いました。"}, {"t": 349.65, "x": "2019年に亡くなった妻の\n納骨もこの日に行っています。"}, {"t": 353.71666666666664, "x": "自由に体が動かない状態での式でした。"}, {"t": 356.5833333333333, "x": "8月26日、専属のマネジメント会社\n「株式会社猪木元気工場」が設立され、"}, {"t": 362.75, "x": "猪木は顧問に就任します。"}, {"t": 365.05, "x": "8月28日、日本テレビの\n『24時間テレビ45』に出演しました。"}, {"t": 370.53333333333336, "x": "車椅子に乗り、両国国技館に姿を現しています。"}, {"t": 374.65, "x": "かつて日本テレビでプロレス中継の\n実況を担当していた徳光和夫と、"}, {"t": 379.1333333333333, "x": "その場でやりとりを行いました。"}, {"t": 381.31666666666666, "x": "猪木はまず「元気ですかー。"}, {"t": 383.0833333333333, "x": "元気があればなんでもできる」と声を出します。"}, {"t": 385.76666666666665, "x": "そのうえで、こう話しました。"}, {"t": 388.01666666666665, "x": "「見た通りで、必死に頑張っています」\n「本当はもう起きれる状態ではないのですが」"}, {"t": 392.95, "x": "「こうやって皆さんにお会いすることで\n元気をもらいます」最後に、引退試合でも"}, {"t": 397.71666666666664, "x": "読んだ詩『道』を朗読しています。"}, {"t": 399.51666666666665, "x": "「この道を行けばどうなるものか。"}, {"t": 401.46666666666664, "x": "危ぶむなかれ、危ぶめば道はなし」これが\n猪木の生前最後のテレビ出演になりました。"}, {"t": 407.21666666666664, "x": "9月1日付で、猪木は新日本プロレスの\n終身名誉会長に就任しています。"}, {"t": 413.05, "x": "ただし、この就任が発表されたのは\n死後の10月4日でした。"}, {"t": 417.7, "x": "新日本プロレスは10月10日の両国国技館大会で\n発表する予定だったと説明しています。"}, {"t": 423.8666666666667, "x": "9月21日、YouTube用の\n映像が自宅で撮影されました。"}, {"t": 428.5833333333333, "x": "のちに『アントニオ猪木\n「最期の言葉」』として公開されるものです。"}, {"t": 432.28333333333336, "x": "猪木はベッドに横たわったまま、\n滑舌もはっきりしない状態で言葉を続けています。"}, {"t": 437.9166666666667, "x": "「毎日毎日この3年近く天井を\n見上げて、話し相手もいない」なぜ"}, {"t": 442.6333333333333, "x": "YouTubeをやるのかと\n問われると、こう答えました。"}, {"t": 445.81666666666666, "x": "「別にやりたくないよ。"}, {"t": 447.21666666666664, "x": "やりたくないけどみんなやれば\nいいじゃん」そして、"}, {"t": 449.7, "x": "冒頭に挙げた言葉が出ます。"}, {"t": 451.8833333333333, "x": "「だいたい見せたくないでしょう、\nこんなザマを」声が出しづらくなっていることに"}, {"t": 456.2, "x": "ついては、こう言っています。"}, {"t": 458.25, "x": "「この声が一番俺の敵なの」\nそのすぐあとに、こう続けました。"}, {"t": 462.4166666666667, "x": "「でも敵がいる限りいいじゃないですか」"}, {"t": 464.6, "x": "9月の後半に入り、体調は急速に悪化します。"}, {"t": 468.6166666666667, "x": "一時は危篤状態にも陥りました。"}, {"t": 471.05, "x": "自宅では24時間の看護体制が組まれています。"}, {"t": 474.45, "x": "医師からは事前に、こう説明があったと\n関係者が伝えています。"}, {"t": 478.8, "x": "「その日は明日かもしれないし、\n2日後かもしれない」"}, {"t": 482.23333333333335, "x": "「1か月後かもしれないし、\n2年後かもしれない」"}, {"t": 485.5833333333333, "x": "9月30日の夜、猪木は近所に\n住んでいた弟の啓介を自室に呼びました。"}, {"t": 491.15, "x": "啓介は当時の様子をこう話しています。"}, {"t": 493.9, "x": "「昨日の夜呼ばれて、部屋に来いと。"}, {"t": 496.55, "x": "ドアを閉めろと」\n「話をするのかと思ったんですが」"}, {"t": 499.25, "x": "「口は動いていたんですが、\n何を言っているのか分からなかったですね」"}, {"t": 503.4, "x": "「40分くらい一緒に部屋にいて」\nその後、猪木は眠りにつきました。"}, {"t": 507.78333333333336, "x": "猪木が最後に口にしたのは\nアイスの「ガリガリ君 ソーダ味」"}, {"t": 511.65, "x": "だったと、関係者が伝えています。"}, {"t": 514.0833333333334, "x": "毎食後に食べていたということです。"}, {"t": 516.2166666666667, "x": "10月1日の早朝、猪木は目を覚ましましたが、\nそこで容体が急変しました。"}, {"t": 522.2, "x": "午前7時40分、東京都港区の\n自宅で息を引き取ります。"}, {"t": 526.8666666666667, "x": "全身性トランスサイレチンアミロイドーシスによる\n心不全が、死因でした。"}, {"t": 532.0, "x": "看取ったのは、弟の啓介と、\n24時間の看護を続けていたスタッフです。"}, {"t": 537.6333333333333, "x": "啓介は「そのまま寝て、また今日元気になるかなと\n思ってたんですが」と話し、"}, {"t": 542.5166666666667, "x": "「苦しまずに逝ったと思います」と述べています。"}, {"t": 545.5333333333333, "x": "そしてこの日、\nYouTubeチャンネルが更新されました。"}, {"t": 549.1166666666667, "x": "9月21日に撮影された\n『アントニオ猪木「最期の言葉」』が、"}, {"t": 553.0833333333334, "x": "亡くなったその日のうちに公開されます。"}, {"t": 555.8666666666667, "x": "この動画は10月3日の午後までに\n570万回再生を超えました。"}, {"t": 560.6666666666666, "x": "10月6日には、同じ日に撮影された\nおよそ12分の続編も公開されています。"}, {"t": 566.5333333333333, "x": "10月17日には、通夜と\n告別式の映像まで公開されました。"}, {"t": 571.45, "x": "自分の死の前後に撮られた映像が、\n本人のチャンネルから順番に"}, {"t": 575.9, "x": "出ていったことになります。"}, {"t": 577.2666666666667, "x": "訃報を聞いて弔問に訪れた人物も\n記録に残っています。"}, {"t": 581.1666666666666, "x": "古舘伊知郎、舟橋慶一、坂口征二、\n木戸修、ケンドー・カシン。"}, {"t": 587.8666666666667, "x": "佐々木健介と北斗晶の夫妻、\n藤田和之、小川直也、髙田延彦。"}, {"t": 593.8833333333333, "x": "長州力、藤波辰爾らの名前が挙がっています。"}, {"t": 597.5166666666667, "x": "葬儀は家族葬として行われました。"}, {"t": 600.0166666666667, "x": "兄と長女が海外に住んでいたため、\n遺体は10月2日にいったん都内の"}, {"t": 604.9, "x": "安置所へ移されています。"}, {"t": 606.4166666666666, "x": "喪主は弟の啓介が務めました。"}, {"t": 608.7833333333333, "x": "10月13日の通夜には、\n家族葬としながら333人が参列しています。"}, {"t": 614.7666666666667, "x": "翌14日、桐ヶ谷斎場での\n告別式には358人が参列しました。"}, {"t": 620.8, "x": "戒名は「闘覚院機魂寛道居士」です。"}, {"t": 623.5666666666667, "x": "代名詞だった「闘魂」、本名の\n「寛至」、そして引退試合で読んだ詩"}, {"t": 628.6166666666667, "x": "『道』の字が、それぞれ入れられました。"}, {"t": 630.9833333333333, "x": "出棺のとき、リングアナウンサーの\n田中ケロがコールを行い、"}, {"t": 635.0166666666667, "x": "『炎のファイター』が流れました。"}, {"t": 637.1833333333333, "x": "棺を担いだのは、赤い闘魂タオルを\n首に巻いた選手たちでした。"}, {"t": 641.7666666666667, "x": "坂口征二、藤波辰爾、棚橋弘至、\nオカダ・カズチカ、中邑真輔、蝶野正洋。"}, {"t": 649.8, "x": "武藤敬司、髙田延彦、藤田和之、\n小川直也、船木誠勝、柴田勝頼らです。"}, {"t": 657.8166666666667, "x": "当初は6人で担ぐ予定でした。"}, {"t": 660.05, "x": "しかし棺がかなり重く、坂口の音頭で\n10人以上が担いだと伝えられています。"}, {"t": 665.8, "x": "2023年1月16日、日本国政府から\n猪木に対し、死没日付で従四位に叙され、"}, {"t": 672.8166666666667, "x": "旭日中綬章が追贈されたことが発表されました。"}, {"t": 676.5333333333333, "x": "日本のプロレスラーとしては初めての叙勲です。"}, {"t": 679.5, "x": "叙位と叙勲の伝達が\n行われたのは1月23日でした。"}, {"t": 683.5666666666667, "x": "3月7日、正式な本葬となる\n「アントニオ猪木お別れ会」が"}, {"t": 688.0, "x": "両国国技館で行われました。"}, {"t": 690.0833333333334, "x": "関係者とファンを合わせておよそ7000人が\n参列したと記録されています。"}, {"t": 694.7, "x": "第1部では坂口征二が開会を宣言し、\n森喜朗、藤波辰爾、棚橋弘至、"}, {"t": 701.9333333333333, "x": "古舘伊知郎が弔辞を読みました。"}, {"t": 704.4666666666667, "x": "ドリー・ファンク・ジュニアと\nタイガー・ジェット・シンからは"}, {"t": 707.0333333333333, "x": "映像でメッセージが届いています。"}, {"t": 709.1, "x": "遺族代表として挨拶したのは弟の啓介でした。"}, {"t": 712.5333333333333, "x": "最後は会場全体で\n「1、2、3、ダー」を行っています。"}, {"t": 718.4666666666667, "x": "同じ年の6月8日、日本記念日協会が10月1日を\n「闘魂アントニオ猪木の日」として認定したことを"}, {"t": 725.5, "x": "発表しました。"}, {"t": 726.5, "x": "猪木の命日であることと、\n「闘魂アントニオ・イノキ」の"}, {"t": 729.9333333333333, "x": "語呂合わせが理由とされています。"}, {"t": 731.9, "x": "9月12日には總持寺で一周忌法要が\n営まれ、最後に小川直也の音頭で"}, {"t": 737.4833333333333, "x": "「1、2、3、ダー」が唱和されました。"}, {"t": 741.7833333333333, "x": "法要のあとには「燃える闘魂 アントニオ猪木之\n像」の除幕式も行われています。"}, {"t": 747.4, "x": "ここまでの記録を、日付で並べ直しておきます。"}, {"t": 750.6833333333333, "x": "2020年2月14日、YouTube\n「アントニオ猪木『最後の闘魂』」開設。"}, {"t": 756.0, "x": "2020年2月28日、\nプロレスリング・マスターズが"}, {"t": 760.1, "x": "最後のリングになる。"}, {"t": 761.2666666666667, "x": "2020年7月26日、\nツイッターで心アミロイドーシスを告白。"}, {"t": 766.6, "x": "2020年12月28日、敗血症で緊急搬送。"}, {"t": 771.3833333333333, "x": "以降、入退院を繰り返す。"}, {"t": 773.9333333333333, "x": "2021年5月中旬、腸捻転で手術。"}, {"t": 777.8, "x": "術後およそ2週間、食事がとれず。"}, {"t": 780.7666666666667, "x": "2021年11月27日、正式病名\n「全身性トランスサイレチンアミロイドーシス」を"}, {"t": 787.6166666666667, "x": "NHK BSプレミアムで公表。"}, {"t": 790.0333333333333, "x": "2022年5月22日、\n青森県十和田市に自分の墓を建て、建立式。"}, {"t": 796.35, "x": "2022年8月28日、\n『24時間テレビ45』が生前最後のテレビ出演。"}, {"t": 803.0333333333333, "x": "2022年9月21日、『最期の言葉』を撮影。"}, {"t": 807.5666666666667, "x": "2022年10月1日午前7時40分、\n東京都港区の自宅で死去。79歳。"}, {"t": 814.6166666666667, "x": "2022年10月14日、告別式に358人。"}, {"t": 819.6, "x": "2023年3月7日、両国国技館でお別れ会。"}, {"t": 824.05, "x": "2020年2月14日にチャンネルを\n開いてから、2022年9月21日に"}, {"t": 829.85, "x": "最後の映像を撮るまで、猪木は自分の\n体をカメラの前に置き続けました。"}, {"t": 834.9166666666666, "x": "その間に記録されているのは、緊急搬送、\n腸捻転の手術、入退院の繰り返し、"}, {"t": 841.7166666666667, "x": "リハビリ、そして自力では\n起き上がれなくなった姿です。"}, {"t": 845.9333333333333, "x": "どれも、強さを看板にしてきた人間が\n普通なら隠すものでした。"}, {"t": 850.4666666666667, "x": "本人もそれは分かっていて、\n「見せたくなかった」"}, {"t": 853.4666666666667, "x": "「見せたくないでしょう、\nこんなザマを」と口に出しています。"}, {"t": 856.8833333333333, "x": "それでも、カメラは止められませんでした。"}, {"t": 859.7833333333333, "x": "最後の10日間に撮られた映像は、\n本人が死んだその日に公開されています。"}, {"t": 865.1666666666666, "x": "1943年2月20日に生まれ、\n1960年9月30日にデビューし、"}, {"t": 871.55, "x": "1998年4月4日に引退。"}, {"t": 875.0333333333333, "x": "そして2022年10月1日午前7時40分、\n自宅で79歳の生涯を閉じました。"}, {"t": 881.8833333333333, "x": "リングを降りてから24年が経っていました。"}, {"t": 884.5833333333334, "x": "その最後の3年近く、猪木がやっていたのは、\n弱っていく自分を人に見せることでした。"}, {"t": 890.9166666666666, "x": "最後まで人前に出ることをやめなかった。"}, {"t": 893.5333333333333, "x": "記録から確かに言えるのは、その1点です。"}, {"t": 896.7166666666667, "x": "弱っていく体を映させ続けた最後の日々が、\n猪木の残した最後の記録になりました。"}, {"t": 902.4333333333333, "x": "長い時間お付き合いいただき、\n本当にありがとうございます。"}, {"t": 906.5, "x": "昭和のリングの記録はまだ山ほど残っているので、\n次の回も見たいと思っていただけたら、"}, {"t": 912.1333333333333, "x": "チャンネル登録をしておいてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
