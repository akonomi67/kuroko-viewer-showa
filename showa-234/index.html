<script>
const D={"name": "ホーガンの死", "file": "234_編集用", "dur": 853.31665625, "segs": [], "subs": [{"t": 0.0, "x": "1980年5月、新日本プロレスの\n第3回MSGシリーズに、"}, {"t": 5.483333333333333, "x": "1人のアメリカ人が入ってきました。"}, {"t": 8.0, "x": "身長201センチ、体重137キロ。"}, {"t": 11.933333333333334, "x": "金髪で、シリーズの後半戦からの\n特別参加という扱いでした。"}, {"t": 16.666666666666668, "x": "当時この選手は、1955年生まれと\n称していたと記録されています。"}, {"t": 21.966666666666665, "x": "実際の生年は1953年です。"}, {"t": 25.166666666666668, "x": "実年齢より2つ若い26歳として、\n日本のリングに上がったことになります。"}, {"t": 30.483333333333334, "x": "名前は、ハルク・ホーガン。"}, {"t": 32.516666666666666, "x": "その45年後、2025年7月24日。"}, {"t": 36.666666666666664, "x": "アメリカ・フロリダ州クリアウォーターの\n自宅で、この選手は心停止に陥りました。"}, {"t": 42.016666666666666, "x": "搬送先の病院で死亡が確認されています。"}, {"t": 45.2, "x": "71歳でした。"}, {"t": 46.733333333333334, "x": "1980年に日本へ来たときのホーガンは、\nまだ何者でもありませんでした。"}, {"t": 52.3, "x": "そこから世界一有名なプロレスラーになり、\n71歳で亡くなっています。"}, {"t": 57.61666666666667, "x": "今回は、その45年の記録を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 63.63333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.11666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.7, "x": "まず、この選手がどこから来たのかを\n確認しておきます。"}, {"t": 75.75, "x": "本名はテリー・ジーン・ボレア。"}, {"t": 77.61666666666666, "x": "1953年8月11日、アメリカの\nジョージア州オーガスタで生まれました。"}, {"t": 83.65, "x": "生後1年半ほどでフロリダ州の\nポート・タンパへ移り、そこで育っています。"}, {"t": 88.86666666666666, "x": "デビューの時期は資料によって分かれます。"}, {"t": 91.36666666666666, "x": "1977年8月にフロリダで\nデビューしたとする記録と、"}, {"t": 95.53333333333333, "x": "1979年12月にWWFのリングへ\n登場したとする記録があります。"}, {"t": 101.73333333333333, "x": "ハルク・ホーガンというリングネームは、当時の\nWWF代表だったビンス・マクマホン・シニアが"}, {"t": 107.71666666666667, "x": "与えたものと記録されています。"}, {"t": 109.53333333333333, "x": "当時アメリカで放送されていたテレビドラマ\n『超人ハルク』にちなんだ名前です。"}, {"t": 114.08333333333333, "x": "日本での初来日のときのキャッチコピーも、\n超人ハルク、上陸、でした。"}, {"t": 120.01666666666667, "x": "新日本プロレスでの呼び名として、\nザ・ハルクという記録も残っています。"}, {"t": 124.7, "x": "1980年5月の初来日で、\nホーガンはストロング小林に勝利しています。"}, {"t": 130.66666666666666, "x": "アントニオ猪木とのシングルマッチも、\nテレビ中継で組まれました。"}, {"t": 134.98333333333332, "x": "ただしこのシリーズの時点では、\nまだシリーズの主役ではありません。"}, {"t": 139.25, "x": "猪木の相手役として組まれる立場です。"}, {"t": 141.66666666666666, "x": "同じシリーズには、スタン・ハンセンと\nアンドレ・ザ・ジャイアントも参加していました。"}, {"t": 146.31666666666666, "x": "その年、アメリカでは1つ記録が残っています。"}, {"t": 149.91666666666666, "x": "1980年8月9日、\nニューヨークのシェイ・スタジアム。"}, {"t": 154.5, "x": "アンドレ・ザ・ジャイアントを、\nボディスラムで投げています。"}, {"t": 157.86666666666667, "x": "223センチ、200キロを超える体を\n持ち上げて投げた選手として、"}, {"t": 163.01666666666668, "x": "日付とともに記録に残っている1人です。"}, {"t": 165.76666666666668, "x": "日本でのホーガンを決めたのは、1つの技でした。"}, {"t": 169.16666666666666, "x": "アックスボンバーです。"}, {"t": 170.68333333333334, "x": "曲げた腕を相手の首から顔にぶつける、\n斧のような形のラリアット。"}, {"t": 175.33333333333334, "x": "この技は、新日本でのパートナーだった\nスタン・ハンセンのウエスタン・ラリアットを"}, {"t": 180.03333333333333, "x": "参考にして編み出されたと記録されています。"}, {"t": 182.61666666666667, "x": "開発の段階では、ホーガンハンマーという\n名前を付ける予定だったとも記されています。"}, {"t": 188.2, "x": "定着したのは、アックスボンバーのほうでした。"}, {"t": 191.43333333333334, "x": "新日本でフィニッシュとして使われ始めたのは\n1982年からです。"}, {"t": 196.26666666666668, "x": "写真家の原悦生は、\n最初にアックスボンバーを浴びたのは"}, {"t": 200.16666666666666, "x": "藤波辰爾だった記憶がある、と書いています。"}, {"t": 203.38333333333333, "x": "ここに1つ、日本とアメリカの違いがあります。"}, {"t": 206.76666666666668, "x": "アックスボンバーは、\n日本でのフィニッシュでした。"}, {"t": 209.93333333333334, "x": "アメリカでのホーガンは、\n走り込んで相手の喉元に足を落とす"}, {"t": 213.98333333333332, "x": "レッグドロップで試合を終わらせることが\n多かったと記録されています。"}, {"t": 217.8, "x": "つまり日本のファンが見ていた決め技は、日本の\nリングのために覚えた技だったことになります。"}, {"t": 223.51666666666668, "x": "他の技も挙げておきます。"}, {"t": 225.31666666666666, "x": "ボディスラム。"}, {"t": 226.2, "x": "ビッグブーツ。"}, {"t": 227.16666666666666, "x": "ベアハッグ。"}, {"t": 228.05, "x": "カナディアン・バックブリーカー。"}, {"t": 229.83333333333334, "x": "コブラツイスト。"}, {"t": 230.91666666666666, "x": "飛ぶ技ではなく、体格を\nそのまま使う技が並んでいます。"}, {"t": 235.23333333333332, "x": "その技で、1983年6月2日の\n蔵前国技館が起きました。"}, {"t": 240.81666666666666, "x": "第1回IWGP決勝リーグ戦の優勝決定戦、\nアントニオ猪木対ハルク・ホーガン。"}, {"t": 247.28333333333333, "x": "21分27秒、KO。"}, {"t": 250.16666666666666, "x": "優勝したのはホーガンでした。"}, {"t": 252.1, "x": "この日のことはすでに1本にしているので、\nここでは日付と結果だけを置いておきます。"}, {"t": 257.45, "x": "翌1984年6月14日、同じ蔵前国技館で\n第2回の優勝戦が組まれました。"}, {"t": 264.56666666666666, "x": "今度は延長戦の末に、猪木が\nリングアウト勝ちを収めています。"}, {"t": 269.1166666666667, "x": "1985年6月11日には、\n東京体育館で藤波辰巳を相手に"}, {"t": 274.98333333333335, "x": "WWF世界ヘビー級王座の防衛戦を行いました。"}, {"t": 278.93333333333334, "x": "新日本への定期的な参戦は、1980年から\n1985年10月までと記録されています。"}, {"t": 286.68333333333334, "x": "その後、新日本とWWFの提携が解消されました。"}, {"t": 291.25, "x": "日本のリングでのホーガンは、\nここで一度終わります。"}, {"t": 294.7, "x": "アメリカに戻ってからの10年を、\n数字で見ておきます。"}, {"t": 298.43333333333334, "x": "1984年1月23日、\nマディソン・スクエア・ガーデン。"}, {"t": 303.85, "x": "当時の王者アイアン・シークを破り、\nWWF世界ヘビー級王座を初めて獲得しました。"}, {"t": 310.56666666666666, "x": "この王座の戴冠は、\n生涯で通算6回と記録されています。"}, {"t": 315.0, "x": "WCW世界ヘビー級王座も、同じく6回です。"}, {"t": 319.3666666666667, "x": "1987年3月29日、レッスルマニア3。"}, {"t": 324.06666666666666, "x": "アンドレ・ザ・ジャイアントとの一戦で、\n観客動員は9万3173人と記録されています。"}, {"t": 330.71666666666664, "x": "この試合でホーガンはアンドレを\nボディスラムで投げ、勝利しました。"}, {"t": 335.0, "x": "1988年2月5日の再戦では、\nそのアンドレに敗れて王座を明け渡しています。"}, {"t": 341.53333333333336, "x": "リングの外にも仕事がありました。"}, {"t": 343.6333333333333, "x": "1982年公開の映画『ロッキー3』に、\nサンダー・リップス役で出演しています。"}, {"t": 349.73333333333335, "x": "決め台詞も残りました。"}, {"t": 351.3333333333333, "x": "祈りを捧げ、ビタミンを取れ。"}, {"t": 353.71666666666664, "x": "自分の腕を、24インチの\nニシキヘビ、と呼んでいます。"}, {"t": 358.35, "x": "ハルクスター、リアル・アメリカン、\nインモータル、といった呼び名も付きました。"}, {"t": 363.8666666666667, "x": "外見も記録されています。"}, {"t": 365.7, "x": "身長は約2メートル。"}, {"t": 367.4166666666667, "x": "バンダナと、金髪のヒゲがトレードマークでした。"}, {"t": 370.68333333333334, "x": "ライバルの名前も残っています。"}, {"t": 372.73333333333335, "x": "ラウディことロディ・パイパー、そして\nアンドレ・ザ・ジャイアント。"}, {"t": 376.2, "x": "この顔ぶれとの抗争が話題を呼び、\n1980年代から1990年代初頭にかけて、"}, {"t": 383.18333333333334, "x": "プロレスは数十億ドル規模の\n産業になったと報じられています。"}, {"t": 387.31666666666666, "x": "1980年に日本へ来たときには\n無名だった選手が、"}, {"t": 391.3, "x": "その中心にいたことになります。"}, {"t": 393.6166666666667, "x": "日本との縁は、その後も切れていません。"}, {"t": 396.6166666666667, "x": "1990年4月13日、東京ドームで\n行われた日米レスリングサミットに出場しました。"}, {"t": 403.966666666 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
