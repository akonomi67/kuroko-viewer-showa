<script>
const D={"name": "復活インター王座", "file": "286_編集用", "dur": 909.26665625, "segs": [], "subs": [{"t": 0.0, "x": "ジャイアント馬場の公式年表には、\n「復活」という言葉が入った項目があります。"}, {"t": 5.55, "x": "1965年11月24日の項目です。"}, {"t": 9.45, "x": "NWA代表を下し、復活インターナショナル王座の\nチャンピオンとなる。"}, {"t": 14.616666666666667, "x": "年表には、そうあります。"}, {"t": 16.9, "x": "このベルトは、力道山が亡くなってから\nずっと止まっていました。"}, {"t": 20.833333333333332, "x": "それが動き出したのは、\n大阪府立体育会館の3本勝負からです。"}, {"t": 25.816666666666666, "x": "馬場は、ここで2本とも相手の\n反則で勝っています。"}, {"t": 29.483333333333334, "x": "1本目は17分59秒、\n2本目は5分31秒でした。"}, {"t": 34.61666666666667, "x": "なぜこの王座は「復活」と書かれたのでしょうか？"}, {"t": 37.583333333333336, "x": "ベルトが空いていた間に、\n何があったのでしょうか？"}, {"t": 41.28333333333333, "x": "そして馬場は、どんな道のりで\nこの夜にたどり着いたのでしょうか？"}, {"t": 45.5, "x": "今回は、1965年11月24日の\n大阪の夜を追います。"}, {"t": 51.03333333333333, "x": "ベルトの始まりから順に見ていきます。"}, {"t": 53.38333333333333, "x": "空位の時期と、挑戦者を決める試合も辿ります。"}, {"t": 56.96666666666667, "x": "日付と会場と試合時間は、\n試合の記録で確かめていきます。"}, {"t": 61.4, "x": "新聞の記事や公式年表も合わせて見ていきます。"}, {"t": 64.81666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 67.3, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 72.88333333333334, "x": "まず、このベルトの始まりです。"}, {"t": 75.36666666666666, "x": "インターナショナル・ヘビー級王座は、\nアメリカのNWAが認定した王座です。"}, {"t": 80.78333333333333, "x": "初代の王者はルー・テーズでした。"}, {"t": 82.86666666666666, "x": "テーズは「鉄人」と呼ばれたレスラーです。"}, {"t": 85.26666666666667, "x": "世界ヘビー級王座を持っていたこともあります。"}, {"t": 88.16666666666667, "x": "最初のベルトは、テーズが自分で持っていた\nベルトを使ったものとされています。"}, {"t": 93.15, "x": "もとは世界王座のベルトでした。"}, {"t": 95.18333333333334, "x": "1958年8月27日です。"}, {"t": 98.48333333333333, "x": "場所はアメリカのロサンゼルスです。"}, {"t": 100.6, "x": "オリンピック・オーディトリアムという会場でした。"}, {"t": 103.31666666666666, "x": "この夜、力道山がテーズに勝ちました。"}, {"t": 106.23333333333333, "x": "記録では反則勝ちだったとされています。"}, {"t": 108.81666666666666, "x": "力道山はこの試合に勝って、\nインターナショナル王座を手にしました。"}, {"t": 113.43333333333334, "x": "東京スポーツも、この日にテーズから\n王座を奪取したと書いています。"}, {"t": 117.83333333333333, "x": "ただ、テーズの側は違う見方をしていました。"}, {"t": 121.05, "x": "この試合は\n王座をかけた試合ではなかった、という主張です。"}, {"t": 125.33333333333333, "x": "テーズはその後も、王者として試合を続けました。"}, {"t": 128.7, "x": "場所はアメリカやヨーロッパだったと\n記録されています。"}, {"t": 131.73333333333332, "x": "それでも日本では、力道山が第2代の王者です。"}, {"t": 135.41666666666666, "x": "力道山は亡くなるまで、\nこのベルトを持ち続けました。"}, {"t": 139.08333333333334, "x": "そして1963年の12月が来ます。"}, {"t": 142.43333333333334, "x": "12月8日の夜です。"}, {"t": 144.2, "x": "力道山は東京・赤坂の\nナイトクラブで刺されました。"}, {"t": 147.6, "x": "1週間後の12月15日です。"}, {"t": 150.15, "x": "力道山は39歳で亡くなりました。"}, {"t": 152.9, "x": "力道山が持っていたベルトは、\nここで持ち主を失いました。"}, {"t": 157.0, "x": "インターナショナル・ヘビー級王座。"}, {"t": 159.1, "x": "アジア・ヘビー級王座。"}, {"t": 160.71666666666667, "x": "アジア・タッグ王座。"}, {"t": 162.11666666666667, "x": "記録では、この3つが\nそろって空位になったとされています。"}, {"t": 166.03333333333333, "x": "日本プロレスは、インターナショナル王座に\nついて1つの決定をしました。"}, {"t": 170.8, "x": "力道山一代限りのものとして\n封印する、という決定です。"}, {"t": 175.33333333333334, "x": "このベルトを\n巻く人は、もういないことになりました。"}, {"t": 178.71666666666667, "x": "1964年1月10日です。"}, {"t": 181.55, "x": "日本プロレスの幹部4人が、\n団体を続けると発表しました。"}, {"t": 185.91666666666666, "x": "ここから力道山のいない日本プロレスが\n始まります。"}, {"t": 189.11666666666667, "x": "このころ、馬場は日本にいませんでした。"}, {"t": 191.96666666666667, "x": "話を少し戻します。"}, {"t": 193.65, "x": "1960年4月11日です。"}, {"t": 196.58333333333334, "x": "馬場は力道山の日本プロレスに入りました。"}, {"t": 199.45, "x": "デビューは同じ年の9月30日です。"}, {"t": 202.08333333333334, "x": "場所は東京の台東区体育館でした。"}, {"t": 204.78333333333333, "x": "1961年7月1日には、\nアメリカへ武者修行に出ています。"}, {"t": 210.2, "x": "1963年3月17日、\n馬場は力道山と一緒に日本へ帰りました。"}, {"t": 216.46666666666667, "x": "3月22日には、第5回ワールド・リーグ戦の\n前夜祭に出ています。"}, {"t": 221.5, "x": "ここでリングネームが変わりました。"}, {"t": 223.51666666666668, "x": "馬場正平から、ジャイアント馬場です。"}, {"t": 226.33333333333334, "x": "web Sportivaは、\n馬場が帰国してすぐメインイベンターに"}, {"t": 230.0, "x": "抜擢されたと書いています。"}, {"t": 231.61666666666667, "x": "この年の10月7日です。"}, {"t": 233.5, "x": "馬場はもう1度アメリカへ渡りました。"}, {"t": 235.93333333333334, "x": "力道山が刺されたのは、\n馬場がアメリカにいる間のことです。"}, {"t": 239.98333333333332, "x": "1964年の2月です。"}, {"t": 242.46666666666667, "x": "馬場はアメリカで、\n大きな試合を続けて組まれます。"}, {"t": 246.08333333333334, "x": "3つの世界王座への挑戦です。"}, {"t": 248.36666666666667, "x": "1つ目はNWA世界ヘビー級王座でした。"}, {"t": 251.6, "x": "場所はデトロイトです。"}, {"t": 253.03333333333333, "x": "王者はルー・テーズでした。"}, {"t": 254.6, "x": "試合は3本勝負です。"}, {"t": 256.48333333333335, "x": "1本目は馬場が8分46秒で取りました。"}, {"t": 259.71666666666664, "x": "2本目はテーズが4分1秒で取りました。"}, {"t": 262.56666666666666, "x": "3本目もテーズが5分16秒で取りました。"}, {"t": 265.65, "x": "1対2で馬場の負けです。"}, {"t": 267.3666666666667, "x": "2つ目は2月17日です。"}, {"t": 269.48333333333335, "x": "場所はニューヨークの\nマディソン・スクエア・ガーデンでした。"}, {"t": 272.55, "x": "WWWFという団体の世界王座への挑戦です。"}, {"t": 276.26666666666665, "x": "3つ目は、ロサンゼルスでの\nWWA世界王座への挑戦でした。"}, {"t": 281.1166666666667, "x": "3つの挑戦で、馬場は\nどのベルトも取れませんでした。"}, {"t": 284.81666666666666, "x": "馬場のアメリカでの最後の試合は、\n1964年4月1日のハワイでした。"}, {"t": 290.56666666666666, "x": "4月3日には、東京の\n蔵前国技館で試合をしています。"}, {"t": 294.98333333333335, "x": "この試合は45分の時間切れで引き分けでした。"}, {"t": 298.3, "x": "ここから馬場は、日本のリングに立ち続けます。"}, {"t": 301.48333333333335, "x": "力道山の死のあと、馬場は\n日本プロレスのエースに君臨した。"}, {"t": 305.85, "x": "web Sportivaはそう書いています。"}, {"t": 307.98333333333335, "x": "最初のベルトは、その年の5月に来ました。"}, {"t": 311.1333333333333, "x": "このころのアジア・タッグ王座は、\n持ち主が何度も替わっていました。"}, {"t": 315.3666666666667, "x": "2月20日です。"}, {"t": 316.6333333333333, "x": "日本プロレスの先輩2人が、\n名古屋でこの王座を取りました。"}, {"t": 320.76666666666665, "x": "5月14日には横浜で、\n外国人の2人組に奪われています。"}, {"t": 325.6166666666667, "x": "そして5月29日、\n札幌の中島スポーツセンターです。"}, {"t": 330.2, "x": "馬場は先輩のレスラーと組んで、\nこの2人組に挑みました。"}, {"t": 334.25, "x": "試合は3本勝負でした。"}, {"t": 336.25, "x": "1本目は相手が10分22秒で\n馬場を押さえ込みました。"}, {"t": 340.06666666666666, "x": "2本目は馬場が1分41秒で\n相手を押さえ込みました。"}, {"t": 343.93333333333334, "x": "3本目は先輩のレスラーが\n9分28秒で決めています。"}, {"t": 348.1, "x": "2対1の勝ちです。"}, {"t": 349.5, "x": "試合の記録には、これが馬場の初めての\nタイトル獲得と書かれています。"}, {"t": 354.23333333333335, "x": "公式年表にも、この日の\nアジア・タッグ王座の奪取が載っています。"}, {"t": 358.73333333333335, "x": "このベルトを持って、\n馬場は各地で防衛戦をしています。"}, {"t": 362.73333333333335, "x": "7月23日は新潟県の三条市です。"}, {"t": 366.05, "x": "会場は高校のグラウンドでした。"}, {"t": function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')

    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
