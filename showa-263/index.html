<script>
const D={"name": "ジョー樋口", "file": "263_編集用", "dur": 825.55, "segs": [], "subs": [{"t": 0.0, "x": "2010年8月28日、東京・後楽園の大会。"}, {"t": 4.583333333333333, "x": "この日を最後に、1人の男が\n人前から姿を消しました。"}, {"t": 8.7, "x": "9月からはノアの調印式にも出てこなくなります。"}, {"t": 11.833333333333334, "x": "やがてノアの事務所に、\nファンからの電話が入り始めました。"}, {"t": 15.716666666666667, "x": "ジョーさんはどうしたんですか。"}, {"t": 17.433333333333334, "x": "尋ねられていたのは選手ではありません。"}, {"t": 19.883333333333333, "x": "1人のレフェリーです。"}, {"t": 21.283333333333335, "x": "11月8日の午前5時38分のことです。"}, {"t": 24.7, "x": "その人は東京都内の病院で亡くなりました。"}, {"t": 27.666666666666668, "x": "81歳でした。"}, {"t": 29.2, "x": "死因は肺腺がんです。"}, {"t": 31.016666666666666, "x": "同じ日、プロレスリング・ノアが\nその死を発表しました。"}, {"t": 34.65, "x": "名前はジョー樋口。"}, {"t": 36.016666666666666, "x": "ジョーは本名ではなく、呼び名です。"}, {"t": 38.95, "x": "リングの上で試合を裁く側にいた人です。"}, {"t": 41.8, "x": "選手でもない1人の審判が、なぜここまで\n名前を覚えられていたのでしょうか？"}, {"t": 47.1, "x": "今回は、ジョー樋口という人が\n歩いた道を追っていきます。"}, {"t": 51.13333333333333, "x": "始まりは力道山の時代です。"}, {"t": 53.18333333333333, "x": "そこからジャイアント馬場の\n全日本プロレス、そしてノアまでを追います。"}, {"t": 57.85, "x": "具体的な日付と、\n残された言葉をもとに辿っていきます。"}, {"t": 61.88333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 64.38333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 69.96666666666667, "x": "樋口は1929年、横浜市に生まれました。"}, {"t": 74.26666666666667, "x": "実家は本牧にあった洋食材の問屋です。"}, {"t": 77.23333333333333, "x": "9人兄弟の長男でした。"}, {"t": 79.25, "x": "子どもの頃からコーヒーを飲んでいました。"}, {"t": 81.61666666666666, "x": "音楽は、ジャズを聴いていたと伝えられています。"}, {"t": 84.93333333333334, "x": "打ち込んだのは柔道でした。"}, {"t": 86.73333333333333, "x": "段位は二段です。"}, {"t": 88.05, "x": "戦争が終わると、日本には進駐軍がやって来ます。"}, {"t": 91.83333333333333, "x": "樋口はアメリカの軍人たちに、\n柔道を教える仕事に就きました。"}, {"t": 96.21666666666667, "x": "この仕事の中で英語を身に付けています。"}, {"t": 98.8, "x": "1954年、樋口は柔道からプロレスに移ります。"}, {"t": 103.21666666666667, "x": "最初の団体は全日本プロレス協会でした。"}, {"t": 106.25, "x": "のちの全日本プロレスとは別の団体です。"}, {"t": 109.05, "x": "この協会は長く続きませんでした。"}, {"t": 111.5, "x": "次の行き先は日本プロレスです。"}, {"t": 113.75, "x": "デイリー新潮の記事では、\n1956年に移っています。"}, {"t": 118.35, "x": "日本プロレスを率いていたのは力道山です。"}, {"t": 121.21666666666667, "x": "リングの上では大きな結果は残せませんでした。"}, {"t": 124.25, "x": "日刊スポーツは、選手としては\n大成しなかったと書いています。"}, {"t": 128.46666666666667, "x": "それでも、リングの外では\n役に立つ場面がありました。"}, {"t": 132.16666666666666, "x": "1957年、広島県呉市での大会のことです。"}, {"t": 136.75, "x": "樋口は、来日した外国人選手たちの\n食事を作ると名乗り出ます。"}, {"t": 141.5, "x": "俺が作ってやるよ。"}, {"t": 142.9, "x": "これを聞いた力道山は、\nこう言ったと伝えられています。"}, {"t": 146.7, "x": "俺にも作ってくれ。"}, {"t": 148.05, "x": "デイリー新潮の記事によると、\n樋口は選手としての限界を感じます。"}, {"t": 152.78333333333333, "x": "そして1959年に引退しました。"}, {"t": 155.88333333333333, "x": "資料によっては1960年とするものもあります。"}, {"t": 159.6, "x": "日本プロレスを離れて水商売を始めました。"}, {"t": 162.65, "x": "離れるとき、力道山はこう声をかけています。"}, {"t": 166.08333333333334, "x": "気が変わったら、いつでも戻って来いよ。"}, {"t": 168.88333333333333, "x": "その店は3年ともちませんでした。"}, {"t": 171.26666666666668, "x": "樋口は戻りたいと伝えます。"}, {"t": 173.18333333333334, "x": "力道山はすぐに受け入れました。"}, {"t": 175.33333333333334, "x": "任されたのは外国人選手の世話でした。"}, {"t": 178.08333333333334, "x": "日刊スポーツによると、\n樋口はこのとき、こう言っています。"}, {"t": 182.45, "x": "こんなに名誉なことはない。"}, {"t": 184.1, "x": "1960年代、外国人選手が\n地方で泊まるのは旅館でした。"}, {"t": 189.38333333333333, "x": "選手たちは土足で部屋に上がりました。"}, {"t": 191.86666666666667, "x": "湯船の中で石鹸を使いました。"}, {"t": 194.15, "x": "和式のトイレを汚してしまうこともありました。"}, {"t": 196.8, "x": "樋口はその一つ一つに対処しました。"}, {"t": 199.31666666666666, "x": "次から起きないように言い聞かせています。"}, {"t": 201.78333333333333, "x": "列車で移動するときの決まりもありました。"}, {"t": 204.21666666666667, "x": "ときには喧嘩腰で守らせています。"}, {"t": 206.5, "x": "故郷が恋しくなった選手もいました。"}, {"t": 208.86666666666667, "x": "樋口はその土地の食べ物や特産品、\n音楽を探しました。"}, {"t": 213.15, "x": "やがて外国人選手の間にある言葉が広まります。"}, {"t": 216.6, "x": "日本に行ったら、先ず、\nジョーという人間を頼れ。"}, {"t": 220.85, "x": "そうすれば大丈夫だから。"}, {"t": 222.56666666666666, "x": "来日した選手たちは、樋口に礼の\n手紙を書くようになりました。"}, {"t": 226.88333333333333, "x": "ミル・マスカラスもその1人です。"}, {"t": 228.8, "x": "それをまとめた冊子が、\n選手の間で回されていたほどです。"}, {"t": 232.95, "x": "ある外国人選手は、帰りの空港で涙を流しました。"}, {"t": 237.18333333333334, "x": "樋口の手を握ったまま離さず、\n何度も礼を言ったといいます。"}, {"t": 241.41666666666666, "x": "親子2代で樋口の世話になった選手もいます。"}, {"t": 244.33333333333334, "x": "その息子は、初めて会った樋口にこう言いました。"}, {"t": 247.75, "x": "あなたのことは父から聞いています。"}, {"t": 249.96666666666667, "x": "日本では何でもあなたに相談しろと言われました。"}, {"t": 253.05, "x": "1960年代の半ば、\n樋口に新しい仕事が加わります。"}, {"t": 257.98333333333335, "x": "レフェリーです。"}, {"t": 259.01666666666665, "x": "デイリー新潮の記事では、\n1965年から兼ねるようになりました。"}, {"t": 264.06666666666666, "x": "資料によっては1966年とするものもあります。"}, {"t": 267.98333333333335, "x": "樋口が力を入れたのは受け身の練習です。"}, {"t": 270.8, "x": "その受け身を見た馬場はこう言っています。"}, {"t": 273.21666666666664, "x": "選手時代より受け身が上手くなってる。"}, {"t": 275.53333333333336, "x": "1967年には、アメリカの\nプロモーターから声がかかりました。"}, {"t": 280.56666666666666, "x": "樋口はアメリカ各地を回り、\n11か所でメインイベントを裁いています。"}, {"t": 285.43333333333334, "x": "日本に帰る前には、表彰状が\n用意されていたといいます。"}, {"t": 289.55, "x": "1971年の末、日本プロレスは\nアントニオ猪木を追い出しました。"}, {"t": 294.8833333333333, "x": "翌年の7月には馬場も会社を去ります。"}, {"t": 297.73333333333335, "x": "樋口もこのころ、日本プロレスを\n離れる道を考えていました。"}, {"t": 301.9166666666667, "x": "行き先はアメリカです。"}, {"t": 303.45, "x": "永住権を取ることまで考えていました。"}, {"t": 306.0, "x": "レフェリーとして、\n向こうで食べていくつもりでした。"}, {"t": 309.1166666666667, "x": "向こうの関係者からは、\nすぐにでも来て欲しいと言われていました。"}, {"t": 313.28333333333336, "x": "そこへ馬場から誘いが来ます。"}, {"t": 315.21666666666664, "x": "デイリー新潮の記事の見出しには、\nそのときの馬場の言葉が残っています。"}, {"t": 319.98333333333335, "x": "あんたの力が必要だ。"}, {"t": 321.73333333333335, "x": "樋口はアメリカ行きをやめ馬場の側に付きます。"}, {"t": 324.6166666666667, "x": "1972年10月22日、\n全日本プロレスが旗揚げしました。"}, {"t": 330.0833333333333, "x": "この日から樋口の頭はスキンヘッドになります。"}, {"t": 333.05, "x": "それまでは髪を剃ってはいませんでした。"}, {"t": 335.51666666666665, "x": "アメリカの関係者への、\nおわびのしるしだったと伝えられています。"}, {"t": 339.68333333333334, "x": "この頭は亡くなるまで変わりませんでした。"}, {"t": 342.28333333333336, "x": "スキンヘッドは樋口の目印になっていきます。"}, {"t": 345.2, "x": "日刊スポーツは、このころの\n樋口の裁き方をこう書いています。"}, {"t": 349.45, "x": "リングの上を跳びはねる機敏な\nレフェリングでした。"}, {"t": 352.31666666666666, "x": "年を重ねるごとに円熟味が増していきます。"}, {"t": 355.15, "x": "確実なカウントと毅然とした裁きで、\nファンを引きつけました。"}, {"t": 359.26666666666665, "x": "全日本の主役は社長の馬場でした。"}, {"t": 361.75, "x": "その馬場の大きな試合の多くで、\n真ん中にいたのが樋口です。"}, {"t": 366.06666666666666, "x": "日刊スポーツは、馬場の名勝負の大半を\n樋口が裁いたといわれた、と書いています。"}, {"t": 372.0833333333333, "x": "1974年には、\nアメリカでもう1つ記録を残しました。"}, {"t": 376.81666666666666, "x": "記録では6月14日のことです。"}, {"t": 379.15, "x": "場所はセントルイスの、\nキール・オーディトリアム。"}, {"t": 382.2, "x": "この日はNWA世界ヘビー級選手権がありました。"}, {"t": 385.8333333333333, "x": "ジャック・ブリスコ対ドリー・\nファンク・ジュニアです。"}, {"t": 388.3833333333333, "x": "その試合を裁いたのが樋口でした。"}, {"t": 390.76666666666665, "x": "日本人がNWAのヘビー級タイトルマッチを\n裁くのは、初めてでした。"}, {"t": 395.8333333333333, "x": "日刊スポーツも、そう記しています。"}, {"t": 398.5833333333333, "x": "この写真は、1975年の\nアメリカの専門誌に載ったものです。"}, {"t": 403.71666666666664, "x": "写っているのは、馬場とブリスコの一戦です。"}, {"t": 406.8833333333333, "x": "樋口の裁き方には決まった形がありました。"}, {"t": 409.7, "x": "グラウンドの攻防になると、\n選手に手を突き出して聞きます。"}, {"t": 413.6166666666667, "x": "ワッチャ、ギブアップ？"}, {"t": 415.71666666666664, "x": "英語でギブアップするかと尋ねる言葉です。"}, {"t": 418.3333333333333, "x": "カウントは遅いと言われることがありました。"}, {"t": 420.85, "x": "特に若いファンにはゆっくりに見えたようです。"}, {"t": 423.65, "x": "ただ、デイリー新潮の記事では、\nほぼ正確に1秒ずつ数えていたとされています。"}, {"t": 429.46666666666664, "x": "取材のカメラマンがいると、\n撮りやすい位置へ動いたともいいます。"}, {"t": 433.85, "x": "立つ姿はいつも少し猫背でした。"}, {"t": 436.18333333333334, "x": "レスラーを引き立てる裁き方だったと\n書かれています。"}, {"t": 439.25, "x": "一番弟子の和田京平は、馬場に\n勧められてレフェリーになった人です。"}, {"t": 443.96666666666664, "x": "その和田は、樋口から\n厳しく教えられたことを覚えています。"}, {"t": 448.1166666666667, "x": "選手の体に触るな。"}, {"t": 449.81666666666666, "x": "カメラを確認して位置取りしろ。"}, {"t": 451.8, "x": "和田はこの話の中で、あくまで\n主役は選手だ、とも語っています。"}, {"t": 456.8666666666667, "x": "全日本の試合ではある場面がよく見られました。"}, {"t": 459.85, "x": "樋口が試合の中で倒されてしまうのです。"}, {"t": 462.6166666666667, "x": "椅子のフルスイングを受けたこともあります。"}, {"t": 465.0833333333333, "x": "ブレーンバスターで投げられた選手がいました。"}, {"t": 467.6333333333333, "x": "その足が、樋口の後頭部に\n当たったこともあります。"}, {"t": 471.21666666666664, "x": "3カウントを返された選手の反動で、\n上から覆いかぶさられたこともあります。"}, {"t": 476.73333333333335, "x": "フリッツ・フォン・エリックの乱暴を、\n止めに入ったこともあります。"}, {"t": 480.7, "x": "そのときはアイアンクローで\n顔をつかまれ、投げられました。"}, {" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
