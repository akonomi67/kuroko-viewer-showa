<script>
const D={"name": "WJの1年3か月", "file": "296_編集用", "dur": 918.2833125, "segs": [], "subs": [{"t": 0.0, "x": "2003年3月1日、横浜アリーナです。"}, {"t": 3.783333333333333, "x": "この夜、新しいプロレス団体が\n旗揚げの大会を開きました。"}, {"t": 8.25, "x": "名前はWJプロレスです。"}, {"t": 10.383333333333333, "x": "メインのリングに上がったのは\n長州力と天龍源一郎でした。"}, {"t": 14.383333333333333, "x": "長州は51歳、天龍は53歳です。"}, {"t": 18.266666666666666, "x": "試合は8分ほどで終わりました。"}, {"t": 20.533333333333335, "x": "勝ったのは長州です。"}, {"t": 22.083333333333332, "x": "それから1年3か月あまりがたちます。"}, {"t": 24.733333333333334, "x": "2004年6月21日、熊本です。"}, {"t": 28.2, "x": "WJの大会は、この夜を\n最後に開かれなくなりました。"}, {"t": 32.46666666666667, "x": "横浜アリーナで始まった団体は、\n熊本で止まったのです。"}, {"t": 36.63333333333333, "x": "旗揚げの夜から熊本の夜までに、\n何があったのでしょうか？"}, {"t": 41.05, "x": "横浜アリーナで始まった団体は、なぜ1年\nあまりで止まったのでしょうか？"}, {"t": 46.2, "x": "今回はWJプロレスを追います。"}, {"t": 48.7, "x": "2002年の春から2004年の夏までです。"}, {"t": 51.63333333333333, "x": "日付と数字は、関係者が新聞や雑誌で\n語った言葉と照らし合わせます。"}, {"t": 56.71666666666667, "x": "資料によって数字が違うところは、\nどちらの数字かを言ってから進みます。"}, {"t": 61.65, "x": "最後までご覧いただければ幸いです。"}, {"t": 64.15, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 69.73333333333333, "x": "始まりは2002年です。"}, {"t": 71.53333333333333, "x": "この年の1月、新日本プロレスから\n全日本プロレスへ移った選手たちがいました。"}, {"t": 77.2, "x": "長州力は、新日本で現場の\n責任者を務めていました。"}, {"t": 81.45, "x": "2月、長州はその役目を外れます。"}, {"t": 84.58333333333333, "x": "選手が抜けた責任を問われた形でした。"}, {"t": 87.33333333333333, "x": "百科事典の記事には、そう書かれています。"}, {"t": 90.45, "x": "そして5月、長州は新日本の会社を去りました。"}, {"t": 94.41666666666667, "x": "同じ年に新日本を辞めた人が、もう1人います。"}, {"t": 98.06666666666666, "x": "永島勝司です。"}, {"t": 99.45, "x": "永島はもともと東京スポーツの記者でした。"}, {"t": 102.25, "x": "運動部の記者を経て、整理部長も務めています。"}, {"t": 105.91666666666667, "x": "1988年に新日本プロレスに入りました。"}, {"t": 109.71666666666667, "x": "1989年4月には、プロレスで\n初めての東京ドームの大会を手がけます。"}, {"t": 115.71666666666667, "x": "1995年4月には、\n北朝鮮の平壌での大会がありました。"}, {"t": 121.1, "x": "同じ年の10月には、新日本と\nUWFインターナショナルの全面戦争です。"}, {"t": 126.85, "x": "1998年4月には、\nアントニオ猪木の引退試合もありました。"}, {"t": 132.16666666666666, "x": "どれも永島が手がけた大会として、\n東京スポーツに並んでいます。"}, {"t": 136.66666666666666, "x": "2002年に新日本を辞めたとき、\n永島は取締役で企画と宣伝の部長でした。"}, {"t": 142.65, "x": "長州は永島の大学の後輩にあたります。"}, {"t": 145.7, "x": "専修大学です。"}, {"t": 147.15, "x": "この2人が組みました。"}, {"t": 148.6, "x": "長州は新しい団体を作ることにします。"}, {"t": 151.6, "x": "2人の会社は、2002年5月に\n「リキ・ナガシマ企画」という名前になります。"}, {"t": 156.88333333333333, "x": "2002年11月12日、\n新しい会社の設立が発表されます。"}, {"t": 162.15, "x": "会社の名前は\nファイティング・オブ・ワールド・ジャパンです。"}, {"t": 165.16666666666666, "x": "団体の呼び名がWJプロレスでした。"}, {"t": 167.86666666666667, "x": "社長には北海道の実業家が就きました。"}, {"t": 170.76666666666668, "x": "長州を後ろから支えてきた人です。"}, {"t": 173.28333333333333, "x": "永島は専務、長州は取締役になりました。"}, {"t": 177.1, "x": "事務所は東京の目黒区青葉台に置かれました。"}, {"t": 180.11666666666667, "x": "2002年11月、この事務所で長州と\n谷津嘉章が握手する写真が撮られています。"}, {"t": 186.26666666666668, "x": "決まり文句は\n「プロレス界のど真ん中を行く」です。"}, {"t": 189.63333333333333, "x": "もう1つ「目ん玉が飛び出るような\nストロング・スタイル」という言葉もありました。"}, {"t": 194.46666666666667, "x": "選手も集まります。"}, {"t": 195.93333333333334, "x": "越中詩郎は、2003年1月に\n契約が切れたのを機に新日本を離れました。"}, {"t": 201.46666666666667, "x": "越中は長州について行く形でWJに入ります。"}, {"t": 205.16666666666666, "x": "越中はのちに、東京スポーツの\n連載でこう話しています。"}, {"t": 209.31666666666666, "x": "「みんな長州さんが好きで来たんで」。"}, {"t": 211.45, "x": "佐々木健介も新日本を退団します。"}, {"t": 214.15, "x": "健介はそのころアメリカの\nニューヨークにいました。"}, {"t": 217.05, "x": "永島はニューヨークまで会いに行きます。"}, {"t": 219.51666666666668, "x": "そして健介に入団を説きました。"}, {"t": 221.8, "x": "東京スポーツは、そう伝えています。"}, {"t": 224.55, "x": "谷津も加わりました。"}, {"t": 226.0, "x": "営業の責任者も務めることになります。"}, {"t": 228.65, "x": "谷津はのちに、東京スポーツの連載で\nWJのころを振り返っています。"}, {"t": 233.71666666666667, "x": "選手には500万円ずつ渡していた、と\n谷津は話しています。"}, {"t": 238.06666666666666, "x": "会社の車には、トヨタのセルシオの一番\nいいグレードを買ったとも話しています。"}, {"t": 243.23333333333332, "x": "週刊ファイトの\n記事は、もう少し細かい数字を挙げています。"}, {"t": 247.38333333333333, "x": "選手の支度金は1人500万円です。"}, {"t": 250.13333333333333, "x": "サイパンでの合宿には384万円がかかりました。"}, {"t": 254.15, "x": "2002年12月の忘年会には、\n約500万円がかかりました。"}, {"t": 258.9, "x": "事務所の家賃は月に120万円です。"}, {"t": 261.76666666666665, "x": "会社を動かすお金は、はじめに\n1億円が用意されました。"}, {"t": 266.03333333333336, "x": "そのあと、さらに1億円が\n足されたと書かれています。"}, {"t": 269.78333333333336, "x": "どちらも貸し付けの形でした。"}, {"t": 271.7, "x": "旗揚げの大会は、もとは\n2002年11月の予定でした。"}, {"t": 276.01666666666665, "x": "それが延びて、2003年3月1日になります。"}, {"t": 279.68333333333334, "x": "場所は横浜アリーナです。"}, {"t": 281.51666666666665, "x": "横浜アリーナは1989年に\n開いた大きな会場です。"}, {"t": 286.0833333333333, "x": "谷津は、選手を前に\nこう呼びかけたと振り返っています。"}, {"t": 290.0, "x": "「俺はチケット2000枚売るから、\n選手全員で6000枚売ってくれ」。"}, {"t": 294.5, "x": "2003年3月1日、\n横浜アリーナの旗揚げの大会です。"}, {"t": 299.3333333333333, "x": "この大会はテレビで放送されました。"}, {"t": 301.8, "x": "TBSの深夜の番組で、録画での放送です。"}, {"t": 305.6166666666667, "x": "発表された観客は1万3200人でした。"}, {"t": 309.05, "x": "谷津の話では、8500人ぐらいの\nお客さんが来たといいます。"}, {"t": 313.53333333333336, "x": "赤字も出ずにすんだ、と谷津は話しています。"}, {"t": 316.65, "x": "週刊ファイトは、実際の数は\n発表の半分ほどと伝えています。"}, {"t": 321.3833333333333, "x": "会場に入れる数も、資料で違います。"}, {"t": 324.4, "x": "週刊ファイトは約1万7000人と書いています。"}, {"t": 327.75, "x": "谷津の話では1万2000人です。"}, {"t": 330.2, "x": "この夜、越中は大仁田厚と戦いました。"}, {"t": 333.56666666666666, "x": "電流が爆発するリングを使った試合です。"}, {"t": 336.51666666666665, "x": "そしてメインが、長州と天龍の一騎打ちでした。"}, {"t": 340.0833333333333, "x": "2人のシングルは、これが初めてではありません。"}, {"t": 343.4, "x": "初めては1985年2月21日、\n大阪城ホールでした。"}, {"t": 348.81666666666666, "x": "このときは長州がリングアウトで勝っています。"}, {"t": 351.6166666666667, "x": "百科事典の記事には、そう書かれています。"}, {"t": 354.73333333333335, "x": "それから18年がたっていました。"}, {"t": 356.96666666666664, "x": "試合の時間は、週刊ファイトでは7分53秒です。"}, {"t": 361.3666666666667, "x": "東京スポーツは8分あまりと書いています。"}, {"t": 364.2, "x": "勝ったのは長州でした。"}, {"t": 365.81666666666666, "x": "メインにしては短い決着でした。"}, {"t": 368.18333333333334, "x": "東京スポーツは、ファンが\n不満を示したと伝えています。"}, {"t": 372.03333333333336, "x": "長州にはアキレス腱の古い傷がありました。"}, {"t": 374.95, "x": "このことは、のちに\n明かされた話として東京スポーツに出ています。"}, {"t": 379.26666666666665, "x": "旗揚げのシリーズには目玉がありました。"}, {"t": 381.76666666666665, "x": "長州と天龍の6回続けての一騎打ちです。"}, {"t": 384.85, "x": "しかし週刊ファイトによると、\nこの予定は3回で止まりました。"}, {"t": 389.06666666666666, "x": "3月18日、群馬の太田の大会です。"}, {"t": 392.6333333333333, "x": "天龍は、頭の具合が悪く出場しませんでした。"}, {"t": 396.48333333333335, "x": "次の日の3月19日は、埼玉の草加の大会です。"}, {"t": 400.6666666666667, "x": "この夜は長州と天龍の\n2人とも出場しませんでした。"}, {"t": 404.3333333333333, "x": "第1試合の前に、健介と永島が\nリングでファンに謝りました。"}, {"t": 409.03333333333336, "x": "のちに、いきさつが明かされます。"}, {"t": 411.3833333333333, "x": "長州の面目を守るために、\n永島が天龍に欠場を頼んだというのです。"}, {"t": 416.71666666666664, "x": "東京スポーツは、そう書いています。"}, {"t": 419.35, "x": "ここからの数か月を日付で追います。"}, {"t": 421.8333333333333, "x": "旗揚げから約2か月がたちます。"}, {"t": 424.0833333333333, "x": "会社の上の人たちの給料が止まりました。"}, {"t": 426.81666666666666, "x": "週刊ファイトは、そう書いています。"}, {"t": 429.46666666666664, "x": "6月には、神奈川の相模原の\n大会が中止になります。"}, {"t": 433.6666666666667, "x": "7月20日、東京の両国です。"}, {"t": 436.6, "x": "新しいベルトの初代王者を決める\nトーナメントが行われました。"}, {"t": 440.51666666666665, "x": "ベルトの名前は\nワールド・マグマ・ザ・グレーテストです。"}, {"t": 443.48333333333335, "x": "出たのは8人です。"}, {"t": 444.96666666666664, "x": "ひと晩で決勝まで行う形でした。"}, {"t": 447.53333333333336, "x": "優勝したのは健介でした。"}, {"t": 449.5, "x": "健介はひと晩で3つ勝ったことになります。"}, {"t": 452.26666666666665, "x": "決勝の相手は、若い所属の選手でした。"}, {"t": 455.53333333333336, "x": "7月28日、WJの道場で練習生の\n1人が練習中に倒れました。"}, {"t": 461.76666666666665, "x": "この練習生は、その後亡くなっています。"}, {"t": 464.78333333333336, "x": "8月、7月の決勝で健介と\n戦った選手が団体を離れました。"}, {"t": 469.98333333333335, "x": "8月21日は大阪です。"}, {"t": 472.31666666666666, "x": "今度はタッグのベルトの初代王者を\n決めるトーナメントでした。"}, {"t": 475.96666666666664, "x": "出たのは5つの組です。"}, {"t": 477.6166666666667, "x": "決勝で勝ったのは長州と天龍の組でした。"}, {"t": 480.55, "x": "相手は越中の組です。"}, {"t": 482.3, "x": "旗揚げの夜に戦った2人が、\n今度は同じ側に立ちました。"}, {"t": 486.51666666666665, "x": "同じ8月、天龍がWJに入ると発表されました。"}, {"t": 490.9, "x": "ただ、百科事典の記事によると、\n実際には契約は結ばれていません。"}, {"t": 496.25, "x": "天龍はフリーの立場で上がり続けました。"}, {"t": 498.93333333333334, "x": "9月6日、横浜文化体育館です。"}, {"t": 502.1166666666667, "x": "WJは「エックスワン」という大会を開きました。"}, {"t": 505.8833333333333, "x": "プロレスではなく、総合格闘技の大会です。"}, {"t": 509.28333333333336, "x": "殴る、蹴る、組みつくを\n使って勝ち負けを決める競技です。"}, {"t": 513.9666666666667, "x": "横浜文 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
