<script>
const D={"name": "マサ斎藤の晩年", "file": "255_編集用", "dur": 860.1, "segs": [], "subs": [{"t": 0.0, "x": "2018年6月29日。"}, {"t": 2.3833333333333333, "x": "75歳の元プロレスラーが、\nリハビリのための施設に入りました。"}, {"t": 6.983333333333333, "x": "とどまる予定の期間は、1か月半でした。"}, {"t": 10.3, "x": "マサ斎藤です。"}, {"t": 11.533333333333333, "x": "その約2週間後、7月14日の\n午前1時5分に、斎藤は亡くなりました。"}, {"t": 17.616666666666667, "x": "病名は、パーキンソン病。"}, {"t": 19.9, "x": "現役を退いた直後の1999年から\n2000年ごろに発症したとされ、"}, {"t": 25.316666666666666, "x": "闘病はおよそ18年に及んでいました。"}, {"t": 28.4, "x": "1964年の東京オリンピックに出場し、\n1987年には巌流島でアントニオ猪木と"}, {"t": 36.0, "x": "2時間5分14秒を戦った男です。"}, {"t": 38.78333333333333, "x": "その男の最後の18年は、\nどんな時間だったのでしょうか。"}, {"t": 43.13333333333333, "x": "今回は、マサ斎藤が引退してから\n亡くなるまでの18年を、"}, {"t": 47.46666666666667, "x": "残された日付と数字と証言で辿っていきます。"}, {"t": 50.833333333333336, "x": "最後までご覧いただければ幸いです。"}, {"t": 53.31666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 58.9, "x": "まず、この人がどんな経歴の\n持ち主だったのかを確認しておきます。"}, {"t": 63.61666666666667, "x": "マサ斎藤、本名は斎藤昌典。"}, {"t": 66.56666666666666, "x": "1942年8月7日、\n東京都中野区に生まれました。"}, {"t": 71.3, "x": "明治大学に在学していた1963年、\nレスリングの全日本選手権で、"}, {"t": 77.28333333333333, "x": "フリースタイルとグレコローマンの\n両方のヘビー級で優勝しています。"}, {"t": 81.65, "x": "2つのスタイルを同じ年に制したということです。"}, {"t": 84.61666666666666, "x": "翌1964年10月、東京オリンピック。"}, {"t": 88.76666666666667, "x": "会場は駒沢体育館です。"}, {"t": 91.0, "x": "斎藤はフリースタイルのヘビー級に\n日本代表として出場しました。"}, {"t": 95.33333333333333, "x": "10月12日の試合では、\nスウェーデンの選手と引き分けています。"}, {"t": 99.81666666666666, "x": "最終的な記録は7位タイでした。"}, {"t": 102.2, "x": "1965年、日本プロレスに入門します。"}, {"t": 106.26666666666667, "x": "翌1966年には、豊登と猪木が\n旗揚げした東京プロレスに加わりました。"}, {"t": 112.46666666666667, "x": "その東京プロレスが行き詰まったあと、\n斎藤はアメリカへ渡ります。"}, {"t": 117.01666666666667, "x": "渡米の年は、資料によって1967年と\n1968年に分かれています。"}, {"t": 123.56666666666666, "x": "ここからの斎藤は、日本ではなく\nアメリカで生活するレスラーでした。"}, {"t": 128.2, "x": "カリフォルニア、フロリダ、\nアラバマと各地を回り、"}, {"t": 131.88333333333333, "x": "それぞれの地区で王座を獲っています。"}, {"t": 134.63333333333333, "x": "WWFでは、ミスター・フジと組んで\n世界タッグ王座を2回獲得しました。"}, {"t": 140.05, "x": "フロリダでは、のちのザ・グレート・カブキと\nタッグを組んでいます。"}, {"t": 143.86666666666667, "x": "このカブキの名前は、\nこの話の最後にもう一度出てきます。"}, {"t": 147.9, "x": "1984年、斎藤はアメリカで、同僚レスラーが\n起こした騒ぎに巻き込まれました。"}, {"t": 154.71666666666667, "x": "警察官との乱闘をめぐって裁判となり、\n1985年6月5日、州刑務所で"}, {"t": 161.78333333333333, "x": "2年という判決が言い渡されています。"}, {"t": 164.18333333333334, "x": "罪状は、警察官への暴行、\n職務の妨害などでした。"}, {"t": 168.86666666666667, "x": "服役中の1985年11月には、\n長州力が2日間続けて面会に訪れています。"}, {"t": 176.01666666666668, "x": "斎藤が出所したのは、1986年12月2日。"}, {"t": 180.71666666666667, "x": "1年半の服役でした。"}, {"t": 182.51666666666668, "x": "日本に戻った1987年、\n斎藤は猪木と何度も一騎打ちをしています。"}, {"t": 188.53333333333333, "x": "そして10月4日、山口県下関市の巌流島。"}, {"t": 192.75, "x": "観客もレフェリーも時間の制限もない試合は、\n2時間5分14秒で猪木の裸"}, {"t": 198.28333333333333, "x": "絞めによる決着となりました。"}, {"t": 199.98333333333332, "x": "この試合の詳しい中身は、\n以前の回で取り上げています。"}, {"t": 204.05, "x": "その3年後の1990年2月10日、東京ドーム。"}, {"t": 208.61666666666667, "x": "47歳の斎藤は、アメリカの団体AWAの\n世界ヘビー級王座を獲得しました。"}, {"t": 215.06666666666666, "x": "王座はおよそ2か月後の4月8日、アメリカの\nミネソタ州セントポールで失いました。"}, {"t": 220.75, "x": "ここから、今回の本題に入ります。"}, {"t": 223.58333333333334, "x": "1999年2月14日、日本武道館。"}, {"t": 227.95, "x": "56歳の斎藤は、引退試合を行いました。"}, {"t": 231.78333333333333, "x": "相手は、斎藤自身が見いだし、\n新日本プロレスに連れてきた外国人選手です。"}, {"t": 237.96666666666667, "x": "試合は相手の勝ちでした。"}, {"t": 239.75, "x": "引退後も、斎藤は新日本プロレスに残りました。"}, {"t": 243.48333333333332, "x": "試合の組み立てを考える仕事と、\nテレビ解説の仕事です。"}, {"t": 247.83333333333334, "x": "のちに蝶野正洋は、\n斎藤についてこう書き残しています。"}, {"t": 252.01666666666668, "x": "強豪外国人選手、WCW、nWo。"}, {"t": 256.75, "x": "困難な海外渉外、\nマサさん無くして新日本の成功はなかった。"}, {"t": 261.55, "x": "ところが、その仕事を\n本格的に始めようとした矢先に、"}, {"t": 265.48333333333335, "x": "体に異変が出ます。"}, {"t": 267.26666666666665, "x": "パーキンソン病でした。"}, {"t": 268.8, "x": "発症の時期は、資料によって少しずれています。"}, {"t": 272.3, "x": "デイリースポーツは、引退のころの\n1999年ごろと伝えています。"}, {"t": 277.6333333333333, "x": "東京スポーツは、2000年に\n発症したと伝えています。"}, {"t": 281.48333333333335, "x": "パーキンソン病は、脳の中で体の動きを\n伝える仕組みがうまく働かなくなる病気です。"}, {"t": 287.35, "x": "手足の震え、こわばり、動きの遅れが出て、\n年月とともに進んでいきます。"}, {"t": 293.6166666666667, "x": "国が指定する難病の1つです。"}, {"t": 295.9, "x": "2003年、斎藤は新日本プロレスを\n離れ、長州力らが旗揚げした"}, {"t": 301.65, "x": "WJプロレスに加わりました。"}, {"t": 303.68333333333334, "x": "その後は、佐々木健介が率いる健介オフィスで、\n若い選手を指導するアドバイザーを務めています。"}, {"t": 310.6166666666667, "x": "病気のことを本人が公に語ったのは、\n発症からかなり後のことでした。"}, {"t": 315.65, "x": "2014年から2015年にかけての\nインタビューで、斎藤は2000年から治療を"}, {"t": 321.2, "x": "受けていること、そして2013年に障害者手帳の\n交付を受けていたことを明かしています。"}, {"t": 326.98333333333335, "x": "2014年、斎藤は埼玉県の\nリハビリ施設に入ります。"}, {"t": 331.6333333333333, "x": "1回およそ1か月半の集中リハビリで、これ以降、\nほぼ毎年この施設に通うことになりました。"}, {"t": 338.56666666666666, "x": "このとき担当した作業療法士の証言が、\n2024年7月、雑誌「Number」の"}, {"t": 344.9, "x": "サイトに載っています。"}, {"t": 346.1333333333333, "x": "入ったときの斎藤の体重は83キロ。"}, {"t": 349.1666666666667, "x": "胸板は、ほかの利用者の\nおよそ2倍あったそうです。"}, {"t": 352.73333333333335, "x": "現役時代は180センチ、\n120キロと紹介されていた体でした。"}, {"t": 358.18333333333334, "x": "施設には、高齢者向けの、\n重りを持ち上げる器具がありました。"}, {"t": 362.8333333333333, "x": "ふつうの利用者が扱う重さは5キロ程度、\n重くても20キロ程度です。"}, {"t": 367.9, "x": "斎藤はこの器具を見つけると、\n自分から使い始めました。"}, {"t": 372.0, "x": "そして、20キロでは軽すぎると言いました。"}, {"t": 375.23333333333335, "x": "現役のころは120キロを挙げていた、とも\n話しています。"}, {"t": 379.35, "x": "施設は少しずつ重さを上げていきました。"}, {"t": 382.0833333333333, "x": "最後は、およそ60キロに届いています。"}, {"t": 385.28333333333336, "x": "この施設でそこまで挙げた利用者は、\n斎藤ただ1人でした。"}, {"t": 389.35, "x": "ほかの利用者は、施設に\n入ることを「入所」と言います。"}, {"t": 393.05, "x": "斎藤は、それを「合宿」と呼んでいました。"}, {"t": 396.06666666666666, "x": "個室には、たくさんの\nトレーニング器具を持ち込んでいました。"}, {"t": 399.95, "x": "ある日、職員が部屋をのぞくと、\n斎藤が床にうつ伏せになっていました。"}, {"t": 405.35, "x": "倒れたのかと思って近づくと、腹筋ローラーで\n自主トレーニングをしているところでした。"}, {"t": 410.76666666666665, "x": "斎藤は糖尿病も抱えていました。"}, {"t": 413.3333333333333, "x": "1日の食事の目安は\nふつう1600キロカロリーほどですが、医師の"}, {"t": 418.1, "x": "管理のもとで、およそ2500キロカロリーまで\n増やしていました。"}, {"t": 422.21666666666664, "x": "好物だった濃いめのカルピスとプロテインも、\n部屋に持ち込んでいます。"}, {"t": 426.6, "x": "2015年11月、斎藤は東京スポーツの\nインタビューで、1つの目標を語りました。"}, {"t": 433.4, "x": "2020年の東京オリンピックで、\n聖火ランナーを務めることです。"}, {"t": 438.15, "x": "1964年の東京大会に選手として出た人間が、\n56年後の東京大会に、もう一度"}, {"t": 445.8833333333333, "x": "関わろうとしていました。"}, {"t": 447.26666666666665, "x": "2017年1月18日の日刊スポーツは、\n栃木県内の病院でリハビリに"}, {"t": 453.03333333333336, "x": "取り組む斎藤の姿を伝えています。"}, {"t": 455.3833333333333, "x": "1時間のトレーニングを、\n1日3回行っていたと報じられました。"}, {"t": 459.93333333333334, "x": "そして2016年12月2日、\n大阪市の城東区民センター。"}, {"t": 464.8833333333333, "x": "元新日本プロレスの関係者が手がけた興行で、\n斎藤はファンの前に姿を見せました。"}, {"t": 470.93333333333334, "x": "全試合が終わったあと、入場テーマが流れます。"}, {"t": 474.48333333333335, "x": "斎藤はジャパンプロレスのジャージーを着て、\n自分の足で歩き、リングに入りました。"}, {"t": 480.3666666666667, "x": "マイクを持った斎藤の第一声は、\n「元気ですかー？」でした。"}, {"t": 484.81666666666666, "x": "そして、これは猪木の言葉だと\n明かして、会場を沸かせています。"}, {"t": 489.51666666666665, "x": "その直後、海賊の\nマスクをかぶった男が乱入しました。"}, {"t": 493.71666666666664, "x": "「海賊男」です。"}, {"t": 495.03333333333336, "x": "1987年3月26日、大阪城ホールで\n行われた猪木と斎藤の一騎打ちに乱入し、"}, {"t": 502.55, "x": "大きな騒ぎのきっかけになったのが、\nこの海賊男でした。"}, {"t": 506.96666666666664, "x": "29年後の大阪で、海賊男は\n斎藤を何度も踏みつけました。"}, {"t": 511.95, "x": "斎藤は倒れましたが、観客の\n声援の中で自分の力で立ち上がり、"}, {"t": 516.9166666666666, "x": "パンチとストンピングを返しています。"}, {"t": 519.5333333333333, "x": "海賊男は降参してマスクを脱ぎました。"}, {"t": 522.3666666666667, "x": "中から出てきたのは、\n新日本プロレス時代の後輩、武藤敬司でした。"}, {"t": 527.5166666666667, "x": "斎藤は武藤と抱き合い、最後にこう言いました。"}, {"t": 531.0333333333333, "x": "やっぱりリングはいいよ。"}, {"t": 532.6, "x": "翌2017年4月7日、\n斎藤は同じ大阪市立城東区民センターの"}, {"t": 538.0666666666667, "x": "興行に、もう一度姿を見せています。"}, {"t": 541.0333333333333, "x": "健介オフィスで指導した弟子を\n激励するためでした。"}, {"t": 544.3166666666667, "x": "これが、斎藤が公の場に\n出た最後の記録になりました。"}, {"t": 548.3333333333334, "x": "病気は、その後も進みました。"}, {"t": 550.8333333333334, "x": "先ほどの作業療法士によると、\n施設に通い始めたころは、職員と"}, {"t": 556.0333333333333, "x": "一緒にゆっくり走ることもできました。"}, {"t": 558.2, "x": "それが次第に、短い距離を\n歩くのがやっとになります。"}, {"t": 561.9333333333333, "x": "ベッドに座った姿勢を保てず、\nずるずると横になってしまうこともありました。"}, {"t": 566.8833333333333, "x": "その時期の、ある日のことです。"}, {"t": 569.15, "x": "歩く訓練の代わりに、施設の中にマットを\n敷き、体の大きな職員とレスリングの"}, {"t": 575.1166666666667, "x": "動きをしてみることになりました。"}, {"t": 576.8833333333333, "x": "手すりにつかまってやっと歩いていた斎藤は、\n素早くタックルに入り、"}, {"t": 581.4333333333333, "x": "相手の背後に回り込みました。"}, {"t": 583.7833333333333, "x": "見ていた職員たちは驚いたと証言しています。"}, {"t": 586.85, "x": "冒頭でお伝えした2018年6月29日の\n入所が、最後の集中リハビリになりました。"}, {"t": 593.3833333333333, "x": "亡くなる前日にも、斎藤はリハビリを\n手伝う作業療法士と言葉を交わしています。"}, {"t": 598.9166666666666, "x": "部屋には、アメリカで世話になった先輩レスラーの\n写真が飾られていました。"}, {"t": 603.8833333333333, "x": "斎藤はその先輩への感謝を口にしていたと、\n作業療法士は振り返っています。"}, {"t": 609.6333333333333, "x": "そして7月14日、\n斎藤は75歳で亡くなりました。"}, {"t": 614.0833333333334, "x": "訃報は2日後の7月16日、\n健介オフィスから発表されました。"}, {"t": 619.1, "x": "妻はコメントの中で、闘病生活が\n本人にとって想像を絶するほど"}, {"t": 624.0833333333334, "x": "つらいものだったことに触れています。"}, {"t": 626.0, "x": "そのうえで、来年には再びカムバックの\n機会も見えてきて、リハビリに意欲を"}, {"t": 631.4333333333333, "x": "燃やしていた矢先だったと明かしました。"}, {"t": 633.5833333333334, "x": "最期は穏やかで、マサ斎藤らしい力強い\n旅立ちだった、とも述べています。"}, {"t": 639.4, "x": "妻は、別の場でもう1つの事実を明かしています。"}, {"t": 642.9833333333333, "x": "18年近い闘病の中で、\n斎藤が弱音を吐いたのは一度だけでした。"}, {"t": 648.05, "x": "病気と分かって間もないころ、\n墓参りをした夜に、なぜ自分だけが"}, {"t": 652.9166666666666, "x": "こんな目に遭うのかと口にした。"}, {"t": 654.7166666666667, "x": "それ以降、弱音も不満も\n一度も言わなかったそうです。"}, {"t": 658.6833333333333, "x": "ここで、確かめられた事実を\n日付の順に並べ直します。"}, {"t": 662.7666666666667, "x": "1964年10月、駒沢体育館で\n東京オリンピックに出場。"}, {"t": 668.5, "x": "1985年6月5日、\nアメリカで州刑務所2年の判決。"}, {"t": 673.8, "x": "1986年12月2日、1年半で出所。"}, {"t": 678.35, "x": "1987年10月4日、\n巌流島で猪木と2時間5分14秒。"}, {"t": 684.25, "x": "1990年2月10日、東京ドームで\nAWA世界ヘビー級王座を獲得。"}, {"t": 690.5333333333333, "x": "1999年2月14日、日本武道館で引退試合。"}, {"t": 695.7333333333333, "x": "1999年から2000年ごろ、\nパーキンソン病を発症。"}, {"t": 700.5, "x": "2013年、障害者手帳の交付を受ける。"}, {"t": 704.2166666666667, "x": "2014年、埼玉県のリハビリ施設で\n集中リハビリを始める。"}, {"t": 709.1833333333333, "x": "2015年11月、2020年の\n東京オリンピックで聖火ランナーを目指すと語る。"}, {"t": 715.4166666666666, "x": "2016年12月2日、\n大阪で自分の足でリングに入る。"}, {"t": 720.1333333333333, "x": "2017年4月7日、最後の公の場。"}, {"t": 723.75, "x": "2018年6月29日、\n最後の集中リハビリに入る。"}, {"t": 728.4833333333333, "x": "2018年7月14日午前1時5分、死去。"}, {"t": 732.7666666666667, "x": "引退試合から亡くなるまでは、19年5か月です。"}, {"t": 736.7, "x": "そのうち18年ほどが、\n病気と向き合った時間でした。"}, {"t": 740.7166666666667, "x": "斎藤が目標にしていた2020年の\n東京オリンピックは、斎藤が亡くなってから"}, {"t": 746.3666666666667, "x": "2年後に予定されていた大会です。"}, {"t": 748.55, "x": "7月22日、東京・青山の梅窓院で\n葬儀・告別式が営まれました。"}, {"t": 754.3166666666667, "x": "進行を務めたのは、アナウンサーの徳光和夫です。"}, {"t": 758.2, "x": "斎藤のデビュー戦で、\nインタビューをした人でした。"}, {"t": 761.8833333333333, "x": "弔辞を読んだのは2人です。"}, {"t": 763.6666666666666, "x": "1人目は、ザ・グレート・カブキ。"}, {"t": 765.9166666666666, "x": "69歳でした。"}, {"t": 767.45, "x": "アメリカで斎藤とタッグを組み、ともに\nタイトルを獲った相棒です。"}, {"t": 771.9333333333333, "x": "カブキは涙で声を詰まらせながら、\nいつか会えるその時は、またコンビを復活させて"}, {"t": 777.6833333333333, "x": "チャンピオンになりましょう、と呼びかけました。"}, {"t": 780.5166666666667, "x": "2人目は、武藤敬司。"}, {"t": 782.4833333333333, "x": "55歳でした。"}, {"t": 783.8, "x": "1年7か月前、大阪で\n海賊男として斎藤を踏みつけた後輩です。"}, {"t": 789.3333333333334, "x": "武藤は斎藤を、豪傑な中にも\n繊細な心を持つ人だったと語り、"}, {"t": 794.2, "x": "その信条を引き継ぐと述べました。"}, {"t": 796.7833333333333, "x": "信条は、「Go for broke」。"}, {"t": 799.1, "x": "当たって砕けろ、という意味の英語です。"}, {"t": 801.9666666666667, "x": "参列者の中には、キラー・カーン、\n蝶野正洋の姿もありました。"}, {"t": 807.0666666666667, "x": "蝶野は斎藤を、闘魂三銃士の育ての\n親であり、新日本プロレスの黄金期を"}, {"t": 813.0166666666667, "x": "取締役として支えた人だったと語っています。"}, {"t": 816.0, "x": "棺を運んだのは、長州力、前田日明、\n武藤敬司、坂口征二、佐々木健介たちでした。"}, {"t": 824.3333333333334, "x": "長州は、客を圧倒する力を\n持っていた人として、猪木と斎藤の"}, {"t": 829.4333333333333, "x": "2人しか思い浮かばないと語っています。"}, {"t": 831.7666666666667, "x": "同じ日、猪木は自分の写真とともに、\n短い言葉を投稿しました。"}, {"t": 836.9, "x": "マサくん、安らかに眠ってください。"}, {"t": 839.8, "x": "巌流島から31年、引退試合から19年5か月。"}, {"t": 844.5833333333334, "x": "今回お伝えしたのは、そのあいだに\nマサ斎藤が残した記録です。"}, {"t": 848.9666666666667, "x": "次の回もこのチャンネルで\nお届けしますので、よろしければ"}, {"t": 852.7, "x": "チャンネル登録と高評価をお願いします。"}, {"t": 855.2333333333333, "x": "最後まで見てくださった皆様に、\nお礼を申し上げます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
