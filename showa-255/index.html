<script>
const D={"name": "マサ斎藤の晩年", "file": "255_編集用", "dur": 882.05, "segs": [], "subs": [{"t": 0.0, "x": "2018年6月29日。"}, {"t": 2.3833333333333333, "x": "75歳の元プロレスラーが、\nリハビリのための施設に入りました。"}, {"t": 6.983333333333333, "x": "とどまる予定の期間は、1か月半でした。"}, {"t": 10.3, "x": "マサ斎藤です。"}, {"t": 11.533333333333333, "x": "その約2週間後、7月14日の\n午前1時5分に、斎藤は亡くなりました。"}, {"t": 17.616666666666667, "x": "病名は、パーキンソン病。"}, {"t": 19.9, "x": "発症したのは、現役を退いた直後の\n1999年から2000年ごろとされています。"}, {"t": 26.416666666666668, "x": "闘病はおよそ18年に及んでいました。"}, {"t": 29.2, "x": "1964年には東京オリンピックに出場しました。"}, {"t": 33.28333333333333, "x": "1987年には巌流島でアントニオ猪木と\n2時間5分14秒を戦いました。"}, {"t": 39.36666666666667, "x": "その男の最後の18年は、\nどんな時間だったのでしょうか。"}, {"t": 43.71666666666667, "x": "今回は、マサ斎藤が引退してから\n亡くなるまでの18年を辿ります。"}, {"t": 48.63333333333333, "x": "手がかりは、残された日付と数字と証言です。"}, {"t": 52.05, "x": "最後までご覧いただければ幸いです。"}, {"t": 54.55, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 60.13333333333333, "x": "まず、この人の経歴を確認しておきます。"}, {"t": 63.516666666666666, "x": "マサ斎藤の本名は斎藤昌典。"}, {"t": 66.05, "x": "1942年8月7日、\n東京都中野区に生まれました。"}, {"t": 70.76666666666667, "x": "明治大学に在学していた1963年のことです。"}, {"t": 74.81666666666666, "x": "レスリングの全日本選手権で、\n斎藤はヘビー級を制しました。"}, {"t": 79.53333333333333, "x": "それもフリースタイルと\nグレコローマンの両方です。"}, {"t": 82.53333333333333, "x": "2つのスタイルを同じ年に制したということです。"}, {"t": 85.5, "x": "翌1964年10月、東京オリンピック。"}, {"t": 89.65, "x": "会場は駒沢体育館です。"}, {"t": 91.88333333333334, "x": "斎藤は日本代表として出場しました。"}, {"t": 94.73333333333333, "x": "種目はフリースタイルのヘビー級です。"}, {"t": 97.25, "x": "10月12日の試合では、\nスウェーデンの選手と引き分けています。"}, {"t": 101.73333333333333, "x": "最終的な記録は7位タイでした。"}, {"t": 104.13333333333334, "x": "1965年に日本プロレスに入門します。"}, {"t": 107.73333333333333, "x": "翌1966年には東京プロレスに加わりました。"}, {"t": 111.76666666666667, "x": "豊登と猪木が旗揚げした団体です。"}, {"t": 114.41666666666667, "x": "その東京プロレスは行き詰まります。"}, {"t": 116.73333333333333, "x": "そのあと斎藤はアメリカへ渡りました。"}, {"t": 119.28333333333333, "x": "渡米の年は資料によって1967年と\n1968年に分かれています。"}, {"t": 125.28333333333333, "x": "ここからの斎藤は、\nアメリカで生活するレスラーでした。"}, {"t": 129.26666666666668, "x": "カリフォルニアやフロリダ、\nアラバマを回りました。"}, {"t": 132.48333333333332, "x": "それぞれの地区で王座を獲っています。"}, {"t": 134.81666666666666, "x": "WWFではミスター・フジと組みました。"}, {"t": 137.71666666666667, "x": "そして世界タッグ王座を2回獲得しています。"}, {"t": 140.75, "x": "フロリダでは、のちのザ・グレート・カブキと\nタッグを組んでいます。"}, {"t": 144.56666666666666, "x": "このカブキの名前は、\nこの話の最後にもう一度出てきます。"}, {"t": 148.6, "x": "1984年、斎藤はアメリカで\n騒ぎに巻き込まれました。"}, {"t": 153.5, "x": "同僚レスラーが起こした騒ぎです。"}, {"t": 155.78333333333333, "x": "警察官との乱闘をめぐって裁判になりました。"}, {"t": 158.91666666666666, "x": "1985年6月5日に言い渡された判決は、\n州刑務所で2年です。"}, {"t": 164.88333333333333, "x": "罪状は警察官への暴行や職務の妨害などでした。"}, {"t": 168.58333333333334, "x": "服役中の1985年11月には、\n長州力が面会に訪れています。"}, {"t": 174.8, "x": "面会は2日間続きました。"}, {"t": 176.81666666666666, "x": "斎藤が出所したのは1986年12月2日。"}, {"t": 181.05, "x": "1年半の服役でした。"}, {"t": 182.85, "x": "日本に戻った1987年、\n斎藤は猪木と何度も一騎打ちをしています。"}, {"t": 188.86666666666667, "x": "そして10月4日、山口県下関市の巌流島。"}, {"t": 193.08333333333334, "x": "観客もレフェリーもいません。"}, {"t": 194.83333333333334, "x": "時間の制限もありません。"}, {"t": 196.71666666666667, "x": "試合は2時間5分14秒で決着しました。"}, {"t": 199.98333333333332, "x": "猪木の裸絞めによる決着です。"}, {"t": 202.21666666666667, "x": "この試合の詳しい中身は、\n以前の回で取り上げています。"}, {"t": 206.28333333333333, "x": "その3年後の1990年2月10日、東京ドーム。"}, {"t": 210.85, "x": "47歳の斎藤は、ここで王座を獲得しました。"}, {"t": 214.75, "x": "アメリカの団体AWAの世界ヘビー級王座です。"}, {"t": 218.43333333333334, "x": "王座はおよそ2か月後に失いました。"}, {"t": 220.93333333333334, "x": "4月8日、アメリカの\nミネソタ州セントポールです。"}, {"t": 224.63333333333333, "x": "ここから今回の本題に入ります。"}, {"t": 226.98333333333332, "x": "1999年2月14日、日本武道館。"}, {"t": 231.35, "x": "56歳の斎藤は引退試合を行いました。"}, {"t": 234.6, "x": "相手は外国人選手です。"}, {"t": 236.58333333333334, "x": "斎藤自身が見いだし、\n新日本プロレスに連れてきた選手でした。"}, {"t": 241.31666666666666, "x": "試合は相手の勝ちでした。"}, {"t": 243.1, "x": "引退後も斎藤は新日本プロレスに残りました。"}, {"t": 246.33333333333334, "x": "試合の組み立てを考える仕事と、\nテレビ解説の仕事です。"}, {"t": 250.68333333333334, "x": "のちに蝶野正洋は、\n斎藤についてこう書き残しています。"}, {"t": 254.86666666666667, "x": "強豪外国人選手、WCW、nWo。"}, {"t": 259.6, "x": "困難な海外渉外。"}, {"t": 261.23333333333335, "x": "マサさん無くして新日本の成功はなかった。"}, {"t": 264.1166666666667, "x": "ところが、その仕事を\n本格的に始めようとした矢先のことです。"}, {"t": 268.51666666666665, "x": "体に異変が出ます。"}, {"t": 270.03333333333336, "x": "パーキンソン病でした。"}, {"t": 271.55, "x": "発症の時期は資料によって少しずれています。"}, {"t": 274.48333333333335, "x": "デイリースポーツは、引退のころの\n1999年ごろと伝えています。"}, {"t": 279.81666666666666, "x": "東京スポーツは、2000年に\n発症したと伝えています。"}, {"t": 283.6666666666667, "x": "パーキンソン病は脳の病気です。"}, {"t": 285.85, "x": "体の動きを伝える仕組みが\nうまく働かなくなります。"}, {"t": 289.28333333333336, "x": "手足の震えやこわばりが出ます。"}, {"t": 291.31666666666666, "x": "動きも遅くなります。"}, {"t": 292.75, "x": "そして年月とともに進んでいきます。"}, {"t": 295.15, "x": "国が指定する難病の1つです。"}, {"t": 297.43333333333334, "x": "2003年、斎藤は新日本プロレスを離れました。"}, {"t": 301.55, "x": "そして長州力らが旗揚げした\nWJプロレスに加わりました。"}, {"t": 305.65, "x": "その後は健介オフィスで\nアドバイザーを務めています。"}, {"t": 308.9, "x": "佐々木健介が率いる団体で、\n若い選手を指導する役目です。"}, {"t": 313.6, "x": "病気のことを、本人はしばらく公に\n語りませんでした。"}, {"t": 317.7, "x": "語ったのは発症からかなり後のことです。"}, {"t": 320.3666666666667, "x": "2014年から2015年にかけての\nインタビューです。"}, {"t": 323.95, "x": "斎藤は2000年から治療を\n受けていると明かしました。"}, {"t": 327.26666666666665, "x": "2013年に障害者手帳の交付を\n受けていたことも明かしています。"}, {"t": 331.65, "x": "2014年、斎藤は埼玉県の\nリハビリ施設に入ります。"}, {"t": 336.3, "x": "1回およそ1か月半の集中リハビリです。"}, {"t": 339.3833333333333, "x": "これ以降、ほぼ毎年この施設に\n通うことになりました。"}, {"t": 343.15, "x": "このとき担当した作業療法士がいます。"}, {"t": 345.81666666666666, "x": "その証言が、2024年7月に公開されました。"}, {"t": 349.98333333333335, "x": "載ったのは雑誌「Number」のサイトです。"}, {"t": 352.3333333333333, "x": "入ったときの斎藤の体重は83キロ。"}, {"t": 355.3666666666667, "x": "胸板はほかの利用者のおよそ2倍あったそうです。"}, {"t": 358.46666666666664, "x": "現役時代は180センチ、\n120キロと紹介されていた体でした。"}, {"t": 363.9, "x": "施設には、重りを持ち上げる器具がありました。"}, {"t": 367.21666666666664, "x": "高齢者向けの器具です。"}, {"t": 368.85, "x": "ふつうの利用者が扱う重さは5キロ程度。"}, {"t": 371.73333333333335, "x": "重くても20キロ程度です。"}, {"t": 373.65, "x": "斎藤はこの器具を見つけると、\n自分から使い始めました。"}, {"t": 377.76666666666665, "x": "そして20キロでは軽すぎると言いました。"}, {"t": 380.3666666666667, "x": "現役のころは120キロを挙げていた、とも\n話しています。"}, {"t": 384.48333333333335, "x": "施設は少しずつ重さを上げていきました。"}, {"t": 387.21666666666664, "x": "最後はおよそ60キロに届いています。"}, {"t": 389.9166666666667, "x": "この施設でそこまで挙げた利用者は、\n斎藤ただ1人でした。"}, {"t": 393.96666666666664, "x": "ほかの利用者は、施設に\n入ることを「入所」と言います。"}, {"t": 397.6666666666667, "x": "斎藤はそれを「合宿」と呼んでいました。"}, {"t": 400.1666666666667, "x": "斎藤は個室を使っていました。"}, {"t": 402.35, "x": "そこにたくさんのトレーニング器具を\n持ち込んでいました。"}, {"t": 405.5, "x": "ある日、職員が部屋をのぞきました。"}, {"t": 408.43333333333334, "x": "すると斎藤が床にうつ伏せになっていました。"}, {"t": 411.18333333333334, "x": "倒れたのかと思って職員は近づきました。"}, {"t": 413.96666666666664, "x": "斎藤は腹筋ローラーで\n自主トレーニングをしているところでした。"}, {"t": 417.8333333333333, "x": "斎藤は糖尿病も抱えていました。"}, {"t": 420.4, "x": "1日の食事の目安は、\nふつう1600キロカロリーほどです。"}, {"t": 424.75, "x": "医師の管理のもとで、\n斎藤は量を増やしていました。"}, {"t": 428.3666666666667, "x": "およそ2500キロカロリーです。"}, {"t": 430.6, "x": "好物は濃いめのカルピスでした。"}, {"t": 432.6666666666667, "x": "プロテインと一緒に、部屋に持ち込んでいます。"}, {"t": 435.8, "x": "2015年11月、斎藤は東京スポーツの\nインタビューに答えました。"}, {"t": 441.0833333333333, "x": "そこで1つの目標を語っています。"}, {"t": 443.48333333333335, "x": "2020年の東京オリンピックで\n聖火ランナーを務めることです。"}, {"t": 447.6666666666667, "x": "1964年の東京大会に、\n斎藤は選手として出ています。"}, {"t": 452.85, "x": "その56年後の東京大会に、もう一度\n関わろうとしていました。"}, {"t": 457.71666666666664, "x": "2017年1月18日の日刊スポーツも、\n斎藤の姿を伝えています。"}, {"t": 463.45, "x": "栃木県内の病院でリハビリに取り組む姿です。"}, {"t": 466.71666666666664, "x": "1時間のトレーニングを\n1日3回行っていたと報じられました。"}, {"t": 470.71666666666664, "x": "時間を少し戻します。"}, {"t": 472.4, "x": "2016年12月2日、\n大阪市の城東区民センター。"}, {"t": 477.01666666666665, "x": "元新日本プロレスの関係者が手がけた興行です。"}, {"t": 480.45, "x": "この日、斎藤はファンの前に姿を見せました。"}, {"t": 483.9, "x": "全試合が終わったあと、入場テーマが流れます。"}, {"t": 487.45, "x": "斎藤はジャパンプロレスの\nジャージーを着ていました。"}, {"t": 490.4166666666667, "x": "そして自分の足で歩き、リングに入りました。"}, {"t": 493.76666666666665, "x": "マイクを持った斎藤の第一声は、\n「元気ですかー？」でした。"}, {"t": 498.2, "x": "これは猪木の言葉だと斎藤は明かしました。"}, {"t": 500.9, "x": "会場は沸きました。"}, {"t": 502.31666666666666, "x": "その直後、海賊の\nマスクをかぶった男が乱入しました。"}, {"t": 506.51666666666665, "x": "「海賊男」です。"}, {"t": const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
