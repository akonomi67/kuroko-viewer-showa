<script>
const D={"name": "金網デスマッチ", "file": "226_編集用", "dur": 1032.21665625, "segs": [], "subs": [{"t": 0.0, "x": "1970年10月8日、大阪府立体育会館。"}, {"t": 4.55, "x": "この日、リングの周りに鉄の金網が組まれました。"}, {"t": 8.05, "x": "イメージ映像"}, {"t": 8.05, "x": "日本のプロレスで、金網が使われた最初の日です。"}, {"t": 11.733333333333333, "x": "観客には、何も知らされていませんでした。"}, {"t": 14.833333333333334, "x": "この試合は、当日まで告知されていません。"}, {"t": 18.116666666666667, "x": "会場にいなかった人が金網のことを知ったのは、\n6日後の10月14日でした。"}, {"t": 23.516666666666666, "x": "TBSの中継で、初めて放送されたからです。"}, {"t": 27.316666666666666, "x": "組んだのは、国際プロレスという団体でした。"}, {"t": 30.5, "x": "このあと国際プロレスは、\nこの金網を自分たちの看板にしていきます。"}, {"t": 35.266666666666666, "x": "そして、その看板から抜けられなくなりました。"}, {"t": 38.5, "x": "イメージ映像"}, {"t": 38.5, "x": "なぜ、客を呼べたはずの看板が、\n団体を縛ることになったのでしょうか。"}, {"t": 43.93333333333333, "x": "今回は、国際プロレスの\n金網デスマッチという興行の形を、"}, {"t": 48.35, "x": "確認できた日付と数字、そして当事者が\n残した言葉だけで辿っていきます。"}, {"t": 53.93333333333333, "x": "推測や、裏の取れていない話は入れません。"}, {"t": 57.36666666666667, "x": "最後までお付き合いいただけますと幸いです。"}, {"t": 60.18333333333333, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}, {"t": 64.13333333333334, "x": "まず、なぜ1970年10月8日だったのかを\n確認しておきます。"}, {"t": 69.66666666666667, "x": "このシリーズは\n『70ダイナマイト・シリーズ』といいます。"}, {"t": 72.81666666666666, "x": "9月9日開幕、10月20日終了の全21戦で、\n10月8日はその14戦目にあたります。"}, {"t": 80.38333333333334, "x": "このシリーズには、もともと\n別の目玉が予定されていました。"}, {"t": 84.23333333333333, "x": "ファン投票で1位になった外国人選手、\nスパイロス・アリオンの招聘です。"}, {"t": 89.46666666666667, "x": "ところが、この招聘は実現しませんでした。"}, {"t": 92.71666666666667, "x": "日本プロレス側の妨害によって流れた、と\n記録されています。"}, {"t": 97.0, "x": "イメージ映像"}, {"t": 97.0, "x": "看板にするはずだった選手が来ない。"}, {"t": 99.31666666666666, "x": "その代わりに組まれたのが、\nこの金網デスマッチでした。"}, {"t": 103.0, "x": "金網そのものについても、記録が残っています。"}, {"t": 106.53333333333333, "x": "関係者は、アメリカで行われた金網デスマッチの\n写真を参考にして、金網を製作しました。"}, {"t": 113.5, "x": "ただし、あまりにも急なことでした。"}, {"t": 116.26666666666667, "x": "記録にはこう書かれています。"}, {"t": 118.11666666666666, "x": "金網に出入口を付け忘れてしまった。"}, {"t": 120.78333333333333, "x": "高さや材質といった仕様の数字は、\nどの資料にも残っていません。"}, {"t": 125.35, "x": "ここでは書きません。"}, {"t": 126.66666666666667, "x": "ルールは、アメリカのものとは違いました。"}, {"t": 129.6, "x": "ここが、この団体の金網を\n理解する上で一番大事なところです。"}, {"t": 134.28333333333333, "x": "国際プロレスの金網デスマッチは、\n反則攻撃が可能でした。"}, {"t": 138.68333333333334, "x": "決着はノックアウトかギブアップだけです。"}, {"t": 141.25, "x": "ノックアウトの判定にも手順がありました。"}, {"t": 143.9, "x": "相手をフォールして3カウントを奪い、そのあと\nレフェリーがさらに10カウントを数えます。"}, {"t": 149.48333333333332, "x": "相手がカウント内に立ち上がれなければ、\nそこで勝ちが決まります。"}, {"t": 153.61666666666667, "x": "ボクシングと同じ数え方です。"}, {"t": 155.71666666666667, "x": "一方、アメリカで一般的だったのは\nエスケープ・ルールでした。"}, {"t": 159.8, "x": "金網から脱出した選手が\n勝者になる、というルールです。"}, {"t": 163.98333333333332, "x": "つまり日本の金網は、逃げても勝てません。"}, {"t": 167.03333333333333, "x": "中で決着がつくまで終わらない形でした。"}, {"t": 169.81666666666666, "x": "この違いが、2年後に大きな事件を生みます。"}, {"t": 173.13333333333333, "x": "1970年10月8日のカードは、\nラッシャー木村対ドクター・デスです。"}, {"t": 178.46666666666667, "x": "ドクター・デスは覆面のリングネームでした。"}, {"t": 181.0, "x": "中にいたのはムース・モロウスキーです。"}, {"t": 183.3, "x": "本名は、スタン・マイキートビッチといいます。"}, {"t": 186.38333333333333, "x": "1935年7月6日生まれ、\nカナダ・マニトバ州ウィニペグの出身です。"}, {"t": 192.18333333333334, "x": "素顔で来日したあと、1970年7月に\n覆面でもう一度来日していました。"}, {"t": 198.25, "x": "試合は17分22秒、\n木村のノックアウト勝ちです。"}, {"t": 202.46666666666667, "x": "この日のセミファイナルは、\nIWA世界タッグ選手権でした。"}, {"t": 207.0, "x": "グレート草津とサンダー杉山の\n組が防衛しています。"}, {"t": 210.4, "x": "金網は、メインイベントとして組まれていました。"}, {"t": 213.6, "x": "TBSの中継は、10月14日に\nカラーで放送されました。"}, {"t": 218.25, "x": "そして、放送はそこで止まります。"}, {"t": 220.85, "x": "残酷すぎるという抗議が殺到したため、\nTBSは金網デスマッチの中継を、"}, {"t": 226.48333333333332, "x": "この1回で封印しました。"}, {"t": 228.68333333333334, "x": "イメージ映像"}, {"t": 228.68333333333334, "x": "団体は金網を続けます。"}, {"t": 230.68333333333334, "x": "しかしテレビには映らない。"}, {"t": 232.36666666666667, "x": "この状態が、およそ4年続きました。"}, {"t": 235.23333333333332, "x": "金網が団体の看板になっていく過程を、\n日付で追います。"}, {"t": 239.43333333333334, "x": "1970年12月12日、東京・台東体育館。"}, {"t": 244.31666666666666, "x": "木村がオックス・ベーカーを\n16分50秒でノックアウトしています。"}, {"t": 248.48333333333332, "x": "ただしこの試合で、木村は足を骨折しました。"}, {"t": 251.96666666666667, "x": "1971年2月28日、岩手県営体育館。"}, {"t": 257.0, "x": "サンダー杉山が\nマッドドッグ・バションと戦いました。"}, {"t": 260.23333333333335, "x": "木村以外の選手が金網に入った最初の試合です。"}, {"t": 263.71666666666664, "x": "1971年3月2日、東京体育館。"}, {"t": 268.03333333333336, "x": "木村はギプスをしたまま出場し、\nザ・クエスチョンを22分17秒で"}, {"t": 273.03333333333336, "x": "ノックアウトしています。"}, {"t": 274.35, "x": "1971年10月26日、岩手県。"}, {"t": 278.65, "x": "ストロング小林がダニー・リンチを\n24分11秒でノックアウトしました。"}, {"t": 283.45, "x": "そして1972年1月27日、横浜文化体育館。"}, {"t": 288.8833333333333, "x": "IWA世界ヘビー級選手権が、\n金網の中で行われます。"}, {"t": 293.81666666666666, "x": "王座戦に金網が使われた最初の試合でした。"}, {"t": 297.0, "x": "デスマッチという特別な形だったものが、\nタイトルマッチにまで使われるようになりました。"}, {"t": 302.46666666666664, "x": "1972年11月27日、愛知県体育館。"}, {"t": 307.46666666666664, "x": "観衆は8,000人です。"}, {"t": 309.28333333333336, "x": "この日のメインは、WWA世界タッグ選手権の\n金網デスマッチでした。"}, {"t": 315.0, "x": "王者はディック・ザ・ブルーザーと\nザ・クラッシャー。"}, {"t": 317.48333333333335, "x": "挑戦したのは、ストロング小林と\nグレート草津の組です。"}, {"t": 321.55, "x": "試合は16分、無効試合になりました。"}, {"t": 324.85, "x": "そして場内は暴動になります。"}, {"t": 326.98333333333335, "x": "原因は、ルールの食い違いでした。"}, {"t": 329.7, "x": "プロレス評論家の門馬忠雄は、\nこの件についてこう語っています。"}, {"t": 334.1, "x": "国際と外国人側のルールの\n打ち合わせが完璧ではなかった。"}, {"t": 338.1666666666667, "x": "王者組は金網から\nエスケープすれば勝利と把握していた。"}, {"t": 341.8833333333333, "x": "アメリカのルールなら、\n金網を越えれば勝ちです。"}, {"t": 345.2, "x": "日本のルールでは、それは勝ちになりません。"}, {"t": 348.18333333333334, "x": "同じ金網の中で、2つのルールが\n動いていたことになります。"}, {"t": 352.3333333333333, "x": "このとき、社長の吉原功が\n観客に向かって話しています。"}, {"t": 356.73333333333335, "x": "試合がまずい結果になって申し訳ありません。"}, {"t": 359.71666666666664, "x": "来年2月にこの会場で\n無料試合をやるので納得してください。"}, {"t": 363.81666666666666, "x": "その約束のとおり、お詫びの興行が組まれました。"}, {"t": 367.43333333333334, "x": "1973年2月27日。"}, {"t": 370.45, "x": "この日、マイティ井上がホセ・キンテロを\n相手に、自身にとって初めての"}, {"t": 375.46666666666664, "x": "金網デスマッチを行っています。"}, {"t": 377.55, "x": "お詫びの興行の目玉が、また金網でした。"}, {"t": 380.71666666666664, "x": "このときのことを、\nマイティ井上は後年こう語っています。"}, {"t": 384.7, "x": "お詫び興行で\n金網デスマッチをやる必要はないんだよ。"}, {"t": 388.26666666666665, "x": "金網デスマッチは正直やりたくなかったね。"}, {"t": 391.1333333333333, "x": "選手の側から、この形をやりたくなかったという\n言葉が残っているのは、この1件です。"}, {"t": 397.31666666666666, "x": "それでも、金網は広がっていきます。"}, {"t": 400.18333333333334, "x": "1973年7月9日、大阪府立体育館。"}, {"t": 404.8333333333333, "x": "アニマル浜口がバディ・ウルフを\n19分12秒でノックアウトしました。"}, {"t": 409.23333333333335, "x": "浜口にとって最初の金網デスマッチです。"}, {"t": 412.15, "x": "1973年10月30日、\n北海道の稚内市体育館。"}, {"t": 417.6166666666667, "x": "木村はオーレ・アンダーソンと21分18秒を\n戦い、両者ノックアウトになりました。"}, {"t": 423.4, "x": "木村が金網で初めて引き分けた試合です。"}, {"t": 426.26666666666665, "x": "1975年4月19日、\n札幌中島スポーツセンター。"}, {"t": 431.6, "x": "木村がマッドドッグ・バションを\n7分25秒のボストンクラブで破り、"}, {"t": 435.85, "x": "IWA世界ヘビー級王座を奪いました。"}, {"t": 439.28333333333336, "x": "団体の最高峰のベルトが、\n金網の中で動いたことになります。"}, {"t": 443.8333333333333, "x": "金網デスマッチが何試合行われたのかも、\n数えることができます。"}, {"t": 448.46666666666664, "x": "1970年から1981年までに国際プロレスが\n組んだ金網デスマッチは、239試合です。"}, {"t": 456.73333333333335, "x": "イメージ映像"}, {"t": 456.73333333333335, "x": "そのうち、ラッシャー木村が\n絡んだ試合が95試合あります。"}, {"t": 461.3833333333333, "x": "最も多かったのは1974年で、\nこの年だけで17試合が組まれました。"}, {"t": 467.15, "x": "なぜ、ここまで増えたのか。"}, {"t": 469.46666666666664, "x": "理由も記録に残っています。"}, {"t": 471.4166666666667, "x": "イメージ映像"}, {"t": 471.4166666666667, "x": "全国のプロモーターからは、\n金網デスマッチ開催の有無で興行収入が"}, {"t": 476.26666666666665, "x": "違ってきていたため、金網デスマッチの\n興行開催を要求され、その要望が"}, {"t": 482.05, "x": "多かったことから、タイトルマッチでも金網を\n使用するようになるなど乱発を余儀なくされた。"}, {"t": 487.6666666666667, "x": "団体が好んで増やしたというより、\n興行を買う側から"}, {"t": 491.45, "x": "求められて増えた、という書かれ方です。"}, {"t": 494.26666666666665, "x": "木村1人に負担が集中したことへの\n手当ても記録されています。"}, {"t": 498.21666666666664, "x": "木村に負担をかけすぎないよう、\n木村以外の選手も交代で金網デスマッチに"}, {"t": 503.3333333333333, "x": "出場することになりました。"}, {"t": 504.93333333333334, "x": "木村は、いつしか金網の鬼と\n呼ばれるようになります。"}, {"t": 508.55, "x": "イメージ映像"}, {"t": 508.55, "x": "ただし、誰が最初にそう呼んだのかを\n示す記録は見つかっていません。"}, {"t": 513.55, "x": "同じ団体にいたアニマル浜口は、\n木村の身体についてこう語っています。"}, {"t": 518.6166666666667, "x": "身体の強さはケタ外れで、国際プロレスで\n文句なくナンバー1だったんじゃないですか。"}, {"t": 524.3, "x": "こっちがどんなに力いっぱい顔を叩いても、\n張っても、ビクともしない。"}, {"t": 529.2166666666667, "x": "金網の記録の中には、後に\n世界的な名前になる選手も残っています。"}, {"t": 534.2, "x": "1973年6月26日、秋田県の大館市体育館。"}, {"t": 539.65, "x": "観衆は4,000人でした。"}, {"t": 541.5333333333333, "x": "この日の金網デスマッチの相手は、\nリック・フレアーです。"}, {"t": 545.3, "x": "木村が17分50秒で\nノックアウト勝ちしています。"}, {"t": 548.7833333333333, "x": "フレアーは『73ビッグ・サマー・シリーズ』に\n国際プロレスの"}, {"t": 552.2666666666667, "x": "外国人選手として来日していました。"}, {"t": 554.7, "x": "デビューからまだ日の浅い時期です。"}, {"t": 556.8, "x": "後にNWA世界ヘビー級王座を\n何度も巻くことになる選手が、"}, {"t": 561.1666666666666, "x": "日本の地方都市の金網の中にいた。"}, {"t": 563.85, "x": "この記録が残っています。"}, {"t": 565.5833333333334, "x": "テレビに金網が戻るまでの\n経緯も、日付で追えます。"}, {"t": 569.3, "x": "TBSの中継は\n1974年3月30日で終わりました。"}, {"t": 574.1833333333333, "x": "そのあと入ったのが東京12チャンネルです。"}, {"t": 577.0666666666667, "x": "1974年6月3日、\n単発の中継が放送されます。"}, {"t": 582.2666666666667, "x": "この回の視聴率は6.4パーセントでした。"}, {"t": 585.2833333333333, "x": "この数字を受けて、レギュラー化が決まります。"}, {"t": 588.4, "x": "そして1974年7月29日。"}, {"t": 591.65, "x": "この日に放送されたのが、7月5日に鹿児島県の\n鹿屋市体育館で行われた、木村対ザ・キラーの"}, {"t": 598.85, "x": "金網チェーンデスマッチでした。"}, {"t": 600.6666666666666, "x": "東京12チャンネルで\n初めて放送されたデスマッチであり、"}, {"t": 604.2166666666667, "x": "およそ4年ぶりの金網の解禁でした。"}, {"t": 607.1833333333333, "x": "レギュラー中継『国際プロレスアワー』は、\n1974年9月23日に始まります。"}, {"t": 613.5333333333333, "x": "枠は月曜の20時でした。"}, {"t": 615.4833333333333, "x": "1980年10月4日からは\n土曜20時に移っています。"}, {"t": 619.95, "x": "視聴率も残っています。"}, {"t": 621.7166666666667, "x": "レギュラー初回は5.6パーセント。"}, {"t": 624.15, "x": "1975年7月7日に10パーセントに乗り、\n1976年4月19日には番組の"}, {"t": 631.5666666666667, "x": "最高となる11.7パーセントを記録しました。"}, {"t": 634.7166666666667, "x": "イメージ映像"}, {"t": 634.7166666666667, "x": "1976年は年間を通して7から\n10パーセント台です。"}, {"t": 639.3333333333334, "x": "そして1980年8月に5パーセントを割り、\n1981年3月28日に打ち切られました。"}, {"t": 647.2833333333333, "x": "金網の記録で、木村の相手として何度も\n名前が出てくる外国人がいます。"}, {"t": 652.4, "x": "ジプシー・ジョーです。"}, {"t": 653.6333333333333, "x": "本名はギルベルト・メレンデス。"}, {"t": 655.6, "x": "イメージ映像"}, {"t": 655.6, "x": "1933年12月2日生まれ、\nプエルトリコの出身です。"}, {"t": 660.7166666666667, "x": "生まれた町の名前は、資料によって\n分かれているため、ここでは書きません。"}, {"t": 665.8666666666667, "x": "国際プロレスへの初来日は1975年9月、\n『75ビッグ・ゴールデン・シリーズ』でした。"}, {"t": 672.75, "x": "初戦は9月7日の後楽園ホール、\n相手はマイティ井上です。"}, {"t": 677.3833333333333, "x": "ここで1つ、注意しておきたい記録があります。"}, {"t": 680.7666666666667, "x": "1972年のシリーズにも、\nジプシー・ジョーという名前の"}, {"t": 685.0833333333334, "x": "外国人が来日しています。"}, {"t": 686.95, "x": "ただしこちらは別人です。"}, {"t": 688.7333333333333, "x": "試合記録には、パンチョ・ロザリオという本名が\n併記されています。"}, {"t": 693.0166666666667, "x": "ジョーは1981年の最終シリーズまで、\n12回のシリーズに参加しました。"}, {"t": 698.9166666666666, "x": "団体が終わるまで上がり続けた外国人です。"}, {"t": 701.9833333333333, "x": "金網では、1975年9月17日に\n北九州でマイティ井上と引き分け、同じ年の"}, {"t": 709.05, "x": "10月8日には茨城県の古河市体育館で木村の\nIWA世界ヘビー級王座に挑戦しています。"}, {"t": 715.5333333333333, "x": "1979年11月7日には、\n青森県の弘前市民体育館で"}, {"t": 721.3166666666667, "x": "阿修羅・原とも金網で戦いました。"}, {"t": 723.5833333333334, "x": "WWU世界ジュニアヘビー級選手権で、\n15分13秒の両者ノックアウトです。"}, {"t": 729.9666666666667, "x": "ジョーは2016年6月、\nアメリカ・テネシー州ナッシュビルの"}, {"t": 734.2666666666667, "x": "病院で亡くなりました。"}, {"t": 735.65, "x": "ジョーと木村は、\n金網で何度も向かい合っています。"}, {"t": 739.0833333333334, "x": "その中で、試合の中身まで記事に\n残っているのが1976年12月3日です。"}, {"t": 745.35, "x": "会場は東京・後楽園ホール。"}, {"t": 747.6333333333333, "x": "観衆は2,200人でした。"}, {"t": 749.7666666666667, "x": "IWA世界ヘビー級選手権の金網デスマッチです。"}, {"t": 753.7, "x": "東京スポーツは、この試合をこう伝えています。"}, {"t": 757.1333333333333, "x": "ジョーは太い鉄パイプで木村を失神させると、\n金網のフェンスによじのぼった。"}, {"t": 762.2833333333333, "x": "木村はあらゆる凶器を駆使されながら、\n反則だけせずに耐えた。"}, {"t": 766.4833333333333, "x": "決着は14分37秒、\n木村のノックアウト勝ちでした。"}, {"t": 771.0166666666667, "x": "ジョーの試合については、もう1つ、\n映像の形で残っているものがあります。"}, {"t": 776.6, "x": "1979年5月9日、静岡県焼津市。"}, {"t": 781.0, "x": "アニマル浜口とジプシー・ジョーが対戦しました。"}, {"t": 783.9166666666666, "x": "イメージ映像"}, {"t": 783.9166666666666, "x": "試合記録に残っている決着はリングアウトです。"}, {"t": 787.1, "x": "この試合が東京12チャンネルで\n放送されたときの映像には、"}, {"t": 791.0166666666667, "x": "凄惨な場面のため一部カットしました、という\nテロップが入っています。"}, {"t": 795.9666666666667, "x": "金網デスマッチは、国際プロレスに\n何をもたらしたのでしょうか。"}, {"t": 800.2833333333333, "x": " function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
