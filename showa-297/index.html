<script>
const D={"name": "大阪城ホールの海賊男", "file": "297_編集用", "dur": 918.85, "segs": [], "subs": [{"t": 0.0, "x": "1987年3月26日、大阪城ホールです。"}, {"t": 4.933333333333334, "x": "メインの試合が終わりました。"}, {"t": 6.85, "x": "それでもおよそ3000人の\n客が席を立ちませんでした。"}, {"t": 10.316666666666666, "x": "客席のイスが積み上げられました。"}, {"t": 12.45, "x": "そこに火がつけられました。"}, {"t": 14.066666666666666, "x": "リングにはイスやビールの缶が投げ込まれます。"}, {"t": 16.8, "x": "ゴミも次々に飛びました。"}, {"t": 18.566666666666666, "x": "会場には警察と機動隊が入りました。"}, {"t": 21.35, "x": "消防車まで出ています。"}, {"t": 23.016666666666666, "x": "東京スポーツの記事は、\nこの夜をそう伝えています。"}, {"t": 26.616666666666667, "x": "メインのカードは、\nアントニオ猪木対マサ斎藤でした。"}, {"t": 30.416666666666668, "x": "その試合を壊したのは、\nリングの2人ではありません。"}, {"t": 34.016666666666666, "x": "海賊の衣装を着た、顔の見えない男でした。"}, {"t": 37.46666666666667, "x": "男は手錠を持ってリングに入ってきました。"}, {"t": 40.2, "x": "そして猪木ではなく、\n斎藤の手首に手錠をかけたのです。"}, {"t": 44.25, "x": "この夜のあと、新日本プロレスは\nこの会場を使えなくなります。"}, {"t": 48.65, "x": "使用の許可が3年間おりなかったのです。"}, {"t": 51.416666666666664, "x": "1人の男の乱入が、\n1つの会場を団体から遠ざけました。"}, {"t": 55.983333333333334, "x": "客はなぜ、そこまで怒ったのでしょうか？"}, {"t": 59.266666666666666, "x": "そして海賊男とは、誰だったのでしょうか？"}, {"t": 62.8, "x": "今回は大阪城ホールの海賊男を追います。"}, {"t": 66.01666666666667, "x": "海賊男が初めて現れた1987年2月から始めます。"}, {"t": 70.93333333333334, "x": "大阪の夜を経て、その後の29年までです。"}, {"t": 74.56666666666666, "x": "日付と出来事は、主に2つの記事に照らします。"}, {"t": 78.01666666666667, "x": "東京スポーツと、\nNumber Webの記事です。"}, {"t": 81.08333333333333, "x": "記事で書き方が違うところは、\nどの記事かを言ってから進みます。"}, {"t": 85.23333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 87.71666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 93.3, "x": "まず、この夜にリングで向き合った2人です。"}, {"t": 96.51666666666667, "x": "アントニオ猪木は\n1943年2月20日の生まれです。"}, {"t": 100.73333333333333, "x": "生まれた所は横浜市でした。"}, {"t": 102.76666666666667, "x": "13歳の時に、家族とブラジルの\nサンパウロへ渡りました。"}, {"t": 106.9, "x": "1960年には、遠征中の\n力道山に見いだされます。"}, {"t": 111.51666666666667, "x": "そして日本プロレスに入ります。"}, {"t": 113.61666666666666, "x": "1972年には新日本プロレスを旗揚げしました。"}, {"t": 117.65, "x": "1987年3月の時点で猪木は44歳です。"}, {"t": 122.1, "x": "団体を作ってから15年がたっていました。"}, {"t": 124.96666666666667, "x": "マサ斎藤は1942年8月7日の生まれです。"}, {"t": 128.95, "x": "生まれた所は東京都中野区でした。"}, {"t": 131.33333333333334, "x": "こちらもこの時44歳です。"}, {"t": 133.6, "x": "2人の生まれは半年ほどしか離れていません。"}, {"t": 136.53333333333333, "x": "斎藤は1964年の\n東京オリンピックに出ています。"}, {"t": 140.78333333333333, "x": "種目はレスリングの\nフリースタイルのヘビー級でした。"}, {"t": 144.0, "x": "10月12日、駒沢体育館で\n戦った記録が残っています。"}, {"t": 148.9, "x": "相手はスウェーデンの選手で、引き分けでした。"}, {"t": 152.05, "x": "最終の順位は7位タイでした。"}, {"t": 154.26666666666668, "x": "その後プロレスに入ります。"}, {"t": 156.05, "x": "主な舞台はアメリカのリングでした。"}, {"t": 158.28333333333333, "x": "1984年4月6日、斎藤は\nアメリカで騒ぎに巻き込まれます。"}, {"t": 163.61666666666667, "x": "場所はウィスコンシン州でした。"}, {"t": 165.58333333333334, "x": "泊まっていたホテルの部屋に、\n警官がやって来ます。"}, {"t": 168.98333333333332, "x": "裁判での証言では、警官はおよそ20人でした。"}, {"t": 173.06666666666666, "x": "保釈金は7500ドルです。"}, {"t": 175.3, "x": "当時のお金でおよそ170万円でした。"}, {"t": 178.18333333333334, "x": "判決は1985年6月5日に言い渡されます。"}, {"t": 182.33333333333334, "x": "罪は警察官への暴行と妨害です。"}, {"t": 185.05, "x": "そして逮捕への抵抗でした。"}, {"t": 187.03333333333333, "x": "刑は州の刑務所で2年です。"}, {"t": 189.23333333333332, "x": "7月30日には、ホーキンスという町の\n施設へ移されました。"}, {"t": 193.78333333333333, "x": "警備のゆるい施設で、\n働きながら刑期を過ごす所でした。"}, {"t": 198.0, "x": "その年の11月9日と10日には、\n日本から面会に来た人たちがいます。"}, {"t": 203.18333333333334, "x": "その中の1人が長州力でした。"}, {"t": 205.46666666666667, "x": "記事の見出しには、斎藤が\n長州にかけたひと言が載っています。"}, {"t": 209.73333333333332, "x": "腕相撲やろうか。"}, {"t": 210.98333333333332, "x": "長州はその言葉に驚いたと、\n記事は伝えています。"}, {"t": 214.75, "x": "斎藤が外に出たのは1986年12月2日です。"}, {"t": 219.18333333333334, "x": "1年半の服役でした。"}, {"t": 220.98333333333332, "x": "それから3週間あまりたった、12月25日です。"}, {"t": 225.2, "x": "斎藤はミネソタ州セントポールの\n大会でリングに戻りました。"}, {"t": 229.08333333333334, "x": "ここまでの日付は、東京スポーツの\n写真記者の記事によります。"}, {"t": 233.36666666666667, "x": "東京スポーツの別の記事は、大阪の夜を\n斎藤の新日本への復帰としています。"}, {"t": 238.93333333333334, "x": "2年9か月ぶりの新日本のリングでした。"}, {"t": 241.78333333333333, "x": "1987年の新日本は苦しい時期にありました。"}, {"t": 245.83333333333334, "x": "ここからはNumber \nWebの記事によります。"}, {"t": 248.26666666666668, "x": "猪木は事業で億単位の借金を抱えていました。"}, {"t": 251.45, "x": "団体の人気も下がっていました。"}, {"t": 253.53333333333333, "x": "その中で組まれたのが、大阪の特別な興行です。"}, {"t": 257.31666666666666, "x": "大会の名前は「INOKI闘魂LIVE」の\nパート2でした。"}, {"t": 261.9166666666667, "x": "猪木対斎藤は、猪木の\nデビュー25周年の記念試合でした。"}, {"t": 266.4, "x": "そして長州力が新日本に\n戻ってくる予告編でもありました。"}, {"t": 270.46666666666664, "x": "刑務所の斎藤に会いに行った長州です。"}, {"t": 273.18333333333334, "x": "ここでもう1つの話をしておきます。"}, {"t": 275.6, "x": "海賊男です。"}, {"t": 276.9166666666667, "x": "初めて姿を見せたのは、\n大阪の大会の44日前でした。"}, {"t": 281.71666666666664, "x": "1987年2月10日、\nアメリカのフロリダ州タンパです。"}, {"t": 286.65, "x": "会場はスパルタン・スポーツアリーナでした。"}, {"t": 289.18333333333334, "x": "この日は、海外に遠征していた武藤敬司が\n試合をしていました。"}, {"t": 293.6333333333333, "x": "そこへホッケーマスクの男が入ってきます。"}, {"t": 296.35, "x": "着ていたのは海賊の衣装でした。"}, {"t": 298.45, "x": "男は手にした杖で武藤を襲います。"}, {"t": 300.9, "x": "この場面は、テレビ朝日の\n「ワールドプロレスリング」で流れました。"}, {"t": 305.6166666666667, "x": "タンパにはガスパレラという海賊の\n祭りがあります。"}, {"t": 308.7, "x": "東京スポーツの記事は、\nこの祭りを海賊男の元としています。"}, {"t": 313.1166666666667, "x": "猪木の思いつきだったという話もある、とも\n書いています。"}, {"t": 316.9, "x": "タンパに現れた海賊男の中身は猪木だった。"}, {"t": 320.06666666666666, "x": "それが今では通説だ、と記事は続けています。"}, {"t": 323.5, "x": "その後は日本のリングにも現れるようになります。"}, {"t": 326.51666666666665, "x": "忘れた頃に出てきては、\n試合に割って入りました。"}, {"t": 330.0, "x": "狙う相手も目的も読めない乱入でした。"}, {"t": 332.6666666666667, "x": "Number Webの記事にも、\n海賊男の話が出てきます。"}, {"t": 336.6333333333333, "x": "海賊男は、猪木あてに挑戦状を送っていました。"}, {"t": 340.55, "x": "そして迎えた1987年3月26日の夜です。"}, {"t": 344.98333333333335, "x": "場所は大阪市の大阪城ホールでした。"}, {"t": 347.6, "x": "メインのリングで、猪木と斎藤が向き合います。"}, {"t": 351.03333333333336, "x": "2人とも44歳です。"}, {"t": 352.96666666666664, "x": "斎藤にとっては、2年9か月ぶりの\n新日本のリングでした。"}, {"t": 357.35, "x": "タンパに海賊男が出てから\n44日がたっていました。"}, {"t": 361.0, "x": "試合の途中で海賊男がリングに入ってきました。"}, {"t": 364.35, "x": "手には手錠がありました。"}, {"t": 365.95, "x": "男は斎藤の手首と自分の手首を手錠でつなぎます。"}, {"t": 369.53333333333336, "x": "そのまま斎藤を控室のほうへ連れて行きました。"}, {"t": 372.65, "x": "リングに残ったのは猪木だけです。"}, {"t": 374.73333333333335, "x": "しばらくして斎藤がリングに戻ってきました。"}, {"t": 377.51666666666665, "x": "東京スポーツの記事が、\nその時の様子を伝えています。"}, {"t": 381.3666666666667, "x": "斎藤は、手錠を引きちぎって戻ったといいます。"}, {"t": 384.8833333333333, "x": "試合はもう一度始まります。"}, {"t": 386.93333333333334, "x": "けれども結末は斎藤の反則負けでした。"}, {"t": 389.78333333333336, "x": "記録の上では、猪木の反則勝ちです。"}, {"t": 392.76666666666665, "x": "フォールでもギブアップでもない幕切れでした。"}, {"t": 395.26666666666665, "x": "ここから会場の空気が変わります。"}, {"t": 397.53333333333336, "x": "すっきりしない展開に客席から罵声が飛びました。"}, {"t": 400.81666666666666, "x": "東京スポーツの記事は、その先の\nきっかけを猪木のマイクとしています。"}, {"t": 405.4, "x": "猪木がマイクで話したあと、\n客席が荒れ始めたというのです。"}, {"t": 409.4, "x": "リングに向かってイスが投げ込まれました。"}, {"t": 411.71666666666664, "x": "ビールの缶も飛びました。"}, {"t": 413.31666666666666, "x": "ゴミも飛びました。"}, {"t": 414.46666666666664, "x": "別の東京スポーツの記事もあります。"}, {"t": 416.8666666666667, "x": "そこでは、帰らなかった客を\nおよそ3000人としています。"}, {"t": 421.01666666666665, "x": "客はイスを積み上げました。"}, {"t": 422.8, "x": "そしてそこに火をつけました。"}, {"t": 424.6, "x": "Number Webの記事には、\n大阪府警の機動隊が出たとあります。"}, {"t": 428.93333333333334, "x": "東京スポーツの記事には、\n警察と機動隊も出たとあります。"}, {"t": 433.06666666666666, "x": "それに消防車も出たと書かれています。"}, {"t": 435.48333333333335, "x": "Number Webには別の記事もあります。"}, {"t": 437.81666666666666, "x": "その記事は、この夜の出来事を\n「放火騒ぎ」と呼んでいます。"}, {"t": 441.76666666666665, "x": "その頃、控室では何が起きていたのでしょうか？"}, {"t": 445.3666666666667, "x": "当時、東京スポーツでプロレスを\n担当していた記者がいます。"}, {"t": 449.5833333333333, "x": "その記者が2022年に、\nこの夜を振り返っています。"}, {"t": 453.7, "x": "記事によると、控室はお通夜のような空気でした。"}, {"t": 457.21666666666664, "x": "外からは客の怒鳴る声が聞こえてきます。"}, {"t": 459.8833333333333, "x": "その声はだんだん大きくなっていきました。"}, {"t": 462.46666666666664, "x": "猪木は目を落として黙っていました。"}, {"t": 464.6666666666667, "x": "そこへ、記者の1人が質問をします。"}, {"t": 467.76666666666665, "x": "猪木さん、マットは硬かったですか。"}, {"t": 470.8, "x": "同じ質問がもう一度繰り返されました。"}, {"t": 473.43333333333334, "x": "すると猪木は、大きな声を上げて跳ね起きます。"}, {"t": 476.9166666666667, "x": "白いブリーフ1枚のまま、\n控室のドアへ走りました。"}, {"t": 480.9, "x": "レスラーたちが止めに入ります。"}, {"t": 482.8666666666667 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
