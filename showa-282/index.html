<script>
const D={"name": "引き分けのあとの猪木とアリ", "file": "282_編集用", "dur": 958.4, "segs": [], "subs": [{"t": 0.0, "x": "最後のゴングが鳴っても、\n勝った方の名前は呼ばれませんでした。"}, {"t": 4.333333333333333, "x": "舞台は1976年6月26日の日本武道館です。"}, {"t": 9.133333333333333, "x": "リングにいたのは、アントニオ猪木と\nモハメド・アリでした。"}, {"t": 12.733333333333333, "x": "3分15回を戦い終えたところです。"}, {"t": 15.45, "x": "3人のジャッジの採点は、\n3人とも違う答えでした。"}, {"t": 19.516666666666666, "x": "結果は引き分けです。"}, {"t": 20.966666666666665, "x": "その夜、新宿のホテルの\n前に1台の車が着きました。"}, {"t": 25.0, "x": "降りてきたのはアリでした。"}, {"t": 26.516666666666666, "x": "ロビーでその姿を見た関係者がのちに\n証言しています。"}, {"t": 30.15, "x": "アリは、両脇を抱えられて\nホテルに入ってきました。"}, {"t": 33.766666666666666, "x": "脚が痛そうでした。"}, {"t": 35.233333333333334, "x": "1人では歩けない様子だったといいます。"}, {"t": 37.7, "x": "世紀の凡戦と呼ばれた15回の間に、\nリングでは何が起きていたのでしょうか？"}, {"t": 43.21666666666667, "x": "そして引き分けた2人は、そのあと\n何十年をどう過ごしたのでしょうか？"}, {"t": 47.93333333333333, "x": "今回は、試合の中身と試合の\nあとの2人を追います。"}, {"t": 51.8, "x": "当事者の証言と、当時の\n記録をもとに辿っていきます。"}, {"t": 55.733333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.233333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 63.8, "x": "まずアリのことです。"}, {"t": 65.08333333333333, "x": "アリは、1964年に\n世界ヘビー級の王者になりました。"}, {"t": 69.8, "x": "その後ベトナム戦争への徴兵を拒みます。"}, {"t": 72.76666666666667, "x": "王座を奪われ、ボクシングの\n許可も取り消されました。"}, {"t": 76.36666666666666, "x": "のちに裁判で無罪を勝ち取っています。"}, {"t": 78.83333333333333, "x": "3年7か月のブランクを経て、\n1970年10月にリングへ戻りました。"}, {"t": 84.48333333333333, "x": "1974年にはキンシャサで王者を倒し、\n王座に返り咲いています。"}, {"t": 89.85, "x": "その2年後に日本へやって来たのです。"}, {"t": 92.26666666666667, "x": "試合の前から2人のやりとりは激しいものでした。"}, {"t": 95.48333333333333, "x": "猪木はアリに迫ります。"}, {"t": 97.08333333333333, "x": "すべてを賭ける度胸があるか。"}, {"t": 99.0, "x": "アリはこれに応じました。"}, {"t": 100.63333333333334, "x": "勝った方が興行の収入を全部\n取る、という契約に署名したのです。"}, {"t": 105.53333333333333, "x": "署名するアリを見て、\n猪木はつぶやいたと伝えられています。"}, {"t": 109.55, "x": "ペンが震えてら。"}, {"t": 110.75, "x": "猪木は、アリへの贈り物も用意していました。"}, {"t": 113.98333333333333, "x": "骨折したときに使うギプスです。"}, {"t": 116.08333333333333, "x": "アリは怒りました。"}, {"t": 117.35, "x": "この場でやろうと言って猪木に\n飛びかかりかけます。"}, {"t": 120.11666666666666, "x": "周りの人たちがこれを止めました。"}, {"t": 122.2, "x": "アリの陣営は強く抗議します。"}, {"t": 124.43333333333334, "x": "勝った方が全部を取る契約は、取り消されました。"}, {"t": 127.95, "x": "来日した当初のアリについて、\nこう伝えられています。"}, {"t": 131.7, "x": "プロレスの試合をするつもりだったというのです。"}, {"t": 134.4, "x": "アリのマネジャーは、元プロレスラーでした。"}, {"t": 137.21666666666667, "x": "アリは、猪木をペリカン野郎と呼んでいました。"}, {"t": 140.36666666666667, "x": "猪木を撮り続けてきた写真家がいます。"}, {"t": 142.86666666666667, "x": "その写真家は書いています。"}, {"t": 144.71666666666667, "x": "アリは次第に、猪木を恐れるようになった。"}, {"t": 147.71666666666667, "x": "猪木の公開練習も、アリの陣営を動かしました。"}, {"t": 151.53333333333333, "x": "猪木はそこで激しい打撃を見せます。"}, {"t": 154.06666666666666, "x": "アリの陣営は警戒を強めました。"}, {"t": 156.43333333333334, "x": "そして肘打ちを禁じさせます。"}, {"t": 158.58333333333334, "x": "立ったままの蹴りも、\n禁じるルールに変えさせました。"}, {"t": 162.01666666666668, "x": "実況を担当したのは、\nアナウンサーの舟橋慶一です。"}, {"t": 166.08333333333334, "x": "舟橋もアリの変化を見ていました。"}, {"t": 168.33333333333334, "x": "6月20日、後楽園ホールで猪木の\n公開スパーリングがありました。"}, {"t": 173.16666666666666, "x": "舟橋によれば、これを見てから\nアリの態度が明らかに変わります。"}, {"t": 177.36666666666667, "x": "アリはこう考えていたのではないか。"}, {"t": 179.61666666666667, "x": "パンチをかいくぐって攻められたらどうなるのか。"}, {"t": 182.23333333333332, "x": "舟橋はそう推し量っています。"}, {"t": 184.31666666666666, "x": "ルールは、当日の朝まで決まっていませんでした。"}, {"t": 187.71666666666667, "x": "両方の陣営が合意したのは、\n6月26日の早朝です。"}, {"t": 192.31666666666666, "x": "それでも、ルールの\n考え方ははっきりしていました。"}, {"t": 195.86666666666667, "x": "ボクサーのアリは、\n立ったまま殴って相手を倒します。"}, {"t": 199.55, "x": "レスラーの猪木は、組みついて相手を倒します。"}, {"t": 202.93333333333334, "x": "そして寝た形で関節技を極め、決着をつけます。"}, {"t": 207.06666666666666, "x": "格闘技の歴史を書いてきた作家の\n1人は、こう評しています。"}, {"t": 211.21666666666667, "x": "今の総合格闘技の目で見ても、\n妥当なルールだった。"}, {"t": 215.15, "x": "試合の発表は、アメリカの\nプロレス雑誌も取り上げています。"}, {"t": 219.33333333333334, "x": "1976年の7月号です。"}, {"t": 222.23333333333332, "x": "演台の前で、着物姿の猪木が手を挙げました。"}, {"t": 225.86666666666667, "x": "その左にアリが立っていました。"}, {"t": 227.86666666666667, "x": "2人が並んで試合を発表した場面として、\n伝えられました。"}, {"t": 232.05, "x": "試合の当日、舟橋は放送席から\n2人の顔を見ています。"}, {"t": 236.63333333333333, "x": "猪木の表情は、いつもの試合とは違いました。"}, {"t": 239.98333333333332, "x": "舟橋はこう話しています。"}, {"t": 241.88333333333333, "x": "どこか不安を帯びていました。"}, {"t": 243.63333333333333, "x": "アリもまた、戸惑っているような顔に\n見えたそうです。"}, {"t": 247.15, "x": "この試合はいったい\nどうなるんだ、という顔でした。"}, {"t": 250.46666666666667, "x": "それでも舟橋は、こうした不安を\n実況では口にしませんでした。"}, {"t": 254.95, "x": "ゴングが鳴りました。"}, {"t": 256.21666666666664, "x": "猪木は、マットを滑るようにして\nアリの脚を蹴ります。"}, {"t": 259.9, "x": "会場はこの一撃で沸きました。"}, {"t": 262.06666666666666, "x": "その場面を覚えているのが藤原喜明です。"}, {"t": 265.0833333333333, "x": "当時は新日本プロレスの若手でした。"}, {"t": 267.56666666666666, "x": "藤原は、この試合に向けた猪木の\n練習の相手を務めています。"}, {"t": 272.06666666666666, "x": "試合の前は巡業を2シリーズ休み、\n猪木に付き添いました。"}, {"t": 276.48333333333335, "x": "最初の蹴りのあと、猪木は遠い間合いを保ちます。"}, {"t": 280.1, "x": "仰向けの形からアリの脚を何度も蹴りました。"}, {"t": 283.0, "x": "あの写真家は、その蹴りには\n殺気があったと書いています。"}, {"t": 286.8333333333333, "x": "アリは、立ち上がれと言って猪木を挑発しました。"}, {"t": 290.35, "x": "口汚い言葉で、\n猪木をののしり続けたとも書かれています。"}, {"t": 294.56666666666666, "x": "猪木は、アリのパンチをかわして組みつけません。"}, {"t": 297.85, "x": "アリも、寝ている猪木の上から殴れませんでした。"}, {"t": 301.3833333333333, "x": "互いに相手の得意な形には入りません。"}, {"t": 304.1333333333333, "x": "そのまま回が進んでいきます。"}, {"t": 306.1666666666667, "x": "武道館のリングで、アリは\n仰向けの猪木に向かって叫びます。"}, {"t": 310.4166666666667, "x": "口を大きく開け、両方の拳を握っていました。"}, {"t": 314.05, "x": "猪木は、仰向けのまま脚を蹴り続けます。"}, {"t": 317.23333333333335, "x": "アメリカの通信社も、\nこの場面を世界に伝えています。"}, {"t": 321.1666666666667, "x": "6回、猪木の肘がアリの顔に入りました。"}, {"t": 324.53333333333336, "x": "肘打ちは禁じられています。"}, {"t": 326.45, "x": "これは反則でした。"}, {"t": 327.9, "x": "プロレスを長く書いてきた作家は、\n別の見方をしています。"}, {"t": 331.8666666666667, "x": "この肘打ちは、\n寸止めのような形だったというのです。"}, {"t": 335.6, "x": "アリのセコンドは、反則を\n理由にもうやめろと言いました。"}, {"t": 339.45, "x": "アリの答えは、俺はやる、でした。"}, {"t": 342.56666666666666, "x": "試合はそのまま続きます。"}, {"t": 344.46666666666664, "x": "6回のあとも、試合は大きくは動きませんでした。"}, {"t": 348.1666666666667, "x": "猪木がタックルを試みる場面がありました。"}, {"t": 350.9166666666667, "x": "アリは、左のジャブで猪木を寄せつけません。"}, {"t": 354.03333333333336, "x": "それでも、基本は猪木の蹴りに\nアリがこらえる形でした。"}, {"t": 357.8833333333333, "x": "藤原はアリのパンチを数えています。"}, {"t": 360.3666666666667, "x": "アリが出したパンチは、\n5発だけだったそうです。"}, {"t": 363.56666666666666, "x": "舟橋は、猪木の戦い方をこう見ています。"}, {"t": 366.8833333333333, "x": "猪木は勝てると思っていたはずです。"}, {"t": 369.1, "x": "ただ、アリにひどい\nけがをさせることには迷いがあった。"}, {"t": 372.73333333333335, "x": "それが、蹴りを中心にした戦い方につながった。"}, {"t": 376.43333333333334, "x": "これが舟橋の見立てです。"}, {"t": 378.2, "x": "猪木のコーナーには、\n師匠のカール・ゴッチがいました。"}, {"t": 381.6666666666667, "x": "日本プロレスの時代に、\n若手にレスリングを教えた人物です。"}, {"t": 385.96666666666664, "x": "新日本プロレスの旗揚げ戦では、\n猪木と戦っています。"}, {"t": 390.0833333333333, "x": "舟橋が覚えているのは、ゴッチの沈黙でした。"}, {"t": 393.5, "x": "試合中に助言をする姿は、\n見られなかったといいます。"}, {"t": 397.5, "x": "数日後、舟橋は通訳を介して理由を尋ねました。"}, {"t": 401.53333333333336, "x": "ゴッチは、笑って天井を見上げただけでした。"}, {"t": 404.75, "x": "何も答えなかったそうです。"}, {"t": 406.6, "x": "15回が終わっても、決着はつきませんでした。"}, {"t": 410.15, "x": "勝敗は判定に持ち込まれます。"}, {"t": 412.4166666666667, "x": "ジャッジの1人は、\n元プロレスラーの遠藤幸吉でした。"}, {"t": 416.21666666666664, "x": "藤原によれば、遠藤の採点はアリの勝ちでした。"}, {"t": 419.9, "x": "藤原は、攻めた数なら猪木が\n勝ったと思ったそうです。"}, {"t": 423.78333333333336, "x": "残る2人の採点も揃いません。"}, {"t": 426.05, "x": "結果は三者三様の引き分けでした。"}, {"t": 428.55, "x": "藤原は、年月がたってから振り返っています。"}, {"t": 432.01666666666665, "x": "引き分けでよかったのかもしれない。"}, {"t": 434.03333333333336, "x": "藤原はこうも話しています。"}, {"t": 436.06666666666666, "x": "真剣勝負というのは、生きるか死ぬかなんです。"}, {"t": 439.48333333333335, "x": "舟橋は、2人が無事に\n試合を終えたことにほっとしたそうです。"}, {"t": 443.68333333333334, "x": "試合のあと、2人は肩を抱き合いました。"}, {"t": 446.75, "x": "舟橋は、これを無言の\n会話を交わしたしるしだと見ています。"}, {"t": 450.8666666666667, "x": "あの作家も、2人が\n抱き合ったことを書き残しています。"}, {"t": 454.5, "x": "翌日の新聞は、試合を厳しく批判しました。"}, {"t": 458.1666666666667, "x": "世紀の凡戦、茶番劇という言葉が並びます。"}, {"t": 461.8666666666667, "x": "猪木の話では、新日本プロレスは\n三十数億円の借金を背負いました。"}, {"t": 467.25, "x": "舟橋は、批判が猪木に集まると見ていました。"}, {"t": 470.6166666666667, "x": "仰向けで蹴り続けたのは、猪木だったからです。"}, {"t": 473.8, "x": "試合のあとの取材で、\n猪木は淡々と答えたといいます。"}, {"t let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
