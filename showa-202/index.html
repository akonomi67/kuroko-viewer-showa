3333333, "i": 179}, {"t": 624.1166666666667, "i": 180}, {"t": 629.3833333333333, "i": 181}, {"t": 635.6666666666666, "i": 182}, {"t": 638.7, "i": 183}, {"t": 643.3166666666667, "i": 184}, {"t": 648.9333333333333, "i": 185}, {"t": 655.3333333333334, "i": 186}, {"t": 660.4, "i": 187}, {"t": 666.3833333333333, "i": 188}, {"t": 669.6666666666666, "i": 189}, {"t": 671.65, "i": 190}, {"t": 676.2333333333333, "i": 191}, {"t": 679.2833333333333, "i": 192}, {"t": 681.4333333333333, "i": 193}, {"t": 684.4333333333333, "i": 194}, {"t": 690.4166666666666, "i": 195}, {"t": 696.1, "i": 196}, {"t": 699.8666666666667, "i": 197}, {"t": 703.1, "i": 198}, {"t": 707.5666666666667, "i": 199}, {"t": 712.1333333333333, "i": 200}, {"t": 715.5166666666667, "i": 201}, {"t": 719.9833333333333, "i": 202}, {"t": 724.5666666666667, "i": 203}, {"t": 727.1666666666666, "i": 204}, {"t": 732.9, "i": 205}, {"t": 736.55, "i": 206}, {"t": 739.0833333333334, "i": 207}, {"t": 744.1, "i": 208}, {"t": 750.2166666666667, "i": 209}, {"t": 755.8, "i": 210}, {"t": 760.5, "i": 211}, {"t": 763.8833333333333, "i": 212}, {"t": 768.6833333333333, "i": 213}, {"t": 772.2, "i": 214}, {"t": 775.5666666666667, "i": 215}, {"t": 781.5333333333333, "i": 216}], "subs": [{"t": 0.0, "x": "1990年4月19日、横浜文化体育館。"}, {"t": 4.666666666666667, "x": "リングの上に、全日本プロレスの\n二枚看板が向かい合って立っていました。"}, {"t": 9.4, "x": "ジャンボ鶴田と、天龍源一郎です。"}, {"t": 12.4, "x": "このカードは、当時の日本で最も客が\n呼べる組み合わせのひとつでした。"}, {"t": 17.166666666666668, "x": "鶴龍対決と呼ばれ、何度も武道館を\n満員にしてきた顔合わせです。"}, {"t": 22.066666666666666, "x": "この日、天龍は負けました。"}, {"t": 24.433333333333334, "x": "そしてこれが、天龍源一郎が全日本プロレスの\nリングに上がった最後の試合になります。"}, {"t": 30.416666666666668, "x": "3日後の4月22日、天龍は\nジャイアント馬場に辞表を出しました。"}, {"t": 35.4, "x": "受理されたのは4月26日です。"}, {"t": 37.86666666666667, "x": "今回は、天龍源一郎が\n全日本プロレスを出た1990年の"}, {"t": 43.03333333333333, "x": "春に何が起きていたのかを、具体的な\n日付と数字をもとに辿っていきます。"}, {"t": 47.833333333333336, "x": "最後までご覧いただければ幸いです。"}, {"t": 50.333333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 55.916666666666664, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 59.71666666666667, "x": "天龍源一郎、1950年2月2日の生まれ。"}, {"t": 63.95, "x": "出身は福井県です。"}, {"t": 65.73333333333333, "x": "最初の職業は\nプロレスラーではありません。相撲です。"}, {"t": 69.43333333333334, "x": "初土俵は1964年1月。"}, {"t": 72.38333333333334, "x": "まだ13歳でした。"}, {"t": 73.88333333333334, "x": "そこから9年かけて、1973年1月に\n新入幕を果たしています。"}, {"t": 79.71666666666667, "x": "関取として土俵に上がり、\n幕内力士としての記録も残しました。"}, {"t": 84.48333333333333, "x": "しかし1976年9月、廃業します。"}, {"t": 88.43333333333334, "x": "26歳でした。"}, {"t": 89.81666666666666, "x": "そして翌10月、\n全日本プロレスに入団しています。"}, {"t": 93.76666666666667, "x": "相撲を捨ててプロレスに\n移った選手は他にもいますが、"}, {"t": 96.98333333333333, "x": "幕内まで上がった人間が20代半ばで\n転向した例は多くありません。"}, {"t": 102.03333333333333, "x": "関取になるまでに9年かかっています。"}, {"t": 104.63333333333334, "x": "その9年を、26歳で捨てたということです。"}, {"t": 108.21666666666667, "x": "入門から数年は、若手として下から\n積み上げる時期が続きました。"}, {"t": 112.85, "x": "アメリカにも出ています。"}, {"t": 114.31666666666666, "x": "記録では、デビュー戦はテキサスでした。"}, {"t": 117.28333333333333, "x": "日本に戻ってきてからは、\nジャンボ鶴田に次ぐ位置に置かれます。"}, {"t": 121.31666666666666, "x": "1980年代前半の全日本プロレスで、\n天龍は「鶴田の次」でした。"}, {"t": 126.95, "x": "そしてその位置は、なかなか動きませんでした。"}, {"t": 130.16666666666666, "x": "ここで、当時の全日本プロレスの\n構造を確認しておきます。"}, {"t": 134.45, "x": "社長はジャイアント馬場。"}, {"t": 136.13333333333333, "x": "日本人のエースはジャンボ鶴田。"}, {"t": 138.21666666666667, "x": "そして外国人選手の顔ぶれが、\n当時の日本で最も豪華でした。"}, {"t": 143.03333333333333, "x": "アブドーラ・ザ・ブッチャー。"}, {"t": 144.45, "x": "ザ・ファンクス。"}, {"t": 145.31666666666666, "x": "スタン・ハンセン。"}, {"t": 146.38333333333333, "x": "ブルーザー・ブロディ。"}, {"t": 147.53333333333333, "x": "看板になるカードは、日本人対外国人です。"}, {"t": 151.1, "x": "日本人同士は、鶴田と天龍を除けば\nほとんど組まれませんでした。"}, {"t": 155.66666666666666, "x": "当時のプロレスでは、それが普通の作り方です。"}, {"t": 159.1, "x": "この構造を内側から壊したのが、天龍でした。"}, {"t": 162.73333333333332, "x": "1987年、天龍は鶴田に\n本気で向かっていきます。"}, {"t": 167.66666666666666, "x": "のちに天龍革命と呼ばれる動きです。"}, {"t": 170.21666666666667, "x": "先輩であり、団体のエースであり、社長が一番\n大事にしている選手に、正面から仕掛けました。"}, {"t": 177.66666666666666, "x": "このとき天龍は37歳。"}, {"t": 179.78333333333333, "x": "プロレスラーとしては、遅い勝負でした。"}, {"t": 182.61666666666667, "x": "同じ時期、天龍は阿修羅・原と組んでいます。"}, {"t": 185.93333333333334, "x": "龍原砲と呼ばれたタッグです。"}, {"t": 187.93333333333334, "x": "このコンビで鶴田と谷津嘉章の\n組に向かっていったことで、"}, {"t": 191.35, "x": "日本人対日本人のカードが興行の\n柱として通用することが証明されました。"}, {"t": 196.76666666666668, "x": "このとき天龍がやったのは、単に\n反抗することではありません。"}, {"t": 200.91666666666666, "x": "日本人同士の試合を、外国人との\n試合よりも激しいものにしたことです。"}, {"t": 206.11666666666667, "x": "甲高い音が出る張り手、頭から\n落とす技、痛みが伝わる攻防。"}, {"t": 211.33333333333334, "x": "全日本のリングの温度が、ここで変わりました。"}, {"t": 214.6, "x": "若い選手も引き上げています。"}, {"t": 216.6, "x": "川田利明、サムソン冬木といった選手が、\nこの時期に上の試合に絡み始めました。"}, {"t": 222.9, "x": "1988年から1989年にかけて、\n全日本プロレスの日本人対決は、"}, {"t": 229.73333333333332, "x": "興行の看板になります。"}, {"t": 231.76666666666668, "x": "天龍がやったことは、団体の商品を\n作り替えたということでした。"}, {"t": 236.35, "x": "ここは押さえておく価値があります。"}, {"t": 238.41666666666666, "x": "このあと全日本プロレスは、\n三沢光晴、川田利明、小橋建太、"}, {"t": 244.15, "x": "田上明による四天王プロレスで\n1990年代の黄金期を迎えます。"}, {"t": 249.73333333333332, "x": "日本人同士が最も激しい\n試合をやる、という形式です。"}, {"t": 254.16666666666666, "x": "その形式を先に作ったのが、天龍でした。"}, {"t": 257.55, "x": "そして1990年、その天龍が出て行きます。"}, {"t": 261.7, "x": "きっかけを持ってきたのは、\nケンドー・ナガサキこと桜田一男でした。"}, {"t": 266.01666666666665, "x": "メガネスーパーという会社の社長が\nプロレス団体を作りたがっている、"}, {"t": 270.1333333333333, "x": "天龍に入ってほしいと言っている。"}, {"t": 272.6, "x": "そういう話です。"}, {"t": 274.0, "x": "メガネスーパーは、当時全国に店舗を\n広げていた眼鏡チェーンです。"}, {"t": 278.71666666666664, "x": "社長の名前は田中八郎。"}, {"t": 280.75, "x": "プロレスの世界の人ではありません。"}, {"t": 282.9166666666667, "x": "つまり、プロレス団体を作るのが\nプロレスラーではなく、企業だったということです。"}, {"t": 288.46666666666664, "x": "これは日本のプロレスで初めての形でした。"}, {"t": 291.26666666666665, "x": "新しい団体の名前は、SWS。"}, {"t": 294.56666666666666, "x": "スーパー・ワールド・スポーツの略です。"}, {"t": 296.78333333333336, "x": "設立発表会が開かれたのは\n1990年5月10日、ホテルオークラでした。"}, {"t": 302.68333333333334, "x": "会場はプロレスの記者会見の\n雰囲気ではありませんでした。"}, {"t": 306.3333333333333, "x": "一般企業の新規事業発表と同じ形式です。"}, {"t": 309.73333333333335, "x": "このこと自体が、当時の\nプロレス界を刺激しました。"}, {"t": 313.28333333333336, "x": "それまでの日本のプロレス団体は、力道山、馬場、\n猪木のように、選手が自分で作るものでした。"}, {"t": 321.31666666666666, "x": "選手が社長で、選手が興行を\n組み、選手が金を集める。"}, {"t": 326.15, "x": "資金が細れば、そのまま団体が細ります。"}, {"t": 329.5, "x": "SWSはそこが違いました。"}, {"t": 331.8, "x": "金を出すのは本業で稼いでいる会社です。"}, {"t": 334.68333333333334, "x": "プロレスの興行成績と、団体の\n存続が直接結びついていない。"}, {"t": 339.6166666666667, "x": "これは当時としては、\nまったく新しい前提でした。"}, {"t": 343.3833333333333, "x": "そして、数字がひとつ独り歩きします。"}, {"t": 346.3, "x": "天龍の契約金3億円。"}, {"t": 348.51666666666665, "x": "この数字は正式に\n発表されたものではありません。"}, {"t": 351.76666666666665, "x": "資料でも「3億円とも言われている」と\nいう書かれ方をしています。"}, {"t": 355.65, "x": "それでも、この数字だけが広がりました。"}, {"t": 358.6333333333333, "x": "ここから始まったのが、\nSWSに対する批判です。"}, {"t": 362.73333333333335, "x": "当時最も影響力があった\nプロレス専門誌、週刊プロレスは、"}, {"t": 367.28333333333336, "x": "この団体を「金権プロレス」と呼びました。"}, {"t": 370.06666666666666, "x": "プロレスは金で買えるものではない、\n天龍はギャラで動いたのだ。"}, {"t": 374.3, "x": "そういう論調です。"}, {"t": 375.8333333333333, "x": "批判は団体だけでなく、\n天龍個人にも向きました。"}, {"t": 379.7, "x": "全日本の看板を張っていた選手が、金額を\n理由に会社を移った、という見られ方です。"}, {"t": 386.46666666666664, "x": "そして批判は、\n記事だけでは終わりませんでした。"}, {"t": 389.8833333333333, "x": "SWSと週刊プロレスは、取材そのものが\n成り立たない関係になっていきます。"}, {"t": 395.4166666666667, "x": "当時、専門誌に載らないということは、\nファンに情報が届かないということでした。"}, {"t": 401.05, "x": "テレビ中継が弱い団体にとって、\nこれは興行に直接響きます。"}, {"t": 405.9166666666667, "x": "新しい団体が、いちばん影響力のある\nメディアと最初から敵対する。"}, {"t": 410.8, "x": "SWSが背負った条件は、金額とは\n別のところで重いものでした。"}, {"t": 415.98333333333335, "x": "ここで、天龍の側の説明も確認しておきます。"}, {"t": 419.71666666666664, "x": "天龍は退団にあたって、\n馬場と何度も話し合ったこと、"}, {"t": 423.6333333333333, "x": "円満に退社したこと、\n全日本から他の選手を"}, {"t": 427.46666666666664, "x": "引き抜くつもりはないことを説明しています。"}, {"t": 429.96666666666664, "x": "新団体でやりたいのはプロレス界を\n変えることだ、という言い方もしていました。"}, {"t": 434.95, "x": "実際にどうだったかは、外から断定できません。"}, {"t": 438.4166666666667, "x": "ただ、記録の上では、辞表は4月22日に出され、\n4月26日に受理されています。"}, {"t": 445.45, "x": "黙って消えたわけではなく、\n手続きは踏まれていました。"}, {"t": 449.18333333333334, "x": "一方で、全日本プロレスから移った\n選手は天龍1人ではありませんでした。"}, {"t": 454.45, "x": "谷津嘉章、サムソン冬木、仲野信市といった\n名前が、この時期にSWSへ移っています。"}, {"t": 462.0, "x": "天龍が育ててきた側の選手が、\nまとまって抜けた形です。"}, {"t": 466.2, "x": "全日本プロレスにとっては、看板と、その\n下の層を同時に失ったことになります。"}, {"t": 472.18333333333334, "x": "1990年春の全日本は、外から\n見えていた以上に危ない状態でした。"}, {"t": 477.9166666666667, "x": "SWSは、その後どう動いたのか。"}, {"t": 480.96666666666664, "x": "団体の構造は、それまでの\n日本のプロレスと違いました。"}, {"t": 484.98333333333335, "x": "「道場制」と呼ばれる仕組みで、\n団体の中に3つの部屋を置いています。"}, {"t": 489.5833333333333, "x": "天龍が道場主のレボリューション。"}, {"t": 491.78333333333336, "x": "若松市政が道場主の檄。"}, {"t": 493.96666666666664, "x": "ジョージ高野が道場主のパライストラ。"}, {"t": 496.4, "x": "相撲の部屋制度に近い形です。"}, {"t": 498.8333333333333, "x": "相撲出身の天龍がいる\n団体らしい設計ではありました。"}, {"t": 502.68333333333334, "x": "資金は潤沢でした。"}, {"t": 504.31666666666666, "x": "1990年11月20日には、アメリカの\nWWFと2年間の業務提携を結んでいます。"}, {"t": 511.8333333333333, "x": "当時、日本の団体がWWFと正面から\n手を組むのは異例のことでした。"}, {"t": 517.3333333333334, "x": "そして、2年間でプロレスに投じられた\n金額は、およそ99億円と記録されています。"}, {"t": 524.05, "x": "旗揚げまでの流れも見ておきます。"}, {"t": 526.2333333333333, "x": "プレ旗揚げ戦は1990年9月29日、\n福井市体育館。"}, {"t": 531.5833333333334, "x": "天龍の地元です。"}, {"t": 532.9666666666667, "x": "興行名は「越前闘会始」でした。"}, {"t": 535.7666666666667, "x": "正式な旗揚げは1990年10月18日と\n19日、横浜アリーナでの2連戦。"}, {"t": 542.6, "x": "「闘会始'90」という名前がついています。"}, {"t": 546.3, "x": "会場も規模も、新団体としては破格でした。"}, {"t": 549.7333333333333, "x": "ただし、内側には無理がありました。"}, {"t": 552.6833333333333, "x": "道場制は、3つの部屋がそれぞれ\n独立して選手を抱える仕組みです。"}, {"t": 557.6166666666667, "x": "これは相撲ではうまく回りますが、\nプロレスでは部屋ごとの対立を生みました。"}, {"t": 562.5166666666667, "x": "当時この団体にいた選手の証言も残っています。"}, {"t": 565.8333333333334, "x": "部屋制にしたことが派閥争いの温床になった。"}, {"t": 569.0166666666667, "x": "あの部屋の選手ばかりかわいがっている、\n対戦カードがレボリューションに偏りすぎだ。"}, {"t": 574.2333333333333, "x": "そういう声が内側から出ていた、という話です。"}, {"t": 577.9333333333333, "x": "どの部屋の選手を上に置くのかで\n揉めれば、カードが決まりません。"}, {"t": 582.15, "x": "外からは金権と叩かれ、内では部屋が割れる。"}, {"t": 585.8166666666667, "x": "資金だけがあって、それ以外の\n条件がすべて悪い状態でした。"}, {"t": 590.3166666666667, "x": "1992年5月23日に活動休止が決まります。"}, {"t": 594.7666666666667, "x": "最終興行は6月19日、長崎国際体育館でした。"}, {"t": 599.6666666666666, "x": "旗揚げから2年足らずです。"}, {"t": 601.5333333333333, "x": "天龍はその9日後、1992年6月28日に\nWARという団体を作りました。"}, {"t": 608.1166666666667, "x": "今度は、自分が作った団体です。"}, {"t": 611.0, "x": "そしてこのあと、天龍はもう\n一度大きな仕事をします。"}, {"t": 614.9833333333333, "x": "1994年1月4日、東京ドーム。"}, {"t": 618.9833333333333, "x": "天龍は新日本プロレスのリングで\nアントニオ猪木と対戦し、勝ちました。"}, {"t": 624.1166666666667, "x": "猪木からピンフォールを奪った日本人は、\nこの試合の天龍だけだと言われています。"}, {"t": 629.3833333333333, "x": "全日本を出て、叩かれて、団体が潰れて、\nそれでもこの記録を残しています。"}, {"t": 635.6666666666666, "x": "ここまでが、記録に残っている事実です。"}, {"t": 638.7, "x": "なぜ、天龍はあれだけ叩かれると\n分かっていて全日本を出たのか。"}, {"t": 643.3166666666667, "x": "3億円という数字だけを見れば、金で\n動いたという説明が一番簡単です。"}, {"t": 648.9333333333333, "x": "ただ、この人が1987年からやってきたことを\n並べると、別の見方もできます。"}, {"t": 655.3333333333334, "x": "天龍がやったのは、日本人同士の\n試合を興行の中心に置くことでした。"}, {"t": 660.4, "x": "それは、外国人選手を軸に組んできた\n全日本プロレスのやり方を変えることでもあります。"}, {"t": 666.3833333333333, "x": "実際に商品は変わり、客も入りました。"}, {"t": 669.6666666666666, "x": "ただ、社長は馬場です。"}, {"t": 671.65, "x": "団体の設計を最終的に決めるのは、\n社長の権限になります。"}, {"t": 676.2333333333333, "x": "会社の中で作り方を変えるのには限界がある。"}, {"t": 679.2833333333333, "x": "自分で決められる場所が必要だ。"}, {"t": 681.4333333333333, "x": "そう考えたとしても、おかしくはありません。"}, {"t": 684.4333333333333, "x": "そして、その場所を用意できるだけの金を\n持っていたのが、プロレスの外にいる企業でした。"}, {"t": 690.4166666666666, "x": "SWSという団体は、プロレスラーではなく\n眼鏡屋の社長が作った会社です。"}, {"t": 696.1, "x": "天龍が乗ったのは、その\n一点だったのではないでしょうか。"}, {"t": 699.8666666666667, "x": "もう1つ、忘れられがちな点があります。"}, {"t": 703.1, "x": "SWSは、選手の待遇をはっきり\n良くした団体でした。"}, {"t": 707.5666666666667, "x": "給料が上がり、移動や宿の条件も\n変わったと伝えられています。"}, {"t": 712.1333333333333, "x": "プロレスラーの給料が\n公表される世界ではありません。"}, {"t": 715.5166666666667, "x": "だからこそ、金額の話は常に\n噂として扱われてきました。"}, {"t": 719.9833333333333, "x": "その扱いを、企業が正面から\n変えようとしたのがこの団体です。"}, {"t": 724.5666666666667, "x": "叩かれた理由も、そこにありました。"}, {"t": 727.1666666666666, "x": "プロレスは金で語るものではない、と\nいう前提を、真正面から壊したからです。"}, {"t": 732.9, "x": "結果として、SWSは2年で消えました。"}, {"t": 736.55, "x": "99億円は残りませんでした const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
