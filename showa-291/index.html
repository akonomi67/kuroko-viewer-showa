<script>
const D={"name": "最強タッグ初優勝", "file": "291_編集用", "dur": 929.46665625, "segs": [], "subs": [{"t": 0.0, "x": "札幌の最後の公式戦は、45分を\n戦って引き分けに終わりました。"}, {"t": 5.35, "x": "1978年12月15日のことです。"}, {"t": 8.916666666666666, "x": "組んでいたのはジャイアント馬場と、\n全日本プロレスの日本のレスラーです。"}, {"t": 13.55, "x": "相手は、アメリカから来た兄弟のチームでした。"}, {"t": 16.95, "x": "勝ち負けはつきません。"}, {"t": 18.4, "x": "それでも、この夜に優勝が決まりました。"}, {"t": 21.466666666666665, "x": "大会の名前は、世界最強タッグ決定リーグ戦です。"}, {"t": 25.616666666666667, "x": "この年に、初めてこの名前で開かれました。"}, {"t": 28.833333333333332, "x": "1年前の同じ12月15日にも、\n暮れのタッグの大会は最終戦を迎えています。"}, {"t": 34.95, "x": "そのときの名前は、\n世界オープンタッグ選手権でした。"}, {"t": 38.85, "x": "その名前は、\nこの年の暮れにはもう使われていません。"}, {"t": 42.6, "x": "引き分けの試合で、なぜ優勝が\n決まったのでしょうか？"}, {"t": 46.583333333333336, "x": "最初の年の6つのチームは、\n2週間をどう戦ったのでしょうか？"}, {"t": 51.2, "x": "今回は、第1回の\n世界最強タッグ決定リーグ戦を追います。"}, {"t": 56.18333333333333, "x": "12月1日の開幕から、\n12月15日の札幌までです。"}, {"t": 60.88333333333333, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 65.43333333333334, "x": "馬場の公式年表と、全日本プロレスの\n公式サイトも合わせて見ていきます。"}, {"t": 70.73333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 73.23333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 78.81666666666666, "x": "まず、馬場の公式年表を開きます。"}, {"t": 82.1, "x": "1978年のところに書かれているのは、\n1つの文だけです。"}, {"t": 86.91666666666667, "x": "パートナーとのコンビで、\n世界最強タッグ決定リーグ戦に初優勝。"}, {"t": 91.8, "x": "日付は12月15日です。"}, {"t": 94.0, "x": "相手のチームの名前はありません。"}, {"t": 96.15, "x": "会場の名前も書かれていません。"}, {"t": 98.26666666666667, "x": "試合の時間もありません。"}, {"t": 100.08333333333333, "x": "そこで今回は、試合の記録と新聞の\n記事で、その2週間をたどります。"}, {"t": 105.58333333333333, "x": "全日本プロレスの公式サイトは、\nこの大会をこう説明しています。"}, {"t": 110.33333333333333, "x": "1977年の世界オープンタッグ選手権に代わり、\nタッグマッチのリーグ戦で勝負する大会。"}, {"t": 117.65, "x": "そして今では、年末恒例の\nシリーズになっているとも書いています。"}, {"t": 122.0, "x": "前の年の世界オープンタッグ選手権は、\n以前の動画で取り上げました。"}, {"t": 126.96666666666667, "x": "ここでは記録の数字だけを見ておきます。"}, {"t": 129.55, "x": "試合の記録では、その大会には\n9つのチームが出ています。"}, {"t": 133.88333333333333, "x": "シリーズは12月2日に始まりました。"}, {"t": 136.56666666666666, "x": "最終戦は12月15日の蔵前国技館です。"}, {"t": 140.23333333333332, "x": "観客は12000人と記録されています。"}, {"t": 143.11666666666667, "x": "優勝したのは、アメリカの兄弟のチームでした。"}, {"t": 146.58333333333334, "x": "馬場の組は、この夜の公式戦に勝っています。"}, {"t": 150.03333333333333, "x": "13分39秒の押さえ込みです。"}, {"t": 152.78333333333333, "x": "それでも優勝には届きませんでした。"}, {"t": 155.2, "x": "記録では、この年のシリーズの大会は13です。"}, {"t": 158.86666666666667, "x": "次の年は12月1日に始まり、\n大会は14になりました。"}, {"t": 163.58333333333334, "x": "最終日は、どちらの年も12月15日です。"}, {"t": 167.33333333333334, "x": "次の年の暮れに、\n名前の変わった大会が始まります。"}, {"t": 171.21666666666667, "x": "東京スポーツは、出場したのを\n少数精鋭の6チームと書いています。"}, {"t": 176.08333333333334, "x": "試合の記録にも、6つのチームが並んでいます。"}, {"t": 179.61666666666667, "x": "それぞれのチームには、\nどこの代表かという名前が付いていました。"}, {"t": 183.9, "x": "1つ目はアメリカの代表です。"}, {"t": 186.0, "x": "前の年の大会で優勝した兄弟のチームでした。"}, {"t": 189.31666666666666, "x": "2つ目はアフリカと中東の代表です。"}, {"t": 191.9, "x": "2人の外国人のレスラーの組でした。"}, {"t": 194.38333333333333, "x": "3つ目は、アメリカの\nAWAという団体の代表です。"}, {"t": 198.58333333333334, "x": "4つ目はヨーロッパの代表でした。"}, {"t": 200.85, "x": "5つ目は韓国の代表です。"}, {"t": 202.91666666666666, "x": "そして6つ目が全日本プロレスの代表です。"}, {"t": 205.88333333333333, "x": "これが馬場の組でした。"}, {"t": 207.36666666666667, "x": "記録に並ぶ公式戦は、全部で15試合です。"}, {"t": 211.18333333333334, "x": "どのチームも、ほかの5つの\nチームと1度ずつ当たっています。"}, {"t": 215.16666666666666, "x": "馬場の組のパートナーは、\n全日本プロレスの日本のレスラーです。"}, {"t": 219.48333333333332, "x": "東京スポーツは、この2人を\n師弟のコンビと書いています。"}, {"t": 223.36666666666667, "x": "2025年11月9日に出た、\n第1回を振り返る記事です。"}, {"t": 228.61666666666667, "x": "馬場はこのとき40歳でした。"}, {"t": 230.76666666666668, "x": "公式年表には、1938年1月23日に\n新潟県の三条市で生まれたとあります。"}, {"t": 238.06666666666666, "x": "試合の記録では、シリーズは\n12月1日から12月15日までです。"}, {"t": 243.36666666666667, "x": "大会は全部で14でした。"}, {"t": 245.43333333333334, "x": "最初の大会は、東京の後楽園ホールです。"}, {"t": 249.01666666666668, "x": "観客は3500人と記録されています。"}, {"t": 252.0, "x": "この開幕の夜に、馬場の組は\n最初の公式戦を戦いました。"}, {"t": 256.5833333333333, "x": "相手はヨーロッパの代表の組です。"}, {"t": 258.9166666666667, "x": "13分1秒で勝ちました。"}, {"t": 260.95, "x": "押さえ込みで function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')

    mark('subs',i);
  }

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
