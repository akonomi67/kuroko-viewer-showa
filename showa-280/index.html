<script>
const D={"name": "東富士", "file": "280_編集用", "dur": 923.1333125, "segs": [], "subs": [{"t": 0.0, "x": "1958年11月、東京の\n後楽園ジムナジアムで元横綱が負けました。"}, {"t": 6.366666666666666, "x": "負かしたのは\nタイニー・ミルズという外国人の選手です。"}, {"t": 9.7, "x": "フォールだったと記録にあります。"}, {"t": 11.55, "x": "今回確かめた試合の記録に、その負けより\nあとの元横綱の名前はありません。"}, {"t": 16.916666666666668, "x": "第40代の横綱、東富士です。"}, {"t": 20.05, "x": "まだ37歳でした。"}, {"t": 21.766666666666666, "x": "しかも日本語の記録によれば、\nこの最後の試合はテレビのための試合でした。"}, {"t": 26.883333333333333, "x": "ところが、その頃の東京に力道山はいません。"}, {"t": 30.316666666666666, "x": "11月13日から12月11日まで、力道山の\n名前はブラジルのサンパウロの記録にあります。"}, {"t": 37.31666666666667, "x": "横綱は、その留守の間にリングを去りました。"}, {"t": 40.63333333333333, "x": "プロレスに入ってから、3年7か月でした。"}, {"t": 43.833333333333336, "x": "力道山の相撲の番付は、関脇までです。"}, {"t": 47.31666666666667, "x": "東富士は、その上の大関も横綱も通っています。"}, {"t": 51.15, "x": "その男が、なぜ力道山の\n団体に入ったのでしょうか？"}, {"t": 55.36666666666667, "x": "そして、なぜ力道山と王座を\n争わないまま去ったのでしょうか？"}, {"t": 59.983333333333334, "x": "今回は、東富士という1人の\n横綱の3年7か月を追います。"}, {"t": 64.81666666666666, "x": "当時の雑誌と試合の記録に\n残った日付をもとに辿っていきます。"}, {"t": 68.9, "x": "最後までご覧いただければ幸いです。"}, {"t": 71.4, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 76.96666666666667, "x": "東富士は1921年10月28日に生まれました。"}, {"t": 81.36666666666666, "x": "場所は東京の今の台東区です。"}, {"t": 83.66666666666667, "x": "相撲の専門誌は、東京で\n生まれ育った最初の横綱と紹介しています。"}, {"t": 88.86666666666666, "x": "生まれたときの体重は7キロ近くありました。"}, {"t": 91.66666666666667, "x": "12歳のときには75キロを超えていました。"}, {"t": 94.68333333333334, "x": "小学校を出ると、富士ヶ根部屋に入ります。"}, {"t": 98.61666666666666, "x": "身長は165センチで、\n決まりの高さに届いていません。"}, {"t": 103.03333333333333, "x": "それでも親方が働きかけました。"}, {"t": 105.28333333333333, "x": "測られないまま入門が決まります。"}, {"t": 107.51666666666667, "x": "土俵に上がったのは1936年1月です。"}, {"t": 111.13333333333334, "x": "番付に載る前の相撲では、\n誰にも勝てなかったと記録されています。"}, {"t": 115.78333333333333, "x": "周りは親方に、家へ帰らせるよう勧めました。"}, {"t": 119.4, "x": "親方は聞き入れません。"}, {"t": 120.96666666666667, "x": "番付に名前が載るまで2年かかりました。"}, {"t": 123.56666666666666, "x": "この若者に稽古をつけたのが、\n69連勝の記録を持つ横綱でした。"}, {"t": 128.78333333333333, "x": "場所は朝鮮半島の巡業でした。"}, {"t": 131.26666666666668, "x": "その横綱は、幕下だった東富士を土俵に呼びます。"}, {"t": 135.23333333333332, "x": "よその部屋の幕下に横綱が胸を\n貸すのは異例のことでした。"}, {"t": 139.03333333333333, "x": "そこから東富士は、\nその横綱の稽古に呼ばれ続けます。"}, {"t": 143.16666666666666, "x": "1944年11月の場所で、\n東富士はその師を投げで破りました。"}, {"t": 148.83333333333334, "x": "本場所で当たるのは、これが初めてです。"}, {"t": 151.78333333333333, "x": "1945年3月に、東京は空襲を受けました。"}, {"t": 156.21666666666667, "x": "東富士はこの空襲で母と妹を失います。"}, {"t": 159.51666666666668, "x": "同じ年の11月に大関に上がりました。"}, {"t": 162.35, "x": "1948年5月に、\n10勝1敗で初めて優勝します。"}, {"t": 167.33333333333334, "x": "1949年1月の場所が、\n横綱としての最初の場所でした。"}, {"t": 172.58333333333334, "x": "免許を出したのは相撲協会ではありません。"}, {"t": 175.33333333333334, "x": "昔からの家元の免許で\n横綱になった最後の力士です。"}, {"t": 179.0, "x": "得意の形は一気に前へ出る寄りでした。"}, {"t": 181.63333333333333, "x": "体重は180キロ近くまで増えます。"}, {"t": 184.45, "x": "相撲の専門誌は、近代の横綱で\n最も重かったと書いています。"}, {"t": 189.26666666666668, "x": "1951年9月の場所は語り草になりました。"}, {"t": 193.0, "x": "東富士はこの場所、急性の\n肺炎をかかえて土俵に上がっています。"}, {"t": 197.73333333333332, "x": "医師は出場を止めました。"}, {"t": 199.51666666666668, "x": "本人は聞きません。"}, {"t": 200.95, "x": "危険を承知したという書面に署名しました。"}, {"t": 203.8, "x": "12日目の吉葉山戦は取り直しになります。"}, {"t": 206.91666666666666, "x": "水入りのあと、もう1度物言いがつきました。"}, {"t": 210.15, "x": "勝負は預かりとなります。"}, {"t": 211.95, "x": "東富士は13勝1敗1預かりで優勝しました。"}, {"t": 215.7, "x": "通算の優勝は6回です。"}, {"t": 217.8, "x": "幕内の成績は261勝104敗でした。"}, {"t": 221.43333333333334, "x": "東富士には、力道山との縁も残っています。"}, {"t": 224.93333333333334, "x": "力道山は関脇の頃、東富士に30発以上の\n張り手を打って敗れたと伝えられています。"}, {"t": 231.26666666666668, "x": "そして東富士は、優勝パレードの\nオープンカーを力道山から借りました。"}, {"t": 236.15, "x": "これが優勝パレードの始まりとされています。"}, {"t": 238.95, "x": "借りた時期は資料で分かれます。"}, {"t": 240.9, "x": "プロレス雑誌の元編集長の記事は\n1951年9月場所としています。"}, {"t": 246.08333333333334, "x": "相撲の専門誌は初優勝のときとしています。"}, {"t": 249.23333333333332, "x": "力道山は1950年に土俵を去りました。"}, {"t": 252.63333333333333, "x": "1951年にはプロレスを始めています。"}, {"t": 256.01666666666665, "x": "番付の上にいたのは東富士で、\n車を持っていたのは力道山でした。"}, {"t": 260.85, "x": "1954年3月の場所で、\n東富士は土俵下に落ちました。"}, {"t": 265.8333333333333, "x": "右肩と腰とあばらの骨を折りました。"}, {"t": 268.3, "x": "次の場所は休みました。"}, {"t": 270.0, "x": "1954年9月の場所は、\n新しい蔵前国技館の最初の場所でした。"}, {"t": 275.68333333333334, "x": "東富士はここで土俵に戻ります。"}, {"t": 278.01666666666665, "x": "しかし場所の途中で引退を発表しました。"}, {"t": 280.85, "x": "体の限界が理由とされています。"}, {"t": 283.21666666666664, "x": "ただし、別の話も伝わっています。"}, {"t": 286.1333333333333, "x": "この場所で、大関の栃錦が\n2場所続けて優勝しました。"}, {"t": 290.3666666666667, "x": "横綱はすでに4人います。"}, {"t": 292.28333333333336, "x": "5人目を認めるかどうかが問題になりました。"}, {"t": 295.1, "x": "そこで東富士が身を引いたと、\n資料には書かれています。"}, {"t": 299.03333333333336, "x": "栃錦は引き止めに来たと伝えられています。"}, {"t": 301.75, "x": "引退のあとも、もめ事が続きます。"}, {"t": 304.6, "x": "東富士は年寄の錦戸を名乗りました。"}, {"t": 307.31666666666666, "x": "ところがこの名前の持ち主をめぐって、\n一門どうしの争いが起きます。"}, {"t": 312.1, "x": "東富士は名前を返しました。"}, {"t": 314.26666666666665, "x": "1954年12月、相撲協会を離れます。"}, {"t": 318.51666666666665, "x": "引退相撲は開かれていません。"}, {"t": 320.65, "x": "髷も切らないままでした。"}, {"t": 322.3, "x": "33歳の元横綱は、協会の外に出ました。"}, {"t": 326.1666666666667, "x": "1955年2月、東富士は\nプロレスへの転向を表明しました。"}, {"t": 331.65, "x": "誘った人物の名前は資料で分かれています。"}, {"t": 334.68333333333334, "x": "力道山とする記事もあれば、\n後援者とする記事もあります。"}, {"t": 338.8333333333333, "x": "本人の言葉は、1955年8月15日の\nプロレス雑誌に残っています。"}, {"t": 344.78333333333336, "x": "そこで東富士は、力道山と\n後援者の支えを挙げました。"}, {"t": 349.01666666666665, "x": "同じ記事で、本人はハワイの話もしています。"}, {"t": 352.45, "x": "最初は相撲を\n教えに行くつもりだったという話です。"}, {"t": 355.81666666666666, "x": "ところが現地では、\nプロレスの練習が始まりました。"}, {"t": 359.3833333333333, "x": "朝は2時間ほどの稽古です。"}, {"t": 361.4, "x": "相手は現地の二世の力士20人ほどでした。"}, {"t": 364.46666666666664, "x": "午後は体づくりと日光浴です。"}, {"t": 366.71666666666664, "x": "毎日走ります。"}, {"t": 368.05, "x": "毎朝1時間、ワイキキの砂浜でした。"}, {"t": 371.3333333333333, "x": "それまで走った経験はありません。"}, {"t": 373.7, "x": "息切れが激しかったと話しています。"}, {"t": 376.06666666666666, "x": "食事は1日1回です。"}, {"t": 378.01666666666665, "x": "主食も抜きました。"}, {"t": 379.31666666666666, "x": "体重は40貫から、\n35貫から36貫まで落ちています。"}, {"t": 384.26666666666665, "x": "キロに直すと、およそ150キロから\n135キロ前後です。"}, {"t": 388.78333333333336, "x": "1955年4月、東富士は\nホノルルでリングに上がります。"}, {"t": 393.7, "x": "デビューの日付は、4月10日と\n4月17日の2つの記録があります。"}, {"t": 398.65, "x": "本人は、最初は相撲のつもりで\n出たと話しています。"}, {"t": 402.4166666666667, "x": "相手はテキサス出身のドン・ベイテルマンです。"}, {"t": 405.23333333333335, "x": "足首を固められると、抜け方が分かりません。"}, {"t": 408.5, "x": "セコンドの指導役から、\n早く片付けろと声が飛びました。"}, {"t": 412.45, "x": "東富士は蹴って抜け出し、\n突っ張りで反撃します。"}, {"t": 416.23333333333335, "x": "結果は10分9秒でフォール勝ちでした。"}, {"t": 418.9166666666667, "x": "4月17日には、力道山と組んで\nハワイのタッグ王座を取っています。"}, {"t": 423.8833333333333, "x": "元横綱の頭には、まだ髷がありました。"}, {"t": 427.05, "x": "デビューから1か月たたないうちに王者です。"}, {"t": 429.81666666666666, "x": "本人は20試合ほどを終えた頃の\n気持ちも話しています。"}, {"t": 433.46666666666664, "x": "自信がついてきたという言葉です。"}, {"t": 435.6333333333333, "x": "相撲で鍛えた腰と膝が役に立ったとも語りました。"}, {"t": 438.98333333333335, "x": "危ない技に耐えるには、\n厳しい練習が要るとも話しています。"}, {"t": 443.3, "x": "八百長だと片付ける声には、\n体を絞る苦労を知ってほしいと答えました。"}, {"t": 448.3333333333333, "x": "なぜプロレスラーになったのかという質問には、\nうんざりしていました。"}, {"t": 452.6, "x": "望んだ道を選んだだけ、という趣旨です。"}, {"t": 455.8333333333333, "x": "日本では体に合う既製服が見つかりません。"}, {"t": 458.76666666666665, "x": "アメリカでは店に並んでいて、\n買い物が楽だとも話しています。"}, {"t": 463.1, "x": "1955年7月2日、\n2人は羽田空港に帰ってきました。"}, {"t": 468.31666666666666, "x": "この写真は、そのときのものと\n当時の雑誌に載っています。"}, {"t": 472.25, "x": "7月7日、東富士は髷を切りました。"}, {"t": 475.56666666666666, "x": "18年間伸ばしてきた髷でした。"}, {"t": 477.8833333333333, "x": "相撲を辞めてから、\nおよそ7か月が過ぎていました。"}, {"t": 481.45, "x": "本人はこれを新しい出発と話しています。"}, {"t": 484.53333333333336, "x": "国内の最初の試合は、記録では\n1955年7月15日、東京です。"}, {"t": 491.1333333333333, "x": "力道山と組んで、2対1で勝ちました。"}, {"t": 494.1, "x": "翌日の7月16日、蔵前国技館で\n1人の相手と向き合います。"}, {"t": 499.25, "x": "外国人選手のジェス・オルテガです。"}, {"t": 501.6333333333333, "x": "この試合の記録は、\n9分17秒で東富士の反則勝ちです。"}, {"t": 506.46666666666664, "x": "東富士はオルテガの親指で目を痛めています。"}, {"t": 509.51666666666665, "x": "7月23日の大阪では、\n11分52秒で両者リングアウトでした。"}, {"t": 515.1833333333333, "x": "7月28日の試合は、\n当時の雑誌に細かく残っています。"}, {"t": 519.9166666666666, "x": "力道山と東富士の組が、\n const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
