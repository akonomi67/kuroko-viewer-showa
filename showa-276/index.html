<script>
const D={"name": "山口利夫", "file": "276_編集用", "dur": 916.0, "segs": [], "subs": [{"t": 0.0, "x": "1954年2月6日、大阪府立体育館。"}, {"t": 4.283333333333333, "x": "プロレスの試合がテレビの\n電波に乗った夜があります。"}, {"t": 7.433333333333334, "x": "流したのはNHK大阪。"}, {"t": 9.65, "x": "それも本放送の前の、実験の電波でした。"}, {"t": 13.166666666666666, "x": "画面の男は力道山ではなく、39歳の山口利夫。"}, {"t": 17.783333333333335, "x": "日本で最初にテレビに映ったプロレスは、\nこの大阪にありました。"}, {"t": 22.166666666666668, "x": "定説の2月19日より13日も早く、です。"}, {"t": 26.466666666666665, "x": "ところが、山口の名前を知る人は多くありません。"}, {"t": 30.083333333333332, "x": "山口が率いた全日本プロレス協会は、\n3年ほどで消えました。"}, {"t": 34.7, "x": "のちの馬場の全日本プロレスとは別の団体です。"}, {"t": 37.81666666666667, "x": "団体がいつ消えたのか、はっきりした日付も\n残っていません。"}, {"t": 41.96666666666667, "x": "なぜ、最初にテレビに映った男は、\nテレビの時代に残れなかったのでしょうか？"}, {"t": 47.916666666666664, "x": "そして、大阪の団体はどのように\n消えていったのでしょうか？"}, {"t": 52.2, "x": "今回は山口利夫と\n全日本プロレス協会の記録を追います。"}, {"t": 56.31666666666667, "x": "大学の論文と当時の\n試合記録をもとに辿っていきます。"}, {"t": 60.05, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.53333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.11666666666666, "x": "山口利夫は1914年7月28日、\n静岡県三島市に生まれました。"}, {"t": 74.35, "x": "この写真の人物が山口です。"}, {"t": 76.61666666666666, "x": "入った道は柔道でした。"}, {"t": 78.51666666666667, "x": "早稲田大学の柔道部から、\n南満州鉄道の柔道部へ進みます。"}, {"t": 83.36666666666666, "x": "体の大きな強豪で、満鉄の虎と呼ばれました。"}, {"t": 87.1, "x": "全国の大会の部門では、\n1936年に3位に入っています。"}, {"t": 92.31666666666666, "x": "翌1937年は2位でした。"}, {"t": 95.03333333333333, "x": "1939年には大相撲の出羽海部屋に入りました。"}, {"t": 99.26666666666667, "x": "ただし、相撲は翌年にやめています。"}, {"t": 102.26666666666667, "x": "1950年2月、柔道の世界に\n新しい興行が生まれます。"}, {"t": 107.28333333333333, "x": "国際柔道協会、いわゆるプロ柔道です。"}, {"t": 110.71666666666667, "x": "山口はここに加わりました。"}, {"t": 112.75, "x": "同じ場所にいたのが木村政彦です。"}, {"t": 115.11666666666666, "x": "しかし、この興行は長く続きません。"}, {"t": 118.26666666666667, "x": "木村がハワイへ渡って協会を抜けます。"}, {"t": 120.88333333333334, "x": "山口も同じように抜けました。"}, {"t": 122.88333333333334, "x": "協会はそのあとすぐに消えています。"}, {"t": 125.26666666666667, "x": "山口が見た最初の団体の消滅でした。"}, {"t": 128.11666666666667, "x": "次の舞台はハワイです。"}, {"t": 129.78333333333333, "x": "英語の記録では、山口が\n着いたのは1951年2月でした。"}, {"t": 134.83333333333334, "x": "木村とともに、ここでプロレスの世界に入ります。"}, {"t": 138.18333333333334, "x": "同じ1951年には、\n木村とブラジルへ渡りました。"}, {"t": 142.58333333333334, "x": "ブラジルでの木村の大一番でも、\n山口は木村の側についています。"}, {"t": 147.38333333333333, "x": "1952年4月には、カリフォルニアの\n興行で力道山と組んでいます。"}, {"t": 152.86666666666667, "x": "これも英語の記録に残る話です。"}, {"t": 155.23333333333332, "x": "のちに日本のプロレスを取り合う2人でした。"}, {"t": 157.86666666666667, "x": "その2人が、アメリカでは同じ側に\n立っていたことになります。"}, {"t": 161.93333333333334, "x": "日本に戻った山口は大阪で動き始めます。"}, {"t": 165.11666666666667, "x": "1953年7月18日、\n場所は大阪府立体育館でした。"}, {"t": 170.78333333333333, "x": "相手は元幕内力士の清美川です。"}, {"t": 173.5, "x": "この写真の人物が清美川です。"}, {"t": 175.91666666666666, "x": "興行には北九州水害義捐という名前が付いていました。"}, {"t": 179.78333333333333, "x": "水害の被害者を助けるための興行です。"}, {"t": 182.71666666666667, "x": "試合は山口が首投げからフォール勝ちしました。"}, {"t": 185.76666666666668, "x": "英語のプロレス史の年表があります。"}, {"t": 188.13333333333333, "x": "そこでは、日本人が主催した最初の\n興行とされています。"}, {"t": 192.21666666666667, "x": "力道山の日本プロレス協会の発足は、\n同じ月の30日でした。"}, {"t": 197.26666666666668, "x": "山口の興行は、その12日前にあたります。"}, {"t": 200.91666666666666, "x": "同じ年の12月8日と9日にも、\n大阪で興行が開かれました。"}, {"t": 205.78333333333333, "x": "名前は第1回渡米記念プロ・レスリング試合です。"}, {"t": 209.18333333333334, "x": "主催は関西プロレスリング協会結成準備委員会でした。"}, {"t": 213.13333333333333, "x": "清美川は2日とも、20分を\n超える試合に勝っています。"}, {"t": 217.35, "x": "大阪の団体は、こうして形を作っていきました。"}, {"t": 221.06666666666666, "x": "協会の設立の時期は資料によって分かれます。"}, {"t": 224.13333333333333, "x": "1954年の1月、3月、\n4月の3つの説があります。"}, {"t": 229.71666666666667, "x": "そして1954年2月6日が来ます。"}, {"t": 232.9, "x": "興行の名前はマナスル登山隊後援の\n日米対抗試合でした。"}, {"t": 237.23333333333332, "x": "毎日新聞社が協力しています。"}, {"t": 239.68333333333334, "x": "日本山岳会も名前を連ねました。"}, {"t": 242.15, "x": "マナスルはヒマラヤの峰の名前です。"}, {"t": 244.51666666666668, "x": "その山に挑む登山隊を応援するための興行でした。"}, {"t": 248.06666666666666, "x": "登山隊の第1陣は、この年の\n3月2日に日本を出ています。"}, {"t": 252.71666666666667, "x": "山頂に日本人が立つのは1956年5月9日です。"}, {"t": 257.2, "x": "プロレスの興行は、\nその2年以上前に開かれました。"}, {"t": 261.05, "x": "相手は在日アメリカ軍の兵士たちです。"}, {"t": 263.75, "x": "試合は6日と7日の2日間でした。"}, {"t": 266.3, "x": "プロレス史の研究記事では、\n6日の観客は8,000人です。"}, {"t": 270.6, "x": "清美川はこの日、24分3秒で勝っています。"}, {"t": 274.6, "x": "この会場に、NHK大阪のテレビが入りました。"}, {"t": 278.56666666666666, "x": "当時のNHK大阪は、\nまだ本放送を始めていません。"}, {"t": 282.93333333333334, "x": "試験の電波を出していた時期です。"}, {"t": 285.0833333333333, "x": "本放送の開始は1954年3月1日でした。"}, {"t": 289.1333333333333, "x": "この夜は、その23日前にあたります。"}, {"t": 292.4, "x": "東京ではNHKが1953年2月に\n放送を始めていました。"}, {"t": 297.46666666666664, "x": "日本テレビは同じ年の8月です。"}, {"t": 299.9, "x": "ただ、1953年の時点で、\nテレビのある家は900世帯ほどでした。"}, {"t": 305.81666666666666, "x": "受像機は1台およそ20万円です。"}, {"t": 308.43333333333334, "x": "大阪で何人がこの中継を見たのでしょうか。"}, {"t": 311.4166666666667, "x": "見た人の人数は、今回の資料では分かりません。"}, {"t": 315.05, "x": "この中継を確かめられる資料は2つあります。"}, {"t": 318.03333333333336, "x": "1つは大阪大学の年報に載った英語の論文です。"}, {"t": 321.73333333333335, "x": "1987年に発表されました。"}, {"t": 324.75, "x": "論文は日本プロレス20年史という本と、\n毎日新聞、朝日新聞をもとにしています。"}, {"t": 331.6166666666667, "x": "そこには、NHK大阪が\n試合を生放送したとあります。"}, {"t": 336.21666666666664, "x": "そして、これが日本で最初の\nプロレス放送になったと書かれています。"}, {"t": 340.73333333333335, "x": "もう1つは、NHK大阪放送局の\n70年史、こちらJOBKです。"}, {"t": 347.1333333333333, "x": "プロレス中継の歴史をまとめた資料が、\nこの本を出典に挙げています。"}, {"t": 351.93333333333334, "x": "それによると、中継は大阪府立体育館からの\n地元向けの放送でした。"}, {"t": 357.1, "x": "放送の範囲を関西と東海とする資料もあります。"}, {"t": 360.51666666666665, "x": "1つ断っておくことがあります。"}, {"t": 362.6166666666667, "x": "この放送は本放送ではありません。"}, {"t": 365.0833333333333, "x": "本放送に限れば、最初の中継は\n13日後の東京になります。"}, {"t": 370.0, "x": "論文は2日間とも生放送と書いています。"}, {"t": 373.03333333333336, "x": "NHK側の記録が挙げているのは6日の放送です。"}, {"t": 376.7, "x": "確かに言えるのは、2月6日の\n大阪にテレビが入っていたことです。"}, {"t": 381.1333333333333, "x": "その13日後に、大きな波が来ます。"}, {"t": 384.21666666666664, "x": "1954年2月19日、東京の蔵前国技館です。"}, {"t": 389.26666666666665, "x": "力道山と木村政彦が、\nシャープ兄弟と戦いました。"}, {"t": 393.2, "x": "日本テレビとNHKの2局が\nこの日の試合を流しています。"}, {"t": 397.3, "x": "相手のシャープ兄弟は世界タッグの王者でした。"}, {"t": 400.35, "x": "この写真は力道山です。"}, {"t": 402.23333333333335, "x": "試合の記録では、\n客席は1万人を超えて満員でした。"}, {"t": 406.45, "x": "新橋駅の広場には、2万人を超える人が\n集まったと伝えられています。"}, {"t": 411.51666666666665, "x": "日本テレビは関東の55か所に、\n220台のテレビを外に置いていました。"}, {"t": 416.85, "x": "入場料の売り上げは\n8,000万円と伝えられています。"}, {"t": 420.3, "x": "論文は、これがふつう日本のプロレスの\n始まりとされると書いています。"}, {"t": 424.9166666666667, "x": "東京の興行は5回ありました。"}, {"t": 427.15, "x": "論文によると、日本テレビは\n5回すべてを流しています。"}, {"t": 431.18333333333334, "x": "NHKは3回でした。"}, {"t": 433.1166666666667, "x": "このとき山口はどこにいたのでしょうか？"}, {"t": 435.71666666666664, "x": "答えは同じ興行の中です。"}, {"t": 437.81666666666666, "x": "山口は力道山の興行に呼ばれていました。"}, {"t": 440.8, "x": "19日はアメリカの選手に1対2で敗れています。"}, {"t": 444.18333333333334, "x": "20日はシャープ兄弟の\n1人に1対2で敗れました。"}, {"t": 447.4166666666667, "x": "清美川も同じ興行に出ています。"}, {"t": 449.81666666666666, "x": "大阪でテレビに映った2人です。"}, {"t": 452.05, "x": "13日後には、力道山の興行の中にいました。"}, {"t": 455.8333333333333, "x": "2人の試合は、一番最後の試合ではありません。"}, {"t": 459.51666666666665, "x": "興行は14回続き、大阪にも来ました。"}, {"t": 462.98333333333335, "x": "2月26日の大阪府立体育館です。"}, {"t": 466.15, "x": "本拠地の大阪で、山口は力道山と組みました。"}, {"t": 469.9, "x": "シャープ兄弟に2対1で勝っています。"}, {"t": 472.3333333333333, "x": "観客は8,000人でした。"}, {"t": 474.2, "x": "20日前の同じ会場の数字と同じです。"}, {"t": 477.0, "x": "この力道山の興行にも、\nマナスルの募金の名前がありました。"}, {"t": 481.4166666666667, "x": "英語の試合記録がそう書いています。"}, {"t": 483.78333333333336, "x": "それでも、山口は大阪で団体を続けます。"}, {"t": 487.3, "x": "この年の4月に、1人の大物が入りました。"}, {"t": 490.71666666666664, "x": "近畿大学の相撲部で\n学生横綱になった吉村道明です。"}, {"t": 494.76666666666665, "x": "この写真の人物が吉村です。"}, {"t": 497.06666666666666, "x": "同じ1954年には、ジョー樋口も\nここでプロレスを始めました。"}, {"t": 501.98333333333335, "x": "のちに全日本プロレスの\nレフェリーとして知られる人です。"}, {"t": 505.23333333333335, "x": "1954年9月25日には、\n大阪の扇町プールで興行を開きました。"}, {"t": 511.3666666666667, "x": "この興行にもテレビが入っています。"}, {"t": 513.7, "x": "プールに設けたリングでの水上の試合でした。"}, {"t": 516.5833333333334, "x": "試験の電波から7か月あまりのことです。"}, {"t": 519.3666666666667, "x": "1954年12月22日、\n木村政彦が力道山に敗れます。"}, {"t": 525.033333333333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
