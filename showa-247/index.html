<script>
const D={"name": "グレート小鹿", "file": "247_編集用", "dur": 859.2333125, "segs": [], "subs": [{"t": 0.0, "x": "1988年7月31日、\n北海道函館市の千代台公園陸上競技場。"}, {"t": 7.083333333333333, "x": "野外に組まれた特設リングで、\n全日本プロレスの大会が開かれていました。"}, {"t": 12.216666666666667, "x": "観衆は主催者発表で8,200人。"}, {"t": 15.05, "x": "この大会のチケットを売り歩いたのは、\n全日本の社員ではありません。"}, {"t": 19.683333333333334, "x": "地元の函館で商売を成功させていた、\n1人のプロレスラーでした。"}, {"t": 24.366666666666667, "x": "その男は、この日の大会を自分の\n引退の舞台にしていました。"}, {"t": 28.716666666666665, "x": "セレモニーのリングで隣に立っていたのは、\nジャイアント馬場です。"}, {"t": 32.86666666666667, "x": "この前の年の夏、首を痛めて休んでいた男に、\n馬場はこう告げていました。"}, {"t": 38.63333333333333, "x": "「試合には出なくてもいい。"}, {"t": 40.333333333333336, "x": "もう、いいから」"}, {"t": 42.11666666666667, "x": "男の名は、グレート小鹿。"}, {"t": 44.36666666666667, "x": "ところがこの男は、ここでプロレスから\n離れることはありませんでした。"}, {"t": 48.766666666666666, "x": "なぜグレート小鹿は、一度リングを降りた後も、\nプロレスの世界に戻り続けたのでしょうか。"}, {"t": 54.983333333333334, "x": "今回は、グレート小鹿という1人の\nレスラーの歩みを、本人の証言と"}, {"t": 60.166666666666664, "x": "記録に残る日付で辿っていきます。"}, {"t": 62.35, "x": "最後までご覧いただければ幸いです。"}, {"t": 64.85, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 70.41666666666667, "x": "グレート小鹿、本名は小鹿信也。"}, {"t": 73.31666666666666, "x": "1942年4月28日、北海道の\n亀田郡銭亀沢村、現在の函館市に生まれました。"}, {"t": 81.28333333333333, "x": "4男4女の次男です。"}, {"t": 83.05, "x": "父親は腕のいい漁師でしたが、小鹿が3歳か\n4歳のころ、目が悪くなって船を下りています。"}, {"t": 89.75, "x": "小学3年生のころには、小鹿自身が\n行商に出て家計を支えていました。"}, {"t": 95.13333333333334, "x": "売っていたのは、イカ釣りの針や、\n当時貴重だった甘味料のサッカリンです。"}, {"t": 100.41666666666667, "x": "その後、北海道湧別町の缶詰工場で働き始めます。"}, {"t": 104.93333333333334, "x": "17歳のとき、小鹿は東京で\n一旗揚げようと家を出ました。"}, {"t": 109.46666666666667, "x": "函館の青函連絡船の待合室で、\n大柄な体を見込まれて相撲部屋の後援会の"}, {"t": 115.56666666666666, "x": "人に声をかけられ、上野駅に着くと\nそのまま出羽海部屋に入門します。"}, {"t": 120.63333333333334, "x": "初土俵は1959年9月場所。"}, {"t": 123.75, "x": "しかし体重がなかなか増えず、\n最高位は三段目の西76枚目。"}, {"t": 128.8, "x": "1962年7月場所を最後に、\n力士を廃業しました。"}, {"t": 133.63333333333333, "x": "次に働いたのは、埼玉県川口市の魚屋でした。"}, {"t": 137.75, "x": "住み込みで働くうちに、小鹿は店を\n増やす商売を考えるようになります。"}, {"t": 142.95, "x": "その元手をどう作るか考えていたとき、\nテレビでプロレス中継を見ました。"}, {"t": 147.95, "x": "会場には大勢の客が入っていました。"}, {"t": 150.56666666666666, "x": "小鹿は後にこう語っています。"}, {"t": 152.63333333333333, "x": "「これはもうかるぞ、と思って渋谷の\nリキ・スポーツパレスに行ったんだ」"}, {"t": 156.96666666666667, "x": "力道山は小鹿の体を見て、入門を認めました。"}, {"t": 160.85, "x": "ただし入門は1か月後です。"}, {"t": 163.03333333333333, "x": "その間、小鹿はチキンラーメン2箱、\n48個で食いつなぎ、85キロあった体重は"}, {"t": 169.91666666666666, "x": "70キロまで落ちました。"}, {"t": 171.5, "x": "約束の日に訪ねると、\n力道山はこう言い放ちます。"}, {"t": 175.36666666666667, "x": "「お前、誰だ。"}, {"t": 177.23333333333332, "x": "入門など許した覚えはない」痩せて人相が\n変わっていたため、分からなかったのです。"}, {"t": 182.78333333333333, "x": "1962年11月24日、\n小鹿は日本プロレスの一員になりました。"}, {"t": 188.93333333333334, "x": "翌1963年12月、力道山は亡くなります。"}, {"t": 193.46666666666667, "x": "小鹿は後に、自分が力道山の最後の\n弟子になったと振り返っています。"}, {"t": 198.36666666666667, "x": "1963年にデビューした小鹿は、\n翌年から小鹿雷三のリングネームで戦います。"}, {"t": 204.7, "x": "名付け親は豊登でした。"}, {"t": 206.61666666666667, "x": "そして1967年、同じ元力士の\n大熊元司と2人でアメリカへ渡ります。"}, {"t": 212.76666666666668, "x": "英語は話せず、肉とパンも\n苦手だったと本人は語っています。"}, {"t": 217.2, "x": "2人は日本人の悪役タッグとして南部を回り、\n1967年のうちにテネシー地区の"}, {"t": 223.68333333333334, "x": "NWA世界タッグ王座を獲得しました。"}, {"t": 226.55, "x": "ジョージア州アトランタの試合では、客が\nリングにイスを投げ込み、止めに入った警官が"}, {"t": 232.55, "x": "天井に向けて発砲したこともありました。"}, {"t": 234.98333333333332, "x": "この一件の後、大熊はホームシックで\n20キロも痩せ、1968年に帰国します。"}, {"t": 242.03333333333333, "x": "1人残った小鹿は、フロリダ、\nデトロイトを経てロサンゼルスへ移りました。"}, {"t": 247.3, "x": "1969年12月19日、\n金網デスマッチでミル・マスカラスを破り、"}, {"t": 253.16666666666666, "x": "NWAアメリカス・ヘビー級王座を獲得します。"}, {"t": 257.1666666666667, "x": "翌1970年1月16日まで、\nこのベルトを守りました。"}, {"t": 262.1166666666667, "x": "そして1970年9月、\nグレート小鹿の名前で日本に凱旋します。"}, {"t": 267.6333333333333, "x": "帰国した小鹿は、選手会の\n代表として日本プロレスの"}, {"t": 271.53333333333336, "x": "取締役にもなっていました。"}, {"t": 273.3333333333333, "x": "ここで会社を揺るがす事件が起きます。"}, {"t": 275.8, "x": "1971年11月、社長の芳の里、\n専務、そして小鹿の3人が飲んでいた店に、"}, {"t": 283.68333333333334, "x": "上田馬之助から電話が入りました。"}, {"t": 286.3833333333333, "x": "アントニオ猪木が翌日に役員会を開き、\n幹部を解任するという内容です。"}, {"t": 292.01666666666665, "x": "呼び出された馬場は\n「俺は賛成していません」と答えました。"}, {"t": 295.43333333333334, "x": "小鹿自身、ロサンゼルスで猪木から改革案を\n聞き、気持ちが傾いていたと認めています。"}, {"t": 301.8333333333333, "x": "しかし小鹿は、こう語っています。"}, {"t": 304.43333333333334, "x": "「クーデターはしょせんクーデターだ。"}, {"t": 306.4, "x": "会社改革とは違う」同年12月、\n猪木は日本プロレスから除名されました。"}, {"t": 311.8, "x": "1972年7月、今度は馬場が辞表を出します。"}, {"t": 316.4, "x": "退団の前、馬場は小鹿にこう頼んだといいます。"}, {"t": 320.0833333333333, "x": "「出ていく人間と残る人間がいざこざを\n起こさないようにしてほしい。"}, {"t": 324.25, "x": "お前らの面倒は見るから」この時期、\n選手の中には馬場への敵意を"}, {"t": 328.55, "x": "むき出しにする者もいました。"}, {"t": 330.18333333333334, "x": "小鹿は芳の里の命令でボディーガード役を務め、\n宿舎から会場、移動の間まで馬場の"}, {"t": 336.78333333333336, "x": "横を離れなかったと語っています。"}, {"t": 338.8333333333333, "x": "そして馬場は、10月の\n全日本プロレス旗揚げに向けて動き出しました。"}, {"t": 343.55, "x": "小鹿も好条件で誘われています。"}, {"t": 345.96666666666664, "x": "ところが、それは小鹿1人だけを\n連れていくという条件でした。"}, {"t": 350.26666666666665, "x": "1973年の初めには、\n新日本プロレスへ移る坂口征二からも"}, {"t": 355.73333333333335, "x": "「一緒に来てください」と誘われています。"}, {"t": 357.9166666666667, "x": "それでも小鹿は日本プロレスに残りました。"}, {"t": 360.6666666666667, "x": "「俺の性分で、力道山先生が\nつくった日本プロレスは見捨てられなかった」"}, {"t": 365.51666666666665, "x": "1973年3月3日、小鹿は日本プロレスで\nアジアタッグ王座を獲得します。"}, {"t": 371.9166666666667, "x": "しかし4月20日の群馬県吉井町大会を最後に、\n日本プロレスは興行を止めました。"}, {"t": 377.8833333333333, "x": "小鹿は、日本プロレス最後の\nアジアタッグ王者になったのです。"}, {"t": 381.96666666666664, "x": "1973年6月、小鹿は\n全日本プロレスに移りました。"}, {"t": 387.06666666666666, "x": "1976年3月までは日本テレビと契約を\n結んだうえで全日本に派遣される形で、"}, {"t": 393.5, "x": "正式な所属になったのは1976年4月1日です。"}, {"t": 398.15, "x": "小鹿によれば、合流の話し合いの中で、\n馬場は残った選手のうち何人かを"}, {"t": 403.81666666666666, "x": "「連れてくるな」と言いました。"}, {"t": 405.21666666666664, "x": "小鹿は「それはダメですよ」と言って、\n全員を引き取ってもらったと語っています。"}, {"t": 410.2, "x": "ところがその夏、馬場は\n小鹿にもう一度アメリカへ行くよう命じます。"}, {"t": 414.95, "x": "一度は断りましたが、結局はテキサス州の\nアマリロへ渡ることになりました。"}, {"t": 420.1666666666667, "x": "当時のアメリカはカンフー映画の大ブームで、\n小鹿はリングネームをカン・フー・リーとし、"}, {"t": 425.46666666666664, "x": "チャイナドレス風の衣装と帽子、\n眼鏡まで身につけます。"}, {"t": 429.75, "x": "アメリカで修行中だったジャンボ鶴田が、控室で\n小鹿と気づかず「エクスキューズ・ミー」と"}, {"t": 435.1166666666667, "x": "前を通ったというほどの変わりようでした。"}, {"t": 437.43333333333334, "x": "1973年10月18日、\n小鹿はテリー・ファンクを破り、"}, {"t": 442.5, "x": "NWAウエスタン・ステーツ・ヘビー級王座を\n奪います。"}, {"t": 446.6, "x": "1976年3月26日、\n韓国のソウルで、小鹿は大熊元司と組んで"}, {"t": 453.28333333333336, "x": "アジアタッグ王座に返り咲きました。"}, {"t": 455.3833333333333, "x": "日本プロレスの崩壊で止まっていたベルトです。"}, {"t": 458.26666666666665, "x": "これで小鹿は、日本プロレス最後の\nアジアタッグ王者であり、全日本プロレス最初の"}, {"t": 464.1333333333333, "x": "アジアタッグ王者にもなりました。"}, {"t": 465.95, "x": "アジアタッグの戴冠は通算5回に上ります。"}, {"t": 469.01666666666665, "x": "大熊との組は極道コンビと呼ばれ、\nスタン・ハンセンは自著で"}, {"t": 473.1333333333333, "x": "「巧さ、強さもあり印象に\n残っている」と記しています。"}, {"t": 476.96666666666664, "x": "小鹿は馬場の試合ではセコンドにつき、\n一時期は馬場の車の運転手も務めました。"}, {"t": 482.65, "x": "さらに現役のまま、地方で興行を買って売る\nプロモーターの仕事も続けていました。"}, {"t": 488.15, "x": "その運転手時代の出来事を、\n小鹿は後にこう語っています。"}, {"t": 492.43333333333334, "x": "ある人物が、馬場と猪木の試合の勝者に\n1億円を出すと言い出したことがありました。"}, {"t": 498.1, "x": "車の中で小鹿が「なぜ黙っているんですか」と\n迫ると、馬場は短く答えたといいます。"}, {"t": 503.8, "x": "「俺は猪木と同じように見られたくない。"}, {"t": 506.06666666666666, "x": "それだけだよ」"}, {"t": 507.1, "x": "転機は1987年に訪れます。"}, {"t": 510.21666666666664, "x": "小鹿は試合で首を痛めました。"}, {"t": 512.3666666666667, "x": "報告を受けた馬場の言葉は\n「帰っていいよ」の一言だったといいます。"}, {"t": 516.3166666666667, "x": "後に医師からは「あと1ミリずれていたら\n下半身不随になっていた」と告げられました。"}, {"t": 521.0333333333333, "x": "3週間ほど休んだ8月下旬、\n小鹿は神奈川県の相模原大会の会場へ"}, {"t": 526.85, "x": "向かい、馬場に容体を伝えます。"}, {"t": 529.25, "x": "そこで返ってきたのが、冒頭の言葉でした。"}, {"t": 532.4666666666667, "x": "数日後、全日本から契約解除の連絡が届きます。"}, {"t": 536.5333333333333, "x": "馬場は、解雇を決めたのは日本テレビから\n出向していた役員だと説明したといいます。"}, {"t": 542.2333333333333, "x": "小鹿は現役を続けることを諦めました。"}, {"t": 545.0, "x": "1987年12月には品川のホテルで\n引退記念パーティーが開かれ、"}, {"t": 550.2833333333333, "x": "翌1988年7月31日、\n函館での引退興行を迎えます。"}, {"t": 556.7833333333333, "x": "興行を仕切ったのは、小鹿自身でした。"}, {"t": 559.75, "x": "函館ではパチンコ店の経営でも成功しており、\nチケットは売れに売れたと語っています。"}, {"t": 565.6, "x": "メインイベントは世界タッグ選手権でした。"}, {"t": 568.4, "x": "小鹿によれば、その繁盛ぶりを聞いた馬場は\n「俺もパチンコ屋をやろうかな」と"}, {"t": 573.15, "x": "言い出し、小鹿は函館で馬場のための\n土地を探したといいます。"}, {"t": 577.4333333333333, "x": "この話は実現しませんでした。"}, {"t": 579.6666666666666, "x": "こうしてプロレス界から一度離れた小鹿ですが、\n4年後には戻ってきます。"}, {"t": 584.6333333333333, "x": "1992年7月、天龍源一郎が旗揚げした\n団体WARに、営業部長として呼ばれたのです。"}, {"t": 593.3833333333333, "x": "その年の12月27日、\n極道コンビの相棒だった大熊元司が、"}, {"t": 598.7166666666667, "x": "現役のまま急性腎不全で亡くなりました。"}, {"t": 601.8166666666667, "x": "51歳でした。"}, {"t": 603.25, "x": "最後の試合は、同じ月の4日、\n日本武道館での6人タッグでした。"}, {"t": 608.7666666666667, "x": "1994年12月、小鹿は横浜市に\n大日本プロレスを設立し、社長になります。"}, {"t": 616.2166666666667, "x": "横浜の鴨居に道場を構え、\n7人の選手とスタッフでの出発でした。"}, {"t": 621.4333333333333, "x": "しかし2年目から赤字が重なり、\n支払いは毎日何十万円、やがて何百万円に"}, {"t": 628.1166666666667, "x": "膨らんだといいます。"}, {"t": 629.3333333333334, "x": "1996年11月、54歳の\n小鹿は自らリングに戻りました。"}, {"t": 635.4166666666666, "x": "兵隊服や劇画の主人公の扮装で上がり、\nコスプレ社長と呼ばれるようになります。"}, {"t": 641.1333333333333, "x": "後楽園ホールは満員になり、\n1997年1月4日には新日本プロレスの"}, {"t": 647.4166666666666, "x": "東京ドーム大会にも乗り込んで試合をしました。"}, {"t": 650.3666666666667, "x": "2002年には弁護士から「本日をもって会社を\nたたんでください」と言われたといいます。"}, {"t": 655.45, "x": "小鹿はこう振り返っています。"}, {"t": 657.4666666666667, "x": "「20人にもおよぶ所属する選手やスタッフを\n捨てるわけにもいかない」会社は残りました。"}, {"t": 662.6333333333333, "x": "1999年3月に入門した関本大介は、\n2007年に東京スポーツ新聞社制定の"}, {"t": 669.8, "x": "プロレス大賞で技能賞を受けます。"}, {"t": 671.9, "x": "小鹿は「この俺ですらもらったことがない\n栄誉ある賞だ」と語っています。"}, {"t": 675.9833333333333, "x": "商売好きも変わりませんでした。"}, {"t": 678.1166666666667, "x": "2003年11月には宮城県仙台市に\n「プロレスちゃんこ小鹿」を、2006年3月には"}, {"t": 684.2, "x": "「ホルモン小鹿亭」を開いています。"}, {"t": 686.2333333333333, "x": "どちらの店も2007年に営業を終えました。"}, {"t": 689.2666666666667, "x": "2011年7月、小鹿は大日本プロレスの\n社長を退き、会長になりました。"}, {"t": 695.6333333333333, "x": "それでも、リングに\n上がることはやめませんでした。"}, {"t": 698.9166666666666, "x": "2013年5月2日には、\nデビュー50周年の記念試合が行われています。"}, {"t": 704.7833333333333, "x": "2015年7月20日、\n両国国技館で6人タッグ王座を獲得。"}, {"t": 710.0666666666667, "x": "73歳2か月22日での戴冠でした。"}, {"t": 713.3166666666667, "x": "2018年8月8日には、\n76歳でシングル王座を獲得します。"}, {"t": 718.7666666666667, "x": "1973年のカン・フー・リー以来、\nおよそ45年ぶりのシングル王座でした。"}, {"t": 724.8666666666667, "x": "2019年4月28日、\n77歳の誕生日にはタッグ王座を獲得。"}, {"t": 731.0, "x": "そして2023年11月、81歳で\n電流爆破デスマッチのリングに立ち、"}, {"t": 736.9833333333333, "x": "当時の最高齢記録を作りました。"}, {"t": 739.7833333333333, "x": "2017年4月28日、75歳の誕生日の\n試合の後、小鹿は1つのことを明かしています。"}, {"t": 747.6, "x": "本名の読みは「こじか」ではなく、\n「こしか」だというのです。"}, {"t": 751.3166666666667, "x": "1967年のアメリカ行きの前、\nファンの声を聞いて、「こじか」のほうが"}, {"t": 757.0, "x": "応援に力が入ると考えたと説明しています。"}, {"t": 760.1666666666666, "x": "2021年、79歳の小鹿は、東京スポーツでの\n連載で自らの人生を語りました。"}, {"t": 767.5166666666667, "x": "馬場について、こう述べています。"}, {"t": 769.95, "x": "「愛憎は表裏一体であり、\n時として深い確執を生む場合がある」"}, {"t": 774.3666666666667, "x": "同じ年の2月4日、小鹿は後楽園ホールでの\n馬場の23回忌追善興行に出場していました。"}, {"t": 781.4166666666666, "x": "そして連載では、これまで馬場について\nネガティブな言葉しか吐かなかったが、"}, {"t": 786.1333333333333, "x": "今後は馬場の功績を後世に\n伝えるよう尽力したいと語っています。"}, {"t": 790.7333333333333, "x": "小鹿の年表を1本につなげてみると、\nリングを離れていた時間より、プロレスと"}, {"t": 796.25, "x": "関わり続けていた時間のほうが目立ちます。"}, {"t": 798.8, "x": "きっかけは、魚屋で働いていたときに見た\n「もうかりそうな中継」でした。"}, {"t": 803.45, "x": "現役のうちから興行を売り歩き、自分の\n引退興行まで自分で仕切り、団体の営業部長を"}, {"t": 810.5333333333333, "x": "経て、最後は自分の団体を興しています。"}, {"t": 813.5833333333334, "x": "経営が苦しくなれば、\n客を呼べる自分がリングに戻る。"}, {"t": 817.5, "x": "ここまでの記録を見る限り、\n小鹿には選手とスタッフを養う経営者の"}, {"t": 822.3333333333334, "x": "顔があったといえそうです。"}, {"t": 823.9, "x": "それでいて、日本プロレスを\n見捨てられずに残り、崩壊後は元同僚を"}, {"t": 828.95, "x": "全員馬場に引き取らせてもいます。"}, {"t": 830.8833333333333, "x": "損得だけでは説明がつかない場面が、\n記録の中に混ざっているのも事実です。"}, {"t": 836.1333333333333, "x": "本人がその理由をひとことで語った記録は、\n見当たりませんでした。"}, {"t": 840.5833333333334, "x": "商売人としての勘と、周りを切り捨てない性分。"}, {"t": 844.5166666666667, "x": "その両方を80歳を過ぎても持ち続けていた、\nというのが今回たどり着いた答えです。"}, {"t": 850.45, "x": "ご視聴、誠にありがとうございました。"}, {"t": 853.4333333333333, "x": "続きが気になった方は、チャンネル登録と\n高評価でぜひ教えてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
