<script>
const D={"name": "ラッシャー木村の死", "file": "223_編集用", "dur": 849.9333125, "segs": [], "subs": [{"t": 0.0, "x": "2010年5月24日、午前5時30分。"}, {"t": 4.016666666666667, "x": "東京都内の病院で、1人の\n元プロレスラーが亡くなりました。"}, {"t": 8.2, "x": "68歳でした。"}, {"t": 9.716666666666667, "x": "死因は、腎不全に伴う誤嚥性肺炎と\n伝えられています。"}, {"t": 14.316666666666666, "x": "名前を、ラッシャー木村といいます。"}, {"t": 17.05, "x": "この人が日本で上がったリングは、\n7つの団体のものでした。"}, {"t": 21.15, "x": "日本プロレス、東京プロレス、\n国際プロレス、新日本プロレス、"}, {"t": 26.683333333333334, "x": "UWF、全日本プロレス、そして\nプロレスリング・ノアです。"}, {"t": 31.933333333333334, "x": "そして、そのうち3つは、この人が\n在籍している間か、離れてすぐに消えています。"}, {"t": 38.416666666666664, "x": "なぜ、1人の選手が7つの\n団体を渡ることになったのでしょうか。"}, {"t": 43.05, "x": "今回は、ラッシャー木村という選手が\n残した記録を、確認できた日付と"}, {"t": 48.333333333333336, "x": "数字だけで辿っていきます。"}, {"t": 49.93333333333333, "x": "闘病の細部は、報道で\n確認できた範囲にとどめます。"}, {"t": 53.93333333333333, "x": "イメージ映像"}, {"t": 53.93333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 56.43333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 62.016666666666666, "x": "まず、生まれたところから確認しておきます。"}, {"t": 65.35, "x": "本名は木村政雄。"}, {"t": 66.88333333333334, "x": "1941年6月30日、\n北海道中川郡中川町の生まれです。"}, {"t": 73.08333333333333, "x": "身長は185センチから187センチ、\n全盛時の体重は125キロと記録されています。"}, {"t": 80.51666666666667, "x": "最初の職業は、\nプロレスラーではありませんでした。相撲です。"}, {"t": 85.06666666666666, "x": "1958年に宮城野部屋へ\n入門し、四股名は木ノ村。"}, {"t": 89.85, "x": "幕下20枚目まで上がりました。"}, {"t": 92.1, "x": "そして1964年の9月場所を\n最後に廃業しています。"}, {"t": 96.41666666666667, "x": "同じ年の秋、日本プロレスに入門しました。"}, {"t": 99.8, "x": "1つ目の団体です。"}, {"t": 101.33333333333333, "x": "デビューは1965年4月2日、\n東京のリキスポーツパレスでした。"}, {"t": 106.76666666666667, "x": "その翌年、1966年に日本プロレスを\n出て、東京プロレスに移ります。"}, {"t": 113.23333333333333, "x": "豊登が興した団体です。"}, {"t": 115.26666666666667, "x": "2つ目でした。"}, {"t": 116.35, "x": "しかし、この東京プロレスは\n翌1967年に崩壊します。"}, {"t": 121.61666666666666, "x": "1967年、木村は国際プロレスへ移りました。"}, {"t": 126.13333333333334, "x": "3つ目です。"}, {"t": 127.11666666666666, "x": "ここで14年を過ごすことになります。"}, {"t": 129.55, "x": "1969年1月1日、リングネームが\nラッシャー木村になりました。"}, {"t": 135.06666666666666, "x": "ファンから公募された名前だったと\n記録されています。"}, {"t": 138.13333333333333, "x": "そして1970年10月8日、大阪府立体育館。"}, {"t": 142.8, "x": "日本で初めての金網デスマッチが行われます。"}, {"t": 145.96666666666667, "x": "相手はドクター・デス。"}, {"t": 147.36666666666667, "x": "17分22秒でのKO勝ちでした。"}, {"t": 150.2, "x": "この試合をきっかけに、木村は\n金網の鬼と呼ばれるようになります。"}, {"t": 154.7, "x": "1975年4月19日、\n札幌中島スポーツセンター。"}, {"t": 160.01666666666668, "x": "マッドドッグ・バションを金網デスマッチで\n破り、IWA世界ヘビー級王座を獲得しました。"}, {"t": 166.6, "x": "第11代の王者です。"}, {"t": 168.4, "x": "そして1976年から1979年にかけて、\nこの王座を26回連続で防衛しています。"}, {"t": 176.18333333333334, "x": "通算では5度戴冠し、防衛は57回でした。"}, {"t": 180.25, "x": "つまりこの時期、木村は\n第3の団体と呼ばれた会社の、"}, {"t": 184.11666666666667, "x": "押しも押されもせぬエースでした。"}, {"t": 186.26666666666668, "x": "その木村が、1975年に\nアントニオ猪木へ挑戦状を出しています。"}, {"t": 191.76666666666668, "x": "このとき猪木は、巡業先の\n北海道でこう答えました。"}, {"t": 195.86666666666667, "x": "相手が木村じゃ、ねえ。"}, {"t": 198.16666666666666, "x": "正直、木村に勝ったからといって自慢もできない。"}, {"t": 201.65, "x": "五分五分の立場でやろうなどとはおこがましい。"}, {"t": 204.31666666666666, "x": "帰京したあとの会見でも、こう述べています。"}, {"t": 207.48333333333332, "x": "自分の口から実力日本一なんて言ったことはない。"}, {"t": 210.78333333333333, "x": "木村は自分の立場と実力が\n分かっていない。己を知れ。"}, {"t": 214.65, "x": "この時点では、試合は組まれませんでした。"}, {"t": 217.7, "x": "それから6年後、国際プロレスが終わります。"}, {"t": 220.98333333333332, "x": "1981年8月6日、室蘭。"}, {"t": 224.66666666666666, "x": "ジ・エンフォーサーを相手に\nIWA王座の防衛戦を行いました。"}, {"t": 228.93333333333334, "x": "観客は2,800人です。"}, {"t": 231.05, "x": "これが木村にとって最後の防衛戦であり、\n最後の金網デスマッチになりました。"}, {"t": 236.45, "x": "3日後の1981年8月9日、\n北海道の羅臼で最終興行。"}, {"t": 242.3, "x": "会社としての消滅は同じ年の9月30日です。"}, {"t": 245.76666666666668, "x": "IWA世界ヘビー級王座も、\nこの日付で封印されました。"}, {"t": 250.4, "x": "そして1981年9月23日、田園コロシアム。"}, {"t": 255.66666666666666, "x": "木村は新日本プロレスの\nリングでマイクを持ちます。"}, {"t": 258.81666666666666, "x": "テレビ朝日のアナウンサーに気持ちを\n聞かれ、木村はこう答えました。"}, {"t": 263.3, "x": "こんばんは。"}, {"t": 264.18333333333334, "x": "その後に続けたのは、10月8日の試合は\n国際プロレスの名誉にかけても必ず勝つ、"}, {"t": 269.93333333333334, "x": "今は秩父で合宿を張って死に物狂いで\nトレーニングをしている、という内容でした。"}, {"t": 275.8333333333333, "x": "客席からは失笑が漏れたと記録されています。"}, {"t": 278.85, "x": "この第一声について、木村は後年、なぜ\nそう言ったのかを聞かれ、こう答えています。"}, {"t": 285.76666666666665, "x": "初めてのところですから、\nまずは挨拶をと思いまして。"}, {"t": 289.5833333333333, "x": "同じ夜、控室にいた新日本の若手も、\n当時のことを証言しています。"}, {"t": 295.1333333333333, "x": "会場の入り口から木村と浜口を控室へ案内し、\n試合が見られる場所に椅子を用意したところ、"}, {"t": 301.71666666666664, "x": "2人から、どうもすいません、と返された。"}, {"t": 305.43333333333334, "x": "若手の側が\n恐縮するほど丁寧だった、という話です。"}, {"t": 309.6666666666667, "x": "練習のあとにちゃんこを勧めても、\n木村はいつも、結構です、と"}, {"t": 315.23333333333335, "x": "言って食べなかったとも語られています。"}, {"t": 317.31666666666666, "x": "リングで出たあの一言は、その人が\n普段そうであった通りのものでした。"}, {"t": 321.85, "x": "その10月8日です。"}, {"t": 323.51666666666665, "x": "1981年10月8日、蔵前国技館。"}, {"t": 327.71666666666664, "x": "アントニオ猪木とラッシャー木村の\n初対決が組まれました。"}, {"t": 331.18333333333334, "x": "観客はおよそ13,000人です。"}, {"t": 333.76666666666665, "x": "ここは、記録を正確に記します。"}, {"t": 336.5833333333333, "x": "試合は、猪木が木村に腕ひしぎ逆十字固めを\n極め、ロープブレークのあともそれを"}, {"t": 342.73333333333335, "x": "離さなかったことで裁定がつきました。"}, {"t": 345.01666666666665, "x": "反則を取られたのは猪木です。"}, {"t": 347.03333333333336, "x": "つまり、この試合は10分35秒で\nラッシャー木村の反則勝ちでした。"}, {"t": 352.1666666666667, "x": "この日の対抗戦は3試合が組まれ、\n国際プロレス側の2勝1敗です。"}, {"t": 357.3333333333333, "x": "なお、およそ1か月後の1981年11月5日、\n同じ蔵前国技館で行われた"}, {"t": 364.85, "x": "ランバージャック・デスマッチは、\n猪木のTKO勝ちでした。"}, {"t": 368.51666666666665, "x": "10月8日とは結果が違います。"}, {"t": 370.85, "x": "この抗争のことを、\n木村は晩年こう振り返っています。"}, {"t": 374.81666666666666, "x": "猪木1人に、こちらは3人一緒で闘った。"}, {"t": 378.23333333333335, "x": "邪道で気は進まなかったが、\nそれでも人気につながらずつらかった。"}, {"t": 382.68333333333334, "x": "そして、こう続けています。"}, {"t": 384.85, "x": "それがマイク一本でこんなに人気になるとは、\n世の中、不思議なもんだよ。"}, {"t": 390.15, "x": "1984年4月、木村はUWFの\n旗揚げに創設メンバーとして加わります。"}, {"t": 396.8333333333333, "x": "4つ目の新日本プロレスを経て、\n5つ目の団体でした。"}, {"t": 400.9, "x": "ただし、同じ年の10月5日に離脱しています。"}, {"t": 404.53333333333336, "x": "この団体も、のちに形を失いました。"}, {"t": 407.6, "x": "そして1984年11月、\n全日本プロレスへ移ります。"}, {"t": 412.7, "x": "6つ目です。"}, {"t": 413.68333333333334, "x": "きっかけは、世界最強タッグ決定リーグ戦に、\nジャイアント馬場の"}, {"t": 418.55, "x": "ミステリアス・パートナーとして\n登場したことでした。"}, {"t": 421.28333333333336, "x": "なぜ全日本だったのか。"}, {"t": 422.9166666666667, "x": "木村はこう語ったと伝えられています。"}, {"t": 425.3666666666667, "x": "新日本は会社の重役が話に来た。"}, {"t": 428.15, "x": "全日本は馬場さんが料亭に\n招いてくれて、直接誘ってくれた。"}, {"t": 432.65, "x": "となればどちらを選ぶかは明白でしょう。"}, {"t": 435.1666666666667, "x": "移った先でも、最初は敵でした。"}, {"t": 437.8333333333333, "x": "1984年12月8日、愛知県体育館。"}, {"t": 442.25, "x": "試合の最中に木村は馬場へラリアットを見舞い、\n国際血盟軍という集団が生まれています。"}, {"t": 448.46666666666664, "x": "その関係が変わる日も、記録に残っています。"}, {"t": 451.85, "x": "1988年8月29日、日本武道館。"}, {"t": 456.3333333333333, "x": "馬場とのシングルマッチに敗れた直後、\n木村はマイクを取り、こう言いました。"}, {"t": 461.68333333333334, "x": "お前のことをな、アニキと呼ばせてくれ。"}, {"t": 464.43333333333334, "x": "同じ年の世界最強タッグ決定リーグ戦に、\n2人は義兄弟コンビとして出場し、"}, {"t": 470.18333333333334, "x": "3位になっています。"}, {"t": 471.9, "x": "馬場50歳、木村47歳のときでした。"}, {"t": 475.3333333333333, "x": "木村のマイクについて、\n馬場はこう語っています。"}, {"t": 478.75, "x": "最初は、なんてイヤなことをするんだろうと\n思っていたが、そのうちお客さんが"}, {"t": 484.05, "x": "許してくれなくなっちゃったんですよ。"}, {"t": 486.0, "x": "新日本では憎まれ役、\n国際プロレスでは金網の鬼。"}, {"t": 490.18333333333334, "x": "そして全日本では、マイクの\n鬼と呼ばれるようになりました。"}, {"t": 494.0833333333333, "x": "同じ人の呼び名が、リングが\n変わるたびに変わっています。"}, {"t": 497.8, "x": "試合の側の記録も残っています。"}, {"t": 500.1666666666667, "x": "1992年4月18日、後楽園ホール。"}, {"t": 504.6, "x": "50歳を過ぎた木村と対戦した三沢光晴は、\nこう語っています。"}, {"t": 509.48333333333335, "x": "やっぱり金網の鬼は違うよね。"}, {"t": 511.71666666666664, "x": "体の丈夫さはハンパじゃなかった。"}, {"t": 514.0, "x": "打っても体の芯がぶれないからすごかった。"}, {"t": 516.7333333333333, "x": "2006年には、東京スポーツの\nプロレス大賞で功労賞を受けています。"}, {"t": 521.6666666666666, "x": "2000年、木村はプロレスリング・ノアの\n旗揚げメンバーになりました。"}, {"t": 526.0833333333334, "x": "7つ目の団体です。"}, {"t": 527.6333333333333, "x": "最後の試合は2003年3月1日、日本武道館。"}, {"t": 532.0666666666667, "x": "この大会のあと、\n体調不良で長期欠場に入りました。"}, {"t": 536.2833333333333, "x": "2004年7月10日、ノアの東京ドーム大会に\nビデオレターを送り、引退を表明します。"}, {"t": 543.1333333333333, "x": "車椅子の姿でした。"}, {"t": 544.75, "x": "同じ年の12月、\n終身名誉選手会長に就任しています。"}, {"t": 549.4, "x": "公の場に姿を見せた最後は、\n2009年6月19日。"}, {"t": 553.8166666666667, "x": "三沢光晴の葬儀に車椅子で参列しました。"}, {"t": 557.05, "x": "その11か月後が、2010年5月24日です。"}, {"t": 561.1166666666667, "x": "通夜と告別式は、遺族の\n意向により親族のみの密葬で行われました。"}, {"t": 566.2333333333333, "x": "翌5月25日、ノアの富山大会で\n追悼のテンカウントが行われます。"}, {"t": 571.7, "x": "当時社長だった田上明が、\n遺影を持ってリングに上がりました。"}, {"t": 576.1666666666666, "x": "田上はこう語っています。"}, {"t": 577.9833333333333, "x": "リングを下りれば優しい方だった。"}, {"t": 580.1666666666666, "x": "訃報を受けたアントニオ猪木は、\nその日こうコメントしています。"}, {"t": 584.2666666666667, "x": "何十年も会ってないけど1週間ぐらい前に\n夢に出た。"}, {"t": 587.75, "x": "機会があれば見舞いたいと\n思っていたところだった。"}, {"t": 590.6166666666667, "x": "そして、こう続けました。"}, {"t": 592.6666666666666, "x": "亡くなって惜しいとかはオレは\n言わないけど、旅立って寂しい気分。"}, {"t": 597.0666666666667, "x": "2010年6月26日、\n東京・ディファ有明でお別れの会が開かれます。"}, {"t": 602.65, "x": "弔辞を読んだのは、国際軍団をともに\n戦ったアニマル浜口でした。"}, {"t": 607.3, "x": "プロレス界は、あなたを忘れることはありません。"}, {"t": 610.6, "x": "そう言ったあと、浜口は遺影に向かって、\n気合ダァ、と10回繰り返しています。"}, {"t": 616.7666666666667, "x": "浜口は、追悼のコメントでもこう述べていました。"}, {"t": 620.25, "x": "新日本では憎まれ役で国際では\n金網の鬼と言われました。"}, {"t": 624.2833333333333, "x": "普段は無口な方でしたけど、\nマイクパフォーマンスで開眼して愛される"}, {"t": 628.8666666666667, "x": "キャラクターになりました。"}, {"t": 630.1333333333333, "x": "浜口は、1981年9月23日の\nあの一言についても、こう述べています。"}, {"t": 636.8833333333333, "x": "こんばんは、というのは、\n素の木村さんがそのまま出た。"}, {"t": 640.9833333333333, "x": "不細工だったかもしれないけど、\nその裏にあるのは心温かい人間性ですよ。"}, {"t": 646.2666666666667, "x": "そして、維新軍へ移ったあとに木村と\n戦った試合のことを、こう振り返っています。"}, {"t": 652.2833333333333, "x": "木村さんは、とにかく身体が丈夫だった。"}, {"t": 655.4166666666666, "x": "我慢強くて、何があっても痛いとは言わない。"}, {"t": 658.7666666666667, "x": "だから僕も、遠慮なくいかせてもらいました。"}, {"t": 661.7833333333333, "x": "全日本プロレスで長く同じリングに立っていた\n渕正信も、追悼のコメントを残しています。"}, {"t": 667.85, "x": "楽しい思い出ばかりだったな。"}, {"t": 669.7666666666667, "x": "オレは相当いじられたけどな。"}, {"t": 671.7166666666667, "x": "ここまでの事実を、日付で並べ直しておきます。"}, {"t": 675.0166666666667, "x": "1941年6月30日、\n北海道中川郡中川町に生まれる。"}, {"t": 681.0166666666667, "x": "本名は木村政雄。"}, {"t": 682.5666666666667, "x": "1958年、宮城野部屋に入門。"}, {"t": 686.4166666666666, "x": "1964年9月場所限りで廃業し、\n同年秋に日本プロレスへ。"}, {"t": 692.0833333333334, "x": "1965年4月2日、\nリキスポーツパレスでデビュー。"}, {"t": 696.5166666666667, "x": "1966年に東京プロレス、\n1967年に国際プロレスへ。"}, {"t": 702.6333333333333, "x": "1969年1月1日、\nリングネームがラッシャー木村に。"}, {"t": 707.6666666666666, "x": "1970年10月8日、\n大阪府立体育館で日本初の金網デスマッチ。"}, {"t": 713.6833333333333, "x": "17分22秒KO勝ち。"}, {"t": 716.0166666666667, "x": "1975年4月19日、\nIWA世界ヘビー級王座を獲得。"}, {"t": 721.8833333333333, "x": "1976年から\n1979年にかけて26回連続防衛。"}, {"t": 727.65, "x": "1981年8月6日、室蘭で最後の防衛戦。"}, {"t": 732.4833333333333, "x": "8月9日、羅臼で国際プロレス最終興行。"}, {"t": 736.3166666666667, "x": "9月30日、会社が消滅。"}, {"t": 739.1666666666666, "x": "1981年9月23日、\n田園コロシアムで、こんばんは。"}, {"t": 745.3833333333333, "x": "1981年10月8日、蔵前国技館。"}, {"t": 749.6, "x": "猪木戦は10分35秒で木村の反則勝ち。"}, {"t": 752.95, "x": "1981年11月5日、蔵前国技館。"}, {"t": 757.5, "x": "ランバージャック・デスマッチは\n猪木のTKO勝ち。"}, {"t": 760.55, "x": "1984年4月、UWF旗揚げに参加。"}, {"t": 765.05, "x": "同年10月5日に離脱。"}, {"t": 766.9666666666667, "x": "11月、全日本プロレスへ。"}, {"t": 769.6666666666666, "x": "1988年8月29日、日本武道館。"}, {"t": 774.15, "x": "アニキと呼ばせてくれ。"}, {"t": 775.5333333333333, "x": "2000年、プロレスリング・ノアの\n旗揚げメンバーに。"}, {"t": 779.05, "x": "2003年3月1日、日本武道館が最後の試合。"}, {"t": 783.3833333333333, "x": "2004年7月10日、引退を表明。"}, {"t": 786.7833333333333, "x": "2010年5月24日、死去。68歳。"}, {"t": 791.0, "x": "6月26日、ディファ有明でお別れの会。"}, {"t": 794.6166666666667, "x": "訃報のとき、当時プロレスリング・ノアの\nゼネラルマネージャーだった仲田龍は、"}, {"t": 799.35, "x": "こうコメントしています。"}, {"t": 801.05, "x": "三沢さんに続きプロレス界の功労者が\n亡くなって本当に残念としか言えない。"}, {"t": 805.95, "x": "半年前くらいに仕事の件で自宅に\n電話した時は元気そうだったのに。"}, {"t": 810.3666666666667, "x": "7つの団体のリングに上がった選手でした。"}, {"t": 813.1666666666666, "x": "そのうち東京プロレス、国際プロレス、そして\nUWFは、いずれも残っていません。"}, {"t": 820.0666666666667, "x": "リングの上での26回連続防衛は、\nいまも国際プロレスの記録として残っています。"}, {"t": 826.0, "x": "ただ、訃報のときに多くの人が思い出したのは、\nその数字ではありませんでした。"}, {"t": 831.5333333333333, "x": "今回の物語を通して、皆様の中に\nラッシャー木村という1人のプロレスラーの"}, {"t": 836.8, "x": "新しい一面が刻まれていれば幸いです。"}, {"t": 839.5833333333334, "x": "イメージ映像"}, {"t": 839.5833333333334, "x": "最後までご視聴いただき誠に\nありがとうございました。"}, {"t": 842.95, "x": "もしこの動画が心に残るものであったなら、ぜひ\nチャンネル登録と高評価をお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
