<script>
const D={"name": "未放送のシーク戦", "file": "233_編集用", "dur": 866.2, "segs": [], "subs": [{"t": 0.0, "x": "1980年5月2日、東京の後楽園ホール。"}, {"t": 4.516666666666667, "x": "この日のメインイベントは、\nアブドーラ・ザ・ブッチャー対ザ・シークでした。"}, {"t": 8.75, "x": "前の年まで同じ側に立っていた2人が、\n敵同士になっての一騎討ちです。"}, {"t": 13.816666666666666, "x": "イメージ映像"}, {"t": 13.816666666666666, "x": "試合は場外へ流れ、\nそのまま客席へなだれ込みました。"}, {"t": 17.983333333333334, "x": "イメージ映像"}, {"t": 17.983333333333334, "x": "そこで、放送席にいた1人の男が巻き込まれます。"}, {"t": 21.683333333333334, "x": "日本テレビのアナウンサー、倉持隆夫です。"}, {"t": 25.016666666666666, "x": "倉持はシークに襲われ、額を割りました。"}, {"t": 28.316666666666666, "x": "イメージ映像"}, {"t": 28.316666666666666, "x": "実況ができなくなり、\n救急車で病院へ運ばれています。"}, {"t": 32.45, "x": "そしてこの試合は、\nテレビで放送されませんでした。"}, {"t": 36.166666666666664, "x": "イメージ映像"}, {"t": 36.166666666666664, "x": "全日本プロレスのシリーズ最終戦。"}, {"t": 38.68333333333333, "x": "会場は後楽園ホール。"}, {"t": 40.516666666666666, "x": "カードはメインイベント。"}, {"t": 42.0, "x": "それなのに、なぜこの1試合だけが\nテレビに残らなかったのでしょうか。"}, {"t": 46.6, "x": "今回は、1980年5月2日という1日を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 54.06666666666667, "x": "裏の取れていない話は入れません。"}, {"t": 56.2, "x": "イメージ映像"}, {"t": 56.2, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.68333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 64.26666666666667, "x": "イメージ映像"}, {"t": 64.26666666666667, "x": "まず、この試合を流さないことが\n可能だった理由から確認します。"}, {"t": 68.93333333333334, "x": "イメージ映像"}, {"t": 68.93333333333334, "x": "1979年3月31日。"}, {"t": 72.1, "x": "新潟県三条市の厚生福祉会館で\n行われた第25戦の生中継が、"}, {"t": 77.33333333333333, "x": "土曜の夜8時に『全日本プロレス中継』が\n流れた最後の日になりました。"}, {"t": 82.11666666666666, "x": "イメージ映像"}, {"t": 82.11666666666666, "x": "翌週の4月7日から、放送は土曜の\n17時30分から18時24分までに移ります。"}, {"t": 88.98333333333333, "x": "イメージ映像"}, {"t": 88.98333333333333, "x": "このとき、放送の形も変わりました。"}, {"t": 91.78333333333333, "x": "レギュラーの中継が、生中継から\n原則録画中継になっています。"}, {"t": 96.58333333333333, "x": "新しい枠での最初の放送は、前日4月6日に\n秋田県立体育館で行われた試合の録画でした。"}, {"t": 103.8, "x": "イメージ映像"}, {"t": 103.8, "x": "第7回チャンピオン・カーニバルの\n優勝決定戦、鶴田対ブッチャーです。"}, {"t": 108.81666666666666, "x": "枠が動いたのも、この第7回の大会期間中でした。"}, {"t": 112.76666666666667, "x": "生中継では、リングで起きたことが\nそのまま電波に乗ります。"}, {"t": 116.81666666666666, "x": "録画中継では、試合が終わってから\n放送までのあいだに時間があります。"}, {"t": 121.76666666666667, "x": "イメージ映像"}, {"t": 121.76666666666667, "x": "その時間の中で、局の側がどこを出すかを\n決められるようになりました。"}, {"t": 126.38333333333334, "x": "イメージ映像"}, {"t": 126.38333333333334, "x": "この録画中継の時代は、\n1985年9月まで6年半続きます。"}, {"t": 131.91666666666666, "x": "ゴールデンタイムに戻ってレギュラーの生中継が\n復活するのは、1985年10月19日でした。"}, {"t": 139.03333333333333, "x": "今回の出来事は、\n録画中継になって1年目に起きています。"}, {"t": 143.28333333333333, "x": "イメージ映像"}, {"t": 143.28333333333333, "x": "1980年のシリーズを見ていきます。"}, {"t": 146.33333333333334, "x": "第8回チャンピオン・カーニバル。"}, {"t": 148.31666666666666, "x": "イメージ映像"}, {"t": 148.31666666666666, "x": "参加選手は13名でした。"}, {"t": 150.46666666666667, "x": "この年のリーグ戦は、\n3つの軍団の抗争が中心になります。"}, {"t": 155.03333333333333, "x": "イメージ映像"}, {"t": 155.03333333333333, "x": "ブッチャーの側に、レイ・キャンディと\nミステリアス・アサシン。"}, {"t": 158.51666666666668, "x": "テリー・ファンクの側に、\nディック・スレーターとテッド・デビアス。"}, {"t": 162.11666666666667, "x": "そこに馬場と鶴田の\n全日本プロレス勢が加わる形でした。"}, {"t": 165.96666666666667, "x": "イメージ映像"}, {"t": 165.96666666666667, "x": "最終的な得点は、鶴田が19点で1位。"}, {"t": 169.76666666666668, "x": "ディック・スレーターが19点で2位。"}, {"t": 172.0, "x": "ブッチャーが18点、テリー・ファンクが\n18点、馬場が17点と続きます。"}, {"t": 177.96666666666667, "x": "イメージ映像"}, {"t": 177.96666666666667, "x": "優勝決定戦は5月1日、福岡で行われました。"}, {"t": 182.33333333333334, "x": "イメージ映像"}, {"t": 182.33333333333334, "x": "鶴田がジャーマン・スープレックスで\nスレーターを下し、"}, {"t": 185.31666666666666, "x": "このリーグ戦で初めて優勝しています。"}, {"t": 188.36666666666667, "x": "イメージ映像"}, {"t": 188.36666666666667, "x": "覆面選手のミステリアス・アサシンは、\nこのシリーズ中に何度もマスクを剥がされました。"}, {"t": 193.95, "x": "終盤は覆面をやめ、素顔の\nボビー・ジャガーズとして出場しています。"}, {"t": 198.83333333333334, "x": "その途中、4月18日の大阪府立体育館で\n1つの試合がありました。"}, {"t": 204.28333333333333, "x": "テリー・ファンク対ブッチャーです。"}, {"t": 206.11666666666667, "x": "ブッチャーはテリーの胸元にビール瓶を\n突き刺し、スレーターが救援に入りました。"}, {"t": 211.48333333333332, "x": "この試合は放送されています。"}, {"t": 213.6, "x": "ただし、途中から静止画の\n映像に切り替えられました。"}, {"t": 217.66666666666666, "x": "イメージ映像"}, {"t": 217.66666666666666, "x": "日本テレビが局の自主判断でおこなった処理です。"}, {"t": 220.83333333333334, "x": "録画中継だからできたことでした。"}, {"t": 223.06666666666666, "x": "ここにザ・シークが入ってきます。"}, {"t": 225.0, "x": "シークは、この年のリーグ戦の対象外として、\nシリーズに特別参加した選手でした。"}, {"t": 231.18333333333334, "x": "日本では「アラビアの怪人」と呼ばれています。"}, {"t": 233.9, "x": "アメリカでは、シークを名乗る\nレスラーが数多く出たため、"}, {"t": 237.66666666666666, "x": "イメージ映像"}, {"t": 237.66666666666666, "x": "ジ・オリジナル・シークとも呼ばれました。"}, {"t": 240.1, "x": "デトロイト地区を仕切ったことから、\nデトロイトの帝王という呼び名も残っています。"}, {"t": 245.35, "x": "イメージ映像"}, {"t": 245.35, "x": "日本での戦歴も確認しておきます。"}, {"t": 247.86666666666667, "x": "1972年9月6日、田園コロシアム。"}, {"t": 251.95, "x": "シークは坂口征二から\nUNヘビー級王座を奪いました。"}, {"t": 255.81666666666666, "x": "イメージ映像"}, {"t": 255.81666666666666, "x": "翌7日のリターンマッチで坂口に\n奪い返されますが、この2連戦は"}, {"t": 260.46666666666664, "x": "凄惨な流血戦になったと記録されています。"}, {"t": 263.26666666666665, "x": "1974年11月には、\n新日本プロレスにも参戦しました。"}, {"t": 268.65, "x": "イメージ映像"}, {"t": 268.65, "x": "11月13日、沖縄の奥武山体育館で、猪木と\nランバージャック・デスマッチを行っています。"}, {"t": 275.8666666666667, "x": "ただしシークは、このシリーズの\n途中で緊急帰国しました。"}, {"t": 279.95, "x": "イメージ映像"}, {"t": 279.95, "x": "デトロイトで自分の団体から選手を引き抜かれ、\n新しい団体を作られたためです。"}, {"t": 285.65, "x": "シークが新日本プロレスに上がったのは、\nこの1シリーズだけでした。"}, {"t": 290.0833333333333, "x": "1976年には、猪木との\n異種格闘技戦が決まったモハメド・アリの"}, {"t": 295.23333333333335, "x": "イメージ映像"}, {"t": 295.23333333333335, "x": "アドバイザーになったと報じられています。"}, {"t": 297.43333333333334, "x": "ただし、新日本プロレスに\n再び来ることはありませんでした。"}, {"t": 301.5833333333333, "x": "イメージ映像"}, {"t": 301.5833333333333, "x": "試合の中身も見ておきます。"}, {"t": 303.53333333333336, "x": "シークの試合は、その大半が殴る蹴るの\nラフファイトと反則攻撃でした。"}, {"t": 308.53333333333336, "x": "極める技も持っています。"}, {"t": 310.28333333333336, "x": "うつぶせに倒した相手の背中に馬乗りになり、\n首を掴んで反り返らせるキャメルクラッチ。"}, {"t": 315.9, "x": "イメージ映像"}, {"t": 315.9, "x": "正面から相手の喉元を\n鷲掴みにして締め上げるチョーククロー。"}, {"t": 319.8666666666667, "x": "1970年代の後半以降は体力の\n衰えを補うため、場外乱闘への依存度が"}, {"t": 326.35, "x": "イメージ映像"}, {"t": 326.35, "x": "高くなっていったとされています。"}, {"t": 328.1333333333333, "x": "5月2日の後楽園ホールも、\nその場外乱闘の延長線上にありました。"}, {"t": 333.53333333333336, "x": "イメージ映像"}, {"t": 333.53333333333336, "x": "ブッチャーとは、もともと組んでいた相手でした。"}, {"t": 336.51666666666665, "x": "その関係が切れたのが、1979年12月です。"}, {"t": 341.05, "x": "『世界最強タッグ決定リーグ戦』の最終戦で、\nブッチャーの地獄突きがシークに誤爆しました。"}, {"t": 347.26666666666665, "x": "イメージ映像"}, {"t": 347.26666666666665, "x": "これに怒ったシークが、\nブッチャーの顔面に火を放ちます。"}, {"t": 351.31666666666666, "x": "2人はここで仲間割れしました。"}, {"t": 353.35, "x": "イメージ映像"}, {"t": 353.35, "x": "1980年のシークの来日は、\nその続きに当たります。"}, {"t": 357.8833333333333, "x": "イメージ映像"}, {"t": 357.8833333333333, "x": "4月25日には、シークは\n馬場ともシングルマッチを行っています。"}, {"t": 362.76666666666665, "x": "イメージ映像"}, {"t": 362.76666666666665, "x": "一方のブッチャーは、この1980年に\n人気の頂点にありました。"}, {"t": 367.8833333333333, "x": "きっかけの1つが漫画です。"}, {"t": 369.7, "x": "イメージ映像"}, {"t": 369.7, "x": "1979年、河口仁の\n『愛しのボッチャー』が講談社の"}, {"t": 374.73333333333335, "x": "『週刊少年マガジン』で連載を始めました。"}, {"t": 377.51666666666665, "x": "イメージ映像"}, {"t": 377.51666666666665, "x": "悪役でありながらドジで\n憎めない「ボッチャー」が、"}, {"t": 380.2, "x": "「ジャイアント葉場」や「アントニオ猪林」と\nドタバタを繰り広げる内容です。"}, {"t": 384.96666666666664, "x": "イメージ映像"}, {"t": 384.96666666666664, "x": "翌1980年、ブッチャーは\n「サントリーレモン」の"}, {"t": 388.8333333333333, "x": "テレビコマーシャルに出演しました。"}, {"t": 390.8333333333333, "x": "共演したのはモデルの景山真澄です。"}, {"t": 393.43333333333334, "x": "同じ年、ブッチャーはテイチクの\nコンティネンタル・レーベルからレコード"}, {"t": 397.51666666666665, "x": "『ザ・ブッチャー』を出しています。"}, {"t": 398.96666666666664, "x": "イメージ映像"}, {"t": 398.96666666666664, "x": "A面は『ザ・ブッチャー』。"}, {"t": 400.45, "x": "作詞と作曲は小田裕一郎、編曲は井上鑑。"}, {"t": 404.46666666666664, "x": "歌っているのは、ザ・スープレックスと\nアブドーラ・ザ・ブッチャーです。"}, {"t": 408.35, "x": "そしてB面が\n『ブッチャー・ザ・グレイテスト』でした。"}, {"t": 411.0833333333333, "x": "この曲の作詞を担当したのが、倉持隆夫です。"}, {"t": 414.76666666666665, "x": "歌にも、ザ・スープレックスとともに\n倉持隆夫と松永二三男の2人が参加しています。"}, {"t": 420.35, "x": "どちらも『全日本プロレス中継』の実況を\n担当していた日本テレビのアナウンサーでした。"}, {"t": 425.75, "x": "イメージ映像"}, {"t": 425.75, "x": "ジャケットには、『愛しのボッチャー』を\n描いた河口仁のイラストが使われています。"}, {"t": 431.0, "x": "ブッチャーはこの年、\nプロレス大賞の大衆賞を受けました。"}, {"t": 435.0, "x": "5月2日のリングにいたブッチャーと、\nその試合を実況していた倉持。"}, {"t": 439.78333333333336, "x": "イメージ映像"}, {"t": 439.78333333333336, "x": "2人の名前は、同じ1980年に1枚の\nレコードの上でも並んでいたことになります。"}, {"t": 446.01666666666665, "x": "そして5月2日。"}, {"t": 447.45, "x": "シリーズの最終戦、後楽園ホールです。"}, {"t": 450.8, "x": "メインイベントに組まれたのが、\nブッチャー対ザ・シークでした。"}, {"t": 454.56666666666666, "x": "実況を担当したのは倉持隆夫です。"}, {"t": 457.25, "x": "1941年1月2日生まれ。"}, {"t": 460.2, "x": "1964年4月に日本テレビへ入社しました。"}, {"t": 464.1166666666667, "x": "徳光和夫の薦めで『全日本プロレス中継』の\n実況陣に入り、1976年頃から"}, {"t": 470.78333333333336, "x": "メインのアナウンサーになっています。"}, {"t": 472.68333333333334, "x": "ジャイアント馬場、ジャンボ鶴田、\nミル・マスカラス、ザ・ファンクス。"}, {"t": 477.6166666666667, "x": "数々の試合を18年にわたって実況した人物です。"}, {"t": 481.46666666666664, "x": "リングサイドには、\nもう1人アナウンサーがいました。"}, {"t": 484.76666666666665, "x": "松永二三男。"}, {"t": 485.9166666666667, "x": "1951年4月18日生まれ、\n1974年の日本テレビ入社です。"}, {"t": 492.55, "x": "イメージ映像"}, {"t": 492.55, "x": "この日はリングサイドの\nリポーターを務めていました。"}, {"t": 495.46666666666664, "x": "イメージ映像"}, {"t": 495.46666666666664, "x": "試合が客席まで流れた中で、\n倉持がシークに襲われます。"}, {"t": 499.9, "x": "額を切り裂かれ、そこで実況が止まりました。"}, {"t": 503.3, "x": "その瞬間、松永はインタビュー用の\nマイクを使ってこう叫んでいます。"}, {"t": 508.35, "x": "「倉持アナウンサーの額が割れた」\n実況はそのまま松永が引き継ぎました。"}, {"t": 512.8166666666667, "x": "イメージ映像"}, {"t": 512.8166666666667, "x": "倉持は額を割った状態で会場から運び出され、\n救急車で病院へ向かっています。"}, {"t": 518.65, "x": "このあと、局の中で2つのことが起きました。"}, {"t": 521.8166666666667, "x": "1つは報道です。"}, {"t": 523.25, "x": "この出来事は、その日の夜の\nニュース番組『NNNきょうの出来事』で"}, {"t": 527.7, "x": "イメージ映像"}, {"t": 527.7, "x": "報じられる寸前まで行きました。"}, {"t": 529.6333333333333, "x": "プロレス中継の枠ではなく、\nニュースの枠で扱われかけたことになります。"}, {"t": 534.4, "x": "もう1つは、翌日です。"}, {"t": 536.6333333333333, "x": "馬場が日本テレビを訪れ、スポーツ局長と、\n金原二郎アナウンス部長に謝罪しました。"}, {"t": 543.2166666666667, "x": "イメージ映像"}, {"t": 543.2166666666667, "x": "そのうえで、試合そのものの扱いが決まります。"}, {"t": 546.6, "x": "日本テレビは局の自主判断で、\nブッチャー対ザ・シークを未放送としました。"}, {"t": 551.6333333333333, "x": "イメージ映像"}, {"t": 551.6333333333333, "x": "この試合は録画中継の予定で、\n収録そのものは済んでいます。"}, {"t": 556.2, "x": "撮ってあった映像を、\n流さないという判断でした。"}, {"t": 559.85, "x": "松永は後年、この試合についてこう語っています。"}, {"t": 563.7666666666667, "x": "「ブッチャーVSシークをそのまま放送していたら\n全日本プロレス中継の番組存続の危機だった」"}, {"t": 569.6333333333333, "x": "イメージ映像"}, {"t": 569.6333333333333, "x": "面白いか面白くないかではなく、\n番組を続けられるかどうかという言葉でした。"}, {"t": 574.8, "x": "イメージ映像"}, {"t": 574.8, "x": "ここで、流血がどこまで\n許されていたのかを確認しておきます。"}, {"t": 579.1333333333333, "x": "流血が映せなかったわけではありません。"}, {"t": 581.6333333333333, "x": "1970年代の日本では、金網を組んだ\nデスマッチもテレビ中継に乗っています。"}, {"t": 587.75, "x": "イメージ映像"}, {"t": 587.75, "x": "この時期の全日本プロレスの中継でも、\n凶器による流血の試合は"}, {"t": 592.3166666666667, "x": "繰り返し放送されていました。"}, {"t": 594.1833333333333, "x": "イメージ映像"}, {"t": 594.1833333333333, "x": "4月18日のテリー対ブッチャーも、ビール瓶が\n出た試合が静止画に切り替えられただけで、"}, {"t": 600.2, "x": "放送そのものは行われています。"}, {"t": 602.65, "x": "5月2日との違いとして記録に\n残っているのは、1つだけです。"}, {"t": 606.9666666666667, "x": "4月18日はレスラー同士の試合でした。"}, {"t": 610.0, "x": "イメージ映像"}, {"t": 610.0, "x": "5月2日は、放送席にいた局の\nアナウンサーが病院へ運ばれています。"}, {"t": 615.0333333333333, "x": "イメージ映像"}, {"t": 615.0333333333333, "x": "資料で確認できるのは、この並びまでです。"}, {"t": 618.3, "x": "シークがなぜこの行動を取ったのかを、本人の\n言葉で裏づけた資料は確認できませんでした。"}, {"t": 624.35, "x": "イメージ映像"}, {"t": 624.35, "x": "ここまでの事実を日付で並べ直しておきます。"}, {"t": 627.2833333333333, "x": "1979年3月31日、新潟県三条市。"}, {"t": 632.3333333333334, "x": "土曜20時枠の最後の放送。"}, {"t": 634.6166666666667, "x": "イメージ映像"}, {"t": 634.6166666666667, "x": "1979年4月7日、\n土曜17時30分枠へ移動。"}, {"t": 640.0166666666667, "x": "レギュラーが原則録画中継になる。"}, {"t": 642.35, "x": "イメージ映像"}, {"t": 642.35, "x": "1980年、第8回チャンピオン・カーニバル。"}, {"t": 646.5666666666667, "x": "参加13名。"}, {"t": 647.9666666666667, "x": "1980年4月18日、大阪府立体育館。"}, {"t": 652.7, "x": "テリー・ファンク対ブッチャー。"}, {"t": 654.2833333333333, "x": "途中から静止画に切り替えて放送。"}, {"t": 656.7, "x": "1980年4月25日、\nシークが馬場とシングルマッチ。"}, {"t": 661.5833333333334, "x": "イメージ映像"}, {"t": 661.5833333333334, "x": "1980年5月1日、福岡。"}, {"t": 665.2833333333333, "x": "優勝決定戦で鶴田がスレーターを下し初優勝。"}, {"t": 668.85, "x": "1980年5月2日、後楽園ホール。"}, {"t": 672.85, "x": "シリーズ最終戦。"}, {"t": 674.35, "x": "ブッチャー対ザ・シーク。"}, {"t": 675.7833333333333, "x": "同じ日、実況の倉持隆夫がシークに\n襲われ額を割り、救急車で病院へ。"}, {"t": 681.8833333333333, "x": "実況は松永二三男が引き継ぐ。"}, {"t": 684.1166666666667, "x": "イメージ映像"}, {"t": 684.1166666666667, "x": "同じ日の夜、『NNNきょうの出来事』で\n報じられる寸前まで行く。"}, {"t": 688.7666666666667, "x": "翌5月3日、馬場が日本テレビを訪れ、\nスポーツ局長とアナウンス部長に謝罪。"}, {"t": 695.1833333333333, "x": "そして、局の自主判断でこの試合は未放送。"}, {"t": 698.7166666666667, "x": "イメージ映像"}, {"t": 698.7166666666667, "x": "その後の記録も残っています。"}, {"t": 700.7166666666667, "x": "シークはこの年の暮れの\n『世界最強タッグ決定リーグ戦』にも"}, {"t": 704.5666666666667, "x": "来日しました。"}, {"t": 705.5166666666667, "x": "シークのコピーと言われた\nグレート・メフィストを連れての参加です。"}, {"t": 709.1333333333333, "x": "イメージ映像"}, {"t": 709.1333333333333, "x": "ブッチャーとキラー・トーア・カマタの\n組との最終戦を両者リングアウトに持ち込み、"}, {"t": 713.75, "x": "ブッチャー組の優勝を止めました。"}, {"t": 716.15, "x": "イメージ映像"}, {"t": 716.15, "x": "翌1981年の同じリーグ戦には、\nマーク・ルーインと組んで参加しています。"}, {"t": 721.9166666666666, "x": "イメージ映像"}, {"t": 721.9166666666666, "x": "昭和の時代では、これがシークの\n最後の来日になりました。"}, {"t": 726.0333333333333, "x": "ブッチャーのほうは、1980年10月13日に\n鶴田からUNヘビー級王座を奪っています。"}, {"t": 733.0833333333334, "x": "倉持は、このあとも実況を続けました。"}, {"t": 736.1833333333333, "x": "翌1981年の『世界最強タッグ決定リーグ戦』\n最終戦では、スタン・ハンセンの"}, {"t": 742.4333333333333, "x": "突然の乱入に立ち会っています。"}, {"t": 744.5, "x": "イメージ映像"}, {"t": 744.5, "x": "このとき倉持は、\n新日本プロレスから来たハンセンの"}, {"t": 748.05, "x": "名前を先に出すのはまずいと考えました。"}, {"t": 750.6166666666667, "x": "そこで控室から出てきた時点では、\n「これは誰でしょうか。"}, {"t": 754.6166666666667, "x": "ウエスタンハットをかぶった大型の\n男」と実況しています。"}, {"t": 758.15, "x": "カメラが切り替わった瞬間に、\n「あっ、スタン・ハンセンだ」と言い直しました。"}, {"t": 763.4666666666667, "x": "日本テレビのアナウンサーで、\nウエスタン・ラリアットという技の"}, {"t": 767.4666666666667, "x": "名前を初めて出したのも倉持です。"}, {"t": 769.7166666666667, "x": "イメージ映像"}, {"t": 769.7166666666667, "x": "試合後の乱闘では、「これは全日本プロレスの\nリング上だ」とも言っています。"}, {"t": 774.7166666666667, "x": "1990年に若林健治へメインの\n実況を譲り、事業部へ異動しました。"}, {"t": 780.7, "x": "実況を担当した期間は18年です。"}, {"t": 783.5333333333333, "x": "2010年1月1日には、\n新潮社から"}, {"t": 786.7666666666667, "x": "イメージ映像"}, {"t": 786.7666666666667, "x": "『マイクは死んでも離さない 「全日本プロレス」\n実況、黄金期の18年』を出しています。"}, {"t": 793.0166666666667, "x": "松永は1983年の\n『世界最強タッグ決定リーグ戦』まで"}, {"t": 797.7166666666667, "x": "『全日本プロレス中継』の実況を担当しました。"}, {"t": 800.8166666666667, "x": "イメージ映像"}, {"t": 800.8166666666667, "x": "そして、放送されなかった\nこの試合には続きがあります。"}, {"t": 804.7333333333333, "x": "収録された映像そのものは、\n局に残っていました。"}, {"t": 808.4666666666667, "x": "イメージ映像"}, {"t": 808.4666666666667, "x": "後年、日テレジータスの『プロレスクラシック』\nなどの懐古番組で放送されています。"}, {"t": 814.0, "x": "イメージ映像"}, {"t": 814.0, "x": "長いあいだおもてに出なかった映像が、\nあとになって流れたことになります。"}, {"t": 818.7, "x": "1980年の第8回チャンピオン・カーニバルは、\n記録の上では鶴田の初優勝で終わりました。"}, {"t": 825.5666666666667, "x": "イメージ映像"}, {"t": 825.5666666666667, "x": "その最終戦のメインイベントは、\nその日には電波に乗っていません。"}, {"t": 830.0166666666667, "x": "1980年5月2日にこの試合を見たのは、\n後楽園ホールに来ていた人だけです。"}, {"t": 836.25, "x": "イメージ映像"}, {"t": 836.25, "x": "録画という仕組みは、放送する日を\n選ぶだけの道具ではありませんでした。"}, {"t": 841.0, "x": "流さないという決定も、\n同じ仕組みの中から生まれていました。"}, {"t": 845.1333333333333, "x": "あの夜、後楽園ホールにいなかった人に\nこの試合を伝える手段は、"}, {"t": 849.7833333333333, "x": "長いあいだありませんでした。"}, {"t": 851.7833333333333, "x": "イメージ映像"}, {"t": 851.7833333333333, "x": "だからこそ、日付と数字だけで\n組み立てるやり方にこだわって、"}, {"t": 855.6833333333333, "x": "この動画を作っています。"}, {"t": 857.6666666666666, "x": "チャンネル登録と高評価は、\nその作業を続ける一番の力になります。"}, {"t": 862.6666666666666, "x": "ご視聴、ありがとうございました。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
