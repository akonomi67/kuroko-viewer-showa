<script>
const D={"name": "山本小鉄", "file": "254_編集用", "dur": 928.56665625, "segs": [], "subs": [{"t": 0.0, "x": "2010年8月28日の午前6時42分、\n長野県軽井沢町の病院。"}, {"t": 6.416666666666667, "x": "新日本プロレス顧問の山本小鉄が\n68歳で息を引き取りました。"}, {"t": 11.066666666666666, "x": "軽井沢へは静養に来ていました。"}, {"t": 13.3, "x": "発表された死因は、低酸素性脳症です。"}, {"t": 16.933333333333334, "x": "山本は20年ほど前に糖尿病を患っていました。"}, {"t": 20.583333333333332, "x": "それでも入院は拒み、道場で\nスクワットとダンベルを続けていたと、"}, {"t": 25.333333333333332, "x": "東京スポーツは伝えています。"}, {"t": 27.583333333333332, "x": "1980年4月の引退から\n30年がたっていました。"}, {"t": 31.816666666666666, "x": "新日本プロレスの若手たちが、\n道場でいちばん恐れた「鬼軍曹」。"}, {"t": 36.55, "x": "引退した男はなぜ死の\n直前まで体を鍛え続けたのか。"}, {"t": 40.416666666666664, "x": "今回は山本小鉄という1人の\nプロレスラーの68年を辿っていきます。"}, {"t": 45.21666666666667, "x": "手がかりは本人が残した言葉と\n記録に残る日付です。"}, {"t": 48.81666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 51.31666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 56.9, "x": "山本小鉄、本名は山本勝。"}, {"t": 59.8, "x": "1941年10月30日、\n神奈川県横浜市に生まれました。"}, {"t": 65.43333333333334, "x": "10人きょうだいの六男です。"}, {"t": 67.36666666666666, "x": "本人の回想によると、小学5年生のころから\n新聞配達をして、家計を助けていました。"}, {"t": 74.21666666666667, "x": "中学2年生のとき、初めてプロレスを見ます。"}, {"t": 77.63333333333334, "x": "近所のパン屋に置かれたテレビでした。"}, {"t": 79.86666666666666, "x": "画面に映っていたのは、力道山でした。"}, {"t": 82.91666666666667, "x": "衝撃を受けた少年は13歳で\nボディビル道場に入門します。"}, {"t": 87.31666666666666, "x": "場所は横浜市内でした。"}, {"t": 89.13333333333334, "x": "中学を出ると、横浜市立横浜商業高校に進みます。"}, {"t": 93.78333333333333, "x": "しかし父親が急死し、\n1学期で学校を辞めました。"}, {"t": 98.0, "x": "その後は鋳物工場で働きます。"}, {"t": 100.33333333333333, "x": "働きながら、プロレスラーになるための\n練習を続けました。"}, {"t": 104.25, "x": "1962年、山本は東京・渋谷の\nリキ・スポーツパレスを訪ねます。"}, {"t": 109.88333333333334, "x": "日本プロレスへの入門を願い出ました。"}, {"t": 112.46666666666667, "x": "返ってきた答えは、「体が小さいな。"}, {"t": 115.48333333333333, "x": "80キロになったらまた来なさい」でした。"}, {"t": 117.93333333333334, "x": "山本はそれから1年かけて体重を\n80キロまで増やします。"}, {"t": 122.03333333333333, "x": "そして1963年、日本プロレスへの\n入門が認められました。"}, {"t": 127.25, "x": "相部屋の先輩はグレート小鹿です。"}, {"t": 129.68333333333334, "x": "山本より半年ほど早く入っていました。"}, {"t": 132.45, "x": "デビューは同じ1963年の7月です。"}, {"t": 135.93333333333334, "x": "その日の山本はリングの設営を終えていました。"}, {"t": 138.93333333333334, "x": "本人の回想によると、そのあと渋谷で\n映画を1本見て、夕食をとっています。"}, {"t": 144.86666666666667, "x": "どうせ今日も出番はない。"}, {"t": 146.46666666666667, "x": "そう考えて、ビールを2本\n飲んでから会場に戻りました。"}, {"t": 150.51666666666668, "x": "するとマッチメーカーの\n吉村道明から試合を告げられます。"}, {"t": 154.28333333333333, "x": "「今日試合をやれ」。"}, {"t": 155.48333333333332, "x": "山本はビールが入ったまま\nデビュー戦のリングに上がりました。"}, {"t": 159.16666666666666, "x": "その年の12月15日、\n力道山が亡くなりました。"}, {"t": 163.21666666666667, "x": "山本は先輩と2人で慶応病院へ向かいます。"}, {"t": 166.58333333333334, "x": "そして窓から力道山の解剖に立ち会いました。"}, {"t": 169.58333333333334, "x": "本人は後に、こう振り返っています。"}, {"t": 172.55, "x": "「あの人でも死んじゃうのか」。"}, {"t": 174.18333333333334, "x": "信じられなかったといいます。"}, {"t": 176.08333333333334, "x": "力道山の指導を受けた練習生は\nその後みな辞めていきました。"}, {"t": 179.95, "x": "結果として、山本小鉄が力道山の\n最後の弟子になりました。"}, {"t": 184.21666666666667, "x": "日本プロレスの道場ではもう1人の\n師に出会います。"}, {"t": 187.41666666666666, "x": "後に「プロレスの神様」と呼ばれる、\nカール・ゴッチです。"}, {"t": 191.1, "x": "練習が朝9時に始まるとなれば、\nゴッチは9時ちょうどに鍵を閉めました。"}, {"t": 195.91666666666666, "x": "閉めたのは、道場の扉です。"}, {"t": 198.36666666666667, "x": "遅れた選手は、何があっても中に入れません。"}, {"t": 201.6, "x": "山本は後に、こう語っています。"}, {"t": 204.31666666666666, "x": "「力道山先生から根性論を学んだとすれば、\nゴッチからは強さを学んだ」。"}, {"t": 209.58333333333334, "x": "1967年1月4日、山本は\n羽田空港からアメリカへ旅立ちました。"}, {"t": 215.71666666666667, "x": "一緒に行ったのは2年先輩の星野勘太郎です。"}, {"t": 218.95, "x": "最初の行き先はロサンゼルスでした。"}, {"t": 221.31666666666666, "x": "到着した翌日にはもうタッグの\nタイトルマッチが組まれています。"}, {"t": 225.13333333333333, "x": "結果は引き分けでした。"}, {"t": 226.66666666666666, "x": "それでも会場には7,000人が集まりました。"}, {"t": 229.61666666666667, "x": "山本はこの1試合で\n750ドルを受け取っています。"}, {"t": 233.31666666666666, "x": "当時は1ドル360円の時代です。"}, {"t": 236.15, "x": "日本円にすると、30万円近い額でした。"}, {"t": 239.61666666666667, "x": "その後、山本は単身で\nテキサス州ダラスへ移りました。"}, {"t": 243.71666666666667, "x": "ここで過ごしたのはおよそ半年です。"}, {"t": 246.08333333333334, "x": "多いときには1週間に9試合をこなしました。"}, {"t": 249.16666666666666, "x": "本人の回想によると、\nこのとき扇子を売っています。"}, {"t": 252.93333333333334, "x": "富士山や芸者の絵を描いた扇子を、\n日本から5,000本取り寄せました。"}, {"t": 257.73333333333335, "x": "売った場所は冷房のない体育館です。"}, {"t": 260.3333333333333, "x": "1967年6月、山本はテネシー州で\n星野勘太郎と再び合流しました。"}, {"t": 266.8666666666667, "x": "現地のプロモーターは2人を\n「ヤマハ・ブラザーズ」と名付けます。"}, {"t": 270.26666666666665, "x": "名前の由来はヤマハのオートバイです。"}, {"t": 272.6666666666667, "x": "当時のアメリカで売れ始めていました。"}, {"t": 274.93333333333334, "x": "2人は悪役として連日メインイベントに\n立ちました。"}, {"t": 278.15, "x": "テネシー州のタッグ王座も手にしています。"}, {"t": 280.78333333333336, "x": "一方で、会場は危険でした。"}, {"t": 283.43333333333334, "x": "本人によると、星野は観客にナイフで\n頭を刺されたことがあります。"}, {"t": 288.1666666666667, "x": "それでも2人は走って逃げませんでした。"}, {"t": 290.68333333333334, "x": "控室までは歩いて戻ったといいます。"}, {"t": 293.1666666666667, "x": "稼ぎは多い週で2,000ドルに達していました。"}, {"t": 296.01666666666665, "x": "しかし同じ年の10月、\n日本プロレスから電話が入ります。"}, {"t": 300.35, "x": "2人を日本に呼び戻すという内容でした。"}, {"t": 303.0833333333333, "x": "こうして2人は日本に戻ります。"}, {"t": 305.15, "x": "帰国から2年近くがたったころです。"}, {"t": 307.45, "x": "山本はアントニオ猪木から\nボウリングに誘われました。"}, {"t": 310.8, "x": "その帰りの食事の席で、猪木は\n新しい会社を作る話を打ち明けます。"}, {"t": 316.1, "x": "1971年12月、猪木は\n日本プロレスを除名されました。"}, {"t": 321.3333333333333, "x": "山本も会社に背いたとされます。"}, {"t": 323.68333333333334, "x": "自宅待機を命じられ、\n山本は日本プロレスを辞めました。"}, {"t": 327.93333333333334, "x": "新しい団体には、\n練習する場所がありませんでした。"}, {"t": 331.75, "x": "選ばれたのは、\n東京都世田谷区野毛にあった猪木の自宅です。"}, {"t": 335.9166666666667, "x": "庭に道場を建て、母屋を合宿所にしました。"}, {"t": 339.3333333333333, "x": "工事は急ピッチで進みます。"}, {"t": 341.4166666666667, "x": "翌1972年の1月には道場が完成しました。"}, {"t": 345.55, "x": "これが、新日本プロレスの道場の始まりです。"}, {"t": 349.0, "x": "後に多くのレスラーがここから世に出ていきます。"}, {"t": 351.9, "x": "団体のマークを考えたのも山本です。"}, {"t": 354.6, "x": "日本プロレスのマークは王冠でした。"}, {"t": 356.96666666666664, "x": "「あんな王冠に負けるもんか」。"}, {"t": 358.8, "x": "そう考えた山本は、ひらめきます。"}, {"t": 361.65, "x": "「戦いだから百獣の王だ」。"}, {"t": 363.53333333333336, "x": "選んだのはライオンの図柄でした。"}, {"t": 365.6, "x": "デザイナーには怖すぎないライオンを頼みました。"}, {"t": 368.55, "x": "漫画のようでもない絵です。"}, {"t": 370.26666666666665, "x": "そこに「NEW JAPAN \nPRO WRESTLING」と"}, {"t": 373.81666666666666, "x": "「KING OF \nSPORTS」の文字を入れました。"}, {"t": 376.43333333333334, "x": "こうして旗揚げ戦のパンフレットに、\n白黒のライオンマークが載りました。"}, {"t": 381.05, "x": "1972年3月6日、東京・\n大田区体育館で旗揚げ戦が開かれます。"}, {"t": 387.1, "x": "山本はこの日、朝5時に起きて会場に入りました。"}, {"t": 390.9166666666667, "x": "新しいリングは組み立て方を知る者がいません。"}, {"t": 393.8833333333333, "x": "若手と一緒に2時間かけて\nリングを完成させています。"}, {"t": 397.3666666666667, "x": "しかし旗揚げの後は、苦しい日々が続きました。"}, {"t": 400.96666666666664, "x": "新日本には、1年1か月のあいだ\nテレビ中継がつきませんでした。"}, {"t": 405.8, "x": "4月、山本は長野県上田市で\n大会を開くことになります。"}, {"t": 410.48333333333335, "x": "知人を頼っての大会でした。"}, {"t": 412.51666666666665, "x": "山本にとって初めての切符売りです。"}, {"t": 415.0833333333333, "x": "まだ寒い上田の街を、\nアロハシャツ1枚で歩き回りました。"}, {"t": 419.21666666666664, "x": "飛び込んだ建設会社がリングサイド席を\n10枚買ってくれます。"}, {"t": 423.06666666666666, "x": "玄関を出たとき、顔から汗と涙が出てきた。"}, {"t": 426.43333333333334, "x": "本人はそう書き残しています。"}, {"t": 428.51666666666665, "x": "給料も出ませんでした。"}, {"t": 430.1333333333333, "x": "山本は節約のため、\n弁当を道場へ持っていきました。"}, {"t": 434.2, "x": "妻が作るのり弁当です。"}, {"t": 436.06666666666666, "x": "ある日、ご飯の真ん中に\n挟まっていたのりが消えます。"}, {"t": 439.9, "x": "理由を聞くと、妻は答えました。"}, {"t": 442.51666666666665, "x": "のりを買うお金がない。"}, {"t": 444.0, "x": "山本は、そのときばかりは涙が\n止まらなかったと振り返っています。"}, {"t": 448.6, "x": "1973年4月、新日本プロレスの\n中継が始まりました。"}, {"t": 453.8, "x": "放送局はNET、現在のテレビ朝日です。"}, {"t": 457.55, "x": "その1か月後、山本は新日本で\n初めての給料を受け取ります。"}, {"t": 462.3666666666667, "x": "日本プロレスを辞めてから\n1年半がたっていました。"}, {"t": 465.53333333333336, "x": "テレビがつく前から、道場には\n若い選手が入ってきていました。"}, {"t": 469.8, "x": "藤原喜明もその1人です。"}, {"t": 471.9, "x": "テレビのない時期に入ってきた最初の世代を、\n山本は特別にかわいがっていました。"}, {"t": 477.21666666666664, "x": "本人がそう語っています。"}, {"t": 479.06666666666666, "x": "1972年の暮れには、\n道場で餅つきをしました。"}, {"t": 483.3833333333333, "x": "山本は自分の兄からお金を借ります。"}, {"t": 486.05, "x": "そして若手に5万円ずつ渡しました。"}, {"t": 488.55, "x": "山本の指導は、厳しいことで知られていました。"}, {"t": 491.95, "x": "ブリッジをしながら\nバーベルを上げる練習をさせました。"}, {"t": 495.18333333333334, "x": "うさぎ跳びもやらせています。"}, {"t": 496.9166666666667, "x": "1977年には前田日明が入門してきます。"}, {"t": 500.85, "x": "当時の前田は体重が\n70キロほどしかありませんでした。"}, {"t": 504.5, "x": "練習の後、山本は竹刀を手に、\n前田にどんぶり飯を10杯食べさせています。"}, {"t": 510.5, "x": "1978年8月、前田のデビュー戦が\n新潟県長岡市で行われます。"}, {"t": 516.7833333333333, "x": "相手を務めたのは山本自身でした。"}, {"t": 519.35, "x": "佐山聡は、若手時代に山本の\n付き人を務めています。"}, {"t": 523.6666666666666, "x": "山本は佐山を坊主頭にさせました。"}, {"t": 526.35, "x": "そして「珍念」というあだ名で呼んでいました。"}, {"t": 528.9166666666666, "x": "練習の後、佐山は日本大学で\n体力測定を受けています。"}, {"t": 533.3833333333333, "x": "佐山は100メートルを12秒3で\n走ったと、山本は記録しています。"}, {"t": 538.45, "x": "テレビ中継が始まって、\n5、6年がたったころです。"}, {"t": 542.95, "x": "山本は猪木から思いがけない言葉をかけられます。"}, {"t": 546.1, "x": "「小鉄ちゃん、プロレスやめない？」。"}, {"t": 548.6, "x": "山本は反発しました。"}, {"t": 550.4, "x": "「あと5年はやらせてくれ」。"}, {"t": 552.0833333333334, "x": "猪木が続けたのは別の頼みでした。"}, {"t": 554.4166666666666, "x": "テレビの解説に入ってほしい。"}, {"t": 556.4166666666666, "x": "当時の解説者は、新聞や雑誌の記者でした。"}, {"t": 559.8666666666667, "x": "レスラー出身の者はいなかったのです。"}, {"t": 562.3, "x": "山本は、人前で話すことが\n得意ではありませんでした。"}, {"t": 566.2833333333333, "x": "そこで「日本話し方講座」の\n通信教育に申し込みます。"}, {"t": 570.0666666666667, "x": "録音したテープを送ると、言葉の強弱や\n抑揚を直してもらえる講座でした。"}, {"t": 575.4, "x": "本人によると、1年続けるうちに、\n話すことが好きになったといいます。"}, {"t": 580.6166666666667, "x": "1980年4月4日、川崎市体育館。"}, {"t": 585.0166666666667, "x": "山本小鉄は引退試合を行いました。"}, {"t": 587.7166666666667, "x": "パートナーは星野勘太郎です。"}, {"t": 589.75, "x": "38歳でした。"}, {"t": 591.3333333333334, "x": "山本はリングの上で背広姿になります。"}, {"t": 594.1666666666666, "x": "マイクを向けられたとき、\n山本は涙を流しました。"}, {"t": 597.8166666666667, "x": "このときの気持ちを、\n山本は後にこう語っています。"}, {"t": 601.5166666666667, "x": "「そりゃあ辞めたくなかったよ。"}, {"t": 603.2, "x": "でもさ、猪木さんに若い奴らの面倒を見てくれと\n言われたらしょうがないじゃないか」。"}, {"t": 608.4333333333333, "x": "引退後の山本は、解説席に座りました。"}, {"t": 611.9333333333333, "x": "番組はテレビ朝日の\n「ワールドプロレスリング」です。"}, {"t": 614.9166666666666, "x": "新日本プロレスの発表によると、\n実況の古舘伊知郎との"}, {"t": 619.2166666666667, "x": "名コンビとしても知られていました。"}, {"t": 621.1666666666666, "x": "本人は、解説は10年くらいやったと\n振り返っています。"}, {"t": 625.35, "x": "道場ではコーチを続けました。"}, {"t": 627.4166666666666, "x": "審判部長も務めています。"}, {"t": 629.5166666666667, "x": "新日本プロレス学校では校長も務めました。"}, {"t": 632.7833333333333, "x": "新日本の子会社を、\n社長として立て直したこともあります。"}, {"t": 636.85, "x": "その会社は8,000万円\n近い借金を抱えていました。"}, {"t": 640.5, "x": "1983年8月には、猪木らに\n退陣を求める側にも立っています。"}, {"t": 646.15, "x": "経営をめぐってのことでした。"}, {"t": 648.0333333333333, "x": "猪木は後に、こう語っています。"}, {"t": 650.6, "x": "「クーデターもあったし。"}, {"t": 652.0, "x": "生きる道が違ってしまえばしょうがない」。"}, {"t": 654.3666666666667, "x": "山本は、引退した後も練習をやめていません。"}, {"t": 658.05, "x": "新日本にいたころの記録を、\n東京スポーツにこう話しています。"}, {"t": 662.4333333333333, "x": "「スクワット7,000回やった。"}, {"t": 664.3333333333334, "x": "4時間10分かかった。"}, {"t": 666.0333333333333, "x": "30キロのダンベル1,000回を\n55分でやった」。"}, {"t": 669.2666666666667, "x": "糖尿病を発症したのは、\n引退からおよそ10年後のことです。"}, {"t": 673.7666666666667, "x": "山本は入院を断りました。"}, {"t": 675.9333333333333, "x": "よく食べ、道場で激しく体を動かします。"}, {"t": 679.4166666666666, "x": "東京スポーツによると、\nその後血糖値は改善しました。"}, {"t": 683.45, "x": "医者も驚いたといいます。"}, {"t": 685.1333333333333, "x": "本人の言葉が残っています。"}, {"t": 687.1833333333333, "x": "「この世界に入ったからなった。"}, {"t": 689.0666666666667, "x": "でも俺の人生に悔いはない」。"}, {"t": 691.0, "x": "2010年6月8日、\n東京スポーツで連載が始まりました。"}, {"t": 695.5166666666667, "x": "山本の半生をたどる連載です。"}, {"t": 697.8666666666667, "x": "掲載は7月9日まで全20回にわたりました。"}, {"t": 701.3833333333333, "x": "晩年の山本は、自分を「仏の小鉄」と\n呼ぶこともありました。"}, {"t": 705.6666666666666, "x": "夢も語っています。"}, {"t": 707.1, "x": "新日本の旗揚げ後に最初に\n入ってきた1期生の同窓会です。"}, {"t": 711.3333333333334, "x": "天山広吉は、亡くなる2週間前に\n山本と一緒に練習したばかりでした。"}, {"t": 716.75, "x": "本人がそう語っています。"}, {"t": 718.6166666666667, "x": "山本は1か月前に新しい\nキャデラックを買ったところでした。"}, {"t": 722.55, "x": "8月28日の死去は、\n翌29日に伝えられました。"}, {"t": 726.8833333333333, "x": "伝えたのは新日本プロレスの公式サイトです。"}, {"t": 729.9833333333333, "x": "同じ日、猪木は成田空港で取材に応じました。"}, {"t": 733.55, "x": "「レスラーとしては体力的に小柄だったから、\nその分、努力して頑張った。"}, {"t": 739.0333333333333, "x": "みんな旅立っていくのはちょっと寂しい」。"}, {"t": 741.3833333333333, "x": "星野勘太郎は、ヤマハ・ブラザーズの相棒です。"}, {"t": 744.85, "x": "知らせを聞いて、号泣したと伝えられています。"}, {"t": 748.3666666666667, "x": "9月2日、都内の斎場で通夜が営まれました。"}, {"t": 752.0166666666667, "x": "参列したのはおよそ500人です。"}, {"t": 754.45, "x": "前田日明は、取材にこう答えています。"}, {"t": 757.5166666666667, "x": "「レスラー全員のオヤジになって、\n厳しく、ときには優しく。"}, {"t": 761.9333333333333, "x": "練習中は鬼のように怖かったですね」。"}, {"t": 764.6, "x": "蝶野正洋も山本の体を振り返りました。"}, {"t": 767.6333333333333, "x": "「糖尿の病気をしながら、\n最後は100キロ以上あったというから、"}, {"t": 771.9, "x": "最後までレスラーだったんですね」。"}, {"t": 774.2, "x": "翌9月3日の告別式には、\nおよそ300人が参列しました。"}, {"t": 779.0, "x": "弔辞を読んだのは前田日明です。"}, {"t": 781.1833333333333, "x": "山本の妻と娘から直接頼まれたものでした。"}, {"t": 784.4, "x": "「常に真剣で、常に体を張り、父のような優しい心で\n私たちを育ててくれたことに感謝します。"}, {"t": 791.7166666666667, "x": "今日ここにあるのはすべて山本さんの\nご指導のおかげです」。"}, {"t": 795.1333333333333, "x": "正午、坂口征二、前田日明、\n真壁刀義らの手で出棺されました。"}, {"t": 801.0833333333334, "x": "その夜、後楽園ホールで\n新日本プロレスの大会が開かれます。"}, {"t": 805.7666666666667, "x": "大会は山本小鉄の追悼大会として行われました。"}, {"t": 809.4333333333333, "x": "真壁刀義は、若手のころに山本から\n言われた言葉を明かしています。"}, {"t": 814.0333333333333, "x": "「誰よりも強くなれ。"}, {"t": 815.4166666666666, "x": "誰よりも強くなったら、\n誰もお前に文句言わない」。"}, {"t": 819.15, "x": "高田延彦は、自身のブログに書いています。"}, {"t": 822.3833333333333, "x": "30年前、1対1で\n入門テストをしてくれたのが山本だった。"}, {"t": 827.4166666666666, "x": "それから3か月足らずの2010年11月25日。"}, {"t": 831.25, "x": "星野勘太郎も67歳で亡くなっています。"}, {"t": 834.3, "x": "最後に、記録に残る日付を順番に並べ直します。"}, {"t": 838.25, "x": "1963年、日本プロレスに入門。"}, {"t": 842.0833333333334, "x": "7月にデビュー。"}, {"t": 843.35, "x": "同じ年の12月15日、師の力道山が死去。"}, {"t": 847.2166666666667, "x": "1967年1月4日、星野勘太郎とアメリカへ。"}, {"t": 852.0666666666667, "x": "1972年1月、野毛の道場が完成。"}, {"t": 856.4166666666666, "x": "3月6日、新日本プロレスが旗揚げ。"}, {"t": 859.7166666666667, "x": "1973年4月、テレビ中継が始まる。"}, {"t": 863.9666666666667, "x": "山本は1年半ぶりの給料を受け取る。"}, {"t": 866.75, "x": "1980年4月4日、38歳で引退。"}, {"t": 871.1166666666667, "x": "解説席と道場に移る。"}, {"t": 872.9666666666667, "x": "1990年ごろ、糖尿病を発症。"}, {"t": 876.55, "x": "入院を断って練習を続ける。"}, {"t": 878.8833333333333, "x": "2010年7月9日、\n東京スポーツの連載が終わる。"}, {"t": 883.0833333333334, "x": "そして8月28日、68歳で死去。"}, {"t": 886.9833333333333, "x": "引退してからの30年、山本小鉄は\n試合のリングには上がっていません。"}, {"t": 892.2833333333333, "x": "それでも練習は、\n亡くなる2週間前まで続いていました。"}, {"t": 896.4666666666667, "x": "ライオンマークに「KING OF \nSPORTS」の文字を入れた理由。"}, {"t": 900.1666666666666, "x": "山本は連載の最後で、こう書いています。"}, {"t": 903.35, "x": "「強くなれば、自然にお客さんはついてくる」。"}, {"t": 906.4833333333333, "x": "同じ最終回には、こんな一文もあります。"}, {"t": 909.7666666666667, "x": "「プロレスラーは死ぬまで現役。"}, {"t": 911.6833333333333, "x": "そして、死ぬまで練習はできる」。"}, {"t": 914.25, "x": "ご視聴、誠にありがとうございました。"}, {"t": 917.2333333333333, "x": "新日本のライオンマークを見かけたとき、\nこの男のことを少しでも"}, {"t": 921.6333333333333, "x": "思い出していただければ幸いです。"}, {"t": 923.6333333333333, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
