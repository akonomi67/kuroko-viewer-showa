<script>
const D={"name": "長州力の下剋上", "file": "211_編集用", "dur": 848.25, "segs": [], "subs": [{"t": 0.0, "x": "1982年10月8日、東京・後楽園ホール。"}, {"t": 4.516666666666667, "x": "この日組まれていたのは6人タッグマッチでした。"}, {"t": 7.3, "x": "アントニオ猪木、藤波辰巳、長州力の3人が、\nアブドーラ・ザ・ブッチャー、"}, {"t": 13.233333333333333, "x": "バッドニュース・アレン、スペシャル・\nデリバリー・ジョーンズと向かい合う一戦です。"}, {"t": 18.45, "x": "日本側の3人が花道を歩いてリングに向かいます。"}, {"t": 21.983333333333334, "x": "先頭を歩いていたのは長州力でした。"}, {"t": 24.633333333333333, "x": "その後ろに藤波辰巳がいました。"}, {"t": 26.95, "x": "プロレスの入場では、\n格上の選手が後から入場します。"}, {"t": 31.25, "x": "先を歩くということは、その日のカードの\n中で下に置かれているという意味になります。"}, {"t": 36.583333333333336, "x": "長州はこのとき30歳。"}, {"t": 38.55, "x": "新日本プロレスでデビューしてから\n8年2か月が経っていました。"}, {"t": 42.45, "x": "その8年2か月、長州はずっと\n誰かの前を歩いてきました。"}, {"t": 46.95, "x": "そしてこの日、長州は立ち止まります。"}, {"t": 49.86666666666667, "x": "イメージ映像"}, {"t": 49.86666666666667, "x": "振り返って、後ろにいた藤波にこう言いました。"}, {"t": 53.56666666666667, "x": "「なんでオレがお前の前を\n歩かなくちゃならないんだ。"}, {"t": 56.55, "x": "オレとお前とどこが違う」"}, {"t": 58.18333333333333, "x": "なぜ長州力は、この日この場所で、8年間\n受け入れてきた順番に声を上げたのでしょうか。"}, {"t": 64.66666666666667, "x": "今回は、1982年10月8日の\n後楽園ホールから、1983年4月"}, {"t": 71.88333333333334, "x": "3日の蔵前国技館までの半年間を、\n具体的な日付と記録をもとに辿っていきます。"}, {"t": 77.61666666666666, "x": "イメージ映像"}, {"t": 77.61666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 80.11666666666666, "x": "それでは本編に入る前に、チャンネル\n登録と高評価をよろしくお願いいたします。"}, {"t": 85.7, "x": "長州力の本名は吉田光雄といいます。"}, {"t": 88.63333333333334, "x": "1951年12月3日、山口県徳山市、\n現在の周南市に生まれました。"}, {"t": 95.68333333333334, "x": "長州はプロレスに入る前、\nアマチュアレスリングの選手でした。"}, {"t": 100.05, "x": "イメージ映像"}, {"t": 100.05, "x": "その経歴は、当時の日本のプロ\nレスラーの中でも群を抜いています。"}, {"t": 104.66666666666667, "x": "1969年、長崎国体のフリースタイル\n75キロ以上級で優勝しています。"}, {"t": 111.43333333333334, "x": "1971年には全日本学生選手権のグレコ\nローマン90キロ級で優勝しました。"}, {"t": 117.88333333333334, "x": "そして1972年、ミュンヘン\nオリンピックに出場します。"}, {"t": 122.7, "x": "日本代表ではありません。"}, {"t": 124.48333333333333, "x": "韓国代表として、フリースタイル\n90キロ級に出場しました。"}, {"t": 129.05, "x": "成績は1勝2敗でした。"}, {"t": 131.03333333333333, "x": "翌1973年には全日本選手権のフリー\nスタイルとグレコローマンの100"}, {"t": 136.33333333333334, "x": "キロ級で、二階級とも優勝しています。"}, {"t": 139.3, "x": "国体、学生選手権、オリンピック、全日本選手権。"}, {"t": 144.56666666666666, "x": "アマチュアレスリングで積める実績を、\n長州は入門前にひととおり積んでいました。"}, {"t": 149.83333333333334, "x": "1974年、長州は新日本\nプロレスに入団しました。"}, {"t": 154.76666666666668, "x": "デビュー戦は1974年8月8日、\n日大講堂でのエル・グレコ戦です。"}, {"t": 160.6, "x": "オリンピック代表という肩書きを\n持ってプロレスに入った選手は、"}, {"t": 164.51666666666668, "x": "イメージ映像"}, {"t": 164.51666666666668, "x": "当時それだけで注目される存在でした。"}, {"t": 167.43333333333334, "x": "実際、長州は入団直後から最前座ではなく、\nある程度の位置で試合を組まれています。"}, {"t": 174.0, "x": "しかし、長州の名前が興行の\n看板になることはありませんでした。"}, {"t": 178.75, "x": "カードには入る。"}, {"t": 179.93333333333334, "x": "イメージ映像"}, {"t": 179.93333333333334, "x": "しかしメインではない。"}, {"t": 181.3, "x": "その位置が、8年間続きます。"}, {"t": 183.95, "x": "一方、長州がデビューした1974年、\nすでに新日本プロレスにいたのが藤波辰巳です。"}, {"t": 191.33333333333334, "x": "藤波は1953年12月28日、\n大分県東国東郡武蔵町、現在の国東市の生まれです。"}, {"t": 200.28333333333333, "x": "長州より2歳年下でした。"}, {"t": 202.36666666666667, "x": "その藤波の名前が日本中に\n知られることになったのは、"}, {"t": 205.75, "x": "1978年1月23日のことです。"}, {"t": 209.7, "x": "場所はニューヨークの\nマディソン・スクエア・ガーデン。"}, {"t": 212.43333333333334, "x": "藤波はカルロス・ホセ・エストラーダを相手に、\nWWWFジュニアヘビー級王座に挑戦しました。"}, {"t": 219.93333333333334, "x": "この試合で藤波が使ったのが、\n初公開となるドラゴン・スープレックスでした。"}, {"t": 225.0, "x": "相手の背後から両腕を固め、\nそのまま後方に反り投げる技です。"}, {"t": 229.81666666666666, "x": "藤波はこの技でエストラーダを破り、\n王座を獲得しました。"}, {"t": 234.2, "x": "イメージ映像"}, {"t": 234.2, "x": "日本のプロレスラーがニューヨークの\nマディソン・スクエア・ガーデンで王座を獲る。"}, {"t": 238.4, "x": "これは当時の日本のプロレス\nファンにとって大きな出来事でした。"}, {"t": 242.16666666666666, "x": "藤波は1978年3月3日、\n凱旋帰国第一戦を戦います。"}, {"t": 248.25, "x": "イメージ映像"}, {"t": 248.25, "x": "相手はマスクド・カナディアン、\n後のロディ・パイパーです。"}, {"t": 251.81666666666666, "x": "この試合でも藤波はドラゴン・\nスープレックスで勝利しました。"}, {"t": 255.53333333333333, "x": "このとき藤波は24歳です。"}, {"t": 257.8833333333333, "x": "「ドラゴン」という愛称が定着し、藤波は新日本\nプロレスのジュニアヘビー級の看板になりました。"}, {"t": 264.3833333333333, "x": "藤波は1981年12月、地元である大分の\n大会でWWFジュニアヘビー級王座を返上します。"}, {"t": 272.8, "x": "イメージ映像"}, {"t": 272.8, "x": "ジュニアヘビー級を離れ、\nヘビー級に転向するためでした。"}, {"t": 276.96666666666664, "x": "そして1982年8月30日、\n藤波は再びマディソン・スクエア・"}, {"t": 282.55, "x": "ガーデンのリングに立ちます。"}, {"t": 284.06666666666666, "x": "ジノ・ブリットを体固めで破り、WWF\nインターナショナル・ヘビー級王座を獲得しました。"}, {"t": 291.06666666666666, "x": "ジュニアヘビー級でニューヨークの\n王座を獲り、ヘビー級に上がってまた"}, {"t": 295.3666666666667, "x": "ニューヨークの王座を獲る。"}, {"t": 296.68333333333334, "x": "1982年の秋の時点で、\n藤波辰巳は新日本プロレスの中で"}, {"t": 302.06666666666666, "x": "アントニオ猪木に次ぐ位置にいました。"}, {"t": 304.1, "x": "イメージ映像"}, {"t": 304.1, "x": "その頃、長州力は何をしていたのでしょうか。"}, {"t": 307.48333333333335, "x": "長州はメキシコに遠征していました。"}, {"t": 309.95, "x": "そしてメキシコで、UWA世界\nヘビー級王座を獲得しています。"}, {"t": 314.8333333333333, "x": "長州もまた、海外でベルトを\n巻いて帰ってきた選手でした。"}, {"t": 319.0, "x": "イメージ映像"}, {"t": 319.0, "x": "しかし、日本での扱いは変わりませんでした。"}, {"t": 322.4, "x": "ここで、当時の新日本プロレスがどう\nいう状況にあったかにも触れておく必要があります。"}, {"t": 328.28333333333336, "x": "1981年8月、国際プロレスが\n興行機能を失って倒産しました。"}, {"t": 334.43333333333334, "x": "日本の第3の団体が消えたことになります。"}, {"t": 337.26666666666665, "x": "その年の1981年10月8日、\n蔵前国技館で新日本プロレス対国際"}, {"t": 343.6, "x": "プロレスの全面対抗戦が組まれました。"}, {"t": 346.06666666666666, "x": "しかし国際はすでに倒産しており、\nポスターに名前が載っていた選手の多くが"}, {"t": 351.18333333333334, "x": "別の団体に移るか海外へ出ていきました。"}, {"t": 353.8333333333333, "x": "この日、新日本のリングに\n上がった元国際の選手は、ラッシャー木村、"}, {"t": 358.96666666666664, "x": "イメージ映像"}, {"t": 358.96666666666664, "x": "アニマル浜口、寺西勇の3人だけでした。"}, {"t": 363.15, "x": "この3人は「はぐれ国際軍団」と呼ばれ、アントニオ\n猪木との抗争を約2年にわたって続けます。"}, {"t": 369.65, "x": "団体の外から来た選手が、団体の中の秩序に挑む。"}, {"t": 373.8, "x": "イメージ映像"}, {"t": 373.8, "x": "1982年の新日本プロレスには、\nすでにそういう構図が存在していました。"}, {"t": 379.71666666666664, "x": "そして1982年10月8日、後楽園ホール。"}, {"t": 384.1666666666667, "x": "イメージ映像"}, {"t": 384.1666666666667, "x": "長州は藤波と組んで6人タッグ\nマッチに出場します。"}, {"t": 387.95, "x": "パートナーはアントニオ猪木と藤波辰巳。"}, {"t": 390.6166666666667, "x": "相手はアブドーラ・ザ・ブッチャー、\nバッドニュース・アレン、スペシャル・"}, {"t": 395.3333333333333, "x": "デリバリー・ジョーンズの3人でした。"}, {"t": 397.28333333333336, "x": "入場の順番は、長州が藤波の\n前を歩く形になっていました。"}, {"t": 402.03333333333336, "x": "長州は言いました。"}, {"t": 403.4166666666667, "x": "「なんでオレがお前の前を\n歩かなくちゃならないんだ。"}, {"t": 406.4, "x": "イメージ映像"}, {"t": 406.4, "x": "オレとお前とどこが違う」"}, {"t": 408.05, "x": "この一件は、後に「噛ませ犬事件」と\n呼ばれるようになります。"}, {"t": 412.0833333333333, "x": "イメージ映像"}, {"t": 412.0833333333333, "x": "言い争いは試合後の控室でも続きました。"}, {"t": 415.1333333333333, "x": "そしてアントニオ猪木は、\nこの長州の行動を止めませんでした。"}, {"t": 419.45, "x": "長州と藤波のシングルマッチが正式に組まれます。"}, {"t": 422.8666666666667, "x": "1982年10月22日、広島県立体育館。"}, {"t": 427.9, "x": "これが2人のシングル初対決でした。"}, {"t": 430.28333333333336, "x": "この日から始まった2人の一連の対戦は、後に\n「名勝負数え歌」と呼ばれることになります。"}, {"t": 436.21666666666664, "x": "ただし、長州はこの試合で勝てませんでした。"}, {"t": 439.65, "x": "1982年11月4日、蔵前国技館。"}, {"t": 444.1166666666667, "x": "今度はWWFインターナショナル・\nヘビー級王座をかけたタイトル"}, {"t": 448.3, "x": "マッチとして組まれます。"}, {"t": 449.5833333333333, "x": "しかし結果は、藤波がオーバー・ザ・\nフェンスによる反則で防衛というものでした。"}, {"t": 454.8, "x": "声を上げてから1か月。"}, {"t": 456.48333333333335, "x": "長州は2度戦って、\nまだ1度も勝っていませんでした。"}, {"t": 460.3666666666667, "x": "長州は1982年11月、\nWWFへの短期遠征に出ます。"}, {"t": 467.28333333333336, "x": "マサ斎藤のパートナーとして、\nアメリカのリングに立ちました。"}, {"t": 471.26666666666665, "x": "日本に戻った長州は、1人では動きませんでした。"}, {"t": 474.98333333333335, "x": "1983年、長州はマサ斎藤、\nキラー・カーンとともに革命軍を結成します。"}, {"t": 482.0, "x": "ここに小林邦昭が加わりました。"}, {"t": 484.4, "x": "さらに、はぐれ国際軍団にいた\nアニマル浜口と寺西勇が合流します。"}, {"t": 489.71666666666664, "x": "国際プロレスが消えた後、団体の外から\n新日本に上がり続けていた選手たちでした。"}, {"t": 495.6, "x": "そして海外武者修行から\n帰国した谷津嘉章も加わります。"}, {"t": 499.56666666666666, "x": "この集団が「維新軍」と\n呼ばれるようになりました。"}, {"t": 502.51666666666665, "x": "新日本プロレスの中に、会社の決めた序列に\n従わない選手の集団ができたことになります。"}, {"t": 508.73333333333335, "x": "1982年10月8日に長州1人が\n言い出したことが、1983年には"}, {"t": 515.25, "x": "団体の中の対立構造になっていました。"}, {"t": 517.8, "x": "そして1983年4月3日、蔵前国技館。"}, {"t": 522.4666666666667, "x": "WWFインターナショナル・ヘビー級選手権試合、\n王者・藤波辰巳に挑戦者・長州力が挑みます。"}, {"t": 529.85, "x": "イメージ映像"}, {"t": 529.85, "x": "1982年10月8日の後楽園ホールから、\n半年が経っていました。"}, {"t": 535.45, "x": "イメージ映像"}, {"t": 535.45, "x": "試合中、藤波はジャーマン・スープレックス・\nホ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
