<script>
const D={"name": "ファンクスからインタータッグ", "file": "294_編集用", "dur": 918.65, "segs": [], "subs": [{"t": 0.0, "x": "1975年2月5日、アメリカの\nテキサス州サンアントニオです。"}, {"t": 5.4, "x": "市の公会堂のリングで、ジャイアント馬場は\nタッグの王座に挑みました。"}, {"t": 10.25, "x": "相手はアメリカの兄弟のチームです。"}, {"t": 12.616666666666667, "x": "試合は3本勝負でした。"}, {"t": 14.616666666666667, "x": "1本ずつを取り合って、\n3本目は11分13秒で決まりました。"}, {"t": 19.416666666666668, "x": "押さえ込んだのは、馬場のパートナーでした。"}, {"t": 22.3, "x": "押さえ込まれたのは兄弟の兄のほうです。"}, {"t": 24.866666666666667, "x": "馬場の公式年表は、この夜を1行で書いています。"}, {"t": 28.783333333333335, "x": "ただ、その1行には会場の名前も、\n国の名前もありません。"}, {"t": 33.6, "x": "この王座に、馬場の組はそれまで\n何度挑んでいたのでしょうか？"}, {"t": 37.93333333333333, "x": "日本で取れなかった王座を、なぜ\nテキサスで取ることになったのでしょうか？"}, {"t": 42.65, "x": "今回は、1975年2月5日の\nインターナショナル・タッグ王座を追います。"}, {"t": 48.43333333333333, "x": "1973年の秋から、\n1976年の暮れまでが中心です。"}, {"t": 54.3, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 58.86666666666667, "x": "馬場の公式年表とも、\n1つずつ照らし合わせます。"}, {"t": 62.6, "x": "最後までご覧いただければ幸いです。"}, {"t": 65.1, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 70.68333333333334, "x": "まず馬場の公式年表を開きます。"}, {"t": 73.13333333333334, "x": "1975年のところには、パートナーとの\nコンビで兄弟のチームを破った、とあります。"}, {"t": 79.86666666666666, "x": "そしてインター・タッグ王座を\n奪取した、と続きます。"}, {"t": 83.41666666666667, "x": "日付は2月5日です。"}, {"t": 85.16666666666667, "x": "1975年のところにあるのは、\nこの1つだけでした。"}, {"t": 89.45, "x": "会場の名前は書かれていません。"}, {"t": 91.61666666666666, "x": "3本勝負だったことも、\n試合の時間もありません。"}, {"t": 95.25, "x": "そこで今回は、試合の記録で\nその前とあとをたどります。"}, {"t": 99.3, "x": "この動画では、馬場の組の相方を\n「パートナー」と呼びます。"}, {"t": 103.71666666666667, "x": "相手の2人は、「兄弟のチーム」と\n呼ぶことにします。"}, {"t": 107.28333333333333, "x": "この王座は、\nインターナショナル・タッグ王座といいます。"}, {"t": 110.98333333333333, "x": "2人1組で争うタッグのベルトです。"}, {"t": 113.6, "x": "短くしてインタータッグとも呼ばれます。"}, {"t": 116.05, "x": "試合の記録では、1973年の\n秋に兄弟のチームが王者でした。"}, {"t": 121.55, "x": "ベルトは兄弟のチームの\n手にあったことになります。"}, {"t": 124.48333333333333, "x": "最初の挑戦は、\n1973年10月9日の蔵前国技館です。"}, {"t": 130.23333333333332, "x": "馬場はパートナーと組んで挑みました。"}, {"t": 132.5, "x": "試合は3本勝負です。"}, {"t": 134.4, "x": "1本目は23分57秒でパートナーが取りました。"}, {"t": 138.23333333333332, "x": "弟をジャーマン・スープレックスで投げています。"}, {"t": 141.0, "x": "2本目は弟が取り返しました。"}, {"t": 143.3, "x": "パートナーを17分24秒で丸め込んでいます。"}, {"t": 146.73333333333332, "x": "3本目は決まらず時間切れでした。"}, {"t": 149.1, "x": "1対1の引き分けです。"}, {"t": 150.85, "x": "引き分けなので、ベルトは\n兄弟のチームに残りました。"}, {"t": 154.46666666666667, "x": "翌日の10月10日は兵庫県の姫路です。"}, {"t": 157.53333333333333, "x": "この夜は6人タッグでした。"}, {"t": 159.51666666666668, "x": "馬場は3分39秒で弟を押さえ込んでいます。"}, {"t": 163.18333333333334, "x": "ただこの試合に王座はかかっていません。"}, {"t": 165.66666666666666, "x": "馬場の記録では、1973年の\n王座の試合は蔵前の1度だけでした。"}, {"t": 171.28333333333333, "x": "1974年の正月、弟が\n全日本プロレスのシリーズに来ます。"}, {"t": 176.63333333333333, "x": "1月4日の後楽園ホールから、\nタッグの試合が続きました。"}, {"t": 181.25, "x": "1月5日の川崎は、馬場とパートナーの組です。"}, {"t": 185.03333333333333, "x": "相手は弟と別の外国人のレスラーでした。"}, {"t": 188.06666666666666, "x": "3本目は3分36秒、\n馬場が弟を押さえ込みました。"}, {"t": 192.78333333333333, "x": "1月10日の奈良県の橿原でも、\n馬場が弟を押さえ込んでいます。"}, {"t": 197.66666666666666, "x": "時間は4分1秒です。"}, {"t": 199.66666666666666, "x": "1月18日の沖縄のコザでは、\n2分48秒で押さえ込みました。"}, {"t": 204.91666666666666, "x": "どれもタッグの試合で、\n王座はかかっていません。"}, {"t": 208.43333333333334, "x": "1月の終わりには、兄がシリーズに入りました。"}, {"t": 211.93333333333334, "x": "1月26日の和歌山は、3本勝負のタッグです。"}, {"t": 216.15, "x": "パートナーが8分38秒で、\n兄に丸め込まれました。"}, {"t": 220.4, "x": "2本目はパートナーが取り返しています。"}, {"t": 222.95, "x": "3本目は3分5秒で、\n馬場が相手に押さえ込まれました。"}, {"t": 227.23333333333332, "x": "1対2の負けです。"}, {"t": 228.63333333333333, "x": "1月30日は東京の日大講堂でした。"}, {"t": 231.88333333333333, "x": "馬場は兄と1対1で向き合います。"}, {"t": 234.3, "x": "かかっていたのは、馬場が持つPWFの王座です。"}, {"t": 238.15, "x": "1本目は兄が取りました。"}, {"t": 239.93333333333334, "x": "27分1秒の押さえ込みです。"}, {"t": 242.35, "x": "2本目は馬場が、2分32秒で取り返しました。"}, {"t": 246.13333333333333, "x": "3本目は3分50秒で時間切れになります。"}, {"t": 249.38333333333333, "x": "そのあと5分の延長戦が行われました。"}, {"t": 252.26666666666668, "x": "延長でも決まらず引き分けです。"}, {"t": 254.31666666666666, "x": "馬場はPWFの王座を守りました。"}, {"t": 257.0833333333333, "x": "1974年の6月、馬場は function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;

                                          :'（この回に字幕はありません）')

function mark(pane,i){
  const el=document.getElementById(pane);

  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
