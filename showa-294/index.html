<script>
const D={"name": "ファンクスからインタータッグ", "file": "294_編集用", "dur": 914.45, "segs": [], "subs": [{"t": 0.0, "x": "1975年2月5日、アメリカの\nテキサス州サンアントニオです。"}, {"t": 5.4, "x": "市の公会堂のリングで、ジャイアント馬場は\nタッグの王座に挑みました。"}, {"t": 10.2, "x": "相手はアメリカの兄弟のチームです。"}, {"t": 12.566666666666666, "x": "試合は3本勝負でした。"}, {"t": 14.566666666666666, "x": "1本ずつを取り合って、\n3本目は11分13秒で決まりました。"}, {"t": 19.366666666666667, "x": "押さえ込んだのは、馬場のパートナーでした。"}, {"t": 22.233333333333334, "x": "押さえ込まれたのは兄弟の兄のほうです。"}, {"t": 24.816666666666666, "x": "馬場の公式年表は、この夜を1行で書いています。"}, {"t": 28.733333333333334, "x": "ただ、その1行には会場の名前も、\n国の名前もありません。"}, {"t": 33.55, "x": "この王座に、馬場の組はそれまで\n何度挑んでいたのでしょうか？"}, {"t": 37.88333333333333, "x": "日本で取れなかった王座を、なぜ\nテキサスで取ることになったのでしょうか？"}, {"t": 42.6, "x": "今回は、1975年2月5日の\nインターナショナル・タッグ王座を追います。"}, {"t": 48.333333333333336, "x": "1973年の秋から、\n1976年の暮れまでが中心です。"}, {"t": 54.2, "x": "日付と会場と試合の時間は、\n試合の記録で確かめていきます。"}, {"t": 58.766666666666666, "x": "馬場の公式年表とも、\n1つずつ照らし合わせます。"}, {"t": 62.5, "x": "最後までご覧いただければ幸いです。"}, {"t": 65.0, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 70.58333333333333, "x": "まず馬場の公式年表を開きます。"}, {"t": 73.03333333333333, "x": "1975年のところには、パートナーとの\nコンビで兄弟のチームを破った、とあります。"}, {"t": 79.76666666666667, "x": "そしてインター・タッグ王座を\n奪取した、と続きます。"}, {"t": 83.28333333333333, "x": "日付は2月5日です。"}, {"t": 85.03333333333333, "x": "1975年のところにあるのは、\nこの1つだけでした。"}, {"t": 89.31666666666666, "x": "会場の名前は書かれていません。"}, {"t": 91.48333333333333, "x": "3本勝負だったことも、\n試合の時間もありません。"}, {"t": 95.11666666666666, "x": "そこで今回は、試合の記録で\nその前とあとをたどります。"}, {"t": 99.15, "x": "この動画では、馬場の組の相方を\n「パートナー」と呼びます。"}, {"t": 103.58333333333333, "x": "相手の2人は、「兄弟のチーム」と\n呼ぶことにします。"}, {"t": 107.15, "x": "この王座は、\nインターナショナル・タッグ王座といいます。"}, {"t": 110.8, "x": "2人1組で争うタッグのベルトです。"}, {"t": 113.35, "x": "短くしてインタータッグとも呼ばれます。"}, {"t": 115.75, "x": "試合の記録では、1973年の\n秋に兄弟のチームが王者でした。"}, {"t": 121.26666666666667, "x": "ベルトは兄弟のチームの\n手にあったことになります。"}, {"t": 124.2, "x": "最初の挑戦は、\n1973年10月9日の蔵前国技館です。"}, {"t": 129.93333333333334, "x": "馬場はパートナーと組んで挑みました。"}, {"t": 132.2, "x": "試合は3本勝負です。"}, {"t": 134.1, "x": "1本目は23分57秒でパートナーが取りました。"}, {"t": 137.93333333333334, "x": "弟をジャーマン・スープレックスで投げています。"}, {"t": 140.7, "x": "2本目は弟が取り返しました。"}, {"t": 143.0, "x": "パートナーを17分24秒で丸め込んでいます。"}, {"t": 146.43333333333334, "x": "3本目は決まらず時間切れでした。"}, {"t": 148.8, "x": "1対1の引き分けです。"}, {"t": 150.55, "x": "引き分けなので、ベルトは\n兄弟のチームに残りました。"}, {"t": 154.18333333333334, "x": "翌日の10月10日は兵庫県の姫路です。"}, {"t": 157.23333333333332, "x": "この夜は6人タッグでした。"}, {"t": 159.16666666666666, "x": "馬場は3分39秒で弟を押さえ込んでいます。"}, {"t": 162.83333333333334, "x": "ただこの試合に王座はかかっていません。"}, {"t": 165.31666666666666, "x": "馬場の記録では、1973年の\n王座の試合は蔵前の1度だけでした。"}, {"t": 170.93333333333334, "x": "1974年の正月、弟が\n全日本プロレスのシリーズに来ます。"}, {"t": 176.28333333333333, "x": "1月4日の後楽園ホールから、\nタッグの試合が続きました。"}, {"t": 180.85, "x": "1月5日の川崎は、馬場とパートナーの組です。"}, {"t": 184.63333333333333, "x": "相手は弟と別の外国人のレスラーでした。"}, {"t": 187.66666666666666, "x": "3本目は3分36秒、\n馬場が弟を押さえ込みました。"}, {"t": 192.36666666666667, "x": "1月10日の奈良県の橿原でも、\n馬場が弟を押さえ込んでいます。"}, {"t": 197.26666666666668, "x": "時間は4分1秒です。"}, {"t": 199.26666666666668, "x": "1月18日の沖縄のコザでは、\n2分48秒で押さえ込みました。"}, {"t": 204.51666666666668, "x": "どれもタッグの試合で、\n王座はかかっていません。"}, {"t": 207.95, "x": "1月の終わりには、兄がシリーズに入りました。"}, {"t": 211.46666666666667, "x": "1月26日の和歌山は、3本勝負のタッグです。"}, {"t": 215.63333333333333, "x": "パートナーが8分38秒で、\n兄に丸め込まれました。"}, {"t": 219.86666666666667, "x": "2本目はパートナーが取り返しています。"}, {"t": 222.41666666666666, "x": "3本目は3分5秒で、\n馬場が相手に押さえ込まれました。"}, {"t": 226.71666666666667, "x": "1対2の負けです。"}, {"t": 228.1, "x": "1月30日は東京の日大講堂でした。"}, {"t": 231.36666666666667, "x": "馬場は兄と1対1で向き合います。"}, {"t": 233.78333333333333, "x": "かかっていたのは、馬場が持つPWFの王座です。"}, {"t": 237.63333333333333, "x": "1本目は兄が取りました。"}, {"t": 239.41666666666666, "x": "27分1秒の押さえ込みです。"}, {"t": 241.83333333333334, "x": "2本目は馬場が、2分32秒で取り返しました。"}, {"t": 245.61666666666667, "x": "3本目は3分50秒で時間切れになります。"}, {"t": 248.86666666666667, "x": "そのあと5分の延長戦が行われました。"}, {"t": 251.75, "x": "延長でも決まらず引き分けです。"}, {"t": 253.8, "x": "馬場はPWFの王座を守りました。"}, {"t"   go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
