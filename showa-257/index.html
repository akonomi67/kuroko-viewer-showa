<style>

<script>
const D={"name": "蔵前IWGP暴動", "file": "257_編集用", "dur": 882.4, "segs": [], "subs": [{"t": 0.0, "x": "リングの上に、ビールの\n空き缶が投げ込まれていました。"}, {"t": 3.6, "x": "弁当の空き箱も、座布団もありました。"}, {"t": 6.666666666666667, "x": "客席からは「金返せ」という声が飛んでいました。"}, {"t": 9.7, "x": "試合が終わって40分がたちました。"}, {"t": 12.25, "x": "それでも多くの人が席を立とうとしません。"}, {"t": 14.933333333333334, "x": "午後11時半を回っても、\nおよそ200人が会場に残っていました。"}, {"t": 19.716666666666665, "x": "1984年6月14日、\n東京都台東区の蔵前国技館です。"}, {"t": 25.55, "x": "その日のメインは優勝戦です。"}, {"t": 27.75, "x": "新日本プロレスの第2回IWGPでした。"}, {"t": 31.783333333333335, "x": "カードはアントニオ猪木対ハルク・ホーガンでした。"}, {"t": 34.6, "x": "勝者は猪木でした。"}, {"t": 36.05, "x": "それでも、蔵前国技館は\nこの夜に荒れに荒れました。"}, {"t": 39.916666666666664, "x": "勝者は決まっていました。"}, {"t": 41.53333333333333, "x": "それなのに、なぜ客は帰らなかったのでしょうか。"}, {"t": 45.15, "x": "今回は1984年6月14日の\n蔵前国技館で起きたことを辿ります。"}, {"t": 50.766666666666666, "x": "手がかりは、当日の試合時間と新聞の記録です。"}, {"t": 54.583333333333336, "x": "最後までご覧いただければ幸いです。"}, {"t": 57.083333333333336, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 62.65, "x": "IWGPという構想があります。"}, {"t": 65.95, "x": "正式に発表されたのは\n1980年12月のことです。"}, {"t": 70.3, "x": "世界各地には、チャンピオンベルトが\n乱立していました。"}, {"t": 74.03333333333333, "x": "それを1本にまとめ、\n本当に一番強いレスラーを決める。"}, {"t": 78.25, "x": "それが新日本プロレスの掲げた目標でした。"}, {"t": 81.28333333333333, "x": "第1回のリーグ戦は\n1983年5月6日に始まりました。"}, {"t": 86.18333333333334, "x": "優勝戦は6月2日の蔵前国技館です。"}, {"t": 89.36666666666666, "x": "結果はホーガンの21分27秒、KO勝ち。"}, {"t": 93.36666666666666, "x": "この日のことは別の回で取り上げているので、\nここでは結果だけにとどめます。"}, {"t": 98.08333333333333, "x": "前の年に優勝を\n逃した猪木が、もう一度ホーガンと決着をつける。"}, {"t": 103.03333333333333, "x": "1984年の第2回は、\nそうした組み立ての大会になりました。"}, {"t": 108.03333333333333, "x": "第2回IWGPの開幕は、\n1984年5月11日の"}, {"t": 114.2, "x": "福岡スポーツセンターです。"}, {"t": 115.9, "x": "最終戦は6月14日の蔵前国技館でした。"}, {"t": 119.46666666666667, "x": "日程表に並んだ大会は、あわせて32あります。"}, {"t": 123.38333333333334, "x": "九州から東北まで全国を回ります。"}, {"t": 126.13333333333334, "x": "およそ1か月をかけた長いシリーズでした。"}, {"t": 128.86666666666667, "x": "参加したのは12人です。"}, {"t": 130.78333333333333, "x": "日本からは猪木と藤波、マサ斎藤と長州力。"}, {"t": 134.7, "x": "北米からはアンドレ・ザ・ジャイアント。"}, {"t": 136.86666666666667, "x": "そのほかアメリカとヨーロッパからも\n選手が集まりました。"}, {"t": 140.21666666666667, "x": "ただし、予定どおりにはいきませんでした。"}, {"t": 143.48333333333332, "x": "出場が決まっていたのは、\nリック・マーテルです。"}, {"t": 146.63333333333333, "x": "マーテルは来日の直前に\nAWA世界王者になりました。"}, {"t": 150.6, "x": "それで参加を取りやめています。"}, {"t": 152.61666666666667, "x": "代わりに入ったのは、覆面の\nマスクド・スーパースターでした。"}, {"t": 156.48333333333332, "x": "さらにアメリカの大型選手の1人が、\nけがで途中棄権しました。"}, {"t": 161.03333333333333, "x": "5月31日の高知大会から先は、\nすべて不戦敗の扱いです。"}, {"t": 166.11666666666667, "x": "点数の付け方は第1回と同じでした。"}, {"t": 168.85, "x": "フォール勝ちとギブアップ勝ちは5点。"}, {"t": 171.05, "x": "リングアウト勝ちと反則勝ちは4点。"}, {"t": 173.6, "x": "不戦勝も4点。"}, {"t": 175.03333333333333, "x": "両者リングアウトの引き分けは、\n2人に2点ずつです。"}, {"t": 178.68333333333334, "x": "リーグ戦は60分1本勝負。"}, {"t": 181.06666666666666, "x": "総得点が一番多かった選手が、優勝戦に進みます。"}, {"t": 185.41666666666666, "x": "相手は前年の優勝者ホーガンです。"}, {"t": 187.96666666666667, "x": "優勝戦は時間無制限1本勝負で行われます。"}, {"t": 191.58333333333334, "x": "ホーガン本人は、リーグ戦には加わっていません。"}, {"t": 195.15, "x": "シリーズへの参加は2回に分かれていました。"}, {"t": 197.9, "x": "5月11日から18日までと、\n6月8日から14日までです。"}, {"t": 203.06666666666666, "x": "ホーガンはこの年の1月23日に\n王座を獲っています。"}, {"t": 206.91666666666666, "x": "WWF世界ヘビー級王座を初めて手にしたのです。"}, {"t": 210.81666666666666, "x": "場所はニューヨークの\nマディソン・スクエア・ガーデンでした。"}, {"t": 213.88333333333333, "x": "つまり、この優勝戦に出てくるホーガンは、\nWWFの現役の世界王者でした。"}, {"t": 220.66666666666666, "x": "リーグ戦の中身を日付で見ておきます。"}, {"t": 223.15, "x": "5月18日は広島県立体育館です。"}, {"t": 226.41666666666666, "x": "猪木と長州のリーグ戦が組まれました。"}, {"t": 228.9, "x": "猪木が16分48秒、\n逆さ押さえ込みで勝っています。"}, {"t": 233.36666666666667, "x": "6月1日は高松市民文化センターです。"}, {"t": 236.46666666666667, "x": "長州がアンドレ・ザ・ジャイアントを\nボディスラムで投げました。"}, {"t": 239.66666666666666, "x": "ただし、試合そのものは長州の負けです。"}, {"t": 242.88333333333333, "x": "6月11日は愛知県体育館です。"}, {"t": 245.85, "x": "猪木とアンドレのリーグ戦です。"}, {"t": 247.83333333333334, "x": "23分37秒で猪木の反則勝ちでした。"}, {"t": 251.26666666666668, "x": "アンドレが場外のフェンスを\n越えたことによる反則です。"}, {"t": 254.66666666666666, "x": "決まり手はオーバー・フェンスと\n記録されています。"}, {"t": 257.3, "x": "最終的な得点は次のとおりです。"}, {"t": 259.8833333333333, "x": "1位は猪木で53点。"}, {"t": 261.8833333333333, "x": "2位はアンドレ・ザ・ジャイアントで49点。"}, {"t": 264.5833333333333, "x": "3位は長州力で34点。"}, {"t": 267.1, "x": "4位は藤波で33点。"}, {"t": 269.35, "x": "1位の猪木と2位のアンドレの差は4点でした。"}, {"t": 272.3333333333333, "x": "猪木は、11試合すべてに勝ちました。"}, {"t": 275.3666666666667, "x": "53点は、そうして積み上げた数字です。"}, {"t": 278.6666666666667, "x": "フォール勝ちとギブアップ勝ちが9試合で45点。"}, {"t": 281.93333333333334, "x": "藤波とのリングアウト勝ちと、\nアンドレとの反則勝ちの2試合で8点。"}, {"t": 286.8333333333333, "x": "5月13日の北九州は延髄斬りで勝ちました。"}, {"t": 290.3333333333333, "x": "5月15日の熊本は卍固めで勝ちました。"}, {"t": 293.53333333333336, "x": "6月5日の大宮では、2分33秒の卍固めです。"}, {"t": 298.0833333333333, "x": "決まり手もはっきりしたものが並んでいます。"}, {"t": 300.6166666666667, "x": "2位はアンドレです。"}, {"t": 301.9166666666667, "x": "負けたのは、猪木戦の1試合だけでした。"}, {"t": 304.95, "x": "11試合のうち、ヒップ・ドロップでの\nフォール勝ちが6試合あります。"}, {"t": 309.4166666666667, "x": "6月8日の青森では、\n18文キックで勝っています。"}, {"t": 313.53333333333336, "x": "3位の長州力は、7勝3敗1分けでした。"}, {"t": 317.3, "x": "5月20日は銚子、6月7日は宮城です。"}, {"t": 320.85, "x": "この2試合では、サソリ固めで\nギブアップを奪っています。"}, {"t": 324.71666666666664, "x": "6月10日の静岡では、藤波と当たりました。"}, {"t": 328.31666666666666, "x": "14分42秒のリングアウトで勝っています。"}, {"t": 331.53333333333336, "x": "敗れた3試合の相手は、\nまず猪木とアンドレです。"}, {"t": 335.2, "x": "もう1人は、5月16日の佐賀で\n反則負けとなったアメリカの選手です。"}, {"t": 340.28333333333336, "x": "6月12日の豊橋ではマサ斎藤と当たりました。"}, {"t": 343.75, "x": "10分50秒の両者リングアウトで\n引き分けています。"}, {"t": 347.1333333333333, "x": "4位の藤波は、猪木とアンドレと\n長州の上位3人にすべて敗れました。"}, {"t": 352.31666666666666, "x": "残る8試合は6勝2分けです。"}, {"t": 354.71666666666664, "x": "引き分けの2試合は、\nどちらも両者リングアウトでした。"}, {"t": 358.45, "x": "優勝戦の前の日、6月13日にも\nシリーズの大会は組まれていました。"}, {"t": 363.78333333333336, "x": "場所は神奈川県の横須賀市総合体育館です。"}, {"t": 367.1166666666667, "x": "猪木はこの日がリーグ戦の最後の1試合でした。"}, {"t": 370.26666666666665, "x": "4分34秒のフォールで勝っています。"}, {"t": 373.05, "x": "アンドレも同じ横須賀で、\n最後のリーグ戦に勝ちました。"}, {"t": 376.8666666666667, "x": "得点は49点で終えています。"}, {"t": 379.3666666666667, "x": "ホーガンがシリーズに戻ったのは、\n6月8日の青森大会からです。"}, {"t": 383.98333333333335, "x": "点数の上では、猪木の1位が\n確定したのはこの6月13日でした。"}, {"t": 389.1, "x": "優勝戦の前の日です。"}, {"t": 390.8333333333333, "x": "リーグ戦とは別に、ホーガンが\n出た特別試合もありました。"}, {"t": 394.8333333333333, "x": "開幕戦の5月11日に福岡で\n組まれたのは、猪木対ホーガンです。"}, {"t": 399.8, "x": "結果は9分43秒です。"}, {"t": 402.21666666666664, "x": "レフェリーへの暴行による、\n猪木の反則負けでした。"}, {"t": 405.8666666666667, "x": "シリーズの最初の日に、\n猪木はホーガンに負けていました。"}, {"t": 409.6, "x": "4日後の5月15日は熊本です。"}, {"t": 412.21666666666664, "x": "ホーガンと長州の特別試合が組まれました。"}, {"t": 415.1, "x": "5分37秒、長州がリングアウトで負けています。"}, {"t": 419.05, "x": "猪木もホーガンも長州も、\n優勝戦の前に顔を合わせていました。"}, {"t": 423.6166666666667, "x": "それぞれ一度ずつです。"}, {"t": 425.1666666666667, "x": "こうして6月14日の優勝戦は、\n前の年と同じ猪木対ホーガンに決まります。"}, {"t": 430.8666666666667, "x": "蔵前国技館の収容人員は、1万人あまりです。"}, {"t": 435.0, "x": "この日の前売り券は、\n1か月前に売り切れていました。"}, {"t": 438.9166666666667, "x": "会場に入場できなかった人もいました。"}, {"t": 441.5, "x": "新日本はその人たちのために、\n仮のスタジオを作っています。"}, {"t": 445.8666666666667, "x": "場所は国技館の敷地にある、\n相撲教習所の隣です。"}, {"t": 449.9166666666667, "x": "置かれたのは100インチの\nプロジェクターでした。"}, {"t": 452.46666666666664, "x": "そこでおよそ300人が試合の映像を見ました。"}, {"t": 455.7, "x": "東京スポーツは、これを日本で初めての\nクローズド・サーキットと書いています。"}, {"t": 460.56666666666666, "x": "なお、この日の試合は生中継ではありません。"}, {"t": 464.1, "x": "録画でテレビに流れたと記録されています。"}, {"t": 466.73333333333335, "x": "では、優勝戦の経過です。"}, {"t": 469.25, "x": "時間無制限1本勝負。"}, {"t": 471.25, "x": "試合は場外にもつれました。"}, {"t": 473.28333333333336, "x": "ホーガンが場外でブレーンバスターを見舞います。"}, {"t": 476.1166666666667, "x": "2人ともリングに戻れませんでした。"}, {"t": 478.26666666666665, "x": "17分15秒で両者リングアウトの判定が出ます。"}, {"t": 481.85, "x": "このとき、ホーガンは、試合の続行に\n納得していなかったと伝えられています。"}, {"t": 487.35, "x": "それでも、延長戦が行われることになりました。"}, {"t": 490.8666666666667, "x": "延長戦では、猪木が足4の字固めを仕掛けます。"}, {"t": 494.68333333333334, "x": "もつれ合った2人はエプロンに出ました。"}, {"t": 496.9166666666667, "x": "今度はそこでカウントが進みます。"}, {"t": 499.18333333333334, "x": "2分13秒、両者エプロンカウントアウト。"}, {"t": 502.6666666666667, "x": "2度目も勝者は決まりません sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
