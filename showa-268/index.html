<script>
const D={"name": "星野勘太郎", "file": "268_編集用", "dur": 831.0333125, "segs": [], "subs": [{"t": 0.0, "x": "2002年8月8日、広島グリーンアリーナ。"}, {"t": 3.5833333333333335, "x": "新日本プロレスの大会に、\n黒いスーツの男が姿を見せました。"}, {"t": 8.25, "x": "後ろには、マスクの男が3人ついています。"}, {"t": 11.583333333333334, "x": "試合のあと、男は報道陣に名刺を配りました。"}, {"t": 15.333333333333334, "x": "肩書きは「プロレス結社・\n魔界倶楽部 総裁」です。"}, {"t": 19.366666666666667, "x": "男の名前は星野勘太郎。"}, {"t": 21.35, "x": "このとき58歳でした。"}, {"t": 23.216666666666665, "x": "リングを降りてから、7年がたっていました。"}, {"t": 26.2, "x": "この男の歩みからは、\nいくつものものが消えています。"}, {"t": 29.8, "x": "最初に入った団体は、本人が\nメキシコにいる間になくなりました。"}, {"t": 34.45, "x": "相棒の山本小鉄は、\n星野より3か月早く世を去っています。"}, {"t": 38.86666666666667, "x": "足を切る寸前まで悪くした入院もありました。"}, {"t": 42.03333333333333, "x": "そのことを知る人は、\n家族のほかに数人だけでした。"}, {"t": 45.666666666666664, "x": "一度リングを降りた男は、なぜ黒い\nスーツで戻ってきたのでしょうか？"}, {"t": 50.3, "x": "今回は星野勘太郎という1人の\nレスラーの49年を追っていきます。"}, {"t": 54.9, "x": "残っている試合の記録と、\nそばにいた人の証言を順に見ていきます。"}, {"t": 59.68333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.18333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 67.75, "x": "星野勘太郎は1943年10月9日に\n生まれました。"}, {"t": 72.16666666666667, "x": "生まれたのは兵庫県神戸市です。"}, {"t": 74.38333333333334, "x": "神戸商業高校では、ボクシングに打ち込みました。"}, {"t": 78.06666666666666, "x": "ケンカの強さでも、\n名を知られていたと伝えられています。"}, {"t": 81.81666666666666, "x": "実の弟が語った話が、\n東京スポーツの連載に残っています。"}, {"t": 86.61666666666666, "x": "小学5年のとき、\n星野は高校生とケンカをしました。"}, {"t": 90.65, "x": "このケンカで入院しています。"}, {"t": 92.63333333333334, "x": "星野は、負けに納得できません。"}, {"t": 95.2, "x": "下駄を持って病院を抜け出しました。"}, {"t": 97.5, "x": "そして仕返しに向かったといいます。"}, {"t": 99.7, "x": "1961年10月、\n星野は日本プロレスに入りました。"}, {"t": 104.55, "x": "団体を率いていたのは力道山です。"}, {"t": 107.06666666666666, "x": "デビューは同じ年の12月22日でした。"}, {"t": 110.1, "x": "会場はリキ・スポーツパレスです。"}, {"t": 112.25, "x": "このとき18歳でした。"}, {"t": 114.0, "x": "最初のリングネームは、本名の星野建夫でした。"}, {"t": 117.63333333333334, "x": "1963年8月、名前を星野勘太郎に改めます。"}, {"t": 122.71666666666667, "x": "もとになったのは、\n股旅物の「伊那の勘太郎」です。"}, {"t": 126.6, "x": "名付けたのは、日本プロレスの宣伝部長でした。"}, {"t": 129.98333333333332, "x": "身長は170センチです。"}, {"t": 132.18333333333334, "x": "レスラーの中では小さな体でした。"}, {"t": 134.6, "x": "それでも、ケンカをいとわずに前へ出ていきます。"}, {"t": 137.9, "x": "ついた呼び名は「突貫小僧」でした。"}, {"t": 140.18333333333334, "x": "1967年1月、星野は\n山本小鉄とアメリカへ渡りました。"}, {"t": 145.61666666666667, "x": "星野は、しばらくロサンゼルスに残ります。"}, {"t": 148.75, "x": "そこでカリフォルニアTV王座を手にしました。"}, {"t": 151.45, "x": "次に移ったのはテネシーです。"}, {"t": 153.53333333333333, "x": "ここでは「グレート・ヤマハ」と名乗りました。"}, {"t": 156.31666666666666, "x": "7月には、現地の\nNWA世界タッグ王座を取っています。"}, {"t": 160.78333333333333, "x": "組んだのは、プエルトリコ出身の選手でした。"}, {"t": 164.1, "x": "8月には、\n南部ジュニアヘビー級王座も巻きました。"}, {"t": 167.78333333333333, "x": "ファンがまとめた選手の記録があります。"}, {"t": 170.23333333333332, "x": "それによると、山本をテネシーに\n呼んだのは星野の方でした。"}, {"t": 174.46666666666667, "x": "こうして2人は\n「ヤマハ・ブラザーズ」になります。"}, {"t": 177.55, "x": "1970年1月、星野は\n2度目の海外遠征に出ました。"}, {"t": 182.48333333333332, "x": "行き先はロサンゼルスとメキシコです。"}, {"t": 184.75, "x": "メキシコでのリングネームは「ヤマモト」でした。"}, {"t": 187.25, "x": "その年の秋、星野は日本へ戻ります。"}, {"t": 190.3, "x": "待っていたのは、タッグのリーグ戦でした。"}, {"t": 193.28333333333333, "x": "日本プロレスが新しく始めた大会です。"}, {"t": 196.1, "x": "名前は第1回NWAタッグ・リーグ戦。"}, {"t": 199.21666666666667, "x": "星野と組んだのは、アントニオ猪木でした。"}, {"t": 202.25, "x": "1970年11月5日、台東体育館。"}, {"t": 206.58333333333334, "x": "決勝の相手は、\nニック・ボックウィンクルの組でした。"}, {"t": 210.0, "x": "猪木の試合を集めたファンの記録があります。"}, {"t": 212.76666666666668, "x": "それによると、試合は3本勝負でした。"}, {"t": 215.88333333333333, "x": "1本目はボックウィンクルが取りました。"}, {"t": 218.25, "x": "星野が体固めで押さえられています。"}, {"t": 220.63333333333333, "x": "時間は33分30秒でした。"}, {"t": 223.31666666666666, "x": "2本目は星野が体固めで取り返します。"}, {"t": 226.11666666666667, "x": "そのまま決着はつきません。"}, {"t": 228.06666666666666, "x": "60分が過ぎて時間切れになりました。"}, {"t": 230.65, "x": "延長戦で、猪木が卍固めを決めます。"}, {"t": 233.93333333333334, "x": "猪木と星野の組が、\n第1回の優勝チームになりました。"}, {"t": 238.31666666666666, "x": "年が明けた1971年2月19日、後楽園ホール。"}, {"t": 243.35, "x": "ミル・マスカラスが、\n日本で初めての試合をしました。"}, {"t": 246.88333333333333, "x": "その相手を務めたのが星野です。"}, {"t": 249.11666666666667, "x": "星野はマスカラスのボディアタックで敗れました。"}, {"t": 251.9, "x": "この写真は、その日本初試合を\n伝える東京スポーツの1枚です。"}, {"t": 256.7, "x": "1973年、星野は3度目の\n遠征でメキシコにいました。"}, {"t": 261.7, "x": "今度は悪役の側での参戦です。"}, {"t": 264.1333333333333, "x": "ファンがまとめた記録に、\nある試合が残っています。"}, {"t": 267.7, "x": "1973年6月29日、アレナ・メヒコ。"}, {"t": 271.95, "x": "メキシコシティの大きな会場です。"}, {"t": 274.1333333333333, "x": "星野は地元の選手と、\n髪の毛をかけて戦いました。"}, {"t": 277.93333333333334, "x": "敗れたのは星野です。"}, {"t": 279.46666666666664, "x": "記録では、試合のあとに髪を剃られています。"}, {"t": 282.68333333333334, "x": "この年、日本プロレスは\n興行を続けられなくなりました。"}, {"t": 286.6, "x": "星野が入門から12年いた団体です。"}, {"t": 289.4166666666667, "x": "その団体が、星野が日本にいない間に\n消えたことになります。"}, {"t": 293.65, "x": "1974年1月、星野は新日本プロレスの\nリングに上がり始めます。"}, {"t": 299.4166666666667, "x": "新日本は、猪木が1972年に\n旗揚げした団体です。"}, {"t": 304.3333333333333, "x": "ここで山本小鉄とのコンビも元に戻りました。"}, {"t": 307.23333333333335, "x": "1977年、星野は東京スポーツの\nプロレス大賞で賞を受けました。"}, {"t": 312.8833333333333, "x": "Numberのコラムに、\nそのときの姿が書かれています。"}, {"t": 316.51666666666665, "x": "星野は記者に抱きついて言いました。"}, {"t": 318.68333333333334, "x": "「俺、この賞、本当に欲しかったんだよ」。"}, {"t": 322.1333333333333, "x": "1979年1月21日、東京。"}, {"t": 326.3666666666667, "x": "ヤマハ・ブラザーズは、\n国際プロレスのベルトに挑みました。"}, {"t": 330.1, "x": "IWA世界タッグ王座です。"}, {"t": 332.5, "x": "王者は、グレート草津とアニマル浜口の組でした。"}, {"t": 336.06666666666666, "x": "2人は王者組を破ってベルトを手にします。"}, {"t": 338.9166666666667, "x": "ただし、持っていた期間は長くありません。"}, {"t": 342.1166666666667, "x": "1979年2月23日、千葉公園体育館。"}, {"t": 347.1, "x": "2人はマイティ井上と\nアニマル浜口の組に敗れました。"}, {"t": 350.55, "x": "ベルトは国際プロレスに戻ります。"}, {"t": 352.75, "x": "王者でいたのは33日間でした。"}, {"t": 355.3333333333333, "x": "昭和の選手名鑑は、新日本での\n星野についてこう書いています。"}, {"t": 360.1, "x": "「タイトルに縁はなかった」。"}, {"t": 361.73333333333335, "x": "1980年4月4日、山本小鉄が\n川崎市体育館で引退しました。"}, {"t": 367.7, "x": "最後の試合で、山本の隣にいたのは星野です。"}, {"t": 371.53333333333336, "x": "ヤマハ・ブラザーズの試合はここで終わりました。"}, {"t": 374.3, "x": "1981年7月、札幌。"}, {"t": 377.93333333333334, "x": "星野は婚約を発表しました。"}, {"t": 380.2, "x": "その場には、東京スポーツの\nカメラマンがいました。"}, {"t": 383.6, "x": "星野は照れながら、こう言っています。"}, {"t": 386.28333333333336, "x": "「オレの婚約がニュースになるのか？」。"}, {"t": 388.48333333333335, "x": "1982年1月15日、\n新日本プロレスの姫路大会。"}, {"t": 393.8, "x": "星野はダイナマイト・キッドと\n1対1で戦いました。"}, {"t": 397.0833333333333, "x": "キッドは2001年に自伝を出しています。"}, {"t": 399.8333333333333, "x": "その中で、この試合はケンカだったと書きました。"}, {"t": 403.21666666666664, "x": "きっかけを作ったのは\n星野だった、とも記しています。"}, {"t": 407.0, "x": "星野がフロントチョークで締め上げます。"}, {"t": 409.3333333333333, "x": "キッドは腕をひねって外しました。"}, {"t": 411.46666666666664, "x": "2人は急所を蹴り合っています。"}, {"t": 413.55, "x": "最後は、キッドの\nツームストーン・パイルドライバーでした。"}, {"t": 417.3, "x": "そこからコーナーに上がります。"}, {"t": 419.18333333333334, "x": "ダイビング・ヘッドバットで3カウントでした。"}, {"t": 421.93333333333334, "x": "この写真は、その姫路の試合で撮られたものです。"}, {"t": 425.5, "x": "1986年1月14日、\n兵庫県の豊岡市民体育館。"}, {"t": 431.1, "x": "星野はUWFの前田日明と\n山崎一夫の組と戦いました。"}, {"t": 435.48333333333335, "x": "前田のローキックを、星野は受けません。"}, {"t": 438.3, "x": "試合は殴り合いになりました。"}, {"t": 440.3, "x": "前田が腕ひしぎ逆十字固めをかけます。"}, {"t": 443.1166666666667, "x": "その間も、星野は上から殴っていました。"}, {"t": 446.21666666666664, "x": "星野は口を切っています。"}, {"t": 447.96666666666664, "x": "試合のあと、星野は1人で\n前田の控室へ向かいました。"}, {"t": 452.0, "x": "前田によると、殴り合う前に\n周りに止められたといいます。"}, {"t": 456.1333333333333, "x": "写真は、この豊岡で前田とやり合う星野です。"}, {"t": 459.7, "x": "同じ1986年の4月29日、三重県の津。"}, {"t": 464.26666666666665, "x": "前田はアンドレ・ザ・ジャイアントと戦いました。"}, {"t": 466.8833333333333, "x": "このとき、セコンドについていたのが星野です。"}, {"t": 470.05, "x": "試合の途中、前田は星野に向かって叫びました。"}, {"t": 473.8333333333333, "x": "「やっちゃっていいんですか！？」。"}, {"t": 475.6, "x": "前田の記憶では、星野の返事は\n「オレに聞くな」という意味でした。"}, {"t": 480.28333333333336, "x": "この写真には、そのときの\n困った顔の星野が写っています。"}, {"t": 484.43333333333334, "x": "1989年9月21日、横浜。"}, {"t": 488.65, "x": "星野は獣神ライガーの掌底を受けました。"}, {"t": 491.6666666666667, "x": "鼻からは血が出ています。"}, {"t": 493.3666666666667, "x": "試合が終わっても、2人の乱闘は続きました。"}, {"t": 496.76666666666665, "x": "ライガーは後に東京スポーツで話しています。"}, {"t": 499.7, "x": "勝ち名乗りのあと、\n星野から蹴られたという話です。"}, {"t": 503.15, "x": "当時プロレスを取材していた記者も、\nある場面を覚えていました。"}, {"t": 507.3333333333333, "x": "熊本の屋外の特設リングでの試合です。"}, {"t": 510.183333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
