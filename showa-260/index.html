<script>
const D={"name": "永源遙", "file": "260_編集用", "dur": 918.2333125, "segs": [], "subs": [{"t": 0.0, "x": "お先に失礼します。"}, {"t": 1.5166666666666666, "x": "70歳の元レスラーがそう言い残して、\n東京にあるプロレスリング・ノアの"}, {"t": 6.3, "x": "事務所をあとにしました。"}, {"t": 7.633333333333334, "x": "2016年11月28日の\n午後に残ったひとことです。"}, {"t": 11.816666666666666, "x": "元レスラーの名前は永源遙。"}, {"t": 14.083333333333334, "x": "午前中には、ノアの会長と\n長話をしていたことが分かっています。"}, {"t": 18.683333333333334, "x": "ところが夕方、自宅近くの行きつけの\nサウナで倒れてしまいます。"}, {"t": 22.966666666666665, "x": "救急車が向かった病院で、\n永源は息を引き取りました。"}, {"t": 27.183333333333334, "x": "死因は急性心筋梗塞と発表されています。"}, {"t": 30.633333333333333, "x": "翌日の会見で、会長は当日の\n様子をこう話しています。"}, {"t": 35.18333333333333, "x": "まったくいつもと変わらずです。"}, {"t": 37.083333333333336, "x": "永源は客席にツバを吐く姿で知られた男です。"}, {"t": 40.483333333333334, "x": "その男が亡くなる日の昼まで、\nいつもどおりプロレスの仕事場にいました。"}, {"t": 45.2, "x": "デビューから50年がたった秋のことです。"}, {"t": 47.78333333333333, "x": "リングを降りて10年がたっても、永源遙はなぜ\nプロレスの仕事場を離れなかったのでしょうか？"}, {"t": 53.96666666666667, "x": "今回は永源遙という1人のプロレスラーが\n歩いた50年を追っていきます。"}, {"t": 58.71666666666667, "x": "具体的な日付と、一緒に過ごした人たちの\n証言をもとに辿っていきます。"}, {"t": 63.81666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.31666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.9, "x": "永源遙は1946年、石川県に生まれました。"}, {"t": 76.63333333333334, "x": "生まれた町は、今の中能登町にあたります。"}, {"t": 79.78333333333333, "x": "最初に入った世界は大相撲でした。"}, {"t": 82.33333333333333, "x": "永源は立浪部屋に入門します。"}, {"t": 84.83333333333333, "x": "四股名は永源で、この名前で土俵に上がりました。"}, {"t": 88.43333333333334, "x": "そして1965年、相撲を廃業しました。"}, {"t": 92.48333333333333, "x": "次の行き先は、できたばかりの団体でした。"}, {"t": 95.68333333333334, "x": "東京プロレスです。"}, {"t": 97.06666666666666, "x": "この団体には、日本プロレスにいた\nアントニオ猪木が移りました。"}, {"t": 101.33333333333333, "x": "誘ったのは豊登です。"}, {"t": 103.13333333333334, "x": "猪木はこの団体の看板になります。"}, {"t": 105.55, "x": "永源はこの東京プロレスに入門しました。"}, {"t": 108.46666666666667, "x": "同じ立浪部屋にいた寺西勇と一緒でした。"}, {"t": 111.58333333333333, "x": "1966年10月12日のことです。"}, {"t": 114.95, "x": "東京プロレスは蔵前国技館で旗揚げ戦を開きます。"}, {"t": 118.68333333333334, "x": "メインイベントは猪木と\nジョニー・バレンタインの一戦でした。"}, {"t": 122.03333333333333, "x": "時間無制限の1本勝負です。"}, {"t": 124.33333333333333, "x": "この同じ旗揚げ戦で、永源はデビューしました。"}, {"t": 127.98333333333333, "x": "相手は木村政雄。"}, {"t": 129.38333333333333, "x": "のちのラッシャー木村です。"}, {"t": 131.0, "x": "この名前は20年あまりのちに、もう一度永源の\n前に現れることになります。"}, {"t": 136.4, "x": "しかし東京プロレスは1年もたずに崩壊します。"}, {"t": 139.68333333333334, "x": "一緒に入門した寺西勇は\n国際プロレスへ移りました。"}, {"t": 143.63333333333333, "x": "永源が移ったのは日本プロレスです。"}, {"t": 146.11666666666667, "x": "猪木も戻っていった団体でした。"}, {"t": 148.2, "x": "当時の後輩の証言が残っています。"}, {"t": 150.73333333333332, "x": "このころの永源は東京の渋谷に住んでいました。"}, {"t": 153.88333333333333, "x": "そして若い選手たちを\n連れて歩いていたといいます。"}, {"t": 157.08333333333334, "x": "その中に桜田一男がいました。"}, {"t": 159.26666666666668, "x": "のちのケンドー・ナガサキです。"}, {"t": 161.01666666666668, "x": "キラー・カーンもいました。"}, {"t": 162.5, "x": "やがて日本プロレスがなくなります。"}, {"t": 164.68333333333334, "x": "永源はアントニオ猪木の\n新日本プロレスに移りました。"}, {"t": 168.21666666666667, "x": "それから1984年まで、\n永源は新日本のリングに上がり続けます。"}, {"t": 173.93333333333334, "x": "この新日本時代を語った3人の選手がいます。"}, {"t": 177.16666666666666, "x": "当時の若手だった3人です。"}, {"t": 179.18333333333334, "x": "3人は名前を伏せて、\n東京スポーツに話をしています。"}, {"t": 183.36666666666667, "x": "1人目によると、永源を\n呼び捨てにできたのは3人だけでした。"}, {"t": 187.71666666666667, "x": "星野勘太郎と猪木と坂口征二です。"}, {"t": 190.38333333333333, "x": "若手にとっては、それだけ上の\n存在だったということです。"}, {"t": 194.31666666666666, "x": "巡業先の旅館では、\n朝食の席でこんなことがありました。"}, {"t": 198.5, "x": "永源が大声できわどい冗談を言います。"}, {"t": 201.25, "x": "それでも若手は誰も文句を\n言えなかったといいます。"}, {"t": 204.33333333333334, "x": "2人目は、試合の前の\n決まりごとを覚えていました。"}, {"t": 207.91666666666666, "x": "場外に出る前や、悪ふざけをする前のことです。"}, {"t": 211.61666666666667, "x": "永源は必ず若手に見てるかと確かめたといいます。"}, {"t": 214.95, "x": "そして確かめる相手は、いつも猪木でした。"}, {"t": 218.0, "x": "ある試合では、セコンドの\n若手にまず確かめました。"}, {"t": 221.51666666666668, "x": "控室から見ていたか、という確認です。"}, {"t": 224.7, "x": "そのうえで永源はリングの下で水を口に含みます。"}, {"t": 228.1, "x": "そして噴き出してみせたと証言されています。"}, {"t": 230.8, "x": "そして、のちに永源の代名詞になるツバです。"}, {"t": 234.16666666666666, "x": "これも同じ証言です。"}, {"t": 235.8, "x": "ツバを飛ばし始めたのは1975年ごろでした。"}, {"t": 239.5, "x": "永源はわざわざリングのそばまで行きます。"}, {"t": 242.15, "x": "客席の女性の前でツバをためてみせます。"}, {"t": 244.91666666666666, "x": "それを相手の選手に叩かせるのです。"}, {"t": 247.35, "x": "そういう段取りを、永源は自分で\n組み立てていたといいます。"}, {"t": 251.5, "x": "新日本時代の永源は、写真にも残っています。"}, {"t": 255.26666666666668, "x": "1976年7月、岡山。"}, {"t": 258.6, "x": "タイガー・ジェット・シンとの試合で、\n猪木が痛めつけられました。"}, {"t": 262.6, "x": "その猪木を永源と藤原喜明が\n両側から抱えて運ぶ1枚です。"}, {"t": 267.25, "x": "1981年9月11日には、\n青森県むつ市で大会がありました。"}, {"t": 273.1166666666667, "x": "このとき場外にいたのは前田日明です。"}, {"t": 275.73333333333335, "x": "その前田に、永源が立つ位置を\n指示している写真があります。"}, {"t": 279.98333333333335, "x": "場外へのダイビングを狙う、\nお決まりの動きの場面でした。"}, {"t": 284.0833333333333, "x": "観客はここで沸いたと\n東京スポーツは伝えています。"}, {"t": 287.45, "x": "1984年に、永源は新日本プロレスを離れます。"}, {"t": 292.21666666666664, "x": "長州力らと一緒でした。"}, {"t": 294.1, "x": "加わったのはジャパンプロレスでした。"}, {"t": 296.25, "x": "ここにも、当時の後輩が覚えている話があります。"}, {"t": 299.98333333333335, "x": "ジャパンプロレスはグアムで合宿をしました。"}, {"t": 302.6166666666667, "x": "そのとき税関で止められたのは\n永源1人だけでした。"}, {"t": 305.8833333333333, "x": "数泊するのに、手荷物のバッグに\n入っていたのは歯ブラシ1本。"}, {"t": 310.3, "x": "Tシャツとタイツは若手が持っていました。"}, {"t": 312.73333333333335, "x": "別の後輩も、永源の荷物について話しています。"}, {"t": 316.53333333333336, "x": "永源は普段から荷物が少ない人でした。"}, {"t": 319.3, "x": "下着やシャツは洗えばすぐ乾くから要らない。"}, {"t": 322.03333333333336, "x": "そういう考えだったといいます。"}, {"t": 324.1, "x": "ジャパンプロレスは、全日本プロレスの\nリングに上がるようになります。"}, {"t": 328.4, "x": "そして1987年、団体が2つに割れました。"}, {"t": 332.96666666666664, "x": "このとき永源は新日本に戻りませんでした。"}, {"t": 335.9166666666667, "x": "全日本プロレスに残る側にいたのです。"}, {"t": 338.53333333333336, "x": "こうして永源はジャイアント馬場の\n全日本プロレスの選手になります。"}, {"t": 342.6166666666667, "x": "全日本での永源の場所は、\n休憩の前の試合でした。"}, {"t": 346.73333333333335, "x": "渕正信、大熊元司と組んだ悪役商会です。"}, {"t": 350.5, "x": "向かい合うのはファミリー軍団でした。"}, {"t": 352.7, "x": "馬場とラッシャー木村、そして百田光雄の\n3人です。"}, {"t": 356.48333333333335, "x": "この2組の6人タッグは、\n休憩前の欠かせない定番の試合でした。"}, {"t": 361.3833333333333, "x": "東京スポーツはそう書いています。"}, {"t": 363.53333333333336, "x": "ピンクのタイツと、客席へのツバ。"}, {"t": 366.1, "x": "それが全日本のリングでの永源の姿でした。"}, {"t": 369.1666666666667, "x": "向かいのコーナーには、\nラッシャー木村がいました。"}, {"t": 372.31666666666666, "x": "1966年の旗揚げ戦で、\n永源がデビューした日の相手です。"}, {"t": 377.55, "x": "20年あまりのち、その2人が休憩前の\n6人タッグで向かい合っていました。"}, {"t": 382.81666666666666, "x": "渕は、その木村をめぐる永源の\n一言も覚えています。"}, {"t": 386.73333333333335, "x": "1991年6月、日本武道館の大会のころです。"}, {"t": 391.6166666666667, "x": "木村は試合後のマイクで\n話す言葉を忘れてしまいました。"}, {"t": 395.15, "x": "そこで渕に相談した場面がありました。"}, {"t": 397.78333333333336, "x": "そのとき永源は怒ったといいます。"}, {"t": 400.1333333333333, "x": "そんなこと、木村さんに言わすな。"}, {"t": 402.65, "x": "これが永源の言葉でした。"}, {"t": 404.45, "x": "1992年12月4日、日本武道館。"}, {"t": 408.68333333333334, "x": "永源は渕、大熊と組みました。"}, {"t": 411.4, "x": "相手は馬場と木村、そして\nアンドレ・ザ・ジャイアントの組です。"}, {"t": 415.3333333333333, "x": "これが大熊元司の最後の試合になります。"}, {"t": 418.0833333333333, "x": "その月の27日、\n大熊は現役のまま世を去りました。"}, {"t": 422.35, "x": "51歳でした。"}, {"t": 423.76666666666665, "x": "悪役商会の3人のうち、\n1人がここで欠けたことになります。"}, {"t": 428.1333333333333, "x": "それでも永源はリングに上がり続けました。"}, {"t": 430.85, "x": "2000年、全日本プロレスから\n多くの選手が離れます。"}, {"t": 435.0, "x": "三沢光晴を中心に、\nプロレスリング・ノアが旗揚げしました。"}, {"t": 439.21666666666664, "x": "永源はこの新しい団体に移ります。"}, {"t": 441.8833333333333, "x": "東京プロレスから数えて6つめの団体です。"}, {"t": 444.85, "x": "ノアでの永源には、\nツバ大王という呼び名がありました。"}, {"t": 448.73333333333335, "x": "客席からはこの名前で親しまれていました。"}, {"t": 451.45, "x": "2006年1月11日、後楽園ホール。"}, {"t": 455.25, "x": "永源は突然、現役を引退すると発表しました。"}, {"t": 459.3, "x": "この年、永源は60歳を\n迎えていました。還暦です。"}, {"t": 463.75, "x": "現役のまま還暦を迎えた日本の\nレスラーは、永源で4人目でした。"}, {"t": 468.65, "x": "前の3人には、ジャイアント馬場と\nラッシャー木村が入っています。"}, {"t": 473.03333333333336, "x": "スポーツ誌はそう書いています。"}, {"t": 474.95, "x": "会場は女性の客で埋まっていました。"}, {"t": 477.4, "x": "その会場は、この発表に\n驚いたと伝えられています。"}, {"t": 481.28333333333336, "x": "このときの永源の言葉が、\nスポーツ誌の記事に残っています。"}, {"t": 485.43333333333334, "x": "もー、いいでしょう。疲れたよ。"}, {"t": 488.1666666666667, "x": "その記事は永源を、こう書いています。"}, {"t": 491.0, "x": "力道山のあとの日本のプロレスの\n浮き沈みを語れる、数少ない1人。"}, {"t": 496.0, "x": "引退を発表し function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;

  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
