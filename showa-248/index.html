<script>
const D={"name": "輪島大士", "file": "248_編集用", "dur": 860.7833125, "segs": [], "subs": [{"t": 0.0, "x": "「すべて初心に返って裸一貫から出直す」\nそう言い切ったのは、5年前まで"}, {"t": 5.183333333333334, "x": "大相撲で横綱を張っていた男でした。"}, {"t": 7.666666666666667, "x": "1986年4月13日、東京・永田町の\nキャピトル東急ホテルで開かれた記者会見です。"}, {"t": 15.083333333333334, "x": "となりに座っていたのは、全日本プロレスを\n率いるジャイアント馬場でした。"}, {"t": 19.783333333333335, "x": "幕内で優勝すること14回、第54代の横綱。"}, {"t": 24.25, "x": "その男が、38歳で\nプロレスラーになると発表したのです。"}, {"t": 28.716666666666665, "x": "ところが、この男が\nリングにいた時間は長くありません。"}, {"t": 32.5, "x": "わずか2年8か月で終わります。"}, {"t": 34.7, "x": "最後の会見に、本人の姿はありませんでした。"}, {"t": 38.45, "x": "男の名は輪島大士。"}, {"t": 40.1, "x": "なぜ横綱まで上りつめた男は、\n38歳でリングに上がったのでしょうか。"}, {"t": 45.35, "x": "そしてなぜ、\n2年8か月で去っていったのでしょうか。"}, {"t": 49.13333333333333, "x": "今回は、元横綱が\nプロレスラーだった日々を辿ります。"}, {"t": 52.983333333333334, "x": "手がかりは、記録に残る日付と証言です。"}, {"t": 56.266666666666666, "x": "2018年10月8日に70歳で\n世を去るまでの歩みも、合わせてお伝えします。"}, {"t": 62.1, "x": "最後までご覧いただければ幸いです。"}, {"t": 64.6, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。輪島大士。"}, {"t": 71.16666666666667, "x": "本名は輪島博です。"}, {"t": 72.96666666666667, "x": "1948年1月11日に、\n石川県七尾市で生まれました。"}, {"t": 78.48333333333333, "x": "高校は、石川県の金沢高校に進みます。"}, {"t": 82.25, "x": "相撲部の監督の家に住み込んで稽古を積みました。"}, {"t": 85.6, "x": "その後、日本大学に進みます。"}, {"t": 88.2, "x": "1968年と1969年には、\n2年続けて学生横綱のタイトルを取りました。"}, {"t": 95.13333333333334, "x": "1970年1月場所。"}, {"t": 97.55, "x": "花籠部屋から幕下付出で初土俵を踏みます。"}, {"t": 100.88333333333334, "x": "1973年7月には、\n第54代横綱に昇進しました。"}, {"t": 106.38333333333334, "x": "初土俵から、わずか3年半での横綱です。"}, {"t": 109.93333333333334, "x": "左を差したときの強さは有名でした。"}, {"t": 112.63333333333334, "x": "「黄金の左」と呼ばれました。"}, {"t": 114.46666666666667, "x": "幕内優勝は14回。"}, {"t": 116.48333333333333, "x": "最後の優勝は1980年11月場所でした。"}, {"t": 120.53333333333333, "x": "1981年3月場所の途中で、\n輪島は現役を引退します。"}, {"t": 126.08333333333333, "x": "師匠は定年が近づいていました。"}, {"t": 128.41666666666666, "x": "そのあとを継いで、\n輪島は花籠部屋の親方になります。"}, {"t": 132.48333333333332, "x": "しかし1985年11月。"}, {"t": 135.33333333333334, "x": "相撲の世界で前代未聞とされる問題が表に出ます。"}, {"t": 138.98333333333332, "x": "親方として持っていた年寄の名跡は「花籠」です。"}, {"t": 142.3, "x": "この名跡が、家族が営む店の借金の\n担保に入れられていたのです。"}, {"t": 147.18333333333334, "x": "日本相撲協会は臨時理事会を開きました。"}, {"t": 150.2, "x": "輪島への処分は、2段階の\n降格と無期限の謹慎です。"}, {"t": 154.46666666666667, "x": "そして同じ1985年12月。"}, {"t": 157.53333333333333, "x": "輪島は相撲協会を去ります。"}, {"t": 159.63333333333333, "x": "横綱だった男は37歳で、\n相撲の世界との縁が切れました。"}, {"t": 164.5, "x": "それから4か月後の1986年4月。"}, {"t": 168.0, "x": "4月8日の日刊スポーツは、\n「輪島プロレス入り」と大きく報じました。"}, {"t": 172.78333333333333, "x": "見出しには、ほかの言葉も並んでいます。"}, {"t": 175.56666666666666, "x": "「今月米国修行」。"}, {"t": 177.05, "x": "「馬場の全日本」。"}, {"t": 178.3, "x": "「12月デビューへ」。"}, {"t": 179.83333333333334, "x": "輪島が馬場と会ったのはその前日。"}, {"t": 182.15, "x": "4月7日だったとされています。"}, {"t": 184.3, "x": "入門のきっかけも伝えられています。"}, {"t": 186.68333333333334, "x": "相談した相手は、日大の後輩のレスラーでした。"}, {"t": 190.31666666666666, "x": "この後輩も、先に大相撲から\nプロレスに入っていました。"}, {"t": 194.23333333333332, "x": "そして4月13日に、\n冒頭の入団発表が行われます。"}, {"t": 198.78333333333333, "x": "なお、発表の時期を「1986年6月」と\n書いている記事もあります。"}, {"t": 204.33333333333334, "x": "資料によって分かれているのです。"}, {"t": 206.45, "x": "今回は、東京スポーツの記事に従いました。"}, {"t": 209.8, "x": "会見の会場と日付まで記録しているためです。"}, {"t": 212.86666666666667, "x": "全日本プロレスは、\n日本テレビが中継する団体でした。"}, {"t": 216.9, "x": "中継は前の年の1985年に、\nゴールデンタイムへ戻ったばかりです。"}, {"t": 222.51666666666668, "x": "スポーツ雑誌ナンバーの記事によると、\n思うような視聴率は取れていません。"}, {"t": 227.4, "x": "記事は、ここにも触れています。"}, {"t": 229.68333333333334, "x": "元横綱の入団には、中継を\n立て直す狙いもあったというのです。"}, {"t": 234.33333333333334, "x": "38歳で土俵を離れて5年。"}, {"t": 236.88333333333333, "x": "当時は、この挑戦を\n無謀だと見る声も多くありました。"}, {"t": 240.85, "x": "国内でのデビューは、\n1986年11月と決まります。"}, {"t": 245.61666666666667, "x": "入団発表から数えると、\n準備の時間はわずか5か月ほどでした。"}, {"t": 250.28333333333333, "x": "入団発表の直後に、輪島は\n馬場とともにアメリカへ渡ります。"}, {"t": 254.88333333333333, "x": "現地で手ほどきをしたのは、\n元NWA王者のベテランレスラーたちです。"}, {"t": 259.85, "x": "輪島は一から教わりました。"}, {"t": 261.8, "x": "相撲とプロレスでは、\n受け身の取り方がまるで違います。"}, {"t": 265.65, "x": "全日本の中継で実況を担当した\nアナウンサーがいます。"}, {"t": 269.43333333333334, "x": "後にこう説明しています。"}, {"t": 271.28333333333336, "x": "「相撲は体を丸めて小さく受け身を取るんですが、\nプロレスは背中を思いっきりマットに"}, {"t": 276.93333333333334, "x": "ぶつけるように大きく受け身を取ります」。"}, {"t": 279.1166666666667, "x": "1986年8月7日。"}, {"t": 281.81666666666666, "x": "場所は、アメリカ・カンザス州の\nカンザスシティ・メモリアルホールです。"}, {"t": 286.05, "x": "輪島はこの日、プロレスラーとして初めて\nリングに上がりました。"}, {"t": 290.15, "x": "パートナーは馬場です。"}, {"t": 291.6, "x": "2人は、現地のタッグチームを相手に勝ちました。"}, {"t": 294.9166666666667, "x": "このあと輪島は、アメリカ各地で\n合わせて7試合をこなします。"}, {"t": 299.18333333333334, "x": "日本テレビは、この修行の\n様子をほぼ毎週放送しました。"}, {"t": 303.48333333333335, "x": "ナンバーの記事は、日本テレビの\n姿勢をこう書いています。"}, {"t": 307.25, "x": "「番組の命運を、輪島に託したのだ」。"}, {"t": 310.3, "x": "1986年11月1日。"}, {"t": 313.3666666666667, "x": "土曜日でした。"}, {"t": 314.45, "x": "国内のデビュー戦の会場は、\n石川県七尾市の総合体育館でした。"}, {"t": 319.55, "x": "輪島の生まれた町です。"}, {"t": 321.1666666666667, "x": "相手はタイガー・ジェット・シン。"}, {"t": 322.95, "x": "ナンバーの記事が\n「稀代の悪役レスラー」と呼んだ男です。"}, {"t": 326.4166666666667, "x": "シンはもともと、新日本プロレスで\nアントニオ猪木の宿敵でした。"}, {"t": 330.8, "x": "1981年に全日本へ移っていました。"}, {"t": 334.26666666666665, "x": "会場は満員です。"}, {"t": 335.81666666666666, "x": "報道陣は、およそ150人が\n詰めかけたと伝えられています。"}, {"t": 340.25, "x": "その中には、NHKを含む\nテレビ局5局がありました。"}, {"t": 344.6333333333333, "x": "試合は、夜7時からの\nゴールデンタイムに生中継されます。"}, {"t": 349.01666666666665, "x": "試合時間は5分55秒。"}, {"t": 351.21666666666664, "x": "結果は両者反則でした。"}, {"t": 353.1166666666667, "x": "試合時間は短いものでした。"}, {"t": 355.3, "x": "それでも東京スポーツは、\nファンに好感を与えたと伝えています。"}, {"t": 359.68333333333334, "x": "飾り気のない戦いぶりだったというのです。"}, {"t": 362.23333333333335, "x": "この中継の視聴率は、\n資料によって数字が分かれています。"}, {"t": 366.53333333333336, "x": "ナンバーの記事は23.7%です。"}, {"t": 369.5833333333333, "x": "1980年代の後半から後のプロレス中継で、\n一番高い数字だとしています。"}, {"t": 375.93333333333334, "x": "スポルティーバの記事は、ビデオリサーチ調べの\n関東地区で17.7%です。"}, {"t": 381.5833333333333, "x": "同じ時間帯で、一番の数字だったとしています。"}, {"t": 385.23333333333335, "x": "この夜の中継が大きな数字を取ったことでは、\nどちらの記事も一致しています。"}, {"t": 390.3666666666667, "x": "シンとの抗争は年をまたいで続きました。"}, {"t": 393.1666666666667, "x": "1987年1月には、横浜文化体育館でも\nシンと激しくぶつかっています。"}, {"t": 399.6166666666667, "x": "この日の東京スポーツの写真には、\nシンと向き合う輪島の姿が残されています。"}, {"t": 405.03333333333336, "x": "リングの外でも、シンとの\n因縁は話題になりました。"}, {"t": 408.6, "x": "1987年8月6日。"}, {"t": 411.4, "x": "千葉県でゴルフ大会のプロアマ戦が開かれます。"}, {"t": 414.5, "x": "出場した輪島は、ゴルフクラブを\n口にくわえてみせました。"}, {"t": 418.5, "x": "シンがサーベルを口にくわえる姿のまねです。"}, {"t": 421.4166666666667, "x": "輪島の順位は31位だったと記録されています。"}, {"t": 424.73333333333335, "x": "輪島には、自分だけの技もありました。"}, {"t": 427.71666666666664, "x": "その名は「ゴールデン・アームボンバー」です。"}, {"t": 430.05, "x": "相撲ののど輪とかち上げを組み合わせた技でした。"}, {"t": 433.1166666666667, "x": "相手ののどをつかんで、マットに叩きつけます。"}, {"t": 436.55, "x": "この技は、輪島の決め技になりました。"}, {"t": 439.51666666666665, "x": "一方で、輪島に容赦をしなかった男がいました。"}, {"t": 443.26666666666665, "x": "天龍源一郎です。"}, {"t": 444.9, "x": "天龍も、大相撲から\n全日本プロレスに入った男でした。"}, {"t": 449.1166666666667, "x": "1987年の全日本では主力の\n選手たちが団体を離れます。"}, {"t": 454.2, "x": "天龍は阿修羅・原と組んで、\nジャンボ鶴田や輪島に戦いを挑みました。"}, {"t": 459.03333333333336, "x": "この動きは「天龍革命」と呼ばれています。"}, {"t": 461.73333333333335, "x": "天龍は輪島との試合で、\n顔面への蹴りを何度も見舞いました。"}, {"t": 466.1, "x": "シューズのひもの跡が、輪島の顔に\n残るほどだったと伝えられています。"}, {"t": 470.78333333333336, "x": "輪島は、その蹴りを正面から受け続けました。"}, {"t": 474.0833333333333, "x": "1987年11月7日。"}, {"t": 477.05, "x": "輪島と天龍がぶつかる試合が行われます。"}, {"t": 480.01666666666665, "x": "この試合で輪島は、\n天龍に徹底的に攻められました。"}, {"t": 483.96666666666664, "x": "戦えない状態にまで追い込まれたのです。"}, {"t": 486.56666666666666, "x": "テレビの解説席には馬場がいました。"}, {"t": 488.8666666666667, "x": "「輪島は最初はよかったが、\nだんだん稽古しなくなりましたね」。"}, {"t": 492.8666666666667, "x": "馬場はこう話しています。"}, {"t": 494.56666666666666, "x": "この一言から、\n「輪島は練習をしない」という見方が"}, {"t": 498.18333333333334, "x": "広がったとされています。"}, {"t": 499.6333333333333, "x": "ただ、当時の輪島はひざの\nけがが悪くなっていました。"}, {"t": 503.21666666666664, "x": "そうした記録もあります。"}, {"t": 504.81666666666666, "x": "馬場が輪島に\nついてよく口にしていた言葉もあります。"}, {"t": 508.1, "x": "「体が固いんだよ」。"}, {"t": 509.53333333333336, "x": "実況アナウンサーが後にそう振り返っています。"}, {"t": 512.6, "x": "1988年に入っても、\n輪島への厳しい攻めは続きました。"}, {"t": 517.8, "x" .5, "x": "アメリカンフットボールのクラブチーム\n「ロックブル」の総監督も務めています。"}, {"t": 643.8666666666667, "x": "そして2006年12月25日。"}, {"t": 646.5, "x": "場所は東京・赤坂プリンスホテルです。"}, {"t": 649.0666666666667, "x": "この年のプロレス大賞の授賞式に、\n輪島が姿を見せました。"}, {"t": 653.55, "x": "引退から、およそ18年がたっていました。"}, {"t": 656.8166666666667, "x": "かつての宿敵シンとの間には、\nこんなやり取りも残っています。"}, {"t": 661.05, "x": "1995年12月8日。"}, {"t": 663.8, "x": "シンは大阪の大会に来ていました。"}, {"t": 666.1833333333333, "x": "東京スポーツの記者にシンはこう声をかけます。"}, {"t": 669.2, "x": "「輪島はどうしてる？"}, {"t": 670.6, "x": "会ったらよろしく伝えてくれ」。"}, {"t": 672.4333333333333, "x": "2年後の1997年12月16日。"}, {"t": 676.0666666666667, "x": "千葉の大会で、輪島が同じ記者と再会しました。"}, {"t": 679.8166666666667, "x": "輪島の答えは、こう記録されています。"}, {"t": 682.7166666666667, "x": "「何がよろしくだ。"}, {"t": 683.9, "x": "もうあいつとは関係ない」。"}, {"t": 685.5833333333334, "x": "2008年、輪島はプロレス記者の\n長いインタビューに応じました。"}, {"t": 690.2166666666667, "x": "そこで輪島はこう話しています。"}, {"t": 692.3666666666667, "x": "「初めはプロレスをショー的なものだと\n思っていたけども、いざ、自分がやってみたら、"}, {"t": 698.2166666666667, "x": "プロレスはそんなもんじゃないなと。"}, {"t": 700.35, "x": "それを私はヒシヒシと感じましたね」。"}, {"t": 702.8333333333334, "x": "話を聞いた記者は、後にこう書いています。"}, {"t": 705.9666666666667, "x": "輪島はプロレスの悪口を一切言わなかった。"}, {"t": 708.9666666666667, "x": "天龍も後に、輪島について\nこう語ったと伝えられています。"}, {"t": 713.2333333333333, "x": "「ミーハーだけど憎めない人で、\nみんなに好かれていた」。"}, {"t": 716.7333333333333, "x": "2013年の秋に、\n輪島に下咽頭がんが見つかります。"}, {"t": 721.05, "x": "12月に手術を受けました。"}, {"t": 723.05, "x": "がんを切り取ることには成功します。"}, {"t": 725.4, "x": "しかしその手術の影響で、\n輪島は声を失いました。"}, {"t": 729.5, "x": "2018年10月8日。"}, {"t": 731.6, "x": "輪島大士は東京都内の自宅で亡くなりました。"}, {"t": 734.65, "x": "70歳でした。"}, {"t": 736.0166666666667, "x": "死因は、咽頭がんと\n肺がんによる衰弱と伝えられています。"}, {"t": 740.4333333333333, "x": "10月15日には、東京・港区の\n青山葬儀所で葬儀と告別式が行われました。"}, {"t": 746.4833333333333, "x": "相撲界や芸能界、スポーツ界から、\nおよそ300人が参列しています。"}, {"t": 752.15, "x": "この日には、記念の施設を\n造る計画があることも明かされました。"}, {"t": 756.5166666666667, "x": "場所は、故郷の七尾市石崎町です。"}, {"t": 759.5166666666667, "x": "七尾市は、輪島がプロレスの\n国内デビュー戦を戦った町でもあります。"}, {"t": 764.3666666666667, "x": "スポー const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
