<style>

<script>
const D={"name": "TBSの国際プロレス中継", "file": "277_編集用", "dur": 931.31665625, "segs": [], "subs": [{"t": 0.0, "x": "1974年3月30日の土曜、\nTBSの番組表の午後2時の欄です。"}, {"t": 6.316666666666666, "x": "そこに、30分だけのプロレスの枠がありました。"}, {"t": 9.916666666666666, "x": "この回の録画は2か月も前のものでした。"}, {"t": 12.616666666666667, "x": "試合の場所は岩手県の盛岡です。"}, {"t": 15.15, "x": "この回の中身は、グレート草津の試合でした。"}, {"t": 18.5, "x": "メインのラッシャー木村の組の試合は、\n最後まで映っていません。"}, {"t": 22.883333333333333, "x": "関東の視聴者にとって、\nこれが最後の回になりました。"}, {"t": 26.816666666666666, "x": "1968年1月3日から数えて、6年3か月です。"}, {"t": 31.933333333333334, "x": "同じ日、国際プロレスは北海道の北見にいました。"}, {"t": 35.68333333333333, "x": "リングに上がっていたのはジャイアント馬場です。"}, {"t": 38.233333333333334, "x": "放送席の解説を務めてきた社長は、\n吉原功といいます。"}, {"t": 42.86666666666667, "x": "吉原は、この日でテレビ局を失いました。"}, {"t": 46.1, "x": "団体の収入の柱が消えたことになります。"}, {"t": 49.05, "x": "水曜の夜7時に始まった番組は、なぜ土曜の\n昼まで動いたのでしょうか？"}, {"t": 54.416666666666664, "x": "そして切られたのは、\nエースが抜けたからだったのでしょうか？"}, {"t": 58.3, "x": "今回は、TBSの番組表を追います。"}, {"t": 61.666666666666664, "x": "国際プロレスの中継が消えるまでの記録です。"}, {"t": 64.68333333333334, "x": "本と記事に残った日付と\n数字をもとに辿っていきます。"}, {"t": 68.13333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 70.63333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 76.21666666666667, "x": "吉原功は1930年3月2日に生まれました。"}, {"t": 80.31666666666666, "x": "早稲田大学のレスリング部の出身です。"}, {"t": 82.93333333333334, "x": "日本プロレスでは\n取締役営業部長を務めていました。"}, {"t": 86.73333333333333, "x": "1966年8月に、その会社を離れます。"}, {"t": 90.95, "x": "同じ年の10月に、\n国際プロレスを旗揚げしました。"}, {"t": 94.75, "x": "この写真は、国際プロレスを設立した吉原功です。"}, {"t": 98.96666666666667, "x": "旗揚げの翌月には、TBSと\nフジテレビに中継を持ちかけています。"}, {"t": 103.95, "x": "放映の契約が結ばれたのは\n1967年9月11日でした。"}, {"t": 109.0, "x": "TBSが払う放映権料は1回220万円です。"}, {"t": 113.03333333333333, "x": "日本テレビが日本プロレスに\n払っていた額は200万円でした。"}, {"t": 117.01666666666667, "x": "つまり、後から来た団体が\n上回ったことになります。"}, {"t": 120.71666666666667, "x": "始まりは1968年1月3日、\n水曜日の夜7時です。"}, {"t": 125.96666666666667, "x": "放送は55分でした。"}, {"t": 127.9, "x": "相手は、日本テレビの金曜の中継です。"}, {"t": 131.15, "x": "この時間を選んだ理由が記録に残っています。"}, {"t": 134.11666666666667, "x": "子どもがチャンネルを握る時間に置くことです。"}, {"t": 136.81666666666666, "x": "プロレスを家族の時間にする試みでした。"}, {"t": 139.48333333333332, "x": "初回の試合の結末は、過去の回で扱っています。"}, {"t": 143.33333333333334, "x": "草津は新人でした。"}, {"t": 144.9, "x": "テレビ局の意向で、\nエース候補に抜擢されたのです。"}, {"t": 148.68333333333334, "x": "5日後の1月8日、鹿児島県体育館で再戦します。"}, {"t": 153.03333333333333, "x": "ここでも草津は敗れました。"}, {"t": 154.9, "x": "数字はついてきました。"}, {"t": 156.48333333333332, "x": "開始から1か月の視聴率は、\n日本テレビの中継と互角です。"}, {"t": 161.0, "x": "日本テレビは隔週だった金曜の\n枠を、毎週に改めました。"}, {"t": 165.51666666666668, "x": "1968年と1969年の\n視聴率は20パーセント台です。"}, {"t": 171.15, "x": "1968年は、年間のベスト15に入っています。"}, {"t": 175.71666666666667, "x": "11月13日の放送は\n27パーセントを超えました。"}, {"t": 179.78333333333333, "x": "以後、この番組が25パーセントを\n超えた回はありません。"}, {"t": 183.85, "x": "この夜の放送は、\n盛岡市体育館からの生中継でした。"}, {"t": 188.2, "x": "盛岡には理由がありました。"}, {"t": 190.11666666666667, "x": "当時の岩手県の民放は、\n岩手放送の1局だけです。"}, {"t": 194.31666666666666, "x": "岩手で初めてのプロレス放送が、\nこのTBSの中継でした。"}, {"t": 198.81666666666666, "x": "岩手と宮城では、国際プロレスの興行が上でした。"}, {"t": 202.6, "x": "日本プロレスの客を上回っていたのです。"}, {"t": 205.31666666666666, "x": "1973年を除いて、岩手では\n毎年のように番組を撮っています。"}, {"t": 210.96666666666667, "x": "水曜の放送には、ほとんど休みがありません。"}, {"t": 214.46666666666667, "x": "1969年の大みそかを別にすると、\n休みはありません。"}, {"t": 219.45, "x": "年末年始以外で初めて休んだのは、\n1971年10月20日です。"}, {"t": 225.16666666666666, "x": "最初の変化は1970年でした。"}, {"t": 228.13333333333333, "x": "4月22日の放送から、\n番組はカラーになります。"}, {"t": 232.18333333333334, "x": "他の放送局のプロレス中継に遅れての\nカラーでした。"}, {"t": 235.75, "x": "ところが視聴率は下がっていきます。"}, {"t": 238.01666666666668, "x": "7月から9月は15パーセント前後でした。"}, {"t": 241.08333333333334, "x": "そこで10月14日に流したのが、\n金網の試合です。"}, {"t": 245.18333333333334, "x": "場所は大阪でした。"}, {"t": 246.65, "x": "しかし金網の放送は、局の中で問題になります。"}, {"t": 250.48333333333332, "x": "TBSの中継で金網が流れたのは、\nこの1回だけでした。"}, {"t": 254.88333333333333, "x": "この放送のあと、視聴率は\n15パーセントを割るようになります。"}, {"t": 259.25, "x": "1971年、吉原はアメリカの\nAWAから大物を次々に呼びました。"}, {"t": 265.71666666666664, "x": "これは当たります。"}, {"t": 266.9, "x": "12月の放送は、平均で\n16パーセント台に戻りました。"}, {"t": 271.3333333333333, "x": "ところが、その直後にTBSは\n番組の短縮を決めます。"}, {"t": 275.6166666666667, "x": "理由はニクソン・ショックでした。"}, {"t": 277.5, "x": "スポンサー料が入りにくくなったのです。"}, {"t": 279.95, "x": "55分の放送は、12月29日の\n埼玉県飯能市の大会が最後でした。"}, {"t": 285.93333333333334, "x": "1972年1月5日、\n番組は30分になりました。"}, {"t": 290.96666666666664, "x": "視聴率は10パーセント前後まで下がります。"}, {"t": 293.93333333333334, "x": "3月29日、水曜の夜の枠は終わりました。"}, {"t": 297.81666666666666, "x": "4年3か月でした。"}, {"t": 299.35, "x": "4月2日からは日曜の夕方6時に移ります。"}, {"t": 302.68333333333334, "x": "夜7時の枠を離れたのです。"}, {"t": 304.81666666666666, "x": "朝日放送は、子ども向けの\n番組を2本終わらせました。"}, {"t": 308.78333333333336, "x": "そうして、この番組の枠を空けています。"}, {"t": 311.8333333333333, "x": "時間は55分に戻っています。"}, {"t": 314.2, "x": "その代わりに失ったものが2つあります。"}, {"t": 316.8333333333333, "x": "1つは、リングの周りにあった\nスポンサーの幕です。"}, {"t": 320.3333333333333, "x": "もう1つは放映権料です。"}, {"t": 322.4166666666667, "x": "30パーセント減りました。"}, {"t": 324.28333333333336, "x": "基準は開始当初の220万円です。"}, {"t": 327.1333333333333, "x": "日曜の夕方には強い相手がいました。"}, {"t": 329.76666666666665, "x": "フジテレビのアニメです。"}, {"t": 331.28333333333336, "x": "いなかっぺ大将とサザエさんが裏にありました。"}, {"t": 334.1, "x": "子どもの時間を狙った番組が、\nアニメに子どもを取られたことになります。"}, {"t": 338.75, "x": "系列局の動きも変わります。"}, {"t": 340.85, "x": "遅らせて流す放送局が出ました。"}, {"t": 343.18333333333334, "x": "放送をやめる放送局も続きました。"}, {"t": 345.73333333333335, "x": "視聴率は10パーセントを\n割る週が目立ち始めます。"}, {"t": 349.1333333333333, "x": "5月15日、日本テレビが発表をしました。"}, {"t": 352.68333333333334, "x": "日本プロレスの中継をやめるという内容です。"}, {"t": 355.73333333333335, "x": "日本テレビとTBSの争いは、ここで終わります。"}, {"t": 359.48333333333335, "x": "6月25日、足立区体育館から\n生中継がありました。"}, {"t": 364.0, "x": "これがTBSの最後の生中継です。"}, {"t": 366.75, "x": "7月2日の放送からは、\nすべて録画に変わりました。"}, {"t": 370.7, "x": "10月1日、番組はまた30分に縮みます。"}, {"t": 374.6666666666667, "x": "時間は日曜の夕方6時25分からでした。"}, {"t": 377.95, "x": "ここから、1回に流れる試合は1つになります。"}, {"t": 381.5, "x": "1つの大会を2週に分けて流すのが、\n当たり前になりました。"}, {"t": 385.81666666666666, "x": "この年、会場の様子は番組とは逆でした。"}, {"t": 389.46666666666664, "x": "金網の試合を組んだ大会には、\n札止めになる所もありました。"}, {"t": 393.85, "x": "ただ、テレビは金網を流しません。"}, {"t": 396.6, "x": "撮影のある大会で金網を組むと、\nその夜のメインは映せなくなります。"}, {"t": 401.53333333333336, "x": "10月から11月にかけて、\nそんな回が6週続きました。"}, {"t": 405.8, "x": "メインの試合が画面にありません。"}, {"t": 408.05, "x": "11月27日の愛知県体育館では、\n金網の試合で騒ぎが起きています。"}, {"t": 413.98333333333335, "x": "この騒ぎは新聞の社会面にも載りました。"}, {"t": 416.81666666666666, "x": "11月29日と30日には、\n馬場が国際プロレスに出場しました。"}, {"t": 422.0833333333333, "x": "日本テレビとの契約があるため、\n馬場の試合も映せません。"}, {"t": 426.31666666666666, "x": "1973年、番組の周りの景色が変わります。"}, {"t": 430.8666666666667, "x": "3月25日、新潟放送が中継をやめました。"}, {"t": 435.06666666666666, "x": "4月1日、放送はさらに25分早まります。"}, {"t": 439.1, "x": "日曜の夕方6時からになりました。"}, {"t": 441.5, "x": "4月6日には、NETが\n新日本プロレスの中継を始めています。"}, {"t": 446.6166666666667, "x": "4月20日には、\n競争相手だった日本プロレスが崩れました。"}, {"t": 450.8833333333333, "x": "春のシリーズは全14戦のうち、\n8戦が金網でした。"}, {"t": 455.2, "x": "4月から9月の平均視聴率は5パーセント台です。"}, {"t": 458.76666666666665, "x": "裏には、科学忍者隊ガッチャマンがありました。"}, {"t": 462.03333333333336, "x": "勢いのあるNETの中継も、\nこの番組を上回りました。"}, {"t": 466.5, "x": "撮影に行ける土地も減っていきます。"}, {"t": 468.8666666666667, "x": "甲信越は1972年6月の放送が最後です。"}, {"t": 473.06666666666666, "x": "北海道は1973年5月でした。"}, {"t": 476.3666666666667, "x": "大阪府立体育館は8月です。"}, {"t": 478.8666666666667, "x": "東海地方の収録も、10月の放送で終わります。"}, {"t": 482.73333333333335, "x": "1973年10月6日、\n番組は土曜の午後2時に移りました。"}, {"t": 488.1333333333333, "x": "地元の放送局が、それぞれ広告を売る枠です。"}, {"t": 491.93333333333334, "x": "中部日本放送と朝日放送は、\n夜中の放送に回しました。"}, {"t": 496.56666666666666, "x": "10月27日の放送は、\n初めて日本シリーズの裏に回っています。"}, {"t": 501.65, "x": "撮影の場所も絞られました。"}, {"t": 503.7, "x": "11月から先は、\n東北と関東と中国と九州だけです。"}, {"t": 508.28333333333336, "x": "11月30日の後楽園ホールの\n大会を例に取ります。"}, {"t": 512.3666666666667, "x": "2週目が放送されたのは、\n翌年の1月5日でした。"}, {"t": 516.4333333333333, "x": "36日あとです。"}, {"t": 518.1333333333333, "x": "業界の中で、打ち切りのうわさが\n流れ始めたのはこのころです。"}, {"t": 522.6166666666667, "x": "番組を立ち上げた責任者も、\nすでに運動部を離れていました。"}, {"t": 527.0666666666667, "x": "ここから先は、日付の順に見ていきます。"}, {"t": 530.1166666666667, 15, "x": "ただし、これは月曜の特別枠の単発です。"}, {"t": 806.8666666666667, "x": "単発は3回で、定期の放送ではありません。"}, {"t": 810.4166666666666, "x": "定期の放送が戻ったのは\n9月23日の月曜日、夜8時でした。"}, {"t": 815.75, "x": "177日目です。"}, {"t": 817.55, "x": "再開の初回は、日大講堂からの生中継でした。"}, {"t": 821.5, "x": "TBSの第1回も日大講堂です。"}, {"t": 824.3166666666667, "x": "ただ、東京12チャンネルには\n全国の系列局がありません。"}, {"t": 828.65, "x": "TBSの時代のようには、\n全国に届きませんでした。"}, {"t": 832.5166666666667, "x": "番組の名前は国際プロレスアワーです。"}, {"t": 835.2666666666667, "x": "平均視聴率は7パーセントから\n8パーセントでした。"}, {"t": 838.7833333333333, "x": "のちの放映権料は、\n年間9千万円と語られています。"}, {"t": 843.05, "x": "TBSの側は、この番組で定期の\nプロレス中継から手を引きました。"}, {"t": 847.8833333333333, "x": "日本テレビとNETの中継は続いています。"}, {"t": 851.0833333333334, "x": "1局だけ先に降りた形です。"}, {"t": 853.25, "x": "1985年には、TBSが\nジャパンプロレスの定期中継を計画しました。"}, {"t": 859.2166666666667, "x": "しかし同じ年の12月22日の\n単発で終わっています。"}, {"t": 863.15, "x": "1980年には、視聴率が\n5パーセント台の回が増えました。"}, {"t": 868.0666666666667, "x": "10月、枠は月曜から土曜の夜8時へ移ります。"}, {"t": 872.2666666666667, "x": "裏には、8時だョ全員集合などの強い\n番組がありました。"}, {"t": 876.5333333333333, "x": "移ったあとの平均視聴率は、わずか\n2パーセントでした。"}, {"t": 880.55, "x": "東京12チャンネルの定期放送は、\n1981年3月28日まで続きます。"}, {"t": 887.0333333333333, "x": "そこから国際プロレスが止まるまで、\nあと134日しかありません。"}, {"t": 891.85, "x": "年間9千万円の放映権料が途絶えました。"}, {"t": 895.0833333333334, "x": "借金は2億5千万円に達していました。"}, {"t": 898.0333333333333, "x": "吉原は、テレビなんかなくてもいいと話しました。"}, {"t": 901.45, "x": "北海道の羅臼の大会が、最後の興行です。"}, {"t": 905.0833333333334, "x": "吉原功が55歳で亡くなったのは、\n1985年6月10日のことです。"}, {"t": 911.1, "x": "番組表に残る枠は6つ、放送は323回。"}, {"t": 915.6, "x": "27パーセントを超えた夜の盛岡から、\n最後の撮影の盛岡まで。"}, {"t": 920.55, "x": "そのあいだに枠は5回動きました。"}, {"t": 922.8833333333333, "x": "あの土曜の昼の30分を\n覚えている方は、ぜひコメント欄へ。"}, {"t": 927.4, "x": "次の話も、このチャンネルで続きます。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
