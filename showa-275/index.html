<script>
const D={"name": "馬場と松根光雄", "file": "275_編集用", "dur": 941.1333125, "segs": [], "subs": [{"t": 0.0, "x": "1981年12月13日の蔵前国技館で、\n全日本プロレスの最終戦の"}, {"t": 6.55, "x": "セコンドに付いたのは、3日前まで新日本の\n大会に出ていたスタン・ハンセンでした。"}, {"t": 11.833333333333334, "x": "場外でテリー・ファンクを倒した\nラリアットは、馬場の引き抜きが"}, {"t": 15.683333333333334, "x": "成功したことを見せつけました。"}, {"t": 17.583333333333332, "x": "ところが翌日の日付で、もう1つの\n交代が雑誌に残っています。"}, {"t": 22.3, "x": "社長の席に座ったのは馬場ではなく、\n日本テレビから来た役員の松根でした。"}, {"t": 27.616666666666667, "x": "記者が口にしたその日付は、\n1981年12月14日です。"}, {"t": 32.95, "x": "団体を作った馬場は、社長を離れました。"}, {"t": 36.166666666666664, "x": "移った先は会長です。"}, {"t": 37.93333333333333, "x": "ナンバーの記事は、この人事をこう書いています。"}, {"t": 41.233333333333334, "x": "じつは81年12月、馬場は全日本の\n社長の座から降ろされている。"}, {"t": 46.6, "x": "馬場は43歳でした。"}, {"t": 48.483333333333334, "x": "年が明けた1982年2月3日です。"}, {"t": 51.916666666666664, "x": "松根は雑誌の取材を受けます。"}, {"t": 54.016666666666666, "x": "話の中身は、馬場にリングを\n降りるよう勧めるものでした。"}, {"t": 58.03333333333333, "x": "その翌日に、馬場はハンセンとの\n初めての一騎打ちを控えていました。"}, {"t": 62.85, "x": "団体を作った馬場は、なぜ中継の局に\n社長の椅子を渡したのでしょうか？"}, {"t": 68.2, "x": "そして引退を勧められた馬場は、\nそのあとリングに残ったのでしょうか？"}, {"t": 72.93333333333334, "x": "今回は、全日本プロレスの社長の\n椅子をめぐる7年あまりを追います。"}, {"t": 77.8, "x": "雑誌と新聞に残った日付と\n数字をもとに辿っていきます。"}, {"t": 81.61666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 84.1, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 89.68333333333334, "x": "松根の名前が馬場の話に出てくるのは、\n1981年が最初ではありません。"}, {"t": 95.48333333333333, "x": "9年前の1972年です。"}, {"t": 98.3, "x": "この年の5月で、日本テレビは\n日本プロレスの中継を打ち切りました。"}, {"t": 102.98333333333333, "x": "馬場がNETの中継に出たことを、\n契約違反としたのです。"}, {"t": 107.41666666666667, "x": "発表の席に立ったのが、\n当時の運動部長の松根でした。"}, {"t": 111.53333333333333, "x": "批判の相手は日本プロレスの幹部です。"}, {"t": 114.18333333333334, "x": "もっと常識ある社会人かと思っていたが、\n子供みたいな感覚しか"}, {"t": 118.63333333333334, "x": "持ち合わせていないことがよくわかった。"}, {"t": 120.78333333333333, "x": "このあと、日本テレビは\n馬場の独立を後押しします。"}, {"t": 124.46666666666667, "x": "当時の社長の言葉が伝えられています。"}, {"t": 126.95, "x": "プロレス中継は初代社長の\n遺産だから続けなければいけない。"}, {"t": 130.68333333333334, "x": "そのためには\n馬場でなくてはいけない、という内容でした。"}, {"t": 134.5, "x": "旗揚げのお金の話も出ています。"}, {"t": 136.78333333333333, "x": "日本テレビが負担するという条件が、\n示されたとされています。"}, {"t": 141.16666666666666, "x": "1972年9月9日、\n全日本プロ・レスリング株式会社が生まれました。"}, {"t": 147.0, "x": "代表取締役社長は馬場正平です。"}, {"t": 149.91666666666666, "x": "中継の開始は1972年10月7日でした。"}, {"t": 153.8, "x": "枠は土曜の夜8時です。"}, {"t": 155.7, "x": "ここから9年あまり、\n馬場はエースであり社長でした。"}, {"t": 159.6, "x": "ただし、社長の仕事は楽ではありません。"}, {"t": 162.78333333333333, "x": "当時の団体の収入は2つです。"}, {"t": 165.11666666666667, "x": "興行の売り上げとテレビの放映権料でした。"}, {"t": 168.06666666666666, "x": "興行で儲からなければ、社長が苦しくなります。"}, {"t": 171.55, "x": "週刊ファイトの連載は、\n馬場の口癖を書き残しています。"}, {"t": 175.8, "x": "プロレスの興行なんか儲からないんだよ！\n同じ連載には、別の記述もあります。"}, {"t": 181.45, "x": "馬場の全日本も猪木の新日本も借金を\n抱えた時期があった、という内容です。"}, {"t": 187.18333333333334, "x": "相手は専属のテレビ局で、額は億単位でした。"}, {"t": 190.96666666666667, "x": "連載は全日本の興行が\n赤字だった主な原因も挙げています。"}, {"t": 195.13333333333333, "x": "チケットの販売など、営業の活動に\n馬場が力を入れなかったことです。"}, {"t": 200.16666666666666, "x": "これは連載の筆者の見方として紹介します。"}, {"t": 203.25, "x": "テレビの側でも、変化が起きていました。"}, {"t": 206.11666666666667, "x": "1979年4月7日、全日本の\n中継は土曜の夜8時を離れました。"}, {"t": 212.25, "x": "移った先は夕方5時30分です。"}, {"t": 214.96666666666667, "x": "全国の枠からローカルセールス枠への移動でした。"}, {"t": 218.13333333333333, "x": "この枠の話は別の回で扱いました。"}, {"t": 220.78333333333333, "x": "今回は移動の事実だけを押さえておきます。"}, {"t": 223.6, "x": "そして1981年、\n新日本との争いが激しくなりました。"}, {"t": 228.75, "x": "4月、新日本に\n初代タイガーマスクが登場しました。"}, {"t": 232.75, "x": "人気は爆発します。"}, {"t": 234.33333333333334, "x": "5月、新日本は全日本の\nアブドーラ・ザ・ブッチャーを引き抜きました。"}, {"t": 238.83333333333334, "x": "ナンバーの記事は、当時の\n全日本を落ち目と書いています。"}, {"t": 242.71666666666667, "x": "馬場も、黙ってはいません。"}, {"t": 244.96666666666667, "x": "翌月、テリー・ファンクの\n仲介でハンセンと会いました。"}, {"t": 248.71666666666667, "x": "移籍はそこで決まります。"}, {"t": 250.35, "x": "馬場がハンセンにかけた言葉も残っています。"}, {"t": 253.08333333333334, "x": "キミに全日本を変えてほしい。"}, {"t": 255.1, "x": "7月にはタイガー・ジェット・シンも\n口説き落としました。"}, {"t": 258.21666666666664, "x": "シンは新日本のトップヒールでした。"}, {"t": 260.6666666666667, "x": "その結末が冒頭の12月13日の蔵前です。"}, {"t": 264.3666666666667, "x": "引き抜きでは、馬場が勝ちました。"}, {"t": 266.76666666666665, "x": "しかし、社長の椅子は別の話でした。"}, {"t": 269.9166666666667, "x": "人事の中身は、ナンバーの記事に書かれています。"}, {"t": 273.26666666666665, "x": "親会社の日本テレビが、\n役員の松根を出向させて社長にしました。"}, {"t": 278.3, "x": "馬場は会長に棚上げされた、という書き方です。"}, {"t": 281.85, "x": "目的は経営の立て直しでした。"}, {"t": 284.06666666666666, "x": "別の資料は、視聴率の低迷で経営が\n一時悪化したと理由を挙げています。"}, {"t": 289.3666666666667, "x": "ここで日付の話をしておきます。"}, {"t": 291.6, "x": "この人事の日付は、資料によって割れています。"}, {"t": 295.01666666666665, "x": "当時の雑誌の記事では\n1981年12月14日です。"}, {"t": 299.56666666666666, "x": "インターネットの百科事典では12月21日です。"}, {"t": 303.21666666666664, "x": "同じ項目の役員の表は、松根の\n就任を1982年1月としています。"}, {"t": 309.43333333333334, "x": "ナンバーと当時の雑誌が一致するのは\n1981年12月という月です。"}, {"t": 314.8333333333333, "x": "どの日が正式な就任日なのかは、\n断定できませんでした。"}, {"t": 318.96666666666664, "x": "日本テレビの持ち株の割合も、\n1981年の数字は確認できません。"}, {"t": 324.75, "x": "ナンバーは親会社と書いています。"}, {"t": 326.95, "x": "2000年の中継終了のときの記録はあります。"}, {"t": 330.06666666666666, "x": "数字は15パーセントです。"}, {"t": 332.06666666666666, "x": "馬場の言葉も探しました。"}, {"t": 333.81666666666666, "x": "この人事を告げられたときの言葉は、\n今回見つかりませんでした。"}, {"t": 338.0833333333333, "x": "はっきり残っているのは、\n新社長の言葉の方です。"}, {"t": 341.73333333333335, "x": "1982年2月3日の取材は、\n専門誌に載りました。"}, {"t": 346.56666666666666, "x": "月刊プロレスの1982年3月号です。"}, {"t": 350.23333333333335, "x": "その記事を英語に\n訳した書き起こしが今も読めます。"}, {"t": 353.4, "x": "日本語の原文は今回確認できていません。"}, {"t": 356.46666666666664, "x": "そこで中身を要約して紹介します。"}, {"t": 359.01666666666665, "x": "松根はまず、馬場の話から始めました。"}, {"t": 362.26666666666665, "x": "馬場は能力でも人気でも、すでに盛りを過ぎた。"}, {"t": 365.7, "x": "今の馬場の体制は限界にきている。"}, {"t": 368.0833333333333, "x": "そして馬場には、\nレスラーをやめることを勧めました。"}, {"t": 371.46666666666664, "x": "外国人選手の呼び寄せや若手の育成に\n専念してほしい、という内容です。"}, {"t": 376.96666666666664, "x": "代わりに名前を挙げたのが\nジャンボ鶴田と天龍源一郎でした。"}, {"t": 380.8333333333333, "x": "エースを替える時が来た、というのが\n松根の説明です。"}, {"t": 384.75, "x": "松根の話は会社の作り替えにも及びます。"}, {"t": 387.73333333333335, "x": "外国人選手は多すぎるので減らす。"}, {"t": 390.23333333333335, "x": "日本人選手は試合ごとの払いをやめ、\n年間契約の月給にしていきたい。"}, {"t": 395.6333333333333, "x": "どれも馬場が9年間やってきた形を\n変える話でした。"}, {"t": 399.23333333333335, "x": "数字も語っています。"}, {"t": 400.75, "x": "土曜の枠の視聴率は、1月の最後の\n週で11点4パーセントでした。"}, {"t": 406.1666666666667, "x": "放映権料は1週で五百五十万円です。"}, {"t": 409.23333333333335, "x": "1年では約2億9千万円と紹介されています。"}, {"t": 412.8666666666667, "x": "松根はこの枠を、局にとって営業の\n面では悪くないと話しました。"}, {"t": 417.55, "x": "その上で目標を述べています。"}, {"t": 419.6, "x": "次の10月の番組改編で、\nゴールデンタイムに戻す。"}, {"t": 423.6333333333333, "x": "興行の話も出ました。"}, {"t": 425.31666666666666, "x": "正月の新春ジャイアント・シリーズには、\n1月15日からハンセンが加わりました。"}, {"t": 431.01666666666665, "x": "シリーズの後半は客が増えました。"}, {"t": 433.43333333333334, "x": "興行の収入も伸びています。"}, {"t": 435.48333333333335, "x": "それでも経費は重いままでした。"}, {"t": 437.6, "x": "シリーズ全体では利益が出ていません。"}, {"t": 440.15, "x": "赤字が縮んだだけだった、というのが\n松根の説明です。"}, {"t": 444.23333333333335, "x": "では引退を勧められた馬場は、\nどう答えていたのか。"}, {"t": 447.8666666666667, "x": "記者は、松根に馬場の言葉を\n伝えて質問しています。"}, {"t": 451.68333333333334, "x": "エースだった者が完全に消えるのは寂しい。"}, {"t": 454.46666666666664, "x": "馬場はそう話していた、という質問でした。"}, {"t": 457.68333333333334, "x": "記事の書き手は、馬場の別の言葉も記しています。"}, {"t": 461.1166666666667, "x": "まだやれる、引退はしない。"}, {"t": 463.3666666666667, "x": "社長と会長の考えは、ここで分かれていました。"}, {"t": 466.95, "x": "そして取材の翌日です。"}, {"t": 468.73333333333335, "x": "1982年2月4日、東京体育館。"}, {"t": 472.96666666666664, "x": "馬場の持つPWF世界ヘビー級王座に\nハンセンが挑みました。"}, {"t": 477.2, "x": "これが2人の初めての一騎打ちです。"}, {"t": 479.56666666666666, "x": "馬場は44歳、ハンセンは32歳でした。"}, {"t": 483.3, "x": "声はファンや関係者から上がりました。"}, {"t": 485.71666666666664, "x": "ナンバーの記事が伝えています。"}, {"t": 487.68333333333334, "x": "馬場は半殺しにされるんじゃないか？"}, {"t": 490.0833333333333, "x": "不安は局の中にもありました。"}, {"t": 492.2, "x": "実況の倉持アナウンサーは、\nこの時期の馬場の試合でこう話しています。"}, {"t": 497.06666666666666, "x": "動きが限界に近いですね。"}, {"t": 499.03333333333336, "x": "倉持は番組のプロデューサーに呼び出されました。"}, {"t": 502.06666666666666, "x": "叱られたと伝えられています。"}, {"t": 503.96666666666664, "x": "そのプロデューサーも、馬場の\n衰えは認めていたと記事にあります。"}, {"t": 50 const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
