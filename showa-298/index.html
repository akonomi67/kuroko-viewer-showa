<script>
const D={"name": "BI砲のインタータッグ奪取", "file": "298_編集用", "dur": 929.96665625, "segs": [], "subs": [{"t": 0.0, "x": "1967年10月31日、\n大阪府立体育会館です。"}, {"t": 5.65, "x": "この夜、日本プロレスのタッグの\n王座をかけた試合が組まれました。"}, {"t": 10.0, "x": "インターナショナル・タッグ王座です。"}, {"t": 12.133333333333333, "x": "ベルトを持っていたのは、アメリカから来た\nビル・ワットとターザン・タイラーの組でした。"}, {"t": 17.066666666666666, "x": "挑んだのはジャイアント馬場と\nアントニオ猪木です。"}, {"t": 19.95, "x": "2人の頭文字から、のちに\nBI砲と呼ばれるコンビでした。"}, {"t": 24.066666666666666, "x": "試合は3本勝負です。"}, {"t": 25.966666666666665, "x": "1本目から3本目まで、勝負はもつれました。"}, {"t": 29.5, "x": "勝ったのは馬場と猪木です。"}, {"t": 31.233333333333334, "x": "このベルトは、25日前まで\n馬場の腰にありました。"}, {"t": 34.95, "x": "福島の夜に外国人の組へ渡ったベルトです。"}, {"t": 38.166666666666664, "x": "それを馬場は、猪木と組んで取り返したのです。"}, {"t": 41.45, "x": "25日前の福島では、\n何が起きていたのでしょうか？"}, {"t": 45.55, "x": "猪木は、なぜこの年に馬場の\n隣に立っていたのでしょうか？"}, {"t": 49.61666666666667, "x": "今回は1967年10月31日の大阪を開きます。"}, {"t": 54.53333333333333, "x": "始まりは、その前の年の秋です。"}, {"t": 57.233333333333334, "x": "日付と結果は、ジャイアント馬場の\n公式年表と照らし合わせます。"}, {"t": 61.85, "x": "当時を伝える新聞の記事とも突き合わせます。"}, {"t": 64.83333333333333, "x": "資料が1つしか無い数字は、\n出どころを言ってから進みます。"}, {"t": 69.01666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 71.51666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 77.1, "x": "まず、この試合の1年前を見ておきます。"}, {"t": 80.46666666666667, "x": "1966年の秋、猪木は\n日本プロレスにいませんでした。"}, {"t": 85.23333333333333, "x": "新しい団体に移っていたのです。"}, {"t": 87.58333333333333, "x": "誘ったのは豊登でした。"}, {"t": 89.48333333333333, "x": "団体の名前は東京プロレスです。"}, {"t": 91.95, "x": "1966年10月12日、\n蔵前国技館で旗揚げの大会が開かれました。"}, {"t": 98.33333333333333, "x": "猪木の相手はジョニー・バレンタインです。"}, {"t": 100.66666666666667, "x": "タイトルのかからない試合でした。"}, {"t": 102.65, "x": "試合は31分56秒で終わります。"}, {"t": 105.81666666666666, "x": "猪木のリングアウト勝ちでした。"}, {"t": 107.68333333333334, "x": "この夜の猪木は、水平の\n空手チョップを打ち込みました。"}, {"t": 111.61666666666666, "x": "のちに得意にする、弓を引くような形の\nナックルパートも見せています。"}, {"t": 116.21666666666667, "x": "猪木はのちに、このときのことを\nこう振り返っています。"}, {"t": 119.86666666666666, "x": "「旗揚げさせないと\n引退させられちゃうんだから」。"}, {"t": 122.61666666666666, "x": "背水の陣だった、と東京スポーツの\n連載は書いています。"}, {"t": 126.86666666666666, "x": "同じころ、日本プロレスのエースは馬場でした。"}, {"t": 129.95, "x": "1965年11月24日です。"}, {"t": 133.35, "x": "馬場はインターナショナル王座の\nチャンピオンになっています。"}, {"t": 136.55, "x": "相手はディック・ザ・ブルーザーでした。"}, {"t": 138.61666666666667, "x": "1966年5月13日は東京体育館です。"}, {"t": 142.98333333333332, "x": "馬場はウイルバー・スナイダーを下しました。"}, {"t": 145.4, "x": "そしてワールドリーグ戦に初めて優勝します。"}, {"t": 148.36666666666667, "x": "公式年表によれば、馬場はこのあと\n通算6回この大会に優勝しています。"}, {"t": 153.91666666666666, "x": "そして1966年11月5日です。"}, {"t": 157.38333333333333, "x": "馬場は吉村道明と組んで、\nインターナショナル・タッグ王座を取りました。"}, {"t": 162.18333333333334, "x": "公式年表は、この日を\n「インター二冠王になる」と書いています。"}, {"t": 167.0, "x": "シングルの王座とタッグの王座の2つです。"}, {"t": 169.75, "x": "猪木が東京プロレスの旗揚げをして、\n1か月ほどあとのことでした。"}, {"t": 174.35, "x": "同じ秋に、2人はまったく別の\n場所で戦っていたのです。"}, {"t": 178.28333333333333, "x": "東京プロレスは長く続きませんでした。"}, {"t": 180.88333333333333, "x": "旗揚げから1年もたたない\nうちに、行き詰まります。"}, {"t": 184.36666666666667, "x": "1967年4月6日です。"}, {"t": 187.18333333333334, "x": "日本プロレスのコミッショナーが発表をしました。"}, {"t": 190.08333333333334, "x": "猪木が日本プロレスに戻る、という発表です。"}, {"t": 193.6, "x": "東京プロレスの選手の多くは、\n別の団体へ移っていきました。"}, {"t": 198.01666666666668, "x": "猪木は、東京プロレスに移る前の\n場所に帰ってきたのです。"}, {"t": 202.16666666666666, "x": "戻ってきた猪木は、\nすぐに大きな試合に組まれます。"}, {"t": 205.81666666666666, "x": "1967年5月12日、岐阜です。"}, {"t": 209.8, "x": "馬場と猪木が、初めてタッグを組みました。"}, {"t": 212.81666666666666, "x": "相手はワルドー・フォン・エリックと\nマイク・デビアスの組です。"}, {"t": 215.95, "x": "東京スポーツは、この岐阜の\n夜をBI砲の結成としています。"}, {"t": 220.4, "x": "2週間後の5月26日は札幌です。"}, {"t": 223.45, "x": "この夜、猪木は別の王座に挑みました。"}, {"t": 226.48333333333332, "x": "アジアタッグ王座です。"}, {"t": 228.11666666666667, "x": "王者がいなくなって、空いていたベルトでした。"}, {"t": 231.25, "x": "猪木のパートナーは吉村です。"}, {"t": 233.33333333333334, "x": "相手はフォン・エリックと\nアイク・アーキンスの組でした。"}, {"t": 236.31666666666666, "x": "試合の記録を集めた資料によると、\n1本目は外国人の組の反則でした。"}, {"t": 241.76666666666668, "x": "2本目は、吉村がアーキンスの\n攻めを切り返して取っています。"}, {"t": 246.16666666666666, "x": "吉村と猪木の組の勝ちです。"}, {"t": 248.25, "x": "戻ってから2か月もたたないうちに、\n猪木はタッグの王者になりました。"}, {"t": 252.8, "x": "このころの日本プロレスには、\nタッグの王座が2つありました。"}, {"t": 256.96666666666664, "x": "一番上とされたのが\nインターナショナル・タッグです。"}, {"t": 260.03333333333336, "x": "馬場と吉村が持っていました。"}, {"t": 261.95, "x": "もう1つがアジアタッグです。"}, {"t": 263.78333333333336, "x": "吉村と猪木が持っていました。"}, {"t": 265.8, "x": "吉村は、2つの王座の両方に名前がありました。"}, {"t": 269.53333333333336, "x": "馬場の隣にも猪木の隣にも、吉村がいたのです。"}, {"t": 273.3, "x": "夏には、馬場のシングルの\n王座の試合もありました。"}, {"t": 276.8666666666667, "x": "1967年8月14日です。"}, {"t": 280.05, "x": "馬場はインターナショナル王座を\n守る試合に出ます。"}, {"t": 283.1, "x": "相手はジン・キニスキーでした。"}, {"t": 284.96666666666664, "x": "結果は引き分けでした。"}, {"t": 286.5, "x": "王座は馬場に残りました。"}, {"t": 288.23333333333335, "x": "そして秋が来ます。"}, {"t": 289.5833333333333, "x": "1967年10月6日、福島です。"}, {"t": 293.51666666666665, "x": "馬場と吉村の組が、王座を守る試合に出ました。"}, {"t": 297.1666666666667, "x": "インターナショナル・タッグ王座です。"}, {"t": 299.3, "x": "相手がビル・ワットと\nターザン・タイラーの組です。"}, {"t": 302.06666666666666, "x": "勝ったのはワットとタイラーでした。"}, {"t": 304.06666666666666, "x": "1966年11月5日から約11か月です。"}, {"t": 308.3666666666667, "x": "馬場と吉村が持っていたベルトでした。"}, {"t": 310.73333333333335, "x": "それが、アメリカから来た2人の手に移りました。"}, {"t": 314.1666666666667, "x": "ここで日本プロレスは、馬場の\n新しいパートナーに猪木を立てます。"}, {"t": 318.6333333333333, "x": "吉村ではなく、猪木です。"}, {"t": 321.0, "x": "試合の記録を集めた資料は、\nこのときを危機と書いています。"}, {"t": 325.1166666666667, "x": "ベルトが海の向こうへ出ていく危機です。"}, {"t": 327.48333333333335, "x": "その危機に猪木が起用された、という書き方です。"}, {"t": 330.98333333333335, "x": "この資料によると、馬場と猪木は\nここまで18回組んでいました。"}, {"t": 335.45, "x": "そして一度も負けていませんでした。"}, {"t": 337.56666666666666, "x": "大阪の夜は、\n2人にとって19回目のタッグでした。"}, {"t": 341.46666666666664, "x": "1967年10月31日、\n大阪府立体育会館です。"}, {"t": 347.1166666666667, "x": "試合は3本勝負で行われました。"}, {"t": 349.73333333333335, "x": "ここからの経過は、\n試合の記録を集めた資料によります。"}, {"t": 353.7, "x": "1本目は14分8秒です。"}, {"t": 356.0833333333333, "x": "外国人の組が反則を取られました。"}, {"t": 358.65, "x": "馬場と猪木の組が、1本を先に取ります。"}, {"t": 361.8833333333333, "x": "2本目は3分34秒でした。"}, {"t": 364.4, "x": "タイラーが馬場を押さえ込みます。"}, {"t": D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
