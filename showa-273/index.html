<script>
const D={"name": "金曜8時のプロレス中継", "file": "273_編集用", "dur": 905.5, "segs": [], "subs": [{"t": 0.0, "x": "1972年5月12日、東京体育館。"}, {"t": 4.416666666666667, "x": "金曜の夜8時を回ると、日本テレビの\n生中継がこの会場をつなぎます。"}, {"t": 9.65, "x": "画面に映るのは34歳のジャイアント馬場です。"}, {"t": 12.933333333333334, "x": "試合はワールド大リーグ戦の優勝決定戦でした。"}, {"t": 16.433333333333334, "x": "3年連続6度目の優勝を、\n馬場はこの夜に決めます。"}, {"t": 20.666666666666668, "x": "けれども翌週の同じ時間に、\n試合の中継はもうありません。"}, {"t": 25.016666666666666, "x": "日本テレビの生中継は、\nこの1戦が最後になったからです。"}, {"t": 29.283333333333335, "x": "消えたものは、18年続いた中継そのものでした。"}, {"t": 33.016666666666666, "x": "番組の名は『三菱ダイヤモンド・アワー』です。"}, {"t": 35.78333333333333, "x": "金曜夜8時のこの枠で、\nプロレスは13年8か月流れました。"}, {"t": 40.6, "x": "力道山の時代から続いた中継です。"}, {"t": 43.21666666666667, "x": "それが、この夜で画面から消えます。"}, {"t": 46.083333333333336, "x": "エースは現役です。"}, {"t": 47.53333333333333, "x": "団体もまだありました。"}, {"t": 49.11666666666667, "x": "なぜ金曜8時のプロレスは消えたのでしょうか？"}, {"t": 52.25, "x": "そして、この時間を買っていた会社は\nどこへ行ったのでしょうか？"}, {"t": 56.43333333333333, "x": "今回は、1人のレスラーの話ではありません。"}, {"t": 59.733333333333334, "x": "1つのテレビの枠の13年8か月を追います。"}, {"t": 63.05, "x": "始まった日から、切られた日までです。"}, {"t": 65.68333333333334, "x": "ディズニーと分け合った時代もありました。"}, {"t": 67.98333333333333, "x": "新聞と雑誌に残った日付と\n数字をもとに辿っていきます。"}, {"t": 71.86666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 74.36666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 79.95, "x": "日本テレビのプロレス中継は、\n1954年2月19日に始まりました。"}, {"t": 85.6, "x": "力道山がシャープ兄弟と戦った夜です。"}, {"t": 88.4, "x": "定期の番組ができるのは、そのあとでした。"}, {"t": 91.51666666666667, "x": "1957年6月15日に\n週1回の番組が始まります。"}, {"t": 96.36666666666666, "x": "名前は『プロレス・ファイトメン・アワー』です。"}, {"t": 98.71666666666667, "x": "放送は土曜の夕方でした。"}, {"t": 100.8, "x": "若手を育てることが目的の番組です。"}, {"t": 103.4, "x": "この番組に、7月から付いた\nスポンサーがありました。"}, {"t": 107.23333333333333, "x": "それが三菱電機です。"}, {"t": 108.96666666666667, "x": "同じ年の10月7日には、\n後楽園球場で大きな試合がありました。"}, {"t": 114.01666666666667, "x": "世界王者のルー・テーズに力道山が挑んでいます。"}, {"t": 117.16666666666667, "x": "特設リングに集まった客は\n3万7千人を超えました。"}, {"t": 121.05, "x": "東京の視聴率は87%と記録されています。"}, {"t": 124.83333333333333, "x": "翌1958年の8月29日は金曜日でした。"}, {"t": 129.06666666666666, "x": "この日、日本テレビは\n金曜夜8時に新しい枠を作ります。"}, {"t": 133.68333333333334, "x": "それが『三菱ダイヤモンド・アワー』です。"}, {"t": 136.05, "x": "提供は三菱電機の1社だけでした。"}, {"t": 138.61666666666667, "x": "時間は夜8時から9時までの60分です。"}, {"t": 141.68333333333334, "x": "ただ、この枠の最初の放送は\nプロレスではありません。"}, {"t": 145.43333333333334, "x": "流れたのはアメリカの番組\n『ディズニーランド』でした。"}, {"t": 148.38333333333333, "x": "プロレスの初回は翌週の9月5日です。"}, {"t": 151.13333333333333, "x": "蔵前国技館の試合を、\n4つのテレビ局で生中継しました。"}, {"t": 155.75, "x": "1959年4月17日には、\n初めてカラーで中継しています。"}, {"t": 161.13333333333333, "x": "ここから、金曜8時に変わった決まりができます。"}, {"t": 164.6, "x": "ある週はプロレスです。"}, {"t": 166.15, "x": "次の週はディズニーです。"}, {"t": 167.93333333333334, "x": "1週ごとに、中身が入れ替わります。"}, {"t": 170.68333333333334, "x": "同じ三菱電機の提供で、この2つが並びました。"}, {"t": 174.5, "x": "隔週の形は、およそ9年半続きます。"}, {"t": 177.86666666666667, "x": "ディズニーの回も、弱い番組ではありません。"}, {"t": 181.05, "x": "1963年1月11日の放送では、\n視聴率が43%を超えました。"}, {"t": 187.86666666666667, "x": "これも関東地区の、ビデオリサーチの調べでした。"}, {"t": 191.25, "x": "そのあいだに力道山の周りも動きました。"}, {"t": 193.95, "x": "1961年7月30日、渋谷に\nリキ・スポーツ・パレスが完成します。"}, {"t": 200.03333333333333, "x": "プロレスの常設の会場として建てられた建物です。"}, {"t": 203.26666666666668, "x": "その年の8月25日からは、\n別の動きも始まりました。"}, {"t": 207.68333333333334, "x": "金曜の夜遅くに、もう1つの\nプロレスの枠ができたのです。"}, {"t": 211.86666666666667, "x": "中身は主にこの会場の試合の録画でした。"}, {"t": 214.8, "x": "夜8時がディズニーの週でも、\nプロレスが流れる形になりました。"}, {"t": 219.21666666666667, "x": "そして1963年5月24日の金曜日です。"}, {"t": 223.31666666666666, "x": "東京体育館で、力道山と\nザ・デストロイヤーが戦いました。"}, {"t": 227.65, "x": "平均視聴率は64%でした。"}, {"t": 230.6, "x": "ビデオリサーチの調べです。"}, {"t": 232.36666666666667, "x": "2019年のデイリースポーツは、\nこれを歴代4位と書きました。"}, {"t": 236.86666666666667, "x": "金曜8時の枠で流れた数字でした。"}, {"t": 239.48333333333332, "x": "この年の10月には、\n枠の長さが4分だけ縮みます。"}, {"t": 243.6, "x": "夜8時56分から、ニュースが入ったためです。"}, {"t": 247.36666666666667, "x": "番組は、ここから56分になりました。"}, {"t": 250.51666666666668, "x": "ところが、あの64%の試合の7か月後です。"}, {"t": 254.7, "x": "1963年12月15日、\n力道山が亡くなりました。"}, {"t": 259.7, "x": "39歳でした。"}, {"t": 261.28333333333336, "x": "番組の主役が突然いなくなります。"}, {"t": 263.78333333333336, "x": "日本テレビは中継の打ち切りを検討していました。"}, {"t": 267.03333333333336, "x": "2日後の12月17日、\n麹町の本社に4人の男が向かいます。"}, {"t": 272.21666666666664, "x": "豊登、遠藤幸吉、吉村道明、芳の里です。"}, {"t": 277.5833333333333, "x": "4人は放送の継続をじかに頼みました。"}, {"t": 280.43333333333334, "x": "この写真は、同じ12月に4人が\n結束を誓ったときのものです。"}, {"t": 285.2, "x": "同じ日に4社の話し合いが開かれています。"}, {"t": 288.01666666666665, "x": "日本テレビ、日本プロレス、\n三菱電機、そして博報堂です。"}, {"t": 293.46666666666664, "x": "博報堂は広告の会社です。"}, {"t": 295.6666666666667, "x": "ここで中継の継続が決まりました。"}, {"t": 298.01666666666665, "x": "放映権料は1回百五十万円のままです。"}, {"t": 301.1666666666667, "x": "ただし、日本テレビは条件を3つ出しました。"}, {"t": 304.6666666666667, "x": "1つ目は新しいエースの豊登に\n世界のベルトを巻かせることです。"}, {"t": 308.93333333333334, "x": "2つ目は豊登が分かりやすい必殺技を\n編み出すことでした。"}, {"t": 313.01666666666665, "x": "そして3つ目です。"}, {"t": 314.3833333333333, "x": "1か月の平均視聴率が\n20%を切れば打ち切りです。"}, {"t": 318.5, "x": "しかも、即座にでした。"}, {"t": 320.5, "x": "豊登をエースにした興行は、\n収益が落ちていきました。"}, {"t": 324.51666666666665, "x": "そこで幹部たちは馬場を呼び戻します。"}, {"t": 326.98333333333335, "x": "馬場はアメリカで修行している最中でした。"}, {"t": 329.76666666666665, "x": "豊登と馬場の2人を並べて立てる形です。"}, {"t": 332.6666666666667, "x": "これで人気と視聴率は持ち直しました。"}, {"t": 335.23333333333335, "x": "力道山の時代を\n上回る数字になったとされています。"}, {"t": 338.71666666666664, "x": "中継の席にも新しい顔が加わりました。"}, {"t": 341.6666666666667, "x": "1964年に、23歳のアナウンサーが\nプロレスの担当になります。"}, {"t": 347.21666666666664, "x": "徳光和夫です。"}, {"t": 348.51666666666665, "x": "担当は金曜8時と、のちの\n土曜8時で8年間に及びました。"}, {"t": 353.3, "x": "本人はこの配属に、\n正直がっかりしたと語っています。"}, {"t": 357.4, "x": "この時代の金曜8時には、\n外せないものが1つあります。"}, {"t": 361.45, "x": "掃除機です。"}, {"t": 362.48333333333335, "x": "ここからは少し、宣伝の話です。"}, {"t": 365.4, "x": "三菱電機には\n『風神』という赤い掃除機がありました。"}, {"t": 368.85, "x": "メインの試合の前に、リングの\n上へこの掃除機が持ち込まれます。"}, {"t": 373.15, "x": "マットを掃除する場面がそのまま放送されました。"}, {"t": 376.31666666666666, "x": "いまの言葉でいえば、\n生放送のコマーシャルです。"}, {"t": 379.68333333333334, "x": "アナウンサーが掃除機の名前を\n読み上げたと伝えられています。"}, {"t": 383.3, "x": "掃除をしていた人については、\n資料が割れています。"}, {"t": 386.93333333333334, "x": "若手のレスラーという記述も、\n広告会社の人という書き込みもあります。"}, {"t": 391.6166666666667, "x": "三菱電機の家電の公式の発信にも、\nこの話が残っています。"}, {"t": 396.3666666666667, "x": "昭和40年代の全盛の日本プロレスの中継です。"}, {"t": 400.15, "x": "そこでリングを掃除していたのが\n赤い風神だ、という紹介でした。"}, {"t": 404.6166666666667, "x": "1967年12月6日の東京体育館で\n撮られた生コマーシャルの映像もあります。"}, {"t": 410.9, "x": "営業の現場も、これをまねしました。"}, {"t": 413.7, "x": "群馬県の太田市に猪木の一行が\n興行に来たときのことです。"}, {"t": 417.56666666666666, "x": "風神の営業を担当していた人が、\nその日を書き残しています。"}, {"t": 422.0, "x": "仲間と一緒に、試合の合間に\nリングを掃いて宣伝したそうです。"}, {"t": 426.45, "x": "それは、テレビの中継と同じやり方でした。"}, {"t": 429.76666666666665, "x": "2009年2月26日の読売新聞の朝刊も、\n1面のコラムで風神を取り上げています。"}, {"t": 436.51666666666665, "x": "同じ文章には、別の話も書かれています。"}, {"t": 439.8666666666667, "x": "店に来る客の話です。"}, {"t": 441.65, "x": "「松下の風神を下さい」と\n言う人までいたそうです。"}, {"t": 444.8333333333333, "x": "よその会社の名前と混ざるほど、\n掃除機の名前が広まっていました。"}, {"t": 449.28333333333336, "x": "その枠に、1968年の1月、\nライバルが現れます。"}, {"t": 454.6666666666667, "x": "TBSが国際プロレスの中継を始めたのです。"}, {"t": 458.03333333333336, "x": "TBSの番組の視聴率は、\nこの年と翌年は20%台でした。"}, {"t": 463.25, "x": "1月19日と26日の放送で、\n金曜の数字がTBSの番組を下回りました。"}, {"t": 469.73333333333335, "x": "日本テレビは緊急の会議を開きます。"}, {"t": 472.4166666666667, "x": "出た答えは、ディズニーを\n金曜8時から外すことでした。"}, {"t": 476.3833333333333, "x": "隔週の形は2月16日で終わります。"}, {"t": 479.3333333333333, "x": "そして2月23日から、\n金曜8時は毎週プロレスになりました。"}, {"t": 484.25, "x": "ディズニーとの同居が、\n9年半で解消されたわけです。"}, {"t": 488.2, "x": "ディズニーはこの年の4月から、\n日曜の夜7時に移りました。"}, {"t": 492.45, "x": "三菱電機はその提供からも、\n1969年4月までに外れています。"}, {"t": 498.2, "x": "この時期の視聴率は、\n常に25%から30%でした。"}, {"t": 503.1333333333333, "x": "雑誌のNumberは、そう書いています。"}, {"t": 505.81666666666666, "x": "馬場と猪木が組むBI砲の人気の時代でした。"}, {"t": 508.8333333333333, "x": "第2次プロレスブームと呼ばれています。"}, {"t": 511.2, "x": "しかし13年8か月のうち、\n毎週プロレスだったのは4年あまりです。"}, {"t": 516.3666666666667, "x": "しかも、その途中で枠の足元が崩れ始めます。"}, {"t": 520.0166666666667, "x": "1969年、NETテレビが\n中継への参入を望みました。"}, {"t": 525.5, "x": "現在 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
