<script>
const D={"name": "長与千種の引退", "file": "300_編集用", "dur": 905.01665625, "segs": [], "subs": [{"t": 0.0, "x": "1989年5月6日、横浜アリーナです。"}, {"t": 4.316666666666666, "x": "この日、全日本女子プロレスの\n大会が開かれました。"}, {"t": 8.05, "x": "大会の名前は\n「レッスル・マリンピアード89」です。"}, {"t": 11.966666666666667, "x": "会場の真ん中には、リングが2つ並んでいました。"}, {"t": 15.416666666666666, "x": "プロレス界で初めての2面リングでした。"}, {"t": 17.95, "x": "当時を見た記者は、そう書いています。"}, {"t": 20.583333333333332, "x": "リングの上には大きな映像の画面もありました。"}, {"t": 23.666666666666668, "x": "この大会は、1人の選手のための大会でした。"}, {"t": 27.166666666666668, "x": "長与千種、24歳です。"}, {"t": 29.85, "x": "ライオネス飛鳥と組んだ\nクラッシュ・ギャルズの片割れでした。"}, {"t": 33.1, "x": "この日を最後に、長与はリングを降ります。"}, {"t": 36.166666666666664, "x": "デビューから8年9か月がたっていました。"}, {"t": 38.86666666666667, "x": "なぜ長与は、24歳で引退を決めたのでしょうか？"}, {"t": 42.766666666666666, "x": "相方の飛鳥は、そのとき何を頼んだのでしょうか？"}, {"t": 46.53333333333333, "x": "今回は1989年5月6日の横浜を開きます。"}, {"t": 50.916666666666664, "x": "日付は平成の元年です。"}, {"t": 52.96666666666667, "x": "けれども、始まりは昭和55年の夏です。"}, {"t": 56.3, "x": "日付と出来事は、記事に照らし合わせます。"}, {"t": 59.333333333333336, "x": "東京スポーツと Number の記事です。"}, {"t": 62.8, "x": "本人たちが語った言葉も、\n記事から引いていきます。"}, {"t": 66.45, "x": "資料が1つしか無い数字は、\n出どころを言ってから進みます。"}, {"t": 70.65, "x": "最後までご覧いただければ幸いです。"}, {"t": 73.13333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 78.71666666666667, "x": "まず、長与千種という人を見ておきます。"}, {"t": 82.08333333333333, "x": "1964年12月8日、\n長崎県の大村市で生まれました。"}, {"t": 87.36666666666666, "x": "中学を卒業すると、すぐに\n全日本女子プロレスに入ります。"}, {"t": 91.78333333333333, "x": "デビューは1980年8月8日でした。"}, {"t": 95.15, "x": "会場は田園コロシアムです。"}, {"t": 97.21666666666667, "x": "相手は大森ゆかりでした。"}, {"t": 99.03333333333333, "x": "同じ1980年に、もう1人の\n選手がデビューしています。"}, {"t": 103.68333333333334, "x": "1963年7月28日に埼玉県で\n生まれたライオネス飛鳥です。"}, {"t": 109.16666666666667, "x": "そしてダンプ松本も、同じ年の入門でした。"}, {"t": 112.6, "x": "3人は昭和55年組と呼ばれる同期です。"}, {"t": 115.85, "x": "デビューしたあとの長与は、\n目立つ選手ではありませんでした。"}, {"t": 119.73333333333333, "x": "東京スポーツの名鑑は、こう書いています。"}, {"t": 122.91666666666667, "x": "会社からは\n「これといった特徴がない」と見られていた。"}, {"t": 126.46666666666667, "x": "試合が組まれない日も多かった。"}, {"t": 128.56666666666666, "x": "のちに日本中を沸かせる選手の、最初の数年です。"}, {"t": 132.46666666666667, "x": "女子プロレスには、その前にも\n大きな人気の時代がありました。"}, {"t": 136.55, "x": "ジャッキー佐藤とマキ上田の\nビューティ・ペアです。"}, {"t": 139.33333333333334, "x": "2人のコンビが終わったのは\n1979年2月27日でした。"}, {"t": 144.16666666666666, "x": "場所は日本武道館です。"}, {"t": 146.08333333333334, "x": "引退をかけて2人がぶつかる試合でした。"}, {"t": 148.76666666666668, "x": "長与と飛鳥がデビューしたのは、\nその1年半ほどあとです。"}, {"t": 152.86666666666667, "x": "大きなコンビが去ったあとのリングに、\n2人は入ってきたのです。"}, {"t": 156.96666666666667, "x": "2人が組み始めたのは1983年です。"}, {"t": 160.51666666666668, "x": "クラッシュ・ギャルズという名前にも、\n始まりがあります。"}, {"t": 163.9, "x": "東京スポーツの名鑑に説明があります。"}, {"t": 166.68333333333334, "x": "1984年8月です。"}, {"t": 169.21666666666667, "x": "2人はWWWA世界タッグ王座に挑みました。"}, {"t": 173.08333333333334, "x": "この試合からクラッシュ・ギャルズを\n名乗った、という書き方です。"}, {"t": 177.1, "x": "同じ1984年に、\n2人はレコードを出しています。"}, {"t": 181.38333333333333, "x": "曲の名前は「炎の聖書」です。"}, {"t": 183.51666666666668, "x": "後楽園ホールのチケットは、\nそこから手に入りにくくなりました。"}, {"t": 187.76666666666668, "x": "当時を見た記者は、そう書いています。"}, {"t": 190.4, "x": "1985年になると、\n人気はリングの外に広がります。"}, {"t": 195.08333333333334, "x": "中山美穂が初めて出たドラマがありました。"}, {"t": 197.8, "x": "TBSの「毎度おさわがせします」です。"}, {"t": 200.88333333333333, "x": "このドラマに、2人は本人の役で毎回出ました。"}, {"t": 204.46666666666667, "x": "同じ年に、フジテレビは\n女子プロレスの中継を始めます。"}, {"t": 208.43333333333334, "x": "夜のゴールデンタイムの、毎週の放送でした。"}, {"t": 211.83333333333334, "x": "2人はテレビのコマーシャルにも出ています。"}, {"t": 214.25, "x": "「笑っていいとも!」にも出ました。"}, {"t": 216.46666666666667, "x": "「オレたちひょうきん族」にも出ています。"}, {"t": 218.56666666666666, "x": "「ザ・ベストテン」にも出ました。"}, {"t": 220.16666666666666, "x": "客席にいたのは、中学生や\n高校生の女の子たちでした。"}, {"t": 224.51666666666668, "x": "親衛隊と呼ばれるファンは、\n色とりどりのハッピを着ていました。"}, {"t": 228.7, "x": "手にはペンライトを持っていました。"}, {"t": 230.68333333333334, "x": "その光で2人を応援したのです。"}, {"t": 232.98333333333332, "x": "この人気を大きくしたのが、\n敵の役の選手たちです。"}, {"t": 236.7, "x": "1984年、ダンプ松本は\n悪役のグループを作りました。"}, {"t": 241.93333333333334, "x": "名前は   a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
