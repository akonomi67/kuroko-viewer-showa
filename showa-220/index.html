<style>

<script>
const D={"name": "ジャパンプロレス解散", "file": "220_編集用", "dur": 929.3333125, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1987年10月25日、京都。"}, {"t": 4.083333333333333, "x": "この日、全日本プロレスの\n興行が行われていました。"}, {"t": 7.933333333333334, "x": "イメージ映像"}, {"t": 7.933333333333334, "x": "その会場のリングに、1人の選手が上がります。"}, {"t": 11.45, "x": "試合をするために来たのではありませんでした。"}, {"t": 14.2, "x": "ケガで欠場していた選手です。"}, {"t": 16.333333333333332, "x": "名前を谷津嘉章といいます。"}, {"t": 18.433333333333334, "x": "谷津はリングでマイクを取り、\nある団体の解散を告げました。"}, {"t": 22.566666666666666, "x": "団体の名前は、ジャパンプロレスといいます。"}, {"t": 25.666666666666668, "x": "設立は1984年10月9日。"}, {"t": 29.016666666666666, "x": "この日でちょうど3年と16日でした。"}, {"t": 31.6, "x": "長州力をはじめとする14人の選手が\n新日本プロレスを離れて作った会社です。"}, {"t": 37.13333333333333, "x": "そして、自分の団体の名前を掲げながら、\n試合はほとんど全日本プロレスの"}, {"t": 42.78333333333333, "x": "リングで行っていました。"}, {"t": 43.95, "x": "イメージ映像"}, {"t": 43.95, "x": "なぜ、看板になる選手をそろえた団体が、\n3年で消えることになったのでしょうか。"}, {"t": 50.0, "x": "今回は、ジャパンプロレスという会社の\n設立から解散までを、確認できた日付と"}, {"t": 55.85, "x": "記録だけで辿っていきます。"}, {"t": 57.43333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 59.93333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 65.5, "x": "イメージ映像"}, {"t": 65.5, "x": "まず、この会社がどこから\n始まったのかを確認しておきます。"}, {"t": 69.76666666666667, "x": "始まりは1983年11月20日付です。"}, {"t": 73.7, "x": "新日本プロレスで営業を\n担当していた大塚直樹が会社を退き、"}, {"t": 78.26666666666667, "x": "新日本プロレス興行という法人を登記しました。"}, {"t": 81.81666666666666, "x": "この社名は、もともとアントニオ猪木が\n登記していたものでした。"}, {"t": 85.9, "x": "資本金は300万円です。"}, {"t": 88.06666666666666, "x": "その法人を大塚が譲り受ける形になりました。"}, {"t": 91.3, "x": "イメージ映像"}, {"t": 91.3, "x": "1984年1月14日、京王プラザホテルで\n設立の披露パーティーが開かれます。"}, {"t": 98.06666666666666, "x": "記録では、猪木はこの席に出席していません。"}, {"t": 101.46666666666667, "x": "そして1984年6月、全日本プロレスの\n会長だったジャイアント馬場と、"}, {"t": 107.21666666666667, "x": "社長の松根光雄が、大塚に接触しました。"}, {"t": 110.83333333333333, "x": "同じ年の8月26日、田園コロシアムで\n行われた全日本プロレスの興行を、"}, {"t": 117.2, "x": "大塚の会社がプロモートしています。"}, {"t": 119.7, "x": "イメージ映像"}, {"t": 119.7, "x": "2代目タイガーマスクが登場した大会です。"}, {"t": 122.56666666666666, "x": "イメージ映像"}, {"t": 122.56666666666666, "x": "ここまでは、興行会社の話でした。"}, {"t": 125.5, "x": "ここから、選手が動きます。"}, {"t": 127.76666666666667, "x": "1984年9月21日、キャピトル東急ホテルで\n記者会見が開かれました。"}, {"t": 133.96666666666667, "x": "長州力、小林邦昭、谷津嘉章が\n新日本プロレスに退職届を提出。"}, {"t": 140.28333333333333, "x": "そこにアニマル浜口と寺西勇が\n加わり、この時点で5名です。"}, {"t": 145.06666666666666, "x": "3日後の9月24日、\n永源遙ら5名が退職願を出しました。"}, {"t": 150.3, "x": "さらに10月に入り、マサ斎藤らが加わります。"}, {"t": 154.11666666666667, "x": "イメージ映像"}, {"t": 154.11666666666667, "x": "選手は最終的に14人になりました。"}, {"t": 156.86666666666667, "x": "そして1984年10月9日、\n新日本プロレス興行と、長州の個人事務所だった"}, {"t": 163.85, "x": "リキプロダクションが合併します。"}, {"t": 165.7, "x": "社名を改め、ジャパンプロレスが設立されました。"}, {"t": 169.43333333333334, "x": "資本金は5,000万円に増資されています。"}, {"t": 172.31666666666666, "x": "役員には、\n代表取締役会長として竹田という人物が、"}, {"t": 176.88333333333333, "x": "代表取締役社長として大塚直樹が就いています。"}, {"t": 180.85, "x": "長州が社長に就くのは、翌1985年6月です。"}, {"t": 185.46666666666667, "x": "ただし代表権は与えられていません。"}, {"t": 187.93333333333334, "x": "イメージ映像"}, {"t": 187.93333333333334, "x": "会社の実権は、会長と副会長にありました。"}, {"t": 191.66666666666666, "x": "この点は、後で効いてきます。"}, {"t": 194.06666666666666, "x": "実質的な旗揚げ戦は1984年12月4日、\n高松市民文化センターでした。"}, {"t": 200.81666666666666, "x": "メインで長州が怪覆面Xという選手に\n95秒で勝っています。"}, {"t": 205.56666666666666, "x": "全日本プロレスのリングに\n初めて上がったのは、その8日後です。"}, {"t": 209.86666666666667, "x": "1984年12月12日、横浜文化体育館。"}, {"t": 214.86666666666667, "x": "この日出場したのは長州と谷津の2人だけでした。"}, {"t": 218.15, "x": "理由も記録に残っています。"}, {"t": 220.1, "x": "テレビの肖像権の問題です。"}, {"t": 222.2, "x": "ジャパンはテレビ朝日に違約金5,000万円を\n支払い、1985年4月から日本テレビの"}, {"t": 228.91666666666666, "x": "中継に出られるようになりました。"}, {"t": 230.76666666666668, "x": "イメージ映像"}, {"t": 230.76666666666668, "x": "団体を作って出て行った側が、\n出て行った先の放送局に5,000万円を"}, {"t": 236.1, "x": "払って、別の局の画面に出る。"}, {"t": 238.51666666666668, "x": "そういう形で始まっています。"}, {"t": 240.61666666666667, "x": "ここから2年あまり、ジャパンプロレスは\n全日本プロレスのリングに上がり続けました。"}, {"t": 246.0, "x": "自主興行も打っています。"}, {"t": 247.68333333333334, "x": "1985年は5月に全6戦、\n8月に全7戦、11月に全6戦。"}, {"t": 254.5, "x": "いずれも短いシリーズでした。"}, {"t": 256.43333333333334, "x": "会社の中で何が起きていたのかも、\n記録に残っています。"}, {"t": 260.4166666666667, "x": "1つ目は、選手との契約書が無かったことです。"}, {"t": 263.8333333333333, "x": "大塚は、いくら契約しても\n辞めたくなれば選手は辞めてしまうから"}, {"t": 268.1166666666667, "x": "契約しても無意味だ、自分たちは信頼関係で\n結ばれている、という考えだったと"}, {"t": 274.0, "x": "伝えられています。"}, {"t": 275.03333333333336, "x": "イメージ映像"}, {"t": 275.03333333333336, "x": "2つ目は、興行部門が赤字続きだったことです。"}, {"t": 278.6333333333333, "x": "その赤字は、日本テレビからの放映権料で\n補われていたと記されています。"}, {"t": 283.8, "x": "3つ目は、東京・池尻に建てられた本社ビルです。"}, {"t": 287.4, "x": "このビルは会社の自社ビルではなく、\n竹田会長の個人名義でした。"}, {"t": 292.1666666666667, "x": "会社が賃料とローンを支払っていたことに、\n選手側が不満を持ったと書かれています。"}, {"t": 297.73333333333335, "x": "そして1986年、独立の道が絶たれます。"}, {"t": 302.23333333333335, "x": "TBSでのレギュラー中継の計画は、\n決定寸前で止まり、1か月で頓挫しました。"}, {"t": 308.8666666666667, "x": "イメージ映像"}, {"t": 308.8666666666667, "x": "UWFとの業務提携の話も流れています。"}, {"t": 312.43333333333334, "x": "残ったのは、全日本プロレスからの条件でした。"}, {"t": 315.95, "x": "放映権料の取り分を10パーセントから\n15パーセントへ引き上げ、"}, {"t": 319.98333333333335, "x": "イメージ映像"}, {"t": 319.98333333333335, "x": "ジャパンの選手は全日本所属として契約し、\nその対価4,000万円を"}, {"t": 325.4, "x": "ジャパンに支払う、という内容です。"}, {"t": 328.05, "x": "イメージ映像"}, {"t": 328.05, "x": "この条件で契約を更新した結果、\nジャパンプロレスは事実上、"}, {"t": 332.76666666666665, "x": "全日本プロレスの傘下に入りました。"}, {"t": 335.51666666666665, "x": "自主興行も行われなくなります。"}, {"t": 337.76666666666665, "x": "当時のことを、長州力は後年こう語っています。"}, {"t": 341.4, "x": "イメージ映像"}, {"t": 341.4, "x": "俺の夢は1枚の切符で全団体の\n選手が見られる興行だったんだ。"}, {"t": 345.8333333333333, "x": "結果的にジャパンが割れた。"}, {"t": 347.6, "x": "イメージ映像"}, {"t": 347.6, "x": "谷津嘉章も、東スポの連載で\nこう振り返っています。"}, {"t": 351.53333333333336, "x": "新日本では\nプロレスだけをやっていれば良かったけど、"}, {"t": 354.6166666666667, "x": "ジャパンでは長州さんと\n大塚さんが2人で社長をしていた。"}, {"t": 358.68333333333334, "x": "その補佐の自分も経営まで見ないといけなくて、\n次第に夢が現実になってきた。"}, {"t": 363.9166666666667, "x": "イメージ映像"}, {"t": 363.9166666666667, "x": "そして1987年です。"}, {"t": 366.5, "x": "ここから半年で、団体は形を失います。"}, {"t": 370.01666666666665, "x": "1987年2月6日、札幌大会。"}, {"t": 374.0833333333333, "x": "これが長州力にとって、\n全日本プロレスでの最後の試合になりました。"}, {"t": 378.95, "x": "イメージ映像"}, {"t": 378.95, "x": "2月20日、後楽園ホール。"}, {"t": 381.53333333333336, "x": "エキサイトシリーズの開幕戦です。"}, {"t": 383.8333333333333, "x": "この日、長州は姿を見せませんでした。"}, {"t": 387.0, "x": "欠場の理由については、資料が分かれています。"}, {"t": 390.56666666666666, "x": "週刊プロレスとウィキペディアは\n風邪による発熱と下痢と記し、東京スポーツは"}, {"t": 395.85, "x": "右手首のガングリオンと記しています。"}, {"t": 398.18333333333334, "x": "ここではどちらとも断定しません。"}, {"t": 400.35, "x": "翌21日の沼津大会も、全日本は長州の出場を\n発表していましたが、長州は現れませんでした。"}, {"t": 408.25, "x": "2月23日には新日本プロレスの\n新しいシリーズが伊勢崎で開幕します。"}, {"t": 413.45, "x": "その伊勢崎からおよそ30キロ離れた伊香保温泉に\n長州がいた、と週刊プロレスが報じました。"}, {"t": 420.01666666666665, "x": "なお、長州が欠場した2月20日の同じ日、\n中野サンプラザホールでは猪木の44歳の"}, {"t": 426.9, "x": "誕生日イベントが開かれています。"}, {"t": 429.01666666666665, "x": "そこにマサ斎藤が登場し、\n猪木に対戦を要求しました。"}, {"t": 433.35, "x": "1987年3月23日、東京・池尻の\nジャパンプロレス本社で記者会見が開かれます。"}, {"t": 440.76666666666665, "x": "長州は、全日本プロレスとの契約を\n更新せず独立する、と発表しました。"}, {"t": 446.8666666666667, "x": "3月25日、大阪ロイヤルホテルで\nマサ斎藤の調印式が行われ、"}, {"t": 452.18333333333334, "x": "長州が代理人として姿を見せます。"}, {"t": 455.1, "x": "翌26日、大阪城ホールで猪木と\nマサ斎藤の一戦が組まれました。"}, {"t": 460.31666666666666, "x": "3月27日、馬場がジャパンプロレスの\n本社に乗り込みます。"}, {"t": 465.0, "x": "そして独立の撤回と、ジャパン勢が\n全日本に残ることを了承させました。"}, {"t": 470.15, "x": "イメージ映像"}, {"t": 470.15, "x": "その翌日です。"}, {"t": 471.4166666666667, "x": "1987年3月28日、後楽園ホール。"}, {"t": 476.2, "x": "チャンピオン・カーニバルの開幕戦でした。"}, {"t": 478.68333333333334, "x": "長州とマサ斎藤を含む8名の選手、それに1人の\nレフェリーを加えた9名が、この開幕戦への"}, {"t": 485.93333333333334, "x": "出場を拒否し、本社ビルに立てこもります。"}, {"t": 489.01666666666665, "x": "イメージ映像"}, {"t": 489.01666666666665, "x": "長州のシリーズ不参加が会場に掲示されたのは、\n試合開始1時間前の17時30分でした。"}, {"t": 495.8833333333333, "x": "会場に現れたジャパンの選手は、\n谷津嘉章、永源遙ら4名だけです。"}, {"t": 501.73333333333335, "x": "イメージ映像"}, {"t": 501.73333333333335, "x": "この日、谷津は会見でこう語っています。"}, {"t": 505.2, "x": "やれ新日本に行く、やれ独立だ。"}, {"t": 508.06666666666666, "x": "イメージ映像"}, {"t": 508.06666666666666, "x": "やっぱり全日本 const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
