583333333333333, "x": "会場は超満員で、札止めになりました。"}, {"t": 7.716666666666667, "x": "この日のメインイベントに出てきた\n組み合わせは、当時の日本では"}, {"t": 11.666666666666666, "x": "二度と見られないはずのものでした。"}, {"t": 13.5, "x": "ジャイアント馬場と、アントニオ猪木。"}, {"t": 16.1, "x": "2人が同じ側のコーナーに立っています。"}, {"t": 18.683333333333334, "x": "相手は、アブドーラ・ザ・ブッチャーと\nタイガー・ジェット・シン。"}, {"t": 22.266666666666666, "x": "当時、日本で最も嫌われていた\n2人の外国人です。"}, {"t": 26.316666666666666, "x": "そしてこの試合は、テレビで\n中継されませんでした。"}, {"t": 30.033333333333335, "x": "その日の夜のスポーツニュースで、\n3分に満たない時間だけ扱われています。"}, {"t": 35.03333333333333, "x": "日本のプロレス史で最も豪華とされる興行が、\n映像としてはほとんど残らなかった。"}, {"t": 40.78333333333333, "x": "そういう日でした。"}, {"t": 42.0, "x": "今回は、1979年8月26日の\n夢のオールスター戦を、"}, {"t": 47.53333333333333, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 50.7, "x": "最後までご覧いただければ幸いです。"}, {"t": 53.2, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 58.766666666666666, "x": "まず、この興行が成立する条件がどれだけ\n厳しかったかを確認しておきます。"}, {"t": 64.3, "x": "1979年当時、日本には3つの\nプロレス団体がありました。"}, {"t": 69.51666666666667, "x": "新日本プロレス。"}, {"t": 70.88333333333334, "x": "社長はアントニオ猪木です。"}, {"t": 72.8, "x": "全日本プロレス。"}, {"t": 74.08333333333333, "x": "社長はジャイアント馬場です。"}, {"t": 75.96666666666667, "x": "そして国際プロレス。"}, {"t": 77.45, "x": "第3の団体と呼ばれた会社で、\nエースはラッシャー木村でした。"}, {"t": 81.73333333333333, "x": "この3つは、互いに選手を貸し借りしません。"}, {"t": 85.06666666666666, "x": "興行の日程がぶつかれば、\n客の取り合いになります。"}, {"t": 88.78333333333333, "x": "外国人選手の招聘でも競合します。"}, {"t": 91.71666666666667, "x": "とくに新日本と全日本は、同じ団体から\n分かれた2人が作った会社でした。"}, {"t": 97.13333333333334, "x": "馬場と猪木は、1960年9月30日に\n同じ日にデビューした同期です。"}, {"t": 102.73333333333333, "x": "力道山の日本プロレスに入り、力道山が\n亡くなったあとの看板を2人で背負いました。"}, {"t": 108.66666666666667, "x": "そして1971年12月、猪木が\n日本プロレスを追放されます。"}, {"t": 114.25, "x": "翌1972年1月に新日本プロレスを\n設立し、3月6日に旗揚げ。"}, {"t": 120.56666666666666, "x": "馬場も同じ年に日本プロレスを離れ、\n10月22日に全日本プロレスを旗揚げしました。"}, {"t": 126.81666666666666, "x": "同じ団体で育った2人が、\n同じ年に別々の会社を作った。"}, {"t": 131.36666666666667, "x": "以後、2人は完全に別の道を歩んでいます。"}, {"t": 134.83333333333334, "x": "そして日本のファンは、\nこの2人を比べ続けました。"}, {"t": 138.45, "x": "どちらが強いのか。"}, {"t": 139.78333333333333, "x": "どちらの団体が上なのか。"}, {"t": 141.58333333333334, "x": "この比較が、1970年代の日本の\nプロレスの中心にありました。"}, {"t": 146.75, "x": "さらに、この2団体はテレビ局も違います。"}, {"t": 150.11666666666667, "x": "新日本の中継はテレビ朝日、\n全日本の中継は日本テレビでした。"}, {"t": 155.25, "x": "つまり、選手を出し合う話は、\n局同士の話にもなります。"}, {"t": 160.01666666666668, "x": "簡単にまとまるものではありません。"}, {"t": 162.18333333333334, "x": "その中で、3団体を1つの\n会場に集める企画が動きました。"}, {"t": 166.76666666666668, "x": "主催は、プロレス団体ではありません。"}, {"t": 169.61666666666667, "x": "東京スポーツ新聞社です。"}, {"t": 171.55, "x": "創立20周年の記念事業として組まれました。"}, {"t": 174.75, "x": "団体同士では話がまとまらない。"}, {"t": 177.08333333333334, "x": "だから、団体ではない立場の会社が\n間に入った、という構図です。"}, {"t": 182.28333333333333, "x": "記録に残っている流れを追います。"}, {"t": 184.48333333333332, "x": "1979年6月14日、記者会見。"}, {"t": 188.73333333333332, "x": "7月25日、各団体の代表による会談。"}, {"t": 192.73333333333332, "x": "8月1日、対戦カードが決定。"}, {"t": 196.01666666666668, "x": "会見から本番まで、2か月余りです。"}, {"t": 199.08333333333334, "x": "そしてカードが決まったのは、\n本番の25日前でした。"}, {"t": 203.05, "x": "なぜそこまでかかったのか。"}, {"t": 204.75, "x": "この手の合同興行で最も揉めるのは、誰が\n誰と組み、誰が勝つかという部分だからです。"}, {"t": 211.55, "x": "自分の団体の看板が、他団体の選手に負ける\n形になれば、その後の興行に響きます。"}, {"t": 218.23333333333332, "x": "どの団体も、そこは譲れません。"}, {"t": 220.8, "x": "揉める理由は、それだけではありません。"}, {"t": 223.61666666666667, "x": "団体が違えば、試合のやり方も違います。"}, {"t": 227.03333333333333, "x": "新日本は、関節技や打撃を\n前面に出す作り方をしていました。"}, {"t": 231.95, "x": "全日本は、アメリカ流の\n受けて返す作り方が中心です。"}, {"t": 236.28333333333333, "x": "国際プロレスは、金網デスマッチのような\n形式で客を呼んでいました。"}, {"t": 241.06666666666666, "x": "同じプロレスという名前でも、リングの\n上でやっていることが違います。"}, {"t": 245.6, "x": "それを1日のカードに\n並べれば、当然ぶつかります。"}, {"t": 249.45, "x": "そして決まったカードが、全部で9試合でした。"}, {"t": 252.81666666666666, "x": "第1試合は、3団体の選手が\n入り乱れるバトルロイヤル。"}, {"t": 257.0, "x": "山本小鉄が勝っています。"}, {"t": 258.8, "x": "第5試合には、長州力と\nアニマル浜口の組が出ています。"}, {"t": 263.1166666666667, "x": "第6試合は坂口征二。"}, {"t": 265.0833333333333, "x": "そしてマサ斎藤の名前も、この\n日のカードに並んでいます。"}, {"t": 269.1, "x": "第7試合の顔ぶれは、さらに異例でした。"}, {"t": 272.3333333333333, const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
