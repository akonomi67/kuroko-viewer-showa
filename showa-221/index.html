<title>SWS解散</title>
<style>
:root{--bg:#f6f4f1;--panel:#fffefc;--ink:#1c1a19;--dim:#6e6862;--line:#e2ded7;--accent:#b8422f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}}
:root[data-theme="dark"]{--bg:#17161a;--panel:#201e23;--ink:#ece8e4;--dim:#9b948d;--line:#33303a;--accent:#e0705a}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;-webkit-text-size-adjust:100%;
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:17px;margin:4px 0 14px;font-weight:600;letter-spacing:.02em}
.meta{color:var(--dim);font-size:13px;font-weight:400;margin-left:8px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;
  min-height:40vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:46px 20px 26px;box-shadow:0 2px 14px rgba(0,0,0,.10)}
#now{margin:0;text-align:center;white-space:pre-wrap;word-break:break-word;font-weight:700;
  font-size:clamp(23px,5.4vw,42px);line-height:1.5;letter-spacing:.01em}
#nextline{margin:16px 0 0;text-align:center;white-space:pre-wrap;word-break:break-word;
  color:var(--dim);font-size:clamp(13px,2.8vw,17px);line-height:1.6}
.badge{position:absolute;left:12px;top:12px;background:rgba(127,127,127,.16);color:var(--dim);
  font-size:12px;padding:3px 9px;border-radius:20px;line-height:1.6;letter-spacing:.04em}
.bar{display:flex;align-items:center;gap:10px;margin:12px 0 6px;flex-wrap:wrap}
button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 14px;font-size:15px;cursor:pointer;font-family:inherit}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.play{background:var(--accent);color:#fff;border-color:transparent;min-width:80px;font-weight:600}
.time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:13px;margin-left:auto}
input[type=range]{width:100%;accent-color:var(--accent)}
.marks{position:relative;height:7px;margin:2px 0 14px}
.marks i{position:absolute;top:0;width:1px;height:7px;background:var(--line)}
.tabs{display:flex;gap:6px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;
  color:var(--ink);padding:7px 12px;font-weight:600}
.list{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);
  -webkit-overflow-scrolling:touch}
.row{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(127,127,127,.07)}
.row.on{background:rgba(184,66,47,.12)}
.row b{color:var(--dim);font-variant-numeric:tabular-nums;font-weight:500;font-size:13px;
  min-width:48px;flex:none;padding-top:2px}
.row span{white-space:pre-wrap;flex:1;font-size:16px;line-height:1.65}
.tip{color:var(--dim);font-size:12.5px;margin:10px 2px 0}
@media(max-width:620px){.wrap{padding:10px}.time{font-size:12px}
  .bar button{padding:9px 11px;font-size:14px}.stage{padding:42px 14px 22px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<script>
const D={"name": "SWS解散", "file": "221_編集用", "dur": 883.8833125, "segs": [], "subs": [{"t": 0.0, "x": "イメージ映像"}, {"t": 0.0, "x": "1992年6月19日、長崎国際体育館。"}, {"t": 5.016666666666667, "x": "この日の観客は3,860人でした。満員です。"}, {"t": 9.216666666666667, "x": "イメージ映像"}, {"t": 9.216666666666667, "x": "ただし、体育館の満員です。"}, {"t": 12.05, "x": "その1年半前、同じ団体は東京ドームに\n64,618人を集めていました。"}, {"t": 18.7, "x": "団体の名前は、SWS。"}, {"t": 21.5, "x": "スーパー・ワールド・スポーツといいます。"}, {"t": 23.683333333333334, "x": "眼鏡の販売チェーンだった\nメガネスーパーが子会社を作り、"}, {"t": 27.3, "x": "そこが運営したプロレス団体でした。"}, {"t": 30.05, "x": "設立の発表会見が開かれたのは\n1990年5月10日です。"}, {"t": 34.96666666666667, "x": "長崎の最終興行までが、およそ2年でした。"}, {"t": 38.666666666666664, "x": "なぜ、日本で初めて大企業が正面から\n金を出した団体が、2年で消えたのでしょうか。"}, {"t": 45.2, "x": "イメージ映像"}, {"t": 45.2, "x": "今回は、SWSという団体に\n使われた金額と、集まった人の数を、"}, {"t": 51.18333333333333, "x": "報じられた数字のまま並べていきます。"}, {"t": 53.88333333333333, "x": "金額は媒体によって違うので、\nどこがいくらと伝えたのかも合わせて記します。"}, {"t": 59.13333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 61.61666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 67.2, "x": "まず、始まりの日から確認しておきます。"}, {"t": 70.31666666666666, "x": "イメージ映像"}, {"t": 70.31666666666666, "x": "1990年5月10日、ホテルオークラ。"}, {"t": 73.91666666666667, "x": "株式会社メガネスーパー・ワールド・スポーツの\n設立発表会見が開かれました。"}, {"t": 78.9, "x": "会見に出たのは、メガネスーパー社長の\n田中八郎と、全日本プロレスを"}, {"t": 84.26666666666667, "x": "イメージ映像"}, {"t": 84.26666666666667, "x": "退団したばかりの天龍源一郎です。"}, {"t": 86.8, "x": "この席で、田中八郎はこう語っています。"}, {"t": 90.1, "x": "全体として費用は60億から\n70億ぐらいかかると思いますが。"}, {"t": 94.55, "x": "イメージ映像"}, {"t": 94.55, "x": "さらに、こうも言っています。"}, {"t": 96.75, "x": "企業がある程度バックに\nついて支えてあげなければ、"}, {"t": 99.76666666666667, "x": "選手の育成、底辺の拡大を考えた時に、\nいち団体でやっていくということは、"}, {"t": 106.21666666666667, "x": "十分に厳しさが出てきます。"}, {"t": 108.43333333333334, "x": "そして、動機についてはこう述べました。"}, {"t": 111.33333333333333, "x": "直接我が社にはメリットがない。"}, {"t": 113.45, "x": "その中で私があえて踏み切ったのは、\nこれはあくまでも私の男のロマンだと。"}, {"t": 118.65, "x": "イメージ映像"}, {"t": 118.65, "x": "踏み切った理由については、\nこうも述べています。"}, {"t": 121.96666666666667, "x": "最終的には天龍選手とお会いして\nお話をする中で、男のロマンを感じたからです。"}, {"t": 127.9, "x": "同じ席で、天龍源一郎はこう語りました。"}, {"t": 131.43333333333334, "x": "田中社長の考え方に共鳴いたしまして、\n2人で新しいものを"}, {"t": 135.91666666666666, "x": "作っていこうということになりました。"}, {"t": 137.91666666666666, "x": "カラッと激しいプロレスを\n目指してやっていきたい。"}, {"t": 140.76666666666668, "x": "イメージ映像"}, {"t": 140.76666666666668, "x": "ここで1つ、はっきりさせておきます。"}, {"t": 143.66666666666666, "x": "この1990年5月10日は、記者会見の日です。"}, {"t": 148.0, "x": "イメージ映像"}, {"t": 148.0, "x": "試合が行われた日ではありません。"}, {"t": 150.33333333333334, "x": "興行としての旗揚げは、2段構えでした。"}, {"t": 153.46666666666667, "x": "プレ旗揚げ戦が1990年9月29日、\n福井市体育館。"}, {"t": 158.78333333333333, "x": "大会名は越前闘会始です。"}, {"t": 161.3, "x": "観客は4,072人で、\n超満員と記録されています。"}, {"t": 165.7, "x": "イメージ映像"}, {"t": 165.7, "x": "正式な旗揚げは1990年10月18日と\n19日、横浜アリーナでの2連戦でした。"}, {"t": 172.86666666666667, "x": "大会名は闘会始90です。"}, {"t": 175.41666666666666, "x": "会見から旗揚げまでの5か月で、\nこの団体は選手を集めます。"}, {"t": 179.95, "x": "イメージ映像"}, {"t": 179.95, "x": "その発表の日付を並べておきます。"}, {"t": 182.46666666666667, "x": "イメージ映像"}, {"t": 182.46666666666667, "x": "1990年5月7日、\nジョージ高野が新団体への参加を表明。"}, {"t": 188.0, "x": "イメージ映像"}, {"t": 188.0, "x": "7月2日、サムソン冬木ら5名の入団を発表。"}, {"t": 192.1, "x": "7月11日、石川敬士の入団を発表。"}, {"t": 196.23333333333332, "x": "8月7日、谷津嘉章の入団を発表。"}, {"t": 199.73333333333332, "x": "8月16日、ザ・グレート・カブキの入団を発表。"}, {"t": 203.88333333333333, "x": "8月23日、佐野直喜の入団を発表。"}, {"t": 207.83333333333334, "x": "そして11月1日、新日本プロレスを\n退団した北尾光司の入団が発表されました。"}, {"t": 214.13333333333333, "x": "イメージ映像"}, {"t": 214.13333333333333, "x": "全日本プロレス、\n新日本プロレス、そして旧国際プロレスの"}, {"t": 218.96666666666667, "x": "出身者が、1つの団体に集まったことになります。"}, {"t": 222.6, "x": "団体の形も、それまでの日本の\nプロレスにはないものでした。"}, {"t": 226.73333333333332, "x": "1990年8月30日、ホテルオークラで\n事業概要の発表会が開かれ、3つの部屋の"}, {"t": 234.2, "x": "名前と選手の振り分けが発表されます。"}, {"t": 236.73333333333332, "x": "レボリューションの道場主が天龍源一郎。"}, {"t": 239.6, "x": "道場・檄の道場主が若松市政。"}, {"t": 242.35, "x": "パライストラの道場主がジョージ高野でした。"}, {"t": 245.16666666666666, "x": "イメージ映像"}, {"t": 245.16666666666666, "x": "相撲の部屋制度に近い形です。"}, {"t": 247.6, "x": "ただし、この仕組みには最初から\n欠けているものがありました。"}, {"t": 251.63333333333333, "x": "部屋ごとの専用道場です。"}, {"t": 253.61666666666667, "x": "実際に使えたのは、\n旗揚げのときの新横浜の仮道場と、"}, {"t": 257.8833333333333, "x": "1991年9月13日に川崎市百合丘で\n披露された本道場の2か所だけでした。"}, {"t": 264.6, "x": "本道場の総工費は7億円と記録されています。"}, {"t": 268.06666666666666, "x": "3つの部屋が、2か所の道場を\n使い回していたことになります。"}, {"t": 272.21666666666664, "x": "イメージ映像"}, {"t": 272.21666666666664, "x": "そして、外からの批判も始まりました。"}, {"t": 275.21666666666664, "x": "当時最も影響力のあった\nプロレス専門誌との関係は、"}, {"t": 278.9166666666667, "x": "1991年2月14日に決定的になります。"}, {"t": 283.21666666666664, "x": "この日、SWSは取材拒否の\n通達書を発送しました。"}, {"t": 287.75, "x": "通達が届いたのは翌15日の午後です。"}, {"t": 290.6166666666667, "x": "雑誌の側は表紙で、その事実を読者に伝えました。"}, {"t": 294.56666666666666, "x": "イメージ映像"}, {"t": 294.56666666666666, "x": "そして数週間後、今後この団体に関する一切の\n情報の掲載を控える、と回答しています。"}, {"t": 301.6666666666667, "x": "テレビ中継を持たない団体にとって、\n専門誌に載らないことは、"}, {"t": 305.96666666666664, "x": "興行の告知手段を1つ失うことでした。"}, {"t": 309.1166666666667, "x": "イメージ映像"}, {"t": 309.1166666666667, "x": "それでも、数字は出ていました。"}, {"t": 311.5, "x": "1990年11月20日、アメリカの\nWWFと2年間の業務提携を結びます。"}, {"t": 318.6333333333333, "x": "1991年3月24日には、天龍と北尾が\nアメリカのレッスルマニアに出場しました。"}, {"t": 325.48333333333335, "x": "イメージ映像"}, {"t": 325.48333333333335, "x": "日本人選手がこの大会で試合をしたのは、\nこのときが初めてです。"}, {"t": 330.15, "x": "そして1991年3月30日、東京ドーム。"}, {"t": 334.8333333333333, "x": "WWFとの共催で開かれた大会の\n観客は64,618人でした。"}, {"t": 340.8666666666667, "x": "1991年6月10日の愛知県体育館大会からは、\n入場の演出として一本花道を採り入れました。"}, {"t": 348.96666666666664, "x": "日本のプロレスでこの形が\n使われたのは、これが最初です。"}, {"t": 353.03333333333336, "x": "アメリカの演出を参考にしたものでした。"}, {"t": 355.71666666666664, "x": "放送も付きました。"}, {"t": 357.0833333333333, "x": "1991年3月30日の東京ドームから、\n衛星放送での中継が始まっています。"}, {"t": 364.05, "x": "ただしこの放送は、1年後の\n1992年3月28日の回で終わりました。"}, {"t": 370.3833333333333, "x": "同じ年の12月12日、東京ドーム。"}, {"t": 373.8333333333333, "x": "今度はSWSの単独興行です。"}, {"t": 376.6666666666667, "x": "観客は61,500人、\n満員と記録されています。"}, {"t": 380.98333333333335, "x": "イメージ映像"}, {"t": 380.98333333333335, "x": "2年で消える団体が、東京ドームを\n2回埋めていたことになります。"}, {"t": 385.5, "x": "イメージ映像"}, {"t": 385.5, "x": "その一方で、内側では出来事が続きました。"}, {"t": 389.1333333333333, "x": "1991年4月1日、神戸ワールド記念ホール。"}, {"t": 393.9, "x": "この日の北尾光司の試合が反則負けとなり、\n試合後、北尾はマイクで暴言を発しました。"}, {"t": 400.4166666666667, "x": "3日後の4月4日、緊急理事会で\n北尾の解雇が決議されます。"}, {"t": 405.2, "x": "天龍はこの件の責任を取る形で、道場主と\n理事会長と取締役の辞任届を提出しました。"}, {"t": 412.25, "x": "のちに慰留され、留任しています。"}, {"t": 414.85, "x": "1991年7月19日、\n田中八郎が運営会社の社長を退任し、"}, {"t": 421.1333333333333, "x": "天龍源一郎が新しい社長に就きました。"}, {"t": 424.55, "x": "その社長業について、天龍源一郎は\n後年こう振り返っています。"}, {"t": 429.6166666666667, "x": "天龍社長は名前だけ。"}, {"t": 431.4, "x": "ないがしろでした。"}, {"t": 432.6, "x": "部屋制度についても、こう語っています。"}, {"t": 435.6166666666667, "x": "イメージ映像"}, {"t": 435.6166666666667, "x": "部屋制度は機能していたけれど、\nレスラーは独立心が強く、我が出ます。"}, {"t": 441.1, "x": "他の部屋は僕のいるレボリューションが\n優遇され、自分たちが日の目をみないと"}, {"t": 446.01666666666665, "x": "愚痴、けなし合いをしています。"}, {"t": 448.3666666666667, "x": "道場の使われ方については、\n田中八郎の側にも記録が残っています。"}, {"t": 453.43333333333334, "x": "2000年の専門誌のインタビューで、\nこう語ったと伝えられています。"}, {"t": 457.93333333333334, "x": "うちの選手はこちらで道場を用意したんですが、\n誰も練習に来なかったんですよ。"}, {"t": 463.56666666666666, "x": "それで私が出席簿を道場に設置して、\n選手が練習に来ているか"}, {"t": 468.23333333333335, "x": "毎日チェックする様にしたんです。"}, {"t": 470.1666666666667, "x": "それでも選手達は来なかった。"}, {"t": 472.25, "x": "そして1992年、団体は2か月で形を失います。"}, {"t": 477.35, "x": "部屋が分かれていたことについて、\n谷津嘉章は後年こう語っています。"}, {"t": 482.26666666666665, "x": "この部屋別制度というアイデア自体はよかった。"}, {"t": 485.0833333333333, "x": "ただ、結局は内部分裂の要因になっちゃった。"}, {"t": 488.73333333333335, "x": "イメージ映像"}, {"t": 488.73333333333335, "x": "そして、こうも述べています。"}, {"t": 490.9166666666667, "x": "新日本のイデオロギー、\n全日本のイデオロギーがひとつの"}, {"t": 494.73333333333335, "x": "団体にあるわけですから、まとまるわけがない。"}, {"t": 497.73333333333335, "x": "5月7日、マッチメイクを担当していた\nザ・グレート・カブキが辞任とフリー転向を表明。"}, {"t": 503.8333333333333, "x": "5月14日、谷津嘉章が記者会見で\n選手会長の辞任と退団を表明します。"}, {"t": 509.98333333333335, "x": "イメージ映像"}, {"t": 509.98333333333335, "x": "ここで対立が表に出まし const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
