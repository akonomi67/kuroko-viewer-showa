<script>
const D={"name": "梶原一騎", "file": "236_編集用", "dur": 929.6333125, "segs": [], "subs": [{"t": 0.0, "x": "1971年9月18日、日本テレビで\n1本のテレビアニメが最終回を迎えました。"}, {"t": 6.866666666666666, "x": "『巨人の星』です。"}, {"t": 8.116666666666667, "x": "始まったのは1968年3月30日で、\n放送は全部で182話を数えました。"}, {"t": 15.016666666666667, "x": "放送期間は3年半に及びました。"}, {"t": 17.6, "x": "その11日後、1971年9月29日。"}, {"t": 21.983333333333334, "x": "今度はフジテレビの\n『あしたのジョー』が終わります。"}, {"t": 24.666666666666668, "x": "こちらは1970年4月1日に始まり、\n79話で幕を閉じました。"}, {"t": 30.55, "x": "さらにその翌日、1971年9月30日。"}, {"t": 35.06666666666667, "x": "日本テレビで『タイガーマスク』が\n最終回を迎えました。"}, {"t": 38.38333333333333, "x": "1969年10月2日の\n放送開始から、全105話。"}, {"t": 43.35, "x": "12日のあいだに、\n3本のアニメが終わっています。"}, {"t": 46.96666666666667, "x": "そしてこの3本には、共通点が1つありました。"}, {"t": 50.68333333333333, "x": "原作を書いた人物が、同じなのです。"}, {"t": 53.65, "x": "名前は梶原一騎。"}, {"t": 55.21666666666667, "x": "その梶原一騎は、\n1983年5月25日に逮捕されます。"}, {"t": 60.78333333333333, "x": "そして1987年1月21日、\n50歳で亡くなりました。"}, {"t": 66.53333333333333, "x": "今回は、この男が残した記録を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 72.48333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 74.98333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 80.55, "x": "まず、人物の基本情報から確認しておきます。"}, {"t": 84.38333333333334, "x": "梶原一騎は筆名です。"}, {"t": 86.3, "x": "本名は高森朝樹。"}, {"t": 87.96666666666667, "x": "1936年9月4日、\n東京市浅草区石浜の生まれです。"}, {"t": 93.36666666666666, "x": "現在の台東区にあたります。"}, {"t": 95.38333333333334, "x": "世に出たのは17歳のときでした。"}, {"t": 97.66666666666667, "x": "1953年、ボクシング小説『勝利のかげに』が\n雑誌『少年画報』の懸賞に入選しています。"}, {"t": 104.75, "x": "このときすでに、\n梶原一騎という筆名を使っていました。"}, {"t": 108.8, "x": "以後、少年向けのスポーツ小説を書き続けます。"}, {"t": 112.33333333333333, "x": "漫画の原作に本格的に入るのは1960年代です。"}, {"t": 116.66666666666667, "x": "1962年、プロレス漫画\n『チャンピオン太』の連載が始まりました。"}, {"t": 121.96666666666667, "x": "そして1966年、『巨人の星』が始まります。"}, {"t": 126.15, "x": "掲載誌は『週刊少年マガジン』。"}, {"t": 128.45, "x": "1966年19号から\n1971年3号までの連載でした。"}, {"t": 134.18333333333334, "x": "作画は川崎のぼる。"}, {"t": 135.8, "x": "主人公は星飛雄馬。"}, {"t": 137.5, "x": "父親の星一徹が、息子を巨人軍の投手に\n仕立てるために鍛え上げるという話です。"}, {"t": 143.38333333333333, "x": "飛雄馬が投げる球には、大リーグボール1号、\n2号、3号という名前が付けられました。"}, {"t": 150.16666666666666, "x": "2号は消える魔球と呼ばれています。"}, {"t": 152.55, "x": "この作品は第8回講談社児童\nまんが賞を受けました。"}, {"t": 156.25, "x": "単行本の累計発行部数は、2021年8月の\n時点で630万部と記録されています。"}, {"t": 163.4, "x": "続編にあたる『新巨人の星』は、1976年から\n1979年まで『週刊読売』で連載されました。"}, {"t": 171.63333333333333, "x": "1968年には2本が同時に走り出します。"}, {"t": 175.46666666666667, "x": "1本目が『あしたのジョー』。"}, {"t": 177.05, "x": "掲載誌は同じく『週刊少年マガジン』で、\n1968年から1973年までの連載です。"}, {"t": 184.68333333333334, "x": "作画はちばてつや。"}, {"t": 186.15, "x": "主人公は矢吹丈というボクサーです。"}, {"t": 188.73333333333332, "x": "この作品だけ、原作者の名前が違います。"}, {"t": 192.2, "x": "高森朝雄という別の筆名が使われました。"}, {"t": 195.18333333333334, "x": "『巨人の星』と同じ書き手だと\n読者に先入観を持たれることを、"}, {"t": 198.95, "x": "編集部が避けたためとされています。"}, {"t": 201.48333333333332, "x": "1970年3月には、作中で死亡した力石徹の\n葬儀が講談社の講堂で実際に営まれました。"}, {"t": 209.2, "x": "記録では、600名を超える人が\n集まったとされています。"}, {"t": 213.16666666666666, "x": "そして2本目が『タイガーマスク』です。"}, {"t": 215.4, "x": "作画は辻なおき。"}, {"t": 216.81666666666666, "x": "連載は3つの雑誌をまたいでいます。"}, {"t": 219.36666666666667, "x": "『ぼくら』の1968年1月号から\n1969年10月号まで。"}, {"t": 225.03333333333333, "x": "『週刊ぼくらマガジン』の\n1970年1号から1971年23号まで。"}, {"t": 231.3, "x": "『週刊少年マガジン』の\n1971年26号から53号まで。"}, {"t": 236.65, "x": "この漫画がアニメになったのが、\n冒頭で触れた1969年10月2日からの"}, {"t": 242.43333333333334, "x": "全105話です。"}, {"t": 243.53333333333333, "x": "『タイガーマスク』の設定も確認しておきます。"}, {"t": 246.33333333333334, "x": "覆面レスラーであるタイガーマスクの\n正体は、伊達直人という人物です。"}, {"t": 251.41666666666666, "x": "伊達直人は、ちびっこ\nハウスという孤児院で育ちました。"}, {"t": 255.25, "x": "そしてレスラーになるために入ったのが、\n虎の穴という悪役レスラーの養成機関です。"}, {"t": 260.9, "x": "虎の穴の決まりでは、所属レスラーは\nファイトマネーの半額を組織に"}, {"t": 265.46666666666664, "x": "納めることになっていました。"}, {"t": 267.03333333333336, "x": "伊達直人は、自分の手取りの分から\n育った孤児院に送金しようとします。"}, {"t": 272.01666666666665, "x": "ところが孤児院の窮状を知り、\n虎の穴へ納めるはずの分まで"}, {"t": 276.3333333333333, "x": "寄付せざるを得なくなっていきました。"}, {"t": 278.25, "x": "覆面を被って戦い、その金を施設の子どもに回す。"}, {"t": 282.26666666666665, "x": "この設定が、のちに現実の\n出来事として反復されることになります。"}, {"t": 286.9166666666667, "x": "『タイガーマスク二世』のほうは、\n1980年から1982年にかけての連載です。"}, {"t": 293.6, "x": "掲載誌は月刊『少年ポピー』から\n『増刊少年マガジン』へ移りました。"}, {"t": 298.03333333333336, "x": "ここまでを整理すると、こうなります。"}, {"t": 300.71666666666664, "x": "野球が『巨人の星』。"}, {"t": 302.23333333333335, "x": "ボクシングが『あしたのジョー』。"}, {"t": 303.85, "x": "プロレスが『タイガーマスク』。"}, {"t": 305.3833333333333, "x": "1960年代後半のテレビで\n流れていたスポーツ漫画の主要な枠を、"}, {"t": 310.3833333333333, "x": "1人の原作者が押さえていました。"}, {"t": 312.78333333333336, "x": "押さえていたのは、この3本だけではありません。"}, {"t": 316.05, "x": "1967年に『柔道一直線』。"}, {"t": 319.1166666666667, "x": "作画は永島慎二と斎藤ゆずるです。"}, {"t": 321.8333333333333, "x": "同じく1967年に『夕やけ番長』。"}, {"t": 325.0833333333333, "x": "作画は荘司としお。"}, {"t": 326.6166666666667, "x": "1970年にサッカー漫画の\n『赤き血のイレブン』。"}, {"t": 330.23333333333335, "x": "作画は園田光慶と深大路昇介。"}, {"t": 333.0, "x": "1972年には『柔道讃歌』。"}, {"t": 335.78333333333336, "x": "作画は貝塚ひろしです。"}, {"t": 337.65, "x": "野球、ボクシング、プロレス、柔道、サッカー。"}, {"t": 342.68333333333334, "x": "少年漫画のスポーツものの\n主要な競技が、ほぼ揃っています。"}, {"t": 347.0833333333333, "x": "そして1973年には\n『愛と誠』の連載も始まりました。"}, {"t": 351.51666666666665, "x": "作画はながやす巧。"}, {"t": 353.1333333333333, "x": "こちらは1975年に\n講談社漫画賞を受賞しています。"}, {"t": 357.5833333333333, "x": "仕事の量についても、記録が残っています。"}, {"t": 360.95, "x": "のちの『週刊プレイボーイ』のインタビューで、\n週刊誌に同時に5本の連載を"}, {"t": 365.81666666666666, "x": "持っていた時期があったことが語られています。"}, {"t": 368.26666666666665, "x": "書いていたのは1人です。"}, {"t": 369.81666666666666, "x": "作画はそれぞれ別の漫画家が担当していました。"}, {"t": 373.0, "x": "次に、この男と格闘技の関わりを見ていきます。"}, {"t": 376.6, "x": "プロレスとの接点は、\n少年漫画の仕事よりも先にありました。"}, {"t": 380.98333333333335, "x": "梶原は『東京中日スポーツ』で\n『力道山物語』を連載しています。"}, {"t": 385.51666666666665, "x": "この連載が好評を得た結果、\n力道山本人から直接、電話がかかってきました。"}, {"t": 391.75, "x": "ここから梶原と力道山は\n親密な関係になっていきます。"}, {"t": 395.6333333333333, "x": "のちに作品がテレビドラマになった際には、\n力道山が自分自身の役で出演する話を、"}, {"t": 401.7, "x": "本人が交渉して進めたと記録されています。"}, {"t": 404.9, "x": "書かれる側が、書いた人間に会いに来る。"}, {"t": 407.9, "x": "この関係の作り方が、以後ずっと続きました。"}, {"t": 411.3666666666667, "x": "空手のほうはさらに具体的です。"}, {"t": 413.53333333333336, "x": "大山倍達と最初に会ったのは\n1954年頃とされています。"}, {"t": 418.1166666666667, "x": "そして1957年から1959年までの3年間、\n梶原は大山道場で空手を習っていました。"}, {"t": 426.3333333333333, "x": "書く側が、実際に習っていたことになります。"}, {"t": 429.55, "x": "その大山倍達の半生を描いたのが\n『空手バカ一代』です。"}, {"t": 433.45, "x": "1971年6月、『週刊少年マガジン』で\n連載が始まりました。"}, {"t": 438.96666666666664, "x": "作画は第三部までがつのだじろう、\n第四部からが影丸譲也。"}, {"t": 443.75, "x": "連載は1977年まで続いています。"}, {"t": 447.18333333333334, "x": "この作品には、書き方\nそのものに特徴がありました。"}, {"t": 450.8666666666667, "x": "連載開始時の巻頭言で「これは事実談であり、\nこの男は実在する」とうたっています。"}, {"t": 456.76666666666665, "x": "実際には事実とフィクションが混ざっており、\nその割合はフィクションのほうに"}, {"t": 461.51666666666665, "x": "大きく傾いていたとされています。"}, {"t": 463.53333333333336, "x": "実在の人物を実名で扱い、\nその上に創作を重ねる。"}, {"t": 468.1, "x": "梶原一騎の書き方は、この時点ですでに\n現実と作品の境目に置かれていました。"}, {"t": 473.73333333333335, "x": "そして1981年、漫画の側と現実の\n側が入れ替わる出来事が起こります。"}, {"t": 480.01666666666665, "x": "1981年4月、テレビ朝日系でアニメ\n『タイガーマスク二世』の放送が始まりました。"}, {"t": 486.76666666666665, "x": "その数日後の1981年4月23日、蔵前国技館。"}, {"t": 492.4166666666667, "x": "新日本プロレスのリングに、\nタイガーマスクという名前の"}, {"t": 496.21666666666664, "x": "覆面レスラーが登場します。"}, {"t": 498.1333333333333, "x": "中にいたのは佐山聡でした。"}, {"t": 500.23333333333335, "x": "このとき、原作者である梶原一騎は2つの\n注文を出していたと記録されています。"}, {"t": 505.75, "x": "1つは、コーナーポスト最上段に\n軽々と飛び乗れるレスラーを使うこと。"}, {"t": 510.6, "x": "もう1つは、リングアナウンサーの\nコールに必ず「二世」を付けること。"}, {"t": 515.0, "x": "1つ目は守られました。"}, {"t": 516.65, "x": "2つ目は採用されていません。"}, {"t": 518.7333333333333, "x": "記録によれば、梶原からの\n抗議もなかったとされています。"}, {"t": 522.7333333333333, "x": "この日から、梶原一騎はプロレスの\n世界に深く関わっていくことになります。"}, {"t": 527.6333333333333, "x": "ここから先が、この回の山場です。"}, {"t": 530.3833333333333, "x": "1983年5月25日、\n梶原一騎は逮捕されました。"}, {"t": 535.8, "x": "容疑は、講談社の雑誌編集者に対する傷害です。"}, {"t": 539.9, "x": "逮捕は大きく報道されました。"}, {"t": 542.0, "x": "影響は仕事に直接出ています。"}, {"t": 544.2833333333333, "x": "連載中だった作品は打ち切りとなりました。"}, {"t": 547.15, "x": "単行本は絶版になっています。"}, {"t": 549.3833333333333, "x": "『巨人の星』も『あしたのジョー』も\n『タイガーマスク』も書いた人物の"}, {"t": 552.6833333333333, "x": "本が、書店から消えました。"}, {"t": 554.8833333333333, "x": "保釈されたのは、逮捕からおよそ2か月後です。"}, {"t": 558.2666666666667, "x": "そしてその直後に、体のほうが動かなくなります。"}, {"t": 561.8833333333333, "x": "1983年8月8日、東京の山の\n上ホテルで食事をした直後に倒れました。"}, {"t": 568.3666666666667, "x": "病名は壊死性劇症膵臓炎。"}, {"t": 570.8666666666667, "x": "手術は4回に及んでいます。"}, {"t": 573.0, "x": "4度目の手術のときには、\n医師団から「あと2時間の命」と"}, {"t": 577.0166666666667, "x": "告げられたと記録されています。"}, {"t": 578.75, "x": "このとき体重は87キロから\n60キロを割るところまで落ちました。"}, {"t": 583.0666666666667, "x": "それでも、命は助かっています。"}, {"t": 585.7, "x": "裁判の結果が出たのは、\n逮捕から1年10か月後でした。"}, {"t": 590.0333333333333, "x": "1985年3月14日、東京地方裁判所。"}, {"t": 594.8166666666667, "x": "言い渡されたのは、懲役2年、執行猶予3年です。"}, {"t": 599.4166666666666, "x": "求刑も懲役2年でした。"}, {"t": 601.3666666666667, "x": "判決から2か月後、梶原は仕事に戻ります。"}, {"t": 604.9666666666667, "x": "このころ、正木亜都という新しい筆名で\n小説の執筆も始めました。"}, {"t": 609.9666666666667, "x": "そして1985年5月24日、\n『週刊漫画ゴラク』で"}, {"t": 614.8333333333334, "x": "『男の星座』の連載が始まります。"}, {"t": 617.0333333333333, "x": "作画は原田久仁信。"}, {"t": 618.6166666666667, "x": "これは引退記念作品として始まった、\n自伝的な内容の漫画です。"}, {"t": 623.5166666666667, "x": "力道山、大山倍達、そして自分自身。"}, {"t": 627.6166666666667, "x": "自分が関わってきた格闘技の世界を、\n自分で書き直す作品でした。"}, {"t": 632.5, "x": "連載は1987年2月13日号まで続きます。"}, {"t": 637.0, "x": "ただし、完結していません。"}, {"t": 639.3666666666667, "x": "1987年1月21日、午後12時55分。"}, {"t": 644.7, "x": "東京女子医科大学病院で、\n梶原一騎は亡くなりました。"}, {"t": 648.9333333333333, "x": "死因は壊死性劇症膵臓炎です。"}, {"t": 651.6, "x": "1983年8月8日に\n倒れたときと同じ病名でした。"}, {"t": 656.2, "x": "50歳でした。"}, {"t": 657.4333333333333, "x": "『男の星座』は、未完のまま絶筆となっています。"}, {"t": 660.9333333333333, "x": "書いた人間がいなくなったあとも、\n覆面のほうは残りました。"}, {"t": 665.0166666666667, "x": "1984年8月26日、全日本プロレスで\n2代目タイガーマスクがデビューします。"}, {"t": 671.8, "x": "中にいたのは三沢光晴でした。"}, {"t": 674.0833333333334, "x": "1993年5月3日、\n新日本プロレスで3代目がデビュー。"}, {"t": 679.3666666666667, "x": "金本浩二です。"}, {"t": 680.6833333333333, "x": "1995年7月15日には、みちのく\nプロレスで4代目がデビューしました。"}, {"t": 686.6166666666667, "x": "4代目は2002年12月16日に\n新日本プロレスへ移籍しています。"}, {"t" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
