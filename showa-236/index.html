<script>
const D={"name": "梶原一騎", "file": "236_編集用", "dur": 926.7333125, "segs": [], "subs": [{"t": 0.0, "x": "1971年9月18日、日本テレビで\n1本のテレビアニメが最終回を迎えました。"}, {"t": 6.866666666666666, "x": "『巨人の星』です。"}, {"t": 8.116666666666667, "x": "1968年3月30日の\n放送開始から、全182話。"}, {"t": 13.8, "x": "3年半にわたって続いた番組でした。"}, {"t": 16.466666666666665, "x": "その11日後、1971年9月29日。"}, {"t": 20.85, "x": "フジテレビで『あしたのジョー』が\n最終回を迎えます。"}, {"t": 23.883333333333333, "x": "1970年4月1日の放送開始から、全79話。"}, {"t": 29.066666666666666, "x": "さらにその翌日、1971年9月30日。"}, {"t": 33.583333333333336, "x": "日本テレビで『タイガーマスク』が\n最終回を迎えました。"}, {"t": 36.9, "x": "1969年10月2日の\n放送開始から、全105話。"}, {"t": 41.86666666666667, "x": "12日のあいだに、\n3本のアニメが終わっています。"}, {"t": 45.483333333333334, "x": "そしてこの3本には、共通点が1つありました。"}, {"t": 49.2, "x": "原作を書いた人物が、同じなのです。"}, {"t": 52.166666666666664, "x": "名前は梶原一騎。"}, {"t": 53.733333333333334, "x": "その梶原一騎は、\n1983年5月25日に逮捕されます。"}, {"t": 59.3, "x": "そして1987年1月21日、\n50歳で亡くなりました。"}, {"t": 65.05, "x": "今回は、この男が残した記録を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 71.0, "x": "最後までご覧いただければ幸いです。"}, {"t": 73.5, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 79.06666666666666, "x": "まず、人物の基本情報から確認しておきます。"}, {"t": 82.9, "x": "梶原一騎は筆名です。"}, {"t": 84.81666666666666, "x": "本名は高森朝樹。"}, {"t": 86.48333333333333, "x": "1936年9月4日、\n東京市浅草区石浜の生まれです。"}, {"t": 91.88333333333334, "x": "現在の台東区にあたります。"}, {"t": 93.9, "x": "世に出たのは17歳のときでした。"}, {"t": 96.18333333333334, "x": "1953年、ボクシング小説『勝利のかげに』が\n雑誌『少年画報』の懸賞に入選しています。"}, {"t": 103.26666666666667, "x": "このときすでに、\n梶原一騎という筆名を使っていました。"}, {"t": 107.31666666666666, "x": "以後、少年向けのスポーツ小説を書き続けます。"}, {"t": 110.86666666666666, "x": "漫画の原作に本格的に入るのは1960年代です。"}, {"t": 115.18333333333334, "x": "1962年、プロレス漫画\n『チャンピオン太』の連載が始まりました。"}, {"t": 120.48333333333333, "x": "そして1966年、『巨人の星』が始まります。"}, {"t": 124.66666666666667, "x": "掲載誌は『週刊少年マガジン』。"}, {"t": 126.96666666666667, "x": "1966年19号から\n1971年3号までの連載でした。"}, {"t": 132.7, "x": "作画は川崎のぼる。"}, {"t": 134.31666666666666, "x": "主人公は星飛雄馬。"}, {"t": 136.01666666666668, "x": "父親の星一徹が、息子を巨人軍の投手に\n仕立てるために鍛え上げるという話です。"}, {"t": 141.9, "x": "飛雄馬が投げる球には、大リーグボール1号、\n2号、3号という名前が付けられました。"}, {"t": 148.68333333333334, "x": "2号は消える魔球と呼ばれています。"}, {"t": 151.06666666666666, "x": "この作品は第8回講談社児童\nまんが賞を受けました。"}, {"t": 154.76666666666668, "x": "単行本の累計発行部数は、2021年8月の\n時点で630万部と記録されています。"}, {"t": 161.91666666666666, "x": "続編にあたる『新巨人の星』は、1976年から\n1979年まで『週刊読売』で連載されました。"}, {"t": 170.15, "x": "1968年には2本が同時に走り出します。"}, {"t": 173.98333333333332, "x": "1本目が『あしたのジョー』。"}, {"t": 175.56666666666666, "x": "掲載誌は同じく『週刊少年マガジン』で、\n1968年から1973年までの連載です。"}, {"t": 183.2, "x": "作画はちばてつや。"}, {"t": 184.66666666666666, "x": "主人公は矢吹丈というボクサーです。"}, {"t": 187.25, "x": "この作品だけ、原作者の名前が違います。"}, {"t": 190.71666666666667, "x": "高森朝雄という別の筆名が使われました。"}, {"t": 193.7, "x": "『巨人の星』と同じ書き手だと\n読者に先入観を持たれることを、"}, {"t": 197.46666666666667, "x": "編集部が避けたためとされています。"}, {"t": 200.0, "x": "1970年3月には、作中で死亡した力石徹の\n葬儀が講談社の講堂で実際に営まれました。"}, {"t": 207.71666666666667, "x": "記録では、600名を超える人が\n集まったとされています。"}, {"t": 211.68333333333334, "x": "そして2本目が『タイガーマスク』です。"}, {"t": 213.91666666666666, "x": "作画は辻なおき。"}, {"t": 215.33333333333334, "x": "連載は3つの雑誌をまたいでいます。"}, {"t": 217.88333333333333, "x": "『ぼくら』の1968年1月号から\n1969年10月号まで。"}, {"t": 223.55, "x": "『週刊ぼくらマガジン』の\n1970年1号から1971年23号まで。"}, {"t": 229.81666666666666, "x": "『週刊少年マガジン』の\n1971年26号から53号まで。"}, {"t": 235.16666666666666, "x": "この漫画がアニメになったのが、\n冒頭で触れた1969年10月2日からの"}, {"t": 240.96666666666667, "x": "全105話です。"}, {"t": 242.06666666666666, "x": "『タイガーマスク』の設定も確認しておきます。"}, {"t": 244.85, "x": "覆面レスラーであるタイガーマスクの\n正体は、伊達直人という人物です。"}, {"t": 249.93333333333334, "x": "伊達直人は、ちびっこ\nハウスという孤児院で育ちました。"}, {"t": 253.76666666666668, "x": "そしてレスラーになるために入ったのが、\n虎の穴という悪役レスラーの養成機関です。"}, {"t": 259.4166666666667, "x": "虎の穴の決まりでは、所属レスラーは\nファイトマネーの半額を組織に"}, {"t": 263.98333333333335, "x": "納めることになっていました。"}, {"t": 265.55, "x": "伊達直人は、自分の手取りの分から\n育った孤児院に送金しようとします。"}, {"t": 270.53333333333336, "x": "ところが孤児院の窮状を知り、\n虎の穴へ納めるはずの分まで"}, {"t": 274.85, "x": "寄付せざるを得なくなっていきました。"}, {"t": 276.76666666666665, "x": "覆面を被って戦い、その金を施設の子どもに回す。"}, {"t": 280.78333333333336, "x": "この設定が、のちに現実の\n出来事として反復されることになります。"}, {"t": 285.43333333333334, "x": "『タイガーマスク二世』のほうは、\n1980年から1982年にかけての連載です。"}, {"t": 292.1166666666667, "x": "掲載誌は月刊『少年ポピー』から\n『増刊少年マガジン』へ移りました。"}, {"t": 296.55, "x": "ここまでを整理すると、こうなります。"}, {"t": 299.23333333333335, "x": "野球が『巨人の星』。"}, {"t": 300.75, "x": "ボクシングが『あしたのジョー』。"}, {"t": 302.3666666666667, "x": "プロレスが『タイガーマスク』。"}, {"t": 303.9, "x": "1960年代後半のテレビで\n流れていたスポーツ漫画の主要な枠を、"}, {"t": 308.9, "x": "1人の原作者が押さえていました。"}, {"t": 311.3, "x": "押さえていたのは、この3本だけではありません。"}, {"t": 314.56666666666666, "x": "1967年に『柔道一直線』。"}, {"t": 317.6333333333333, "x": "作画は永島慎二と斎藤ゆずるです。"}, {"t": 320.35, "x": "同じく1967年に『夕やけ番長』。"}, {"t": 323.6, "x": "作画は荘司としお。"}, {"t": 325.1333333333333, "x": "1970年にサッカー漫画の\n『赤き血のイレブン』。"}, {"t": 328.75, "x": "作画は園田光慶と深大路昇介。"}, {"t": 331.51666666666665, "x": "1972年には『柔道讃歌』。"}, {"t": 334.3, "x": "作画は貝塚ひろしです。"}, {"t": 336.1666666666667, "x": "野球、ボクシング、プロレス、柔道、サッカー。"}, {"t": 341.2, "x": "少年漫画のスポーツものの\n主要な競技が、ほぼ揃っています。"}, {"t": 345.6, "x": "そして1973年には\n『愛と誠』の連載も始まりました。"}, {"t": 350.03333333333336, "x": "作画はながやす巧。"}, {"t": 351.65, "x": "こちらは1975年に\n講談社漫画賞を受賞しています。"}, {"t": 356.1, "x": "仕事の量についても、記録が残っています。"}, {"t": 359.46666666666664, "x": "のちの『週刊プレイボーイ』のインタビューで、\n週刊誌に同時に5本の連載を"}, {"t": 364.3333333333333, "x": "持っていた時期があったことが語られています。"}, {"t": 366.78333333333336, "x": "書いていたのは1人です。"}, {"t": 368.3333333333333, "x": "作画はそれぞれ別の漫画家が担当していました。"}, {"t": 371.51666666666665, "x": "次に、この男と格闘技の関わりを見ていきます。"}, {"t": 375.1166666666667, "x": "プロレスとの接点は、\n少年漫画の仕事よりも先にありました。"}, {"t": 379.5, "x": "梶原は『東京中日スポーツ』で\n『力道山物語』を連載しています。"}, {"t": 384.03333333333336, "x": "この連載が好評を得た結果、\n力道山本人から直接、電話がかかってきました。"}, {"t": 390.26666666666665, "x": "ここから梶原と力道山は\n親密な関係になっていきます。"}, {"t": 394.15, "x": "のちに作品がテレビドラマになった際には、\n力道山が自分自身の役で出演する話を、"}, {"t": 400.21666666666664, "x": "本人が交渉して進めたと記録されています。"}, {"t": 403.4166666666667, "x": "書かれる側が、書いた人間に会いに来る。"}, {"t": 406.4166666666667, "x": "この関係の作り方が、以後ずっと続きました。"}, {"t": 409.8833333333333, "x": "空手のほうはさらに具体的です。"}, {"t": 412.05, "x": "大山倍達と最初に会ったのは\n1954年頃とされています。"}, {"t": 416.6333333333333, "x": "そして1957年から1959年までの3年間、\n梶原は大山道場で空手を習っていました。"}, {"t": 424.85, "x": "書く側が、実際に習っていたことになります。"}, {"t": 428.06666666666666, "x": "その大山倍達の半生を描いたのが\n『空手バカ一代』です。"}, {"t": 431.96666666666664, "x": "1971年6月、『週刊少年マガジン』で\n連載が始まりました。"}, {"t": 437.48333333333335, "x": "作画は第三部までがつのだじろう、\n第四部からが影丸譲也。"}, {"t": 442.26666666666665, "x": "連載は1977年まで続いています。"}, {"t": 445.7, "x": "この作品には、書き方\nそのものに特徴がありました。"}, {"t": 449.3833333333333, "x": "連載開始時の巻頭言で「これは事実談であり、\nこの男は実在する」とうたっています。"}, {"t": 455.28333333333336, "x": "実際には事実とフィクションが混ざっており、\nその割合はフィクションのほうに"}, {"t": 460.03333333333336, "x": "大きく傾いていたとされています。"}, {"t": 462.06666666666666, "x": "実在の人物を実名で扱い、\nその上に創作を重ねる。"}, {"t": 466.6166666666667, "x": "梶原一騎の書き方は、この時点ですでに\n現実と作品の境目に置かれていました。"}, {"t": 472.25, "x": "そして1981年、漫画の側と現実の\n側が入れ替わる出来事が起こります。"}, {"t": 478.53333333333336, "x": "1981年4月、テレビ朝日系でアニメ\n『タイガーマスク二世』の放送が始まりました。"}, {"t": 485.28333333333336, "x": "その数日後の1981年4月23日、蔵前国技館。"}, {"t": 490.93333333333334, "x": "新日本プロレスのリングに、\nタイガーマスクという名前の"}, {"t": 494.73333333333335, "x": "覆面レスラーが登場します。"}, {"t": 496.65, "x": "中にいたのは佐山聡でした。"}, {"t": 498.75, "x": "このとき、原作者である梶原一騎は2つの\n注文を出していたと記録されています。"}, {"t": 504.26666666666665, "x": "1つは、コーナーポスト最上段に\n軽々と飛び乗れるレスラーを使うこと。"}, {"t": 509.1166666666667, "x": "もう1つは、リングアナウンサーの\nコールに必ず「二世」を付けること。"}, {"t": 513.5166666666667, "x": "1つ目は守られました。"}, {"t": 515.1666666666666, "x": "2つ目は採用されていません。"}, {"t": 517.25, "x": "記録によれば、梶原からの\n抗議もなかったとされています。"}, {"t": 521.2666666666667, "x": "この日から、梶原一騎はプロレスの\n世界に深く関わっていくことになります。"}, {"t": 526.15, "x": "ここから先が、この回の山場です。"}, {"t": 528.9, "x": "1983年5月25日、\n梶原一騎は逮捕されました。"}, {"t": 534.3333333333334, "x": "容疑は、講談社の雑誌編集者に対する傷害です。"}, {"t": 538.4166666666666, "x": "逮捕は大きく報道されました。"}, {"t": 540.5166666666667, "x": "影響は仕事に直接出ています。"}, {"t": 542.8, "x": "連載中だった作品は打ち切りとなりました。"}, {"t": 545.6666666666666, "x": "単行本は絶版になっています。"}, {"t": 547.9, "x": "『巨人の星』も『あしたのジョー』も\n『タイガーマスク』 ": 690.0666666666667, "x": "初代のデビューから数えて、\n代が4つ重なりました。"}, {"t": 693.9, "x": "残ったのは、リングの\n上だけではありませんでした。"}, {"t": 697.2, "x": "2010年の年末から2011年にかけて、\n日本各地の児童相談所や児童養護施設に、"}, {"t": 703.5333333333333, "x": "匿名の寄付が相次ぎます。"}, {"t": 705.6666666666666, "x": "贈り主の名前は「伊達直人」でした。"}, {"t": 707.95, "x": "届けられたものはランドセルや\n文房具、現金などです。"}, {"t": 711.8333333333334, "x": "先駆けとなったのは前橋市在住の\n会社員だったと記録されています。"}, {"t": 716.2166666666667, "x": "漫画の中で孤児院に\n送金していた覆面レスラーの本名が、"}, {"t": 720.2, "x": "そのまま差出人の名前として使われました。"}, {"t": 723.3666666666667, "x": "この動きはタイガーマスク運動と呼ばれています。"}, {"t": 726.4166666666666, "x": "2017年には、前橋市が支援の\nプロジェクトを手掛けました。"}, {"t": 730.9166666666666, "x": "原作者が亡くなってから23年後に、作中の\n設定のほうが現実で動いたことになります。"}, {"t": 737.2, "x": "評価のほうも、後年に記録が残っています。"}, {"t": 740.6333333333333, "x": "1995年、梶原一騎の評伝\n『夕やけを見ていた男』が出版されました。"}, {"t": 746.8, "x": "再評価が始まったのは、この本が\nきっかけだったとされています。"}, {"t": 751.15, "x": "死去から8年後のことです。"}, {"t": 753.0833333333334, "x": "2005年には、東京アニメアワードで\n特別功労賞の原作者部門を受賞しました。"}, {"t": 758.9166666666666, "x": "本人が亡くなってから18年後になります。"}, {"t": 761.8, "x": "ここまでの事実を、日付で並べ直しておきます。"}, {"t": 765.1, "x": "1936年9月4日、\n東京市浅草区石浜に生まれる。"}, {"t": 770.3333333333334, "x": "本名は高森朝樹。"}, {"t": 772.0, "x": "1953年、17歳で\n『勝利のかげに』が『少年画報』に入選。"}, {"t": 777.4333333333333, "x": "1957年から1959年の3年間、\n大山道場で空手を習う。"}, {"t": 784.0166666666667, "x": "1962年、『チャンピオン太』連載開始。"}, {"t": 788.0166666666667, "x": "1966年19号、『巨人の星』連載開始。"}, {"t": 792.4666666666667, "x": "1967年、『柔道一直線』\n『夕やけ番長』連載開始。"}, {"t": 797.6666666666666, "x": "1968年、『あしたのジョー』と\n『タイガーマスク』の連載開始。"}, {"t": 802.6, "x": "1971年6月、『空手バカ一代』連載開始。"}, {"t": 807.2833333333333, "x": "1971年9月18日・29日・30日、\nアニメ3本が12日のあいだに最終回。"}, {"t": 814.7333333333333, "x": "1973年、『愛と誠』連載開始。"}, {"t": 818.65, "x": "1975年に講談社漫画賞。"}, {"t": 821.7, "x": "1981年4月23日、蔵前国技館で\nタイガーマスクが実在のリングに登場。"}, {"t": 828.7666666666667, "x": "1983年5月25日、傷害容疑で逮捕。"}, {"t": 833.5333333333333, "x": "連載は打ち切り、単行本は絶版。"}, {"t": 836.6, "x": "1983年8月8日、倒れる。手術4回。"}, {"t": 841.3833333333333, "x": "1985年3月14日、\n懲役2年・執行猶予3年の判決。"}, const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
