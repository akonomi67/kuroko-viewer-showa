67, "i": 191}, {"t": 617.8833333333333, "i": 192}, {"t": 622.8, "i": 193}, {"t": 625.5833333333334, "i": 194}, {"t": 628.95, "i": 195}, {"t": 634.9333333333333, "i": 196}], "subs": [{"t": 0.0, "x": "1972年3月6日、大田区体育館。"}, {"t": 4.1, "x": "新しいプロレス団体の、\n最初の興行が行われました。"}, {"t": 8.15, "x": "団体の名前は、新日本プロレス。"}, {"t": 10.983333333333333, "x": "作ったのは、アントニオ猪木です。"}, {"t": 13.55, "x": "この日のメインイベントは、猪木と\nカール・ゴッチの一騎打ちでした。"}, {"t": 17.633333333333333, "x": "時間無制限、1本勝負。"}, {"t": 20.333333333333332, "x": "結果は、ゴッチの勝ちです。"}, {"t": 22.5, "x": "つまり、団体を作った本人が、\n旗揚げ戦のメインで負けています。"}, {"t": 27.6, "x": "テレビ中継はありません。"}, {"t": 29.333333333333332, "x": "外国人選手は、ブッカーを兼ねたゴッチだけ。"}, {"t": 32.85, "x": "所属選手は、数えるほどしかいませんでした。"}, {"t": 36.13333333333333, "x": "今回は、新日本プロレスが旗揚げした\n1972年に何が起きていたのかを、"}, {"t": 41.983333333333334, "x": "具体的な日付と数字をもとに辿っていきます。"}, {"t": 45.13333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 47.63333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 53.21666666666667, "x": "まず、この団体ができた\n経緯を確認しておきます。"}, {"t": 56.96666666666667, "x": "1971年まで、日本の\nプロレス団体は事実上1つでした。"}, {"t": 62.166666666666664, "x": "日本プロレスです。"}, {"t": 63.5, "x": "力道山が作った会社で、力道山の死後は\nジャイアント馬場とアントニオ猪木が"}, {"t": 68.63333333333334, "x": "看板を務めていました。"}, {"t": 70.15, "x": "2人は1960年9月30日に\n同じ日にデビューした同期です。"}, {"t": 74.86666666666666, "x": "ただし、この会社は内側で\n問題を抱えていました。"}, {"t": 78.76666666666667, "x": "経営が不透明で、選手の\n待遇にも不満がありました。"}, {"t": 82.78333333333333, "x": "1971年、猪木はこの\n状況を変えようと動きます。"}, {"t": 87.55, "x": "会社の経営に手を\n入れようとした、という形です。"}, {"t": 91.18333333333334, "x": "当時の日本プロレスは、力道山が\n亡くなってから8年が経っていました。"}, {"t": 95.9, "x": "興行は回っていましたが、金の流れが\n不透明だという声が選手の中にありました。"}, {"t": 101.5, "x": "猪木はそこに手を入れようとします。"}, {"t": 103.68333333333334, "x": "ただし、これは会社の\n上層部を入れ替える話です。"}, {"t": 107.56666666666666, "x": "成功すれば改革、失敗すれば\nクーデターと呼ばれます。"}, {"t": 111.68333333333334, "x": "しかし、その動きは失敗しました。"}, {"t": 114.61666666666666, "x": "1971年12月、猪木は\n日本プロレスの選手会から除名されます。"}, {"t": 120.51666666666667, "x": "会社からも永久追放という扱いになりました。"}, {"t": 123.68333333333334, "x": "理由として挙げられたのは、\nクーデターを画策したというものです。"}, {"t": 127.95, "x": "このとき猪木は28歳。"}, {"t": 129.91666666666666, "x": "日本プロレスの看板選手であり、\nテレビ中継の主役でもありました。"}, {"t": 134.75, "x": "プロレスラーにとって、\n28歳は最も体が動く時期です。"}, {"t": 139.25, "x": "そこで、所属団体を失いました。"}, {"t": 142.06666666666666, "x": "しかも「永久追放」という扱いです。"}, {"t": 144.55, "x": "一時的な処分ではなく、\n戻れないという意味になります。"}, {"t": 148.51666666666668, "x": "その選手が、行き場を失いました。"}, {"t": 151.3, "x": "当時の日本には、他に大きな団体がありません。"}, {"t": 154.83333333333334, "x": "国際プロレスはありましたが、\n規模も方向性も違います。"}, {"t": 158.83333333333334, "x": "つまり、日本プロレスを追われると\nいうことは、日本のプロレスの"}, {"t": 163.21666666666667, "x": "中心から外れるということでした。"}, {"t": 165.31666666666666, "x": "猪木が選んだのは、自分で団体を作ることです。"}, {"t": 168.91666666666666, "x": "1972年1月13日、\n新日本プロレスを設立します。"}, {"t": 174.4, "x": "そして3月6日、大田区体育館で\n旗揚げ戦を行いました。"}, {"t": 178.95, "x": "ここで、旗揚げ時の陣容を確認します。"}, {"t": 182.06666666666666, "x": "日本人選手は、魁勝司、山本小鉄、\n柴田勝久、木戸修、藤波辰巳。"}, {"t": 189.98333333333332, "x": "そして、豊登。"}, {"t": 191.8, "x": "豊登は、かつて日本プロレスから猪木を\n引き抜いて東京プロレスを作った人物です。"}, {"t": 197.65, "x": "その団体は3か月で消えていますが、\nこの旗揚げには名前を連ねていました。"}, {"t": 202.86666666666667, "x": "外国人選手は、カール・ゴッチ1人です。"}, {"t": 206.1, "x": "ゴッチは選手であると同時に、\nブッカーとして外国人の手配も担当しました。"}, {"t": 211.35, "x": "レフェリーはユセフ・トルコ。"}, {"t": 212.93333333333334, "x": "これが全部です。"}, {"t": 214.15, "x": "当時の日本のプロレス興行は、\n外国人選手の数で規模が決まりました。"}, {"t": 219.1, "x": "1シリーズに5人から10人の外国人を\n呼び、日本人選手と当てていく。"}, {"t": 224.16666666666666, "x": "それが基本の作り方です。"}, {"t": 226.08333333333334, "x": "新日本プロレスには、その\n名簿がありませんでした。"}, {"t": 229.73333333333332, "x": "外国人を呼ぶには、現地に\n信用のある人間が必要です。"}, {"t": 234.08333333333334, "x": "そこを1人で背負ったのがゴッチでした。"}, {"t": 236.51666666666668, "x": "旗揚げ戦のカードも見ておきます。"}, {"t": 238.73333333333332, "x": "メインは猪木とゴッチ。"}, {"t": 240.23333333333332, "x": "その下は、若い日本人選手同士の\n試合が並びました。"}, {"t": 244.38333333333333, "x": "外国人がいないので、そうするしかありません。"}, {"t": 247.61666666666667, "x": "会場は大田区体育館です。"}, {"t": 249.75, "x": "東京の大きな会場ではありません。"}, {"t": 252.1, "x": "比較のために、当時の\n日本プロレスを見ておきます。"}, {"t": 255.7, "x": "日本 const a=document.getElementById('a'), v=document.getElementById('v');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
const src=i=>'f/'+String(i).padStart(4,'0')+'.jpg';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　カット'+D.n_cuts+'　字幕'+D.subs.length+'</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function seg(t){let lo=0,hi=D.segs.length-1,r=0;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.segs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-1;
function preload(i){for(let k=1;k<=4;k++){const s=D.segs[i+k]; if(s)new Image().src=src(s.i)}}
function paint(t){
  const i=seg(t);
  if(i!==cur){cur=i; v.src=src(D.segs[i].i);
    bdg.textContent='カット '+(i+1)+' / '+D.segs.length;
    mark('cuts',i); preload(i); }
  mark('subs',subIdx(t));
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b>'+fmt(s.t)+'</b><span></span>';
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
D.segs.forEach(s=>{const f=document.createElement('figure');
  f.innerHTML='<img loading="lazy" src="'+src(s.i)+'"><em>'+fmt(s.t)+'</em>';
  f.onclick=()=>go(s.t); document.getElementById('cuts').appendChild(f)});
const mk=document.getElementById('mk');
D.segs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,D.dur-0.05); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>go(D.segs[Math.max(0,seg(a.currentTime)-1)].t);
document.getElementById('nx').onclick=()=>go(D.segs[Math.min(D.segs.length-1,seg(a.currentTime)+1)].t);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('subs').hidden=b.dataset.p!=='subs';
  document.getElementById('cuts').hidden=b.dataset.p!=='cuts'});
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
