<script>
const D={"name": "北尾光司", "file": "258_編集用", "dur": 916.25, "segs": [], "subs": [{"t": 0.0, "x": "1990年2月10日、東京ドーム。"}, {"t": 3.65, "x": "新日本プロレスの大会です。"}, {"t": 5.783333333333333, "x": "1人の新人が、デビュー戦の\nリングに上がりました。"}, {"t": 9.533333333333333, "x": "革ジャンにサングラス姿での入場です。"}, {"t": 12.266666666666667, "x": "トップロープを飛び越えてリングに入ります。"}, {"t": 14.8, "x": "着ていた黄色いタンクトップを、\n自分の手で引き裂いてみせました。"}, {"t": 18.866666666666667, "x": "客席からは失笑が起きました。"}, {"t": 21.05, "x": "「帰れ」という声まで飛んでいます。"}, {"t": 23.116666666666667, "x": "新人の名は、北尾光司。"}, {"t": 25.4, "x": "2年余り前まで、大相撲の第60代横綱でした。"}, {"t": 29.55, "x": "四股名は双羽黒です。"}, {"t": 31.15, "x": "この日、北尾は\nクラッシャー・バンバン・ビガロに勝ちました。"}, {"t": 34.68333333333333, "x": "ところがその後の1年2か月で、\n北尾は新日本プロレスを去ります。"}, {"t": 39.45, "x": "次に入ったSWSからもいなくなります。"}, {"t": 42.416666666666664, "x": "そして29年後。"}, {"t": 44.016666666666666, "x": "北尾はデビュー戦と\n同じ2月10日に亡くなりました。"}, {"t": 47.18333333333333, "x": "55歳でした。"}, {"t": 48.5, "x": "その死が世間に伝えられたのは\n1か月半以上たってからでした。"}, {"t": 52.5, "x": "なぜ東京ドームでデビューした元横綱は、2つの\n団体を1年余りで去ることになったのでしょうか。"}, {"t": 58.93333333333333, "x": "今回は、北尾光司という1人の\nプロレスラーの歩みを辿ります。"}, {"t": 63.3, "x": "手がかりは、当時の報道と記録に残る日付です。"}, {"t": 66.91666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 69.4, "x": "それでは本編に入る前に。"}, {"t": 71.45, "x": "チャンネル登録と高評価をよろしく\nお願いいたします。"}, {"t": 74.81666666666666, "x": "北尾光司は1963年、\n三重県津市に生まれました。"}, {"t": 79.58333333333333, "x": "地元の中学校を卒業します。"}, {"t": 81.95, "x": "そして立浪部屋に入門しました。"}, {"t": 84.3, "x": "1979年春場所に15歳で初土俵を踏みました。"}, {"t": 88.65, "x": "四股名は本名の北尾です。"}, {"t": 90.6, "x": "このとき身長195センチ。"}, {"t": 92.98333333333333, "x": "体重は110キロでした。"}, {"t": 94.86666666666666, "x": "入門した時点で、末は大関、\n横綱間違いなしと言われていました。"}, {"t": 100.06666666666666, "x": "幕下の時代には持病の腰痛がありました。"}, {"t": 102.91666666666667, "x": "それを治すため、太極拳を\n独学で身につけたといいます。"}, {"t": 107.06666666666666, "x": "1984年秋場所に新入幕。"}, {"t": 110.18333333333334, "x": "このとき21歳です。"}, {"t": 111.95, "x": "身長は199センチになっていました。"}, {"t": 114.9, "x": "入幕2場所目には、横綱から金星を挙げます。"}, {"t": 118.56666666666666, "x": "3人の大関も破り、殊勲賞を受けました。"}, {"t": 122.11666666666666, "x": "1985年九州場所の後に大関へ昇進しました。"}, {"t": 126.56666666666666, "x": "1986年名古屋場所の後には、\n横綱に昇進します。"}, {"t": 131.53333333333333, "x": "22歳11か月でした。"}, {"t": 133.58333333333334, "x": "昇進前の2場所の成績は、12勝と14勝です。"}, {"t": 137.95, "x": "12勝は優勝次点で、14勝は優勝同点でした。"}, {"t": 142.35, "x": "部屋には関取がいませんでした。"}, {"t": 144.48333333333332, "x": "そのため横綱を目指す場所の前には、\nほかの部屋へ出向きました。"}, {"t": 148.71666666666667, "x": "そこで稽古を重ねていました。"}, {"t": 150.68333333333334, "x": "ただし幕内優勝は1度もありません。"}, {"t": 153.26666666666668, "x": "横綱審議委員会では、反対意見も出ていました。"}, {"t": 157.06666666666666, "x": "理由は優勝経験がないことでした。"}, {"t": 159.53333333333333, "x": "昇進にあわせて名前を双羽黒に改めます。"}, {"t": 162.68333333333334, "x": "昔の横綱2人の四股名から\n1字ずつ取った名前です。"}, {"t": 166.23333333333332, "x": "1987年12月下旬、双羽黒は\n師匠と対立して部屋を出ました。"}, {"t": 172.18333333333334, "x": "報道では、ちゃんこの味を\nめぐる言い合いが伝えられています。"}, {"t": 176.11666666666667, "x": "付け人が集団で部屋を出たことも報じられました。"}, {"t": 179.2, "x": "そして1987年の大みそか、12月31日。"}, {"t": 184.11666666666667, "x": "廃業が決まりました。"}, {"t": 185.65, "x": "このとき24歳です。"}, {"t": 187.4, "x": "横綱在位は8場所で、\n賜杯を抱くことはありませんでした。"}, {"t": 191.75, "x": "横綱へ上げる条件は、その後厳しくなりました。"}, {"t": 195.41666666666666, "x": "この一件がきっかけになったとされています。"}, {"t": 198.11666666666667, "x": "廃業後の北尾は、\nスポーツ冒険家という肩書を名乗りました。"}, {"t": 202.48333333333332, "x": "テレビなどに出る時期を過ごします。"}, {"t": 204.51666666666668, "x": "そして1989年、\nプロレスへの転向を宣言しました。"}, {"t": 209.46666666666667, "x": "デビューの舞台は冒頭の東京ドーム大会でした。"}, {"t": 212.66666666666666, "x": "1990年2月10日、\n新日本プロレスの大会です。"}, {"t": 217.31666666666666, "x": "新人のデビュー戦が東京ドームで\n組まれるのは異例です。"}, {"t": 220.86666666666667, "x": "試合はギロチンドロップで決着しました。"}, {"t": 223.51666666666668, "x": "北尾がビガロに勝っています。"}, {"t": 225.31666666666666, "x": "ただしロープに\n走る向きを間違える場面もありました。"}, {"t": 228.58333333333334, "x": "内容は厳しく評価されています。"}, {"t": 230.93333333333334, "x": "4日後の2月14日。"}, {"t": 232.75, "x": "テレビ朝日は、この大会を特番で放送しました。"}, {"t": 236.43333333333334, "x": "ビデオリサーチ調べで、\n平均視聴率は20.2パーセントです。"}, {"t": 241.05, "x": "瞬間最高は25.3パーセントでした。"}, {"t": 244.33333333333334, "x": "プロレスの番組が20パーセントを\n超えたのは7年ぶりでした。"}, {"t": 248.2, "x": "数字は取れました。"}, {"t": 249.53333333333333, "x": "しかしその後、北尾は新日本で十数試合に出ます。"}, {"t": 253.4, "x": "それでも、ファンの支持を\n集めることはありませんでした。"}, {"t": 257.0, "x": "1990年7月23日、\n青森県八戸市のホテルの駐車場。"}, {"t": 262.93333333333334, "x": "この日は十和田大会がありました。"}, {"t": 265.06666666666666, "x": "その大会に出るかどうかで、\n北尾と長州力が言い合いになります。"}, {"t": 269.55, "x": "長州は現場の責任者でした。"}, {"t": 271.8, "x": "2人はもみ合いにまでなりました。"}, {"t": 273.8, "x": "北尾は椎間板ヘルニアを理由に、\n欠場を希望していました。"}, {"t": 278.1333333333333, "x": "長州は試合に出るよう求めたと報じられています。"}, {"t": 281.3666666666667, "x": "北尾は東京スポーツに、こう話していました。"}, {"t": 284.5833333333333, "x": "「ストリートファイトでもOKだ」この後、\n北尾は新日本のリングに上がっていません。"}, {"t": 289.75, "x": "所属事務所と坂口征二社長が会談します。"}, {"t": 292.93333333333334, "x": "そして新日本との契約は解除されました。"}, {"t": 295.8666666666667, "x": "新日本側は、円満な解除と説明しています。"}, {"t": 299.6666666666667, "x": "一方でデイリースポーツやナンバーの\n記事は、別の原因を伝えています。"}, {"t": 304.45, "x": "長州への暴言が原因だったというものです。"}, {"t": 307.3833333333333, "x": "解除の時期は、記事によって幅があります。"}, {"t": 310.48333333333335, "x": "7月の騒ぎから約2か月後とも、\nデビューから約5か月後とも書かれています。"}, {"t": 316.1333333333333, "x": "1つ目の団体は、こうして1年\nたたずに終わりました。"}, {"t": 320.0, "x": "北尾が次に頼ったのは、天龍源一郎です。"}, {"t": 323.5833333333333, "x": "天龍は相撲の先輩にあたります。"}, {"t": 325.95, "x": "1990年11月1日、北尾は\n天龍の紹介でSWSに入団しました。"}, {"t": 332.75, "x": "SWSはメガネスーパーがお金を出した団体です。"}, {"t": 336.4, "x": "1990年5月に立ち上がったばかりでした。"}, {"t": 339.81666666666666, "x": "北尾はこのとき、天龍のことを\nこう語ったとされています。"}, {"t": 343.81666666666666, "x": "「真っ暗な洞窟でもがく俺に\n見えた蜘蛛の糸でした」11月10日には"}, {"t": 348.1166666666667, "x": "若手との試合に勝ちました。"}, {"t": 349.8, "x": "11月22日には浜松アリーナで、\nタッグのトーナメントに優勝します。"}, {"t": 355.43333333333334, "x": "組んだ相手は天龍でした。"}, {"t": 357.28333333333336, "x": "12月19日には箱根の\nホテルで忘年会が開かれました。"}, {"t": 361.26666666666665, "x": "北尾は酒をほとんど飲みませんでした。"}, {"t": 363.73333333333335, "x": "目立たないように座っていたといいます。"}, {"t": 366.06666666666666, "x": "当時を取材した記者は、\n北尾のこんな言葉を書いています。"}, {"t": 369.93333333333334, "x": "「変人に見られるのが嫌なんです」\n打ち解けた後の北尾には、"}, {"t": 373.3, "x": "子どもっぽい一面もありました。"}, {"t": 375.51666666666665, "x": "同じ記者が書いていることです。"}, {"t": 377.4, "x": "カラオケではアニメの歌を熱唱しました。"}, {"t": 379.95, "x": "天龍やカブキを困らせたそうです。"}, {"t": 382.26666666666665, "x": "映画のロッキーにも夢中になりました。"}, {"t": 384.6166666666667, "x": "主人公の服装をまねて、\n取材の場に現れたこともありました。"}, {"t": 389.03333333333336, "x": "そして1991年3月30日、東京ドーム。"}, {"t": 393.71666666666664, "x": "SWSとアメリカのWWFが組んだ大会です。"}, {"t": 397.7, "x": "北尾はジョン・テンタと\n1対1で戦い、敗れました。"}, {"t": 401.7, "x": "テンタはカナダ生まれです。"}, {"t": 403.3, "x": "北尾と同じ1963年に生まれています。"}, {"t": 406.76666666666665, "x": "しかもテンタは、1985年に大相撲の\n佐渡ヶ嶽部屋へ入門していました。"}, {"t": 413.2, "x": "力士として土俵に上がった経歴の持ち主です。"}, {"t": 416.1666666666667, "x": "序ノ口、序二段、三段目と勝ち続けました。"}, {"t": 420.25, "x": "3つの場所を続けて、\n負けなしで優勝しています。"}, {"t": 423.9166666666667, "x": "しかし1986年に、幕下にいた\nテンタは場所の前に姿を消しました。"}, {"t": 429.7, "x": "そして相撲をやめ、プロレスへ移りました。"}, {"t": 432.76666666666665, "x": "元横綱と元力士の顔合わせです。"}, {"t": 435.26666666666665, "x": "その2日後の1991年4月1日、\n神戸ワールド記念ホール。"}, {"t": 440.8666666666667, "x": "北尾とテンタはもう一度同じ\nリングで向き合いました。"}, {"t": 443.98333333333335, "x": "試合の中で北尾は、本部席の机を持ち上げます。"}, {"t": 447.85, "x": "その机をリングに投げ入れています。"}, {"t": 450.2, "x": "2人は目つぶしの構えで向き合いました。"}, {"t": 452.6666666666667, "x": "組み合わない時間が続きました。"}, {"t": 454.68333333333334, "x": "北尾はレフェリーを蹴りました。"}, {"t": 456.45, "x": "試合は北尾の反則負けになりました。"}, {"t": 458.95, "x": "試合の後、北尾はマイクを握ります。"}, {"t": 461.93333333333334, "x": "そしてテンタに向かって、こう叫んでいます。"}, {"t": 465.0, "x": "「八百長野郎」この言葉が\nこの夜の騒ぎの中心になりました。"}, {"t": 468.81666666666666, "x": "この騒ぎの後、SWSは北尾を解雇しました。"}, {"t": 472.81666666666666, "x": "入団からわずか5か月でした。"}, {"t": 474.9, "x": "責任をとる形で、2人の男が辞表を出します。"}, {"t": 478.65, "x": "天龍と、マッチメーカーを務めていた\nザ・グレート・カブキです。"}, {"t": 482.96666666666664, "x": "宛先は田中八郎社長でした。"}, {"t": 485.28333333333336, "x": "辞表は受け取られませんでした。"}, {"t": 487.26666666666665, "x": "それでも2人は、\nマッチメーカーなどの役職を降りています。"}, {"t": 491.3666666666667, "x": "2つ目の団体も、\nこうして北尾の前から消えました。"}, {"t": 494.98333333333335, "x": "デビュー戦から数えて、1年2か月のことです。"}, {"t": 498.56666666666666, "x": "この件について意外な人物が言葉を残しています。"}, {"t": 501.9 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
