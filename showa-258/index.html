<script>
const D={"name": "北尾光司", "file": "258_編集用", "dur": 881.16665625, "segs": [], "subs": [{"t": 0.0, "x": "1990年2月10日、東京ドーム。"}, {"t": 3.65, "x": "新日本プロレスの大会で、1人の新人が\nデビュー戦のリングに上がりました。"}, {"t": 8.85, "x": "革ジャンにサングラス姿で入場し、\nトップロープを飛び越えてリングに入ります。"}, {"t": 14.216666666666667, "x": "着ていた黄色いタンクトップを、\n自分の手で引き裂いてみせました。"}, {"t": 18.266666666666666, "x": "客席からは失笑が起き、\n「帰れ」という声まで飛んでいます。"}, {"t": 22.533333333333335, "x": "新人の名は、北尾光司。"}, {"t": 24.816666666666666, "x": "2年余り前まで、大相撲の第60代横綱、\n双羽黒と呼ばれていた男です。"}, {"t": 31.033333333333335, "x": "この日、北尾は\nクラッシャー・バンバン・ビガロに勝ちました。"}, {"t": 34.56666666666667, "x": "ところがその後の1年2か月で、\n北尾は新日本プロレスからも、"}, {"t": 39.016666666666666, "x": "次に入ったSWSからもいなくなります。"}, {"t": 42.2, "x": "そして29年後、北尾はデビュー戦と\n同じ2月10日に、55歳で亡くなりました。"}, {"t": 48.55, "x": "その死が世間に伝えられたのは、\n1か月半以上たってからのことでした。"}, {"t": 53.416666666666664, "x": "なぜ東京ドームでデビューした元横綱は、2つの\n団体を1年余りで去ることになったのでしょうか。"}, {"t": 59.85, "x": "今回は、北尾光司という1人の\nプロレスラーの歩みを、当時の報道と"}, {"t": 64.98333333333333, "x": "記録に残る日付で辿っていきます。"}, {"t": 67.15, "x": "最後までご覧いただければ幸いです。"}, {"t": 69.65, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 75.21666666666667, "x": "北尾光司は1963年、\n三重県津市に生まれました。"}, {"t": 79.98333333333333, "x": "地元の中学校を卒業すると、\n立浪部屋に入門します。"}, {"t": 84.56666666666666, "x": "1979年春場所、15歳で本名の\n北尾として初土俵を踏みました。"}, {"t": 90.48333333333333, "x": "このとき身長195センチ、体重110キロ。"}, {"t": 94.71666666666667, "x": "入門した時点で、末は大関、\n横綱は間違いないと言われていました。"}, {"t": 100.08333333333333, "x": "幕下の時代には、持病の腰痛を治すために、\n太極拳を独学で身につけたといいます。"}, {"t": 106.46666666666667, "x": "1984年秋場所に新入幕。"}, {"t": 109.6, "x": "このとき21歳で、身長は\n199センチになっていました。"}, {"t": 114.3, "x": "入幕2場所目には横綱から金星を挙げ、\n3人の大関も破って、殊勲賞を受けています。"}, {"t": 121.05, "x": "1985年九州場所の後に大関へ昇進しました。"}, {"t": 125.5, "x": "1986年名古屋場所の後、\n22歳11か月で横綱に昇進します。"}, {"t": 131.81666666666666, "x": "昇進前の2場所は、12勝で優勝次点、\n14勝で優勝同点という成績でした。"}, {"t": 138.71666666666667, "x": "部屋に関取がいなかったため、\n横綱を目指す場所の前には、"}, {"t": 142.95, "x": "ほかの部屋へ出向いて稽古を重ねていました。"}, {"t": 145.76666666666668, "x": "ただし幕内優勝は1度もありません。"}, {"t": 148.35, "x": "横綱審議委員会では、優勝経験がないことを\n理由に反対意見も出ていました。"}, {"t": 154.03333333333333, "x": "昇進にあわせて、昔の横綱2人の四股名から\n1字ずつ取り、双羽黒に改名しています。"}, {"t": 160.63333333333333, "x": "1987年12月下旬、双羽黒は\n師匠と対立して部屋を出ました。"}, {"t": 166.6, "x": "報道では、ちゃんこの味を\nめぐる言い合いや、付け人が集団で"}, {"t": 171.08333333333334, "x": "部屋を出たことが伝えられています。"}, {"t": 173.01666666666668, "x": "そして1987年の大みそか、\n12月31日に廃業が決まりました。"}, {"t": 179.18333333333334, "x": "24歳、横綱在位は8場所で、\n賜杯を抱くことはありませんでした。"}, {"t": 184.86666666666667, "x": "この一件をきっかけに、横綱へ上げる条件は\n厳しくなったとされています。"}, {"t": 190.05, "x": "廃業後の北尾は、スポーツ冒険家という肩書で\nテレビなどに出る時期を過ごします。"}, {"t": 195.46666666666667, "x": "そして1989年、\nプロレスへの転向を宣言しました。"}, {"t": 200.4, "x": "デビューの舞台に選ばれたのは、\n冒頭の1990年2月10日、"}, {"t": 205.38333333333333, "x": "新日本プロレスの東京ドーム大会でした。"}, {"t": 208.46666666666667, "x": "新人のデビュー戦が東京ドームで\n組まれるのは、異例の扱いです。"}, {"t": 213.05, "x": "試合はギロチンドロップで決着し、\n北尾がビガロに勝っています。"}, {"t": 217.58333333333334, "x": "ただし、ロープに走る向きを間違える場面もあり、\n内容は厳しく評価されました。"}, {"t": 223.7, "x": "4日後の2月14日、テレビ朝日は\nこの大会を特番で放送しました。"}, {"t": 229.1, "x": "ビデオリサーチ調べで\n平均視聴率は20.2パーセント、"}, {"t": 232.93333333333334, "x": "瞬間最高は25.3パーセントです。"}, {"t": 236.3, "x": "プロレスの番組が20パーセントを\n超えたのは、7年ぶりのことでした。"}, {"t": 240.91666666666666, "x": "数字は取れました。"}, {"t": 242.25, "x": "しかしその後、新日本で十数試合に出た北尾が、\nファンの支持を集めることはありませんでした。"}, {"t": 248.73333333333332, "x": "1990年7月23日、\n青森県八戸市のホテルの駐車場。"}, {"t": 254.66666666666666, "x": "この日の十和田大会に出るかどうかで、\n北尾と現場責任者の長州力が"}, {"t": 259.55, "x": "言い合いになり、もみ合いになりました。"}, {"t": 262.03333333333336, "x": "北尾は椎間板ヘルニアを理由に欠場を希望し、\n長州は試合に出るよう求めたと報じられています。"}, {"t": 268.8666666666667, "x": "北尾は東京スポーツに対し、\n「ストリートファイトでもOKだ」と"}, {"t": 273.1, "x": "話していました。"}, {"t": 274.03333333333336, "x": "この後、北尾は新日本の\nリングに上がっていません。"}, {"t": 277.6666666666667, "x": "所属事務所と坂口征二社長の会談を経て、\n新日本との契約は解除されました。"}, {"t": 283.56666666666666, "x": "新日本側は円満な解除と説明しています。"}, {"t": 286.8333333333333, "x": "一方で、デイリースポーツや\nナンバーの記事は、長州への暴言が"}, {"t": 291.6333333333333, "x": "契約解除の原因だったと伝えています。"}, {"t": 294.2, "x": "解除の時期は、7月の騒ぎから約2か月後とも、\nデビューから約5か月後とも書かれ、"}, {"t": 300.71666666666664, "x": "記事によって幅があります。"}, {"t": 302.71666666666664, "x": "1つ目の団体は、こうして1年\nたたずに終わりました。"}, {"t": 306.5833333333333, "x": "北尾が次に頼ったのは、\n相撲の先輩にあたる天龍源一郎です。"}, {"t": 311.4166666666667, "x": "1990年11月1日、北尾は\n天龍の紹介でSWSに入団しました。"}, {"t": 318.21666666666664, "x": "SWSは、メガネスーパーが資金を出して、\n1990年5月に立ち上がったばかりの団体です。"}, {"t": 325.75, "x": "北尾はこのとき、\n天龍のことを"}, {"t": 328.1166666666667, "x": "「真っ暗な洞窟でもがく俺に見えた蜘蛛の\n糸でした」と語ったとされています。"}, {"t": 332.51666666666665, "x": "11月10日には若手との試合に勝ち、\n11月22日には浜松アリーナで天龍と"}, {"t": 338.76666666666665, "x": "組んだタッグのトーナメントに優勝しました。"}, {"t": 341.31666666666666, "x": "12月19日、箱根の\nホテルで開かれた忘年会では、"}, {"t": 345.43333333333334, "x": "北尾は酒をほとんど飲まず、\n目立たないように座っていたといいます。"}, {"t": 350.26666666666665, "x": "当時を取材した記者は、北尾が\n「変人に見られるのが嫌なんです」と"}, {"t": 354.48333333333335, "x": "話していたと書いています。"}, {"t": 355.96666666666664, "x": "同じ記者によると、打ち解けた後の\n北尾には子どもっぽい一面もありました。"}, {"t": 360.8666666666667, "x": "カラオケではアニメの歌を熱唱し、\n天龍やカブキを困らせたそうです。"}, {"t": 365.8, "x": "映画のロッキーに夢中になり、主人公の服装を\nまねて取材の場に現れたこともありました。"}, {"t": 371.8333333333333, "x": "そして1991年3月30日、東京ドーム。"}, {"t": 376.51666666666665, "x": "SWSとアメリカのWWFが組んだ大会で、\n北尾はジョン・テンタと"}, {"t": 381.8333333333333, "x": "1対1で戦い、敗れました。"}, {"t": 384.56666666666666, "x": "テンタはカナダ生まれで、\n北尾と同じ1963年生まれです。"}, {"t": 389.43333333333334, "x": "しかもテンタは1985年に大相撲の\n佐渡ヶ嶽部屋へ入門し、力士として土俵に"}, {"t": 396.4, "x": "上がった経歴を持っていました。"}, {"t": 398.18333333333334, "x": "序ノ口、序二段、三段目と、3つの\n場所を続けて負けなしで優勝しています。"}, {"t": 404.75, "x": "しかし1986年、幕下にいた\nテンタは場所の前に姿を消し、"}, {"t": 410.3333333333333, "x": "相撲をやめてプロレスへ移りました。"}, {"t": 412.9166666666667, "x": "元横綱と元力士の顔合わせです。"}, {"t": 415.4166666666667, "x": "その2日後の1991年4月1日、\n神戸ワールド記念ホール。"}, {"t": 421.01666666666665, "x": "北尾とテンタは、もう一度\n同じリングで向き合いました。"}, {"t": 424.73333333333335, "x": "試合の中で北尾は、本部席の机を\n持ち上げてリングに投げ入れています。"}, {"t": 429.73333333333335, "x": "目つぶしの構えで向き合ったまま、\n組み合わない時間が続きました。"}, {"t": 434.1166666666667, "x": "北尾がレフェリーを蹴り、\n試合は北尾の反則負けになりました。"}, {"t": 438.26666666666665, "x": "試合の後、北尾はマイクを握り、テンタに\n向かって「八百長野郎」と叫んでいます。"}, {"t": 444.1, "x": "この言葉が、この夜の騒ぎの中心になりました。"}, {"t": 447.71666666666664, "x": "この騒ぎの後、SWSは北尾を解雇しました。"}, {"t": 451.7, "x": "入団からわずか5か月でした。"}, {"t": 453.8, "x": "責任をとる形で、天龍と、マッチメーカーを\n務めていたザ・グレート・カブキは、"}, {"t": 459.7, "x": "田中八郎社長に辞表を出しました。"}, {"t": 462.43333333333334, "x": "辞表は受け取られませんでしたが、2人は\nマッチメーカーなどの役職を降りています。"}, {"t": 467.78333333333336, "x": "2つ目の団体も、\nこうして北尾の前から消えました。"}, {"t": 471.4, "x": "デビュー戦から数えて、1年2か月のことです。"}, {"t": 474.98333333333335, "x": "この件について、\n意外な人物が言葉を残しています。"}, {"t": 479.0, "x": "騒ぎから何日かたった地方の巡業先で、\nジャイアント馬場がこう話していました。"}, {"t": 484.56666666666666, "x": "「レスラーは連敗というのは嫌なものなんだ。"}, {"t": 487.15, "x": "プライドもあるしな」宿舎に\n戻った北尾は落ち着きを取り戻し、"}, {"t": 490.5833333333333, "x": "反省していたとも伝えられています。"}, {"t": 493.1, "x": "SWSはその後、選手の間で派閥が\n分かれ、1992年6月19日の"}, {"t": 499.9166666666667, "x": "長崎大会を最後に試合を終えました。"}, {"t": 502.4166666666667, "x": "旗揚げから、約2年でした。"}, {"t": 504.85, "x": "北尾が次に上がったのは、\nUWFインターナショナルのリングでした。"}, {"t": 509.53333333333336, "x": "UWFは1991年に解散し、\nリングス、UWFインターナショナル、"}, {"t": 516.3666666666667, "x": "プロフェッショナルレスリング藤原組の\n3つに分かれていました。"}, {"t": 520.35, "x": "Uインターのエース、高田延彦は、\n1991年12月22日の両国国技館で、"}, {"t": 527.7833333333333, "x": "ボクシングの元世界ヘビー級王者と\n戦ったばかりです。"}, {"t": 531.5333333333333, "x": "1992年3月、Uインターは\n北尾の参戦を発表します。"}, {"t": 537.0, "x": "二度も騒ぎを起こした北尾に、なぜまた機会を\n与えるのかという声も出ました。"}, {"t": 542.0166666666667, "x": "この少し前、SWSの田中社長は、北尾を関連の\n団体である藤原組に預けようとしていました。"}, {"t": 549.7666666666667, "x": "しかし組長の藤原喜明が断り、\nこの話は実現していません。"}, {"t": 554.8, "x": "北尾は1992年5月8日、横浜アリーナの\n大会でUインターに初めて登場しました。"}, {"t": 561.7333333333333, "x": "そして1992年10月23日、日本武道館。"}, {"t": 566.7166666666667, "x": "北尾はUインターのエース、\n高田延彦と戦います。"}, {"t": 570.7166666666667, "x": "試合は、高田のハイキックを\n受けた北尾のKO負けで終わりました。"}, {"t": 575.3, "x": "身長199センチの元横綱が、\nリングに崩れ落ちました。"}, {"t": 579.9833333333333, "x": "この試合は後に出版された本で、異種格闘技戦の\n歴史で最高の結末という章の題になっています。"}, {"t": 586.95, "x": "1994年、北尾は自分の格闘技の\n道場、北尾道場を開きます。"}, {"t": 593.1333333333333, "x": "そしてこのころから、天龍が率いる団体、\nWARのリングに上がるようになりました。"}, {"t": 599. 28日に納骨を済ませています。"}, {"t": 756.6166666666667, "x": "その翌日の3月29日、\n妻が北尾の死を公表しました。"}, {"t": 761.3333333333334, "x": "死去から47日後のことです。"}, {"t": 763.6833333333333, "x": "妻はこう書いています。"}, {"t": 765.2666666666667, "x": "「北尾光司は、6年間の闘病生活ののち、\n2月10日慢性腎不全のため、千葉県内の病院で"}, {"t": 773.0166666666667, "x": "他界いたしました」「主人は曲がったことが\n大嫌いなとてもピュアな人でした」"}, {"t": 776.9833333333333, "x": "デビュー戦の相手だったビガロは、\nそれより前の2007年に亡くなっています。"}, {"t": 781.8, "x": "ここで、北尾のプロレスでの日付を、\n短く並べ直してみます。"}, {"t": 786.4166666666666, "x": "1990年2月10日、東京ドームでデビュー。"}, {"t": 790.4666666666667, "x": "1990年7月23日、長州とのもみ合い。"}, {"t": 795.1166666666667, "x": "その後、新日本との契約解除。"}, {"t": 797.9, "x": "1990年11月1日、SWSに入団。"}, {"t": 802.8833333333333, "x": "1991年3月30日、\n東京ドームでテンタに敗れる。"}, {"t": 808.1, "x": "1991年4月1日、神戸でテンタに反則負け。"}, {"t": 813.05, "x": "その後、SWSを解雇。"}, {"t": 815.6666666666666, "x": "1992年10月23日、\n日本武道館で高田にKO負け。"}, {"t": 821.5, "x": "1995年5月3日、\n福岡ドームで長州と同じリングへ。"}, {"t": 826.9333333333333, "x": "1998年、引退。"}, {"t": 829.9833333333333, "x": "2019年2月10日、死去。"}, {"t": 832.85, "x": "新日本とSWS、2つの団体をあわせても、\n在籍したのは1年2か月です。"}, {"t": 839.4166666666666, "x": "これに対して、Uインター、WAR、\nPRIDEと渡り歩いた時間は、"}, {"t": 845.7, "x": "7年余りありました。"}, {"t": 847.5166666666667, "x": "2つの団体を去った後のほうが、\nリングにいた時間はずっと"}, {"t": 851.4833333333333, "x": "長かったことになります。"}, {"t": 852.8833333333333, "x": "そして、東京ドームでデビューした日から、\n千葉の病院で息を引き取った日まで、"}, {"t": 858.3833333333333, "x": "ちょうど29年。"}, {"t": 860.0166666666667, "x": "同じ2月10日が、北尾光司の始まりと\n終わりの日付として、記録に残っています。"}, {"t": 865.9166666666666, "x": "北尾光司の日付を最後までたどっていただき、\nありがとうございました。"}, {"t": 870.4666666666667, "x": "昭和と平成のリングに残る日付の話を、\nこれからもお届けしていきます。"}, {"t": 875.5833333333334, "x": "次の回も見逃したくない方は、\nチャンネル登録をお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
