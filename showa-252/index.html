<style>

<script>
const D={"name": "ハル薗田", "file": "252_編集用", "dur": 912.1333125, "segs": [], "subs": [{"t": 0.0, "x": "1987年11月28日の未明のことです。"}, {"t": 4.333333333333333, "x": "場所はインド洋の島国モーリシャス。"}, {"t": 6.616666666666666, "x": "管制塔は、1機の旅客機からの\n無線を待ち続けていました。"}, {"t": 10.883333333333333, "x": "台北を出た便です。"}, {"t": 12.4, "x": "モーリシャスを経由し、南アフリカの\nヨハネスブルグへ向かっていました。"}, {"t": 17.1, "x": "南アフリカ航空295便といいました。"}, {"t": 20.383333333333333, "x": "現地時間の午前4時4分ごろ、\n機体から短い返事が届きます。"}, {"t": 25.1, "x": "それを最後に、交信は途絶えました。"}, {"t": 27.866666666666667, "x": "乗っていたのは、乗客140人と乗員19人です。"}, {"t": 32.166666666666664, "x": "あわせて159人。"}, {"t": 33.916666666666664, "x": "その全員が亡くなりました。"}, {"t": 35.733333333333334, "x": "乗客の中には、日本人が47人いました。"}, {"t": 39.38333333333333, "x": "そしてその中に、1人のレスラーがいました。"}, {"t": 42.416666666666664, "x": "全日本プロレスの選手です。"}, {"t": 44.43333333333333, "x": "結婚して2か月の妻も一緒でした。"}, {"t": 46.95, "x": "名は、ハル薗田。"}, {"t": 48.63333333333333, "x": "31歳でした。"}, {"t": 50.2, "x": "なぜこの夫婦は、この便に\n乗っていたのでしょうか。"}, {"t": 53.65, "x": "今回はハル薗田という1人の\nレスラーの歩みを辿ります。"}, {"t": 57.233333333333334, "x": "295便に何が起きたのかも見ていきます。"}, {"t": 60.45, "x": "記録に残る日付で、順に追っていきます。"}, {"t": 63.53333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.03333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.61666666666666, "x": "ハル薗田、本名は薗田一治。"}, {"t": 74.28333333333333, "x": "1956年9月16日、\n宮崎県小林市に生まれました。"}, {"t": 79.71666666666667, "x": "中学と高校では、柔道に打ち込んでいます。"}, {"t": 83.18333333333334, "x": "身長は180センチです。"}, {"t": 85.43333333333334, "x": "体重は全盛期で110キロから\n115キロほどありました。"}, {"t": 89.31666666666666, "x": "1974年7月25日、\n薗田は全日本プロレスに入門しました。"}, {"t": 95.41666666666667, "x": "17歳でした。"}, {"t": 96.71666666666667, "x": "全日本が旗揚げしてから、\nまだ2年もたっていない時期です。"}, {"t": 100.7, "x": "入門した年の秋のことです。"}, {"t": 102.71666666666667, "x": "薗田はまずレフェリーとして\nリングに上がっています。"}, {"t": 105.61666666666666, "x": "レスラーとしてより先でした。"}, {"t": 107.41666666666667, "x": "レフェリーが病気で休んだための代役です。"}, {"t": 110.18333333333334, "x": "およそ1か月、試合を裁きました。"}, {"t": 113.03333333333333, "x": "選手としてのデビューは、\n翌年の1975年1月15日です。"}, {"t": 118.43333333333334, "x": "最初のころは「園田一治」という字で\nリングに上がっていました。"}, {"t": 122.06666666666666, "x": "草かんむりの無い「園」の字です。"}, {"t": 124.0, "x": "この時期の全日本には、同じころ\nデビューした若手が2人いました。"}, {"t": 128.36666666666667, "x": "渕正信と大仁田厚です。"}, {"t": 130.4, "x": "3人は「若手三羽烏」と呼ばれています。"}, {"t": 133.25, "x": "大仁田は後の対談で、\n合宿所のころを振り返っています。"}, {"t": 137.58333333333334, "x": "ジャンボ鶴田と渕と自分、そして1974年の\n夏に入ってきた薗田。"}, {"t": 143.15, "x": "この4人で、目白の賃貸マンションで\n暮らしていたといいます。"}, {"t": 147.1, "x": "1978年4月、\n薗田は東南アジアへ遠征しました。"}, {"t": 152.16666666666666, "x": "短い期間でした。"}, {"t": 153.53333333333333, "x": "これは個人の修行ではありません。"}, {"t": 155.75, "x": "全日本プロレスの海外興行に加わったものです。"}, {"t": 159.05, "x": "本格的な海外修行が始まったのは、\n1979年9月でした。"}, {"t": 164.38333333333333, "x": "最初の行き先は、カリブ海のプエルトリコです。"}, {"t": 167.76666666666668, "x": "そこで日本人の先輩レスラーと\nタッグを組みました。"}, {"t": 171.03333333333333, "x": "1979年10月13日、場所はバヤモン。"}, {"t": 175.6, "x": "2人はトーナメントに優勝します。"}, {"t": 177.93333333333334, "x": "手にしたのはWWC北米タッグ王座でした。"}, {"t": 181.41666666666666, "x": "1980年からはアメリカ本土に渡ります。"}, {"t": 184.9, "x": "リングネームは「ハル・ソノダ」です。"}, {"t": 186.8, "x": "「プロフェッサー・ソノダ」とも名乗りました。"}, {"t": 188.86666666666667, "x": "髪を長く伸ばし、後ろで束ねていました。"}, {"t": 192.2, "x": "長い口ひげとあごひげもたくわえています。"}, {"t": 194.88333333333333, "x": "その姿で各地のリングを回りました。"}, {"t": 197.38333333333333, "x": "フロリダやジョージアなどです。"}, {"t": 199.11666666666667, "x": "役どころは東洋人の悪役です。"}, {"t": 201.5, "x": "勝つことよりも、相手を\n引き立てることの多い立場でした。"}, {"t": 205.2, "x": "1982年4月、薗田は\nテキサス州ダラスに移ります。"}, {"t": 210.18333333333334, "x": "参戦したのは、団体WCCWでした。"}, {"t": 213.98333333333332, "x": "これを機に、覆面をかぶりました。"}, {"t": 216.55, "x": "名前は「マジック・ドラゴン」。"}, {"t": 218.2, "x": "ザ・グレート・カブキのパートナーです。"}, {"t": 220.26666666666668, "x": "地元で人気のフォン・エリック兄弟と\n抗争を繰り広げました。"}, {"t": 223.95, "x": "マジック・ドラゴンの決め技は、\nパイルドライバーでした。"}, {"t": 227.51666666666668, "x": "相手の頭をマットに突き刺す技です。"}, {"t": 230.11666666666667, "x": "1984年、薗田は日本に戻ります。"}, {"t": 234.01666666666668, "x": "帰国後はジャイアント馬場の付き人を務めました。"}, {"t": 236.95, "x": "リングにはマジック・ドラゴンの\nまま上がっています。"}, {"t": 239.68333333333334, "x": "転機は1985年6月5日です。"}, {"t": 242.95, "x": "この日の相手は小林邦昭でした。"}, {"t": 245.33333333333334, "x": "マスクと髪を賭けた試合です。"}, {"t": 247.3, "x": "薗田はこれに敗れ、覆面を脱ぎました。"}, {"t": 250.55, "x": "6月10日からは、リングネームを\n「ハル薗田」と改めています。"}, {"t": 254.71666666666667, "x": "6人タッグなどで、ときには\nメインイベントにも出場しました。"}, {"t": 258.8333333333333, "x": "薗田の代名詞になったのが、\nスライディング・キックです。"}, {"t": 262.48333333333335, "x": "リングの外にいる相手へ向かって走り込みます。"}, {"t": 265.35, "x": "滑りながら、一番下のロープの\n下から足を突き出します。"}, {"t": 269.55, "x": "そのまま相手を蹴り飛ばす技です。"}, {"t": 271.81666666666666, "x": "蹴る瞬間、薗田は「キェーッ」と声を上げました。"}, {"t": 275.26666666666665, "x": "この声で、静かだった客席も\n必ず沸いたといいます。"}, {"t": 279.21666666666664, "x": "同じ時代のレスラーたちが、そう語っています。"}, {"t": 282.45, "x": "この技は後に、小林邦昭や\n三沢光晴たちが使うようになりました。"}, {"t": 287.5833333333333, "x": "1986年には台湾へ遠征しています。"}, {"t": 291.21666666666664, "x": "このとき薗田は、\n現地でだけ再び覆面をかぶりました。"}, {"t": 295.1, "x": "名乗ったのは「スーパー・ドラゴン」です。"}, {"t": 297.1666666666667, "x": "そして二代目タイガーマスクと\n一騎打ちをしています。"}, {"t": 300.25, "x": "この二代目タイガーマスクの\n正体は、三沢光晴です。"}, {"t": 304.1333333333333, "x": "リングの外で、薗田は周りから\n「ゴリ」と呼ばれていました。"}, {"t": 307.8333333333333, "x": "馬場は薗田をこう評していたと伝えられています。"}, {"t": 310.8833333333333, "x": "「ゴリに言っておけば、\n全員に誤解なく伝わる」。"}, {"t": 314.18333333333334, "x": "このころ薗田はコーチ役も兼ねていました。"}, {"t": 316.76666666666665, "x": "道場で新弟子たちを鍛える役目です。"}, {"t": 319.3666666666667, "x": "指導を受けた中には、\nまだデビュー前の小橋健太がいました。"}, {"t": 323.3833333333333, "x": "1987年9月、薗田は結婚します。"}, {"t": 327.6333333333333, "x": "仲人を務めたのは、ジャイアント馬場でした。"}, {"t": 330.8333333333333, "x": "そのころ、全日本プロレスに依頼が届きます。"}, {"t": 334.1166666666667, "x": "南アフリカでの試合の依頼でした。"}, {"t": 336.5, "x": "現地で興行を手がけていたのは、\nタイガー・ジェット・シンでした。"}, {"t": 340.5, "x": "週刊プロレスの記録では、\n選ばれたのは薗田です。"}, {"t": 344.21666666666664, "x": "海外での経験が豊富だったことが理由でした。"}, {"t": 347.28333333333336, "x": "新婚2か月の妻の分の航空券もありました。"}, {"t": 350.6333333333333, "x": "馬場夫妻が気を利かせて贈ったものです。"}, {"t": 353.23333333333335, "x": "南アフリカでの試合と、新婚旅行。"}, {"t": 356.28333333333336, "x": "この2つを、1つの旅にまとめた形です。"}, {"t": 359.4, "x": "ところが出発の直前、思わぬことが起きます。"}, {"t": 362.9166666666667, "x": "1987年11月25日、薗田は\n成田空港で航空券を受け取ろうとしました。"}, {"t": 370.03333333333336, "x": "しかし、薗田の券は見当たりませんでした。"}, {"t": 373.3666666666667, "x": "もともとの予定は、東京からパリを\n経由するルートだったとされています。"}, {"t": 378.06666666666666, "x": "届いたのは、台北を\n経由する別のルートの券でした。"}, {"t": 381.96666666666664, "x": "現地のプロモーター側の手違いです。"}, {"t": 384.3333333333333, "x": "興行には間に合わせなければなりません。"}, {"t": 386.8333333333333, "x": "夫婦は11月27日に台北へ入ります。"}, {"t": 390.26666666666665, "x": "乗ったのはキャセイパシフィック航空でした。"}, {"t": 392.81666666666666, "x": "そして同じ日の深夜です。"}, {"t": 394.6666666666667, "x": "夫婦は台北の中正国際空港へ向かいます。"}, {"t": 397.98333333333335, "x": "そこを出る便に乗り込みます。"}, {"t": 399.9, "x": "それが南アフリカ航空295便でした。"}, {"t": 403.28333333333336, "x": "295便の機体は、ボーイング747の\n「コンビ」と呼ばれる型でした。"}, {"t": 408.95, "x": "前は乗客が座る客席です。"}, {"t": 411.25, "x": "その後ろに、そのまま貨物の\n置き場が続く造りです。"}, {"t": 415.0, "x": "この機体には\n「ヘルダーバーグ」という名前が付けられていました。"}, {"t": 418.46666666666664, "x": "機体記号はZS-SASです。"}, {"t": 421.48333333333335, "x": "1980年に造られた、7歳の機体でした。"}, {"t": 425.53333333333336, "x": "貨物置き場には、手荷物と6つの\n荷物の台が積まれていました。"}, {"t": 429.8333333333333, "x": "重さはあわせておよそ47,000キロです。"}, {"t": 432.71666666666664, "x": "出発前には、台湾の税関が調べを行いました。"}, {"t": 436.73333333333335, "x": "積み荷の一部を、抜き打ちで調べています。"}, {"t": 439.8, "x": "怪しい品は見つかっていません。"}, {"t": 441.95, "x": "操縦室には5人の乗員がいました。"}, {"t": 444.55, "x": "機長は49歳です。"}, {"t": 446.46666666666664, "x": "総飛行時間1万3,843時間のベテランでした。"}, {"t": 450.76666666666665, "x": "295便は台北を飛び立ちました。"}, {"t": 453.6333333333333, "x": "それから、およそ9時間半、\n何事もなく飛び続けます。"}, {"t": 458.1, "x": "様子が変わったのは、\nモーリシャスが近づいたころでした。"}, {"t": 461.73333333333335, "x": "現地時間の午前3時45分ごろです。"}, {"t": 464.7, "x": "操縦室から管制に連絡が入ります。"}, {"t": 467.51666666666665, "x": "機内に煙が出ているという知らせでした。"}, {"t": 470.06666666666666, "x": "295便は降下を始めます。"}, {"t": 472.7, "x": "そして、緊急事態を伝えました。"}, {"t": 475.3333333333333, "x": "午前4時2分ごろ、295便は\n「65マイル」という距離を伝えています。"}, {"t": 480.78333333333336, "x": "管制はこれを空港までの距離と受け取りました。"}, {"t": 483.81666666666666, "x": "しかし調査が進むと、実際の位置が分かります。"}, {"t": 487.3666666666667, "x": "空港から145マイル離れた\n地点だったとされています。"}, {"t": 491.1333333333333, "x": "そして午前4時4分ごろの短い返事が、\n最後の声になりました。"}, {"t": 495.8666666666667, "x": "その後は管制が何度呼びかけても、\n応答はありませんでした。"}, {"t": 500.05, "x": "管制は、正式に緊急事態を宣言しました。"}, {"t": 503.81666666666666, "x": "交信が途絶えてから36分後のことです。"}, {"t": 506.76666666666665, "x": "295便が墜ちたのはインド洋です。"}, {"t": 509.65, "x": "モーリシャスの北東、\nおよそ250キロの海でした。"}, {"t": 513.3833333333333, "x": "機体は海に落ちる前に、\n空中で分解していました。"}, {"t": 517.1166666666667, "x": "後の調べで、そのことが分かっています。"}, {"t": 520.1, "x": "最後の位置の伝わり方には食い違いがありました。"}, {"t": 523.2833333333333, "x": "そのため捜索は初め、\nずれた場所で行われています。"}, {"t": 527.3, "x": "捜索にはモーリシャス政府や\n南アフリカ軍が加わりました。"}, {"t": 531.25, "x": "フランス海軍やアメリカ海軍なども\n加わっています。"}, {"t": 534.5666666666667, "x": "機体の残骸は海の底に沈んでいました。"}, {"t": 537.2833333333333, "x": "深さは4,000メートルを超えます。"}, {"t": 539.5166666666667, "x": "海底の捜索には音波も使われました。"}, {"t": 542.2166666666667, "x": "この捜索は1988年1月8日に\nいったん打ち切られています。"}, {"t": 547.2333333333333, "x": "その後、アメリカのサルベージ会社が\n深海の捜索を行いました。"}, {"t": 551.75, "x": "残骸が見つかったのは1988年1月28日です。"}, {"t": 556.4833333333333, "x": "操縦室の会話を記録する\nボイスレコーダーも探されました。"}, {"t": 560.2833333333333, "x": "引き上げられたのは1989年1月6日です。"}, {"t": 564.1833333333333, "x": "回収したのは遠隔操作の無人潜水機です。"}, {"t": 567.3, "x": "水深はおよそ4,900メートルでした。"}, {"t": 570.3, "x": "ボイスレコーダーは、およそ14か月、\n深い海の底にありました。"}, {"t": 575.3333333333334, "x": "傷んではいたものの、\nまだ記録を取り出せる状態でした。"}, {"t": 579.0833333333334, "x": "回収後はアメリカへ運ばれました。"}, {"t": 581.35, "x": "国家運輸安全委員会で分析されています。"}, {"t": 584.4666666666667, "x": "もう1つ、飛行の記録を残す\nフライトデータレコーダーがありました。"}, {"t": 588.8166666666667, "x": "こちらは最後まで見つかりませんでした。"}, {"t": 591.2166666666667, "x": "事故の調査には委員会が当たりました。"}, {"t": 593.7333333333333, "x": "長を務めたのは、南アフリカの\n判事セシル・マーゴです。"}, {"t": 597.6166666666667, "x": "アメリカの国家運輸安全委員会と\nボーイング社も協力しています。"}, {"t": 601.85, "x": "ボイスレコーダーには、火災の\n警報が鳴る様子が残されていました。"}, {"t": 606.3166666666667, "x": "火が広がっていく様子も記録されています。"}, {"t": 608.9666666666667, "x": "録音はやがて止まります。"}, {"t": 610.7666666666667, "x": "分析によれば、警報からおよそ81秒後でした。"}, {"t": 614.8666666666667, "x": "ボイスレコーダーにつながる線が、\n焼けて切れたためでした。"}, {"t": 618.6833333333333, "x": "海からは腕時計も回収されました。"}, {"t": 621.1166666666667, "x": "そのうち2つは、\n台湾の時刻のまま動いていました。"}, {"t": 624.9333333333333, "x": "これが墜落した時刻を\n割り出す手がかりの1つになりました。"}, {"t": 628.5166666666667, "x": "委員会は火元を特定しています。"}, {"t": 630.8833333333333, "x": "貨物置き場の右前方に置かれた、荷物の台でした。"}, {"t": 634.7, "x": "客席の後ろにある貨物置き場です。"}, {"t": 637.15, "x": "その台には荷物が積まれていました。"}, {"t": 639.4166666666666, "x": "多くは、梱包されたコンピューター機器でした。"}, {"t": 642.7333333333333, "x": "ただし、何が最初に火を出したのかは\n特定できませんでした。"}, {"t": 647.1333333333333, "x": "委員会が主な原因に挙げたのは、\n貨物置き場の火災への備えです。"}, {"t": 651.9833333333333, "x": "火災を見つけて消し止める仕組みが\n足りなかったとしました。"}, {"t": 655.2666666666667, "x": "そして、特定の個人に責任を\n負わせることはできないと結論づけています。"}, {"t": 660.3, "x": "煙で乗員が意識を失ったのか。"}, {"t": 662.7333333333333, "x": "熱で機体が壊れたのか。"}, {"t": 664.4333333333333, "x": "委員会はこの2つの\n可能性を挙げるにとどめました。"}, {"t": 667.6333333333333, "x": "その後、積み荷を\nめぐってはさまざまな主張が出されました。"}, {"t": 671.45, "x": "2002年には、南アフリカで\n改めて検討が行われています。"}, {"t": 676.0833333333334, "x": "しかし、調査をやり直すだけの新たな根拠は\n見つからなかったとされています。"}, {"t": 681.2166666666667, "x": "火が出た本当の原因は、\n今も結論が出ていません。"}, {"t": 685.1333333333333, "x": "ボーイング747には、コンビ型があります。"}, {"t": 688.9333333333333, "x": "この型で起きた火災事故は、\nこれが初めてでした。"}, {"t": 692.4, "x": "南アフリカ航空は1993年に、\nこの型の機体の運航をやめています。"}, {"t": 698.3833333333333, "x": "アメリカの連邦航空局も新しい規則を設けました。"}, {"t": 702.0833333333334, "x": "貨物置き場の消火を人の手に\n頼らない仕組みを求めるものです。"}, {"t": 705.9333333333333, "x": "295便には、さまざまな国の\n人が乗っていました。"}, {"t": 710.0333333333333, "x": "その国籍は10を超える国と地域にわたります。"}, {"t": 713.1833333333333, "x": "南アフリカの人が乗客と\n乗員をあわせて71人です。"}, {"t": 717.35, "x": "日本人が47人、台湾の人が30人でした。"}, {"t": 721.6, "x": "日本人47人のうち38人は、\n日本水産の船員でした。"}, {"t": 726.6833333333333, "x": "トロール船に交代で\n乗り込むために向かう途中です。"}, {"t": 729.8666666666667, "x": "船員たちは福岡県北九州市の戸畑に集まりました。"}, {"t": 733.8, "x": "そして成田からキャセイパシフィック航空で\n台北に入っています。"}, {"t": 737.6666666666666, "x": "薗田夫妻と同じ道のりです。"}, {"t": 739.8, "x": "ほかにも、漁船の機械の保守に\n向かう技術者が乗っていました。"}, {"t": 744.0166666666667, "x": "商社の駐在員もいました。"}, {"t": 746.0, "x": "仕事で南アフリカへ向かう人たちです。"}, {"t": 748.6833333333333, "x": "知らせは全日本プロレスにも届きました。"}, {"t": 751.3166666666667, "x": "全日本は、夫妻の追悼式を行いました。"}, {"t": 754.7333333333333, "x": "1987年12月11日のことです。"}, {"t": 758.4333333333333, "x": "場所は日本武道館で、大会の中で行われました。"}, {"t": 762.4333333333333, "x": "第5試合が終わったあと、\n馬場がリングに立ちます。"}, {"t": 765.95, "x": "手には、菊の花で飾られた夫妻の\n遺影がありました。"}, {"t": 769.65, "x": "全日本の選手が全員で黙とうしました。"}, {"t": 772.4, "x": "場内には追悼の10カウントが響きました。"}, {"t": 775.3333333333334, "x": "馬場は後に、自伝の中で\nこう記していると伝えられています。"}, {"t": 779.5166666666667, "x": "新婚旅行も兼ねてと試合を組み、\n航空券を渡したのは自分だった。"}, {"t": 784.6, "x": "そして事故の後も、\n長く自分を責め続けたといいます。"}, {"t": 788.4833333333333, "x": "薗田が鍛えていた新弟子の1人が、小橋健太です。"}, {"t": 792.3333333333334, "x": "小橋のデビューは1988年2月です。"}, {"t": 795.7333333333333, "x": "事故からおよそ3か月後でした。"}, {"t": 797.9166666666666, "x": "1988年6月6日には、\n新日本プロレスが大会を開いています。"}, {"t": 803.7166666666667, "x": "場所は薗田の地元、\n宮崎県小林市の市民体育館です。"}, {"t": 808.3666666666667, "x": "第1試合の前に、選手全員がリングに並びました。"}, {"t": 812.3666666666667, "x": "そして30秒間の黙とうが行われています。"}, {"t": 815.4833333333333, "x": "当時の新日本のリングアナウンサーが、\n著書に記録しています。"}, {"t": 819.7, "x": "事故から20年がたちました。"}, {"t": 821.6666666666666, "x": "2007年と2008年のことです。"}, {"t": 824.1666666666666, "x": "プロレスリング・ノアが、\n若手選手によるリーグ戦を開きました。"}, {"t": 828.3333333333334, "x": "ノアには、薗田の教え子が多く在籍していました。"}, {"t": 831.9833333333333, "x": "大会の名前は\n「モーリシャス杯争奪リーグ戦」です。"}, {"t": 835.3, "x": "295便が墜ちた海にちなんで付けられました。"}, {"t": 838.65, "x": "モーリシャス東岸のベル・マールの\n浜辺には、慰霊碑があります。"}, {"t": 842.6166666666667, "x": "南アフリカ航空が建てたものです。"}, {"t": 845.0166666666667, "x": "慰霊碑は、事故が起きた海の\n方角を向いて立っています。"}, {"t": 848.8166666666667, "x": "2017年12月2日は、\n事故から30年の節目でした。"}, {"t": 853.5333333333333, "x": "この日、在モーリシャス日本大使が\n慰霊碑を訪れました。"}, {"t": 857.5333333333333, "x": "大使は花を供え、黙とうを捧げています。"}, {"t": 860.7833333333333, "x": "日本大使館の現地の職員にも、\n通い続けた人がいます。"}, {"t": 865.1166666666667, "x": "きっかけは、日本から慰霊に\n訪れた遺族の手伝いでした。"}, {"t": 869.0166666666667, "x": "その職員は、事故から\n13年目に花を供え始めました。"}, {"t": 873.3166666666667, "x": "以来、毎年11月に花を供え続けてきました。"}, {"t": 877.3166666666667, "x": "出発地の台湾でも、空港に近い海辺に\n慰霊碑が建てられています。"}, {"t": 882.25, "x": "デビューは1975年でした。"}, {"t": 884.9, "x": "そこから事故まで、\nレスラー人生は12年10か月です。"}, {"t": 889.0166666666667, "x": "結婚してからの日々は、およそ2か月でした。"}, {"t": 892.3, "x": "295便の事故で亡くなった159人と、\nそのご家族に、あらためて哀悼の意を表します。"}, {"t": 899.7166666666667, "x": "ご視聴、誠にありがとうございました。"}, {"t": 902.6833333333333, "x": "昭和のリングに立った1人のレスラーの記録が、\nどこかで心に残っていれば幸いです。"}, {"t": 908.3333333333334, "x": "チャンネル登録と高評価でお知らせください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;

function mark(pane,i){
  const el=document.getElementById(pane);

  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
