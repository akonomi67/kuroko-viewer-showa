<script>
const D={"name": "ハル薗田", "file": "252_編集用", "dur": 839.0, "segs": [], "subs": [{"t": 0.0, "x": "1987年11月28日の未明、\nインド洋の島国モーリシャスの管制塔は、"}, {"t": 6.95, "x": "1機の旅客機からの無線を待ち続けていました。"}, {"t": 10.183333333333334, "x": "台北を出て、モーリシャスを経由し、\n南アフリカのヨハネスブルグへ"}, {"t": 15.266666666666667, "x": "向かう南アフリカ航空295便です。"}, {"t": 18.383333333333333, "x": "現地時間の午前4時4分ごろ、機体からの\n短い返事を最後に、交信は途絶えました。"}, {"t": 24.766666666666666, "x": "乗っていたのは、乗客140人と\n乗員19人、あわせて159人。"}, {"t": 30.833333333333332, "x": "その全員が亡くなりました。"}, {"t": 32.63333333333333, "x": "乗客の中には、日本人が47人いました。"}, {"t": 36.28333333333333, "x": "そしてその中に、全日本プロレスのレスラーと、\n結婚して2か月の妻がいました。"}, {"t": 42.06666666666667, "x": "レスラーの名は、ハル薗田。"}, {"t": 44.21666666666667, "x": "31歳でした。"}, {"t": 45.78333333333333, "x": "なぜこの夫婦は、この便に\n乗っていたのでしょうか。"}, {"t": 49.21666666666667, "x": "今回は、ハル薗田という1人のレスラーの\n歩みと、295便に何が起きたのかを、"}, {"t": 55.53333333333333, "x": "記録に残る日付で順に辿っていきます。"}, {"t": 58.416666666666664, "x": "最後までご覧いただければ幸いです。"}, {"t": 60.916666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 66.5, "x": "ハル薗田、本名は薗田一治。"}, {"t": 69.16666666666667, "x": "1956年9月16日、\n宮崎県小林市に生まれました。"}, {"t": 74.6, "x": "中学と高校では柔道に打ち込んでいます。"}, {"t": 77.5, "x": "身長は180センチ、体重は全盛期で\n110キロから115キロほどありました。"}, {"t": 83.83333333333333, "x": "1974年7月25日、17歳で\n全日本プロレスに入門しました。"}, {"t": 90.08333333333333, "x": "全日本が旗揚げしてから、\nまだ2年もたっていない時期です。"}, {"t": 94.06666666666666, "x": "入門した年の秋、薗田はレスラーより先に、\nレフェリーとしてリングに上がっています。"}, {"t": 99.95, "x": "レフェリーが病気で休んだための代役で、\nおよそ1か月、試合を裁きました。"}, {"t": 105.7, "x": "選手としてのデビューは、\n翌年の1975年1月15日です。"}, {"t": 111.1, "x": "最初のころは、草かんむりの\n無い「園田一治」という字で"}, {"t": 114.81666666666666, "x": "リングに上がっていました。"}, {"t": 116.18333333333334, "x": "この時期の全日本の若手には、同じころ\nデビューした渕正信と大仁田厚がいました。"}, {"t": 121.81666666666666, "x": "3人は「若手三羽烏」と呼ばれています。"}, {"t": 124.66666666666667, "x": "大仁田は後の対談で、ジャンボ鶴田、渕、\n自分、そして1974年の夏に入ってきた薗田の"}, {"t": 133.31666666666666, "x": "4人で、目白の賃貸マンションで\n合宿所生活をしていたと振り返っています。"}, {"t": 138.38333333333333, "x": "1978年4月、薗田は短い期間ですが\n東南アジアへ遠征しました。"}, {"t": 144.58333333333334, "x": "これは個人の修行ではなく、\n全日本プロレスの海外興行に加わったものです。"}, {"t": 150.08333333333334, "x": "本格的な海外修行が始まったのは、\n1979年9月でした。"}, {"t": 155.41666666666666, "x": "最初の行き先は、カリブ海のプエルトリコです。"}, {"t": 158.8, "x": "そこで日本人の先輩レスラーとタッグを組み、\n1979年10月13日、バヤモンで"}, {"t": 166.18333333333334, "x": "行われたトーナメントに優勝して、\nWWC北米タッグ王座を手にしました。"}, {"t": 172.28333333333333, "x": "1980年からはアメリカ本土に渡ります。"}, {"t": 175.78333333333333, "x": "リングネームは「ハル・ソノダ」、\nあるいは「プロフェッサー・ソノダ」。"}, {"t": 179.35, "x": "髪を長く伸ばして後ろで束ね、長い口ひげと\nあごひげをたくわえた姿で、フロリダや"}, {"t": 185.43333333333334, "x": "ジョージアなど各地のリングを回りました。"}, {"t": 187.68333333333334, "x": "役どころは東洋人の悪役で、勝つことよりも\n相手を引き立てることの多い立場でした。"}, {"t": 193.33333333333334, "x": "1982年4月、テキサス州ダラスの\n団体WCCWに参戦したのを機に、"}, {"t": 200.18333333333334, "x": "薗田は覆面をかぶりました。"}, {"t": 202.43333333333334, "x": "名前は「マジック・ドラゴン」。"}, {"t": 204.08333333333334, "x": "ザ・グレート・カブキのパートナーとして、\n地元で人気のフォン・エリック兄弟と"}, {"t": 208.56666666666666, "x": "抗争を繰り広げます。"}, {"t": 210.0, "x": "マジック・ドラゴンの決め技は、相手の頭を\nマットに突き刺すパイルドライバーでした。"}, {"t": 215.25, "x": "1984年、薗田は日本に戻ります。"}, {"t": 219.15, "x": "帰国後はジャイアント馬場の付き人を\n務めながら、マジック・ドラゴンの"}, {"t": 223.55, "x": "まま全日本のリングに上がりました。"}, {"t": 225.65, "x": "転機は1985年6月5日です。"}, {"t": 228.91666666666666, "x": "この日、小林邦昭とマスクと髪を賭けた試合に\n敗れ、薗田は覆面を脱ぎました。"}, {"t": 235.3, "x": "6月10日からは、リングネームを\n「ハル薗田」と改めています。"}, {"t": 239.46666666666667, "x": "6人タッグなどで、ときには\nメインイベントにも出場しました。"}, {"t": 243.6, "x": "薗田の代名詞になったのが、\nスライディング・キックです。"}, {"t": 247.25, "x": "リングの外にいる相手へ向かって走り込み、\n滑りながら一番下のロープの下から"}, {"t": 252.46666666666667, "x": "足を突き出して蹴り飛ばします。"}, {"t": 254.26666666666668, "x": "蹴る瞬間に薗田が上げる「キェーッ」という声で、\n静かだった客席も必ず沸いたと、"}, {"t": 259.73333333333335, "x": "同じ時代のレスラーたちが語っています。"}, {"t": 262.4166666666667, "x": "この技は後に、小林邦昭や\n三沢光晴たちが使うようになりました。"}, {"t": 267.55, "x": "1986年には台湾遠征の際、\n現地でだけ「スーパー・ドラゴン」と"}, {"t": 272.73333333333335, "x": "名乗って再び覆面をかぶり、\n二代目タイガーマスクと一騎打ちをしています。"}, {"t": 277.65, "x": "この二代目タイガーマスクの\n正体は、三沢光晴です。"}, {"t": 281.53333333333336, "x": "リングの外で、薗田は周りから\n「ゴリ」と呼ばれていました。"}, {"t": 285.23333333333335, "x": "馬場は薗田について、「ゴリに言っておけば、\n全員に誤解なく伝わる」と"}, {"t": 290.31666666666666, "x": "評していたと伝えられています。"}, {"t": 292.1, "x": "このころ薗田は、道場で新弟子たちを\n鍛えるコーチ役も兼ねていました。"}, {"t": 296.93333333333334, "x": "指導を受けた中には、\nまだデビュー前の小橋健太がいました。"}, {"t": 300.93333333333334, "x": "1987年9月、薗田は結婚します。"}, {"t": 305.2, "x": "仲人を務めたのは、ジャイアント馬場でした。"}, {"t": 308.4, "x": "そのころ、全日本プロレスに\n南アフリカから試合の依頼が届きます。"}, {"t": 313.1333333333333, "x": "現地で興行を手がけていたのは、\nタイガー・ジェット・シンでした。"}, {"t": 317.1333333333333, "x": "週刊プロレスの記録によれば、\n海外での経験が豊富だったことから、"}, {"t": 321.98333333333335, "x": "全日本の中で薗田が選ばれました。"}, {"t": 324.6666666666667, "x": "新婚2か月の妻の分の航空券は、\n馬場夫妻が気を利かせて贈ったものでした。"}, {"t": 330.48333333333335, "x": "南アフリカでの試合と新婚旅行を、\n1つの旅にまとめた形です。"}, {"t": 335.35, "x": "ところが出発の直前、思わぬことが起きます。"}, {"t": 338.8666666666667, "x": "1987年11月25日、成田空港で\n航空券を受け取ろうとしたところ、"}, {"t": 345.6333333333333, "x": "薗田の券が見当たりませんでした。"}, {"t": 348.06666666666666, "x": "もともとの予定は、東京からパリを\n経由するルートだったとされています。"}, {"t": 352.78333333333336, "x": "現地のプロモーター側の手違いで、届いたのは\n台北を経由する別のルートの券でした。"}, {"t": 358.6166666666667, "x": "興行に間に合わせるため、夫婦は11月27日に\nキャセイパシフィック航空で台北に入ります。"}, {"t": 365.46666666666664, "x": "そして同じ日の深夜、台北の中正国際空港から\n南アフリカ航空295便に乗り込みました。"}, {"t": 372.96666666666664, "x": "295便の機体は、ボーイング747の\n「コンビ」と呼ばれる型でした。"}, {"t": 378.6333333333333, "x": "乗客が座る客席の後ろに、\nそのまま貨物の置き場が続く造りです。"}, {"t": 383.56666666666666, "x": "この機体には\n「ヘルダーバーグ」という名前が付けられていました。"}, {"t": 387.03333333333336, "x": "機体記号はZS-SAS、\n1980年に造られた、7歳の機体です。"}, {"t": 394.06666666666666, "x": "貨物置き場には、手荷物と6つの荷物の台、\nあわせておよそ47,000キロが"}, {"t": 399.85, "x": "積まれていました。"}, {"t": 400.8, "x": "出発前、台湾の税関が積み荷の\n一部を抜き打ちで調べていますが、"}, {"t": 405.8833333333333, "x": "怪しい品は見つかっていません。"}, {"t": 408.26666666666665, "x": "操縦室には5人の乗員がいて、機長は49歳、\n総飛行時間1万3,843時間のベテランでした。"}, {"t": 417.01666666666665, "x": "台北を飛び立った295便は、\nおよそ9時間半、何事もなく飛び続けます。"}, {"t": 423.31666666666666, "x": "様子が変わったのは、\nモーリシャスが近づいたころでした。"}, {"t": 426.95, "x": "現地時間の午前3時45分ごろ、\n操縦室からモーリシャスの管制に、"}, {"t": 432.1666666666667, "x": "機内に煙が出ているという連絡が入ります。"}, {"t": 435.31666666666666, "x": "295便は降下を始め、緊急事態を伝えました。"}, {"t": 439.75, "x": "午前4時2分ごろ、295便は\n「65マイル」という距離を伝えています。"}, {"t": 445.2, "x": "管制はこれを空港までの距離と受け取りましたが、\n後の調査では、実際には空港から"}, {"t": 451.48333333333335, "x": "145マイル離れた地点だったとされています。"}, {"t": 454.5, "x": "そして午前4時4分ごろの短い返事が、\n295便から届いた最後の声になりました。"}, {"t": 460.9166666666667, "x": "その後、管制が何度呼びかけても、\n応答はありませんでした。"}, {"t": 465.43333333333334, "x": "管制が正式に緊急事態を宣言したのは、\n交信が途絶えてから36分後のことです。"}, {"t": 471.71666666666664, "x": "295便が墜ちたのは、モーリシャスの北東、\nおよそ250キロのインド洋でした。"}, {"t": 478.06666666666666, "x": "後の調べで、機体は海に落ちる前に空中で\n分解していたことが分かっています。"}, {"t": 483.51666666666665, "x": "最後の位置の伝わり方に食い違いがあったため、\n捜索は初め、ずれた場所で行われました。"}, {"t": 490.15, "x": "モーリシャス政府や南アフリカ軍、\nフランス海軍、アメリカ海軍などが"}, {"t": 495.68333333333334, "x": "捜索に加わっています。"}, {"t": 497.26666666666665, "x": "機体の残骸は、深さ4,000メートルを\n超える海の底に沈んでいました。"}, {"t": 502.0833333333333, "x": "音波を使った海底の捜索は1988年1月8日に\nいったん打ち切られています。"}, {"t": 508.26666666666665, "x": "その後、アメリカのサルベージ会社が\n深海の捜索を行い、1988年1月28日に"}, {"t": 515.8666666666667, "x": "残骸を見つけています。"}, {"t": 517.3166666666667, "x": "操縦室の会話を記録する\nボイスレコーダーが引き上げられたのは、"}, {"t": 521.1833333333333, "x": "1989年1月6日でした。"}, {"t": 524.4833333333333, "x": "水深およそ4,900メートルから、\n遠隔操作の無人潜水機が回収しています。"}, {"t": 530.5333333333333, "x": "およそ14か月、深い海の底にあった\nボイスレコーダーは、傷んではいたものの、"}, {"t": 536.3333333333334, "x": "まだ記録を取り出せる状態でした。"}, {"t": 538.7666666666667, "x": "回収されたボイスレコーダーは、\nアメリカの国家運輸安全委員会に"}, {"t": 543.3666666666667, "x": "運ばれて分析されています。"}, {"t": 545.1833333333333, "x": "一方で、飛行の記録を残す\nフライトデータレコーダーは、"}, {"t": 548.9833333333333, "x": "最後まで見つかりませんでした。"}, {"t": 551.15, "x": "事故の調査には、南アフリカの\n判事セシル・マーゴを長とする委員会が当たり、"}, {"t": 556.25, "x": "アメリカの国家運輸安全委員会と\nボーイング社も協力しました。"}, {"t": 560.7833333333333, "x": "ボイスレコーダーには、火災の警報が鳴り、\n火が広がっていく様子が残されていました。"}, {"t": 566.7166666666667, "x": "分析によれば、警報が鳴ってから\nおよそ81秒後に、ボイスレコーダーに"}, {"t": 572.2333333333333, "x": "つながる線が焼けて切れ、\n録音はそこで止まっています。"}, {"t": 576.0, "x": "海から回収された腕時計のうち2つは台湾の\n時刻のまま動いていて、墜落した時刻を"}, {"t": 582.0666666666667, "x": "割り出す手がかりの1つになりました。"}, {"t": 584.0833333333334, "x": "委員会は、火元を客席の後ろにある貨物置き場の、\n右前方に置かれた荷物の台と特定しています。"}, {"t": 591.4, "x": "その台に積まれていた荷物の多くは、\n梱包されたコンピューター機器でした。"}, {"t": 596.3333333333334, "x": "ただし、何が最初に火を出したのかは、\n特定できませんでした。"}, {"t": 601.2333333333333, "x": "委員会は、貨物置き場の火災を\n見つけて消し止める仕組みが足りなかったことを"}, {"t": 606.1166666666667, "x": "主な原因に挙げ、特定の個人に責任を\n負わせることはできないと結論づけています。"}, {"t": 611.6833333333333, "x": "煙で乗員が意識を失ったのか、\n熱で機体が壊れたのかについても、"}, {"t": 616.4666666666667, "x": "委員会は2つの可能性を挙げるにとどめました。"}, {"t": 619.7833333333333, "x": "その後、積み荷を\nめぐってはさまざまな主張が出され、"}, {"t": 623.2166666666667, "x": "2002年には南アフリカで改めて検討が\n行われましたが、新たに調査をやり直すだけの"}, {"t": 629.8166666666667, "x": "根拠は見つからなかったとされています。"}, {"t": 632.0666666666667, "x": "火が出た本当の原因は、\n今も結論が出ていません。"}, {"t": 635.9833333333333, "x": "この事故は、ボーイング747の\nコンビ型で起きた初めての火災事故でした。"}, {"t": 641.5333333333333, "x": "南アフリカ航空は1993年にこの型の\n機体の運航をやめ、アメリカの連邦航空局は、"}, {"t": 648.95, "x": "貨物置き場の消火を人の手に\n頼らない仕組みを求める規則を設けました。"}, {"t": 653.8, "x": "295便に乗っていた人の国籍は、\n10を超える国と地域にわたっていました。"}, {"t": 659.4833333333333, "x": "南アフリカの人が乗客と乗員をあわせて71人、\n日本人が47人、台湾の人が30人です。"}, {"t": 667.7666666666667, "x": "日本人47人のうち38人は、\nトロール船に交代で乗り込むために"}, {"t": 673.05, "x": "向かう、日本水産の船員でした。"}, {"t": 675.5833333333334, "x": "船員たちは福岡県北九州市の戸畑に集まり、\n成田からキャセイパシフィック航空で"}, {"t": 681.7166666666667, "x": "台北に入っています。"}, {"t": 683.1333333333333, "x": "薗田夫妻と同じ道のりです。"}, {"t": 685.25, "x": "ほかにも、漁船の機械の保守に向かう技術者や、\n商社の駐在員など、仕事で南アフリカへ"}, {"t": 692.4, "x": "向かう人たちが乗っていました。"}, {"t": 694.0833333333334, "x": "知らせを受けた全日本プロレスは、\n1987年12月11日、日本武道館で"}, {"t": 701.1333333333333, "x": "開いた大会の中で、夫妻の追悼式を行いました。"}, {"t": 704.9, "x": "第5試合が終わったあと、\n菊の花で飾られた夫妻の遺影を、"}, {"t": 709.0833333333334, "x": "馬場が手に持ってリングに立ちます。"}, {"t": 711.45, "x": "全日本の選手全員が黙とうし、\n場内には追悼の10カウントが響きました。"}, {"t": 716.9333333333333, "x": "馬場は後に自伝の中で、新婚旅行も兼ねてと\n試合を組み、航空券を渡したのは自分だったと"}, {"t": 723.7, "x": "記し、事故の後も長く自分を責め続けたことを\n書き残していると伝えられています。"}, {"t": 729.0833333333334, "x": "薗田が鍛えていた新弟子の1人、\n小橋健太がデビューしたのは、事故から"}, {"t": 734.25, "x": "およそ3か月後の1988年2月でした。"}, {"t": 737.85, "x": "1988年6月6日には、\n新日本プロレスが薗田の地元、"}, {"t": 743.1166666666667, "x": "宮崎県小林市の市民体育館で大会を開きました。"}, {"t": 747.3166666666667, "x": "第1試合の前に選手全員がリングに並び、\n30秒間の黙とうが行われたことが、"}, {"t": 753.4333333333333, "x": "当時の新日本のリングアナウンサーの\n著書に記録されています。"}, {"t": 757.45, "x": "それから20年がたった2007年と\n2008年、薗田の教え子が"}, {"t": 762.3333333333334, "x": "多く在籍していたプロレスリング・ノアは、\n若手選手によるリーグ戦を開きました。"}, {"t": 767.4833333333333, "x": "大会の名前は、295便が墜ちた海にちなんで\n「モーリシャス杯争奪リーグ戦」と付けられています。"}, {"t": 774.2333333333333, "x": "モーリシャス東岸のベル・マールの浜辺には、\n南アフリカ航空が建てた慰霊碑があります。"}, {"t": 779.7666666666667, "x": "慰霊碑は、事故が起きた海の\n方角を向いて立っています。"}, {"t": 783.5666666666667, "x": "事故から30年後の2017年12月2日には、\n在モーリシャス日本大使がこの慰霊碑を訪れ、"}, {"t": 790.5, "x": "花を供えて黙とうを捧げました。"}, {"t": 793.0333333333333, "x": "日本大使館の現地の職員の1人は、日本から\n遺族が慰霊に訪れたときの手伝いをきっかけに、"}, {"t": 799.35, "x": "事故から13年目以降、毎年11月に\nこの慰霊碑へ花を供え続けてきました。"}, {"t": 805.5, "x": "出発地の台湾でも、空港に近い海辺に\n慰霊碑が建てられています。"}, {"t": 810.4166666666666, "x": "1975年のデビューから、事故までの\nレスラー人生は12年10か月でした。"}, {"t": 816.3666666666667, "x": "結婚してからの日々は、およそ2か月でした。"}, {"t": 819.65, "x": "295便の事故で亡くなった159人と、\nそのご家族に、あらためて哀悼の意を表します。"}, {"t": 827.0666666666667, "x": "ご視聴、誠にありがとうございました。"}, {"t": 830.0333333333333, "x": "昭和のリングに立った1人のレスラーの\n記録が、どこかで心に残っていれば、"}, {"t": 835.0, "x": "チャンネル登録と高評価でお知らせください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
