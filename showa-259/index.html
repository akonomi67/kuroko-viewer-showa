<script>
const D={"name": "冬木弘道", "file": "259_編集用", "dur": 911.6, "segs": [], "subs": [{"t": 0.0, "x": "「5月5日のリングに立っていれば、\nそれだけで冬木さんの勝ち」。"}, {"t": 4.133333333333334, "x": "2003年3月11日、東京・後楽園ホール。"}, {"t": 8.35, "x": "花束を手に、橋本真也がリングへ上がります。"}, {"t": 11.866666666666667, "x": "これは、目の前の男へ向けた言葉です。"}, {"t": 14.866666666666667, "x": "男は入院中の身でした。"}, {"t": 16.816666666666666, "x": "病院から会場へ来ていたのです。"}, {"t": 19.083333333333332, "x": "11日前に告げられたのは\n「管を通さなければ48時間の命」。"}, {"t": 23.566666666666666, "x": "東京スポーツによれば、顔は蒼白でした。"}, {"t": 26.816666666666666, "x": "脂汗も浮かべていました。"}, {"t": 28.583333333333332, "x": "それでも男は自力でリングに立ちました。"}, {"t": 31.133333333333333, "x": "橋本は、男が求め続けた一戦を\n受けると約束します。"}, {"t": 35.4, "x": "男の名は冬木弘道。"}, {"t": 37.083333333333336, "x": "この日から8日後、冬木は42歳で亡くなります。"}, {"t": 40.86666666666667, "x": "大腸がんを自分の口から明かしてから、\nおよそ11か月後のことでした。"}, {"t": 45.733333333333334, "x": "その11か月の間、冬木弘道は\n何をしていたのでしょうか。"}, {"t": 50.2, "x": "今回は冬木弘道という1人の\nレスラーの歩みを辿ります。"}, {"t": 53.96666666666667, "x": "手がかりは記録に残る日付と、\n本人と周りの人の言葉です。"}, {"t": 58.35, "x": "最後までご覧いただければ幸いです。"}, {"t": 60.85, "x": "それでは本編に入ります。"}, {"t": 62.78333333333333, "x": "その前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 67.25, "x": "冬木弘道は1960年5月11日、\n東京都江東区に生まれました。"}, {"t": 73.2, "x": "育ったのは神奈川県の横浜市です。"}, {"t": 75.81666666666666, "x": "国際プロレスに入門したのは1979年5月。"}, {"t": 79.86666666666666, "x": "翌1980年の5月に、\n国際プロレスのリングでデビューしました。"}, {"t": 84.96666666666667, "x": "ところが、デビューからわずか1年3か月後。"}, {"t": 88.31666666666666, "x": "団体そのものが無くなります。"}, {"t": 90.21666666666667, "x": "1981年8月9日、場所は\n北海道羅臼町の小学校のグラウンド。"}, {"t": 96.43333333333334, "x": "この日の興行を最後に、\n国際プロレスは活動を止めました。"}, {"t": 100.6, "x": "所属していた選手たちは、\nそれぞれ別の道を選びます。"}, {"t": 104.63333333333334, "x": "21歳の冬木は全日本プロレスへ移りました。"}, {"t": 108.01666666666667, "x": "全日本で冬木は天龍源一郎の付き人を務めます。"}, {"t": 111.75, "x": "同じ道場には三沢光晴がいました。"}, {"t": 114.3, "x": "のちにノアの社長になる男です。"}, {"t": 116.45, "x": "今も残る写真があります。"}, {"t": 118.3, "x": "若い三沢と冬木が、道場の台所で\n並んで食事の支度をしている写真です。"}, {"t": 123.83333333333333, "x": "1984年11月、\n冬木はアメリカへ海外修行に出ます。"}, {"t": 129.16666666666666, "x": "リングネームは「リッキー・フユキ」でした。"}, {"t": 131.35, "x": "帰国後の1985年12月のことです。"}, {"t": 134.83333333333334, "x": "冬木は、ジャイアント馬場から\n新しい名前をもらいます。"}, {"t": 138.75, "x": "それが「サムソン冬木」です。"}, {"t": 140.53333333333333, "x": "1987年6月4日は巡業の休みの日でした。"}, {"t": 144.88333333333333, "x": "天龍源一郎は名古屋のホテルで\n阿修羅・原と話をして、決起します。"}, {"t": 149.96666666666667, "x": "一番の目的は全日本のリングを\n活気づけることでした。"}, {"t": 153.65, "x": "のちに「天龍革命」と呼ばれる動きです。"}, {"t": 156.2, "x": "天龍と阿修羅・原の2人に、\nほどなく冬木と川田利明が加わりました。"}, {"t": 161.26666666666668, "x": "東京スポーツによると、\n天龍たちは手を抜きませんでした。"}, {"t": 165.28333333333333, "x": "地方の興行でも、同じでした。"}, {"t": 167.83333333333334, "x": "毎試合20分以上、\n全力の試合を続けたといいます。"}, {"t": 172.11666666666667, "x": "1988年1月28日、岩手県花巻市で\n撮られた1枚の写真があります。"}, {"t": 179.01666666666668, "x": "宿から昼食に向かう途中の場面です。"}, {"t": 181.73333333333332, "x": "天龍がつららを冬木の頭に乗せる\nふりをしてからかっています。"}, {"t": 185.56666666666666, "x": "それを見て阿修羅・原と川田が笑っています。"}, {"t": 188.48333333333332, "x": "この天龍のもとで冬木と\n組んだのが川田利明でした。"}, {"t": 191.93333333333334, "x": "2人のタッグは「フットルース」と\n名付けられます。"}, {"t": 194.6, "x": "1988年3月9日、2人は1本の\nベルトを初めて手にしました。"}, {"t": 200.33333333333334, "x": "全日本プロレスのアジアタッグ王座です。"}, {"t": 202.95, "x": "1989年3月27日の後楽園ホール。"}, {"t": 207.2, "x": "このベルトにジャイアント馬場と\n小橋健太の組が挑みました。"}, {"t": 210.68333333333334, "x": "馬場がアジアタッグに挑むのは、\nおよそ33年ぶりのことでした。"}, {"t": 215.15, "x": "試合が10分を過ぎたころです。"}, {"t": 217.36666666666667, "x": "馬場が、冬木をロープに振ります。"}, {"t": 219.95, "x": "そこへ小橋が飛び込み、\nドロップキックを放ちました。"}, {"t": 223.65, "x": "東京スポーツは、このときの様子を書いています。"}, {"t": 227.08333333333334, "x": "3本の足が、冬木の胸に当たったと。"}, {"t": 230.16666666666666, "x": "最後は川田が小橋を\n投げて3カウントを奪いました。"}, {"t": 233.76666666666668, "x": "フットルースはベルトを守りました。"}, {"t": 235.95, "x": "1990年5月14日、東京体育館。"}, {"t": 240.25, "x": "冬木は谷津嘉章と組みました。"}, {"t": 242.45, "x": "相手は2代目タイガーマスクと川田利明の組です。"}, {"t": 245.8, "x": "この試合の途中、タイガーマスクは\n自分でマスクを脱ぎました。"}, {"t": 250.03333333333333, "x": "三沢光晴の素顔に戻ったのです。"}, {"t": 252.51666666666668, "x": "冬木は、その試合で反対側の\nコーナーに立っていた選手でした。"}, {"t": 257.01666666666665, "x": "東京スポーツには、この日の写真が残っています。"}, {"t": 260.6, "x": "マスクを脱いだ三沢が、\n冬木と場外でやり合う写真です。"}, {"t": 264.6333333333333, "x": "この年の春、天龍源一郎は\n全日本プロレスを離れます。"}, {"t": 269.1333333333333, "x": "移った先は新しい団体SWSでした。"}, {"t": 272.3833333333333, "x": "1990年7月2日、SWSは\nサムソン冬木らの入団を発表しました。"}, {"t": 279.03333333333336, "x": "冬木は天龍のあとを追う形で\n全日本を去ったのです。"}, {"t": 282.6333333333333, "x": "SWSは長く続かず、\n1992年に活動を終えます。"}, {"t": 287.9, "x": "冬木は再び天龍に付いていきました。"}, {"t": 290.43333333333334, "x": "加わったのは、天龍が立ち上げたWARです。"}, {"t": 294.23333333333335, "x": "Number Webによると、\nここまでの冬木は裏方や中堅の位置にいました。"}, {"t": 298.95, "x": "そこで試合をすることが多いレスラーでした。"}, {"t": 301.7, "x": "冬木の立場が大きく変わるのは、この後です。"}, {"t": 305.05, "x": "1994年4月21日、岐阜県の大垣城ホール。"}, {"t": 310.1333333333333, "x": "試合の後、冬木は師匠の\n天龍源一郎に反旗を翻しました。"}, {"t": 315.15, "x": "引き込んだのは2人のレスラーです。"}, {"t": 317.26666666666665, "x": "WARに上がり始めたばかりの邪道と外道でした。"}, {"t": 320.9, "x": "こうして生まれたのが「冬木軍」です。"}, {"t": 323.03333333333336, "x": "Number Webの記事は、\n冬木の悪役への転身に触れています。"}, {"t": 327.3833333333333, "x": "早かった、というのです。"}, {"t": 329.6166666666667, "x": "蝶野正洋が「黒い総帥」に\n変わったのは1994年9月。"}, {"t": 334.0833333333333, "x": "冬木はそれより、およそ半年早かったのです。"}, {"t": 337.55, "x": "冬木は新聞や雑誌の記者を相手にしゃべりました。"}, {"t": 340.78333333333336, "x": "勝てば威張り、負ければ負け惜しみを並べます。"}, {"t": 344.05, "x": "そのひと言ひと言が、記事になりました。"}, {"t": 346.9166666666667, "x": "わざとそうなるように\n仕向けていたとされています。"}, {"t": 349.7, "x": "同じ記事は、この時点の\n冬木の考えも伝えています。"}, {"t": 353.53333333333336, "x": "いずれ天龍と別の道を行くことも\n考えていたのです。"}, {"t": 356.98333333333335, "x": "師匠の反対側のコーナーに立った人間の\n宿命だ、という考え方でした。"}, {"t": 362.21666666666664, "x": "地方巡業の前哨戦は軽く見られがちでした。"}, {"t": 365.43333333333334, "x": "その6人タッグの面白さを\n広めたのも、冬木軍でした。"}, {"t": 369.6166666666667, "x": "記事は、そう書いています。"}, {"t": 371.6666666666667, "x": "冬木はやがて、自分のことを\n「理不尽大王」と名乗るようになります。"}, {"t": 376.06666666666666, "x": "記事は冬木を、1つの先駆けと位置づけています。"}, {"t": 379.51666666666665, "x": "頭を使って客を引きつける悪役の\n形を作った先駆けです。"}, {"t": 383.73333333333335, "x": "その一方で、記事はこうも書いています。"}, {"t": 386.68333333333334, "x": "トップの選手として活躍した期間は、\n10年に満たなかったと。"}, {"t": 390.8833333333333, "x": "リングの外の冬木には、\n決まった考え方がありました。"}, {"t": 394.73333333333335, "x": "付き人は置きませんでした。"}, {"t": 396.48333333333335, "x": "「自分のことは自分でやれよ」\nという態度を通したのです。"}, {"t": 399.78333333333336, "x": "どの団体の出身かは問いません。"}, {"t": 402.0833333333333, "x": "「仕事ができるか、できないか」で\n選手を見ていたといいます。"}, {"t": 405.96666666666664, "x": "レスラーは団体のために戦うのではない。"}, {"t": 408.55, "x": "しょせんは流れ者だ。"}, {"t": 410.06666666666666, "x": "Number Webは、それが冬木の\n持っていた誇りだったと書いています。"}, {"t": 414.3333333333333, "x": "興行は水物です。"}, {"t": 415.9, "x": "だからその時に必要とされる選手が上がり、\n対等に戦える仕組みを作るべきだ。"}, {"t": 421.46666666666664, "x": "冬木はそうも訴えていました。"}, {"t": 423.55, "x": "体重は120キロから\n130キロを保っていました。"}, {"t": 427.23333333333335, "x": "本人の言葉が残っています。"}, {"t": 429.28333333333336, "x": "「オレはほうっておくと痩せちゃう体質なんだ」。"}, {"t": 431.8666666666667, "x": "あの突き出た腹は、食べて作り上げたものでした。"}, {"t": 435.25, "x": "1996年10月、冬木は邪道・\n外道とともにWARを離れます。"}, {"t": 441.28333333333336, "x": "3人は自分たちの会社を作りました。"}, {"t": 443.98333333333335, "x": "名前は「冬木軍プロモーション」です。"}, {"t": 446.26666666666665, "x": "1997年4月、冬木軍は自前の\n興行の旗揚げ戦を開きます。"}, {"t": 452.21666666666664, "x": "場所は岐阜県大垣市でした。"}, {"t": 454.26666666666665, "x": "3年前に天龍に背を向けたのと同じ大垣でした。"}, {"t": 457.76666666666665, "x": "その後、冬木はFMWの\nリングを主な舞台にします。"}, {"t": 461.85, "x": "FMWでは、選手としてだけではありません。"}, {"t": 465.31666666666666, "x": "試合を組み立てる側にも回りました。"}, {"t": 467.71666666666664, "x": "Number Webによると、\n冬木は試合を組み立てる力に優れていました。"}, {"t": 472.3333333333333, "x": "試合を細かく分析していました。"}, {"t": 474.6166666666667, "x": "それを仲間や後輩、記者たちに\n話して聞かせていたといいます。"}, {"t": 478.85, "x": "しかし2002年2月、\nFMWは経営に行き詰まって倒れます。"}, {"t": 483.85, "x": "翌3月、冬木は新しい団体WEWの\n設立を発表しました。"}, {"t": 489.5, "x": "旗揚げは5月5日、場所は\n神奈川県の川崎球場と決まります。"}, {"t": 494.56666666666666, "x": "その準備のさなかの2002年4月7日。"}, {"t": 497.35, "x": "冬木はプロレスリング・ノアの\n有明コロシアム大会に出場しました。"}, {"t": 501.53333333333336, "x": "相手は三沢光晴です。"}, {"t": 503.3666666666667, "x": "かつて全日本の道場の台所に並んでいた2人です。"}, {"t": 506.8333333333333, "x": "この日は、ノアのリングで向かい合いました。"}, {"t": 509.53333333333336, "x": "Number Webによると、\nこの日の試合前のことです。"}, {"t": 512.9833333333333, "x": "場所は控室の前の通路です。"}, {"t": 515.2166666666667, "x": "冬木は記者たちに、「実は\n大腸がんになっちゃってさ…」と話しました。"}, {"t": 520.2833333333333, "x": "続けて「治療に専念しなきゃなんないから、もう\nプロレスは辞める。"}, {"t": 524.4, "x": "引退するよ」。"}, {"t": 525.4666666666667, "x": "記者たちは冗談だと受け取りました。"}, {"t": 527.6833333333333, "x": "そして冗談では済まないと\n冬木をたしなめたといいます。"}, {"t": 531.1, "x": "東京スポーツによると、\n三沢戦の翌日は4月8日。"}, {"t": 535.2666666666667, "x": "冬木は、この日に精密検査を受けました。"}, {"t": 538.45, "x": "そこで、がんを告げられます。"}, {"t": 540.7833333333333, "x": "2日後の4月9日、後楽園ホールで\n冬木軍の大会が開かれました。"}, {"t": 545.9333333333333, "x": "冬木はその控室で、正式に引退を発表します。"}, {"t": 550.0333333333333, "x": "その場には、ノアの\n社長になっていた三沢光晴も同席していました。"}, {"t": 554.5666666666667, "x": "東京スポーツが伝える冬木の言葉です。"}, {"t": 557.1666666666666, "x": "「オレはがんだ。"}, {"t": 558.1166666666667, "x": "すぐに手術を受けなければいけない。"}, {"t": 560.3166666666667, "x": "今日が最後。"}, {"t": 561.2833333333333, "x": "本当に終わり」。"}, {"t": 562.45, "x": "冬木は「引退」の2文字を口にしました。"}, {"t": 564.9, "x": "そして、嗚咽を漏らしたと記事は書いています。"}, {"t": 568.1, "x": "引退試合について、\n東京スポーツはこう書いています。"}, {"t": 572.0166666666667, "x": "「三沢社長の計らい」で組まれた、と。"}, {"t": 574.85, "x": "ノアは空いていた日程を\n冬木のための大会に充てました。"}, {"t": 578.35, "x": "2002年4月14日、東京のディファ有明。"}, {"t": 582.1333333333333, "x": "冬木は三沢光晴たちと\n組んだ6人タッグマッチに出場しました。"}, {"t": 586.4166666666666, "x": "これが現役最後の試合になります。"}, {"t": 588.8, "x": "試合の後には引退式が行われました。"}, {"t": 591.6333333333333, "x": "デビューから数えて、\nおよそ22年の現役生活でした。"}, {"t": 595.8, "x": "引退試合の2日後、\n4月16日に冬木は入院します。"}, {"t": 600.3166666666667, "x": "4月18日には手術を受けました。"}, {"t": 602.95, "x": "それでも冬木は、自分が\n作った団体から離れませんでした。"}, {"t": 607.25, "x": "2002年5月5日、WEWは\n川崎球場で旗揚げしています。"}, {"t": 613.1166666666667, "x": "冬木の立場は、プロデューサーです。"}, {"t": 615.85, "x": "大会を組み立てる側に立ちました。"}, {"t": 618.0333333333333, "x": "ところが、この年の9月です。"}, {"t": 620.3666666666667, "x": "がんが肝臓に転移していることが分かります。"}, {"t": 623.15, "x": "2003年2月2日。"}, {"t": 624.9333333333333, "x": "冬木は橋本真也の団体、ZERO-\nONEの大会に姿を見せました。"}, {"t": 630.95, "x": "私服のまま、リングに入ります。"}, {"t": 633.4333333333333, "x": "そして橋本に、ラリアートを打ち込みました。"}, {"t": 636.5833333333334, "x": "冬木は、「次は正式に復帰だ」と言い放ちました。"}, {"t": 640.2333333333333, "x": "その4週間ほど後、\n2月28日に腸閉塞が見つかります。"}, {"t": 645.1666666666666, "x": "尿がまったく出なくなりました。"}, {"t": 647.0333333333333, "x": "膀胱と腸に管を通さなければ48時間の\n命だと告げられます。"}, {"t": 651.4833333333333, "x": "ここで冒頭の場面に戻ります。"}, {"t": 653.5833333333334, "x": "2003年3月11日、\nWEWの後楽園ホール大会。"}, {"t": 659.2166666666667, "x": "冬木はこの日、入院先の病院を\n出て会場に来ていました。"}, {"t": 663.6, "x": "東京スポーツの記事は\n「病院を抜け出して」と書いています。"}, {"t": 667.0, "x": "ほかの記録には「外出の許可を得て」とあります。"}, {"t": 669.85, "x": "どちらの記録も、同じように\n伝えていることがあります。"}, {"t": 673.4666666666667, "x": "冬木が、自分の足でリングに立ったことです。"}, {"t": 676.7666666666667, "x": "橋本は、花束を持って現れました。"}, {"t": 679.7166666666667, "x": "そして、挑戦を受けると言いました。"}, {"t": 682.3666666666667, "x": "続けて冬木の妻に、\n本当に受けてよいのかを確かめます。"}, {"t": 686.3833333333333, "x": "妻は「よろしくお願いします」と答えました。"}, {"t": 689.0, "x": "そのまま泣き崩れたと伝えられています。"}, {"t": 691.4666666666667, "x": "約束された試合の日は、5月5日です。"}, {"t": 694.65, "x": "場所は川崎球場でした。"}, {"t": 696.6333333333333, "x": "有刺鉄線と電流爆破を使ったデスマッチでした。"}, {"t": 700.0, "x": "後楽園の大会から3日後の3月14日、\n冬木は手術を受けます。"}, {"t": 705.3666666666667, "x": "3月16日に昏睡状態となりました。"}, {"t": 708.3833333333333, "x": "18日には危篤に陥ります。"}, {"t": 710.7, "x": "3月19日。"}, {"t": 712.0666666666667, "x": "横浜市民病院の病室を、橋本真也が訪れます。"}, {"t": 716.3833333333333, "x": "病室の前では、東京スポーツの\n記者が待っていました。"}, {"t": 720.1666666666666, "x": "橋本が、部屋から出てきます。"}, {"t": 722.6166666666667, "x": "記者には、「その姿をちゃんと撮らなきゃ」と\n声をかけました。"}, {"t": 726.45, "x": "そして病院を後にします。"}, {"t": 728.3666666666667, "x": "病室には、WEWの仲間の\n金村キンタローの姿もありました。"}, {"t": 733.7833333333333, "x": "記者が病室に入ります。"}, {"t": 735.5333333333333, "x": "冬木の妻は冬木へ「パパ、お仕事よ。"}, {"t": 738.6666666666666, "x": "格好いい姿を撮ってもらってね」と\n語りかけたといいます。"}, {"t": 742.15, "x": "冬木は、酸素マスクをつけていました。"}, {"t": 744.9, "x": "記者は、その姿を撮りました。"}, {"t": 747.3333333333334, "x": "その記者は後に\n「シャッターを押す手が震えた」と語っています。"}, {"t": 750.8666666666667, "x": "それからおよそ3時間後、容体が急変します。"}, {"t": 754.5833333333334, "x": "2003年3月19日、\n冬木弘道は亡くなりました。"}, {"t": 758.7666666666667, "x": "がん性腹膜炎、42歳でした。"}, {"t": 762.0166666666667, "x": "後楽園のリングに立った日から\n8日後のことでした。"}, {"t": 765.1666666666666, "x": "葬儀で冬木が着ていたのは、リングに\n入場するときのコスチュームでした。"}, {"t": 769.8, "x": "その姿で棺に納められたと伝えられています。"}, {"t": 773.0, "x": "約束の日は、それでもやってきました。"}, {"t": 775.7166666666667, "x": "2003年5月5日、川崎球場。"}, {"t": 779.15, "x": "WEWのこの日の大会は\n「冬木追悼興行」として開かれます。"}, {"t": 783.8166666666667, "x": "冬木に代わって橋本の前に\n立ったのは金村キンタローでした。"}, {"t": 787.6833333333333, "x": "試合は、ロープを外したリングで行われました。"}, {"t": 791.2166666666667, "x": "有刺鉄線に電流を流したデスマッチです。"}, {"t": 794.1666666666666, "x": "橋本は、冬木の妻から遺骨を借り受けました。"}, {"t": 797.6166666666667, "x": "遺骨を抱えたまま、橋本は有刺鉄線へ向かいます。"}, {"t": 801.55, "x": "自分から、体を当てにいきました。"}, {"t": 804.2166666666667, "x": "金村も同じように続き、\n3度目に爆発を受けています。"}, {"t": 808.25, "x": "試合は8分41秒で決まります。"}, {"t": 811.05, "x": "橋本が、垂直落下式のDDTで金村を破りました。"}, {"t": 815.3, "x": "試合の後、橋本は冬木の遺骨と妻に一礼しました。"}, {"t": 819.45, "x": "それから、リングを降りています。"}, {"t": 821.7333333333333, "x": "ここで確かめられた日付だけを並べ直します。"}, {"t": 824.65, "x": "1980年5月、国際プロレスでデビュー。"}, {"t": 828.5833333333334, "x": "1981年8月、国際プロレスが\n活動を止め、全日本プロレスへ。"}, {"t": 834.95, "x": "1985年12月、馬場の命名でサムソン冬木に。"}, {"t": 839.9, "x": "1994年4月21日、\n大垣で天龍に背き、冬木軍が生まれる。"}, {"t": 846.3833333333333, "x": "2002年4月7日、\n三沢戦の前にがんを口にする。"}, {"t": 850.4666666666667, "x": "4月14日、ディファ有明で最後の試合。"}, {"t": 853.8833333333333, "x": "2003年2月2日、ZERO-\nONEで橋本に「次は正式に復帰だ」。"}, {"t": 860.0833333333334, "x": "3月11日、後楽園のリングに立つ。"}, {"t": 863.6, "x": "3月19日、42歳で死去。"}, {"t": 866.7666666666667, "x": "5月5日、約束の電流爆破が\n遺骨とともに行われる。"}, {"t": 871.15, "x": "最後の試合から、およそ11か月。"}, {"t": 874.1333333333333, "x": "冬木が自分で求めた、橋本との一戦。"}, {"t": 877.3, "x": "それは本人が亡くなってから47日後、\n約束どおり川崎球場で行われました。"}, {"t": 883.4, "x": "冬木軍にいた邪道と外道は、冬木から\n試合の組み立て方を教わっています。"}, {"t": 888.5333333333333, "x": "2人はのちに新日本プロレスへ移りました。"}, {"t": 891.35, "x": "2023年のNumber \nWebによれば、新日本の舞台裏を"}, {"t": 895.55, "x": "取り仕切る立場にあるのが、この2人です。"}, {"t": 898.35, "x": "ご視聴、誠にありがとうございました。"}, {"t": 901.3333333333334, "x": "冬木弘道という名前に何か思い出のある方は、ぜひ\nコメントで聞かせてください。" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
