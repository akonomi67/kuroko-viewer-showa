<script>
const D={"name": "冬木弘道", "file": "259_編集用", "dur": 873.1, "segs": [], "subs": [{"t": 0.0, "x": "「5月5日のリングに立っていれば、\nそれだけで冬木さんの勝ち」"}, {"t": 3.933333333333333, "x": "2003年3月11日、東京・後楽園ホール。"}, {"t": 8.05, "x": "花束を手にリングへ上がった橋本真也が、\n目の前の男へ向けた言葉です。"}, {"t": 13.35, "x": "男は入院中の身で、病院から会場へ来ていました。"}, {"t": 17.666666666666668, "x": "11日前に告げられたのは\n「管を通さなければ48時間の命」。"}, {"t": 22.15, "x": "東京スポーツによれば、顔は蒼白で、\n脂汗を浮かべていました。"}, {"t": 27.283333333333335, "x": "それでも男は自力でリングに立ち、橋本は\n男が求め続けた一戦を受けると約束します。"}, {"t": 33.53333333333333, "x": "男の名は、冬木弘道。"}, {"t": 35.71666666666667, "x": "この日から8日後、冬木は42歳で亡くなります。"}, {"t": 39.516666666666666, "x": "大腸がんを自分の口から明かしてから、\nおよそ11か月後のことでした。"}, {"t": 44.38333333333333, "x": "その11か月の間、冬木弘道は\n何をしていたのでしょうか。"}, {"t": 48.85, "x": "今回は、冬木弘道という1人の\nレスラーの歩みを、記録に残る日付と、"}, {"t": 54.28333333333333, "x": "本人と周りの人の言葉で辿っていきます。"}, {"t": 57.36666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 59.86666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 65.43333333333334, "x": "冬木弘道は、1960年5月11日、\n東京都江東区に生まれ、"}, {"t": 71.53333333333333, "x": "神奈川県の横浜市で育ちました。"}, {"t": 74.35, "x": "国際プロレスに入門したのは1979年5月です。"}, {"t": 78.66666666666667, "x": "翌1980年の5月、国際プロレスの\nリングでデビューしました。"}, {"t": 83.78333333333333, "x": "ところが、冬木がデビューしてわずか\n1年3か月後、所属する団体"}, {"t": 88.76666666666667, "x": "そのものが無くなります。"}, {"t": 90.08333333333333, "x": "1981年8月9日、北海道羅臼町の\n小学校のグラウンドで開かれた興行を最後に、"}, {"t": 97.43333333333334, "x": "国際プロレスは活動を止めました。"}, {"t": 99.93333333333334, "x": "所属していた選手たちは、\nそれぞれ別の道を選びます。"}, {"t": 103.96666666666667, "x": "21歳の冬木は、全日本プロレスへ移りました。"}, {"t": 107.88333333333334, "x": "全日本で冬木は、天龍源一郎の付き人を務めます。"}, {"t": 112.16666666666667, "x": "同じ道場には、のちにノアの\n社長になる三沢光晴がいました。"}, {"t": 116.48333333333333, "x": "全日本の道場の台所で、\n若い三沢と冬木が並んで食事の"}, {"t": 121.11666666666666, "x": "支度をしている写真が、今も残っています。"}, {"t": 124.25, "x": "1984年11月、\n冬木はアメリカへ海外修行に出ます。"}, {"t": 129.58333333333334, "x": "リングネームは「リッキー・フユキ」でした。"}, {"t": 131.76666666666668, "x": "帰国後の1985年12月、冬木は\nジャイアント馬場から新しい名前をもらいます。"}, {"t": 138.3, "x": "それが「サムソン冬木」です。"}, {"t": 140.06666666666666, "x": "1987年6月4日、巡業の休みの日に、\n天龍源一郎は名古屋のホテルで"}, {"t": 147.03333333333333, "x": "阿修羅・原と話をして、決起します。"}, {"t": 149.93333333333334, "x": "一番の目的は、全日本の\nリングを活気づけることでした。"}, {"t": 154.15, "x": "のちに「天龍革命」と呼ばれる動きです。"}, {"t": 156.7, "x": "天龍と阿修羅・原の2人に、ほどなく、\n冬木と川田利明が加わりました。"}, {"t": 162.4, "x": "東京スポーツによると、天龍たちは地方の\n興行でも手を抜かず、毎試合20分以上の"}, {"t": 168.98333333333332, "x": "全力の試合を続けたといいます。"}, {"t": 171.11666666666667, "x": "1988年1月28日、岩手県花巻市で\n撮られた1枚の写真があります。"}, {"t": 178.01666666666668, "x": "宿から昼食に向かう途中、天龍がつららを\n冬木の頭に乗せるふりをしてからかい、"}, {"t": 183.66666666666666, "x": "阿修羅・原と川田が笑っている場面です。"}, {"t": 186.91666666666666, "x": "この天龍のもとで冬木と\n組んだのが、川田利明でした。"}, {"t": 190.93333333333334, "x": "2人のタッグは「フットルース」と\n名付けられます。"}, {"t": 193.58333333333334, "x": "1988年3月9日、\nフットルースは全日本プロレスの"}, {"t": 198.68333333333334, "x": "アジアタッグ王座を初めて手にしました。"}, {"t": 200.96666666666667, "x": "1989年3月27日の後楽園ホールでは、\nこのベルトにジャイアント馬場と"}, {"t": 207.26666666666668, "x": "小橋健太の組が挑みました。"}, {"t": 209.08333333333334, "x": "馬場がアジアタッグに挑むのは、\nおよそ33年ぶりのことでした。"}, {"t": 213.56666666666666, "x": "試合が10分を過ぎたころ、\n馬場が冬木をロープに振ると、"}, {"t": 217.6, "x": "小橋が飛び込んでドロップキックを放ちます。"}, {"t": 220.6, "x": "東京スポーツは、このとき3本の足が\n冬木の胸に当たったと書いています。"}, {"t": 225.6, "x": "最後は川田が小橋を投げて3カウントを奪い、\nフットルースはベルトを守りました。"}, {"t": 231.3, "x": "1990年5月14日、東京体育館。"}, {"t": 235.61666666666667, "x": "冬木は谷津嘉章と組み、2代目タイガーマスクと\n川田利明の組と戦いました。"}, {"t": 241.23333333333332, "x": "この試合の途中、タイガーマスクは自分で\nマスクを脱ぎ、三沢光晴の素顔に戻っています。"}, {"t": 247.9, "x": "冬木は、三沢がマスクを脱いだ試合の、\n反対側のコーナーに立っていた選手でした。"}, {"t": 253.81666666666666, "x": "東京スポーツには、マスクを脱いだ三沢が、\n冬木と場外でやり合っている写真が残っています。"}, {"t": 260.28333333333336, "x": "この年の春、天龍源一郎は全日本プロレスを\n離れ、新しい団体SWSへ移ります。"}, {"t": 267.68333333333334, "x": "1990年7月2日、SWSは\nサムソン冬木らの入団を発表しました。"}, {"t": 274.3333333333333, "x": "冬木は、天龍のあとを\n追う形で全日本を去りました。"}, {"t": 278.3666666666667, "x": "SWSは長く続かず、\n1992年に活動を終えます。"}, {"t": 283.6333333333333, "x": "冬木は再び天龍に付いていき、\n天龍が立ち上げたWARに加わります。"}, {"t": 289.3, "x": "Number Webによると、\nここまでの冬木は、裏方や中堅の位置で"}, {"t": 294.1, "x": "試合をすることが多いレスラーでした。"}, {"t": 296.3, "x": "冬木の立場が大きく変わるのは、この後です。"}, {"t": 299.6666666666667, "x": "1994年4月21日、岐阜県の大垣城ホール。"}, {"t": 304.73333333333335, "x": "試合の後、冬木は師匠の\n天龍源一郎に反旗を翻しました。"}, {"t": 309.76666666666665, "x": "引き込んだのは、WARに上がり始めたばかりの\n2人のレスラー、邪道と外道です。"}, {"t": 316.23333333333335, "x": "こうして生まれたのが「冬木軍」でした。"}, {"t": 318.45, "x": "Number Webの記事は、\n冬木の悪役への転身を、蝶野正洋が"}, {"t": 323.26666666666665, "x": "「黒い総帥」に変わった1994年9月より、\nおよそ半年早かったと書いています。"}, {"t": 329.3666666666667, "x": "冬木は新聞や雑誌の記者を相手に、\n勝てば威張り、負ければ負け惜しみを並べました。"}, {"t": 335.5833333333333, "x": "そのひと言ひと言が記事になるように、わざと\n仕向けていたとされています。"}, {"t": 340.2, "x": "冬木はこの時点で、いずれ天龍と\n別の道を行くことも考えていたと、"}, {"t": 345.15, "x": "同じ記事は伝えています。"}, {"t": 347.06666666666666, "x": "師匠の反対側のコーナーに立った人間の\n宿命だ、という考え方でした。"}, {"t": 352.3, "x": "地方巡業の\n前哨戦として軽く見られがちだった6人タッグの"}, {"t": 356.2, "x": "面白さを広めたのも、\n冬木軍だったと同じ記事は書いています。"}, {"t": 360.46666666666664, "x": "冬木はやがて自分のことを\n「理不尽大王」と名乗るようになります。"}, {"t": 364.31666666666666, "x": "同じ記事は冬木を、\n頭を使って客を引きつける悪役の形を"}, {"t": 368.81666666666666, "x": "作った先駆けと位置づけています。"}, {"t": 370.8666666666667, "x": "その一方で、トップの選手として活躍した期間は\n10年に満たなかったとも書いています。"}, {"t": 376.56666666666666, "x": "リングの外の冬木には、\n決まった考え方がありました。"}, {"t": 380.4, "x": "付き人は置かず、「自分のことは自分でやれよ」\nという態度を通しました。"}, {"t": 385.1333333333333, "x": "どの団体の出身かは問わず、\n「仕事ができるか、できないか」で"}, {"t": 389.7, "x": "選手を見ていたといいます。"}, {"t": 391.28333333333336, "x": "レスラーは団体のために\n戦うのではなく、しょせんは流れ者だ。"}, {"t": 395.75, "x": "それが冬木の持っていた誇りだったと、\nNumber Webは書いています。"}, {"t": 400.03333333333336, "x": "興行は水物なので、その時に必要とされる選手が\n上がり、対等に戦える仕組みを"}, {"t": 406.35, "x": "作るべきだとも訴えていました。"}, {"t": 408.25, "x": "体重は120キロから\n130キロを保っていました。"}, {"t": 411.93333333333334, "x": "本人は「オレはほうっておくと\n痩せちゃう体質なんだ」と話し、"}, {"t": 415.43333333333334, "x": "あの突き出た腹は、食べて作り上げたものでした。"}, {"t": 419.21666666666664, "x": "1996年10月、冬木は邪道・\n外道とともにWARを離れます。"}, {"t": 425.25, "x": "3人は「冬木軍プロモーション」という自分たちの\n会社を作りました。"}, {"t": 429.43333333333334, "x": "1997年4月、冬木軍は自前の興行の\n旗揚げ戦を、岐阜県大垣市で開いています。"}, {"t": 437.1666666666667, "x": "3年前に天龍に背を向けたのと同じ大垣でした。"}, {"t": 440.6666666666667, "x": "その後、冬木はFMWの\nリングを主な舞台にします。"}, {"t": 444.75, "x": "FMWでは選手としてだけでなく、\n試合を組み立てる側にも回りました。"}, {"t": 449.8333333333333, "x": "Number Webによると、\n冬木は試合を組み立てる力に優れ、"}, {"t": 453.9166666666667, "x": "試合を細かく分析しては、仲間や後輩、\n記者たちに話して聞かせていたといいます。"}, {"t": 460.25, "x": "しかし2002年2月、\nFMWは経営に行き詰まって倒れます。"}, {"t": 465.25, "x": "翌3月、冬木は新しい団体WEWの\n設立を発表しました。"}, {"t": 470.9, "x": "旗揚げは5月5日、\n神奈川県の川崎球場と決まります。"}, {"t": 475.6, "x": "その準備のさなかの、2002年4月7日。"}, {"t": 478.8833333333333, "x": "冬木はプロレスリング・ノアの\n有明コロシアム大会に出場し、"}, {"t": 482.75, "x": "三沢光晴と戦いました。"}, {"t": 484.93333333333334, "x": "かつて全日本の道場の台所に並んでいた2人が、\nこの日はノアのリングで向かい合いました。"}, {"t": 490.73333333333335, "x": "Number Webによると、\nこの日の試合前、冬木は控室の前の"}, {"t": 495.53333333333336, "x": "通路で記者たちにこう話しました。"}, {"t": 497.56666666666666, "x": "「実は大腸がんになっちゃってさ…」「治療に\n専念しなきゃなんないから、もうプロレスは辞める。"}, {"t": 503.7, "x": "引退するよ」記者たちは冗談だと受け取り、\n冗談では済まないと冬木をたしなめたといいます。"}, {"t": 509.65, "x": "東京スポーツによると、\n冬木は三沢戦の翌日、4月8日に病院で"}, {"t": 515.15, "x": "精密検査を受け、がんを告げられました。"}, {"t": 518.2166666666667, "x": "2日後の4月9日、\n後楽園ホールで開かれた冬木軍の大会。"}, {"t": 523.0666666666667, "x": "冬木はその控室で、正式に引退を発表します。"}, {"t": 527.15, "x": "その場には、ノアの\n社長になっていた三沢光晴も同席していました。"}, {"t": 531.6833333333333, "x": "東京スポーツは、このときの\n冬木の言葉をこう伝えています。"}, {"t": 535.85, "x": "「オレはがんだ。"}, {"t": 536.8166666666667, "x": "すぐに手術を受けなければいけない。"}, {"t": 539.0, "x": "今日が最後。"}, {"t": 539.9666666666667, "x": "本当に終わり」冬木は\n「引退」の2文字を口にして、"}, {"t": 543.0166666666667, "x": "嗚咽を漏らしたと記事は書いています。"}, {"t": 545.55, "x": "東京スポーツは、この引退試合が\n「三沢社長の計らい」で組まれたと書いています。"}, {"t": 550.8333333333334, "x": "ノアは、空いていた日程を\n冬木のための大会に充てました。"}, {"t": 554.95, "x": "2002年4月14日、東京のディファ有明。"}, {"t": 558.7166666666667, "x": "冬木は三沢光晴たちと組んだ6人タッグマッチに\n出場し、これが現役最後の試合になります。"}, {"t": 565.4166666666666, "x": "試合の後には引退式が行われました。"}, {"t": 568.25, "x": "デビューから数えて、\nおよそ22年の現役生活でした。"}, {"t": 572.4333333333333, "x": "引退試合の2日後、\n4月16日に冬木は入院します。"}, {"t": 576.9333333333333, "x": "4月18日、手術を受けました。"}, {"t": 579.9333333333333, "x": "それでも冬木は、自分が\n作った団体から離れませんでした。"}, {"t": 584.2166666666667, "x": "2002年5月5日、\n川崎球場でWEWは旗揚げしています。"}, {"t": 589.8666666666667, "x": "冬木はプロデューサーとして、\n大会を組み立てる側に立ちました。"}, {"t": 594.1333333333333, "x": "ところがこの年の9月、がんが肝臓に\n転移していることが分かります。"}, {"t": 598.8, "x": "2003年2月2日。"}, {"t": 600.5833333333334, "x": "冬木は橋本真也の団体、ZERO-\nONEの大会に姿を見せました。"}, {"t": 606.6, "x": "私服のままリングに入り、\n橋本にラリアートを打ち込みます。"}, {"t": 610.6833333333333, "x": "そして冬木は、\n「次は正式に復帰だ」と言い放ちました。"}, {"t": 614.6833333333333, "x": "その4週間ほど後、2月28日に、\n腸閉塞が見つかります。"}, {"t": 620.0833333333334, "x": "尿がまったく出なくなり、\n膀胱と腸に管を通さなければ48時間の"}, {"t": 625.1333333333333, "x": "命だと告げられました。"}, {"t": 626.4666666666667, "x": "ここで、冒頭の場面に戻ります。"}, {"t": 629.1166666666667, "x": "2003年3月11日、\nWEWの後楽園ホール大会。"}, {"t": 634.7333333333333, "x": "冬木はこの日、入院先の病院を\n出て会場に来ていました。"}, {"t": 639.1333333333333, "x": "東京スポーツの記事は\n「病院を抜け出して」と書き、ほかの"}, {"t": 642.7666666666667, "x": "記録には「外出の許可を得て」とあります。"}, {"t": 645.1333333333333, "x": "どちらにしても、冬木が自分の足でリングに\n立ったことは、同じように伝えられています。"}, {"t": 651.1, "x": "花束を持って現れた橋本は、\n挑戦を受けると言いました。"}, {"t": 655.3333333333334, "x": "そして冬木の妻に、\n本当に受けてよいのかを確かめます。"}, {"t": 659.3, "x": "妻は「よろしくお願いします」と答え、\nその場で泣き崩れたと伝えられています。"}, {"t": 664.35, "x": "約束された試合は、5月5日の川崎球場、\n有刺鉄線と電流爆破を使ったデスマッチでした。"}, {"t": 671.7666666666667, "x": "後楽園の大会から3日後の3月14日、\n冬木は手術を受けます。"}, {"t": 677.1333333333333, "x": "3月16日に昏睡状態となり、\n18日には危篤に陥りました。"}, {"t": 682.5166666666667, "x": "3月19日。"}, {"t": 683.8833333333333, "x": "横浜市民病院の病室を、橋本真也が訪れます。"}, {"t": 688.2, "x": "病室の前では、東京スポーツの\n記者が待っていました。"}, {"t": 691.9833333333333, "x": "部屋から出てきた橋本は、\n記者に「その姿をちゃんと撮らなきゃ」と"}, {"t": 696.1166666666667, "x": "声をかけて帰りました。"}, {"t": 697.5666666666667, "x": "病室には、WEWの仲間の\n金村キンタローの姿もありました。"}, {"t": 702.9833333333333, "x": "記者が病室に入ると、冬木の妻は、\n冬木へこう語りかけたといいます。"}, {"t": 708.35, "x": "「パパ、お仕事よ。"}, {"t": 710.2166666666667, "x": "格好いい姿を撮ってもらってね」記者は、\n酸素マスクをつけた冬木を撮りました。"}, {"t": 715.3333333333334, "x": "その記者は後に\n「シャッターを押す手が震えた」と語っています。"}, {"t": 718.8666666666667, "x": "それからおよそ3時間後、容体が急変します。"}, {"t": 722.5666666666667, "x": "2003年3月19日、冬木弘道は、\nがん性腹膜炎のため42歳で亡くなりました。"}, {"t": 729.5333333333333, "x": "後楽園のリングに立った日から、\n8日後のことでした。"}, {"t": 733.2833333333333, "x": "葬儀で冬木は、リングに\n入場するときのコスチュームを着て棺に"}, {"t": 737.6333333333333, "x": "納められたと伝えられています。"}, {"t": 739.45, "x": "約束の日は、それでもやってきました。"}, {"t": 742.1833333333333, "x": "2003年5月5日、川崎球場。"}, {"t": 745.6166666666667, "x": "WEWのこの日の大会は、\n「冬木追悼興行」として開かれます。"}, {"t": 750.8166666666667, "x": "冬木に代わって橋本の前に立ったのは、\n金村キンタローでした。"}, {"t": 755.1833333333333, "x": "試合はロープを外し、有刺鉄線に\n電流を流したデスマッチです。"}, {"t": 760.0166666666667, "x": "橋本は冬木の妻から遺骨を借り受け、\nそれを抱えたまま、自分から"}, {"t": 765.25, "x": "有刺鉄線に体を当てにいきました。"}, {"t": 767.5333333333333, "x": "金村も同じように続き、\n3度目に爆発を受けています。"}, {"t": 771.5666666666667, "x": "試合は8分41秒、橋本が垂直落下式の\nDDTで金村を破りました。"}, {"t": 777.6666666666666, "x": "試合の後、橋本は冬木の遺骨と妻に\n一礼して、リングを降りています。"}, {"t": 783.1166666666667, "x": "ここで、確かめられた日付だけを並べ直します。"}, {"t": 786.6333333333333, "x": "1980年5月、国際プロレスでデビュー。"}, {"t": 790.5666666666667, "x": "1981年8月、国際プロレスが\n活動を止め、全日本プロレスへ。"}, {"t": 796.9333333333333, "x": "1985年12月、馬場の命名でサムソン冬木に。"}, {"t": 801.8833333333333, "x": "1994年4月21日、\n大垣で天龍に背き、冬木軍が生まれる。"}, {"t": 808.3666666666667, "x": "2002年4月7日、\n三沢戦の前に、がんを口にする。"}, {"t": 813.05, "x": "4月14日、ディファ有明で最後の試合。"}, {"t": 816.4666666666667, "x": "2003年2月2日、ZERO-\nONEで橋本に「次は正式に復帰だ」。"}, {"t": 822.6666666666666, "x": "3月11日、後楽園のリングに立つ。"}, {"t": 826.1833333333333, "x": "3月19日、42歳で死去。"}, {"t": 829.35, "x": "5月5日、約束の電流爆破が、\n遺骨とともに行われる。"}, {"t": 834.1833333333333, "x": "最後の試合から、およそ11か月。"}, {"t": 837.1666666666666, "x": "冬木が自分で求めた橋本との一戦は、\n本人が亡くなってから47日後、"}, {"t": 842.7, "x": "約束どおり川崎球場で行われています。"}, {"t": 846.0666666666667, "x": "冬木軍で冬木から試合の組み立て方を\n教わった邪道と外道は、その後、"}, {"t": 851.0, "x": "新日本プロレスへ移り、2023年の時点で\n新日本の舞台裏を取り仕切る立場にあると、"}, {"t": 857.7666666666667, "x": "Number Webは伝えています。"}, {"t": 859.8666666666667, "x": "ご視聴、誠にありがとうございました。"}, {"t": 862.8333333333334, "x": "冬木弘道という名前に何か思い出のある方は、ぜひ\nコメントで聞かせてください。"}, {"t": 868.15, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
