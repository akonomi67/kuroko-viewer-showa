<script>
const D={"name": "227", "file": "227_編集用", "dur": 826.2833125, "segs": [], "subs": [{"t": 0.0, "x": "1971年2月19日、東京の後楽園ホール。"}, {"t": 4.966666666666667, "x": "その夜、日本プロレスのリングに\n1人の覆面レスラーが上がりました。"}, {"t": 9.566666666666666, "x": "イメージ映像"}, {"t": 9.566666666666666, "x": "シリーズの名前は\n『ダイナミック・ビッグ・シリーズ』。"}, {"t": 12.316666666666666, "x": "メキシコから来た初来日の選手です。"}, {"t": 14.866666666666667, "x": "相手は星野勘太郎でした。"}, {"t": 16.8, "x": "決着はダイビング・ボディ・アタック。"}, {"t": 18.883333333333333, "x": "コーナーの最上段から体をぶつける技で、\n初来日の第1戦を取っています。"}, {"t": 24.366666666666667, "x": "この選手には、当時の日本に\nほとんど例のない特徴がありました。"}, {"t": 28.75, "x": "試合のたびに、被っているマスクが違うのです。"}, {"t": 32.36666666666667, "x": "同じ選手のはずなのに、\n週が変われば顔が変わっている。"}, {"t": 36.15, "x": "リングネームは、スペイン語で\n千の仮面という意味でした。"}, {"t": 39.88333333333333, "x": "日本では、千の顔を持つ男と\n呼ばれるようになります。"}, {"t": 43.78333333333333, "x": "今回は、その男が日本に残した記録を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 50.2, "x": "最後までご覧いただければ幸いです。"}, {"t": 52.7, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 58.266666666666666, "x": "まず、マスクという仕組みのほうから\n確認しておきます。"}, {"t": 62.18333333333333, "x": "ミル・マスカラス。"}, {"t": 63.18333333333333, "x": "1942年7月15日、メキシコの\nサン・ルイス・ポトシ州の生まれです。"}, {"t": 68.9, "x": "父は銀の採掘を行う鉱山企業の役員、\n母は学校の教師でした。"}, {"t": 74.45, "x": "男が9人、女が3人の12人兄弟で、\nマスカラスは4男にあたります。"}, {"t": 80.55, "x": "イメージ映像"}, {"t": 80.55, "x": "千の顔を持つ男という呼び名は、\nデビューした当時は"}, {"t": 84.3, "x": "キャッチコピーにすぎませんでした。"}, {"t": 86.18333333333334, "x": "それが、そのまま実物になっていきます。"}, {"t": 89.2, "x": "2023年の時点で、実際に保有している\nマスクはおよそ1200枚と伝えられています。"}, {"t": 95.65, "x": "そしてそのマスクは、\nすべて本人のデザインによるものです。"}, {"t": 99.61666666666666, "x": "頭頂部にある5本のラインには、\n五大陸で活躍できるようにという願いが"}, {"t": 104.46666666666667, "x": "込められていました。"}, {"t": 105.51666666666667, "x": "日本での見せ方も独特でした。"}, {"t": 107.65, "x": "入場のときには、試合用のマスクの\n上からもう1枚、オーバーマスクと"}, {"t": 112.88333333333334, "x": "呼ばれる別のマスクを被ります。"}, {"t": 114.76666666666667, "x": "そして試合前に、そのオーバーマスクを\n客席へ投げてファンに渡していました。"}, {"t": 119.8, "x": "毎回1枚、観客席に飛んでいくわけです。"}, {"t": 123.3, "x": "全日本プロレス中継の視聴者プレゼント用に\nマスクを提供したこともあります。"}, {"t": 128.21666666666667, "x": "被り直すときも工夫がありました。"}, {"t": 130.43333333333334, "x": "顔を隠しながら、アゴのあたりから\nスルッと、2枚のマスクで頭を"}, {"t": 135.21666666666667, "x": "包むようにして被り替えます。"}, {"t": 137.0, "x": "その結果、素顔を見せることは\n絶対にありませんでした。"}, {"t": 141.05, "x": "経歴も確認しておきます。"}, {"t": 142.98333333333332, "x": "学生時代はレスリングと\nボディビルに打ち込みました。"}, {"t": 146.11666666666667, "x": "レスリングではメキシコ代表として、\n1964年の東京オリンピックの"}, {"t": 151.48333333333332, "x": "候補にもなっています。"}, {"t": 152.8, "x": "ボディビルでは1962年に\nミスター・メキシコに輝きました。"}, {"t": 157.11666666666667, "x": "柔道も、日本から遠征してきた指導者に\n習ったとされています。"}, {"t": 161.46666666666667, "x": "1964年4月に仮デビュー。"}, {"t": 164.25, "x": "大きなキャンペーンを経て、\n1965年7月16日に本拠地アレナ・メヒコで"}, {"t": 170.11666666666667, "x": "本格的にデビューしました。"}, {"t": 171.76666666666668, "x": "1966年3月22日、レイ・メンドーサを\n破ってナショナル・ライトヘビー級王座を獲得。"}, {"t": 178.75, "x": "これが初めてのタイトルです。"}, {"t": 180.53333333333333, "x": "1968年から1971年にかけてはアメリカの\nロサンゼルス地区を主戦場にしています。"}, {"t": 187.5, "x": "そこでNWAアメリカス・ヘビー級王座を\n通算で複数回獲得しました。"}, {"t": 192.55, "x": "1969年11月21日には、\nドリー・ファンク・ジュニアの持つ"}, {"t": 197.8, "x": "NWA世界ヘビー級王座に初挑戦しています。"}, {"t": 201.25, "x": "ここで、呼ばれ方についても\n記録を残しておきます。"}, {"t": 204.96666666666667, "x": "ロサンゼルス時代のマスカラスは、\n完全に観客の側に立つ正義側の選手でした。"}, {"t": 210.6, "x": "ところが、その覆面のデザインが当時の\n日本では奇怪なものに映ったとされています。"}, {"t": 216.06666666666666, "x": "イメージ映像"}, {"t": 216.06666666666666, "x": "そのため日本では、初めの\nころ悪魔仮面などと呼ばれていました。"}, {"t": 220.4, "x": "のちに仮面貴族と呼ばれることになる選手の、\n最初の呼び名です。"}, {"t": 224.66666666666666, "x": "イメージ映像"}, {"t": 224.66666666666666, "x": "その選手が、1971年2月に日本へ来ました。"}, {"t": 229.16666666666666, "x": "呼んだのは日本プロレスです。"}, {"t": 231.03333333333333, "x": "ここに、もう1つ記録が残っています。"}, {"t": 233.96666666666667, "x": "1970年6月、国際プロレスは新聞社の\n協力を得て、まだ来日していない外国人選手を"}, {"t": 241.73333333333332, "x": "ファン投票で選ぶ企画を行いました。"}, {"t": 244.1, "x": "投票の1位はスパイロス・アリオン。"}, {"t": 246.35, "x": "2位がマスカラスです。"}, {"t": 247.83333333333334, "x": "国際プロレスは上位の選手の招聘を\n計画しましたが、実現していません。"}, {"t": 253.13333333333333, "x": "海外のネットワークを\n握っていた日本プロレス側に、"}, {"t": 256.3666666666667, "x": "ことごとく妨害されたと記録されています。"}, {"t": 259.23333333333335, "x": "そしてアリオンとマスカラスは、\n翌1971年2月に日本プロレスへ"}, {"t": 264.56666666666666, "x": "そろって初来日しました。"}, {"t": 266.21666666666664, "x": "つまりマスカラスの初来日は、\n2つの団体が取り合った結果でもあります。"}, {"t": 271.2, "x": "初来日のシリーズの日程を見ておきます。"}, {"t": 274.03333333333336, "x": "2月19日、後楽園ホールで星野勘太郎に勝利。"}, {"t": 278.25, "x": "2月20日、大阪府立体育館。"}, {"t": 281.2, "x": "ダグ・ギルバートと組んで、アントニオ猪木と\n吉村道明のアジアタッグ王座に挑戦。"}, {"t": 286.81666666666666, "x": "3月2日、蔵前国技館。"}, {"t": 289.5833333333333, "x": "スパイロス・アリオンと組み、\nジャイアント馬場と猪木の持つ"}, {"t": 293.35, "x": "インターナショナル・タッグ王座に挑戦。"}, {"t": 295.6, "x": "3月6日、前橋市の大会では猪木との\nシングルマッチも行われました。"}, {"t": 300.9, "x": "猪木とのシングルは、\nこれが最初で最後になっています。"}, {"t": 304.6166666666667, "x": "ヨーロッパにも遠征しています。"}, {"t": 306.6, "x": "1974年10月、当時の西ドイツで行われた\nミュンヘン・トーナメントに参加しました。"}, {"t": 313.18333333333334, "x": "ここで対戦した相手の中に、\n同じ年の8月に新日本プロレスで"}, {"t": 317.76666666666665, "x": "デビューしたばかりの吉田光雄がいます。"}, {"t": 320.06666666666666, "x": "のちの長州力です。"}, {"t": 321.6166666666667, "x": "トーナメントの戦績は7勝3敗、引き分けが1つ。"}, {"t": 325.53333333333336, "x": "順位は4位でした。"}, {"t": 326.98333333333335, "x": "そのマスクが、アメリカでは\n制度そのものを動かしました。"}, {"t": 330.9166666666667, "x": "ニューヨーク州には、\n覆面レスラーはマスクを脱いで素顔で"}, {"t": 334.71666666666664, "x": "出場しなければならない、という規定がありました。"}, {"t": 338.1166666666667, "x": "その規定が解禁されたのが\n1972年12月18日です。"}, {"t": 343.0, "x": "場所はマディソン・スクエア・ガーデン。"}, {"t": 345.0833333333333, "x": "素顔のザ・スポイラーとの一戦でした。"}, {"t": 347.46666666666664, "x": "覆面を被ったまま\nマディソン・スクエア・ガーデンに"}, {"t": 350.23333333333335, "x": "登場した初めての人物が、マスカラスです。"}, {"t": 353.53333333333336, "x": "この解禁のあと、北東部でも支持を集めました。"}, {"t": 356.98333333333335, "x": "1973年12月にペドロ・モラレスが\nWWWFヘビー級王座を明け渡したあと、"}, {"t": 363.68333333333334, "x": "マスカラスを新王者にするという\nプランもあったと記録されています。"}, {"t": 367.85, "x": "当時のプロモーターは、家族でニューヨークに\n移住することまで提案したとされています。"}, {"t": 373.2, "x": "1978年1月23日には、\nマディソン・スクエア・ガーデンの"}, {"t": 378.45, "x": "定期戦で当時の王者に挑戦しました。"}, {"t": 381.03333333333336, "x": "このときセコンドに付いていたのは\nボブ・バックランドです。"}, {"t": 384.18333333333334, "x": "同じ年の3月20日には、\nアンドレ・ザ・ジャイアント、"}, {"t": 387.65, "x": "ダスティ・ローデスと3人の\nトリオを組んでいます。"}, {"t": 390.81666666666666, "x": "この試合は、当時WWFと\n提携していた新日本プロレスの"}, {"t": 395.6, "x": "放送枠で日本でも中継されました。"}, {"t": 398.03333333333336, "x": "日本での主戦場が変わるのは1973年でした。"}, {"t": 402.03333333333336, "x": "同年10月から全日本プロレスに参戦します。"}, {"t": 405.28333333333336, "x": "ジャンボ鶴田やザ・デストロイヤーと\n好勝負を重ねました。"}, {"t": 408.65, "x": "中でも記録に残っているのが\n1977年8月25日です。"}, {"t": 413.6166666666667, "x": "田園コロシアムで、鶴田の持つ\nUNヘビー級王座に挑戦しました。"}, {"t": 418.56666666666666, "x": "この試合は、その年のプロレス大賞で\n年間最高試合賞を受賞しています。"}, {"t": 423.95, "x": "弟たちもレスラーでした。"}, {"t": 425.7, "x": "12人兄弟のうち、7男のエル・シコデリコと\n9男のドス・カラスがプロレスに進んでいます。"}, {"t": 431.9, "x": "全日本プロレスには、ドス・カラスとの\n兄弟タッグ、マスカラス・ブラザーズとしての"}, {"t": 437.53333333333336, "x": "来日も多くありました。"}, {"t": 438.98333333333335, "x": "イメージ映像"}, {"t": 438.98333333333335, "x": "2人が並んでコーナーから飛ぶ編隊飛行は、\n全日本プロレスの夏の風物詩と言われています。"}, {"t": 445.2, "x": "1978年8月24日には、田園コロシアムで\n馬場と鶴田のインターナショナル・タッグ王座に"}, {"t": 452.3, "x": "挑戦しました。"}, {"t": 453.3333333333333, "x": "年末の世界最強タッグ決定リーグ戦には、\n1979年と1983年に出場しています。"}, {"t": 461.3833333333333, "x": "1979年大会ではザ・ファンクス、\nアブドーラ・ザ・ブッチャーと"}, {"t": 466.25, "x": "ザ・シークの組と対戦。"}, {"t": 467.68333333333334, "x": "1983年大会ではスタン・ハンセンと\nブルーザー・ブロディ、"}, {"t": 471.8333333333333, "x": "タイガー・ジェット・シンと\n上田馬之助の組と当たりました。"}, {"t": 475.45, "x": "入場曲についても触れておきます。"}, {"t": 477.8, "x": "イギリスのバンド、\nジグソーの『スカイ・ハイ』です。"}, {"t": 480.9, "x": "全日本プロレスで使われていたのは、\n映画の主題歌として作られた"}, {"t": 485.3666666666667, "x": "メインタイトルのバージョンでした。"}, {"t": 487.03333333333336, "x": "イメージ映像"}, {"t": 487.03333333333336, "x": "マスクと曲と、コーナーからの飛び方。"}, {"t": 489.8, "x": "日本でのこの選手の入場は、\nこの3つで出来ていました。"}, {"t": 493.76666666666665, "x": "1979年8月26日には、\n日本武道館で行われたプロレス夢の"}, {"t": 499.85, "x": "オールスター戦に出場しました。"}, {"t": 501.76666666666665, "x": "このときは全日本プロレスの一員として、\n鶴田と新日本プロレスの"}, {"t": 506.35, "x": "藤波辰巳とトリオを組んでいます。"}, {"t": 508.46666666666664, "x": "1980年9月12日には、\n愛知県一宮市でハーリー・レイスの持つ"}, {"t": 514.15, "x": "NWA世界ヘビー級王座に挑戦しました。"}, {"t": 517.3166666666667, "x": "アメ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
