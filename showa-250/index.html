<script>
const D={"name": "小林邦昭", "file": "250_編集用", "dur": 866.0833125, "segs": [], "subs": [{"t": 0.0, "x": "1982年10月26日、大阪府立体育会館。"}, {"t": 5.216666666666667, "x": "初代タイガーマスクとの、初めての一騎打ち。"}, {"t": 8.4, "x": "相手の覆面に、1人の男が手をかけます。"}, {"t": 11.75, "x": "男は覆面を引き裂き、剥ぎ取りました。"}, {"t": 14.683333333333334, "x": "覆面レスラーのマスクに触れること。"}, {"t": 16.933333333333334, "x": "それは当時のリングで、\n暗黙のタブーとされていました。"}, {"t": 20.766666666666666, "x": "会場は騒然となります。"}, {"t": 22.616666666666667, "x": "やがて男は、「虎ハンター」と\n呼ばれるようになります。"}, {"t": 26.2, "x": "それから10年後の1992年。"}, {"t": 29.083333333333332, "x": "男は長い欠場に入ります。"}, {"t": 31.266666666666666, "x": "発表された理由は「内臓疾患」。"}, {"t": 33.7, "x": "本当の病名は、大腸がんでした。"}, {"t": 36.6, "x": "男の名は、小林邦昭。"}, {"t": 39.016666666666666, "x": "がんは、その後も肝臓と\n肺へ転移を繰り返しました。"}, {"t": 42.86666666666667, "x": "最初の発病から亡くなるまで、およそ32年。"}, {"t": 46.56666666666667, "x": "その間、この男はリングと道場で\n何をしていたのでしょうか。"}, {"t": 50.766666666666666, "x": "今回は、小林邦昭という1人の\nレスラーの歩みを辿ります。"}, {"t": 55.333333333333336, "x": "手がかりは記録に残る日付です。"}, {"t": 57.53333333333333, "x": "そして本人や周りの人の証言です。"}, {"t": 60.2, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.7, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.28333333333333, "x": "小林邦昭は1956年1月11日、\n長野県に生まれました。"}, {"t": 74.3, "x": "1972年に新日本プロレスへ入門します。"}, {"t": 78.18333333333334, "x": "デビューは翌1973年2月です。"}, {"t": 81.38333333333334, "x": "デビュー戦の相手は、栗栖正伸でした。"}, {"t": 84.5, "x": "3年後に入門してきた後輩が、佐山聡です。"}, {"t": 88.38333333333334, "x": "2人は若手のころから親しい間柄でした。"}, {"t": 91.25, "x": "のちに同じ時期にメキシコへ修行に出ます。"}, {"t": 93.91666666666667, "x": "向こうでは共同生活も送っていました。"}, {"t": 96.55, "x": "小林が試合で穿いていた赤いパンタロン。"}, {"t": 99.25, "x": "もともとは佐山のものです。"}, {"t": 101.01666666666667, "x": "佐山がメキシコを離れるときに、\n小林が譲り受けました。"}, {"t": 105.18333333333334, "x": "佐山は後に、小林についてこう話しています。"}, {"t": 108.81666666666666, "x": "「小林さんってすごくいい人なんですよ。"}, {"t": 111.4, "x": "あんなにいい先輩はいません」"}, {"t": 113.35, "x": "若手時代の小林には、\n語り継がれている話があります。"}, {"t": 117.43333333333334, "x": "新大阪から東京へ、\n新幹線で移動したときのことです。"}, {"t": 121.83333333333333, "x": "先輩の山本小鉄がおごってくれました。"}, {"t": 124.5, "x": "小林は食堂車のメニューを端から順に頼みました。"}, {"t": 127.93333333333334, "x": "後輩レスラーの証言があります。"}, {"t": 130.15, "x": "小林は東京に着くまでに全部\n食べたと話していたそうです。"}, {"t": 134.06666666666666, "x": "1980年、小林はメキシコへ渡ります。"}, {"t": 138.2, "x": "その翌年の1981年4月。"}, {"t": 141.26666666666668, "x": "佐山は新日本から帰国の命令を受けます。"}, {"t": 144.28333333333333, "x": "そしてタイガーマスクとしてデビューしました。"}, {"t": 146.8, "x": "人気は一気に広がりました。"}, {"t": 148.73333333333332, "x": "小林はその様子を、修行先の\nメキシコで噂として聞いていました。"}, {"t": 153.35, "x": "小林はメキシコの後に\nアメリカでも試合を重ねました。"}, {"t": 156.9, "x": "日本へ戻ったのは1982年です。"}, {"t": 160.1, "x": "帰国第1戦は1982年10月8日、\n後楽園ホール。"}, {"t": 165.26666666666668, "x": "興行の前半に組まれた、\n目立たないタッグマッチでした。"}, {"t": 169.08333333333334, "x": "同じころ新日本のリングでは、\n長州力が造反していました。"}, {"t": 173.41666666666666, "x": "大きな話題になっていた出来事です。"}, {"t": 175.7, "x": "小林は、この動きに刺激を\n受けたと伝えられています。"}, {"t": 179.63333333333333, "x": "矛先を向けたのは、すでに\n大スターになっていた後輩でした。"}, {"t": 183.71666666666667, "x": "タイガーマスクです。"}, {"t": 185.01666666666668, "x": "1982年10月22日の広島大会。"}, {"t": 188.93333333333334, "x": "小林は、試合を控えた\nタイガーマスクをリングで襲いました。"}, {"t": 193.16666666666666, "x": "そしてマスクを引き裂きました。"}, {"t": 195.01666666666668, "x": "この場面の写真は、\n今も東京スポーツに残っています。"}, {"t": 199.1, "x": "このとき小林は26歳でした。"}, {"t": 201.55, "x": "4日後の10月26日、大阪府立体育会館。"}, {"t": 205.88333333333333, "x": "2人の初めての一騎打ちが組まれました。"}, {"t": 208.4, "x": "小林は荒っぽい攻めを続けます。"}, {"t": 210.73333333333332, "x": "最後はタイガーの覆面を\nびりびりに裂いて剥ぎ取りました。"}, {"t": 214.26666666666668, "x": "マスク剥ぎは、試合の前から\n狙っていたものでした。"}, {"t": 217.73333333333332, "x": "小林本人の言葉です。"}, {"t": 219.61666666666667, "x": "メキシコのリングでも、観客が一番\n興奮するのはマスクを剥がす場面でした。"}, {"t": 224.9, "x": "翌週の1982年11月4日、蔵前国技館。"}, {"t": 229.9, "x": "2人は選手権試合で再び向き合いました。"}, {"t": 232.73333333333332, "x": "かけられたのは、タイガーマスクが\n持つ2本のベルトです。"}, {"t": 236.43333333333334, "x": "NWA世界ジュニアヘビー級と\nWWFジュニアヘビー級でした。"}, {"t": 241.2, "x": "ここでも小林は、マスクを引き裂いています。"}, {"t": 244.31666666666666, "x": "テレビ中継の視聴率は、\n25パーセントを超えました。"}, {"t": 248.3, "x": "反響は、リングの外にも及びました。"}, {"t": 251.13333333333333, "x": "街を歩けば好奇の目で見られました。"}, {"t": 253.45, "x": "実家には生卵が投げ込まれました。"}, {"t": 255.86666666666667, "x": "全国から「死ね」と書かれた手紙が届きました。"}, {"t": 258.65, "x": "中にはカミソリを仕込んだ封筒もありました。"}, {"t": 261.51666666666665, "x": "小林はそれで親指を切りました。"}, {"t": 263.9166666666667, "x": "その傷跡は後年まで残っていたといいます。"}, {"t": 266.9, "x": "小林はこうした反応を受け止めていました。"}, {"t": 269.6666666666667, "x": "悪役としてファンを本気にさせた証だ、と。"}, {"t": 273.01666666666665, "x": "抗争は、リングの上の試合の形も変えました。"}, {"t": 276.43333333333334, "x": "それまでのタイガーマスクの相手は、\nメキシコの覆面レスラーが中心でした。"}, {"t": 281.45, "x": "空中戦の多い試合です。"}, {"t": 283.3666666666667, "x": "小林と戦うようになって、それが変わります。"}, {"t": 286.8, "x": "破れたマスクのまま怒りを\nあらわにして向かっていくようになりました。"}, {"t": 290.6, "x": "子どもだけではありません。"}, {"t": 292.1666666666667, "x": "高校生や大学生、大人のファンも増えます。"}, {"t": 295.6666666666667, "x": "人気は頂点を迎えたとされています。"}, {"t": 298.23333333333335, "x": "小林のトレードマークは赤いパンタロン。"}, {"t": 300.8, "x": "決め技はフィッシャーマンズ・スープレックス・ホールドでした。"}, {"t": 304.05, "x": "2人の抗争は1982年10月から\n1983年8月まで。"}, {"t": 309.75, "x": "およそ10か月です。"}, {"t": 311.21666666666664, "x": "本人は後にこう振り返っています。"}, {"t": 313.68333333333334, "x": "「僕とタイガーマスクの抗争はたった10カ月間、\nシングルマッチは6試合しかやってないんですよ」"}, {"t": 319.75, "x": "タイガーマスクのことは、こう呼んでいました。"}, {"t": 322.5, "x": "「自分のレスラー人生のすべてを決定付けた恩人」"}, {"t": 325.85, "x": "この抗争と並行して、\n小林は長州力のグループに加わります。"}, {"t": 330.71666666666664, "x": "維新軍です。"}, {"t": 331.8833333333333, "x": "1984年には、長州らとともに\nジャパンプロレスへ移ります。"}, {"t": 336.81666666666666, "x": "上がったのは、全日本プロレスのリングでした。"}, {"t": 340.0, "x": "ここで向き合ったのが、\n2代目タイガーマスクです。"}, {"t": 343.2, "x": "マスクの中にいたのは、三沢光晴でした。"}, {"t": 346.28333333333336, "x": "小林は全日本で、\nNWAインターナショナルジュニアヘビー級王座を"}, {"t": 351.3833333333333, "x": "取ります。"}, {"t": 351.95, "x": "1986年11月には、\n世界ジュニアヘビー級王座も手にしました。"}, {"t": 357.6, "x": "1987年4月、小林は新日本へ戻ります。"}, {"t": 362.4166666666667, "x": "同じ年の8月には、\nIWGPジュニアヘビー級王座を奪いました。"}, {"t": 368.2, "x": "1989年4月24日、東京ドーム。"}, {"t": 372.56666666666666, "x": "この日は、獣神サンダー・ライガーの\n国内デビュー戦でした。"}, {"t": 376.51666666666665, "x": "相手を務めたのは小林です。"}, {"t": 378.6333333333333, "x": "試合はライガーの勝利でした。"}, {"t": 380.6666666666667, "x": "2人は11年後、\n特別な試合でもう一度向き合います。"}, {"t": 384.93333333333334, "x": "1992年1月30日、大田区体育館。"}, {"t": 389.43333333333334, "x": "新日本と空手の誠心会館は抗争の中にありました。"}, {"t": 393.35, "x": "小林は誠心会館の齋藤彰俊と、\n血を流し合う試合をしています。"}, {"t": 398.5, "x": "この抗争をきっかけに、\n反選手会同盟が生まれました。"}, {"t": 402.46666666666664, "x": "越中詩郎らと作ったグループです。"}, {"t": 404.8666666666667, "x": "のちの平成維震軍へとつながっていきます。"}, {"t": 407.7, "x": "小林は越中とともに、その中心にいました。"}, {"t": 411.26666666666665, "x": "その同じ1992年。"}, {"t": 413.65, "x": "小林は長期の欠場に入ります。"}, {"t": 416.1666666666667, "x": "このとき36歳。"}, {"t": 417.6666666666667, "x": "表向きの理由は「内臓疾患」とされていました。"}, {"t": 420.75, "x": "実際は大腸がんでした。"}, {"t": 422.6, "x": "関係者の間では、\nこのころから噂が流れていました。"}, {"t": 426.5, "x": "「小林はがんで危ないらしい」というものです。"}, {"t": 429.25, "x": "小林は手術を受けました。"}, {"t": 431.18333333333334, "x": "治療を経て、リングに戻りました。"}, {"t": 433.6166666666667, "x": "ここから小林は、30年以上にわたって治療と\n節制を続けることになります。"}, {"t": 439.0833333333333, "x": "1990年代半ばのことです。"}, {"t": 441.8, "x": "小林は入場してきた1人の\n後輩をいきなり襲いました。"}, {"t": 445.53333333333336, "x": "抗争の始まりです。"}, {"t": 446.98333333333335, "x": "髪をかけた試合に敗れた小林は、\n丸坊主になりました。"}, {"t": 451.1333333333333, "x": "なぜ襲ったのかを聞かれた小林の\n答えが残っています。"}, {"t": 454.7, "x": "練習も試合もこつこつと頑張っている後輩に\n注目が集まっていないのはおかしい。"}, {"t": 459.8333333333333, "x": "そういう趣旨の答えだったとされています。"}, {"t": 462.3833333333333, "x": "その後輩は小林の姿勢に心酔し、\n平成維震軍に加わりました。"}, {"t": 467.56666666666666, "x": "1995年9月26日、東京の駒沢体育館。"}, {"t": 472.75, "x": "プロシューティングの大会です。"}, {"t": 474.6, "x": "小林は佐山聡と\nエキシビションマッチを行いました。"}, {"t": 478.15, "x": "2人がリングで向き合うのは、12年ぶりです。"}, {"t": 481.45, "x": "試合は佐山のハイキックが顎に入りました。"}, {"t": 484.4, "x": "小林は気を失い、担架で運ばれました。"}, {"t": 487.68333333333334, "x": "意識が戻った小林は、\n佐山に申し訳ないと語りました。"}, {"t": 491.8333333333333, "x": "そして出来事を自分の\n責任として収めたとされています。"}, {"t": 495.46666666666664, "x": "1999年。"}, {"t": 497.4, "x": "がんが肝臓に転移していることが分かります。"}, {"t": 500.2, "x": "小林は肝臓の手術を受けました。"}, {"t": 502.68333333333334, "x": "上半身には、大きな傷跡が残りました。"}, {"t": 506.06666666666666, "x": "その後の試合では、タンクトップを\n着てリングに上がっています。"} const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
