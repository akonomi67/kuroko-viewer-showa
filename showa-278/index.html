<script>
const D={"name": "追悼興行から消えた東郷", "file": "278_編集用", "dur": 913.26665625, "segs": [], "subs": [{"t": 0.0, "x": "1963年12月20日、\n東京の渋谷にあるリキ・スポーツパレスの"}, {"t": 5.5, "x": "記録に、1つの名前が欠けています。"}, {"t": 8.133333333333333, "x": "グレート東郷。"}, {"t": 9.266666666666667, "x": "その日の10試合は力道山の追悼興行でした。"}, {"t": 12.666666666666666, "x": "同じ日に池上本門寺で葬儀がありました。"}, {"t": 15.566666666666666, "x": "政界と財界の大物も顔をそろえています。"}, {"t": 18.566666666666666, "x": "集まった客は3000人、\nテレビは生中継でした。"}, {"t": 22.6, "x": "遠藤幸吉、吉村道明、芳の里、豊登。"}, {"t": 27.716666666666665, "x": "日本プロレスの幹部4人は最後の\n3試合に全員そろって出ています。"}, {"t": 32.21666666666667, "x": "消えていたのは、13日前の浜松で\n力道山と同じ側に立った男でした。"}, {"t": 37.63333333333333, "x": "東郷には、レスラーの\nほかにもう1つの仕事がありました。"}, {"t": 41.46666666666667, "x": "アメリカの大物を日本へ送り込む窓口です。"}, {"t": 44.46666666666667, "x": "その役を、東郷はこの年の暮れに解かれました。"}, {"t": 47.93333333333333, "x": "もめた理由はお金でした。"}, {"t": 49.7, "x": "力道山の隣にいた男は、なぜ追悼の\n組み合わせから消えたのでしょうか？"}, {"t": 55.0, "x": "そして、消えたあとの東郷は\nどこへ向かったのでしょうか？"}, {"t": 58.86666666666667, "x": "今回は、グレート東郷という1人の\n日系レスラーを追います。"}, {"t": 63.15, "x": "試合の記録と、新聞や雑誌に\n残った日付をもとに辿っていきます。"}, {"t": 68.06666666666666, "x": "最後までご覧いただければ幸いです。"}, {"t": 70.56666666666666, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 76.13333333333334, "x": "グレート東郷の本名は、\nジョージ・カズオ・オカムラです。"}, {"t": 79.8, "x": "日本語の資料には岡村という名字で出てきます。"}, {"t": 82.98333333333333, "x": "資料によれば、生まれは\n1911年10月11日です。"}, {"t": 87.8, "x": "場所はアメリカのオレゴン州フッドリバーです。"}, {"t": 90.6, "x": "両親の出身には諸説があります。"}, {"t": 93.08333333333333, "x": "今もはっきりしていません。"}, {"t": 94.78333333333333, "x": "デビューの年も資料で割れています。"}, {"t": 97.01666666666667, "x": "日本語の資料は1933年です。"}, {"t": 100.2, "x": "英語の資料は1938年と書いています。"}, {"t": 103.73333333333333, "x": "日本語の資料によれば、\nリングの名前は何度も変わりました。"}, {"t": 107.81666666666666, "x": "最初はブル・イトーです。"}, {"t": 109.38333333333334, "x": "次がジョージ・オカムラでした。"}, {"t": 111.18333333333334, "x": "戦争が終わると、戦時の首相の東条に\nちなむトージョーを名乗ります。"}, {"t": 115.66666666666667, "x": "その次が、日露戦争の東郷元帥に\nちなむトーゴーでした。"}, {"t": 119.98333333333333, "x": "東郷はこの名前を最後まで使います。"}, {"t": 122.56666666666666, "x": "東京スポーツは、1950年代の\n東郷を日系の流血王と呼んでいます。"}, {"t": 128.28333333333333, "x": "タイツは膝の下まである長いものです。"}, {"t": 130.73333333333332, "x": "足もとは下駄でした。"}, {"t": 132.2, "x": "試合の前にはリングに塩をまきます。"}, {"t": 134.75, "x": "相手を油断させてから反則で攻めます。"}, {"t": 137.35, "x": "レフェリーに注意されても、\n薄ら笑いを浮かべるだけでした。"}, {"t": 141.2, "x": "客の憎しみを一身に浴びる役でした。"}, {"t": 143.8, "x": "この型は、のちの日系レスラーの定番になります。"}, {"t": 147.31666666666666, "x": "東郷の登場のあと、全米の興行主が\n日系レスラーを求めるようになりました。"}, {"t": 152.9, "x": "日本語の資料には、さらに\n細かい演出が残っています。"}, {"t": 156.96666666666667, "x": "酒を椀で時間をかけて飲みます。"}, {"t": 159.26666666666668, "x": "軍配や刀も振りました。"}, {"t": 161.11666666666667, "x": "許しを請うたすぐあとに、\n相手の急所を蹴ります。"}, {"t": 164.73333333333332, "x": "その手口は、アメリカの客に\n真珠湾を思わせたと書かれています。"}, {"t": 169.28333333333333, "x": "銃剣で刺されそうになったこともありました。"}, {"t": 171.95, "x": "日系人の団体から抗議を受けたこともあります。"}, {"t": 175.06666666666666, "x": "英語の資料には、リングの前に\n小さな仏壇で祈る姿も書かれています。"}, {"t": 180.08333333333334, "x": "付き人が線香をたいたという話です。"}, {"t": 182.68333333333334, "x": "1950年代には、アントニオ・ロッカと\n長い抗争を続けました。"}, {"t": 187.56666666666666, "x": "1957年のアメリカ映画にも、\nザ・グレート・トーゴの名前で出ています。"}, {"t": 193.0, "x": "日本語の資料によれば、1952年に\n東郷の名前を分け合う組ができました。"}, {"t": 198.91666666666666, "x": "トーゴー・ブラザーズです。"}, {"t": 200.4, "x": "マス東郷を名乗ったのは日本の空手家でした。"}, {"t": 203.18333333333334, "x": "のちに大きな流派を開く人です。"}, {"t": 205.5, "x": "コウ東郷を名乗ったのが遠藤幸吉です。"}, {"t": 208.21666666666667, "x": "この遠藤が、のちに\n日本プロレスの幹部になります。"}, {"t": 211.78333333333333, "x": "トシ東郷を名乗った男もいました。"}, {"t": 214.0, "x": "ハワイ出身のハロルド坂田です。"}, {"t": 216.23333333333332, "x": "坂田は力道山をスカウトした人物です。"}, {"t": 219.03333333333333, "x": "東京スポーツがそう書いています。"}, {"t": 221.16666666666666, "x": "映画のゴールドフィンガーで、\n悪役のオッドジョブを演じた人でもあります。"}, {"t": 225.95, "x": "映画の武器の帽子は、\nリングでも凶器になりました。"}, {"t": 229.4, "x": "1954年7月、東郷は坂田と組みました。"}, {"t": 233.7, "x": "そしてカナダのタッグ王者になっています。"}, {"t": 236.16666666666666, "x": "力道山もアメリカを回っています。"}, {"t": 238.51666666666668, "x": "その巡業の1つで、\nマネージャーを務めたのが東郷でした。"}, {"t": 242.8, "x": "初めて日本プロレスのリングに\n上がったのは1959年9月です。"}, {"t": 247.53333333333333, "x": "試合の記録に残る最初の日付は9月18日でした。"}, {"t": 251.33333333333334, "x": "場所は東京の浪花町プロレスセンターです。"}, {"t": 254.31666666666666, "x": "東郷の相棒は、マイク・パイドウシスでした。"}, {"t": 257.3833333333333, "x": "相手は遠藤幸吉と芳の里です。"}, {"t": 259.9, "x": "結果は、2対1で東郷組の勝ちです。"}, {"t": 262.98333333333335, "x": "のちに東郷を解く側に回る2人と、\n東郷は最初の試合で戦っていました。"}, {"t": 268.2, "x": "このシリーズで東郷の名前が\n載った試合は6つあります。"}, {"t": 271.73333333333335, "x": "それからの東郷は、毎年のように日本へ来ました。"}, {"t": 275.3666666666667, "x": "1962年のワールド大リーグ戦は\n31の興行でした。"}, {"t": 280.05, "x": "東郷は27の興行に名前が載っています。"}, {"t": 283.1333333333333, "x": "アメリカでは憎まれる役でした。"}, {"t": 285.15, "x": "日本では日本側に立ちます。"}, {"t": 287.1666666666667, "x": "試合は耐える根性の試合と流血です。"}, {"t": 289.96666666666664, "x": "それで人気を得たと、\n東京スポーツは書いています。"}, {"t": 293.5833333333333, "x": "リングの外の仕事が窓口でした。"}, {"t": 295.9, "x": "ブッカーと呼ばれる役です。"}, {"t": 297.6, "x": "選手を集めて興行に送り込みます。"}, {"t": 300.1666666666667, "x": "大物外国人を次々に送ったのが東郷です。"}, {"t": 303.53333333333336, "x": "これも東京スポーツの記事にある話です。"}, {"t": 306.21666666666664, "x": "その仕事には料金が付きます。"}, {"t": 308.4166666666667, "x": "これがブッキング料です。"}, {"t": 310.05, "x": "東郷の流血が、社会問題になった試合があります。"}, {"t": 313.8833333333333, "x": "1962年4月27日、神戸の王子体育館です。"}, {"t": 319.03333333333336, "x": "客は1万人で満員でした。"}, {"t": 321.15, "x": "この試合もテレビで流れています。"}, {"t": 323.31666666666666, "x": "力道山の組に東郷と豊登が入りました。"}, {"t": 326.45, "x": "相手はルー・テーズ、フレッド・ブラッシー、\nマイク・シャープです。"}, {"t": 330.8, "x": "1本目の17分17秒、\n東郷はブラッシーに押さえ込まれます。"}, {"t": 335.75, "x": "ブラッシーは東郷の額に噛みつきました。"}, {"t": 338.31666666666666, "x": "東郷の顔は血で染まります。"}, {"t": 340.28333333333336, "x": "東京スポーツの写真には、\nこの流血戦の東郷が残っています。"}, {"t": 344.9, "x": "試合は0対2で力道山組の負けでした。"}, {"t": 347.8, "x": "翌28日の興行に、東郷の名前はありません。"}, {"t": 351.73333333333335, "x": "5月1日と2日の興行にも載っていません。"}, {"t": 354.78333333333336, "x": "この中継を見ていたお年寄りが\n亡くなったと報じられました。"}, {"t": 358.3666666666667, "x": "当時の新聞の見出しは、老人2人、\nテレビを見て、というものです。"}, {"t": 363.9166666666667, "x": "人数は資料によって2人から\n11人まで割れています。"}, {"t": 367.56666666666666, "x": "ショック死という言葉には疑問も出ています。"}, {"t": 370.1666666666667, "x": "ある法医学者は、医学の上で\n疑問が残ると書きました。"}, {"t": 374.05, "x": "東京スポーツは、\nこの中継の件をそう記しています。"}, {"t": 377.93333333333334, "x": "そして1963年の暮れです。"}, {"t": 380.73333333333335, "x": "11月26日、前橋でシリーズが始まりました。"}, {"t": 385.03333333333336, "x": "12月7日の浜松までの12日間です。"}, {"t": 388.1666666666667, "x": "試合の記録では、東郷は\nそのうち11試合に出ました。"}, {"t": 392.3, "x": "成績は5勝5敗1分けです。"}, {"t": 394.6166666666667, "x": "力道山と同じ側に立った試合が6つありました。"}, {"t": 397.93333333333334, "x": "12月2日の東京体育館には、\n1万2千人が入っています。"}, {"t": 402.9, "x": "その日の東郷は、豊登と組んで勝ちました。"}, {"t": 406.26666666666665, "x": "12月6日は名古屋でした。"}, {"t": 408.3, "x": "東郷は1人でイリオ・デ・パオロと戦います。"}, {"t": 410.95, "x": "シリーズの初日に敗れた相手です。"}, {"t": 413.28333333333336, "x": "この日は2対1で勝っています。"}, {"t": 415.3, "x": "12月7日の浜松市体育館は5000人です。"}, {"t": 418.76666666666665, "x": "力道山の組には吉村道明と東郷が入りました。"}, {"t": 422.3833333333333, "x": "相手はザ・デストロイヤーたちです。"}, {"t": 424.43333333333334, "x": "東京スポーツによれば、試合は血の乱撃戦です。"}, {"t": 428.15, "x": "力道山はレフェリーを空手で傷つけ、\n1本を反則で失います。"}, {"t": 432.9, "x": "最後は大乱闘のまま時間切れでした。"}, {"t": 435.53333333333336, "x": "結果は1対1の引き分けです。"}, {"t": 437.71666666666664, "x": "力道山は、シリーズの出来を\n90点だと話しました。"}, {"t": 441.76666666666665, "x": "そのまま夜行列車で東京へ戻ります。"}, {"t": 444.4166666666667, "x": "これが力道山の最後の試合でした。"}, {"t": 446.8666666666667, "x": "翌日の12月8日の夜、力道山は\n赤坂のナイトクラブで刺されました。"}, {"t": 452.1333333333333, "x": "亡くなったのは12月15日の\n午後9時50分です。"}, {"t": 455.7, "x": "39歳でした。"}, {"t": 457.28333333333336, "x": "残された側は、すぐに動きます。"}, {"t": 459.95, "x": "2日後、豊登は日本テレビの本社にいました。"}, {"t": 463.56666666666666, "x": "雑誌のNumberが書いています。"}, {"t": 465.55, "x": "日本テレビは、力道山の急死で\n中継の打ち切りを考えていました。"}, {"t": 470.35, "x": "豊登、遠藤、吉村、芳の里の4人が\n中継の継続を頼みに行ったのです。"}, {"t": 477.28333333333336, "x": "日本テレビは渋々認めます。"}, {"t": 479.4, "x": "ただし条件が3つ付きました。"}, {"t": 481.5, "x": "1つ目は、新しいエースの豊登に\n世界のベルトを巻かせることです。"}, {"t": 486.28333333333336, "x": "2つ目は、豊登に分かりやすい必殺技を\n作らせることです。"}, {"t": 490.8833333333333, "x": "3つ目は、月の平均視聴率が\n20%を切れば打ち切ることでした。"}, {"t": 495.8666666666667, "x": "東郷の解任は、この時期に起きています。"}, {"t": 498.983333333333 function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';

const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
