<script>
const D={"name": "坂口征二の引退", "file": "224_編集用", "dur": 860.15, "segs": [], "subs": [{"t": 0.0, "x": "1990年3月15日、福岡県。"}, {"t": 4.05, "x": "久留米県立体育館。"}, {"t": 5.733333333333333, "x": "観客は4,830人。"}, {"t": 8.133333333333333, "x": "超満員と記録されています。"}, {"t": 10.133333333333333, "x": "メインイベントは30分1本勝負の\nタッグマッチでした。"}, {"t": 13.816666666666666, "x": "試合は9分10秒で終わります。"}, {"t": 16.25, "x": "決まり手は稲妻レッグラリアートからの\n体固めでした。"}, {"t": 19.533333333333335, "x": "ただし、そのフォールを取ったのは、\nこの日引退する本人ではありません。"}, {"t": 24.766666666666666, "x": "組んでいた相手のほうでした。"}, {"t": 26.566666666666666, "x": "リングを降りたのは、坂口征二です。"}, {"t": 29.3, "x": "この日、48歳でした。"}, {"t": 31.75, "x": "柔道で日本一になり、プロレスに移り、\n日本プロレスから新日本プロレスへ渡り、"}, {"t": 37.733333333333334, "x": "選手をやりながら会社の役員をやってきた人です。"}, {"t": 41.3, "x": "引退の理由は、社長業に\n専念するため、と伝えられています。"}, {"t": 46.28333333333333, "x": "なぜ、この人は最後まで団体の看板ではなく、\n団体の側にいたのでしょうか。"}, {"t": 52.38333333333333, "x": "今回は、坂口征二という選手が残した記録を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 59.233333333333334, "x": "存命の方ですので、経営の判断や社内の力関係に\nついては断定せず、本人が語っている言葉と、"}, {"t": 66.85, "x": "記録として残っているものだけを並べます。"}, {"t": 69.66666666666667, "x": "イメージ映像"}, {"t": 69.66666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 72.16666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 77.75, "x": "まず、プロレスに入る前の記録から確認します。"}, {"t": 81.4, "x": "坂口征二は1942年2月17日、\n福岡県久留米市の生まれです。"}, {"t": 87.51666666666667, "x": "身長196センチ、体重は125キロから\n130キロと記録されています。"}, {"t": 93.96666666666667, "x": "柔道の記録も残っています。"}, {"t": 96.01666666666667, "x": "1965年、全日本柔道選手権で優勝。"}, {"t": 100.48333333333333, "x": "翌1966年は優勝を逃しました。"}, {"t": 103.86666666666666, "x": "同じ1965年、リオデジャネイロで\n行われた世界柔道選手権に日本代表として出場し、"}, {"t": 110.95, "x": "重量級で銅メダルを獲得しています。"}, {"t": 113.8, "x": "ここで、よく間違えられる点を\n1つ確認しておきます。"}, {"t": 117.75, "x": "坂口征二は、1964年の\n東京オリンピックには出場していません。"}, {"t": 123.5, "x": "当時、オランダのアントン・ヘーシンクを\n倒せる最右翼と見られていましたが、"}, {"t": 128.23333333333332, "x": "五輪を前にした夏に、高校時代からの\n古傷だった腰を練習中に痛めました。"}, {"t": 134.11666666666667, "x": "医者から止められ、代表からは漏れています。"}, {"t": 137.35, "x": "本人は、東京スポーツの取材にこう語っています。"}, {"t": 141.13333333333333, "x": "ヘーシンクには勝てる自信があった。"}, {"t": 143.36666666666667, "x": "腰を痛めたから五輪には出られなかった。"}, {"t": 145.96666666666667, "x": "だからテレビも見なかった。"}, {"t": 147.56666666666666, "x": "なお、その東京オリンピックの前には、\n日本代表の稽古相手として、仮想ヘーシンク役を"}, {"t": 154.5, "x": "務めていたと記録されています。"}, {"t": 156.28333333333333, "x": "当時のヘーシンクは、日本の柔道がまだ一度も\n負けていないと思われていた無差別級で、"}, {"t": 161.98333333333332, "x": "金メダルを取った選手です。"}, {"t": 164.06666666666666, "x": "イメージ映像"}, {"t": 164.06666666666666, "x": "その相手役に\n選ばれていた、ということになります。"}, {"t": 167.58333333333334, "x": "そして1967年2月17日。"}, {"t": 170.81666666666666, "x": "25歳の誕生日でした。"}, {"t": 172.8, "x": "赤坂のホテルニューオータニで、\n日本プロレス入団の発表が行われます。"}, {"t": 177.76666666666668, "x": "勤めていた旭化成工業を退職しての転向でした。"}, {"t": 181.35, "x": "デビューは同じ年の8月です。"}, {"t": 183.53333333333333, "x": "翌9月20日には、ロサンゼルスで\nカール・ゴッチと対戦し、"}, {"t": 187.45, "x": "時間切れ引き分けになっています。"}, {"t": 189.83333333333334, "x": "タイトルの記録も並べておきます。"}, {"t": 191.98333333333332, "x": "1972年2月11日、\nUNヘビー級王座を獲得。"}, {"t": 197.25, "x": "同じ年の9月6日にザ・シークに敗れますが、\n翌9月7日に奪い返しています。"}, {"t": 202.75, "x": "1972年5月19日には、\nロサンゼルスでファンク兄弟から"}, {"t": 207.75, "x": "インターナショナル・タッグ王座を奪いました。"}, {"t": 210.08333333333334, "x": "同じ年の12月2日には、\n大木金太郎と組んで再び戴冠しています。"}, {"t": 215.23333333333332, "x": "身長196センチは、\n当時の日本人選手としては最大級です。"}, {"t": 220.51666666666668, "x": "柔道の日本一という肩書と合わせて、\n団体が売りやすい選手でした。"}, {"t": 225.46666666666667, "x": "そして1971年に猪木が、1972年に\n馬場が、相次いで日本プロレスを離れます。"}, {"t": 233.23333333333332, "x": "残った日本人選手の中で上にいたのが、\n大木金太郎と坂口でした。"}, {"t": 238.26666666666668, "x": "つまり、この時期の坂口は\n日本プロレスの上位にいました。"}, {"t": 242.38333333333333, "x": "ところが、その日本プロレスが傾きます。"}, {"t": 245.4, "x": "当時のことを、本人は後年の\n連載でこう振り返っています。"}, {"t": 249.7, "x": "日本テレビの中継は4月に打ち切られ、頼みの\n綱であるNET中継の視聴率も芳しくない。"}, {"t": 256.4166666666667, "x": "そして、こうも書いています。"}, {"t": 258.6, "x": "ファイトマネー、給料の遅配が\n始まったのもこの頃から。"}, {"t": 262.56666666666666, "x": "イメージ映像"}, {"t": 262.56666666666666, "x": "ここから、この人の進む方向を\n決めた話が出てきます。"}, {"t": 266.5833333333333, "x": "坂口は、NET、いまのテレビ朝日から、\nこう告げられたと語っています。"}, {"t": 272.6, "x": "このままではプロレス中継は存続できない。"}, {"t": 275.4166666666667, "x": "猪木と一緒にできるか。"}, {"t": 277.01666666666665, "x": "それが中継存続の条件だ。"}, {"t": 279.26666666666665, "x": "団体の側ではなく、放送局の側から\n条件が出された、ということになります。"}, {"t": 285.1166666666667, "x": "1973年2月8日、東京・新宿の\n京王プラザホテルで記者会見が開かれました。"}, {"t": 291.9166666666667, "x": "アントニオ猪木と坂口征二が並んでいます。"}, {"t": 294.8333333333333, "x": "発表された内容は、こういうものでした。"}, {"t": 297.96666666666664, "x": "新日本プロレスを発展的解消し、\n日本プロレスから坂口以下11人の"}, {"t": 303.4, "x": "レスラーが出て、新会社を作り、この2者が\n合同して3月中旬をメドに新発足したい。"}, {"t": 310.0, "x": "つまり、合併の構想です。"}, {"t": 312.78333333333336, "x": "しかし、この構想は成立しませんでした。"}, {"t": 316.1166666666667, "x": "日本プロレスの側が反発したためです。"}, {"t": 318.8, "x": "坂口の回想によれば、大木金太郎は\nこう言ったと伝えられています。"}, {"t": 323.6, "x": "力道山先生の作った日本プロレスを守るのが筋。"}, {"t": 327.1333333333333, "x": "今さら猪木とは一緒にはできない。"}, {"t": 329.26666666666665, "x": "合併は流れました。"}, {"t": 330.85, "x": "1973年3月8日、\n坂口は日本プロレスを退団します。"}, {"t": 336.31666666666666, "x": "日本プロレスでの最後の試合は、\n栃木の佐野大会でした。"}, {"t": 340.45, "x": "3月30日、大田区体育館で\n行われた新日本プロレスの"}, {"t": 345.1, "x": "旗揚げ1周年記念興行に姿を見せ、\nあいさつをしています。"}, {"t": 349.6166666666667, "x": "そして1973年4月1日、\n佐賀の鹿島大会から、"}, {"t": 354.6166666666667, "x": "新日本プロレスのリングに合流しました。"}, {"t": 357.51666666666665, "x": "構想では11人が出るはずでした。"}, {"t": 359.98333333333335, "x": "実際に動いたのは、坂口を含めて4人です。"}, {"t": 363.5833333333333, "x": "一緒に移ったのは、3人の若手です。"}, {"t": 366.65, "x": "のちに木村健悟と\n名乗る選手、のちにキラー・カーンと"}, {"t": 370.23333333333335, "x": "名乗る小沢正志、そして大城という選手でした。"}, {"t": 373.85, "x": "合流の直後、坂口はこうコメントしています。"}, {"t": 377.3833333333333, "x": "新しいスタートですからね。"}, {"t": 379.18333333333334, "x": "力一杯やった日プロ時代と\n変わったと言われたくない。"}, {"t": 382.56666666666666, "x": "坂口が入った効果は、\nすぐに数字として出ました。"}, {"t": 386.3, "x": "1973年4月6日、NETの金曜夜8時の\n枠で、新日本プロレスの中継が始まります。"}, {"t": 394.53333333333336, "x": "放送局が出した条件が満たされた形です。"}, {"t": 397.53333333333336, "x": "4月20日、蔵前国技館。"}, {"t": 400.18333333333334, "x": "猪木と坂口のタッグが、\nおよそ1年6か月ぶりに復活しました。"}, {"t": 404.9166666666667, "x": "結果は外国人組に2対0のストレート勝ちです。"}, {"t": 408.21666666666664, "x": "当時この団体にいた山本小鉄は、\n後年こう語っています。"}, {"t": 412.51666666666665, "x": "柔道日本一の看板を引っさげ、\nプロレス入りした坂口はゴツかった。"}, {"t": 417.5, "x": "体が硬く、ブリッジなんかはできなかったけど、\nそれを補うパワーがあった。"}, {"t": 423.01666666666665, "x": "そして、こうも述べています。"}, {"t": 425.2, "x": "日プロ離脱後、\n馬場さんのところに行く選択肢もあったと"}, {"t": 429.01666666666665, "x": "思うけど、猪木さんのほうに合流した。"}, {"t": 431.9, "x": "結果的にこの決断は正解だった。"}, {"t": 434.3666666666667, "x": "猪木の側にも、坂口を\n誘ったときの言葉が残っています。"}, {"t": 438.55, "x": "2005年のインタビューで\nこう振り返ったと伝えられています。"}, {"t": 442.2, "x": "泥舟に乗って沈んで行くのもよし。"}, {"t": 444.48333333333335, "x": "でも、俺たちが新しい船出をすれば\n沈んで行く人たちを救うこともできるよ。"}, {"t": 449.8333333333333, "x": "合流したあとのタイトルの記録も並べておきます。"}, {"t": 452.8833333333333, "x": "1974年8月16日、猪木と\n組んでNWA北米タッグ王座を獲得。"}, {"t": 459.48333333333335, "x": "この王座は通算3回巻いています。"}, {"t": 461.96666666666664, "x": "1976年と1977年には、\nワールドリーグ戦で優勝しました。"}, {"t": 468.2, "x": "1979年1月26日、ジョニー・パワーズを\n破ってNWF北米ヘビー級王座を獲得。"}, {"t": 475.96666666666664, "x": "同じ年の11月8日には、\nパット・パターソンから"}, {"t": 479.5833333333333, "x": "WWF北米ヘビー級王座を奪っています。"}, {"t": 482.98333333333335, "x": "ただし、この人が\nいちばん多く名前を出されるのは、"}, {"t": 486.6, "x": "王座の記録ではありません。"}, {"t": 488.6333333333333, "x": "会社の役職のほうです。"}, {"t": 490.4166666666667, "x": "1983年の夏、\n新日本プロレスで内紛が起きました。"}, {"t": 495.4, "x": "8月25日、青山の事務所で緊急役員会が開かれ、\nアントニオ猪木が社長の辞任を表明します。"}, {"t": 503.5, "x": "このとき坂口は、取締役副社長から降格しました。"}, {"t": 507.71666666666664, "x": "復帰の日付については資料が割れています。"}, {"t": 510.5, "x": "11月の株主総会で猪木が\n社長に戻り、坂口も副社長に"}, {"t": 515.35, "x": "復帰した、というところまでが共通しています。"}, {"t": 518.5833333333334, "x": "この時期、新日本プロレスの\n財政が苦しくなっていたことも、"}, {"t": 522.6833333333333, "x": "複数の記事が共通して書いています。"}, {"t": 525.45, "x": "猪木がブラジルで始めた事業が\nうまくいかなかったためです。"}, {"t": 529.0, "x": "イメージ映像"}, {"t": 529.0, "x": "金額については、東京スポーツが\n数十億円の借金とだけ書いています。"}, {"t": 534.2, "x": "ここでは具体的な金額を挙げません。"}, {"t": 536.6833333333333, "x": "そして、坂口がその借金をどう処理したのか。"}, {"t": 540.2333333333333, "x": "あるいは処理したのかどうか。"}, {"t": 541.9666666666667, "x": "それを示す報道や証言は、\n今回の調査では確認できませんでした。"}, {"t": 547.0, "x": "確認できな const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
