<script>
const D={"name": "平壌38万人", "file": "231_編集用", "dur": 857.3833125, "segs": [], "subs": [{"t": 0.0, "x": "1995年4月29日、平壌。"}, {"t": 4.016666666666667, "x": "綾羅島にあるメーデースタジアムに、\nリングが1つ組まれていました。"}, {"t": 8.266666666666667, "x": "収容15万人のこの競技場に、この日は\n19万人が入ったと発表されています。"}, {"t": 14.4, "x": "プロレスの興行として、世界で最も\n多いとされる観客数の発表記録です。"}, {"t": 19.816666666666666, "x": "リングに上がったのは、\nアントニオ猪木とリック・フレアー。"}, {"t": 23.4, "x": "当時の猪木は52歳、現職の参議院議員でした。"}, {"t": 27.433333333333334, "x": "立会人として、モハメド・アリが\nリングサイドに座っています。"}, {"t": 31.533333333333335, "x": "そして試合が始まるまでの客席は、\n静かだったと複数の同行者が語っています。"}, {"t": 37.18333333333333, "x": "なぜ日本のプロレス団体が、\n国交のない国の競技場でリングを"}, {"t": 41.56666666666667, "x": "組むことになったのでしょうか。"}, {"t": 43.13333333333333, "x": "今回は2日間で38万人と発表されたこの興行を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 50.45, "x": "最後までご覧いただければ幸いです。"}, {"t": 52.95, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 58.53333333333333, "x": "まず、この話が動き出すまでの\n経緯から確認します。"}, {"t": 62.56666666666667, "x": "アントニオ猪木の師匠は力道山です。"}, {"t": 65.16666666666667, "x": "力道山は1924年11月14日、\n朝鮮半島北部の咸鏡南道の生まれとされています。"}, {"t": 72.88333333333334, "x": "生年については諸説あります。"}, {"t": 75.11666666666666, "x": "本名は金信洛。"}, {"t": 76.71666666666667, "x": "のちに百田光浩として日本国籍を取得しました。"}, {"t": 80.06666666666666, "x": "1963年12月8日に東京の\nナイトクラブで刺され、1週間後の"}, {"t": 85.81666666666666, "x": "12月15日に亡くなっています。"}, {"t": 88.01666666666667, "x": "死因は腹膜炎、39歳でした。"}, {"t": 91.48333333333333, "x": "そして力道山の血縁は、\nその後も朝鮮半島に残っています。"}, {"t": 96.16666666666667, "x": "孫娘のパク・ヘジョンは北朝鮮の\n重量挙げの指導者になり、2002年の"}, {"t": 101.3, "x": "釜山アジア大会に関わりました。"}, {"t": 103.4, "x": "娘婿の朴明哲は、2010年に\n北朝鮮の体育相に就いています。"}, {"t": 108.66666666666667, "x": "猪木が力道山にスカウトされたのは\n1960年4月11日でした。"}, {"t": 113.73333333333333, "x": "場所はブラジルのサンパウロです。"}, {"t": 115.73333333333333, "x": "興行で現地を訪れていた力道山に\n直接声をかけられ、"}, {"t": 119.6, "x": "日本へ渡って日本プロレスに入団しました。"}, {"t": 122.81666666666666, "x": "この師弟関係が、のちの訪朝の入口になります。"}, {"t": 126.5, "x": "猪木は1989年の第15回参議院議員通常選挙に\n比例区から出馬しました。"}, {"t": 132.81666666666666, "x": "99万3989票を集めての初当選です。"}, {"t": 137.36666666666667, "x": "掲げていたのはスポーツを通じた外交でした。"}, {"t": 140.3, "x": "1990年12月にはイラクのバグダッドで\n「平和の祭典」を開いています。"}, {"t": 145.58333333333334, "x": "このイベントの開催後に、\n日本人人質が解放されました。"}, {"t": 149.8, "x": "イメージ映像"}, {"t": 149.8, "x": "北朝鮮の話が出てきたのは1994年の初夏です。"}, {"t": 154.0, "x": "当時の新日本プロレス取締役、\n永島勝司はこう語っています。"}, {"t": 159.01666666666668, "x": "「猪木が北に興味を持ったのは\n94年の初夏でした」"}, {"t": 162.23333333333332, "x": "「北朝鮮で生まれた力道山のために平壌に\n殿堂を作りたいと言い出してね」最初の"}, {"t": 167.21666666666667, "x": "訪朝は1994年7月に予定されていました。"}, {"t": 171.15, "x": "しかし7月8日に金日成主席が\n死去し、延期になります。"}, {"t": 175.63333333333333, "x": "実際に猪木が平壌に入ったのは、\n同じ年の9月でした。"}, {"t": 179.9, "x": "このとき朝鮮労働党書記の金容淳と会っています。"}, {"t": 183.38333333333333, "x": "永島は、その場のやり取りを\nこう振り返っています。"}, {"t": 186.98333333333332, "x": "「金容淳がプロレスを\n国民に見せることはできないかと聞いてきた」"}, {"t": 190.61666666666667, "x": "「すると猪木はすぐに私の方を見て、やるよなと\n言わんばかりの表情をした」"}, {"t": 195.48333333333332, "x": "日本側の窓口になったのは、\n在日本朝鮮人総聯合会でした。"}, {"t": 200.25, "x": "日本の1団体だけでは、\nこの規模は組めませんでした。"}, {"t": 203.98333333333332, "x": "猪木はアメリカのWCWに協力を求めます。"}, {"t": 207.6, "x": "参加したのはリック・フレアー、\nスコット・ノートン、スコット・スタイナー、"}, {"t": 212.51666666666668, "x": "リック・スタイナーらです。"}, {"t": 214.21666666666667, "x": "ハルク・ホーガンにも話はありましたが、\n参加していません。"}, {"t": 217.96666666666667, "x": "フレアーが引き受けた形でした。"}, {"t": 220.01666666666668, "x": "女子の試合は全日本女子プロレスが\n提供しています。"}, {"t": 223.46666666666667, "x": "来賓にはモハメド・アリが招かれました。"}, {"t": 225.96666666666667, "x": "北朝鮮側が最初に希望したのは\nマイケル・ジョーダンだったと記録されています。"}, {"t": 230.58333333333334, "x": "ジョーダン本人が訪朝に乗り気ではなかったため、\n猪木と親交のあるアリになりました。"}, {"t": 236.13333333333333, "x": "アリを口説いたのは、WCW側の\n責任者だったエリック・ビショフです。"}, {"t": 241.51666666666668, "x": "アリと猪木は1976年6月26日、\n日本武道館で対戦しています。"}, {"t": 247.8, "x": "異種格闘技戦として15ラウンドを\n戦い、結果は引き分けでした。"}, {"t": 252.38333333333333, "x": "その2人が19年後、\n平壌の競技場で並ぶことになりました。"}, {"t": 257.1333333333333, "x": "もう1つ、WCW側の当初の\n構想も記録に残っています。"}, {"t": 262.6333333333333, "x": "メインイベントは、\nプロレスラー対ボクサーの形にする案でした。"}, {"t": 266.8666666666667, "x": "相手として名前が挙がっていたのは\nジョージ・フォアマンです。"}, {"t": 270.0833333333333, "x": "この案は実現しませんでした。"}, {"t": 272.2, "x": "大会の名前は「平和のための\n平壌国際体育・文化祝典」です。"}, {"t": 276.51666666666665, "x": "日程は1995年4月28日と29日の2日間。"}, {"t": 281.35, "x": "会場は綾羅島のメーデースタジアム。"}, {"t": 283.8, "x": "1989年に完成した、\n収容15万人の競技場です。"}, {"t": 289.0833333333333, "x": "競技場としては世界最大級の規模にあたります。"}, {"t": 292.31666666666666, "x": "開催の時期についても、事情がありました。"}, {"t": 295.3833333333333, "x": "前年1994年7月8日に金日成主席が死去し、\n1年の喪に服す期間に入っていたためです。"}, {"t": 303.18333333333334, "x": "観客数について、先に断っておきます。"}, {"t": 306.46666666666664, "x": "発表されたのは初日19万人、2日目19万人。"}, {"t": 310.96666666666664, "x": "2日間の合計38万人という数字が、\n日本では広く伝えられています。"}, {"t": 316.48333333333335, "x": "ただしこれは主催者発表です。"}, {"t": 318.53333333333336, "x": "日本語版のウィキペディアは初日を15万人と\n記載しており、資料によって割れています。"}, {"t": 324.4166666666667, "x": "アメリカの専門紙レスリング・オブザーバーの\nデイブ・メルツァーは、"}, {"t": 327.96666666666664, "x": "別の数字を出しています。"}, {"t": 329.8833333333333, "x": "発表は16万5000人と\n19万人だったが、実数は15万人前後と"}, {"t": 335.53333333333336, "x": "16万5000人前後だった、という指摘です。"}, {"t": 339.05, "x": "メルツァーはあわせて、\n観客の大半が無料で入場し、事実上観戦を"}, {"t": 344.45, "x": "指示されていたとも書いています。"}, {"t": 346.2, "x": "実数がいくつだったのかは、\n現在も確定していません。"}, {"t": 350.01666666666665, "x": "この動画では、38万人はあくまで\n発表された数字として扱います。"}, {"t": 355.21666666666664, "x": "イメージ映像"}, {"t": 355.21666666666664, "x": "日本からも観戦ツアーが組まれました。"}, {"t": 357.6666666666667, "x": "朝鮮総連系の中外旅行社と、\n大手旅行会社のJTBによる共同開催です。"}, {"t": 363.81666666666666, "x": "「朝鮮プロレス観光ツアー」という名前で\n売り出されました。"}, {"t": 367.3, "x": "このツアーについて、朝鮮半島情勢に\n詳しい李氏は文春オンラインの"}, {"t": 372.4166666666667, "x": "取材にこう語っています。"}, {"t": 374.0, "x": "「思ったよりも応募者が集まらず、\nツアー直前になっても航空便の空席が"}, {"t": 379.03333333333336, "x": "埋まらなかったのを覚えています」日本の\n報道陣は、およそ50人が現地に入りました。"}, {"t": 384.6333333333333, "x": "プロレス専門誌、スポーツ紙、\n一般紙、テレビ朝日が同行しています。"}, {"t": 390.7, "x": "作家の村松友視も同行しました。"}, {"t": 393.1666666666667, "x": "初日、1995年4月28日。"}, {"t": 397.1333333333333, "x": "試合開始は20時、組まれたのは7試合でした。"}, {"t": 400.9166666666667, "x": "第1試合は永田裕志が石澤常光を\nグラウンド・フェースロックで下します。"}, {"t": 405.71666666666664, "x": "4分28秒。"}, {"t": 407.26666666666665, "x": "第2試合は女子のタッグマッチ。"}, {"t": 409.3, "x": "北斗晶とブル中野が、豊田真奈美と\n吉田万里子を8分34秒で破りました。"}, {"t": 415.0, "x": "イメージ映像"}, {"t": 415.0, "x": "第3試合は馳浩がワイルド・ペガサスに\nノーザンライト・スープレックス・ホールド。"}, {"t": 419.81666666666666, "x": "10分10秒。"}, {"t": 421.0, "x": "第4試合は蝶野正洋とヒロ斉藤が、\nエル・サムライと安田忠夫を"}, {"t": 425.76666666666665, "x": "8分6秒で下しています。"}, {"t": 427.6166666666667, "x": "イメージ映像"}, {"t": 427.6166666666667, "x": "第5試合はフライング・スコーピオ対大谷晋二郎。"}, {"t": 430.95, "x": "大谷が鼻骨を折り、2分37秒で\nレフェリーストップとなりました。"}, {"t": 435.8666666666667, "x": "第6試合は佐々木健介がマサ斎藤を\nパワースラムから片エビ固め。"}, {"t": 440.35, "x": "8分34秒。"}, {"t": 441.95, "x": "メインイベントはIWGPヘビー級選手権、\n橋本真也対スコット・ノートンです。"}, {"t": 448.1, "x": "結果は時間切れ引き分けでした。"}, {"t": 450.21666666666664, "x": "この初日には、入場曲を\nめぐる出来事も記録されています。"}, {"t": 454.48333333333335, "x": "北朝鮮側の指示で、\n選手の入場曲が変更されました。"}, {"t": 458.8666666666667, "x": "2日目は新日本プロレス側が主張し、\n通常の曲を使っています。"}, {"t": 463.71666666666664, "x": "この初日について、リングアナウンサーの\n田中秀和はこう語っています。"}, {"t": 468.55, "x": "「メインの橋本・ノートン戦ですら、\n思ったほど沸かなかった」"}, {"t": 472.3, "x": "「日本なら地鳴りが起きるような攻防が、\nまるで吸い込まれるように無反応だったんです」"}, {"t": 477.45, "x": "永島勝司も、初日の手応えを\nこう振り返っています。"}, {"t": 481.28333333333336, "x": "「初日は女子プロレスが大ウケ。"}, {"t": 483.3666666666667, "x": "逆に新日のプロレスはあまり盛り上がらなかった」\n会場が沸いた場面として永島が挙げているのは、"}, {"t": 489.1666666666667, "x": "VIP席のアリが紹介されたときでした。"}, {"t": 491.9166666666667, "x": "2日目、4月29日は8試合が組まれました。"}, {"t": 495.68333333333334, "x": "第2試合では、前日タッグを組んでいた北斗晶と\nブル中野がシングルで対戦しています。"}, {"t": 501.68333333333334, "x": "決着は8分47秒。"}, {"t": 503.8833333333333, "x": "カメラマンの原悦生は、この2人の\n入場についてこう語っています。"}, {"t": 508.51666666666665, "x": "「リングに上がる前から、視覚で完全に\n制圧していましたね」村松友視は、女子の試合が"}, {"t": 514.6333333333333, "x": "男子プロレスを完全に凌駕するほどの歓声を\n受けていたと書いています。"}, {"t": 518.8166666666667, "x": "この2日間の女子の試合を見て、\n猪木の女子プロレスに対する評価が"}, {"t": 523.4166666666666, "x": "変わったとも記録されています。"}, {"t": 525.1333333333333, "x": "残りのカードも並べておきます。"}, {"t": 527.2666666666667, "x": "第1試合はヒロ斉藤が永田裕志に\nダイビング・セントーンから片エビ固め。"}, {"t": 532.1333333333333, "x": "5分29秒。"}, { \nいくつかのものが残りました。"}, {"t": 673.0166666666667, "x": "北米ではこの興行の一部が\n「コリジョン・イン・コリア」という名前で"}, {"t": 676.7666666666667, "x": "放送されています。"}, {"t": 678.0333333333333, "x": "1995年8月4日、WCWが8試合を\n選んでペイ・パー・ビューで流しました。"}, {"t": 685.3166666666667, "x": "アメリカでの購入はおよそ3万件です。"}, {"t": 688.15, "x": "北朝鮮は、この大会の\n記念切手セットを発行しています。"}, {"t": 692.5333333333333, "x": "リック・フレアーについては、帰国前に声明を\n読むよう求められたという話が残っています。"}, {"t": 698.5, "x": "フレアーはこれに応じず、\n別の言い方でかわしたとされています。"}, {"t": 702.7833333333333, "x": "もう1つ、この遠征から生まれたものがあります。"}, {"t": 706.2666666666667, "x": "新日本プロレスの佐々木健介が、\nこの興行で北斗晶に一目惚れし、のちに"}, {"t": 712.1666666666666, "x": "結婚に至ったと記録されています。"}, {"t": 714.3, "x": "猪木本人については、\n興行の3か月後に節目が来ました。"}, {"t": 718.6166666666667, "x": "1995年7月の参議院議員通常選挙で\n落選し、議席を失っています。"}, {"t": 725.2333333333333, "x": "1989年の初当選から6年でした。"}, {"t": 728.8833333333333, "x": "ここまでの事実を日付で並べ直しておきます。"}, {"t": 731.8166666666667, "x": "イメージ映像"}, {"t": 731.8166666666667, "x": "1924年11月14日、\n力道山が朝鮮半島北部で生まれる。"}, {"t": 737.8166666666667, "x": "生年には諸説あり。"}, {"t": 739.4, "x": "1960年4月11日、猪木が\nサンパウロで力道山にスカウトされる。"}, {"t": 745.1, "x": "1989年、\n第15回参議院議員通常選挙で猪木が初当選。"}, {"t": 751.4, "x": "99万3989票。"}, {"t": 754.4333333333333, "x": "1994年7月8日、\n金日成主席が死去し、訪朝が延期。"}, {"t": 760.5, "x": "1994年9月、\n猪木が平壌に入り、金容淳と会う。"}, {"t": 766.2166666666667, "x": "1995年4月28日、\n平壌メーデースタジアムで初日7試合。"}, {"t": 772.3666666666667, "x": "メインは時間切れ引き分け。"}, {"t": 774.2333333333333, "x": "1995年4月29日、2日目8試合。"}, {"t": 778.7333333333333, "x": "猪木がフレアーに14分52秒、延髄斬りで勝利。"}, {"t": 783.0, "x": "1995年7月、猪木が参議院議員選挙で落選。"}, {"t": 788.0166666666667, "x": "1995年8月4日、\n北米でペイ・パー・ビュー放送。"}, {"t": 792.8833333333333, "x": "購入はおよそ3万件。"}, {"t": 794.8, "x": "1995年10月9日、\n東京ドームで6万7000人。"}, {"t": 799.9166666666666, "x": "新日本プロレスが平壌で興行を\n行ったのは、この2日間だけです。"}, {"t": 804.9, "x": "団体単独の最多動員としては、\n1998年4月4日の"}, {"t": 810.0, "x": "東京ドーム7万人が記録に残っています。"}, {"t": 812.85, "x": "平壌の19万人は共同開催のため、\nその記録には含まれていません。"}, {"t": 818.25, "x": "猪木自身は19年後、\n2014年8月30日と31日に、自身の"}, {"t": 824.5666666666667, "x": "団体IGFで再び平壌大会を開いて const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
