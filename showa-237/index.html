<script>
const D={"name": "古舘伊知郎", "file": "237_編集用", "dur": 960.3, "segs": [], "subs": [{"t": 0.0, "x": "1986年9月26日、金曜日の夜8時。"}, {"t": 4.816666666666666, "x": "テレビ朝日では、いつもどおり\n『ワールドプロレスリング』が始まっていました。"}, {"t": 9.3, "x": "もっとも、この日は生放送ではなく、\n9月19日の福岡スポーツセンター大会と"}, {"t": 15.25, "x": "イメージ映像"}, {"t": 15.25, "x": "9月16日の大阪城ホール大会を\n合わせた録画中継です。"}, {"t": 19.4, "x": "ところが、この放送を最後に、金曜夜8時の\n枠からプロレス中継はなくなってしまいます。"}, {"t": 25.816666666666666, "x": "日本プロレス中継の時代から\n数えて、14年2か月。"}, {"t": 30.033333333333335, "x": "イメージ映像"}, {"t": 30.033333333333335, "x": "日本テレビが金曜8時にプロレス中継を\n入れた1958年9月から数えると、28年です。"}, {"t": 37.46666666666667, "x": "イメージ映像"}, {"t": 37.46666666666667, "x": "翌週の金曜8時には、もう\nプロレスはやっていませんでした。"}, {"t": 41.78333333333333, "x": "イメージ映像"}, {"t": 41.78333333333333, "x": "その金曜8時の実況席に、ずっと\n座り続けていたアナウンサーがいます。"}, {"t": 47.0, "x": "試合よりも、そのしゃべりのほうが\n知られていった人物です。"}, {"t": 51.0, "x": "では、その実況が終わったのは、\nいつだったのでしょうか。"}, {"t": 55.18333333333333, "x": "今回は、古舘伊知郎という実況アナウンサーと、\n金曜夜8時という放送枠の記録を、"}, {"t": 61.86666666666667, "x": "確認できた日付と数字だけで辿っていきます。"}, {"t": 65.05, "x": "最後までご覧いただければ幸いです。"}, {"t": 67.53333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 73.11666666666666, "x": "まず、枠のほうから確認しておきます。"}, {"t": 76.36666666666666, "x": "イメージ映像"}, {"t": 76.36666666666666, "x": "1973年4月6日、金曜日。"}, {"t": 80.06666666666666, "x": "『ワールドプロレスリング』という\nタイトルが、半年ぶりに復活しました。"}, {"t": 84.5, "x": "イメージ映像"}, {"t": 84.5, "x": "中継の対象は、この日に\n開幕した新日本プロレスの'"}, {"t": 88.48333333333333, "x": "73ビッグ・ファイト・シリーズです。"}, {"t": 91.05, "x": "放送開始前日の新聞に載った\nキャッチコピーは、こういうものでした。"}, {"t": 95.88333333333334, "x": "アントニオ猪木、坂口征二。"}, {"t": 98.43333333333334, "x": "プロレス界の巨星10チャンネルで大暴れ。"}, {"t": 101.03333333333333, "x": "ビッグファイトは明晩から独占中継。"}, {"t": 103.66666666666667, "x": "1973年4月4日付の\n東京スポーツに掲載された文面です。"}, {"t": 109.03333333333333, "x": "イメージ映像"}, {"t": 109.03333333333333, "x": "新日本プロレスは1972年3月に\n旗揚げしましたが、"}, {"t": 113.51666666666667, "x": "テレビ中継がありませんでした。"}, {"t": 115.83333333333333, "x": "イメージ映像"}, {"t": 115.83333333333333, "x": "そのため旗揚げから半年で、\n累積赤字が1億円に達しています。"}, {"t": 120.73333333333333, "x": "金曜8時の中継が始まり、放映権料が\n定期的に入るようになったことで、"}, {"t": 126.25, "x": "この経営は立て直されました。"}, {"t": 128.46666666666667, "x": "イメージ映像"}, {"t": 128.46666666666667, "x": "数字も残っています。"}, {"t": 130.0, "x": "1973年末の時点で\n15パーセントから18パーセント台。"}, {"t": 134.91666666666666, "x": "プロレス中継ではトップに立ち、\n日本テレビの『太陽にほえろ!』と"}, {"t": 139.61666666666667, "x": "競争する関係になりました。"}, {"t": 141.46666666666667, "x": "1974年3月19日、猪木対ストロング小林の\n初対決が19.8パーセント。"}, {"t": 148.65, "x": "同じ年の10月10日、\n猪木対大木金太郎が20.2パーセント。"}, {"t": 153.51666666666668, "x": "この試合を境に、大きな試合のたびに\n20パーセントを超えるようになります。"}, {"t": 158.71666666666667, "x": "1976年2月6日、格闘技世界一決定戦、\n猪木対ウィレム・ルスカの"}, {"t": 165.08333333333334, "x": "生中継が34.6パーセント。"}, {"t": 167.63333333333333, "x": "ビデオリサーチの関東地区調べで、\nこの番組の最高視聴率です。"}, {"t": 172.43333333333334, "x": "翌週に放送された再放送も\n26.8パーセントでした。"}, {"t": 176.66666666666666, "x": "イメージ映像"}, {"t": 176.66666666666666, "x": "この枠に、1人のアナウンサーが入ってきます。"}, {"t": 179.93333333333334, "x": "古舘伊知郎。"}, {"t": 181.1, "x": "1954年12月7日、\n東京都北区の生まれです。"}, {"t": 185.8, "x": "立教高等学校から\n立教大学経済学部経済学科に進みました。"}, {"t": 190.63333333333333, "x": "イメージ映像"}, {"t": 190.63333333333333, "x": "1977年、全国朝日放送に\nアナウンサーとして入社します。"}, {"t": 196.18333333333334, "x": "この年の4月に、日本教育テレビから\nテレビ朝日へ社名が変わりました。"}, {"t": 201.16666666666666, "x": "つまり古舘は、\nテレビ朝日という社名になってからの一期生です。"}, {"t": 205.71666666666667, "x": "当時テレビ朝日はモスクワオリンピックの\n独占放映権を持っており、その関係で"}, {"t": 211.25, "x": "アナウンサーを大量に採用しました。"}, {"t": 213.51666666666668, "x": "イメージ映像"}, {"t": 213.51666666666668, "x": "この年の採用は、男女\n合わせて10人近くという異例の人数です。"}, {"t": 218.25, "x": "同期には中里雅子、吉澤一彦、\n南美希子、宮嶋泰子、渡辺宜嗣がいます。"}, {"t": 226.18333333333334, "x": "イメージ映像"}, {"t": 226.18333333333334, "x": "配属は、入社した年の7月でした。"}, {"t": 229.31666666666666, "x": "『ワールドプロレスリング』の担当です。"}, {"t": 231.53333333333333, "x": "実況デビュー戦は、埼玉県の越谷市体育館で\n行われた長州力対エル・ゴリアス戦でした。"}, {"t": 238.33333333333334, "x": "イメージ映像"}, {"t": 238.33333333333334, "x": "番組の実況アナウンサーの記録では、\n担当期間は1977年7月から"}, {"t": 244.35, "x": "イメージ映像"}, {"t": 244.35, "x": "1987年3月までとなっています。"}, {"t": 247.51666666666668, "x": "そのうちレギュラーとして担当したのは\n1979年からだと記録されています。"}, {"t": 252.91666666666666, "x": "1980年からは、解説の\n山本小鉄とコンビを組みました。"}, {"t": 257.85, "x": "担当を引き受ける直前に、\n先輩からアドバイスを受けています。"}, {"t": 262.26666666666665, "x": "日本プロレス中継の時代からメイン実況を\n務めていた舟橋慶一の言葉です。"}, {"t": 267.3333333333333, "x": "絶対に人のマネはするなよ。"}, {"t": 269.3, "x": "ただし、どこかでヒントを得たものは吸収して、\n独自に言葉を考えてどんどん使え。"}, {"t": 275.71666666666664, "x": "イメージ映像"}, {"t": 275.71666666666664, "x": "その通りになりました。"}, {"t": 277.23333333333335, "x": "アンドレ・ザ・ジャイアントには、人間山脈。"}, {"t": 280.23333333333335, "x": "身長223センチのアンドレが\n歩く姿には、ひとり民族大移動。"}, {"t": 285.4, "x": "ハルク・ホーガンには、\n現代に甦ったネプチューン。"}, {"t": 289.0, "x": "おーーーーーっと。"}, {"t": 290.1333333333333, "x": "掟破りの逆サソリ。"}, {"t": 291.75, "x": "名勝負数え唄。"}, {"t": 293.18333333333334, "x": "風車の理論。"}, {"t": 294.45, "x": "エリート・雑草逆転劇。"}, {"t": 296.25, "x": "イメージ映像"}, {"t": 296.25, "x": "こうした言い回しは、\n過激実況と呼ばれるようになります。"}, {"t": 300.18333333333334, "x": "プロレスそのものを、闘いの\nワンダーランドと形容したのもこの人です。"}, {"t": 304.8666666666667, "x": "言葉は、画面の上にも出るようになりました。"}, {"t": 308.01666666666665, "x": "視聴率がピークだった1982年ごろのことです。"}, {"t": 311.9, "x": "イメージ映像"}, {"t": 311.9, "x": "選手が花道を入場してくるとき、実況に合わせて\nキャッチフレーズのテロップが映されました。"}, {"t": 317.9166666666667, "x": "イメージ映像"}, {"t": 317.9166666666667, "x": "燃える闘魂。人間山脈。超人。"}, {"t": 320.98333333333335, "x": "世界の荒鷲。"}, {"t": 322.25, "x": "SUPERロデオマシン。"}, {"t": 323.76666666666665, "x": "1983年8月4日の放送分では、\n激怒、アニマル浜口、"}, {"t": 329.75, "x": "執念の鬼ラッシャー木村、因縁の対決。"}, {"t": 333.3333333333333, "x": "1984年2月3日の放送分では、雪華の対決。"}, {"t": 338.46666666666664, "x": "次のシリーズに来る外国人選手を\n紹介する場面でも、同じ調子の"}, {"t": 343.31666666666666, "x": "文言がテロップで流れています。"}, {"t": 345.26666666666665, "x": "イメージ映像"}, {"t": 345.26666666666665, "x": "マット上、戦況は混沌としております。"}, {"t": 348.48333333333335, "x": "内乱、テロ、リボリューションと\n様々な断面を見せながら、過激なプロレスを"}, {"t": 354.6333333333333, "x": "超えたシュールな戦い模様であります。"}, {"t": 356.76666666666665, "x": "燎原の火、\n逆巻く次期ブラディ・ファイト・シリーズに"}, {"t": 360.0833333333333, "x": "どうぞご期待下さい。"}, {"t": 361.35, "x": "イメージ映像"}, {"t": 361.35, "x": "地方の会場から中継する日には、その土地の\n歴史や産業を調べて実況に混ぜました。"}, {"t": 367.4, "x": "コマーシャルに入る前の\n決まり文句も残っています。"}, {"t": 370.48333333333335, "x": "イメージ映像"}, {"t": 370.48333333333335, "x": "この番組は、金太郎の足柄山で\n有名な南足柄市市立体育館より実況生中継で"}, {"t": 377.15, "x": "お送りしております。"}, {"t": 378.3333333333333, "x": "イメージ映像"}, {"t": 378.3333333333333, "x": "社内で叱られたこともありました。"}, {"t": 380.48333333333335, "x": "タイガーマスクお得意の四次元殺法\n出た、と実況したところ、"}, {"t": 384.78333333333336, "x": "上司から、ここは三次元なんだ、\nこの現実世界は、と怒られています。"}, {"t": 390.6333333333333, "x": "減量した猪木の体を、私がいにしえの頃に、\nずーっと東京の下町で眺めていた、"}, {"t": 396.8666666666667, "x": "曇りガラス越しのママレモンのシルエットにも\n似て、と実況したときは、お前な、猪木の体は"}, {"t": 403.96666666666664, "x": "ママレモンじゃないんだよ、と怒られました。"}, {"t": 406.6166666666667, "x": "言葉のほうは、番組の外にも出ていきます。"}, {"t": 409.85, "x": "イメージ映像"}, {"t": 409.85, "x": "1984年3月に\n『過激でどーもすいません』という本が出ました。"}, {"t": 414.7, "x": "同じ年の9月には『おぉーっと!\n掟破りの言いたい呆題』。"}, {"t": 418.71666666666664, "x": "イメージ映像"}, {"t": 418.71666666666664, "x": "11月1日には、CBSソニーから\n『大過激』というアルバムまで出ています。"}, {"t": 424.1666666666667, "x": "そして1984年6月、\n古舘はテレビ朝日を退社しました。"}, {"t": 429.55, "x": "7人の仲間と企画集団、古舘プロジェクトを\n設立し、フリーアナウンサーになります。"}, {"t": 436.0833333333333, "x": "イメージ映像"}, {"t": 436.0833333333333, "x": "ただし『ワールドプロレスリング』の実況は、\nフリーになったあとも引き続き担当しました。"}, {"t": 441.43333333333334, "x": "イメージ映像"}, {"t": 441.43333333333334, "x": "ここで、番組の数字のほうに戻ります。"}, {"t": 444.4, "x": "イメージ映像"}, {"t": 444.4, "x": "1982年から1983年にかけて、視聴率は\n20パーセント超えの絶頂期を迎えました。"}, {"t": 452.23333333333335, "x": "理由として記録されているのは、\n猪木と国際軍団の抗争、初代タイガーマスクの"}, {"t": 457.8833333333333, "x": "イメージ映像"}, {"t": 457.8833333333333, "x": "大ブレイク、ハルク・ホーガンの台頭、\n長州力率いる維新軍団の"}, {"t": 462.7, "x": "登場、そして古舘の実況による生中継です。"}, {"t": 466.3666666666667, "x": "藤波辰巳はテレビ朝日に行くたびに\n視聴率を確認し、20パーセントを"}, {"t": 471.6166666666667, "x": "割った週はため息をついていたといいます。"}, {"t": 474.0833333333333, "x": "ここで1つ、\nはっきりさせておきたいことがあります。"}, {"t": 477.65, "x": "『8時だョ!全員集合』は、\nこの番組の裏ではありません。"}, {"t": 482.25, "x": "TBSの土曜20時の番組です。"}, {"t": 484.8, "x   const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
