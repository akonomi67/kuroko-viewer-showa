<script>
const D={"name": "猪木vsストロング小林", "file": "225_編集用", "dur": 891.4, "segs": [], "subs": [{"t": 0.0, "x": "1974年3月19日、東京・蔵前国技館。"}, {"t": 4.816666666666666, "x": "この日の観衆は、16,500人の\n超満員札止めと記録されています。"}, {"t": 10.35, "x": "会場に入りきれなかった人が、\n3,000人以上いました。"}, {"t": 14.316666666666666, "x": "当時この会場にいた方から、通路まで人で\n埋まっていた、という話が今も寄せられます。"}, {"t": 20.566666666666666, "x": "イメージ映像"}, {"t": 20.566666666666666, "x": "今の消防法では、まず考えられない入り方です。"}, {"t": 24.466666666666665, "x": "リングで向かい合ったのは、\nアントニオ猪木とストロング小林でした。"}, {"t": 28.733333333333334, "x": "NWF世界ヘビー級選手権試合です。"}, {"t": 31.883333333333333, "x": "決着がついたのは、29分30秒でした。"}, {"t": 35.53333333333333, "x": "イメージ映像"}, {"t": 35.53333333333333, "x": "この一戦には、もう1つの記録が付いています。"}, {"t": 38.95, "x": "日本人のトップ同士が興行の目玉として\n向かい合ったのは、20年ぶりのことでした。"}, {"t": 44.38333333333333, "x": "前に組まれたのは1954年12月22日、\n力道山と木村政彦の一戦です。"}, {"t": 51.1, "x": "では、なぜ20年も組まれなかった対戦が、\nこの日に実現したのでしょうか。"}, {"t": 56.68333333333333, "x": "今回は、1974年3月19日の一戦を、\n確認できた日付と数字、そして当事者が"}, {"t": 64.58333333333333, "x": "残した言葉だけで辿っていきます。"}, {"t": 66.6, "x": "イメージ映像"}, {"t": 66.6, "x": "推測や、裏の取れていない話は入れません。"}, {"t": 70.01666666666667, "x": "最後までお付き合いいただけますと幸いです。"}, {"t": 72.83333333333333, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}, {"t": 76.78333333333333, "x": "イメージ映像"}, {"t": 76.78333333333333, "x": "まず、リングに上がった片方を確認しておきます。"}, {"t": 80.46666666666667, "x": "ストロング小林はリングネームです。"}, {"t": 82.8, "x": "本名は小林省三といいます。"}, {"t": 85.15, "x": "1940年12月25日、\n東京都文京区本郷の生まれです。"}, {"t": 90.85, "x": "育ったのは東京都青梅市でした。"}, {"t": 93.18333333333334, "x": "デビューは1967年7月27日。"}, {"t": 96.81666666666666, "x": "所属していたのは国際プロレスです。"}, {"t": 99.25, "x": "小林の記録として残っているのが、\nIWA世界ヘビー級王座です。"}, {"t": 104.43333333333334, "x": "イメージ映像"}, {"t": 104.43333333333334, "x": "1971年6月19日、\nアメリカ・ミネソタ州ダルースで"}, {"t": 109.43333333333334, "x": "この王座を獲得しました。"}, {"t": 111.06666666666666, "x": "イメージ映像"}, {"t": 111.06666666666666, "x": "そこから1973年11月9日まで、\n2年6か月にわたって保持しています。"}, {"t": 117.43333333333334, "x": "防衛回数は25回でした。"}, {"t": 119.7, "x": "イメージ映像"}, {"t": 119.7, "x": "国際プロレスは、第3の団体と呼ばれた会社です。"}, {"t": 123.48333333333333, "x": "小林は、その団体のエースでした。"}, {"t": 126.31666666666666, "x": "そのエースが、団体を出ます。"}, {"t": 128.75, "x": "イメージ映像"}, {"t": 128.75, "x": "1974年2月1日。"}, {"t": 131.4, "x": "この日は『74パイオニア・シリーズ』の\n最終戦でした。"}, {"t": 134.9, "x": "小林は、この日に辞表を提出しています。"}, {"t": 138.23333333333332, "x": "イメージ映像"}, {"t": 138.23333333333332, "x": "そして2月13日、記者会見を\n開いてフリーを宣言しました。"}, {"t": 143.1, "x": "同時にIWA世界ヘビー級王座を\n返上して退団しています。"}, {"t": 147.45, "x": "この会見で、小林はもう1つのことをしています。"}, {"t": 151.2, "x": "ジャイアント馬場とアントニオ猪木の\n両者に対して、内容証明郵便で"}, {"t": 156.03333333333333, "x": "挑戦状を送ったと明らかにしました。"}, {"t": 158.45, "x": "団体のエースが、ベルトを置いて出ていき、\n他の2団体のトップに名指しで挑戦する。"}, {"t": 164.36666666666667, "x": "当時としては前例のない動き方でした。"}, {"t": 167.01666666666668, "x": "イメージ映像"}, {"t": 167.01666666666668, "x": "では、なぜ小林は団体を出たのでしょうか。"}, {"t": 170.4, "x": "ここは推測せずに、\n残っている言葉をそのまま紹介します。"}, {"t": 174.68333333333334, "x": "イメージ映像"}, {"t": 174.68333333333334, "x": "小林自身は、プロレス専門誌『Gスピリッツ』の\nインタビューで、次のように語っています。"}, {"t": 180.96666666666667, "x": "誰かの横槍で吉原社長に冷遇されるようになり、\n以前から離脱を考えていた。"}, {"t": 186.76666666666668, "x": "同じ雑誌には、国際プロレスにいた鶴見五郎の\n証言も残っています。"}, {"t": 191.6, "x": "八戸から苫小牧へ向かうフェリーの\n船中で、酒に酔ったグレート草津が"}, {"t": 196.46666666666667, "x": "小林に絡んだ、という話です。"}, {"t": 199.06666666666666, "x": "そのときの言葉として、\n鶴見はこう伝えています。"}, {"t": 202.53333333333333, "x": "よぉ小林、お前は誰のおかげで\n上を取れてると思ってんだ。"}, {"t": 206.81666666666666, "x": "グレート草津は、このころ国際プロレスで\n現場を仕切る立場にいた選手でした。"}, {"t": 211.93333333333334, "x": "肩書の表記は資料によって分かれているため、\nここでは断定しません。"}, {"t": 216.75, "x": "イメージ映像"}, {"t": 216.75, "x": "小林が団体を出た理由について、会社側が\n公式に説明した記録は見つかっていません。"}, {"t": 223.1, "x": "ここに挙げたのは、あくまで当事者と\n同僚が後年に語った言葉です。"}, {"t": 227.8, "x": "イメージ映像"}, {"t": 227.8, "x": "挑戦状を受けたのは、アントニオ猪木でした。"}, {"t": 231.05, "x": "新日本プロレスの営業本部長だった新間寿は、\nこのときのことをこう振り返っています。"}, {"t": 237.23333333333332, "x": "力道山先生と木村政彦さん以来、\n日本人対決はありませんでしたから、"}, {"t": 242.55, "x": "私のなかで『これしかない』と確信しました。"}, {"t": 245.51666666666668, "x": "1954年12月22日、同じ蔵前国技館で\n力道山と木村政彦が戦っています。"}, {"t": 252.81666666666666, "x": "この試合が世間の反発を招き、プロレスの\n人気を一時的に落としたと記録されています。"}, {"t": 258.76666666666665, "x": "イメージ映像"}, {"t": 258.76666666666665, "x": "以降、日本のプロレスの興行は、\n日本人対外国人という形が主流になりました。"}, {"t": 264.8833333333333, "x": "大物の日本人同士を目玉に組むことは、\n20年にわたって行われていません。"}, {"t": 270.2, "x": "イメージ映像"}, {"t": 270.2, "x": "ただし、日本人同士の試合が1つも\n無かったわけではありません。"}, {"t": 274.6666666666667, "x": "小林自身、1973年7月9日に\n大阪府立体育館でラッシャー木村を相手に"}, {"t": 281.48333333333335, "x": "IWA世界ヘビー級王座の防衛戦を行っています。"}, {"t": 285.3, "x": "無かったのは、団体をまたいだ、\n大物同士の対決でした。"}, {"t": 289.78333333333336, "x": "新間寿は、小林を口説いた日々に\nついても語っています。"}, {"t": 294.1, "x": "当時の私は、どうにかして馬場さんの全日本を\n超えたいとしか考えていませんでしたから、"}, {"t": 299.81666666666666, "x": "馬場さんができないことをやってやろうと。"}, {"t": 302.45, "x": "その一心で小林さんの自宅に通いました。"}, {"t": 305.4, "x": "小林さんは自宅で5、\n6匹のマルチーズを飼っていたんです。"}, {"t": 309.5833333333333, "x": "最初に私が訪問した時は、\nひどく吠えられましたが、何度も伺ううちに"}, {"t": 314.8833333333333, "x": "マルチーズも顔を覚えたのか、最後は私の\n膝の上で眠るまでになっていましたよ。"}, {"t": 320.1166666666667, "x": "イメージ映像"}, {"t": 320.1166666666667, "x": "ところが、この試合は一度、消えかけています。"}, {"t": 323.73333333333335, "x": "1974年3月8日、\n国際プロレスの吉原功社長が会見を開き、"}, {"t": 329.8833333333333, "x": "小林の契約違反を主張しました。"}, {"t": 332.78333333333336, "x": "そのうえで、移籍金を要求しています。"}, {"t": 335.93333333333334, "x": "新日本プロレスは旗揚げからの\n借金を抱えており、その金額を"}, {"t": 340.75, "x": "払える状態ではありませんでした。"}, {"t": 342.81666666666666, "x": "ここで動いたのが、東京スポーツ新聞社です。"}, {"t": 346.2, "x": "イメージ映像"}, {"t": 346.2, "x": "1000万円を国際プロレスに支払って和解が\n成立し、小林は一時的に東京スポーツ所属の"}, {"t": 352.9166666666667, "x": "レスラーという扱いになりました。"}, {"t": 354.8, "x": "なぜ新聞社がそこまでしたのか。"}, {"t": 356.96666666666664, "x": "当時この件を取材していた元東京スポーツ記者の\n門馬忠雄が、後年のインタビューで"}, {"t": 362.55, "x": "こう説明しています。"}, {"t": 363.9, "x": "あの頃、力道山が作った日本プロレスが\n分裂して、馬場の全日本と猪木の"}, {"t": 369.6, "x": "新日本に分かれたことによって、\nプロレス人気が下火になってたんだよ。"}, {"t": 374.05, "x": "プロレスの人気が新聞の\n売上げに直結していた東スポは、"}, {"t": 377.68333333333334, "x": "そこに危機感を抱いていた。"}, {"t": 379.6, "x": "猪木vs小林という夢の対決は、\nプロレス人気復活の"}, {"t": 383.8833333333333, "x": "イメージ映像"}, {"t": 383.8833333333333, "x": "起爆剤として期待されていたから、\nそれが中止になったら、"}, {"t": 387.6666666666667, "x": "東スポとしても困るわけだよね。"}, {"t": 389.85, "x": "だから1000万という当時としては\n破格のお金を払ってでも、"}, {"t": 393.4166666666667, "x": "試合を成立させようとしたんだ。"}, {"t": 395.78333333333336, "x": "イメージ映像"}, {"t": 395.78333333333336, "x": "なお、この挑戦状のやりとり自体が\n仕組まれたものだったのではないか、という見方も"}, {"t": 401.55, "x": "残っています。"}, {"t": 402.43333333333334, "x": "ただし、そう目されている、という書き方までで、\n断定した資料はありません。"}, {"t": 408.51666666666665, "x": "イメージ映像"}, {"t": 408.51666666666665, "x": "そして3月19日を迎えます。"}, {"t": 410.8833333333333, "x": "16,500人の超満員札止め。"}, {"t": 413.8, "x": "この数字が主催者の発表なのか実数なのかを\n区別して書いた記録は見つかっていません。"}, {"t": 419.1166666666667, "x": "入れなかった客が、入口で\n押し問答になったことも記録されています。"}, {"t": 423.8333333333333, "x": "せっかく地方から来たんだよ。"}, {"t": 425.78333333333336, "x": "イメージ映像"}, {"t": 425.78333333333336, "x": "立見でもいいから1、\n2万払うんで入れてくれないか。"}, {"t": 429.4, "x": "そう食い下がった人がいた、と伝えられています。"}, {"t": 432.65, "x": "新間寿の証言として残っているのは、\nスタッフがポスターを破って1000円と書き、"}, {"t": 438.1166666666667, "x": "それをチケット代わりにしたという話です。"}, {"t": 441.1333333333333, "x": "この日の蔵前国技館では、\n水道管が破裂しています。"}, {"t": 445.2, "x": "国技館は、蔵前警察署から厳重注意を受けました。"}, {"t": 449.3, "x": "イメージ映像"}, {"t": 449.3, "x": "小林自身も、この日のことを\n後年こう語っています。"}, {"t": 453.2, "x": "僕がびっくりしたのは、とにかくあの日、\n蔵前国技館の客席が超満員になって、"}, {"t": 459.26666666666665, "x": "いっぱいになったっていうことですね。"}, {"t": 461.6, "x": "イメージ映像"}, {"t": 461.6, "x": "それぐらい、凄い人だったって\nいうことを一番、思い出しますね。"}, {"t": 466.53333333333336, "x": "イメージ映像"}, {"t": 466.53333333333336, "x": "試合はNWF世界ヘビー級選手権として\n行われました。"}, {"t": 470.8, "x": "東京スポーツは、この一戦を\n90分1本勝負と伝えています。"}, {"t": 475.5833333333333, "x": "イメージ映像"}, {"t": 475.5833333333333, "x": "NWF世界ヘビー級王座は、\nアメリカのニューヨーク州バッファローと"}, {"t": 480.43333333333334, "x": "オハイオ州クリーブランドを\n拠点にした団体の王座でした。"}, {"t": 483.81666666666666, "x": "猪木は1973年12月10日、\n東京体育館でジョニー・パワーズを"}, {"t": 489.46666666666664, "x": "破ってこのベルトを奪っています。"}, {"t": 491.4166666666667, "x": "東京スポーツは、小林戦をこの王座での\n最初の防衛戦と伝えています。"}, {"t": 496.73333333333335, "x": "決着は29分30秒。"}, {"t": 499.05, "x": const a=document.getElementById('a');

const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);

  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);

  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
