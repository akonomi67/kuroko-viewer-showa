<script>
const D={"name": "馬場と猪木シングル16戦全記録", "file": "284_編集用", "dur": 956.46665625, "segs": [], "subs": [{"t": 0.0, "x": "1963年10月2日。"}, {"t": 2.7, "x": "栃木県足利市の月見ヶ丘体育館。"}, {"t": 5.533333333333333, "x": "20分1本勝負のリングに、\n2人の若いレスラーが上がりました。"}, {"t": 10.1, "x": "ジャイアント馬場とアントニオ猪木です。"}, {"t": 12.466666666666667, "x": "試合は12分ちょうどで終わりました。"}, {"t": 14.933333333333334, "x": "馬場が体固めで猪木を押さえ込みました。"}, {"t": 17.533333333333335, "x": "2人の一騎打ちは、この夜で16回目でした。"}, {"t": 20.983333333333334, "x": "そしてこの夜が最後になりました。"}, {"t": 23.15, "x": "成績は馬場の16勝、猪木の0勝です。"}, {"t": 26.733333333333334, "x": "2人はその後も、同じリングに立ちました。"}, {"t": 29.616666666666667, "x": "同じ時代のプロレスを背負いました。"}, {"t": 31.816666666666666, "x": "それでも17回目の一騎打ちは、\n1度も組まれませんでした。"}, {"t": 36.13333333333333, "x": "16回の試合では、何が起きていたのでしょうか？"}, {"t": 39.9, "x": "そして17戦目は、なぜ無かったのでしょうか？"}, {"t": 43.38333333333333, "x": "今回は、馬場と猪木の16回の\nシングルマッチを1つずつ追います。"}, {"t": 48.18333333333333, "x": "日付と会場と試合時間を、\n試合の記録で確かめていきます。"}, {"t": 52.46666666666667, "x": "新聞の記事やその後の証言も\n合わせて辿っていきます。"}, {"t": 56.06666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 58.56666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 64.13333333333334, "x": "まず2人の始まりです。"}, {"t": 65.71666666666667, "x": "2人は同じ1960年に、\n力道山の日本プロレスに入りました。"}, {"t": 70.91666666666667, "x": "記録では、お披露目も\n同じ日だったとされています。"}, {"t": 74.35, "x": "1960年4月11日です。"}, {"t": 77.28333333333333, "x": "デビューも同じ日でした。"}, {"t": 78.83333333333333, "x": "1960年9月30日、\n東京の台東区体育館です。"}, {"t": 83.98333333333333, "x": "この日、馬場は先輩レスラーに勝ちました。"}, {"t": 87.16666666666667, "x": "試合時間は5分15秒です。"}, {"t": 89.5, "x": "猪木は別の先輩に7分16秒で敗れています。"}, {"t": 93.06666666666666, "x": "同じ日に入り、同じ日にデビューした2人です。"}, {"t": 96.33333333333333, "x": "ただ、2人の直接の対決は、\nすぐには組まれませんでした。"}, {"t": 100.85, "x": "初めての一騎打ちは、デビューから\n8か月ほどあとのことです。"}, {"t": 105.16666666666667, "x": "1961年5月25日、富山市体育館です。"}, {"t": 110.11666666666666, "x": "ワールド・リーグ戦という\nシリーズの、前座の試合でした。"}, {"t": 113.86666666666666, "x": "形式は15分1本勝負です。"}, {"t": 116.33333333333333, "x": "このとき馬場は23歳、猪木は18歳でした。"}, {"t": 120.18333333333334, "x": "試合は10分ちょうどで決まります。"}, {"t": 122.45, "x": "馬場が羽交い絞めで、\n猪木からギブアップを奪いました。"}, {"t": 126.08333333333333, "x": "試合の記録には、2人ともまだ\nこれといった得意技が無かったと書かれています。"}, {"t": 131.15, "x": "体が大きく力で勝る馬場が\n上回った、という記述です。"}, {"t": 135.58333333333334, "x": "そして記録は、この1戦をきっかけに\n2人の対決が解禁されたと記しています。"}, {"t": 141.05, "x": "第2戦は2日後の5月27日です。"}, {"t": 143.93333333333334, "x": "場所は岐阜市民センターでした。"}, {"t": 145.93333333333334, "x": "同じ15分1本勝負で、\n馬場が逆エビ固めで勝ちました。"}, {"t": 150.41666666666666, "x": "試合時間は5分30秒です。"}, {"t": 152.85, "x": "16戦の中で、決着までが\nいちばん短い試合でした。"}, {"t": 157.13333333333333, "x": "第3戦は6月10日、徳島市体育館です。"}, {"t": 160.86666666666667, "x": "これも15分1本勝負でした。"}, {"t": 163.16666666666666, "x": "馬場がエビ固めで勝ちました。"}, {"t": 165.01666666666668, "x": "試合時間は9分50秒です。"}, {"t": 167.51666666666668, "x": "第4戦から、試合は20分1本勝負に延びます。"}, {"t": 171.51666666666668, "x": "6月16日、福岡県八幡市の体育館です。"}, {"t": 175.6, "x": "馬場が8分5秒でエビ固めを決めました。"}, {"t": 178.38333333333333, "x": "第5戦は6月20日です。"}, {"t": 180.41666666666666, "x": "場所は大分県の別府市営温泉プールに\n作られた会場でした。"}, {"t": 184.58333333333334, "x": "馬場が9分19秒でエビ固めを決めました。"}, {"t": 187.7, "x": "第6戦は6月28日、大阪府立体育会館です。"}, {"t": 192.41666666666666, "x": "馬場が11分17秒でエビ固めを決めました。"}, {"t": 195.66666666666666, "x": "5月25日から6月28日まで、\nおよそ1か月で6回の一騎打ちです。"}, {"t": 201.5, "x": "6回とも1本勝負で、\n6回とも馬場の勝ちでした。"}, {"t": 205.33333333333334, "x": "ここで2人の対決は、いったん止まります。"}, {"t": 208.41666666666666, "x": "1961年7月、\n馬場がアメリカへ渡ったからです。"}, {"t": 213.28333333333333, "x": "デビューからわずか9か月後のことでした。"}, {"t": 215.88333333333333, "x": "馬場はババ・ザ・ジャイアントの名前で、\nアメリカ各地のリングに上がりました。"}, {"t": 220.55, "x": "その間、猪木は日本に残りました。"}, {"t": 223.36666666666667, "x": "力道山の家に住み込み、\n付き人を務めていた時期です。"}, {"t": 227.33333333333334, "x": "馬場が日本に戻ったのは、\n1963年3月でした。"}, {"t": 231.86666666666667, "x": "第6戦から第7戦まで、2人の一騎打ちには\n1年10か月の空白があります。"}, {"t": 237.66666666666666, "x": "1963年4月25日、兵庫県の豊岡市です。"}, {"t": 242.66666666666666, "x": "総合グラウンドに組まれた特設のリングでした。"}, {"t": 245.6, "x": "第7戦は30分1本勝負です。"}, {"t": 248.36666666666667, "x": "時間の枠は、最初の15分の倍に延びていました。"}, {"t const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
