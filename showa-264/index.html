<script>
const D={"name": "吉村道明", "file": "264_編集用", "dur": 913.4333125, "segs": [], "subs": [{"t": 0.0, "x": "2003年2月17日、\n神戸に住んでいた元プロレスラーの"}, {"t": 4.416666666666667, "x": "訃報が報じられました。"}, {"t": 5.833333333333333, "x": "親族は取材にこう答えています。"}, {"t": 8.216666666666667, "x": "何も、お話しすることはありません。"}, {"t": 10.883333333333333, "x": "日刊スポーツの訃報記事に残る言葉です。"}, {"t": 13.7, "x": "亡くなったのは、回転エビ固めの\n使い手として知られた人です。"}, {"t": 17.933333333333334, "x": "力道山とタッグを組んでいた人でもあります。"}, {"t": 20.783333333333335, "x": "息を引き取ったのは2003年2月15日の\n午前6時35分でした。"}, {"t": 25.7, "x": "場所は神戸市北区の病院です。"}, {"t": 27.966666666666665, "x": "死因は呼吸不全と発表されています。"}, {"t": 30.8, "x": "76歳です。"}, {"t": 32.266666666666666, "x": "葬儀と告別式は翌日の\n16日に済ませてありました。"}, {"t": 36.083333333333336, "x": "参列したのは親族だけです。"}, {"t": 38.266666666666666, "x": "訃報が出たのは、見送りが終わった翌日でした。"}, {"t": 41.65, "x": "名前は吉村道明。"}, {"t": 43.4, "x": "力道山が亡くなったあとの日本プロレスの話です。"}, {"t": 46.68333333333333, "x": "この男は、4人の幹部の1人に数えられました。"}, {"t": 50.333333333333336, "x": "試合を組む役を任されていました。"}, {"t": 52.63333333333333, "x": "巡業をまとめる役も兼ねていました。"}, {"t": 54.983333333333334, "x": "そして日本プロレスが興行を\n止める48日前にリングを降りています。"}, {"t": 59.63333333333333, "x": "その日を境にプロレス界との縁も切りました。"}, {"t": 62.5, "x": "力道山のいない日本プロレスで、\n吉村道明は何を任されていたのでしょうか？"}, {"t": 68.13333333333334, "x": "今回は吉村道明という1人の\nプロレスラーの記録を追っていきます。"}, {"t": 72.46666666666667, "x": "もとにするのは新聞の訃報です。"}, {"t": 74.73333333333333, "x": "そして一緒にリングに上がった人たちの証言です。"}, {"t": 77.93333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 80.43333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 86.0, "x": "吉村道明は1926年9月19日、\n岐阜市に生まれました。"}, {"t": 91.45, "x": "14歳で海軍の志願兵になっています。"}, {"t": 94.35, "x": "日刊スポーツの訃報によると、\n海軍通信学校の高等科を5番で卒業しました。"}, {"t": 100.4, "x": "終戦は上等兵曹で迎えています。"}, {"t": 103.08333333333333, "x": "戦争のあと、近畿大学に入りました。"}, {"t": 106.08333333333333, "x": "相撲部で学生横綱になっています。"}, {"t": 108.55, "x": "国体でも個人で優勝しました。"}, {"t": 110.78333333333333, "x": "1954年4月、全日本プロレス協会に入ります。"}, {"t": 115.45, "x": "大阪を本拠地とした団体です。"}, {"t": 117.73333333333333, "x": "のちにジャイアント馬場が\n作る全日本プロレスとは別の団体でした。"}, {"t": 121.81666666666666, "x": "この協会は1956年に縮小し、解散しています。"}, {"t": 126.65, "x": "学生横綱からそのままプロレスに\n入った人は、吉村のほかにいません。"}, {"t": 131.61666666666667, "x": "東京スポーツはそう書いています。"}, {"t": 133.76666666666668, "x": "次の行き先は東京でした。"}, {"t": 135.81666666666666, "x": "1957年には力道山に\n誘われて日本プロレスへ移ります。"}, {"t": 140.55, "x": "プロになって4年目のことです。"}, {"t": 142.45, "x": "移籍の1か月後には、\n日本ジュニアヘビー級の王座を取りました。"}, {"t": 146.76666666666668, "x": "日刊スポーツの訃報の記録です。"}, {"t": 149.01666666666668, "x": "それから約2年半は、\nこのベルトを1度も手放していません。"}, {"t": 153.21666666666667, "x": "1961年、ヘビー級に転向します。"}, {"t": 157.26666666666668, "x": "そして力道山のタッグパートナーに選ばれました。"}, {"t": 160.28333333333333, "x": "体の大きな外国人選手に捕まります。"}, {"t": 163.2, "x": "血だるまになります。"}, {"t": 164.46666666666667, "x": "それでも相手に向かっていきました。"}, {"t": 166.53333333333333, "x": "その戦い方から火の玉と呼ばれました。"}, {"t": 169.11666666666667, "x": "突貫小僧という呼び名もあります。"}, {"t": 171.38333333333333, "x": "身長は183センチです。"}, {"t": 173.85, "x": "体重は108キロでした。"}, {"t": 175.75, "x": "この写真には血だるまになった吉村が\n写っています。"}, {"t": 179.0, "x": "それを気遣っているのが力道山です。"}, {"t": 181.46666666666667, "x": "東京スポーツの連載に載った1枚です。"}, {"t": 184.15, "x": "日刊スポーツの訃報にも1961年の\nタッグ戦の写真が添えられていました。"}, {"t": 189.71666666666667, "x": "力道山と組んだ試合です。"}, {"t": 191.66666666666666, "x": "外国人選手をロープに\n追い込む吉村が写っています。"}, {"t": 195.31666666666666, "x": "得意技は回転エビ固めでした。"}, {"t": 197.63333333333333, "x": "大きな相手に攻め込まれていても\n一瞬で丸め込みます。"}, {"t": 201.0, "x": "そして3カウントを取ります。"}, {"t": 202.96666666666667, "x": "日刊スポーツは、その技術が\n神業と驚かれたと書いています。"}, {"t": 207.38333333333333, "x": "若い頃のアントニオ猪木との対戦では、\n19連勝の記録が残っています。"}, {"t": 212.71666666666667, "x": "1961年は名前の残る試合が続いた年です。"}, {"t": 216.9, "x": "上田馬之助は東京スポーツの連載で、\nこの年の試合を2つ挙げています。"}, {"t": 222.18333333333334, "x": "1つ目は芳の里との一騎打ちです。"}, {"t": 224.66666666666666, "x": "レフェリーは力道山でした。"}, {"t": 226.46666666666667, "x": "結果は60分フルタイムの引き分けです。"}, {"t": 229.15, "x": "プロレスの教科書に載せるなら\nこの一戦だと上田は書いています。"}, {"t": 232.96666666666667, "x": "2つ目はカール・ゴッチとの一騎打ちです。"}, {"t": 235.51666666666668, "x": "ゴッチは当時カール・クラウザーの\n名前で初めて日本に来ていました。"}, {"t": 239.53333333333333, "x": "スポーツジャーナリストのコラムによると、\n試合は1961年5月1日です。"}, {"t": 245.35, "x": "会場は東京都体育館でした。"}, {"t": 247.7, "x": "第3回ワールドリーグ戦の45分3本勝負です。"}, {"t": 251.41666666666666, "x": "1本目はゴッチが取りました。"}, {"t": 253.38333333333333, "x": "技はジャーマン・スープレックス・ホールドです。"}, {"t": 255.95, "x": "この技が日本で披露されたのは\nこの時が初めてでした。"}, {"t": 259.45, "x": "2本目は吉村が回転エビ固めで取り返します。"}, {"t": 262.8, "x": "そのまま45分がたちました。"}, {"t": 265.05, "x": "試合は引き分けです。"}, {"t": 266.6, "x": "この写真は1961年5月、\n東京体育館で撮られたものです。"}, {"t": 272.26666666666665, "x": "吉村がクラウザーからフォールを奪った場面です。"}, {"t": 275.3, "x": "1966年5月にも吉村は\n大事な相手を任されています。"}, {"t": 279.98333333333335, "x": "ブレーンバスターを得意とする外国人選手が\n初めて来日した時です。"}, {"t": 284.4, "x": "その第1戦の相手に選ばれたのが吉村でした。"}, {"t": 287.6333333333333, "x": "そのコラムはそう書いています。"}, {"t": 289.55, "x": "1963年12月15日、\n力道山が39歳で亡くなりました。"}, {"t": 295.53333333333336, "x": "日本プロレスは団体を\n作った人をいきなり失いました。"}, {"t": 299.1, "x": "残った選手の中から4人の幹部が立てられました。"}, {"t": 302.3333333333333, "x": "豊登、芳の里、遠藤幸吉、そして吉村道明です。"}, {"t": 308.03333333333336, "x": "この写真は1963年12月に撮られたものです。"}, {"t": 312.15, "x": "場所は渋谷の力道山道場です。"}, {"t": 314.51666666666665, "x": "結束を誓う4人が並んでいます。"}, {"t": 316.9166666666667, "x": "左から吉村、遠藤、豊登、芳の里の順です。"}, {"t": 322.3, "x": "グレート小鹿の連載によると、この体制が\n走り出したのは1964年1月でした。"}, {"t": 328.7, "x": "日刊スポーツの訃報は、\n吉村の役目をこう書いています。"}, {"t": 332.8666666666667, "x": "マッチメーカーと巡業の総責任者の兼任です。"}, {"t": 336.26666666666665, "x": "マッチメーカーは、誰と誰を\n戦わせるかを決める仕事です。"}, {"t": 340.55, "x": "巡業の総責任者は、\n地方を回る一行をまとめる仕事でした。"}, {"t": 345.26666666666665, "x": "1964年2月20日、名古屋市の金山体育館。"}, {"t": 349.98333333333335, "x": "吉村は豊登と組んで\nアジアタッグ王座を取っています。"}, {"t": 353.6333333333333, "x": "この王座はもともと力道山と\n豊登が持っていました。"}, {"t": 357.06666666666666, "x": "力道山の死で空いていた席です。"}, {"t": 359.26666666666665, "x": "そこを吉村が埋めた形になります。"}, {"t": 361.68333333333334, "x": "その豊登は1966年1月に会社を去っています。"}, {"t": 366.1333333333333, "x": "4人の幹部の中で最も遅くまで\n現役を続けたのが吉村でした。"}, {"t": 370.6666666666667, "x": "日刊スポーツはそう記録しています。"}, {"t": 373.05, "x": "同じ訃報は、日本プロレスでいちばんの\n常識人だったとも書いています。"}, {"t": 377.73333333333335, "x": "後輩からも慕われていたそうです。"}, {"t": 379.95, "x": "記事が吉村に付けた言葉は、名脇役でした。"}, {"t": 383.48333333333335, "x": "1966年には馬場と組んで\nインターナショナル・タッグ王座を取りました。"}, {"t": 388.3833333333333, "x": "アジアタッグ王座では組む相手が\n次々に代わっていきます。"}, {"t": 392.06666666666666, "x": "豊登、ヒロ・マツダ、馬場、\n大木金太郎、猪木、そして坂口征二です。"}, {"t": 399.18333333333334, "x": "この王座の選手権は通算109試合にのぼります。"}, {"t": 402.8, "x": "日刊スポーツの数えです。"}, {"t": 404.6333333333333, "x": "訃報はその姿を、鉄人だったと書きました。"}, {"t": 408.05, "x": "同じコラムは、馬場の著書を引いています。"}, {"t": 410.98333333333335, "x": "題名は『たまにはオレもエンターテイナー』です。"}, {"t": 413.68333333333334, "x": "馬場はそこで、吉村の戦い方について書きました。"}, {"t": 417.48333333333335, "x": "組む相手が誰でも、自分の\n戦い方を変えなかったそうです。"}, {"t": 421.7, "x": "シングルの王座も狙いませんでした。"}, {"t": 423.95, "x": "タッグの主役も狙いませんでした。"}, {"t": 426.15, "x": "馬場はそのことを、立派だったと評しています。"}, {"t": 429.4, "x": "上田馬之助が力道山の次に\n尊敬するレスラーは吉村でした。"}, {"t": 433.6666666666667, "x": "上田の数えでは、吉村が支えたスターは6人です。"}, {"t": 437.6333333333333, "x": "力道山、豊登、馬場、猪木、大木、坂口。"}, {"t": 443.73333333333335, "x": "上田は吉村から言われた言葉も書き残しています。"}, {"t": 446.9, "x": "テレビ放送があろうがなかろうが、\nお客さんが超満員であろうが数十人であろうが、"}, {"t": 452.45, "x": "レスラーは常に全力投球すべきだ。"}, {"t": 455.05, "x": "そうしないと、次にお金を払って来てくれない。"}, {"t": 458.25, "x": "毎日が勉強だ。"}, {"t": 459.7, "x": "上田が教わった言葉は、もう1つあります。"}, {"t": 462.9, "x": "ただ勝つだけでは、ダメだよ。"}, {"t": 465.05, "x": "相手の良さも存分に引き出さないと。"}, {"t": 467.48333333333335, "x": "この写真は1967年4月、\n東京国際空港で撮られたものです。"}, {"t": 473.3666666666667, "x": "アメリカから戻った上田を、\n芳の里と吉村が出迎えています。"}, {"t": 477.9166666666667, "x": "その吉村にも、困ったことがあったそうです。"}, {"t": 481.23333333333335, "x": "負けた試合がテレビで流れた翌日のことです。"}, {"t": 484.1333333333333, "x": "子どもが学校でいじめられました。"}, {"t": 486.2, "x": "お父さんのせいで日本組が負けた。"}, {"t": 488.43333333333334, "x": "よくそう言われたと上田は書いています。"}, {"t": 490.8, "x": "後輩を引き上げる役もありました。"}, {"t": 493.0, "x": "グレート小鹿はアメリカでの\n修行から日本に戻っています。"}, {"t": 496.6666666666667, "x": "戻って最初のシリーズは、\nNWAワールドタッグリーグ戦でした。"}, {"t": 501.5, "x": "小鹿の連載によると、\nそこで組んだ相手が吉村です。"}, {"t": 505.35, "x": "この写真は1970年10月23日に\n撮られたものです。"}, {"t": 509.966666666 sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
