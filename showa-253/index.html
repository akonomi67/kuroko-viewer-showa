<style>

<script>
const D={"name": "馬場の巨人時代", "file": "253_編集用", "dur": 929.86665625, "segs": [], "subs": [{"t": 0.0, "x": "1955年1月15日、東京。"}, {"t": 3.8833333333333333, "x": "新潟県三条市から16歳の\n少年が1人で上京しました。"}, {"t": 8.133333333333333, "x": "読売ジャイアンツと契約を結ぶためです。"}, {"t": 10.9, "x": "背の高さが191センチもある投手でした。"}, {"t": 14.183333333333334, "x": "当時のプロ野球に、これより背の\n高い日本人選手はいません。"}, {"t": 18.533333333333335, "x": "少年は高校2年生の途中で学校をやめていました。"}, {"t": 22.25, "x": "しかしこの投手は、5年間で一軍の\nマウンドに3回しか立っていません。"}, {"t": 27.166666666666668, "x": "そして5年目の秋、\n球団から「整理」を告げられます。"}, {"t": 30.883333333333333, "x": "男の名は、馬場正平。"}, {"t": 33.166666666666664, "x": "のちのジャイアント馬場です。"}, {"t": 34.81666666666667, "x": "巨人がわざわざ獲った大型投手でした。"}, {"t": 37.5, "x": "なぜ5年のあいだ、二軍から\n出られなかったのでしょうか。"}, {"t": 41.2, "x": "今回はプロレスラーになる前の\n馬場正平を追います。"}, {"t": 44.483333333333334, "x": "扱うのは、巨人軍で過ごした5年間だけです。"}, {"t": 48.03333333333333, "x": "当時の記録と証言をもとに日付を追っていきます。"}, {"t": 51.21666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 53.71666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 59.3, "x": "馬場正平は1938年1月23日、\n新潟県三条市に生まれました。"}, {"t": 65.85, "x": "家は八百屋で、馬場は次男です。"}, {"t": 68.51666666666667, "x": "兄は戦争中の1943年に\nブーゲンビル島で戦死しています。"}, {"t": 73.48333333333333, "x": "背が伸び始めたのは小学校の高学年からでした。"}, {"t": 76.95, "x": "中学に入ったときには185センチありました。"}, {"t": 80.36666666666666, "x": "この急な成長には脳下垂体の\n病気が関わっていました。"}, {"t": 84.1, "x": "それが分かるのは、もっと後のことです。"}, {"t": 86.91666666666667, "x": "1953年、新潟県立三条実業高校の\n機械科に入学します。"}, {"t": 93.01666666666667, "x": "野球をするつもりでした。"}, {"t": 94.71666666666667, "x": "しかし町の運動具店には\n足に合うスパイクがありません。"}, {"t": 98.2, "x": "1年生のあいだ、\n馬場が入っていたのは美術部です。"}, {"t": 101.96666666666667, "x": "大相撲の力士が家まで\n誘いに来たこともありました。"}, {"t": 105.21666666666667, "x": "馬場は逃げ回りました。"}, {"t": 106.76666666666667, "x": "母も、息子を相撲には行かせないと断っています。"}, {"t": 110.38333333333334, "x": "2年生の春、野球部長が特大の\nスパイクを特注しました。"}, {"t": 115.08333333333333, "x": "馬場はようやく硬式野球部に入ります。"}, {"t": 117.76666666666667, "x": "硬いボールを握ったのはこのときが初めてです。"}, {"t": 120.71666666666667, "x": "それでも馬場はすぐにエースになりました。"}, {"t": 123.15, "x": "最初の公式戦は、\n春の北信越大会の新潟県予選です。"}, {"t": 128.06666666666666, "x": "三条実業は長岡工業と\n長岡高校に続けて勝ちました。"}, {"t": 132.43333333333334, "x": "しかし5月9日、長岡商業に0対9で敗れます。"}, {"t": 136.75, "x": "この大会で馬場の名前は新潟県内に知られました。"}, {"t": 140.16666666666666, "x": "新聞の県版にも載っています。"}, {"t": 142.4, "x": "1954年7月8日、夏の地区大会の1回戦。"}, {"t": 147.15, "x": "場所は長岡市の悠久山球場です。"}, {"t": 149.88333333333333, "x": "馬場は長岡高校を相手に8回を\n投げ、自責点は0でした。"}, {"t": 154.53333333333333, "x": "それでも試合は0対1で敗れています。"}, {"t": 157.3, "x": "相手の1点は、エラーで入ったものでした。"}, {"t": 160.51666666666668, "x": "8月の秋の大会でも長岡工業に0対1で敗れます。"}, {"t": 164.58333333333334, "x": "甲子園には届きませんでした。"}, {"t": 166.65, "x": "その年の秋、巨人のスカウトが\n三条の家を訪ねてきます。"}, {"t": 170.85, "x": "示された条件は支度金20万円。"}, {"t": 173.66666666666666, "x": "月給は1万2,000円です。"}, {"t": 175.8, "x": "巨人の新人としては、低いほうの金額でした。"}, {"t": 179.35, "x": "スカウトは「球界最年少ですな」と\n声をかけたといいます。"}, {"t": 183.0, "x": "当時はまだ1万円札がありません。"}, {"t": 185.43333333333334, "x": "机に置かれたのは、千円札200枚の束でした。"}, {"t": 189.2, "x": "母と2人で「こんな大金見たことない」と\n驚いたと伝えられています。"}, {"t": 193.23333333333332, "x": "入団はその場で決まりました。"}, {"t": 195.18333333333334, "x": "1954年11月20日、\n馬場は母と上京しました。"}, {"t": 200.15, "x": "入院先は東京・飯田橋の病院です。"}, {"t": 203.06666666666666, "x": "ヘルニアの手術を受けるためでした。"}, {"t": 205.26666666666668, "x": "入団前の身体検査も同じ病院で行われています。"}, {"t": 209.05, "x": "このとき報知新聞は写真入りの\n記事で馬場を取り上げました。"}, {"t": 212.78333333333333, "x": "16歳の巨漢の投手が\n東京にやってきた、という記事です。"}, {"t": 217.2, "x": "測った数字は身長191センチ、\n体重98.4キロでした。"}, {"t": 222.85, "x": "翌1955年1月15日。"}, {"t": 225.8, "x": "馬場は今度は1人で上京し、正式に契約します。"}, {"t": 229.86666666666667, "x": "この年の巨人の新入団選手は20人。"}, {"t": 232.88333333333333, "x": "チーム全体でも55人という時代でした。"}, {"t": 235.78333333333333, "x": "同期にはのちに正捕手となる森昌彦がいます。"}, {"t": 238.76666666666668, "x": "ただ、馬場の名前を知る野球ファンは\nほとんどいませんでした。"}, {"t": 242.8, "x": "1955年2月、宮崎県串間市で\n春のキャンプが始まります。"}, {"t": 248.2, "x": "キャンプが終わると、\n新人の馬場は二軍に回されました。"}, {"t": 252.06666666666666, "x": "住まいは新丸子の合宿所です。"}, {"t": 254.36666666666667, "x": "多摩川グラウンドの対岸にありました。"}, {"t": 256.73333333333335, "x": "雨の日に使える室内練習場はありません。"}, {"t": 259.6666666666667, "x": "近くの橋のガード下で体を動かしました。"}, {"t": 262.46666666666664, "x": "同期で捕手だった選手が、\nこのころの馬場を振り返っています。"}, {"t": 266.6166666666667, "x": "大きなどてらを着ていて、動きが鈍かった。"}, {"t": 269.76666666666665, "x": "野球の基本的な技術が身についていなかった。"}, {"t": 272.81666666666666, "x": "手が大きすぎて、手首を\n使った投げ方ができなかった。"}, {"t": 276.6666666666667, "x": "指の腹でボールを押し出すように投げていた。"}, {"t": 279.35, "x": "硬式のボールを握ってから、\nまだ1年足らずの時期です。"}, {"t": 283.23333333333335, "x": "一軍の投手コーチは週に\n3回ほど朝9時に合宿所へ来ました。"}, {"t": 287.51666666666665, "x": "そして馬場1人だけに土手を\n30分駆け上がらせたといいます。"}, {"t": 291.3333333333333, "x": "二軍のコーチは、馬場の肩の筋肉は\n弱く疲れやすいと見ていました。"}, {"t": 296.1, "x": "そのため登板の間隔をあけています。"}, {"t": 298.6666666666667, "x": "1955年6月22日、川崎球場の大洋戦。"}, {"t": 303.9166666666667, "x": "捕手は同期の森昌彦です。"}, {"t": 305.93333333333334, "x": "この試合が、二軍での最初の\n先発とみられています。"}, {"t": 309.78333333333336, "x": "1年目の二軍の記録は2試合です。"}, {"t": 312.3333333333333, "x": "6回3分の2を投げて、自責点は2でした。"}, {"t": 315.8, "x": "このころの記事には、二軍監督の\n藤本英雄の見方が載っています。"}, {"t": 320.46666666666664, "x": "馬場を「将来の大器」と見ていた、というものです。"}, {"t": 323.78333333333336, "x": "2年目の1956年には、\n少なくとも7試合に投げて2勝1敗。"}, {"t": 329.2, "x": "1955年には関東で2つの\n二軍リーグが開かれていました。"}, {"t": 333.81666666666666, "x": "翌年にはどちらも無くなっています。"}, {"t": 336.06666666666666, "x": "巨人の二軍はほかの球団を\n連れて全国を回りました。"}, {"t": 339.76666666666665, "x": "そこで練習試合を重ねていきます。"}, {"t": 342.25, "x": "その1956年の後半、\n馬場の体に異変が起きました。"}, {"t": 347.18333333333334, "x": "シーズンが終わると、\n目が急に見えなくなっていきます。"}, {"t": 350.95, "x": "本人の言葉では「5メートル先も\n見えなくなった」。"}, {"t": 354.0, "x": "最初に行ったのは、\n合宿所に近い田園調布の病院です。"}, {"t": 358.5, "x": "そこでは「うちでは手に負えない」と\n言われました。"}, {"t": 361.1, "x": "紹介されたのは、東京・千代田区の警察病院です。"}, {"t": 365.0, "x": "告げられた診断は、脳下垂体の腫瘍でした。"}, {"t": 368.4166666666667, "x": "腫瘍が目の神経を押していたのです。"}, {"t": 370.8833333333333, "x": "手術をしなければ失明する。"}, {"t": 372.8666666666667, "x": "医師からは、あんまやマッサージの\n仕事を勧められたといいます。"}, {"t": 377.03333333333336, "x": "目が見えるうちに\n覚えておくように、という話でした。"}, {"t": 380.75, "x": "完全に治る見込みは「1%ぐらい」。"}, {"t": 383.4, "x": "馬場は、そう言われたと語っています。"}, {"t": 386.15, "x": "馬場が向かったのは、\n東京大学医学部の第一外科でした。"}, {"t": 390.26666666666665, "x": "執刀したのは、第一外科の教授です。"}, {"t": 393.5, "x": "この教授は、東京大学の野球部の出身でした。"}, {"t": 397.35, "x": "手術の日付は、資料によって割れています。"}, {"t": 400.6, "x": "これまでの伝記の多くは、\n手術を1957年の年末としてきました。"}, {"t": 406.0, "x": "一軍で投げたあとに手術を\n受けた、という流れです。"}, {"t": 409.8, "x": "一方、馬場の野球時代を\n調べた野球ライターがいます。"}, {"t": 413.96666666666664, "x": "このライターは東京大学に\n残る記録を見つけました。"}, {"t": 417.31666666666666, "x": "その記録では、手術は\n1956年12月22日です。"}, {"t": 422.35, "x": "麻酔は午前9時40分から11時40分。"}, {"t": 425.81666666666666, "x": "手術そのものは10時15分から\n11時35分でした。"}, {"t": 429.85, "x": "およそ1時間20分です。"}, {"t": 431.8833333333333, "x": "右の額のあたりで頭の骨を開き、\n柔らかい腫瘍を吸い出しています。"}, {"t": 436.78333333333336, "x": "当時この手術は、3人に1人が\n亡くなるといわれていました。"}, {"t": 440.81666666666666, "x": "このライターは、\nそれほど難しい手術だったと書いています。"}, {"t": 444.75, "x": "今回は、この東京大学の\n記録の日付で話を進めます。"}, {"t": 449.1666666666667, "x": "手術は成功しました。"}, {"t": 450.9166666666667, "x": "馬場は1週間ほどで退院しています。"}, {"t": 453.48333333333335, "x": "翌月には春のキャンプに\n戻ったと伝えられています。"}, {"t": 456.7, "x": "入団から2年がたっていました。"}, {"t": 458.8, "x": "3年目の1957年。"}, {"t": 461.31666666666666, "x": "4月16日、多摩川球場の東映戦に先発します。"}, {"t": 465.93333333333334, "x": "結果は1対4で、負け投手でした。"}, {"t": 468.85, "x": "当時の新聞は、投げる動きが\n大きすぎると評しています。"}, {"t": 472.98333333333335, "x": "ランナーを出すと苦しくなる、という指摘でした。"}, {"t": 476.31666666666666, "x": "それでも5月からは二軍の\n先発投手の1人として回ります。"}, {"t": 480.25, "x": "6月25日からは東北と\n北海道を回る遠征に加わりました。"}, {"t": 484.96666666666664, "x": "国鉄と大洋の二軍と一緒に、\n各地で試合をしています。"}, {"t": 489.1666666666667, "x": "8月21日、広島市民球場。"}, {"t": 492.5, "x": "馬場は初めて一軍に呼ばれました。"}, {"t": 494.8333333333333, "x": "役目は、バッティング練習で投げる係です。"}, {"t": 498.1166666666667, "x": "そして4日後の8月25日、\n甲子園球場の阪神戦。"}, {"t": 502.95, "x": "ダブルヘッダーの2試合目でした。"}, {"t": 505.01666666666665, "x": "0対9と大きく離された場面です。"}, {"t": 507.7, "x": "ここで馬場が一軍のマウンドに上がります。"}, {"t": 510.26666666666665, "x": "相手は阪神の上位打線で、\n最初の打者は吉田義男でした。"}, {"t": 514.7666666666667, "x": "馬場は3人とも打ち取りました。"}, {"t": 516.85, "x": "1イニングを三者凡退です。"}, {"t": 518.9833333333333, "x": "受けた捕手は、同期の森昌彦でした。"}, {"t": 521.85, "x": "吉田義男はのちに馬場の\n球をこう振り返っています。"}, {"t": 525.2833333333333, "x": "「2階から球が落ちてくるようやった」。"}, {"t": 527.5166666666667, "x": "一軍での2試合目は10月15日、\n後楽園球場の阪神戦でした。"}, {"t": 533.0666666666667, "x": "4対0とリードした9回に登板し、また三者凡退。"}, {"t": 537.3166666666667, "x": "三振を2つ奪っています。"}, {"t": 539.3166666666667, "x": "一軍での3試合目は、\nシーズン最後の日の10月23日です。"}, {"t": 544.25, "x": "後楽園球場の中日戦で、\nダブルヘッダーの1試合目でした。"}, {"t": 549.3333333333334, "x": "監督の水原茂は、馬場を先発に指名します。"}, {"t": 553.2333333333333, "x": "この日の中日の先発は杉下茂。"}, {"t": 555.8833333333333, "x": "杉下にとっては、\n勝てば通算200勝の試合でした。"}, {"t": 559.8833333333333, "x": "達成すれば、プロ野球で7人目です。"}, {"t": 562.95, "x": "馬場は1回に1点を取られます。"}, {"t": 565.2, "x": "しかしその後は点を許しません。"}, {"t": 567.3833333333333, "x": "5回まで1失点で投げました。"}, {"t": 569.55, "x": "5回の裏、馬場に打順が回ります。"}, {"t": 572.4333333333333, "x": "水原はここで代打を送りました。"}, {"t": 574.6333333333333, "x": "馬場が降りたあと、巨人は0対10で敗れます。"}, {"t": 578.0666666666667, "x": "杉下は200勝を達成しました。"}, {"t": 580.5, "x": "負け投手として記録されたのは、馬場です。"}, {"t": 583.45, "x": "一軍での成績は、この3試合ですべてです。"}, {"t": 587.0666666666667, "x": "3試合で7イニング、0勝1敗。"}, {"t": 590.1666666666666, "x": "四球は1つも出していません。"}, {"t": 592.15, "x": "三振は3つです。"}, {"t": 593.7, "x": "自責点は1で、防御率は1.29。"}, {"t": 597.15, "x": "これが、プロ野球の公式記録に\n残る投手・馬場正平の数字です。"}, {"t": 601.9166666666666, "x": "このあと馬場が一軍に呼ばれることは\n二度とありませんでした。"}, {"t": 605.4333333333333, "x": "その理由として、当時の球団の\n中の事情が伝えられています。"}, {"t": 609.85, "x": "このころの巨人では、監督の水原と\n球団社長が対立していました。"}, {"t": 614.7666666666667, "x": "球団社長は、二軍監督の新田恭一を\n通じて二軍を押さえていたとされます。"}, {"t": 620.3166666666667, "x": "このころのシーズンオフには、\n球団社長の発言が騒ぎになりました。"}, {"t": 625.1166666666667, "x": "その言葉は「水原君、あやまりたまえ」。"}, {"t": 628.25, "x": "馬場は二軍暮らしが長い選手でした。"}, {"t": 630.75, "x": "そのため、球団社長の側の\n選手と見られていたといいます。"}, {"t": 634.9833333333333, "x": "これは、先ほどの野球ライターの調べです。"}, {"t": 638.1666666666666, "x": "馬場を支えていた藤本英雄も、のちに\n球団を離れています。"}, {"t": 642.6166666666667, "x": "水原が馬場を「空気を読まない」と\n嫌った、という説もあります。"}, {"t": 646.8833333333333, "x": "ただ、本人たちが\nそう語った記録は見当たりません。"}, {"t": 650.5666666666667, "x": "1958年、巨人に長嶋茂雄が入団します。"}, {"t": 655.1166666666667, "x": "キャンプの初日、長嶋の\nキャッチボールの相手は馬場でした。"}, {"t": 659.3, "x": "長嶋はのちに、こう語っています。"}, {"t": 662.05, "x": "「馬場ちゃんは俺たちの中では野球人ですから」。"}, {"t": 664.9666666666667, "x": "翌1959年には王貞治が入団しました。"}, {"t": 668.8166666666667, "x": "馬場は、王のバッティング練習で\n投げる役を買って出ています。"}, {"t": 672.9333333333333, "x": "二軍の馬場は、地方の球場で客を\n呼べる選手になっていました。"}, {"t": 677.35, "x": "試合の前には「巨人軍の巨人馬場来る」と\n宣伝が打たれます。"}, {"t": 681.3166666666667, "x": "腕を水車のように回してから投げる姿に、\n観客がわいたといいます。"}, {"t": 686.0666666666667, "x": "1958年には、地元の新潟への\n遠征が3回組まれました。"}, {"t": 691.3, "x": "球場は満員が続いています。"}, {"t": 693.5, "x": "二軍の公式戦の記録は残っていません。"}, {"t": 696.3166666666667, "x": "このライターがつきとめた分だけで、\n二軍では54試合に登板。"}, {"t": 701.0166666666667, "x": "成績は15勝8敗です。"}, {"t": 703.2, "x": "二軍で13勝2敗を挙げて最優秀\n投手になった、という話もあります。"}, {"t": 708.6, "x": "しかし、裏付けとなる記録は見つかっていません。"}, {"t": 712.1, "x": "同期の捕手は、馬場が二軍の\nエースだったかと聞かれました。"}, {"t": 715.9333333333333, "x": "答えは「それはちょっと言いにくい」。"}, {"t": 717.9166666666666, "x": "その一方で、コントロールは\n良かったと証言しています。"}, {"t": 721.8, "x": "四球で試合を壊すことはなかったそうです。"}, {"t": 724.6833333333333, "x": "球は重いけれど、速くはありませんでした。"}, {"t": 727.8833333333333, "x": "球種はストレートとカーブとシュートです。"}, {"t": 730.3, "x": "5年目の1959年。"}, {"t": 732.6833333333333, "x": "春に肩を痛めます。"}, {"t": 734.2, "x": "10月には左のひざをねんざしました。"}, {"t": 736.7, "x": "二軍での成績も落ちていきます。"}, {"t": 738.9166666666666, "x": "そして1959年11月9日、\n馬場は球団から「整理」を告げられました。"}, {"t": 744.95, "x": "入団したときの身長は191センチです。"}, {"t": 748.2833333333333, "x": "このころには200センチになっていました。"}, {"t": 750.65, "x": "のちにプロレスラーとして記録される身長は、\n209センチです。"}, {"t": 755.0, "x": "巨人を出た馬場に声をかけたのは、\nあのスカウトでした。"}, {"t": 758.6666666666666, "x": "入団のときに、三条の家まで来た人物です。"}, {"t": 762.1666666666666, "x": "このスカウトは、巨人の投手コーチと\n一緒に大洋ホエールズへ移っていました。"}, {"t": 767.25, "x": "1959年12月、馬場は多摩川で\n大洋の入団テストを受けます。"}, {"t": 773.0166666666667, "x": "結果は合格でした。"}, {"t": 774.6, "x": "翌1960年、兵庫県明石市の\n大洋のキャンプに加わります。"}, {"t": 779.9333333333333, "x": "1960年2月12日、\nキャンプの宿舎で事故が起きます。"}, {"t": 784.8166666666667, "x": "馬場は風呂場で転び、左腕を大きく切りました。"}, {"t": 788.3166666666667, "x": "縫った針の数は、資料によって割れています。"}, {"t": 791.6166666666667, "x": "少ないもので17針、多いもので36針です。"}, {"t": 795.5333333333333, "x": "このけがで、左手の指が伸びなくなりました。"}, {"t": 798.65, "x": "グローブをはめることができません。"}, {"t": 800.6666666666666, "x": "馬場はここで、\nプロ野球を続けることをあきらめます。"}, {"t": 804.3, "x": "22歳になったばかりでした。"}, {"t": 806.3333333333334, "x": "1960年3月、週刊文春が\n見開きで馬場を取り上げました。"}, {"t": 811.6333333333333, "x": "写真つきの記事の題は「巨人軍を\n追われた『ミスター巨人』」。"}, {"t": 815.2, "x": "記事の中で馬場は、\n何でもやるつもりでいると語っています。"}, {"t": 819.0666666666667, "x": "相撲よりはプロレスのほうがいいかもしれない。"}, {"t": 821.8, "x": "生活費を稼がなければならない。"}, {"t": 823.95, "x": "そういう言葉も載っています。"}, {"t": 825.8166666666667, "x": "高校生のころ、家に来た力士から\n逃げ回っていた本人の言葉でした。"}, {"t": 830.5833333333334, "x": "1960年4月、馬場は力道山の\n日本プロレスに入門します。"}, {"t": 836.0666666666667, "x": "そして1960年9月30日、東京の台東体育館。"}, {"t": 841.2333333333333, "x": "馬場はプロレスラーとして最初の試合に出ました。"}, {"t": 844.1, "x": "ここから先は、また別の話になります。"}, {"t": 847.1, "x": "最後に、巨人での5年間を日付で並べておきます。"}, {"t": 851.0, "x": "1954年秋、三条の家で\n支度金20万円を示され、入団を決める。"}, {"t": 857.3833333333333, "x": "1955年1月15日、16歳で契約。"}, {"t": 861.9333333333333, "x": "1955年6月22日、\n川崎球場で二軍の初先発。"}, {"t": 867.65, "x": "1956年12月22日、\n東京大学で脳下垂体の手術。"}, {"t": 873.35, "x": "日付は東京大学の記録による。"}, {"t": 875.7166666666667, "x": "1957年8月25日、\n甲子園で一軍初登板。三者凡退。"}, {"t": 882.2, "x": "1957年10月23日、後楽園で初先発。"}, {"t": 887.3666666666667, "x": "5回1失点で負け投手。"}, {"t": 889.3833333333333, "x": "一軍はこれが最後。"}, {"t": 890.9833333333333, "x": "1959年11月9日、\n球団から整理を告げられる。"}, {"t": 896.05, "x": "1960年2月12日、\n大洋のキャンプで左腕に大きなけが。"}, {"t": 901.65, "x": "野球をあきらめる。"}, {"t": 902.9166666666666, "x": "1960年9月30日、プロレスでデビュー。"}, {"t": 906.9166666666666, "x": "公式記録に残るのは、\n3試合で7イニング、自責点1。"}, {"t": 911.6, "x": "その7イニングのほかに、記録の\n残らない二軍の試合が5年分ありました。"}, {"t": 916.65, "x": "ご視聴、誠にありがとうございました。"}, {"t": 919.6333333333333, "x": "野球をしていたころの馬場の話で、\n知りたいことがあればコメントで教えてください。"}, {"t": 924.9166666666666, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage" const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
