<script>
const D={"name": "テリー・ゴーディ", "file": "217_編集用", "dur": 841.06665625, "segs": [], "subs": [{"t": 0.0, "x": "2001年7月16日、アメリカ・テネシー州。"}, {"t": 3.9833333333333334, "x": "自宅で1人のプロレスラーが亡くなりました。"}, {"t": 6.533333333333333, "x": "40歳でした。"}, {"t": 7.883333333333334, "x": "名前をテリー・ゴーディといいます。"}, {"t": 9.833333333333334, "x": "イメージ映像"}, {"t": 9.833333333333334, "x": "1980年代から1990\n年代のはじめにかけて、全日本プロレスの"}, {"t": 15.816666666666666, "x": "リングに立ち続けた外国人選手です。"}, {"t": 18.233333333333334, "x": "日本での異名は「人間魚雷」。"}, {"t": 20.3, "x": "全日本プロレスの三冠ヘビー級王座を、\n外国人として初めて巻いた選手でもありました。"}, {"t": 26.5, "x": "日本の報道は、死因を心不全と伝えています。"}, {"t": 30.216666666666665, "x": "亡くなった場所はテネシー\n州の自宅、年齢は40歳。"}, {"t": 34.333333333333336, "x": "ここまでが、複数の資料で一致している内容です。"}, {"t": 38.1, "x": "引退していたわけではありませんでした。"}, {"t": 40.516666666666666, "x": "最後の試合は、亡くなる5か月前の\n2001年2月4日です。"}, {"t": 45.266666666666666, "x": "今回は、テリー・ゴーディと\nいう1人のレスラーが残した記録を、"}, {"t": 49.25, "x": "日付とタイトル歴だけで追っていきます。"}, {"t": 51.733333333333334, "x": "イメージ映像"}, {"t": 51.733333333333334, "x": "心情の推測や、確認の\n取れていない話は入れません。"}, {"t": 55.95, "x": "確認できた事実だけを、順番に並べます。"}, {"t": 59.266666666666666, "x": "最後までお付き合いいただけますと幸いです。"}, {"t": 62.083333333333336, "x": "チャンネル登録と高評価も、よろしく\nお願いいたします。"}, {"t": 66.03333333333333, "x": "テリー・ゴーディが生まれたのは\n1961年4月23日です。"}, {"t": 70.66666666666667, "x": "出身地の表記は、資料によって分かれています。"}, {"t": 74.28333333333333, "x": "日本語の資料はテネシー州チャタヌーガ、英語圏の\n資料はジョージア州ロスビルと記しています。"}, {"t": 80.68333333333334, "x": "ここではどちらとも断定しません。"}, {"t": 82.86666666666666, "x": "デビューした年も同じく分かれています。"}, {"t": 85.28333333333333, "x": "1975年とする資料と、\n1977年とする資料があります。"}, {"t": 91.13333333333334, "x": "共通しているのは、10代のうちに\nリングに上がっていたという点です。"}, {"t": 95.6, "x": "そして1970年代の終わり、\nゴーディはマイケル・ヘイズと組みます。"}, {"t": 100.55, "x": "ここにバディ・ロバーツが加わり、\n3人組になりました。"}, {"t": 104.25, "x": "ファビュラス・フリーバーズです。"}, {"t": 105.96666666666667, "x": "結成の時期は、1978年の末とする資料と、\n1979年のはじめとする資料があります。"}, {"t": 114.11666666666666, "x": "タッグマッチは2人で戦うものですが、\nフリーバーズは3人でした。"}, {"t": 118.68333333333334, "x": "そこでこのチームは、3人のうちの\nどの2人が出てもよい、という扱いで"}, {"t": 123.81666666666666, "x": "試合とタイトル戦をこなしていきます。"}, {"t": 126.03333333333333, "x": "この扱いは後に「フリーバード・ルール」と\n呼ばれるようになりました。"}, {"t": 129.65, "x": "チーム名がそのままルールの\n名前として残ったことになります。"}, {"t": 133.31666666666666, "x": "チーム名の由来は、サザンロックの\nバンド、レーナード・スキナードの"}, {"t": 137.91666666666666, "x": "曲「フリー・バード」です。"}, {"t": 139.16666666666666, "x": "初期はこの曲をそのまま入場曲に使っていました。"}, {"t": 142.5, "x": "1984年からは、マイケル・\nヘイズ本人が歌ったオリジナル曲"}, {"t": 147.38333333333333, "x": "「バッドストリートUSA」に変わっています。"}, {"t": 149.85, "x": "3人の役割について、資料はこう説明しています。"}, {"t": 153.88333333333333, "x": "ヘイズがマイクを持って話す役、\nバディ・ロバーツが試合を組み立てる役、そして"}, {"t": 159.21666666666667, "x": "テリー・ゴーディが体格と力を担う役でした。"}, {"t": 161.86666666666667, "x": "イメージ映像"}, {"t": 161.86666666666667, "x": "フリーバーズの名前がアメリカ\n南部で決定的に知られたのは、"}, {"t": 165.5, "x": "1982年12月25日のことでした。"}, {"t": 169.43333333333334, "x": "場所はテキサス州ダラスの\nリユニオン・アリーナです。"}, {"t": 172.45, "x": "この日、ケリー・フォン・エリックが、NWA世界\nヘビー級王者リック・フレアーに挑戦しました。"}, {"t": 179.25, "x": "金網に囲まれた試合です。"}, {"t": 181.21666666666667, "x": "この試合の特別レフェリーを務めたのが、\nマイケル・ヘイズでした。"}, {"t": 185.41666666666666, "x": "試合の終盤、ヘイズはフレアーを倒し、\nフォン・エリックにフォールを促します。"}, {"t": 191.15, "x": "フォン・エリックはそれを受け入れませんでした。"}, {"t": 193.66666666666666, "x": "そしてフォン・エリックが金網から\n出ようとしたとき、テリー・ゴーディが金網の"}, {"t": 198.3, "x": "扉をフォン・エリックの頭に叩きつけました。"}, {"t": 200.9, "x": "この日から、フリーバーズとフォン・\nエリック一家の抗争が始まります。"}, {"t": 205.21666666666667, "x": "イメージ映像"}, {"t": 205.21666666666667, "x": "テキサスのプロレスで、\n最も長く続いた対立になりました。"}, {"t": 209.33333333333334, "x": "1982年12月25日の時点で、\nテリー・ゴーディは21歳です。"}, {"t": 215.3, "x": "フリーバーズの3人の中で、最も年下でした。"}, {"t": 219.03333333333333, "x": "その翌々年、ゴーディは日本のリングに立ちます。"}, {"t": 222.76666666666668, "x": "1983年8月31日、東京・蔵前国技館。"}, {"t": 228.08333333333334, "x": "この日は、テリー・ファンクの\n引退試合が組まれていました。"}, {"t": 231.75, "x": "ドリー・ファンク・ジュニアとテリー・\nファンクの兄弟に、スタン・ハンセンとテリー・"}, {"t": 235.85, "x": "ゴーディが向かい合うタッグマッチです。"}, {"t": 237.81666666666666, "x": "ゴーディはこのとき22歳でした。"}, {"t": 240.01666666666668, "x": "全日本プロレスへの初来日が、テリー・ファンクの\n引退試合という日だったことになります。"}, {"t": 245.65, "x": "なお、テリー・ファンクはこの引退を後に撤回し、\n1984年10月26日に現役へ戻っています。"}, {"t": 254.03333333333333, "x": "以後、ゴーディは全日本\nプロレスの常連となりました。"}, {"t": 257.7, "x": "イメージ映像"}, {"t": 257.7, "x": "ゴーディの日本での記録が\n数字になって残りはじめるのは、1988年です。"}, {"t": 263.46666666666664, "x": "1988年7月29日、高崎市中央体育館。"}, {"t": 268.93333333333334, "x": "スタン・ハンセンと組んだゴーディは、\nジャンボ鶴田と谷津嘉章の五輪"}, {"t": 273.1333333333333, "x": "コンビから世界タッグ王座を奪いました。"}, {"t": 275.53333333333336, "x": "ゴーディにとって最初の世界タッグ戴冠です。"}, {"t": 278.3833333333333, "x": "同じ年の12月、全日本プロレスの\n世界最強タッグ決定リーグ戦が開かれます。"}, {"t": 284.31666666666666, "x": "参加は11チームでした。"}, {"t": 286.3, "x": "ハンセンとゴーディの組は「ニュー・\nミラクルパワーコンビ」と呼ばれました。"}, {"t": 289.95, "x": "2人は17点で優勝します。"}, {"t": 292.28333333333336, "x": "準優勝は16点の五輪コンビでした。"}, {"t": 295.1, "x": "最終戦は12月16日、日本武道館。"}, {"t": 298.9166666666667, "x": "この日、2人は世界タッグ王座も手にしています。"}, {"t": 302.3833333333333, "x": "イメージ映像"}, {"t": 302.3833333333333, "x": "ゴーディにとって、ここからの3年間が\n日本での最も濃い時期になります。"}, {"t": 307.25, "x": "1990年2月21日、1人のアメリカ人が\n全日本プロレスに初参戦しました。"}, {"t": 313.93333333333334, "x": "スティーブ・ウィリアムスです。"}, {"t": 315.53333333333336, "x": "ウィリアムスは1960年5月14日生まれ、\nコロラド州レイクウッドの出身です。"}, {"t": 321.85, "x": "オクラホマ大学ではアマチュアレスリングと\nアメリカンフットボールの両方をやっていました。"}, {"t": 326.8333333333333, "x": "レスリングでは大学選手権を4\n年連続で制したと記録されています。"}, {"t": 331.3, "x": "フットボールではオクラホマ・スーナーズの\nレギュラーを務め、大学を出たあとは"}, {"t": 336.0833333333333, "x": "アメリカンフットボールのリーグ、USFLの\nニュージャージー・ジェネラルズに入っています。"}, {"t": 341.4166666666667, "x": "ウィリアムスの異名は「殺人医師」でした。"}, {"t": 343.8666666666667, "x": "ゴーディの異名は「人間魚雷」です。"}, {"t": 346.05, "x": "この2つを合わせて、2人のタッグチームは\n「殺人魚雷」と呼ばれるようになりました。"}, {"t": 351.3, "x": "イメージ映像"}, {"t": 351.3, "x": "ゴーディの異名は、ほかにもありました。"}, {"t": 353.8666666666667, "x": "日本の資料には「元祖パワーボム」\n「デンジャラス・ボーイ」と"}, {"t": 356.8833333333333, "x": "いう呼ばれ方も残っています。"}, {"t": 358.6333333333333, "x": "1990年3月6日、日本武道館。"}, {"t": 362.5, "x": "ゴーディとウィリアムスは\n世界タッグ王座を獲得します。"}, {"t": 365.81666666666666, "x": "組んで1か月足らずでの戴冠でした。"}, {"t": 368.26666666666665, "x": "そして1990年6月5日、千葉公園体育館。"}, {"t": 372.98333333333335, "x": "ゴーディは三冠ヘビー級王者ジャンボ\n鶴田に挑み、王座を奪いました。"}, {"t": 377.7, "x": "三冠ヘビー級王座は、1989年\n4月18日に生まれたベルトです。"}, {"t": 383.75, "x": "それまで全日本プロレスにあったPWF\nヘビー級王座、NWAインターナショナル・"}, {"t": 389.73333333333335, "x": "ヘビー級王座、UNヘビー級王座の3本を、\n1つにまとめたものでした。"}, {"t": 395.21666666666664, "x": "統一戦が行われたのは東京の大田区体育館です。"}, {"t": 398.93333333333334, "x": "この日、ジャンボ鶴田がスタン・\nハンセンを破り、初代王者になりました。"}, {"t": 403.95, "x": "初代王者はジャンボ鶴田、2代目は\n天龍源一郎、3代目もジャンボ鶴田です。"}, {"t": 409.96666666666664, "x": "ここまで、王者はいずれも日本人選手でした。"}, {"t": 413.35, "x": "イメージ映像"}, {"t": 413.35, "x": "4代目となったテリー・ゴーディは、外国人として\n初めてこのベルトを巻いた選手になりました。"}, {"t": 419.1, "x": "29歳のときです。"}, {"t": 420.7, "x": "ただし、この王座は長く続きませんでした。"}, {"t": 424.05, "x": "3日後の1990年6月8日、日本武道館。"}, {"t": 428.4, "x": "ゴーディはスタン・ハンセンに敗れ、\n王座を明け渡します。"}, {"t": 432.25, "x": "保持期間は3日間でした。"}, {"t": 434.15, "x": "これは三冠ヘビー級王座の\n歴代最短記録として記録されています。"}, {"t": 438.53333333333336, "x": "ゴーディはひと月半後に取り返します。"}, {"t": 440.96666666666664, "x": "1990年7月17日、石川県産業展示館。"}, {"t": 446.1333333333333, "x": "ハンセンを破って2度目の戴冠です。"}, {"t": 448.53333333333336, "x": "イメージ映像"}, {"t": 448.53333333333336, "x": "その9日後のことでした。"}, {"t": 450.31666666666666, "x": "1990年7月26日、全日本プロレスの\n伊勢崎大会が終わったあとのことです。"}, {"t": 456.98333333333335, "x": "東京に戻ったゴーディは、\n飲酒中に突然倒れ、意識を失いました。"}, {"t": 462.3833333333333, "x": "一時、心臓が止まった状態になっています。"}, {"t": 465.7, "x": "搬送されたのは慈恵医大病院でした。"}, {"t": 468.3, "x": "意識が戻ったのは、その翌日です。"}, {"t": 471.0833333333333, "x": "イメージ映像"}, {"t": 471.0833333333333, "x": "この件により、ゴーディが\n持っていた三冠ヘビー級王座は返上されました。"}, {"t": 476.1333333333333, "x": "2度目の戴冠から、10日後のことでした。"}, {"t": 479.1, "x": "翌7月27日、松戸運動公園体育館で、\nスタン・ハンセンが次の王者になっています。"}, {"t": 486.1666666666667, "x": "ゴーディはリングに戻ってきました。"}, {"t": 488.1166666666667, "x": "1990年12月7日、日本武道館。"}, {"t": 492.05, "x": "世界最強タッグ決定リーグ戦の最終戦です。"}, {"t": 495.48333333333335, "x": "参加13チームのうち、ゴーディと\nウィリアムスは21点で優勝しました。"}, {"t": 500.81666666666666, "x": "準優勝はスタン・ハンセンの組で20点です。"}, {"t": 503.8666666666667, "x": "イメージ映像"}, {"t": 503.8666666666667, "x": "試合終了の間際に決着がつく形での優勝でした。"}, {"t": 507.6333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');

const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';

    mark('subs',i);

  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';

const mk=document.getElementById('mk');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
