<style>

<script>
const D={"name": "武藤敬司", "file": "245_編集用", "dur": 832.0833125, "segs": [], "subs": [{"t": 0.0, "x": "2018年3月14日、後楽園ホール。"}, {"t": 3.933333333333333, "x": "8人タッグマッチのリングで、55歳の\n武藤敬司がコーナーポストに上っていました。"}, {"t": 9.733333333333333, "x": "そこから後ろ向きに宙を舞い、倒れた相手に\n体ごと落ちていく技、ムーンサルトプレスです。"}, {"t": 16.233333333333334, "x": "この夜のムーンサルトには、前もって\n「最後」という言葉がついていました。"}, {"t": 20.816666666666666, "x": "16日後の3月30日、武藤は都内の\n病院で約3時間の手術を受けます。"}, {"t": 26.783333333333335, "x": "イメージ映像"}, {"t": 26.783333333333335, "x": "両膝を、まるごと人工関節に\n入れ替える手術でした。"}, {"t": 31.033333333333335, "x": "手術の前、武藤はこう話しています。"}, {"t": 34.016666666666666, "x": "「必ず帰って試合をするつもりなんですが、やったら\nダメな技に一つあるのが、ムーンサルトプレス」"}, {"t": 40.733333333333334, "x": "イメージ映像"}, {"t": 40.733333333333334, "x": "最初に膝を手術したのは24歳のときです。"}, {"t": 43.916666666666664, "x": "イメージ映像"}, {"t": 43.916666666666664, "x": "それから30年以上、武藤は痛む膝を\n抱えたままリングに上がり続けました。"}, {"t": 49.38333333333333, "x": "イメージ映像"}, {"t": 49.38333333333333, "x": "歩くことさえままならなくなっても、なぜ\nこの男はプロレスを辞めなかったのでしょうか。"}, {"t": 54.75, "x": "今回は、武藤敬司の膝が壊れてから\n引退するまでの道のりを、具体的な日付と"}, {"t": 60.61666666666667, "x": "本人の証言をもとに辿っていきます。"}, {"t": 63.0, "x": "最後までご覧いただければ幸いです。"}, {"t": 65.5, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.06666666666666, "x": "武藤敬司は1962年12月23日、\n山梨県富士吉田市に生まれました。"}, {"t": 77.73333333333333, "x": "柔道で実績を積み、1982年には\n全日本新人柔道体重別選手権の"}, {"t": 84.3, "x": "95キロ以下級で3位に入っています。"}, {"t": 86.98333333333333, "x": "1984年10月5日、\n新日本プロレスでデビュー。"}, {"t": 91.61666666666666, "x": "デビュー戦の相手は、\n同期入門の蝶野正洋でした。"}, {"t": 95.56666666666666, "x": "イメージ映像"}, {"t": 95.56666666666666, "x": "ムーンサルトプレスを初めて見せたのは、\nデビューから5か月後の1985年3月1日、"}, {"t": 102.2, "x": "後楽園ホールのタッグマッチです。"}, {"t": 104.83333333333333, "x": "武藤は後に、事前の\n練習はしておらず一発勝負だったと"}, {"t": 108.83333333333333, "x": "振り返り、こう話しています。"}, {"t": 111.1, "x": "「恐怖心なんてないよ」\n2019年のラジオ番組では、"}, {"t": 114.6, "x": "子どものころの話もしています。"}, {"t": 116.83333333333333, "x": "イメージ映像"}, {"t": 116.83333333333333, "x": "「ガキの頃、山梨の田んぼで乾燥したわらとかを\nクッションにして、バク転とかそう"}, {"t": 122.33333333333333, "x": "イメージ映像"}, {"t": 122.33333333333333, "x": "いうのを練習したりもしたりして。"}, {"t": 124.21666666666667, "x": "あの、仮面ライダーになりたかったから」"}, {"t": 126.91666666666667, "x": "イメージ映像"}, {"t": 126.91666666666667, "x": "この技は、コーナーから回転して、\n最後はマットに膝から落ちる形になります。"}, {"t": 132.61666666666667, "x": "イメージ映像"}, {"t": 132.61666666666667, "x": "2015年のインタビューで、\n武藤は膝への負担をこう説明しています。"}, {"t": 137.56666666666666, "x": "イメージ映像"}, {"t": 137.56666666666666, "x": "「ムーンサルトってコーナーから回転して打つ。"}, {"t": 140.21666666666667, "x": "それでどうしても膝ばかりを打ってしまう」"}, {"t": 142.61666666666667, "x": "最初の手術は1987年、24歳のときでした。"}, {"t": 147.63333333333333, "x": "イメージ映像"}, {"t": 147.63333333333333, "x": "東京スポーツの連載で、\n武藤はこう振り返っています。"}, {"t": 151.56666666666666, "x": "「月面水爆の影響でヒザに\n違和感を感じるようになっていた。"}, {"t": 155.66666666666666, "x": "だから右ヒザ半月板の除去手術を受けたんだ」\n半月板は、膝の骨と骨の間で"}, {"t": 161.26666666666668, "x": "クッションの役目をする軟骨です。"}, {"t": 163.3, "x": "イメージ映像"}, {"t": 163.3, "x": "手術は成功しました。"}, {"t": 165.05, "x": "しかし年が明けた1988年1月2日、\n武藤は桜田一男、リングネームで"}, {"t": 171.6, "x": "イメージ映像"}, {"t": 171.6, "x": "いうケンドー・ナガサキと共に、\nプエルトリコへ向かいます。"}, {"t": 175.03333333333333, "x": "満足なリハビリを終えないままの海外遠征でした。"}, {"t": 178.26666666666668, "x": "イメージ映像"}, {"t": 178.26666666666668, "x": "武藤は自伝で、手術後のリハビリを十分に\n行わずにプエルトリコへ行ったことが"}, {"t": 183.48333333333332, "x": "致命的だった、と書いています。"}, {"t": 185.86666666666667, "x": "イメージ映像"}, {"t": 185.86666666666667, "x": "クッションを失った膝で何が起きたのか。"}, {"t": 188.46666666666667, "x": "これも2015年の本人の言葉です。"}, {"t": 191.15, "x": "「中のクッションを除去しちゃったから、\n酷使している間に骨と骨が"}, {"t": 195.35, "x": "ぶつかるようになっちゃって、\n変形してきちゃった。"}, {"t": 198.4, "x": "膝関節症です」"}, {"t": 199.86666666666667, "x": "イメージ映像"}, {"t": 199.86666666666667, "x": "それでも武藤は第一線にいました。"}, {"t": 202.2, "x": "1995年5月3日、福岡ドームで\nIWGPヘビー級王座を奪取。"}, {"t": 209.11666666666667, "x": "イメージ映像"}, {"t": 209.11666666666667, "x": "1999年にはプロレス大賞の\nMVPを受けています。"}, {"t": 213.48333333333332, "x": "2002年には全日本プロレスへ移籍し、\n同じ年の10月に社長となりました。"}, {"t": 219.06666666666666, "x": "2018年の会見の時点で、\n東京スポーツは武藤が両膝の痛みに"}, {"t": 224.23333333333332, "x": "30年近く悩まされていたと伝えています。"}, {"t": 227.06666666666666, "x": "最初の大きな限界は2010年に来ました。"}, {"t": 230.08333333333334, "x": "3月8日の千葉大会で、\n右膝がついに限界を迎えます。"}, {"t": 234.7, "x": "翌日の緊急会見で、武藤は\nシリーズ全戦の欠場を発表しました。"}, {"t": 239.86666666666667, "x": "連載ではこう語っています。"}, {"t": 241.81666666666666, "x": "「2010年、ヒザの痛みにギブアップした。"}, {"t": 244.95, "x": "右ヒザが動かなくなって、\n変形性膝関節症という診断で4月に"}, {"t": 249.65, "x": "イメージ映像"}, {"t": 249.65, "x": "手術したんだ」4月5日の手術について、\n全日本プロレスは、膝の中から遊離体と"}, {"t": 255.56666666666666, "x": "呼ばれる骨や軟骨のかけらを約20個取り除き、\n骨のとげを削ったと発表しています。"}, {"t": 261.3, "x": "予定は1時間半から2時間でしたが、\n実際には3時間かかりました。"}, {"t": 266.35, "x": "報道によれば、右膝の手術はこれで4度目でした。"}, {"t": 270.15, "x": "武藤が復帰したのは、この年の9月10日、\n船木誠勝とのシングルマッチです。"}, {"t": 275.85, "x": "翌2011年8月、東日本大震災の\n復興支援チャリティー大会で、"}, {"t": 281.5833333333333, "x": "イメージ映像"}, {"t": 281.5833333333333, "x": "武藤は小橋建太とタッグを組みます。"}, {"t": 284.18333333333334, "x": "小橋もまた、ムーンサルトを\n使い続けてきたレスラーでした。"}, {"t": 288.0833333333333, "x": "イメージ映像"}, {"t": 288.0833333333333, "x": "武藤は控室でのやりとりをこう覚えています。"}, {"t": 291.06666666666666, "x": "「お互い、ムーンサルトをやりすぎたなって\n言い合ったのをよう覚えてるよ」"}, {"t": 295.21666666666664, "x": "この試合は、その年のプロレス大賞の\nベストバウトに選ばれました。"}, {"t": 299.51666666666665, "x": "2013年、武藤は全日本プロレスを離れ、\n新団体WRESTLE-1を旗揚げします。"}, {"t": 306.18333333333334, "x": "イメージ映像"}, {"t": 306.18333333333334, "x": "膝の状態は、ここからさらに\n悪くなっていきました。"}, {"t": 309.78333333333336, "x": "イメージ映像"}, {"t": 309.78333333333336, "x": "「W-1のころにはヒザが\nどんどんしんどくなっていってね。"}, {"t": 313.25, "x": "たまに出る試合でもギリギリの状態でやっていた」"}, {"t": 316.2, "x": "2015年3月の記事には、\n試合以外で膝の負担をできるだけ減らすため、"}, {"t": 321.4, "x": "イメージ映像"}, {"t": 321.4, "x": "移動や普段の生活では車椅子を\n使うこともある、と書かれています。"}, {"t": 326.4166666666667, "x": "このとき武藤は52歳。"}, {"t": 328.25, "x": "それでも、同じ記事でこう答えています。"}, {"t": 331.1666666666667, "x": "「まだ、さらさら引退する気はないすね」"}, {"t": 333.96666666666664, "x": "イメージ映像"}, {"t": 333.96666666666664, "x": "人工関節にするという選択肢は、\n以前からありました。"}, {"t": 338.06666666666666, "x": "ただ、それを選べばプロレスは続けられない。"}, {"t": 341.1166666666667, "x": "武藤はずっとそう言われてきました。"}, {"t": 343.26666666666665, "x": "イメージ映像"}, {"t": 343.26666666666665, "x": "2018年の会見でも、こう明かしています。"}, {"t": 346.8833333333333, "x": "イメージ映像"}, {"t": 346.8833333333333, "x": "「今まで見てもらっていた他の先生は全員が、\nプロレス復帰はダメと言っていた。"}, {"t": 352.1, "x": "小橋なんかも人工関節で\n試合はできないって派だった」"}, {"t": 355.68333333333334, "x": "流れが変わったのは2017年の秋です。"}, {"t": 358.6166666666667, "x": "ドラマで共演した元K-1選手の紹介で、\n武藤は1人の整形外科医に出会います。"}, {"t": 364.43333333333334, "x": "イメージ映像"}, {"t": 364.43333333333334, "x": "その医師が口にしたのが、この言葉でした。"}, {"t": 367.45, "x": "「プロレス、できると思いますよ」武藤はこれを\n聞いて、即、手術を決めたと話しています。"}, {"t": 374.2, "x": "イメージ映像"}, {"t": 374.2, "x": "2019年のラジオ番組では、\nそのときのことをこう振り返っています。"}, {"t": 379.2, "x": "「人工関節にしたら、もう\nプロレスはできませんよということを言われてて。"}, {"t": 383.9, "x": "イメージ映像"}, {"t": 383.9, "x": "で、その先生と出会って初めて、人工関節しても\nプロレスやっていいよって言ってくれたんすよ」"}, {"t": 390.1666666666667, "x": "ただし条件が1つありました。"}, {"t": 392.05, "x": "「人工関節にしたら試合はいいけど、\nムーンサルトはダメ」"}, {"t": 396.15, "x": "2018年2月19日、\n武藤は会見を開き、3月末に両膝を"}, {"t": 401.93333333333334, "x": "イメージ映像"}, {"t": 401.93333333333334, "x": "人工関節にする手術を受けると発表します。"}, {"t": 405.03333333333336, "x": "武藤はこれを「プロレス生活に\nおける一大決心」と呼びました。"}, {"t": 408.9, "x": "イメージ映像"}, {"t": 408.9, "x": "東京スポーツは、近年は歩くことすら\nままならないほど日常生活に"}, {"t": 413.6333333333333, "x": "イメージ映像"}, {"t": 413.6333333333333, "x": "支障が出ていたと伝え、手術の\n結果次第では現役を続けられなくなる"}, {"t": 418.3333333333333, "x": "おそれもあると報じています。"}, {"t": 419.96666666666664, "x": "そして冒頭の3月14日、\n後楽園ホールで最後のムーンサルトを見せ、"}, {"t": 425.3, "x": "3月30日に手術を受けました。"}, {"t": 428.06666666666666, "x": "手術を終えた武藤のコメントです。"}, {"t": 430.3833333333333, "x": "「今後は1日も早くリングに\n戻れるようにリハビリに励む次第です」"}, {"t": 434.5, "x": "イメージ映像"}, {"t": 434.5, "x": "しかし、回復は順調なだけではありませんでした。"}, {"t": 438.31666666666666, "x": "2019年のラジオ番組で武藤が\n明かしたところでは、手術から1か月ほどで"}, {"t": 443.6666666666667, "x": "思わずスクワットをしてしまい、\n膝の皿を真っ二つに割って骨折しています。"}, {"t": 448.5, "x": "リハビリには1年を要しました。"}, {"t": 450.68333333333334, "x": "イメージ映像"}, {"t": 450.68333333333334, "x": "人工関節そのものについても、\n武藤は同じ番組でこう話しています。"}, {"t": 455.65, "x": "「とにかく俺の\nサイズって日本人にはないらしいんすよ。"}, {"t": 458.98333333333335, "x": "イメージ映像"}, {"t": 458.98333333333335, "x": "で、アメリカ人にも俺よりでかい膝の\n人いなくて」それでも、"}, {"t": 463.1166666666667, "x": "イメージ映像"}, {"t": 463.1166666666667, "x": "武藤の感想ははっきりしていました。"}, {"t": 465.73333333333335, "x": "「結果、人工関節やってよかったなって思って」"}, {"t": 469.4, "x": "2019年6月26日、後楽園ホール。"}, {"t": 473.48333333333335, "x": "武藤は1年3か月ぶりにリングへ戻ります。"}, {"t": 476.43333333333334, "x": "この日は、長州力の引退試合でした。"}, {"t": 479.46666666666664, "x": "イメージ映像"}, {"t": 479.46666666666664, "x": "6人タッグのメインイベントで、\n武藤はシャイニング・ウィザードで"}, {"t": 483.26666666666665, "x": "長州から勝利を奪います。"}, {"t": 485.03333333333336, "x": "イメージ映像"}, {"t": 485.03333333333336, "x": "試合後の言葉です。"}, {"t": 486.56666666666666, "x": "「あの人は今終わったけど、\n俺は今からスタートだからな」さらに、"}, {"t": 490.56666666666666, "x": "イメージ映像"}, {"t": 490.56666666666666, "x": "こうも話しています。"}, {"t": 492.2, "x": "「生涯通じて伸びしろを\n埋めていく作業をしますよ」"}, {"t": 495.3833333333333, "x": "2021年2月12日、日本武道館。"}, {"t": 499.1333333333333, "x": "プロレスリング・ノアの大会で、\n58歳の武藤は王者の潮崎豪を破り、"}, {"t": 504.3666666666667, "x": "イメージ映像"}, {"t": 504.3666666666667, "x": "GHCヘビー級王座を奪取します。"}, {"t": 507.45, "x": "58歳1か月での戴冠は、それまでの\n最年長記録である47歳10か月を"}, {"t": 513.65, "x": "10年以上更新するものでした。"}, {"t": 515.7833333333333, "x": "イメージ映像"}, {"t": 515.7833333333333, "x": "新日本のIWGP、全日本の三冠、ノアのGHC。"}, {"t": 521.3333333333334, "x": "イメージ映像"}, {"t": 521.3333333333334, "x": "3つのヘビー級王座を\nすべて獲ったのは、史上3人目です。"}, {"t": 525.5666666666667, "x": "決まり手は、フランケンシュタイナーでした。"}, {"t": 528.3166666666667, "x": "イメージ映像"}, {"t": 528.3166666666667, "x": "翌日の東京スポーツで、\n武藤はこう言い切っています。"}, {"t": 532.2, "x": "「最近は50歳を過ぎたら\n引退させられる流れがあるじゃん。"}, {"t": 536.0833333333334, "x": "うば捨て山みてえだ。"}, {"t": 537.4333333333333, "x": "でも、そんなのクソくらえだろ。"}, {"t": 539.6666666666666, "x": "レスラーの価値を決めるのは年齢じゃない」"}, {"t": 542.0833333333334, "x": "そして2021年6月6日、さいたま\nスーパーアリーナ。"}, {"t": 546.45, "x": "丸藤正道とのGHC戦で、武藤はコーナーを\n駆け上がり、ムーンサルトプレスを放ちます。"}, {"t": 553.2166666666667, "x": "医師から止められていた技でした。"}, {"t": 555.25, "x": "イメージ映像"}, {"t": 555.25, "x": "この大会は4つの団体が集まる合同興行でした。"}, {"t": 558.8666666666667, "x": "関係者を通じて伝えられた武藤の言葉です。"}, {"t": 561.8833333333333, "x": "「合同興行である以上、\n必ず試合内容を比べられる。"}, {"t": 566.1, "x": "イメージ映像"}, {"t": 566.1, "x": "俺は、やっぱりノアの試合が一番だったと\n思ってもらえる試合をしたかった」"}, {"t": 570.95, "x": "両膝を強く打ったために\nフォールが遅れ、カウントは2。"}, {"t": 574.75, "x": "武藤はこの試合に敗れ、王座を失いました。"}, {"t": 578.35, "x": "イメージ映像"}, {"t": 578.35, "x": "後に武藤はこう認めています。"}, {"t": 580.4666666666667, "x": "「ウソをついたという罪悪感はあったよ。"}, {"t": 582.9, "x": "ファンだけじゃなく医者や女房にも\n黙ってやっちゃったからさ」なぜ飛んだのか。"}, {"t": 587.15, "x": "「勝つのに必要だったからだ。"}, {"t": 588.9, "x": "あとはチャンピオン像としての美しさだよ」\n1か月後、7月9日付の東京スポーツで、"}, {"t": 594.85, "x": "イメージ映像"}, {"t": 594.85, "x": "武藤はムーンサルトの永久封印を口にしました。"}, {"t": 598.2166666666667, "x": "「もう、やらねえよ。"}, {"t": 600.1833333333333, "x": "あれで最後だ」「もし運が悪かったら大腿骨がボキッと\n折れて、一生歩けなくなっていたかもしれねえ」"}, {"t": 606.55, "x": "イメージ映像"}, {"t": 606.55, "x": "終わりを決めたのは、膝ではなく股関節でした。"}, {"t": 609.8333333333334, "x": "2022年1月8日の試合を最後に欠場し、\n2月8日の会見で左股関節唇損傷を発表します。"}, {"t": 617.7666666666667, "x": "イメージ映像"}, {"t": 617.7666666666667, "x": "武藤は後にこう語っています。"}, {"t": 619.85, "x": "「両股関節に炎症が起きていたんだ。"}, {"t": 622.2833333333333, "x": "イメージ映像"}, {"t": 622.2833333333333, "x": "これは治しようがなかった」「股関節の\n人工関節はヒザに比べてジョイントが"}, {"t": 626.8166666666667, "x": "浅いから、すぐ外れちゃうんだって。"}, {"t": 629.2833333333333, "x": "だから手術したらプロレスは\n完璧にできなくなる」同じ年の4月10日には、"}, {"t": 633.7333333333333, "x": "イメージ映像"}, {"t": 633.7333333333333, "x": "ゼロワンの両国大会で、ある選手が\n頸髄損傷の重傷を負う事故も起きていました。"}, {"t": 639.8, "x": "「俺自身、だんだん年を取って\nガタがきているから、こういうことが自分に"}, {"t": 644.8, "x": "起きる可能性もあるだろうって思ったら\n怖くなっちまった」5月21日に"}, {"t": 649.1166666666667, "x": "イメージ映像"}, {"t": 649.1166666666667, "x": "復帰したものの、攻めている最中に痛みが\n出たことで、完全に決断したといいます。"}, {"t": 654.8666666666667, "x": "2022年6月12日、さいたま\nスーパーアリーナ。"}, {"t": 659.1833333333333, "x": "武藤はリング上で引退を発表しました。"}, {"t": 661.9333333333333, "x": "イメージ映像"}, {"t": 661.9333333333333, "x": "「かつて、プロレスとはゴールのないマラソンと\n言った自分ですが、ゴールすることに決めました。"}, {"t": 667.8166666666667, "x": "イメージ映像"}, {"t": 667.8166666666667, "x": "来年の春に引退します」\n「本当はプロレスやりたいよ。"}, {"t": 671.25, "x": "続けていきたい。"}, {"t": 672.3833333333333, "x": "ドクターストップというか、断腸の思い」"}, {"t": 675.25, "x": "引退試合を1か月後に\n控えた2023年1月22日、横浜アリーナの"}, {"t": 681.2, "x": "イメージ映像"}, {"t": 681.2, "x": "試合で、武藤は両脚のハムストリングを\n肉離れし、全治6週間と診断されます。"}, {"t": 687.4166666666666, "x": "それでも延期はしませんでした。"}, {"t": 689.4333333333333, "x": "2023年2月21日、東京ドーム。"}, {"t": 693.3833333333333, "x": "観衆は3万96人。"}, {"t": 695.5333333333333, "x": "イメージ映像"}, {"t": 695.5333333333333, "x": "試合の終盤、武藤はコーナーに上り、\nムーンサルトの体勢に入りかけます。"}, {"t": 701.3166666666667, "x": "しかし飛ぶことはなく、コーナーを\n降りて悔しそうにエプロンを叩きました。"}, {"t": 705.95, "x": "イメージ映像"}, {"t": 705.95, "x": "28分58秒、武藤は敗れます。"}, {"t": 709.4166666666666, "x": "そのあと、放送席にいた同期の\n蝶野正洋を自らリングに呼び込み、"}, {"t": 714.15, "x": "1分37秒の最後の試合を戦いました。"}, {"t": 717.7333333333333, "x": "「39年間、続けてきたプロレスを\n今日で引退しますが、武藤敬司の"}, {"t": 723.05, "x": "プロレス人生は最高に幸せでした」"}, {"t": 725.5833333333334, "x": "イメージ映像"}, {"t": 725.5833333333334, "x": "ここからは、残された言葉をもとに考えてみます。"}, {"t": 729.0833333333334, "x": "イメージ映像"}, {"t": 729.0833333333334, "x": "武藤が辞めなかった理由を、\n本人は一言では語っていません。"}, {"t": 733.3833333333333, "x": "ただ、手がかりになる言葉は\nいくつも残っています。"}, {"t": 736.8166666666667, "x": "イメージ映像"}, {"t": 736.8166666666667, "x": "「6～7割の力でお客を手玉にとれるような\nレスラーになりたくて、今までやってきた」"}, {"t": 742.3333333333334, "x": "ムーンサルトを封印するときの言葉です。"}, {"t": 744.7333333333333, "x": "イメージ映像"}, {"t": 744.7333333333333, "x": "膝が壊れてからの武藤は、飛べないなら\n飛べないなりに、別の形で客を沸かせる方法を"}, {"t": 750.8666666666667, "x": "イメージ映像"}, {"t": 750.8666666666667, "x": "探し続けていたのではないでしょうか。"}, {"t": 753.0, "x": "58歳でのGHC奪取は、その答えの\n1つだったと言えるかもしれません。"}, {"t": 758.3333333333334, "x": "イメージ映像"}, {"t": 758.3333333333334, "x": "一方で、王座戦では医師との\n約束を破ってまで飛びました。"}, {"t": 762.6833333333333, "x": "「チャンピオン像としての\n美しさ」という言葉からは、"}, {"t": 765.6166666666667, "x": "イメージ映像"}, {"t": 765.6166666666667, "x": "膝の痛みよりも、リングの上でどう見えるかを\n優先してしまうレスラーの姿が浮かびます。"}, {"t": 771.65, "x": "イメージ映像"}, {"t": 771.65, "x": "そして最後に引退を\n決めさせたのは、気持ちではなく"}, {"t": 775.1166666666667, "x": "「手術したらプロレスは\n完璧にできなくなる」という医学的な壁でした。"}, {"t": 779.0833333333334, "x": "イメージ映像"}, {"t": 779.0833333333334, "x": "膝の人工関節は、医師の一言で\n「続けるための手術」になりました。"}, {"t": 783.85, "x": "イメージ映像"}, {"t": 783.85, "x": "股関節には、その道が残されていなかった。"}, {"t": 787.1333333333333, "x": "辞めなかったのではなく、辞める理由が\n見つかるまで、辞めることを選ばなかった。"}, {"t": 792.6333333333333, "x": "24歳で膝にメスを入れてから、\n60歳でリングを降りるまでの35年余り。"}, {"t": 798.3666666666667, "x": "それが武藤敬司という男の\n歩みだったのではないでしょうか。"}, {"t": 802.0333333333333, "x": "引退から3か月後のインタビューで、\n武藤は膝が人工関節で股関節も悪い自分には、"}, {"t": 808.15, "x": "イメージ映像"}, {"t": 808.15, "x": "散歩もなかなかしんどいと\n話しながら、こう続けています。"}, {"t": 812.2, "x": "「引退してもトレーニングやってんだよ」"}, {"t": 814.5333333333333, "x": "壊れた膝をだましだまし、\nそれでも39年間リングに"}, {"t": 818.7166666666667, "x": "立ち続けた男の記録は、ここまでです。"}, {"t": 821.65, "x": "イメージ映像"}, {"t": 821.65, "x": "ご覧いただいた皆様、\nどうもありがとうございました。"}, {"t": 825.2333333333333, "x": "続きが気になった方は、チャンネル登録や\n高評価で応援していただけると励みになります。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};

  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
