<script>
const D={"name": "大仁田厚", "file": "244_編集用", "dur": 871.6833125, "segs": [], "subs": [{"t": 0.0, "x": "1990年8月4日、東京・汐留。"}, {"t": 4.1, "x": "かつて貨物駅があった場所に、レールシティ汐留と\n呼ばれる空き地が広がっていました。"}, {"t": 9.383333333333333, "x": "その真ん中に、1つの\n特設リングが組まれています。"}, {"t": 13.033333333333333, "x": "ただし、このリングには、\nロープが1本も張られていませんでした。"}, {"t": 17.733333333333334, "x": "ロープの代わりに四方を\n囲んでいたのは、有刺鉄線です。"}, {"t": 21.733333333333334, "x": "その有刺鉄線には電流が流され、小型の\n爆弾が120個、取り付けられていました。"}, {"t": 28.333333333333332, "x": "客席を埋めたのは4520人。"}, {"t": 31.116666666666667, "x": "試合が始まってしばらくすると、\n選手の体が鉄線に触れるたびに、"}, {"t": 35.7, "x": "リングの周りで爆発が起きました。"}, {"t": 38.15, "x": "最初は驚いていた観客が、やがて\n「もうやめてくれ」と"}, {"t": 41.78333333333333, "x": "泣き出したと伝えられています。"}, {"t": 43.483333333333334, "x": "この試合を仕掛けたのは、旗揚げから\n1年も経っていない、小さな団体でした。"}, {"t": 48.96666666666667, "x": "では、なぜその団体は、\nロープの代わりに爆弾を巻いたリングを"}, {"t": 53.61666666666667, "x": "作らなければならなかったのでしょうか。"}, {"t": 55.75, "x": "今回は、大仁田厚という1人のレスラーと、\n電流爆破デスマッチが生まれるまでの道のりを、"}, {"t": 62.333333333333336, "x": "確認できた日付と数字をもとに辿っていきます。"}, {"t": 65.73333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 68.21666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 73.8, "x": "大仁田厚は、1957年10月25日、\n長崎県長崎市に生まれました。"}, {"t": 80.91666666666667, "x": "1973年、ジャイアント馬場に\n憧れて全日本プロレスに入門します。"}, {"t": 86.95, "x": "団体が旗揚げした翌年のことで、\n大仁田は「新弟子第一号」と呼ばれました。"}, {"t": 92.16666666666667, "x": "入門したころの体重は50キロ台で、\n90キロにならなければ解雇という状況だったと"}, {"t": 98.11666666666666, "x": "伝えられています。"}, {"t": 99.16666666666667, "x": "デビューは1974年4月14日、後楽園ホール。"}, {"t": 104.03333333333333, "x": "その後は馬場の付き人を務めながら、\nリングに上がり続けます。"}, {"t": 108.18333333333334, "x": "馬場はこの付き人をかわいがり、\n養子に迎えることまで本気で"}, {"t": 112.31666666666666, "x": "考えていたと伝えられています。"}, {"t": 114.21666666666667, "x": "1980年、大仁田は海外修業に出発しました。"}, {"t": 118.9, "x": "西ドイツ、プエルトリコを経て\nアメリカ本土へ渡り、1981年3月からは"}, {"t": 125.25, "x": "テネシー州メンフィスの団体に、\nミスター・オーニタの名前で参戦しています。"}, {"t": 130.06666666666666, "x": "プエルトリコ行きを取り持ったのは、\nテリー・ファンクでした。"}, {"t": 133.46666666666667, "x": "そして1982年3月7日、\nノースカロライナ州シャーロット。"}, {"t": 138.55, "x": "セコンドにテリー・ファンクがつく中、\n大仁田は敵地で、"}, {"t": 141.98333333333332, "x": "NWAインターナショナル・ジュニアヘビー級王座を\n奪いました。"}, {"t": 146.26666666666668, "x": "試合後、大仁田はこう語っています。"}, {"t": 149.08333333333334, "x": "もう何を言っていいか。"}, {"t": 150.53333333333333, "x": "プロレスをやっていて本当によかった。"}, {"t": 152.88333333333333, "x": "帰国前に回ったメキシコでは王座を一度\n奪われましたが、すぐに取り返しています。"}, {"t": 158.36666666666667, "x": "このベルトを持って凱旋帰国した大仁田は、\n全日本のジュニア戦線の"}, {"t": 163.03333333333333, "x": "王者として防衛戦を重ねていきます。"}, {"t": 165.4, "x": "荒々しく感情をむき出しにする戦い方から、\nついた呼び名は「炎の稲妻」でした。"}, {"t": 170.86666666666667, "x": "ところが、1983年4月20日。"}, {"t": 174.41666666666666, "x": "東京都体育館での防衛戦に勝った直後、\nリングから飛び降りた大仁田は、"}, {"t": 179.51666666666668, "x": "着地の際に足を滑らせます。"}, {"t": 181.86666666666667, "x": "全体重がかかった状態で膝を床に打ちつけ、\n診断は左膝蓋骨の粉砕骨折でした。"}, {"t": 188.4, "x": "医師からは、再起不能と告げられています。"}, {"t": 191.41666666666666, "x": "一度は復帰したものの、\n以前のような試合はできませんでした。"}, {"t": 195.68333333333334, "x": "1984年12月2日、引退を賭けた王座挑戦に\n敗れ、翌1985年1月3日、"}, {"t": 204.26666666666668, "x": "後楽園ホールで引退式が行われます。"}, {"t": 207.46666666666667, "x": "このとき大仁田は27歳でした。"}, {"t": 209.85, "x": "引退式のあと、馬場の妻の元子は大仁田を\n抱きしめて涙を流したと伝えられています。"}, {"t": 215.76666666666668, "x": "引退後の大仁田は、\nタレントとしてテレビに出演します。"}, {"t": 219.71666666666667, "x": "しかし長くは続かず、その後に始めた事業も、\n一時はうまくいったものの行き詰まり、"}, {"t": 225.7, "x": "借金を抱えたと伝えられています。"}, {"t": 228.58333333333334, "x": "土木作業員や配達員の仕事を経て、\nたどり着いたのが、"}, {"t": 232.75, "x": "女子プロレス団体のコーチの職でした。"}, {"t": 235.41666666666666, "x": "そして1988年12月3日、\nその団体の後楽園ホール大会で、"}, {"t": 241.43333333333334, "x": "大仁田は現役に復帰します。"}, {"t": 243.8, "x": "最初の引退から、3年11か月が経っていました。"}, {"t": 247.7, "x": "同じころ、大仁田は旗揚げしたばかりの\n別の団体の会場を訪ね、"}, {"t": 252.2, "x": "顔を見せて入ろうとしました。"}, {"t": 254.43333333333334, "x": "ところが受付で「チケットを持っていますか」と\n聞かれ、一般のファンと同じ扱いで"}, {"t": 259.3, "x": "入場を断られたという話が残っています。"}, {"t": 262.35, "x": "ただ、復帰した大仁田には、\n上がるリングがありませんでした。"}, {"t": 266.8666666666667, "x": "転機になったのは、1989年7月2日、\n後楽園ホールで開かれた空手の"}, {"t": 273.43333333333334, "x": "イベント「格闘技の祭典」です。"}, {"t": 275.25, "x": "大仁田はここで、空手家の\n青柳政司と対戦しました。"}, {"t": 279.18333333333334, "x": "青柳は後に、こう振り返っています。"}, {"t": 282.1166666666667, "x": "空手のお客さんばかりで、\n9割以上はボクの応援。"}, {"t": 286.01666666666665, "x": "あれは壮絶なケンカ。"}, {"t": 287.5833333333333, "x": "この試合をきっかけに、大仁田は\n自分の団体を作ることを決めます。"}, {"t": 292.25, "x": "1989年7月28日、\n東京・赤坂の全日空ホテル。"}, {"t": 297.96666666666664, "x": "大仁田は、\n新団体フロンティア・マーシャルアーツ・レスリング、"}, {"t": 301.71666666666664, "x": "略してFMWの設立を発表しました。"}, {"t": 305.3, "x": "設立の資金は、手元にあった全財産の\n5万円だったとされています。"}, {"t": 310.31666666666666, "x": "会見で大仁田は、\n声を詰まらせながらこう話しました。"}, {"t": 314.23333333333335, "x": "こんなにマスコミのみなさんが\n集まってくれるとは。"}, {"t": 317.05, "x": "生きていく上で、プロレスはオレのすべてです。"}, {"t": 320.18333333333334, "x": "ところがこの会見の最中に青柳が乗り込み、\n大仁田は救急車で運ばれることになります。"}, {"t": 326.2, "x": "1989年10月6日、\n名古屋の露橋スポーツセンターで、"}, {"t": 331.3833333333333, "x": "FMWは最初の興行を開きました。"}, {"t": 334.76666666666665, "x": "メインは大仁田対青柳の再戦です。"}, {"t": 337.4, "x": "結果は、大仁田のTKO負け。"}, {"t": 340.2, "x": "団体の旗揚げの日に、\n看板の選手が負けたのです。"}, {"t": 344.01666666666665, "x": "大仁田は試合後、地面を這いながら叫んでいます。"}, {"t": 347.6333333333333, "x": "死んでもいいから、もう1回だけ\nプロレスをやらせてください。"}, {"t": 351.75, "x": "4日後の10月10日には、\n後楽園ホールで旗揚げ戦が行われました。"}, {"t": 356.9, "x": "旗揚げ直後のFMWには、\nお金がありませんでした。"}, {"t": 361.06666666666666, "x": "当時、FMWは金網で囲んだリングで\n戦うデスマッチを計画しています。"}, {"t": 366.81666666666666, "x": "しかし金網のケージは高価で、\n作ることができませんでした。"}, {"t": 370.93333333333334, "x": "代わりに選んだのが、\n安く用意できる有刺鉄線です。"}, {"t": 374.8833333333333, "x": "1989年12月10日、後楽園ホール。"}, {"t": 379.23333333333335, "x": "大仁田と、ターザン後藤が\n組んだタッグで、日本で初めての"}, {"t": 383.56666666666666, "x": "有刺鉄線デスマッチが行われました。"}, {"t": 386.0, "x": "使われたのは本物の有刺鉄線で、\n大仁田はこの試合で腕に深い傷を負っています。"}, {"t": 391.8333333333333, "x": "ターザン後藤は、1963年8月16日、\n静岡県島田市の生まれ。"}, {"t": 398.31666666666666, "x": "大相撲の力士を経て全日本プロレスに\n入った選手で、当時は"}, {"t": 402.68333333333334, "x": "アメリカで試合をしていました。"}, {"t": 404.4166666666667, "x": "FMWを立ち上げた大仁田が電話をかけると、\n後藤は帰国して参加を決めます。"}, {"t": 410.18333333333334, "x": "大仁田は成田空港まで、\n後藤を迎えに行きました。"}, {"t": 414.0, "x": "年が明けた1990年、\nFMWはさらに苦しい状況に置かれます。"}, {"t": 419.9, "x": "この年の前半、大仁田と抗争していた2人の\n選手が、1人は新日本プロレスへ、もう1人は、"}, {"t": 427.3333333333333, "x": "大手の眼鏡チェーンが\n資金を出して旗揚げした新団体SWSへと"}, {"t": 432.2, "x": "移っていきました。"}, {"t": 433.23333333333335, "x": "1月7日に後楽園ホールで開いた、\nプロレスやキックボクシング、テコンドー、"}, {"t": 438.8333333333333, "x": "サンボの選手が競うトーナメントでは、\n準決勝で後藤が大仁田を破る場面もありました。"}, {"t": 445.05, "x": "しかし資金も、選手の数も、\nメジャー団体には遠く及びません。"}, {"t": 450.01666666666665, "x": "FMWが選んだのは、「何でもあり」を\n合言葉に、アイデアで勝負する道でした。"}, {"t": 455.98333333333335, "x": "1990年6月9日、神奈川県の海老名大会で、\n大仁田と後藤は仲間割れをします。"}, {"t": 463.26666666666665, "x": "その決着戦として6月24日、\n東京・夢の島の体育館の剣道場で、"}, {"t": 469.18333333333334, "x": "観客を1人も入れない試合が行われました。"}, {"t": 472.35, "x": "会場の外には数十人の\nファンが集まっていましたが、"}, {"t": 475.73333333333335, "x": "中には入れてもらえませんでした。"}, {"t": 477.98333333333335, "x": "結果は33分49秒、両者KOの引き分けです。"}, {"t": 482.7, "x": "この試合について、大仁田は後に\n「もう時効だよ」と前置きして、"}, {"t": 486.96666666666664, "x": "こう明かしています。"}, {"t": 488.45, "x": "正直に言えば、後藤との一騎打ちを\n盛り上げるための、1つの仕掛けだよな。"}, {"t": 493.8, "x": "見たくても見られない状況を作り、\nそれを新聞や専門誌で報じてもらったほうが、"}, {"t": 499.3, "x": "想像をかき立てると考えたといいます。"}, {"t": 501.98333333333335, "x": "あの頃のFMWで、ビッグショーで戦う相手は、\nターザン後藤しかいなかったとも語っています。"}, {"t": 508.8, "x": "では、その一騎打ちで何をするのか。"}, {"t": 511.6, "x": "大仁田によれば、リングの周りに\n有刺鉄線を張る試合は、アメリカ時代に"}, {"t": 516.9, "x": "テネシーで見たことがありました。"}, {"t": 518.6333333333333, "x": "そこにもう1つ加わったのが、\n映画のゴジラの場面です。"}, {"t": 522.6833333333333, "x": "ゴジラが高圧電流に当たって、火花が散る。"}, {"t": 526.0, "x": "あれをプロレスでできないか。"}, {"t": 527.6666666666666, "x": "有刺鉄線に電流を流して、\nそこに爆弾をつけたら、とひらめいたと、"}, {"t": 532.8833333333333, "x": "大仁田は語っています。"}, {"t": 534.65, "x": "こうして迎えたのが、\n冒頭の1990年8月4日です。"}, {"t": 539.4333333333333, "x": "大仁田の話では、試合前にリングの有刺鉄線に\n200ボルトの電流を流し、火薬の入った"}, {"t": 546.3166666666667, "x": "カプセルを120個ほど取り付けたといいます。"}, {"t": 549.0166666666667, "x": "一つ一つは、爆竹の10倍の\n威力だったと伝えられています。"}, {"t": 553.3, "x": "試合は11分14秒で決着しました。"}, {"t": 556.3666666666667, "x": "勝ったのは大仁田でしたが、後藤は\nお尻から脚の後ろにかけてやけどを負い、"}, {"t": 561.2, "x": "皮膚は赤紫色に変わっていました。"}, {"t": 563.9666666666667, "x": "試合後、後藤はこう話しています。"}, {"t": 566.7833333333333, "x": "爆発よりも、電流がビリッとくる。"}, {"t": 569.65, "x": "体が火で燃やされたようだった。"}, {"t": 571.6666666666666, "x": "勝負には負けたが、試合には勝っていた。"}, {"t": 574.7, "x": "もう一度やるかと聞かれると、\n後藤はこう答えました。"}, {"t": 578.3333333333334, "x": "もっとすごいのがあるなら、\nオレはプロレスラーだから、やりますよ。"}, {"t": 582.8666666666667, "x": "いつも死ぬ気でやっていますから。"}, {"t": 584.7833333333333, "x": "大仁田も、こう振り返っています。怖かった。"}, {"t": 588.2333333333333, "x": "爆発した瞬間は風が来るような感じで、\n一瞬動くのを忘れてしまった。"}, {"t": 593.55, "x": "邪道と言われようと、自分たちが\n信じた道を貫けば何かがファンに伝わる。"}, {"t": 598.7166666666667, "x": "その確信を得た試合だった、とも語っています。"}, {"t": 602.3166666666667, "x": "この試合を境に、FMWを\n取り巻く状況は大きく変わります。"}, {"t": 607.3166666666667, "x": "東京スポーツ新聞社が選ぶ1990年の\nプロレス大賞で、この試合は年間最高試合に"}, {"t": 614.2, "x": "選ばれ、大仁田はMVPを受賞しました。"}, {"t": 617.35, "x": "新日本プロレスや全日本プロレスの\n選手を抑えての受賞です。"}, {"t": 621.5333333333333, "x": "FMWの名前はテレビでも\n取り上げられるようになり、"}, {"t": 624.8666666666667, "x": "全国に広まっていきました。"}, {"t": 627.0666666666667, "x": "1991年9月23日、FMWは\n初めて川崎球場で大会を開きます。"}, {"t": 634.3833333333333, "x": "同じ日、約10キロ離れた横浜アリーナでは\n新日本プロレスが大会を開き、"}, {"t": 639.9833333333333, "x": "1万8千人を集めていました。"}, {"t": 642.5666666666667, "x": "インディー団体の球場大会は\n時期尚早だと言われましたが、"}, {"t": 646.2666666666667, "x": "川崎球場には約3万3千人が入っています。"}, {"t": 650.25, "x": "メインは再び大仁田対後藤で、\n今度は金網も加えた電流爆破デスマッチでした。"}, {"t": 656.0666666666667, "x": "取り付けられた小型の爆弾は、\n160個に増えています。"}, {"t": 660.2333333333333, "x": "試合時間は16分1秒。"}, {"t": 662.5, "x": "後藤は頸椎を痛め、脳震盪で入院しています。"}, {"t": 666.55, "x": "それでも大仁田は、後藤についてこう話しました。"}, {"t": 669.9666666666667, "x": "オレは後藤が好きなんじゃ。"}, {"t": 671.5833333333334, "x": "誰が何と言おうと家族なんじゃい。"}, {"t": 673.6333333333333, "x": "翌1992年5月6日には、兵庫県三田市の\n駐車場に作った特設会場で、日本で初めての"}, {"t": 681.55, "x": "ファイヤーデスマッチも行われました。"}, {"t": 683.6333333333333, "x": "このときは炎の勢いが予想より強く、\nザ・シークが大やけどを負って、"}, {"t": 688.5, "x": "試合は不成立に終わっています。"}, {"t": 690.8666666666667, "x": "1992年9月19日には横浜スタジアム、"}, {"t": 694.6666666666666, "x": "1993年8月22日には西宮球場と、FMWは"}, {"t": 700.8666666666667, "x": "大きな会場へ次々に進出していきました。"}, {"t": 703.7166666666667, "x": "その後も大仁田は、\n電流爆破を看板に戦い続けました。"}, {"t": 708.05, "x": "1993年2月には九州での巡業中に倒れ、\n敗血症で一時は危篤の状態になります。"}, {"t": 715.5166666666667, "x": "それでも38日間の入院を経て、\n5月5日の川崎球場に出場しました。"}, {"t": 721.55, "x": "相手は、若いころにプエルトリコ行きを\n取り持ってくれた、テリー・ファンクです。"}, {"t": 726.65, "x": "試合形式は、電流爆破デスマッチでした。"}, {"t": 730.1166666666667, "x": "1994年5月5日、\n同じ川崎球場で天龍源一郎に敗れると、"}, {"t": 736.2833333333333, "x": "大仁田は1年後の引退を宣言します。"}, {"t": 739.25, "x": "このままデスマッチを続ければ本当に\n死んでしまう、と考えたことが理由でした。"}, {"t": 744.6333333333333, "x": "引退試合の相手には、\n当初ターザン後藤が決まっていました。"}, {"t": 748.7333333333333, "x": "ところが1995年4月23日、\n後藤は試合の約2週間前にFMWを退団します。"}, {"t": 756.55, "x": "1995年5月5日、川崎球場。"}, {"t": 760.75, "x": "大仁田は、名乗りを上げた弟子のハヤブサを\n相手に、2度目の引退試合を行います。"}, {"t": 766.5833333333334, "x": "観客は5万8250人と発表されました。"}, {"t": 770.2, "x": "試合後、大仁田はこう叫んでいます。"}, {"t": 773.0833333333334, "x": "FMWは絶対、潰れん。"}, {"t": 775.7666666666667, "x": "赤坂での設立会見から汐留の\n電流爆破まで、1年と7日。"}, {"t": 780.8, "x": "5万円で始まった団体が、6年後には球場に\n5万人を超える観客を集めていました。"}, {"t": 787.0666666666667, "x": "その始まりには、はっきりとした理由がありました。"}, {"t": 790.4666666666667, "x": "金網を作るお金がなかったから、\n有刺鉄線を使った。"}, {"t": 794.6, "x": "抗争相手がいなくなったから、\n仲間との一騎打ちに全てを賭けた。"}, {"t": 798.9666666666667, "x": "その一騎打ちを大きく見せるために、\n誰も見たことのない仕掛けが必要だった。"}, {"t": 804.2, "x": "金網の代わりの有刺鉄線、前哨戦の\n代わりの無観客試合、そして映画の"}, {"t": 810.05, "x": "ひと場面から生まれた爆破。"}, {"t": 811.65, "x": "どれも大きなお金をかけずに、\n観客の想像をふくらませるための"}, {"t": 816.0333333333333, "x": "工夫だったと見ることができます。"}, {"t": 817.8833333333333, "x": "電流爆破は、派手さを狙って生まれたというより、\n手元にあるもので戦うしかなかった団体が、"}, {"t": 824.2833333333333, "x": "たどり着いた答えだったのではないでしょうか。"}, {"t": 827.05, "x": "大仁田は後に、あの試合をこう表現しています。"}, {"t": 830.55, "x": "あれはオレたちが生きるための電流爆破だった。"}, {"t": 833.3666666666667, "x": "ターザン後藤は、2022年5月29日、\n58歳で亡くなりました。"}, {"t": 839.3833333333333, "x": "その翌日、大仁田はこう書き残しています。"}, {"t": 842.65, "x": "上手く行くかすぐつぶれるか分からない\nFMWを立ち上げて、すぐ電話をしたら"}, {"t": 847.7333333333333, "x": "アメリカから帰国してくれた。"}, {"t": 849.35, "x": "そんな後藤を迎えに成田まで行ったことが\n昨日のようでショックだ。"}, {"t": 853.1666666666666, "x": "金網を買う金も無いところから\n生まれた電流爆破は、いまもプロレス史に"}, {"t": 857.8166666666667, "x": "残る発明として語られています。"}, {"t": 859.8666666666667, "x": "最後まで聞いてくださった皆様に、\nお礼を申し上げます。"}, {"t": 863.9, "x": "大仁田厚とターザン後藤の電流爆破に\nついて、覚えていることがあればぜひ"}, {"t": 868.9666666666667, "x": "コメント欄で教えてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
