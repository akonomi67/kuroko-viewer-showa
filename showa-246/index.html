<script>
const D={"name": "鶴田五輪辞退", "file": "246_編集用", "dur": 824.3, "segs": [], "subs": [{"t": 0.0, "x": "1972年10月31日、\n東京・赤坂プリンスホテルの「桂の間」。"}, {"t": 6.0, "x": "1人の大学生が、記者たちの前に座っていました。"}, {"t": 9.733333333333333, "x": "隣には、ジャイアント馬場。"}, {"t": 12.016666666666667, "x": "さらに、日本アマチュア・レスリング協会の\n会長、八田一朗。"}, {"t": 16.783333333333335, "x": "中央大学レスリング部の監督も、\n同じ席に並んでいました。"}, {"t": 21.2, "x": "大学生の名前は、鶴田友美。21歳。"}, {"t": 24.95, "x": "この年、ミュンヘンオリンピックのマットに\n立った、レスリングの日本代表です。"}, {"t": 30.35, "x": "その席で、鶴田はこう挨拶しました。"}, {"t": 33.31666666666667, "x": "「プロレスは僕に最も適した就職だと思い、監督と\n相談の上、尊敬する馬場さんの会社を選びました」"}, {"t": 41.083333333333336, "x": "オリンピックの代表にまで\n上り詰めた選手が、なぜ次のオリンピックを"}, {"t": 45.85, "x": "目指さず、プロレスを選んだのでしょうか？"}, {"t": 48.6, "x": "そしてその決断は、いったい\nいつ下されていたのでしょうか？"}, {"t": 52.733333333333334, "x": "今回は、後のジャンボ鶴田が\nプロレスを選ぶまでの道のりを、"}, {"t": 56.9, "x": "具体的な日付と証言をもとに辿っていきます。"}, {"t": 60.2, "x": "最後までご覧いただければ幸いです。"}, {"t": 62.7, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 68.28333333333333, "x": "鶴田友美は、1951年3月25日、\n山梨県東山梨郡牧丘町に生まれました。"}, {"t": 76.21666666666667, "x": "現在の山梨市です。"}, {"t": 77.91666666666667, "x": "家は養蚕を営む農家で、鶴田は次男でした。"}, {"t": 81.55, "x": "最初に声をかけてきたのは、大相撲でした。"}, {"t": 84.85, "x": "中学2年の夏休み、鶴田は朝日山部屋から\nスカウトを受けて入門しています。"}, {"t": 90.45, "x": "新弟子検査にも合格しました。"}, {"t": 92.7, "x": "しかし、相撲部屋での生活は、\nその夏休みだけで終わります。"}, {"t": 97.56666666666666, "x": "鶴田の叔父は、幕内まで昇進した力士でした。"}, {"t": 101.13333333333334, "x": "その叔父とは違う部屋に入門したことが、\n親族の間で問題視されたと伝えられています。"}, {"t": 107.06666666666666, "x": "1966年4月、鶴田は\n山梨県立日川高校に入学します。"}, {"t": 112.86666666666666, "x": "身長は、この頃すでに\n190センチ近くありました。"}, {"t": 116.9, "x": "最初は野球部でしたが、のちに\nバスケットボール部へ移ります。"}, {"t": 121.15, "x": "家から高校までは、片道およそ11キロ。"}, {"t": 124.7, "x": "高低差は230メートルあります。"}, {"t": 127.3, "x": "行きは下りで1時間、帰りは上りで2時間。"}, {"t": 130.81666666666666, "x": "この道を、鶴田は3年間毎日通いました。"}, {"t": 134.31666666666666, "x": "バスケットボール部ではエースとして、\nインターハイに出場しています。"}, {"t": 138.71666666666667, "x": "ラグビー部からも勧誘を受け、3年生のときには\n県内の高校相撲大会で3位に入りました。"}, {"t": 145.26666666666668, "x": "1968年10月、鶴田が高校3年生の秋。"}, {"t": 150.0, "x": "同じ学年の高校生が、メキシコオリンピックの\nレスリング97キロ以上級の"}, {"t": 155.5, "x": "代表として出場しています。"}, {"t": 157.35, "x": "重量級のレスリングでは、\n高校生でもオリンピックに出られる。"}, {"t": 161.61666666666667, "x": "そういう時代でした。"}, {"t": 163.05, "x": "1969年4月、鶴田は\n中央大学法学部政治学科に入学します。"}, {"t": 169.3, "x": "大学でも、最初はバスケットボール部でした。"}, {"t": 172.53333333333333, "x": "当時の中大バスケットボール部は、\n1967年に全日本大学選手権で優勝、"}, {"t": 178.96666666666667, "x": "1968年に準優勝している強豪です。"}, {"t": 182.95, "x": "鶴田は1年生で全日本の候補に選ばれ、\n合宿にも参加しています。"}, {"t": 188.3, "x": "目標は、ミュンヘンオリンピックでした。"}, {"t": 191.15, "x": "ところが鶴田は、\nこのバスケットボールに見切りをつけます。"}, {"t": 194.88333333333333, "x": "バスケではプロの選手になれない。"}, {"t": 196.93333333333334, "x": "日本の実力では、予選に勝っても\nオリンピックの出場は叶わない。"}, {"t": 201.66666666666666, "x": "そう判断したと伝えられています。"}, {"t": 203.86666666666667, "x": "次に選んだのが、レスリングでした。"}, {"t": 206.5, "x": "ただし、中大レスリング部への入部は、\nすぐには認められていません。"}, {"t": 211.61666666666667, "x": "長く語られてきた理由は、「一つの\n事をやり通せない者には無理だ」と"}, {"t": 216.0, "x": "断られた、というものです。"}, {"t": 218.11666666666667, "x": "ところが、同じ1969年に入学し、\nレスリング部の主将を務めた同期は、"}, {"t": 224.51666666666668, "x": "別の事情を証言しています。"}, {"t": 226.78333333333333, "x": "「実際はちょっと違って、\nバスケットボール部が反対したんですね。"}, {"t": 231.15, "x": "バスケ経由で大学に入ってきたものだから、\n勝手に部を移ったらバスケ部の"}, {"t": 235.91666666666666, "x": "面子が潰れるじゃないですか」"}, {"t": 237.58333333333334, "x": "この同期によれば、入学からの2年間、\n大学は学園闘争のさなかにありました。"}, {"t": 243.96666666666667, "x": "大学の部に入れなかった鶴田が向かった先は、\n埼玉県朝霞の陸上自衛隊駐屯地にある、"}, {"t": 250.36666666666667, "x": "自衛隊体育学校でした。"}, {"t": 252.66666666666666, "x": "コーチは、東京、メキシコ、ミュンヘンと、\n3大会のオリンピックに出場したレスラーです。"}, {"t": 259.9, "x": "練習は1日6時間。"}, {"t": 261.73333333333335, "x": "さらに週3回、沼袋スポーツセンターで\nボディビルにも取り組みました。"}, {"t": 266.4166666666667, "x": "公式戦のデビューは、\n1970年11月の全日本選手権です。"}, {"t": 272.01666666666665, "x": "種目はフリースタイル100キロ級。"}, {"t": 274.31666666666666, "x": "所属は社会人扱いの「朝霞クラブ」でした。"}, {"t": 277.25, "x": "初戦の相手は、前年の優勝者です。"}, {"t": 280.46666666666664, "x": "鶴田は4分39秒、フォールで勝ちました。"}, {"t": 284.1, "x": "続く試合は2分17秒でフォール負け。"}, {"t": 286.8666666666667, "x": "それでも、最初の全国大会で3位に入っています。"}, {"t": 290.71666666666664, "x": "1971年6月、\n日大講堂で行われた全日本選手権。"}, {"t": 296.31666666666666, "x": "その直前、6月4日から6日の社会人選手権では、\nフリースタイル100キロ級で"}, {"t": 302.6333333333333, "x": "0対4の判定負けを喫していました。"}, {"t": 305.06666666666666, "x": "しかし、わずか2週間あまり後の\n全日本選手権で、鶴田はフリースタイルと"}, {"t": 310.9, "x": "グレコローマンスタイルの両方で、\n100キロ以上級を制しました。"}, {"t": 315.25, "x": "同じ年の8月から9月にかけては、ブルガリアの\nソフィアで行われた世界選手権に出場。"}, {"t": 321.46666666666664, "x": "両スタイルとも、2回戦で失格となっています。"}, {"t": 324.85, "x": "10月の和歌山国体では、\nグレコローマン100キロ以上級で優勝しました。"}, {"t": 330.03333333333336, "x": "そして1972年の全日本選手権でも、\nフリーとグレコの両方で優勝。"}, {"t": 336.0, "x": "2年連続の2冠です。"}, {"t": 337.75, "x": "練習を始めてから、わずか\n1年半足らずでの到達でした。"}, {"t": 342.0833333333333, "x": "バスケットボール部を辞めた大学生が、\n国内の重量級の頂点に立っていたのです。"}, {"t": 347.6666666666667, "x": "鶴田が中央大学レスリング部に正式に\n入部したのは、大学4年になってからです。"}, {"t": 353.53333333333336, "x": "ここに、この話の核心があります。"}, {"t": 356.3333333333333, "x": "鶴田は、バスケットボールを辞めた時点で、\nすでにその先の道筋を決めていた。"}, {"t": 361.8833333333333, "x": "そう証言する人が、複数いるのです。"}, {"t": 364.9166666666667, "x": "先ほどの同期の主将は、こう振り返っています。"}, {"t": 368.3833333333333, "x": "「鶴田は\"レスリングでオリンピックに出て、\n箔をつけてプロレスラーになるんだ\"ってことを"}, {"t": 374.43333333333334, "x": "言っていましたね」"}, {"t": 375.35, "x": "この主将は、鶴田が重量級の選手の\n少ないグレコローマンを選んだのも、"}, {"t": 380.23333333333335, "x": "オリンピック代表になるための\n計算だったと指摘しています。"}, {"t": 384.1166666666667, "x": "馬場の秘蔵っ子と呼ばれた先輩レスラー、\n佐藤昭雄も、鶴田本人から"}, {"t": 389.31666666666666, "x": "次の言葉を聞いていました。"}, {"t": 390.96666666666664, "x": "「将来、プロレスをやるために\nバスケットボールに見切りをつけて"}, {"t": 394.8666666666667, "x": "レスリングに転向したんですけど、幸いにも\nオリンピックに行けたから箔が付きました」"}, {"t": 400.2, "x": "さらに、ミュンヘンオリンピックの\nフリースタイル代表だった選手も証言しています。"}, {"t": 405.51666666666665, "x": "オリンピックに向けた合宿で、\n鶴田は「プロレスに行く！」と"}, {"t": 409.3666666666667, "x": "答えていたというのです。"}, {"t": 410.71666666666664, "x": "つまり鶴田にとって、オリンピックは\nゴールではありませんでした。"}, {"t": 414.96666666666664, "x": "プロレスへ向かうための、\n通過点だったことになります。"}, {"t": 418.5, "x": "1972年、ミュンヘンオリンピック。"}, {"t": 422.06666666666666, "x": "鶴田はグレコローマンスタイル100キロ以上級に\n出場しました。"}, {"t": 425.8833333333333, "x": "この階級に出場したのは、\n12か国の12人です。"}, {"t": 429.93333333333334, "x": "1回戦の相手は、ユーゴスラビアの選手。"}, {"t": 433.2, "x": "鶴田は4分46秒でフォール負けを喫します。"}, {"t": 436.68333333333334, "x": "2回戦ではハンガリーの選手に\n敗れ、失格となりました。"}, {"t": 440.93333333333334, "x": "当時のレスリングは、負け方などに応じて罰点が\nたまり、6点以上で失格となる方式です。"}, {"t": 447.68333333333334, "x": "鶴田の罰点は、2試合で8点に達していました。"}, {"t": 451.31666666666666, "x": "金メダルを獲得したのは、\nソビエト連邦の選手です。"}, {"t": 455.2, "x": "この頃、日本のプロレス界は\n大きく揺れていました。"}, {"t": 458.68333333333334, "x": "1971年の暮れ、アントニオ猪木が\n日本プロレスを追放されます。"}, {"t": 464.28333333333336, "x": "猪木は1972年3月6日に\n新日本プロレスを旗揚げしました。"}, {"t": 469.35, "x": "5月12日には、日本テレビが\n日本プロレスの中継を打ち切ります。"}, {"t": 474.1166666666667, "x": "そしてこの年の夏、ジャイアント馬場も\n日本プロレスを去りました。"}, {"t": 478.6, "x": "そんな中で、オリンピックの\n前後から、この大学生の獲得に、"}, {"t": 483.3833333333333, "x": "複数の世界が動いていました。"}, {"t": 485.8, "x": "大相撲からは、高砂部屋、\n時津風部屋、二子山部屋、さらに"}, {"t": 491.7, "x": "2つの部屋が勧誘に来ています。"}, {"t": 493.71666666666664, "x": "実家の生活費と親方株を保証するという、\n破格の条件を示した部屋もあったといいます。"}, {"t": 499.8666666666667, "x": "プロレス界では、\n新日本プロレスのアントニオ猪木が、"}, {"t": 503.55, "x": "いち早く目を付けていました。"}, {"t": 505.6333333333333, "x": "日本プロレスも、獲得に向けて動いています。"}, {"t": 508.9, "x": "一方、全日本プロレスは、この年の\n10月22日に旗揚げしたばかりの団体でした。"}, {"t": 515.3833333333333, "x": "所属選手は、馬場を含めてわずか8人です。"}, {"t": 518.9166666666666, "x": "プロレスを就職と考えていた鶴田にとって、\n選手が少ないことも、全日本を"}, {"t": 524.55, "x": "選ぶ理由の1つだったとされています。"}, {"t": 526.7666666666667, "x": "馬場の側では、ブレーンを\n務めていた人物が動いていました。"}, {"t": 530.8833333333333, "x": "この人物の妻の兄は、レスリングの強化委員で、\n八田会長の秘書的な存在でもありました。"}, {"t": 537.55, "x": "このブレーンは後年、入団が決まるまでの\n舞台裏をこう明かしています。"}, {"t": 542.4, "x": "「すき焼きを食べさせながら〝\n日プロに行っても先が見えているぞ〟とか、"}, {"t": 547.4666666666667, "x": "猪木の悪口を吹きまくってやったんだよ」"}, {"t": 550.4, "x": "それでも、鶴田の中には迷いがありました。"}, {"t": 553.5, "x": "当時のプロレスに向けられていた偏見や、\n世間の評価を考え、"}, {"t": 557.8833333333333, "x": "様々な葛藤があったと伝えられています。"}, {"t": 561.0666666666667, "x": "転機は、1972年9月16日でした。"}, {"t": 565.1166666666667, "x": "鶴田の父親が亡くなります。"}, {"t": 567.0333333333333, "x": "これをきっかけに、自分自身で\n人生に挑戦しようと考えたこと。"}, {"t": 571.8166666666667, "x": "そして八田一朗の\n「プロが栄えればアマも栄える」という言葉に"}, {"t": 575.5833333333334, "x": "励まされたこと。"}, {"t": 576.6333333333333, "x": "この2つが、プロレスラーになる決意に\nつながったとされています。"}, {"t": 580.75, "x": "1972年10月7日。"}, {"t": 583.3166666666667, "x": "鶴田は八田会長の仲介で、\n初めて馬場と会いました。"}, {"t": 587.2666666666667, "x": "赤坂プリンスホテルでの入団会見は、\nそれからわずか24日後のことです。"}, {"t": 592.6333333333333, "x": "会見で飛び出した「就職」という言葉は、\n当時のプロレス関係者を驚かせました。"}, {"t": 597.9833333333333, "x": "それまでのプロレス入りは、団体への\n「入門」と受け止められていたからです。"}, {"t": 602.7666666666667, "x": "この挨拶は\n「全日本プロレスに就職します」という形で"}, {"t": 606.3, "x": "報じられました。"}, {"t": 607.2666666666667, "x": "隣で聞いていた馬場は驚きながらも、\n中大法学部のエリートがプロレスに"}, {"t": 612.15, "x": "就職するようになったと思い、\n悪い気はしなかったといいます。"}, {"t": 616.4333333333333, "x": "ただしこの言葉は後年、\n「サラリーマンレスラー」という"}, {"t": 620.0166666666667, "x": "マイナスの印象を生むことにもなりました。"}, {"t": 622.3333333333334, "x": "鶴田自身は、こう考えていたと伝えられています。"}, {"t": 625.9666666666667, "x": "「農家の次男の俺が、この大きな身体を\n活かして生活していく職業はプロレスしかない」"}, {"t": 631.7833333333333, "x": "入団から約5か月後の1973年3月22日、\n鶴田はアメリカ修行へ出発します。"}, {"t": 639.1333333333333, "x": "行き先は、ザ・ファンクスが\n拠点を置くテキサス州アマリロでした。"}, {"t": 643.3, "x": "3月23日の夕方、鶴田は\nアマリロの空港に降り立ちます。"}, {"t": 648.1, "x": "出迎えたのは、ドリー・ファンク・シニア、\nドリー・ファンク・ジュニア、"}, {"t": 652.1666666666666, "x": "テリー・ファンクらです。"}, {"t": 653.7333333333333, "x": "修行中の生活の拠点は、\nホリデーイン・イーストの308号室でした。"}, {"t": 658.95, "x": "翌3月24日、テレビスタジオでデビュー戦。"}, {"t": 662.7166666666667, "x": "第3試合に出場し、\nサイド・スープレックスからの体固めで、"}, {"t": 667.05, "x": "6分52秒に勝利しました。"}, {"t": 669.5833333333334, "x": "リングネームは本名のトモミ・ツルタでしたが、\nアメリカ人には発音しにくく、"}, {"t": 674.6666666666666, "x": "トミー・ツルタの名前が定着します。"}, {"t": 677.35, "x": "2日後の3月26日、\nエルパソでのデビュー第2戦。"}, {"t": 681.5833333333334, "x": "相手は、同じ年の1月1日に\nデビューしたばかりのスタン・ハンセンでした。"}, {"t": 686.5, "x": "2人はこのあとも3月30日、\n4月1日と対戦を重ねます。"}, {"t": 691.45, "x": "ハンセンとは気が合ったようで、ハンセンは\n鶴田を「トミー」の愛称で呼んでいました。"}, {"t": 696.35, "x": "そして5月20日、\nニューメキシコ州アルバカーキ。"}, {"t": 699.9, "x": "鶴田はドリー・ファンク・ジュニアの持つ\nNWA世界ヘビー級王座に挑戦しています。"}, {"t": 705.1166666666667, "x": "デビューから、わずか2か月足らずでした。"}, {"t": 708.0, "x": "帰国後の10月6日、\n後楽園ホールで国内デビュー。"}, {"t": 712.0166666666667, "x": "3日後の10月9日には、\n蔵前国技館でザ・ファンクスとの"}, {"t": 716.2333333333333, "x": "インターナショナル・タッグ王座戦に、\n馬場のパートナーとして出場しました。"}, {"t": 720.9, "x": "1本目には、テリー・ファンクから\nジャーマン・スープレックス・ホールドで"}, {"t": 724.9666666666667, "x": "フォールを奪っています。"}, {"t": 726.25, "x": "10月27日、ファンからの\n公募で、リングネームは"}, {"t": 730.4833333333333, "x": "「ジャンボ鶴田」に改められました。"}, {"t": 732.3333333333334, "x": "鶴田のプロレス入りは、オリンピックの後で\n急に下された決断ではありませんでした。"}, {"t": 737.8333333333334, "x": "証言をつなぐと、\nバスケットボールを辞めた時点で、"}, {"t": 741.3666666666667, "x": "「オリンピックに出て、\n箔をつけてプロレスへ」という道筋が"}, {"t": 745.5833333333334, "x": "描かれていたことになります。"}, {"t": 747.1333333333333, "x": "重量級の少ないグレコローマンを選んだこと。"}, {"t": 750.0833333333334, "x": "わずか1年半で、全日本選手権の\n2冠にまで届いたこと。"}, {"t": 754.5333333333333, "x": "そして、旗揚げからひと月足らずで、\n選手わずか8人の会社を選んだこと。"}, {"t": 760.0666666666667, "x": "振り返れば、そのどれもが\n同じ一本の線でつながっています。"}, {"t": 764.3166666666667, "x": "入団会見にアマチュア・レスリング協会の会長と\n大学の監督が同席していた事実も、アマチュアの"}, {"t": 770.8833333333333, "x": "側がこの転身を後押ししていたことを\n物語っているのかもしれません。"}, {"t": 775.0166666666667, "x": "もっとも、最後の引き金を引いたのは\n損得の計算ではなく、父の死と、恩師とも"}, {"t": 781.2166666666667, "x": "言える人物の一言だったと伝えられています。"}, {"t": 783.85, "x": "人生の岐路は、必ずしも計算\nどおりには動かないものです。"}, {"t": 788.1, "x": "「就職」という言葉は、後年\n「サラリーマンレスラー」という不名誉な呼び名を"}, {"t": 792.7666666666667, "x": "生みました。"}, {"t": 793.4, "x": "それでも見方を変えれば、21歳の若者が\n自分の頭で考え抜いた末に発した、進路の"}, {"t": 800.0833333333334, "x": "宣言だったとも言えるのではないでしょうか。"}, {"t": 802.45, "x": "ジャンボ鶴田の転身は、はっきりした日付と\n証言の積み重ねから見えてきた道筋です。"}, {"t": 808.3166666666667, "x": "今回の内容が参考になったという方は、ぜひ\nチャンネル登録をお願いします。"}, {"t": 813.55, "x": "高評価やコメントも、次に\n取り上げる選手を選ぶ材料にしています。"}, {"t": 818.3, "x": "これからも新しい選手を掘り下げていきますので、\n楽しみにしていてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
