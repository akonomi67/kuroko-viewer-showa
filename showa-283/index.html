<script>
const D={"name": "力道山の最後の8日間", "file": "283_編集用", "dur": 904.3, "segs": [], "subs": [{"t": 0.0, "x": "1963年12月15日午後9時50分。"}, {"t": 4.083333333333333, "x": "東京・赤坂の病院で1人の\nプロレスラーが息を引き取りました。"}, {"t": 8.033333333333333, "x": "力道山です。"}, {"t": 9.2, "x": "1週間前の夜、力道山は\nナイトクラブで腹を刺されていました。"}, {"t": 13.766666666666667, "x": "その傷について、病院は\n全治2週間と発表していました。"}, {"t": 18.583333333333332, "x": "2週間で治るはずの傷でした。"}, {"t": 20.766666666666666, "x": "ところが力道山は、それから\n1週間ほどで亡くなります。"}, {"t": 24.733333333333334, "x": "刺された夜から亡くなった夜まで、\n病院の中では何が起きていたのでしょうか？"}, {"t": 30.333333333333332, "x": "そして全治2週間という発表は、\nなぜ外れたのでしょうか？"}, {"t": 34.81666666666667, "x": "今回は力道山の最後の8日間を\n日付と時刻で追います。"}, {"t": 38.75, "x": "当時の新聞と、その場にいた人たちの\n証言をもとに辿っていきます。"}, {"t": 43.416666666666664, "x": "最後までご覧いただければ幸いです。"}, {"t": 45.916666666666664, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 51.483333333333334, "x": "まず刺される前の数日のことです。"}, {"t": 53.78333333333333, "x": "この年の力道山には何度も戦った相手がいました。"}, {"t": 57.11666666666667, "x": "覆面のレスラー、デストロイヤーです。"}, {"t": 59.86666666666667, "x": "2人が初めて戦ったのは\n1963年5月24日でした。"}, {"t": 64.63333333333334, "x": "場所は東京体育館です。"}, {"t": 66.68333333333334, "x": "足四の字固めの掛け合いが続き、\nレフェリーが試合を止めました。"}, {"t": 71.08333333333333, "x": "結果は引き分けです。"}, {"t": 72.55, "x": "この試合はテレビで生中継されました。"}, {"t": 75.13333333333334, "x": "平均の視聴率は64%と記録されています。"}, {"t": 78.86666666666666, "x": "2019年の記事では、\n日本のテレビの歴代4位とされています。"}, {"t": 83.51666666666667, "x": "12月にデストロイヤーが再び日本に来ます。"}, {"t": 86.55, "x": "そして力道山の王座に続けて挑みました。"}, {"t": 89.3, "x": "12月2日は東京体育館です。"}, {"t": 92.0, "x": "力道山はリングアウトで王座を守りました。"}, {"t": 94.83333333333333, "x": "12月4日は大阪です。"}, {"t": 96.86666666666666, "x": "この夜が力道山の最後の\nインター王座戦になりました。"}, {"t": 100.33333333333333, "x": "デストロイヤーの足四の\n字固めがおよそ8分続きます。"}, {"t": 103.96666666666667, "x": "力道山はリングの下に落ちます。"}, {"t": 106.2, "x": "そのままカウントアウトとなりました。"}, {"t": 108.33333333333333, "x": "レフェリーの数える声は、ナイン、テン、\nツエンティー、ドローだったと記されています。"}, {"t": 115.71666666666667, "x": "試合は、両者のカウントアウトで引き分けでした。"}, {"t": 119.15, "x": "力道山は、19度目の\n防衛を果たしたとされています。"}, {"t": 123.26666666666667, "x": "ただ力道山は自分の力で立てません。"}, {"t": 125.95, "x": "猪木と豊登の肩を借りて、\nリングを引き揚げました。"}, {"t": 129.55, "x": "3日後の12月7日には、\n浜松で6人タッグの試合に出ています。"}, {"t": 134.45, "x": "相手の側にはデストロイヤーもいました。"}, {"t": 136.9, "x": "これが力道山の最後の試合になりました。"}, {"t": 139.61666666666667, "x": "試合のあと、力道山は\n夜行列車で東京へ戻っています。"}, {"t": 144.05, "x": "12月8日は日曜日でした。"}, {"t": 146.28333333333333, "x": "力道山の家は赤坂のリキ・アパートにありました。"}, {"t": 149.43333333333334, "x": "住まいは最上階の8階です。"}, {"t": 151.7, "x": "同じ敷地には日本プロレスの道場もありました。"}, {"t": 154.76666666666668, "x": "ここに1枚の写真があります。"}, {"t": 156.83333333333334, "x": "2006年に撮られた、\nリキ・アパートの建物です。"}, {"t": 160.31666666666666, "x": "建物の上のほうに、Rの文字が見えます。"}, {"t": 163.63333333333333, "x": "この日は家に客が来ています。"}, {"t": 165.61666666666667, "x": "大相撲の親方です。"}, {"t": 167.21666666666667, "x": "前の年、力道山は相撲の\nハワイ巡業を後押ししていました。"}, {"t": 171.68333333333334, "x": "親方はその礼を言いに来たのです。"}, {"t": 173.95, "x": "酒の席で力道山は1つの頼みごとをしました。"}, {"t": 177.16666666666666, "x": "弟子の猪木を相撲に\n入れてもらえないかという話です。"}, {"t": 180.46666666666667, "x": "親方が猪木の顔をほめると、\n力道山は笑って答えました。そうだろ。"}, {"t": 185.5, "x": "このやりとりは、そばで\n聞いていた妻が証言しています。"}, {"t": 189.33333333333334, "x": "妻によれば、力道山は何かあると\nすぐ猪木を家に呼んでいました。"}, {"t": 193.88333333333333, "x": "猪木はのちに、この一言で師匠に\n認められていると思えたと話しています。"}, {"t": 198.8, "x": "猪木の相撲入りは、このあと\n実現しないまま終わります。"}, {"t": 202.66666666666666, "x": "猪木は中学生のころ、\n家族とブラジルに渡っていました。"}, {"t": 206.6, "x": "そこでスカウトされました。"}, {"t": 208.28333333333333, "x": "1960年4月に、日本プロレスに入っています。"}, {"t": 212.46666666666667, "x": "午後6時ごろ力道山は出かけていきました。"}, {"t": 215.25, "x": "飲み直すと言って、赤坂の料亭に\n向かったと伝えられています。"}, {"t": 219.56666666666666, "x": "午後9時からは、ラジオ番組の\n収録も予定されていました。"}, {"t": 223.65, "x": "妻は妊娠中でこの夜は家に残っています。"}, {"t": 226.76666666666668, "x": "結婚してまだ半年ほどで、妻は22歳でした。"}, {"t": 230.58333333333334, "x": "その夜、力道山はナイトクラブにいました。"}, {"t": 233.73333333333332, "x": "ニューラテンクオーターという名の店です。"}, {"t": 236.13333333333333, "x": "新聞が伝えた住所は千代田区の永田町でした。"}, {"t": 239.4, "x": "一般には赤坂の\nナイトクラブとして知られています。"}, {"t": 242.53333333333333, "x": "店の中で、力道山は暴力団の\n組員の男ともめになりました。"}, {"t": 247.21666666666667, "x": "そして左の下腹部を刺されます。"}, {"t": 249.43333333333334, "x": "翌朝の新聞は、時刻を\n午後11時ごろと伝えました。"}, {"t": 253.63333333333333, "x": "傷の長さは4センチで、\n全治2週間とも書いています。"}, {"t": 257.68333333333334, "x": "刺したナイフは、刃の長さが\n13センチだったとされています。"}, {"t": 261.8333333333333, "x": "刺された直後の様子は、\n資料によって大きく違います。"}, {"t": 265.8666666666667, "x": "脇腹から血がしたたり落ちたと\n書いた記事もあります。"}, {"t": 268.9, "x": "一方で店の関係者の話も残っています。"}, {"t": 272.0, "x": "2人の間に言い合いはなかった。"}, {"t": 274.1, "x": "力道山の腹に血は流れていなかった。"}, {"t": 276.6666666666667, "x": "刺されたあと、力道山はステージに\n上がったとも伝えられています。"}, {"t": 281.01666666666665, "x": "そして客に向かって言いました。"}, {"t": 282.96666666666664, "x": "皆さん、気をつけてください、\nこの店には殺し屋がいます。"}, {"t": 287.3, "x": "店の関係者はのちに、自分の店が\n現場になったと振り返っています。"}, {"t": 292.1333333333333, "x": "事件のあと、店には脅しの電話が相次ぎました。"}, {"t": 295.78333333333336, "x": "電話の交換手は、次々に辞めていったそうです。"}, {"t": 299.3833333333333, "x": "刺された力道山は、\nまず山王病院で手当てを受けました。"}, {"t": 303.6666666666667, "x": "しかし力道山は医師の忠告を聞きません。"}, {"t": 306.48333333333335, "x": "家に帰ると言って騒いだとされています。"}, {"t": 309.01666666666665, "x": "午前0時半ごろ、家の電話が鳴りました。"}, {"t": 312.21666666666664, "x": "かけてきたのは力道山の側近です。"}, {"t": 314.7, "x": "先生は事故にあったみたいで。"}, {"t": 316.7, "x": "側近はそれだけ話すと言葉を濁しました。"}, {"t": 319.56666666666666, "x": "数分後にもう一度電話が鳴っています。"}, {"t": 322.2, "x": "やがて家のチャイムが鳴りました。"}, {"t": 324.1666666666667, "x": "妻が玄関を開けると、力道山が立っていました。"}, {"t": 327.73333333333335, "x": "両方の肩を2人の男に支えられています。"}, {"t": 330.75, "x": "1人は力道山の会社の専務でした。"}, {"t": 333.3, "x": "もう1人は山王病院の院長です。"}, {"t": 335.8333333333333, "x": "力道山は、このことを誰にも\n話すなと妻に命じました。"}, {"t": 339.8666666666667, "x": "特に妻の父には絶対に\n話すな、と念を押しています。"}, {"t": 343.9, "x": "妻の父は茅ヶ崎の警察署の署長でした。"}, {"t": 346.8666666666667, "x": "このあと、家には何人もの\n男たちが訪ねてきました。"}, {"t": 350.73333333333335, "x": "口々に詫びる男たちから、\n妻は初めて事情を聞かされます。"}, {"t": 355.1166666666667, "x": "夫がクラブで刺されたということです。"}, {"t": 357.5833333333333, "x": "院長と専務は力道山の説得にあたりました。"}, {"t": 360.73333333333335, "x": "妻の話では、力道山は警察に\n知られることを嫌っていたといいます。"}, {"t": 365.6166666666667, "x": "力道山はようやく、山王病院で\n手術を受けることになりました。"}, {"t": 370.15, "x": "山王病院には外科の医師がいませんでした。"}, {"t": 373.01666666666665, "x": "もともと、お産と女性の病気を\n専門にする病院だったのです。"}, {"t": 377.3666666666667, "x": "そこで呼ばれたのが、\n別の大きな病院の外科医でした。"}, {"t": 381.1666666666667, "x": "力道山とは、以前から親しくしていた医師です。"}, {"t": 384.6, "x": "9日の早朝に、およそ3時間の\n手術が行われたとされています。"}, {"t": 389.4166666666667, "x": "12月9日の午前7時、家の電話が鳴りました。"}, {"t": 393.4, "x": "かけてきたのは執刀した外科医です。"}, {"t": 395.6666666666667, "x": "手術は終わり、具合は良いという知らせでした。"}, {"t": 399.05, "x": "傷口も、目立たないようにしておいたと\n伝えています。"}, {"t": 402.6333333333333, "x": "奥様は午後に\n病院へ来てください、という話でした。"}, {"t": 406.55, "x": "その朝の読売新聞は、\n事件を社会面で伝えています。"}, {"t": 410.93333333333334, "x": "記事には、力道山の本名と年齢も載っていました。"}, {"t": 414.65, "x": "本名は百田光浩です。"}, {"t": 416.5833333333333, "x": "年齢は40歳と書かれていました。"}, {"t": 419.06666666666666, "x": "力道山の年齢は、資料によって39歳と\n40歳に分かれます。"}, {"t": 424.21666666666664, "x": "同じ記事は別の騒ぎも伝えていました。"}, {"t": 426.78333333333336, "x": "9日の午前0時40分ごろ、力道山が\n住むアパートの前で乱闘がありました。"}, {"t": 432.4166666666667, "x": "警視庁は、事件にからむ暴力団同士の\nけんかとみて調べました。"}, {"t": 437.0, "x": "赤坂の警察署は、隣の6つの\n署に緊急の配備を求めています。"}, {"t": 441.9166666666667, "x": "アパートの周りには、警察官が\n70人置かれていたとされています。"}, {"t": 446.71666666666664, "x": "妻は、その警察官たちに\n気づいていなかったといいます。"}, {"t": 450.53333333333336, "x": "誰にも話すなという力道山の言葉とは\n逆に、事件は新聞に出ました。"}, {"t": 455.6666666666667, "x": "妻は新聞を読んで、自分には何も\n知らされていなかったことを知ります。"}, {"t": 460.48333333333335, "x": "山王病院は会見を開きました。"}, {"t": 463.03333333333336, "x": "発表は全治2週間です。"}, {"t": 465.1166666666667, "x": "病院の診断書も残っています。"}, {"t": 467.46666666666664, "x": "手当ての中身は、小腸の傷を\n縫い合わせたというものでした。"}, {"t": 471.5, "x": "そこには、この先1か月あまりの静養が\n要る見込みとも書かれていました。"}, {"t": 476.3666666666667, "x": "院長は経過の報告に、経過順調、\n経過良好と書いています。"}, {"t": 481.6166666666667, "x": "9日から妻は家を離れました。"}, {"t": 483.8666666666667, "x": "病室の隣の部屋に移り、付き添いを続けます。"}, {"t": 487.51666666666665, "x": "付け人や若手の選手たちが、\n交代で手伝いに来ました。"}, {"t": 491.48333333333335, "x": "その中には猪木の姿もありました。"}, {"t": 493.8666666666667, "x": "入院中の力道山は、\n水を飲むことを禁じられていました。"}, {"t": 4 function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;

function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
