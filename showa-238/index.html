<script>
const D={"name": "サンダー杉山", "file": "238_編集用", "dur": 846.76665625, "segs": [], "subs": [{"t": 0.0, "x": "1970年5月19日、\n仙台で行われた国際プロレスの試合で、"}, {"t": 5.733333333333333, "x": "IWA世界ヘビー級王座をかけた一戦が\n組まれていました。"}, {"t": 10.15, "x": "王者はイギリスから来たビル・ロビンソン。"}, {"t": 12.466666666666667, "x": "挑戦者を務めたのは、身長178センチ、\n体重125キロの日本人、サンダー杉山です。"}, {"t": 20.666666666666668, "x": "結果はリングアウトで、\nベルトは杉山の手に渡りました。"}, {"t": 24.583333333333332, "x": "国際プロレスの看板ベルトを、\n日本人が手にした最初の瞬間です。"}, {"t": 29.316666666666666, "x": "イメージ映像"}, {"t": 29.316666666666666, "x": "杉山にはもう1つの経歴があります。"}, {"t": 31.983333333333334, "x": "6年前の東京オリンピックに、レスリングの\n日本代表として出場していたのです。"}, {"t": 37.61666666666667, "x": "日の丸を背負ったアマチュアの\n選手が、なぜプロレスの道を選び、"}, {"t": 41.96666666666667, "x": "新しい団体の看板になっていったのでしょうか。"}, {"t": 45.36666666666667, "x": "今回は、サンダー杉山という1人の\nプロレスラーの軌跡を、具体的な日付と"}, {"t": 50.8, "x": "数字、そして証言をもとに辿っていきます。"}, {"t": 53.983333333333334, "x": "イメージ映像"}, {"t": 53.983333333333334, "x": "最後までご覧いただければ幸いです。"}, {"t": 56.483333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 62.06666666666667, "x": "イメージ映像"}, {"t": 62.06666666666667, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 65.85, "x": "本名は杉山恒治。"}, {"t": 67.53333333333333, "x": "1940年7月23日、\n新潟県糸魚川市の生まれです。"}, {"t": 73.15, "x": "イメージ映像"}, {"t": 73.15, "x": "最初に打ち込んだのは、\nレスリングではありませんでした。"}, {"t": 76.73333333333333, "x": "東海高校から同志社大学へ進み、\n入ったのは柔道部です。"}, {"t": 81.38333333333334, "x": "しかし1年の終わりに、\nその柔道部を辞めています。"}, {"t": 85.2, "x": "その後、別の大学の柔道部に\nコーチ兼特待生として籍を置いた時期もありました。"}, {"t": 90.83333333333333, "x": "転機は、大学2年への進級時でした。"}, {"t": 94.03333333333333, "x": "杉山は明治大学農学部農業経済学科に\n編入し、レスリング部に入ります。"}, {"t": 100.0, "x": "そして入部からわずか10日後、\nローマオリンピックの最終予選に"}, {"t": 104.4, "x": "出場し、いきなり優勝しました。"}, {"t": 107.01666666666667, "x": "それでも、経験が足りないという理由で、\nローマ行きは認められませんでした。"}, {"t": 112.46666666666667, "x": "イメージ映像"}, {"t": 112.46666666666667, "x": "杉山はそこから、ヘビー級の選手として\n全日本学生選手権と全日本選手権を制します。"}, {"t": 119.26666666666667, "x": "そして1964年、東京オリンピック。"}, {"t": 123.1, "x": "グレコローマンの97キロ超級、ヘビー級の\n代表として出場し、3回戦まで勝ち進みました。"}, {"t": 130.33333333333334, "x": "同じ大会には、フリースタイルの\nヘビー級代表として、斎藤昌典、"}, {"t": 135.53333333333333, "x": "後のマサ斎藤も出場しています。"}, {"t": 138.21666666666667, "x": "大会の翌年、この2人はそろって\nプロレスに転向しました。"}, {"t": 142.48333333333332, "x": "入った先は、どちらも日本プロレスです。"}, {"t": 145.6, "x": "1965年9月、鳴り物入りで入門した2人の\n写真が、東京スポーツに残っています。"}, {"t": 152.93333333333334, "x": "中央に写っているのは、日本レスリング協会の\n会長だった八田一朗でした。"}, {"t": 158.26666666666668, "x": "イメージ映像"}, {"t": 158.26666666666668, "x": "杉山は斎藤、そしてラグビー出身の\n草津正武と並んで、三羽烏と呼ばれました。"}, {"t": 164.73333333333332, "x": "イメージ映像"}, {"t": 164.73333333333332, "x": "では、なぜ杉山はプロレスを選んだのでしょうか。"}, {"t": 168.31666666666666, "x": "杉山の生涯をまとめた伝記\n『何度だって闘える』などでは、もともと、"}, {"t": 172.86666666666667, "x": "アメリカに渡るための人脈を築くことが\n目的だったと伝えられています。"}, {"t": 177.53333333333333, "x": "イメージ映像"}, {"t": 177.53333333333333, "x": "ただ、入った世界は甘くありませんでした。"}, {"t": 180.73333333333332, "x": "東京スポーツで国際プロレスを\n担当していた記者は、"}, {"t": 184.01666666666668, "x": "後にこう振り返っています。"}, {"t": 186.08333333333334, "x": "イメージ映像"}, {"t": 186.08333333333334, "x": "「五輪出身だから、新弟子時代は\n嫉妬した先輩レスラーによく血だるまにされていたよ」"}, {"t": 191.86666666666667, "x": "プロデビューは1966年3月4日でした。"}, {"t": 195.48333333333332, "x": "イメージ映像"}, {"t": 195.48333333333332, "x": "しかしその年の夏、杉山は草津とともに、\n日本プロレスを離れます。"}, {"t": 200.78333333333333, "x": "行き先は、生まれたばかりの国際プロレスでした。"}, {"t": 204.2, "x": "国際プロレスをつくったのは、吉原功です。"}, {"t": 207.71666666666667, "x": "イメージ映像"}, {"t": 207.71666666666667, "x": "早稲田大学レスリング部の出身で、\n日本プロレスの営業部長を務めていました。"}, {"t": 213.11666666666667, "x": "力道山の死後、会社の経営を巡って対立し、\n1966年10月5日に日本プロレスを退社。"}, {"t": 221.13333333333333, "x": "新団体として国際プロレスを設立します。"}, {"t": 224.25, "x": "設立時の役員には、\n杉山の父も名を連ねていました。"}, {"t": 228.46666666666667, "x": "旗揚げ戦は1967年1月5日、\n大阪府立体育会館です。"}, {"t": 234.41666666666666, "x": "イメージ映像"}, {"t": 234.41666666666666, "x": "先に旗揚げしていた東京プロレスとの合同興行で、\nアメリカンサイズのリングや、タレントによる"}, {"t": 241.16666666666666, "x": "リングアナウンスが注目を集めました。"}, {"t": 243.48333333333332, "x": "イメージ映像"}, {"t": 243.48333333333332, "x": "ただ、テレビ局との放映契約は結べず、\n興行は振るいませんでした。"}, {"t": 248.88333333333333, "x": "イメージ映像"}, {"t": 248.88333333333333, "x": "レスリング出身の社長がつくった団体に、\nオリンピック帰りの2人が加わった形でした。"}, {"t": 254.86666666666667, "x": "しかし、船出は苦しいものでした。"}, {"t": 257.6666666666667, "x": "1967年8月14日、大阪で\n日本プロレスと興行がぶつかります。"}, {"t": 263.78333333333336, "x": "イメージ映像"}, {"t": 263.78333333333336, "x": "日本プロレスが2万人を集めたのに対し、\n国際プロレスは4200人にとどまりました。"}, {"t": 269.93333333333334, "x": "イメージ映像"}, {"t": 269.93333333333334, "x": "流れが変わったのは、同じ年の9月11日です。"}, {"t": 273.6666666666667, "x": "国際プロレスはTBSと放映契約を結びました。"}, {"t": 277.3, "x": "TBSが支払う放映権料は1回220万円。"}, {"t": 281.26666666666665, "x": "日本テレビが日本プロレスに\n支払っていた1回200万円を上回る金額でした。"}, {"t": 286.5, "x": "このころ、杉山は日本を離れていました。"}, {"t": 289.6166666666667, "x": "海外武者修行のためにアメリカへ渡り、\nトーキョー・ジョーという名前で、"}, {"t": 294.23333333333335, "x": "悪役として北米を回っていたのです。"}, {"t": 297.1166666666667, "x": "ザ・シークが仕切っていた\nデトロイト地区では、来日前の"}, {"t": 300.6666666666667, "x": "アブドーラ・ザ・ブッチャーとも組んでいます。"}, {"t": 302.76666666666665, "x": "1967年9月から10月にかけては\nテキサス州のアマリロ地区に参戦し、"}, {"t": 308.26666666666665, "x": "イメージ映像"}, {"t": 308.26666666666665, "x": "10月4日にはラボックで\nNWA北米ヘビー級王座に挑戦しました。"}, {"t": 313.51666666666665, "x": "イメージ映像"}, {"t": 313.51666666666665, "x": "アメリカに渡りたいという目的は、\nこの時点で形になっていたことになります。"}, {"t": 318.46666666666664, "x": "1968年、杉山は帰国します。"}, {"t": 322.28333333333336, "x": "国際プロレスは、この年の1月から\nTBSで全国中継が始まっていました。"}, {"t": 327.9166666666667, "x": "イメージ映像"}, {"t": 327.9166666666667, "x": "1月3日の中継第1戦では、\nエース候補だった草津がテーズの"}, {"t": 332.5833333333333, "x": "バックドロップで失神し、\n新しいエースを生む計画は崩れていました。"}, {"t": 337.31666666666666, "x": "杉山は、TWWA世界ヘビー級王者の\nルー・テーズに挑戦しています。"}, {"t": 343.0833333333333, "x": "イメージ映像"}, {"t": 343.0833333333333, "x": "結果は敗戦でしたが、テーズから\n一本を取ったとされています。"}, {"t": 347.43333333333334, "x": "イメージ映像"}, {"t": 347.43333333333334, "x": "テーズは杉山について、「杉山の\nテクニックには光るものがあった」"}, {"t": 351.71666666666664, "x": "「基礎のできたグッド・レスラー」と\n評価したと伝えられています。"}, {"t": 355.0, "x": "帰国後、杉山が最初に巻いた\nベルトはタッグでした。"}, {"t": 358.8, "x": "1968年2月14日、大阪。"}, {"t": 362.71666666666664, "x": "豊登と組み、アル・コステロとドン・ケントの\n組からTWWA世界タッグ王座を奪います。"}, {"t": 369.23333333333335, "x": "イメージ映像"}, {"t": 369.23333333333335, "x": "東京スポーツは、この試合を1面で報じました。"}, {"t": 372.85, "x": "杉山がコステロの得意技の裏をかいて\nエビ固めで押さえ込み、鮮やかな"}, {"t": 377.85, "x": "フォールを奪ったと書かれています。"}, {"t": 379.6333333333333, "x": "この2人は、ここから\n25回の防衛に成功しました。"}, {"t": 383.6666666666667, "x": "イメージ映像"}, {"t": 383.6666666666667, "x": "この王座は1969年8月を\n最後に形だけのものとなり、"}, {"t": 388.23333333333335, "x": "イメージ映像"}, {"t": 388.23333333333335, "x": "国際プロレスの看板タッグ王座は、\nIWA世界タッグ王座に移っていきます。"}, {"t": 394.45, "x": "イメージ映像"}, {"t": 394.45, "x": "先ほどの記者は、このコンビに\nついてこう語っています。"}, {"t": 398.1666666666667, "x": "イメージ映像"}, {"t": 398.1666666666667, "x": "「彼は強度の近眼でね。"}, {"t": 399.96666666666664, "x": "間違えて敵のコーナーに行って\n『トヨさん、タッチ！』と叫んで"}, {"t": 404.48333333333335, "x": "イメージ映像"}, {"t": 404.48333333333335, "x": "外国人にボコボコにされた時があった。"}, {"t": 406.76666666666665, "x": "イメージ映像"}, {"t": 406.76666666666665, "x": "あれは笑ったよ。"}, {"t": 407.98333333333335, "x": "2人ともずんぐりむっくりだったから、とても\n日本人的なコンビだった」"}, {"t": 412.5, "x": "イメージ映像"}, {"t": 412.5, "x": "その後、国際プロレスはヨーロッパとの\nつながりを深めていきます。"}, {"t": 416.8, "x": "イメージ映像"}, {"t": 416.8, "x": "1968年2月、外国人選手の招へいを\n任せていたブッカーと金銭を巡って決別し、"}, {"t": 424.06666666666666, "x": "イメージ映像"}, {"t": 424.06666666666666, "x": "国際プロレスはアメリカから\n選手を呼ぶ道を失っていました。"}, {"t": 428.3833333333333, "x": "イメージ映像"}, {"t": 428.3833333333333, "x": "そこで吉原は、日本レスリング協会会長の\n八田一朗の紹介を受けて、"}, {"t": 433.65, "x": "ヨーロッパから選手を呼ぶ道を開きました。"}, {"t": 436.6333333333333, "x": "イメージ映像"}, {"t": 436.6333333333333, "x": "杉山が入門した日の写真に\n写っていた、あの人物です。"}, {"t": 441.1166666666667, "x": "こうして生まれたのが、\nIWAという統括組織です。"}, {"t": 445.06666666666666, "x": "1968年11月に\n開かれた第1回IWAワールド・シリーズで、"}, {"t": 450.65, "x": "イメージ映像"}, {"t": 450.65, "x": "12月19日、岡山での決勝で豊登を\n破って優勝したビル・ロビンソンが、初代の"}, {"t": 457.51666666666665, "x": "IWA世界ヘビー級王者に認定されました。"}, {"t": 460.7, "x": "ロビンソンはそのまま日本に定着し、\n国際プロレスのエースになります。"}, {"t": 465.65, "x": "1970年2月3日、杉山は草津と組んで、\nIWA世界タッグ王座を獲得しました。"}, {"t": 473.3, "x": "このとき倒した相手の1人は、\nモンスター・ロシ const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
