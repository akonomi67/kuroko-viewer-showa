<script>
const D={"name": "アニマル浜口", "file": "241_編集用", "dur": 868.26665625, "segs": [], "subs": [{"t": 0.0, "x": "1987年8月20日、東京の両国国技館。"}, {"t": 4.833333333333333, "x": "新日本プロレスの大会に、1万1570人の\n超満員の観客が詰めかけていました。"}, {"t": 11.35, "x": "リングの中央に立ったのは、\n濃紺のガウンを着た39歳の男です。"}, {"t": 16.333333333333332, "x": "ガウンを脱ぎ捨てると、いつもの\nワンショルダーの姿が現れました。"}, {"t": 20.716666666666665, "x": "男はマイクを握り、こう挨拶しています。"}, {"t": 24.016666666666666, "x": "この四角いリングの中に、\nボクの青春がありました。"}, {"t": 27.616666666666667, "x": "人生があったんすよ。"}, {"t": 29.15, "x": "ありがとう、プロレス。"}, {"t": 30.883333333333333, "x": "さようなら、プロレス。"}, {"t": 32.733333333333334, "x": "アニマル浜口の引退セレモニーでした。"}, {"t": 35.266666666666666, "x": "ところが、その年の11月1日。"}, {"t": 38.2, "x": "東京・浅草に、1軒の\nトレーニングジムが看板を掲げます。"}, {"t": 42.6, "x": "やがてその場所からは、50人を超える\nプロレスラーが巣立っていくことになります。"}, {"t": 47.6, "x": "さようならと告げたはずの男は、なぜ今度は\nプロレスラーを育てる側に回ったのでしょうか。"}, {"t": 53.46666666666667, "x": "しかも、その指導料を\n受け取らなかったのはなぜなのでしょうか。"}, {"t": 57.5, "x": "今回は、アニマル浜口という男が\n選手から指導者へ移っていった道のりを、"}, {"t": 62.8, "x": "確認できた日付と証言をもとに辿っていきます。"}, {"t": 66.3, "x": "最後までご覧いただければ幸いです。"}, {"t": 68.78333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 74.36666666666666, "x": "浜口の本名は濱口平吾。"}, {"t": 76.7, "x": "1947年8月31日、島根県浜田市で、\n9人兄弟の8番目として生まれました。"}, {"t": 84.73333333333333, "x": "小学5年生だった1958年、\n父親の事業の失敗をきっかけに、"}, {"t": 90.63333333333334, "x": "一家は大阪の堺市へ移ります。"}, {"t": 93.31666666666666, "x": "中学を卒業すると、名古屋、東京、\n横浜と、工事現場を転々としました。"}, {"t": 100.43333333333334, "x": "浜口は後年、東京での1日を\nこう振り返っています。"}, {"t": 104.86666666666666, "x": "東京・銀座の松屋での改装工事を終えた帰り、\n街角のショーウインドーに映った自分の"}, {"t": 110.78333333333333, "x": "顔を見て、愕然としました。"}, {"t": 113.16666666666667, "x": "華やかに着飾り、楽しげに\n闊歩する人々の波のなかで、自分は何と"}, {"t": 118.75, "x": "みすぼらしい姿をしているのかと思いましたよ。"}, {"t": 121.5, "x": "浜口が大阪に戻ったのは、\n1963年12月8日のことでした。"}, {"t": 127.13333333333334, "x": "奇しくも、力道山が赤坂のナイトクラブで\n刺された日と同じ日付です。"}, {"t": 131.83333333333334, "x": "大阪では製鋼所に勤め、\n起重機の免許も取りました。"}, {"t": 135.86666666666667, "x": "転機は休日に観た1本の映画です。"}, {"t": 138.46666666666667, "x": "古代ローマの剣闘士を描いた\n『ヘラクレス』でした。"}, {"t": 141.55, "x": "俺も、あんな身体になりたい。"}, {"t": 143.96666666666667, "x": "そう思った浜口は、ボディビルを始めます。"}, {"t": 147.2, "x": "通い始めたのは、大阪・北新地の飲み屋街にあった\nナニワトレーニングセンターです。"}, {"t": 152.66666666666666, "x": "見つけたきっかけについて、\n浜口はこう語っています。"}, {"t": 156.45, "x": "僕だってもともとプロレスが好きで、\n大スポを毎日読んでいて、"}, {"t": 160.35, "x": "そこでナニワトレーニングセンターの\n広告を見つけたんですから。"}, {"t": 164.33333333333334, "x": "プロレスラーになることは、\n当時の浜口にとって、夢というか、"}, {"t": 168.85, "x": "夢のそのまた夢だったといいます。"}, {"t": 171.21666666666667, "x": "このジムの会長は、国際プロレスの\n監査役も務めていた人物でした。"}, {"t": 176.06666666666666, "x": "会長は、黙々とトレーニングを続ける浜口の\n姿を見ていたといいます。"}, {"t": 181.05, "x": "浜口は、その会長がプロレスラーへの\n道を開いてくれたと語っています。"}, {"t": 185.98333333333332, "x": "先生と出会ってなかったら、\n何のツテもない僕なんか"}, {"t": 189.4, "x": "プロレスラーになれなかったでしょうからね。"}, {"t": 191.63333333333333, "x": "やがて浜口は、国際プロレスの\n社長と直接会うことになります。"}, {"t": 196.13333333333333, "x": "そのときの気持ちを、\n浜口はこう表現しています。"}, {"t": 199.8, "x": "俺は、あの国際プロレスの\n社長と直接お会いしたんだ。"}, {"t": 203.75, "x": "認められたんだと思うと、\n天にも昇るような気持ちでした。"}, {"t": 207.61666666666667, "x": "1969年、浜口は\nミスター兵庫コンテストで準優勝します。"}, {"t": 213.26666666666668, "x": "そして同じ年の8月、\n国際プロレスに入団しました。"}, {"t": 217.46666666666667, "x": "デビュー戦は1969年9月20日、\n岡山県の高梁市民会館です。"}, {"t": 223.48333333333332, "x": "結果は反則負けでした。"}, {"t": 225.25, "x": "入門と同時に付き人を務めた相手は、\nグレート草津です。"}, {"t": 229.43333333333334, "x": "翌1970年には、アニマル浜口という\nリングネームが決まり、"}, {"t": 234.26666666666668, "x": "社長の吉原功が名付けました。"}, {"t": 236.96666666666667, "x": "浜口は吉原について、こう語っています。"}, {"t": 240.38333333333333, "x": "私が今、こうしていられるのも、\n私がアニマル浜口でいられるのも、"}, {"t": 245.31666666666666, "x": "プロレスのおかげということを考えれば、\n一番の恩人は亡くなられた吉原功社長です。"}, {"t": 251.61666666666667, "x": "1972年、浜口はアメリカの\nAWAのテリトリーへ遠征に出ます。"}, {"t": 257.5, "x": "1976年には2度目の海外修行として、\nカナダのカルガリーとプエルトリコを回りました。"}, {"t": 264.05, "x": "帰国後の1977年3月26日、草津と\n組んでIWA世界タッグ王座を獲得します。"}, {"t": 271.73333333333335, "x": "この王座は通算4回手にしています。"}, {"t": 274.3833333333333, "x": "同じ1977年には、\nプロレス大賞の殊勲賞も受賞しました。"}, {"t": 279.68333333333334, "x": "しかし、国際プロレスそのものが\n長くは続きませんでした。"}, {"t": 283.8666666666667, "x": "1981年8月9日、\n北海道の羅臼町民グラウンド。"}, {"t": 289.0833333333333, "x": "観衆1100人の前で行われたこの大会が、\n団体の最後の興行になります。"}, {"t": 294.76666666666665, "x": "1967年1月の旗揚げから、\nおよそ15年でした。"}, {"t": 299.6, "x": "ここで浜口は、所属する団体を失います。"}, {"t": 303.03333333333336, "x": "次の舞台は新日本プロレスでした。"}, {"t": 305.45, "x": "1981年9月23日、田園コロシアムの\n大会に、ラッシャー木村とともに"}, {"t": 312.5833333333333, "x": "国際軍団として姿を見せます。"}, {"t": 314.8, "x": "その後は寺西勇を加えた3人で\nアントニオ猪木と抗争を続け、やがて長州力の"}, {"t": 320.8833333333333, "x": "維新軍に合流しました。"}, {"t": 322.5, "x": "1984年には、長州らとともに\nジャパンプロレスの創立メンバーとなり、"}, {"t": 328.03333333333336, "x": "全日本プロレスのリングに上がります。"}, {"t": 330.76666666666665, "x": "1985年7月18日には、\n寺西と組んでアジアタッグ王座を奪いました。"}, {"t": 337.1, "x": "ところが1987年、\nそのジャパンプロレスが分裂します。"}, {"t": 342.01666666666665, "x": "長州らは新日本プロレスへ戻り、\n一部の選手は全日本プロレスに残りました。"}, {"t": 347.68333333333334, "x": "その中で浜口が選んだのは、\nどちらでもなく、引退でした。"}, {"t": 352.3833333333333, "x": "冒頭の両国国技館のセレモニーには、\n長州もリングに上がっています。"}, {"t": 357.3, "x": "長州はマイクでこう呼びかけました。"}, {"t": 359.56666666666666, "x": "このアニマル浜口を、どうか記憶の\n中から消さないでほしいのです。"}, {"t": 364.01666666666665, "x": "お願いします。"}, {"t": 365.1333333333333, "x": "浜口は団体や世代を超えたレスラーたちに\n胴上げされ、現役生活に区切りをつけました。"}, {"t": 371.26666666666665, "x": "引退から2か月あまり後の11月1日。"}, {"t": 374.4166666666667, "x": "浜口は東京・浅草に、\nアニマル浜口トレーニングジムを開きます。"}, {"t": 379.31666666666666, "x": "なお、ジムの開設を\n1988年とする資料もあります。"}, {"t": 384.3666666666667, "x": "最初に取り組んだのは、プロレスの\n指導ではなくボディビルでした。"}, {"t": 388.4, "x": "1988年9月15日、\n江東公会堂で開かれたミスター&"}, {"t": 393.95, "x": "ミス東京ボディビルディング・チャンピオンシップス。"}, {"t": 396.5833333333333, "x": "浜口は40歳以上のシニア部門に\n出場し、優勝します。"}, {"t": 401.2, "x": "現役時代におよそ100キロあった体重を、\n70キロまで落としての出場でした。"}, {"t": 406.8, "x": "大会後、浜口はこう話しています。"}, {"t": 409.71666666666664, "x": "優勝できたのには元プロレスラーの\n意地があったから。"}, {"t": 412.8, "x": "もう優勝も過去のこと。"}, {"t": 414.4166666666667, "x": "今日から新たなるスタートです。"}, {"t": 416.31666666666666, "x": "ところが、プロレスのほうが\n浜口を放しませんでした。"}, {"t": 420.01666666666665, "x": "1990年1月18日、山口県の徳山で\n行われた新日本プロレスの大会です。"}, {"t": 427.26666666666665, "x": "試合中のリングに浜口が乱入し、\n長州に馬乗りになって張り手を浴びせました。"}, {"t": 432.93333333333334, "x": "叫んでいたのは、この言葉です。"}, {"t": 435.45, "x": "長州、燃えてくれ。"}, {"t": 437.3, "x": "その夜、宿舎での会見で、\n浜口はこう説明しています。"}, {"t": 442.23333333333335, "x": "昔のギラギラした長州に戻って\nほしいから事を起こした。"}, {"t": 445.9, "x": "オレは長州を目覚めさせることで\nプロレス界に恩返しがしたい。"}, {"t": 449.75, "x": "レスラーとしてのカムバックはない。"}, {"t": 451.73333333333335, "x": "しかし、その言葉どおりにはなりませんでした。"}, {"t": 455.05, "x": "1990年5月6日、後楽園ホール。"}, {"t": 458.95, "x": "浜口は8人タッグマッチでリングに戻り、\nバックフリップで勝利を挙げます。"}, {"t": 464.26666666666665, "x": "復帰にあたっての言葉が残っています。"}, {"t": 466.78333333333336, "x": "川の流れが\nこうなってきているので、もう引き返せない。"}, {"t": 470.45, "x": "プロレスから逃げ切れなかったということです。"}, {"t": 472.9, "x": "その後はセミリタイアの時期を経て、\n1994年にはWARのリングに上がりました。"}, {"t": 479.3666666666667, "x": "1995年には、天龍源一郎らと組んで\nWAR世界6人タッグ王座も獲得しています。"}, {"t": 486.93333333333334, "x": "この王座を失ったあとは\nリングから遠ざかりましたが、"}, {"t": 490.15, "x": "正式な引退表明はしていません。"}, {"t": 492.81666666666666, "x": "ここで、話を浅草のジムに戻します。"}, {"t": 495.8666666666667, "x": "ジムに通ってくる若者には、\nプロレスラーを目指す人が多くいました。"}, {"t": 500.48333333333335, "x": "そこで浜口は、ジムの中に\nプロレスラーを育てるコースを設けます。"}, {"t": 505.0833333333333, "x": "始まった時期は、1990年とする記事と、\n1991年1月とする本人の"}, {"t": 512.1, "x": "プロフィールがあります。"}, {"t": 513.3166666666667, "x": "東京スポーツは、このコースが\n始まった理由を、プロレスへの"}, {"t": 517.7333333333333, "x": "恩返しの気持ちだったと伝えています。"}, {"t": 519.9333333333333, "x": "やがてこのコースは、\n浜口道場という名前で定着していきました。"}, {"t": 524.5666666666667, "x": "この道場には、ほかにはない決まりがありました。"}, {"t": 527.7666666666667, "x": "週3回のプロレスラー育成コースは、\n指導料も道場使用料も取りません。"}, {"t": 533.0166666666667, "x": "受け取るのは、ジムの\n一般会員としての会費だけです。"}, {"t": 536.8333333333334, "x": "2021年の記事の時点でも、この形は\n開設以来変わっていないと報じられています。"}, {"t": 542.9833333333333, "x": "浜口はその理由を、こう話していたといいます。"}, {"t": 546.4333333333333, "x": "未来ある若者を手のひらで握りしめてはいけない。"}, {"t": 549.4666666666667, "x": "羽ばたいてもらわないと。"}, {"t": 551.0166666666667, "x": "さらにこの道場は、格闘技の実績がない人や、\n身長が足りずにプロレスラーへの道を"}, {"t": 557.1833333333333, "x": "閉ざされていた人にも門戸を開いていました。"}, {"t": 559.7333333333333, "x": "その初期の門下生の1人が、小島聡です。"}, {"t": 563.1166666666667, "x": "小島には、学生時代に格闘技の\n経験がありませんでした。"}, {"t": 567.2833333333333, "x": "一度は会社に就職しましたが、\n退職して浜口のジムで体を作ります。"}, {"t": 572.5833333333334, "x": "そして1991年2月、\n新日本プロレスに入門しました。"}, {"t": 577.7, "x": "デビューは同じ年の7月16日です。"}, {"t": 580.5166666666667, "x": "もう1人、名前を挙げておきます。"}, {"t": 583.2166666666667, "x": "内藤哲也が浜口の道場に入ったのは、\n2000年9月でした。"}, {"t": 587.7333333333333, "x": "新日本プロレスの入門テストに\n合格して入寮したのは、"}, {"t": 591.55, "x": "2005年12月1日です。"}, {"t": 593.9166666666666, "x": "デビューは2006年5月27日でした。"}, {"t": 596.9666666666667, "x": "それからおよそ10年後の\n2016年4月10日、内藤は"}, {"t": 601.2833333333333, "x": "IWGPヘビー級王座を初めて手にしています。"}, {"t": 605.2666666666667, "x": "道場の出身者は、ほかにも大勢います。"}, {"t": 608.4333333333333, "x": "2017年の記事の時点で、\nプロレス界・格闘技界に送り出した選手は"}, {"t": 613.4833333333333, "x": "50人以上とされています。"}, {"t": 615.3166666666667, "x": "そして、浜口が最も\n長く向き合った教え子がいます。"}, {"t": 619.3333333333334, "x": "1978年1月11日生まれの\n長女、浜口京子です。"}, {"t": 624.7833333333333, "x": "京子は14歳のとき、プロレスラーを\n目指して父の道場に入り、男性の練習生に"}, {"t": 631.0333333333333, "x": "混じってトレーニングを始めました。"}, {"t": 633.0, "x": "やがて女子レスリングに進み、世界選手権では"}, {"t": 636.4166666666666, "x": "1997年、1998年、1999年、"}, {"t": 642.6833333333333, "x": "2002年、2003年の5回優勝します。"}, {"t": 646.6166666666667, "x": "2004年のアテネオリンピックでは、\n72キロ級で銅メダルを獲得しました。"}, {"t": 652.0166666666667, "x": "娘の応援で父が叫んだ\n「気合だー」という言葉は、その年の新語・"}, {"t": 656.6333333333333, "x": "流行語大賞のトップテンに選ばれています。"}, {"t": 659.3, "x": "2008年の北京オリンピックでも、京子は\n同じ72キロ級で銅メダルを手にしました。"}, {"t": 665.3333333333334, "x": "オリンピックには3大会続けて出場し、\nメダルは2つです。"}, {"t": 669.7666666666667, "x": "14歳で道場に入った日から数えると、\n北京の表彰台まではおよそ16年でした。"}, {"t": 675.8333333333334, "x": "2025年3月、東京都の広報紙の\nインタビューで、浜口はこう話しています。"}, {"t": 682.3666666666667, "x": "僕は普段、レスリング道場で\n指導をしていますが、教える側も気合を"}, {"t": 687.7333333333333, "x": "入れて集中しなければなりません。"}, {"t": 689.6666666666666, "x": "1987年の引退セレモニーから、\n37年あまりが過ぎていました。"}, {"t": 695.3833333333333, "x": "ここまでの歩みを、日付で並べ直しておきます。"}, {"t": 698.7666666666667, "x": "1963年12月8日、大阪へ戻る。"}, {"t": 702.85, "x": "やがてナニワトレーニングセンターで\nボディビルを始める。"}, {"t": 705.9333333333333, "x": "1969年8月、国際プロレスに入団。"}, {"t": 710.3, "x": "9月20日、高梁市民会館でデビュー。"}, {"t": 713.5166666666667, "x": "1977年3月26日、\n草津とIWA世界タッグ王座を獲得。"}, {"t": 720.0, "x": "1981年8月9日、\n羅臼で国際プロレスが最後の興行。"}, {"t": 725.55, "x": "1981年9月23日、田園コロシアムで\n新日本プロレスのリングへ。"}, {"t": 732.2333333333333, "x": "1985年7月18日、\n寺西とアジアタッグ王座を獲得。"}, {"t": 737.9333333333333, "x": "1987年8月20日、\n両国国技館で引退セレモニー。"}, {"t": 743.2333333333333, "x": "1987年11月1日、\n浅草にトレーニングジムを開設。"}, {"t": 748.8666666666667, "x": "1988年9月15日、\nミスター東京のシニア部門で優勝。"}, {"t": 754.5166666666667, "x": "1990年1月18日、徳山で長州に張り手。"}, {"t": 759.5666666666667, "x": "5月6日、後楽園ホールで復帰。"}, {"t": 762.5666666666667, "x": "1990年から1991年、\nジムの中にプロレスラー育成コースを設ける。"}, {"t": 769.1833333333333, "x": "1991年7月16日、小島聡がデビュー。"}, {"t": 773.9666666666667, "x": "2004年、京子が\nアテネオリンピックで銅メダル。"}, {"t": 777.4833333333333, "x": "2016年4月10日、\n内藤哲也がIWGPヘビー級王座を獲得。"}, {"t": 783.9166666666666, "x": "選手として過ごした18年と、\n育てる側に回ってからの年月が、"}, {"t": 788.6666666666666, "x": "1本の線でつながっています。"}, {"t": 790.9333333333333, "x": "ここまでの日付を並べ直すと、\n1本の筋が浮かび上がってきます。"}, {"t": 795.45, "x": "浜口がプロレスラーになれたきっかけは、\n大阪のジムの会長が、何のツテもない若者の"}, {"t": 801.6166666666667, "x": "練習をじっと見ていてくれたことでした。"}, {"t": 803.8666666666667, "x": "その出会いがなければ自分は\nプロレスラーになれなかった、と"}, {"t": 807.7166666666667, "x": "浜口自身が振り返っています。"}, {"t": 809.8666666666667, "x": "浅草のジムで浜口が実際にしたのは、\nプロレスラーを目指す若者からお金を"}, {"t": 815.1333333333333, "x": "取らずに、道を開くことでした。"}, {"t": 817.5, "x": "格闘技の実績も身長も問わないという方針には、\nツテも実績も持たなかったかつての"}, {"t": 823.2166666666667, "x": "自分の姿が重なって見えます。"}, {"t": 825.2333333333333, "x": "1990年に長州のリングへ乱入したときも、\n浜口は恩返しという言葉を口にしていました。"}, {"t": 832.1333333333333, "x": "道場を始めた理由についても、\nプロレスへの恩返しだったと伝えられています。"}, {"t": 837.2666666666667, "x": "さようならと告げてリングを去った男は、\nそのあともリングの外側からプロレスへ"}, {"t": 842.4, "x": "何かを返し続けていたことになります。"}, {"t": 844.7333333333333, "x": "育てる側に回ったのは、\nプロレスから離れるためではなく、"}, {"t": 848.5333333333333, "x": "自分が受け取ったものを次の世代へ\n渡すための選択だったのかもしれません。"}, {"t": 853.55, "x": "ここまで、確認できた日付と\n証言だけでアニマル浜口という人物の"}, {"t": 858.3166666666667, "x": "道のりを追ってきました。"}, {"t": 859.6833333333333, "x": "最後までご覧いただき、感謝申し上げます。"}, {"t": 862.9666666666667, "x": "お気に召しましたら、チャンネル登録と\n高評価にご協力ください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
