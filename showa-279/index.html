<style>

<script>
const D={"name": "猪木アリ戦の録画放送", "file": "279_編集用", "dur": 928.41665625, "segs": [], "subs": [{"t": 0.0, "x": "1976年6月26日、東京の日本武道館。"}, {"t": 5.2, "x": "午前11時50分に、ゴングが鳴りました。"}, {"t": 8.566666666666666, "x": "リングにいたのはアントニオ猪木と\nモハメド・アリです。"}, {"t": 11.5, "x": "世紀の一戦と呼ばれた試合でした。"}, {"t": 13.916666666666666, "x": "映像は衛星で海の向こうへ生中継されています。"}, {"t": 17.366666666666667, "x": "ところが、このとき日本の\nテレビに試合は映っていません。"}, {"t": 21.2, "x": "放送局のNETが流したのは、\n午後1時からの録画でした。"}, {"t": 25.683333333333334, "x": "世紀の一戦は、日本では\n生中継されなかったのです。"}, {"t": 29.7, "x": "実況を担当したのはアナウンサーの舟橋慶一です。"}, {"t": 33.18333333333333, "x": "舟橋はのちにこう話しています。"}, {"t": 35.4, "x": "番組編成の問題で、生中継する枠を\n確保することができなかったんです。"}, {"t": 40.85, "x": "NETは3日前の前夜祭なら生中継していました。"}, {"t": 44.6, "x": "その年の2月の猪木の試合も、生中継しています。"}, {"t": 48.56666666666667, "x": "海の向こうに生中継された試合を、なぜ日本では\n遅らせて流したのでしょうか？"}, {"t": 54.15, "x": "そして当日の2回の放送のあと、\n映像はどこへ消えたのでしょうか？"}, {"t": 59.1, "x": "今回は試合の中身ではなく、\n放送の記録を追います。"}, {"t": 63.05, "x": "新聞の記事と、放送席にいた人の\n言葉をもとに辿っていきます。"}, {"t": 67.58333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 70.08333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 75.66666666666667, "x": "NETは、いまのテレビ朝日です。"}, {"t": 78.53333333333333, "x": "当時の名前は日本教育テレビといいました。"}, {"t": 81.38333333333334, "x": "舟橋慶一は1962年にNETへ入っています。"}, {"t": 85.7, "x": "プロレス中継のワールドプロレスリングが\n始まったのは1969年7月2日です。"}, {"t": 91.53333333333333, "x": "最初の枠は水曜の夜9時でした。"}, {"t": 94.0, "x": "舟橋はその7月から実況を担当しました。"}, {"t": 97.2, "x": "1973年4月からは新日本プロレスの中継です。"}, {"t": 101.61666666666666, "x": "枠は金曜の夜8時でした。"}, {"t": 103.73333333333333, "x": "舟橋はこの枠の実況も務めました。"}, {"t": 106.38333333333334, "x": "NETはボクシングの世界戦にも\n手を伸ばしていました。"}, {"t": 109.86666666666666, "x": "1973年9月、日本武道館で\n世界ヘビー級の王座戦がありました。"}, {"t": 115.85, "x": "NETはこれを生中継しています。"}, {"t": 118.45, "x": "翌年、キンシャサでのアリの試合では\n中継の独占契約を結びました。"}, {"t": 123.5, "x": "武道館から世界戦を生中継した実績が、\nすでにあったのです。"}, {"t": 128.13333333333333, "x": "話の始まりは1本の国際電話でした。"}, {"t": 131.01666666666668, "x": "1975年1月20日、月曜日の昼過ぎです。"}, {"t": 135.53333333333333, "x": "電話をかけたのは八田一朗でした。"}, {"t": 137.93333333333334, "x": "日本アマチュアレスリング協会の会長です。"}, {"t": 140.81666666666666, "x": "かけてきた場所はニューヨークです。"}, {"t": 142.78333333333333, "x": "現地は夜の10時過ぎでした。"}, {"t": 144.78333333333333, "x": "受けたのはNETの運動部です。"}, {"t": 147.03333333333333, "x": "電話を取り次いだのは舟橋でした。"}, {"t": 149.35, "x": "相手は運動部長です。"}, {"t": 151.08333333333334, "x": "この部長は、ワールドプロレスリングの\n初代のプロデューサーでした。"}, {"t": 155.3, "x": "大相撲ダイジェストを生んだ人物でもあります。"}, {"t": 158.15, "x": "話の中身はこうでした。"}, {"t": 159.95, "x": "ニューヨークのレストランで、\nアリの側から日本での試合の話が出た。"}, {"t": 164.6, "x": "アリが日本で闘うのは初めてではありません。"}, {"t": 167.48333333333332, "x": "1972年4月1日に\n日本武道館で試合をしています。"}, {"t": 172.25, "x": "その調印式の場所は、\nロッキー青木の店のベニハナでした。"}, {"t": 176.45, "x": "青木はレスリングの出身で、\n師匠は八田一朗です。"}, {"t": 180.43333333333334, "x": "試合のあと、アリは青木に尋ねたとされています。"}, {"t": 184.05, "x": "自分と戦える格闘家が、日本にいないか。"}, {"t": 187.26666666666668, "x": "この話を知った舟橋は、\n本当にやるのかなと半信半疑でした。"}, {"t": 191.98333333333332, "x": "運動部長はアリの相手を考えます。"}, {"t": 194.53333333333333, "x": "最初に思い浮かべたのは猪木ではありません。"}, {"t": 197.31666666666666, "x": "現役の力士でした。"}, {"t": 198.8, "x": "部長はこの案をNETの常務に持ち込みます。"}, {"t": 201.96666666666667, "x": "朝日新聞の出身で、\n局の中で強い力を持つ人物です。"}, {"t": 206.61666666666667, "x": "返ってきた言葉が残っています。"}, {"t": 208.78333333333333, "x": "でかしたザト、よくやった。"}, {"t": 210.95, "x": "その話進めろ。"}, {"t": 212.33333333333334, "x": "しかし、別の常務は釘を刺しました。"}, {"t": 215.33333333333334, "x": "ウチには日テレやTBSほどの体力はないんだぞ。"}, {"t": 218.71666666666667, "x": "猪木はこの時期からNETに通い始めます。"}, {"t": 221.7, "x": "週刊アサヒ芸能は、その日付を\n巡業の日程と照らし合わせました。"}, {"t": 226.7, "x": "1975年2月7日、13日、\n20日、27日と3月1日です。"}, {"t": 233.9, "x": "どれも巡業の合間の日でした。"}, {"t": 235.91666666666666, "x": "猪木は運動部長に何度も頭を下げます。"}, {"t": 238.76666666666668, "x": "部長、よろしくお願いしますよ。"}, {"t": 241.43333333333334, "x": "部長の答えは、\n頼まれる覚えがないというものでした。"}, {"t": 245.15, "x": "やがて、常務から部長に電話が入ります。"}, {"t": 248.45, "x": "相手は猪木でもいいんじゃないか、なあ。"}, {"t": 251.51666666666668, "x": "ある関係者は、この常務に\nついてこう証言しています。"}, {"t": 255.35, "x": "最初から猪木さんしか念頭になかったんです。"}, {"t": 258.28333333333336, "x": "常務はニューヨーク支局を動かしていました。"}, {"t": 261.01666666666665, "x": "アリとの接触を調べさせたのです。"}, {"t": 263.35, "x": "舟橋も、この常務が\n猪木をかわいがっていたと話しています。"}, {"t": 267.46666666666664, "x": "力士の話は、相撲の協会の\n側から断られて消えました。"}, {"t": 271.8333333333333, "x": "1975年6月9日、\nアリが羽田空港に着きます。"}, {"t": 276.73333333333335, "x": "ここで猪木の挑戦状が渡されました。"}, {"t": 279.26666666666665, "x": "書かれていたのは次の言葉です。"}, {"t": 281.31666666666666, "x": "十分間でお前をマットに沈めてみせる。"}, {"t": 284.06666666666666, "x": "翌日の日刊スポーツは、\nNETの計画を伝えています。"}, {"t": 288.55, "x": "日付は12月31日の夜でした。"}, {"t": 291.4, "x": "紅白歌合戦の強力な裏番組として\nぶつけるという内容です。"}, {"t": 295.71666666666664, "x": "けれども、その年の大みそかに試合はありません。"}, {"t": 299.18333333333334, "x": "この枠の計画は消えました。"}, {"t": 301.1666666666667, "x": "1976年2月6日、金曜日の日本武道館。"}, {"t": 305.9, "x": "猪木の相手はウィレム・ルスカでした。"}, {"t": 307.98333333333335, "x": "ミュンヘン五輪の柔道の王者です。"}, {"t": 310.23333333333335, "x": "NETはこの試合を生中継しています。"}, {"t": 313.2, "x": "題は格闘技世界一決定戦でした。"}, {"t": 315.9166666666667, "x": "4か月後のアリ戦にも、同じ題が使われます。"}, {"t": 319.3666666666667, "x": "ここまでは金曜の生放送の形でした。"}, {"t": 322.15, "x": "舟橋はこの夜の実況をこう語ります。"}, {"t": 324.8833333333333, "x": "私が実況で強調したのは、\nプロレスvs柔道という論点。"}, {"t": 329.56666666666666, "x": "1976年3月25日、ニューヨーク。"}, {"t": 333.6666666666667, "x": "猪木とアリの試合の契約が結ばれました。"}, {"t": 336.43333333333334, "x": "アリ側の報酬は610万ドルと報じられました。"}, {"t": 339.8666666666667, "x": "当時の日本円でおよそ18億3000万円です。"}, {"t": 343.3333333333333, "x": "猪木側は350万ドルと報じられています。"}, {"t": 346.5833333333333, "x": "3月31日には、帰国した猪木が\nルールを明かしました。"}, {"t": 350.96666666666664, "x": "1回3分の15回戦です。"}, {"t": 353.28333333333336, "x": "毎日新聞は、アリへの\n支払いの内訳も伝えています。"}, {"t": 357.43333333333334, "x": "試合の前に180万ドルでした。"}, {"t": 360.06666666666666, "x": "試合のあとに120万ドルです。"}, {"t": 362.45, "x": "残りは310万ドルです。"}, {"t": 364.5833333333333, "x": "海外の劇場の中継の収入から払う予定でした。"}, {"t": 368.1333333333333, "x": "当時の新日本の選手だった藤原喜明は、のちに\nこう語っています。"}, {"t": 373.03333333333336, "x": "新日本プロレスの財産じゃない、借金ですよ。"}, {"t": 376.8833333333333, "x": "主催に名前を連ねたのは3者です。"}, {"t": 379.35, "x": "新日本プロレスと\n東京スポーツ新聞社、そしてNETでした。"}, {"t": 384.06666666666666, "x": "放送局は中継するだけの立場ではありません。"}, {"t": 387.2, "x": "興行の当事者でもあったのです。"}, {"t": 389.3333333333333, "x": "1976年6月16日、アリが日本に着きます。"}, {"t": 394.1666666666667, "x": "一行は総勢30人でした。"}, {"t": 396.46666666666664, "x": "試合まで10日です。"}, {"t": 398.0, "x": "この日の記者会見は、NHKの\nニュース番組も取り上げました。"}, {"t": 402.53333333333336, "x": "舟橋はこの10日間、\nカメラの前のアリを見ています。"}, {"t": 406.43333333333334, "x": "常に饒舌で、猪木を挑発したり\nおどけたりしていました。"}, {"t": 410.45, "x": "ところが取材が終わると、\n1人で寡黙になったと話しています。"}, {"t": 414.48333333333335, "x": "舟橋はその姿を見て、\nプロスポーツマンだと感じました。"}, {"t": 418.5, "x": "2人とも、カメラにどう映るかを\n考えていたとも話しています。"}, {"t": 422.71666666666664, "x": "猪木の言葉も舟橋は覚えていました。"}, {"t": 425.2, "x": "とにかく、やるしかない。"}, {"t": 427.4166666666667, "x": "6月18日の計量は、\n日本外国特派員協会で行われました。"}, {"t": 432.5, "x": "そして6月23日、水曜日です。"}, {"t": 435.78333333333336, "x": "朝日新聞の番組表に、この夜の\nNETの番組が載っています。"}, {"t": 440.75, "x": "水曜スペシャルの夜7時30分の枠です。"}, {"t": 443.8666666666667, "x": "アントニオ猪木対モハメド・アリ前夜祭実況生中継。"}, {"t": 447.56666666666666, "x": "本番の3日前の催しは、\n夜の7時台に生中継されました。"}, {"t": 452.3833333333333, "x": "6月25日の夜には、フジテレビの\n番組も2人を取り上げています。"}, {"t": 457.3, "x": "ここに1枚の写真があります。"}, {"t": 459.3666666666667, "x": "1976年6月26日、\n日本武道館で撮られたものです。"}, {"t": 464.93333333333334, "x": "猪木とアリがリングの上にいます。"}, {"t": 467.01666666666665, "x": "ルールは当日の朝まで揉めていました。"}, {"t": 469.46666666666664, "x": "合意したのは、その日の早朝です。"}, {"t": 472.21666666666664, "x": "席の値段も記録に残っています。"}, {"t": 474.51666666666665, "x": "一番高い席は30万円でした。"}, {"t": 477.1166666666667, "x": "次が10万円、そして8万円、6万円と続きます。"}, {"t": 482.18333333333334, "x": "一番安い5000円の席は、\n試合の1時間前に売り切れました。"}, {"t": 486.81666666666666, "x": "毎日新聞の夕刊がそう伝えています。"}, {"t": 489.65, "x": "全米では生放送されました。"}, {"t": 491.8333333333333, "x": "劇場などで有料の映像を流す形です。"}, {"t": 494.8333333333333, "x": "アメリカの興行師たちも、\nこの収益を見込んで関わろうとしました。"}, {"t": 499.3666666666667, "x": "しかし、その見込みは外れています。"}, {"t": 502.21666666666664, "x": "雑誌Numberは、アメリカの\nプライムタイムに合わせたと書いています。"}, {"t": 506.48333333333335, "x": "37か国に衛星で\n生中継されたという記事もあります。"}, {"t": 510.46666666666664, "x": "見 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();

a.ontimeupdate=()=>paint(a.currentTime);

document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
