<script>
const D={"name": "大熊元司", "file": "239_編集用", "dur": 820.45, "segs": [], "subs": [{"t": 0.0, "x": "1992年12月4日、日本武道館。"}, {"t": 4.15, "x": "6人タッグマッチのリングに、\n身長2メートルを超える大男が立っていました。"}, {"t": 9.283333333333333, "x": "アンドレ・ザ・ジャイアントです。"}, {"t": 10.883333333333333, "x": "その隣には、ジャイアント馬場とラッシャー木村。"}, {"t": 14.233333333333333, "x": "向かい合うのは、悪役商会と呼ばれた3人でした。"}, {"t": 17.916666666666668, "x": "試合の最後、アンドレはロープを\nつかんで体を支えながら、"}, {"t": 21.933333333333334, "x": "ヒップドロップで1人の男をフォールします。"}, {"t": 24.783333333333335, "x": "フォールされたのは、51歳の大熊元司でした。"}, {"t": 28.433333333333334, "x": "この試合は、大熊元司にとって生涯最後の\n試合になりました。"}, {"t": 32.96666666666667, "x": "イメージ映像"}, {"t": 32.96666666666667, "x": "23日後の12月27日、大熊は現役の\nまま、急性腎不全で亡くなります。"}, {"t": 39.8, "x": "そして翌月、アンドレもこの世を去りました。"}, {"t": 42.86666666666667, "x": "2人の大男の最後の試合は、\n同じリングの上だったのです。"}, {"t": 47.2, "x": "イメージ映像"}, {"t": 47.2, "x": "30年にわたって悪役を務めた男は、なぜ最後の\n日まで、リングを降りなかったのでしょうか？"}, {"t": 54.083333333333336, "x": "今回は大熊元司という1人の\nプロレスラーの足跡に迫っていきます。"}, {"t": 58.483333333333334, "x": "具体的な日付と数字、そして仲間たちの\n証言をもとに辿っていきます。"}, {"t": 63.55, "x": "最後までご覧いただければ幸いです。"}, {"t": 66.05, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 71.63333333333334, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 75.41666666666667, "x": "イメージ映像"}, {"t": 75.41666666666667, "x": "大熊元司は1941年12月18日、\n埼玉県草加市に生まれました。"}, {"t": 81.85, "x": "中学校を卒業すると、\n大相撲の伊勢ヶ濱部屋に入門します。"}, {"t": 86.63333333333334, "x": "1957年5月場所、\n大熊の四股名で初土俵を踏みました。"}, {"t": 91.71666666666667, "x": "1958年11月場所からは、\n四股名を崎錦に改めています。"}, {"t": 97.31666666666666, "x": "しかし番付は伸び悩み、最高位は幕下93枚目。"}, {"t": 101.8, "x": "1962年5月場所を最後に、\n相撲を廃業しました。"}, {"t": 106.5, "x": "次の道は、すぐに決まります。"}, {"t": 108.95, "x": "廃業して間もない1962年5月、\n力道山が率いる日本プロレスに入門しました。"}, {"t": 115.63333333333334, "x": "イメージ映像"}, {"t": 115.63333333333334, "x": "そしてわずか1か月後、\n1962年6月5日、名古屋市の金山体育館で"}, {"t": 122.26666666666667, "x": "北沢幹之を相手にデビューします。"}, {"t": 124.51666666666667, "x": "リングの外では、ジャイアント馬場の\n付き人を務めました。"}, {"t": 128.35, "x": "2代目の付き人で、初代は\nマシオ駒だったと記録されています。"}, {"t": 132.71666666666667, "x": "デビュー当初のリングネームは、\n大熊熊五郎でした。"}, {"t": 136.43333333333334, "x": "本名の大熊元司に戻したきっかけは、\nプロ野球だったといいます。"}, {"t": 141.05, "x": "イメージ映像"}, {"t": 141.05, "x": "大熊は大のジャイアンツファンで、\n全選手の背番号を言い当てられるほどでした。"}, {"t": 146.08333333333334, "x": "イメージ映像"}, {"t": 146.08333333333334, "x": "そのジャイアンツで、同じ元司という名前の\n藤田元司が活躍したことをきっかけに、"}, {"t": 151.71666666666667, "x": "本名に戻したと伝えられています。"}, {"t": 154.26666666666668, "x": "そして、若手時代の大熊には、\n1つの事件が記録されています。"}, {"t": 159.2, "x": "イメージ映像"}, {"t": 159.2, "x": "1965年11月28日、\n韓国で開かれた5か国親善プロレス試合。"}, {"t": 165.75, "x": "このとき大熊は23歳でした。"}, {"t": 168.13333333333333, "x": "イメージ映像"}, {"t": 168.13333333333333, "x": "大熊は、韓国のレスラー張永哲と対戦しました。"}, {"t": 172.03333333333333, "x": "記録によれば、この試合で\n大熊は勝敗の取り決めを破り、"}, {"t": 176.18333333333334, "x": "通常のプロレスではあり得ないほど強い力で\n逆エビ固めをかけたとされています。"}, {"t": 181.53333333333333, "x": "イメージ映像"}, {"t": 181.53333333333333, "x": "すると、張の側の10人ほどが\nリングに乱入し、大熊を殴打しました。"}, {"t": 186.95, "x": "警察沙汰になったこの騒ぎは、\n大熊リンチ事件と呼ばれています。"}, {"t": 191.56666666666666, "x": "イメージ映像"}, {"t": 191.56666666666666, "x": "取り調べの中でプロレスの内幕が\n語られたとされ、韓国でのプロレス人気が"}, {"t": 196.53333333333333, "x": "落ち込む一因になったとも伝えられています。"}, {"t": 199.13333333333333, "x": "イメージ映像"}, {"t": 199.13333333333333, "x": "1967年、大熊は同じ元力士の\nグレート小鹿とアメリカへ渡ります。"}, {"t": 205.08333333333334, "x": "2人は日本人の悪役タッグ、\nライジング・サンズとして南部を回りました。"}, {"t": 210.18333333333334, "x": "イメージ映像"}, {"t": 210.18333333333334, "x": "1967年10月には、テネシー地区の\nNWA世界タッグ王座を獲得しています。"}, {"t": 217.0, "x": "しかし大熊はホームシックにかかり、\n1968年に1人で帰国しました。"}, {"t": 222.73333333333332, "x": "それでも、海外での仕事はここで終わりません。"}, {"t": 226.2, "x": "イメージ映像"}, {"t": 226.2, "x": "1971年、大熊は再びアメリカへ渡り、\nテキサス州アマリロで"}, {"t": 232.11666666666667, "x": "マシオ駒とタッグを組みます。"}, {"t": 233.86666666666667, "x": "イメージ映像"}, {"t": 233.86666666666667, "x": "1971年11月25日には、\nNWAウエスタン・ステーツ・タッグ王座を"}, {"t": 240.33333333333334, "x": "獲得しました。"}, {"t": 241.31666666666666, "x": "1974年にはカナダのマリタイム地区で、\nグレート・クマの名前で戦っています。"}, {"t": 247.13333333333333, "x": "この地区の看板タイトル、\n北米ヘビー級王座を2度獲得しました。"}, {"t": 251.75, "x": "アメリカでの予定にまつわる、\nこんな話も残っています。"}, {"t": 255.63333333333333, "x": "プロモーターから渡された予定表に、\nOFF、休日と書かれた日がありました。"}, {"t": 261.1666666666667, "x": "イメージ映像"}, {"t": 261.1666666666667, "x": "大熊はそれを見て、試合が組まれたと大喜びし、\nOFFという町を地図で探したといいます。"}, {"t": 267.6, "x": "イメージ映像"}, {"t": 267.6, "x": "全日本プロレスの和田京平レフェリーが、\n東京スポーツの連載で紹介している話です。"}, {"t": 273.5833333333333, "x": "このカナダ遠征の2年前、\n大熊の所属は大きく変わっていました。"}, {"t": 278.3833333333333, "x": "1972年8月、大熊はマシオ駒とともに\n日本プロレスを離れ、馬場が立ち上げた新団体、"}, {"t": 286.1, "x": "全日本プロレスに移ります。"}, {"t": 288.3666666666667, "x": "1972年10月21日、旗揚げ前夜祭で、\n大熊はフレッド・ブラッシーに反則勝ち。"}, {"t": 295.9166666666667, "x": "翌日の旗揚げ第1戦では、マシオ駒との\nタッグがセミファイナルに出場しました。"}, {"t": 301.53333333333336, "x": "そして、グレート小鹿との極道コンビが、\n全日本のリングで復活します。"}, {"t": 307.03333333333336, "x": "イメージ映像"}, {"t": 307.03333333333336, "x": "1976年3月26日、\nソウル特別市文化体育館で、"}, {"t": 312.6333333333333, "x": "アジアタッグ王座を獲得しました。"}, {"t": 315.26666666666665, "x": "1977年6月16日には後楽園ホール、\n1978年2月22日には岐阜市民センター、"}, {"t": 323.8333333333333, "x": "イメージ映像"}, {"t": 323.8333333333333, "x": "1979年5月31日には能代市体育館で、\n王座に返り咲いています。"}, {"t": 330.5, "x": "獲得は通算4回。"}, {"t": 332.28333333333336, "x": "イメージ映像"}, {"t": 332.28333333333336, "x": "最後の王座は、1981年5月23日まで、\nおよそ2年間守りました。"}, {"t": 339.03333333333336, "x": "イメージ映像"}, {"t": 339.03333333333336, "x": "この年の暮れには、\n世界最強タッグ決定リーグ戦にも"}, {"t": 342.9166666666667, "x": "初めて出場し、名だたる外国人の\nタッグチームと当たっています。"}, {"t": 347.45, "x": "極道コンビは、アジアタッグ王座の\n代名詞とまで呼ばれるようになります。"}, {"t": 352.3666666666667, "x": "イメージ映像"}, {"t": 352.3666666666667, "x": "和田京平によれば、当時のアジアタッグの\nベルトは、長さの違う2本がありました。"}, {"t": 358.2, "x": "アンコ型の体の大きな人用と、背の高い人用です。"}, {"t": 362.2, "x": "和田は、それこそ極道コンビがその地位を\n確立した証明だ、と語っています。"}, {"t": 367.85, "x": "体つきも、2人は対照的でした。"}, {"t": 370.65, "x": "イメージ映像"}, {"t": 370.65, "x": "身長185センチ、体重115キロの小鹿は、\n殴る蹴るのラフファイトが専門。"}, {"t": 377.43333333333334, "x": "イメージ映像"}, {"t": 377.43333333333334, "x": "身長179センチ、体重130キロの\n大熊は、体重を乗せた頭突きや"}, {"t": 383.85, "x": "ボディプレスを得意にしていました。"}, {"t": 385.7, "x": "ここから、仲間たちが見ていた大熊の姿です。"}, {"t": 389.15, "x": "イメージ映像"}, {"t": 389.15, "x": "和田京平は、駆け出しのころに\nレフェリングの基礎を教えてくれたのは"}, {"t": 393.4166666666667, "x": "極道コンビだったと語っています。"}, {"t": 395.4166666666667, "x": "イメージ映像"}, {"t": 395.4166666666667, "x": "タッチをした、しないのやり取りや、\nレフェリーの死角を突く動き。"}, {"t": 399.96666666666664, "x": "イメージ映像"}, {"t": 399.96666666666664, "x": "アメリカで覚えてきたであろう\nそうした駆け引きを、若い"}, {"t": 403.51666666666665, "x": "レフェリーに教えていたというのです。"}, {"t": 405.5, "x": "そして大熊について、こう振り返っています。"}, {"t": 408.8666666666667, "x": "とにかくうまい人だった。"}, {"t": 410.46666666666664, "x": "背中は畳みたいだし、負けっぷりがいい。"}, {"t": 413.78333333333336, "x": "常に中盤の試合で、今日のお客さんを\nどう喜ばせるかを考えていた。"}, {"t": 418.8666666666667, "x": "イメージ映像"}, {"t": 418.8666666666667, "x": "ある試合では、逆エビ固めで\nギブアップを奪ったあとも、"}, {"t": 422.8833333333333, "x": "ゴングが鳴っても技をほどきませんでした。"}, {"t": 425.6333333333333, "x": "イメージ映像"}, {"t": 425.6333333333333, "x": "和田が反則カウントを数え始めると、\nカウントは5まで進み、"}, {"t": 429.8666666666667, "x": "裁定は大熊の反則負けに変わりました。"}, {"t": 433.05, "x": "イメージ映像"}, {"t": 433.05, "x": "控室で理由を聞かれた大熊は、お客さんが\n喜べばいいんだ、と笑ったといいます。"}, {"t": 439.1, "x": "大熊には、もう1つの役目もありました。"}, {"t": 442.1666666666667, "x": "イメージ映像"}, {"t": 442.1666666666667, "x": "和田によれば、新しい外国人選手が来ると、\n馬場はまず頑丈な大熊か小鹿を当てていました。"}, {"t": 449.05, "x": "ブルーザー・ブロディが初めて来たときも、\n大熊を簡単に投げ捨てて"}, {"t": 453.0833333333333, "x": "ニードロップを決めたことで、\nこれは上で使おう、となったといいます。"}, {"t": 457.7, "x": "いわば、新しい選手の力を測る物差しでした。"}, {"t": 461.5, "x": "スポーツジャーナリストの二宮清純も、\nグレート小鹿への取材をもとに、"}, {"t": 466.18333333333334, "x": "イメージ映像"}, {"t": 466.18333333333334, "x": "極道コンビには他団体との対抗戦や、\n初めて来日する外国人選手の力量を"}, {"t": 472.3333333333333, "x": "測る役目があったと書いています。"}, {"t": 474.26666666666665, "x": "乱闘を止めに入って、スタン・ハンセンの\nラリアットを受けて倒れるのも、大熊か、"}, {"t": 479.73333333333335, "x": "若手時代の三沢光晴だったと和田は語っています。"}, {"t": 483.4, "x": "受け身がうまい選手だけが、\nその役を任されていたというのです。"}, {"t": 487.6166666666667, "x": "そのハンセン自身も、自著の中で\n大熊についてこう書いています。"}, {"t": 492.05, "x": "私は彼に対して、何度も何度も\nラリアットを食らわせたものだ。"}, {"t": 496.35, "x": "イメージ映像"}, {"t": 496.35, "x": "私の左腕が、ちょうど彼の顎に\n当たるくらいの身長だったから、"}, {"t": 500.8666666666667, "x": "相当ダメージは大きかったはずだ。"}, {"t": 503.4, "x": "イメージ映像"}, {"t": 503.4, "x": "ラリアットがヒットしたときは\n骨同士がぶつかり合うような感触で、"}, {"t": 507.31666666666666, "x": "イメージ映像"}, {"t": 507.31666666666666, "x": "私の左腕もかなりひどい痛みが走ったのだから、\n大熊はそれ以上に痛かったことだろう。"}, {"t": 513.6166666666667, "x": "イメージ映像"}, {"t": 513.6166666666667, "x": "それでも彼は一度も愚痴ったり、\n文句を言うことはなかった。"}, {"t": 517.7, "x": "彼はまさに私と同じオールドスクール、\n昔気質のレスラーだった。"}, {"t": 522.2166666666667, "x": "リングの外の大熊は、\n大酒飲みとして知られていました。"}, {"t": 526.0166666666667, "x": "イメージ映像"}, {"t": 526.0166666666667, "x": "巡業で移動中の食堂車で、車内の酒を全部\n飲み干してしまったという話が残っています。"}, {"t": 532.2833333333333, "x": "イメージ映像"}, {"t": 532.2833333333333, "x": "和田によれば、馬場の家に上がっては外国の\n高いウイスキーを飲み干し、夫人の元子に、"}, {"t": 538.3, "x": "イメージ映像"}, {"t": 538.3, "x": "この家にはもう酒はねえのか、と\n叫んだこともありました。"}, {"t": 542.5, "x": "元子は、熊さんだから仕方ないよね、と\n笑っていたといいます。"}, {"t": 547.1833333333333, "x": "和田は、馬場さんにはかわいがられていた、とも\n語っています。"}, {"t": 551.5666666666667, "x": "イメージ映像"}, {"t": 551.5666666666667, "x": "地方では酔って隣の客と仲良くなり、\n勘定を払わせたこともあれば、"}, {"t": 556.4166666666666, "x": "急に屋台を引いて走り出したこともありました。"}, {"t": 559.6, "x": "イメージ映像"}, {"t": 559.6, "x": "ハワイのビーチで焼酎を飲み、\n警官に注意されたこともあったそうです。"}, {"t": 564.4833333333333, "x": "イメージ映像"}, {"t": 564.4833333333333, "x": "40年以上前の和田自身の結婚式でも、\n大熊に大暴れされたと振り返っています。"}, {"t": 570.65, "x": "一方で、和田はこんな話も明かしています。"}, {"t": 573.9666666666667, "x": "イメージ映像"}, {"t": 573.9666666666667, "x": "娘が6歳か7歳になったころ、大熊は、\n子どもの自転車が余っているから"}, {"t": 579.3166666666667, "x": "持って行ってやる、と言いました。"}, {"t": 581.45, "x": "イメージ映像"}, {"t": 581.45, "x": "そして五反田の自宅から、白金台の和田の\n家まで、自転車を自分で引いて届け、"}, {"t": 587.3833333333333, "x": "そのまま歩いて帰ったといいます。"}, {"t": 589.7833333333333, "x": "和田は大熊を、誰からも\n愛される人だった、と表現しています。"}, {"t": 595.1333333333333, "x": "イメージ映像"}, {"t": 595.1333333333333, "x": "1988年、グレート小鹿の引退によって、\n極道コンビは解散します。"}, {"t": 601.6833333333333, "x": "その年の2月26日、滋賀県の栗東町民体育館。"}, {"t": 606.3333333333334, "x": "大熊は、1人の新人の\nデビュー戦の相手を務めました。"}, {"t": 610.2833333333333, "x": "小橋健太、のちの小橋建太です。"}, {"t": 613.05, "x": "前の年の11 334, "x": "新しい外国人選手の力を測り、\nハンセンのラリアットを受け、"}, {"t": 758.6166666666667, "x": "イメージ映像"}, {"t": 758.6166666666667, "x": "新人のデビュー戦の壁になり、\n晩年は悪役商会として笑いを運びました。"}, {"t": 764.2166666666667, "x": "お客さんが喜べばいいんだ。"}, {"t": 766.1166666666667, "x": "それが和田京平の記憶する大熊の口ぐせでした。"}, {"t": 769.5166666666667, "x": "イメージ映像"}, {"t": 769.5166666666667, "x": "ハンセンのラリアットを何百発浴びても、\n大熊は一度も愚痴をこぼさなかったと"}, {"t": 774.5, "x": "ハンセン自身が書き残しています。"}, {"t": 776.5166666666667, "x": "勝ち負けより客席の反応を選び続けた30年が、\nこの2人の言葉に残っています。"}, {"t": 782.45, "x": "アンドレ・ザ・ジャイアントの命が尽きたのは、\nその翌月、1993年1月のことでした。"}, {"t": 789.3, "x": "イメージ映像"}, {"t": 789.3, "x": "父の葬儀でフランスへ渡り、そのまま宿泊先の\nホテルで倒れたと伝えられています。享年46。"}, {"t": 796.4666666666667, "x": "武道館で最後にリングを共にした2人は、\nこうして年をまたがず世を去りました。"}, {"t": 801.6666666666666, "x": "イメージ映像"}, {"t": 801.6666666666666, "x": "大熊元司を、脇役で終わった力士崩れではなく、\n30年間現場を支え続けた"}, {"t": 807.9, "x": "プロレスラーとして覚えていただけたら\n嬉しいです。"}, {"t": 810.7, "x": "動画をご覧いただき、ありがとうございました。"}, {"t": 813.85, "x": "次の物語も追いたいと思われた方は、\nチャンネル登録と高評価で教えてください。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
