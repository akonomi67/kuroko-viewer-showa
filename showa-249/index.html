<script>
const D={"name": "ヒロ・マツダ", "file": "249_編集用", "dur": 873.2833125, "segs": [], "subs": [{"t": 0.0, "x": "ダニー・ホッジという男は、およそ4年の\nあいだ1本のベルトを誰にも渡しませんでした。"}, {"t": 5.616666666666666, "x": "NWA世界ジュニアヘビー級のベルトです。"}, {"t": 8.633333333333333, "x": "巻いたのは1960年7月22日、\nオクラホマシティです。"}, {"t": 13.466666666666667, "x": "そこから1度も手放していません。"}, {"t": 15.583333333333334, "x": "その連続が止まったのは、\n1964年7月11日のことです。"}, {"t": 20.9, "x": "場所はアメリカのフロリダ州タンパでした。"}, {"t": 23.433333333333334, "x": "止めた男は、横浜で生まれた日本人です。"}, {"t": 26.766666666666666, "x": "リングネームはヒロ・マツダ。"}, {"t": 28.4, "x": "このとき26歳でした。"}, {"t": 30.233333333333334, "x": "ジャイアント馬場がNWA世界ヘビー級の\nベルトを巻くのは、1974年12月2日です。"}, {"t": 37.31666666666667, "x": "場所は鹿児島でした。"}, {"t": 38.8, "x": "その10年前のことです。"}, {"t": 40.6, "x": "NWAが「世界」と名付けたベルトを、\n日本人がすでに腰に巻いていました。"}, {"t": 45.5, "x": "なぜ横浜の野球少年は、アメリカ南部で\nそのベルトを巻くことになったのでしょうか。"}, {"t": 51.15, "x": "今回はヒロ・マツダという男の歩みを、\n記録に残る日付と数字でたどっていきます。"}, {"t": 56.7, "x": "最後までご覧いただければ幸いです。"}, {"t": 59.18333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 64.76666666666667, "x": "ヒロ・マツダの本名は、小島泰弘といいます。"}, {"t": 68.16666666666667, "x": "1937年7月22日に生まれました。"}, {"t": 71.88333333333334, "x": "生まれたのは神奈川県横浜市の鶴見区です。"}, {"t": 74.9, "x": "高校は東京都大田区の荏原高校に進みました。"}, {"t": 78.28333333333333, "x": "野球部ではエースの投手でした。"}, {"t": 80.41666666666667, "x": "プロレスの世界に入ったのは1957年です。"}, {"t": 84.08333333333333, "x": "入った先は、力道山が率いる日本プロレスでした。"}, {"t": 87.95, "x": "しかし小島は、わずか3年でその世界を離れます。"}, {"t": 91.68333333333334, "x": "海外の資料は、その理由を上下関係の\n厳しさへの不満だと伝えています。"}, {"t": 97.0, "x": "別の資料には、力道山と折り合いが\n悪かったという記述もあります。"}, {"t": 101.58333333333333, "x": "どちらにしても、\n記録に残っている事実は1つです。"}, {"t": 105.26666666666667, "x": "1960年4月12日、\n小島泰弘は日本を出ました。"}, {"t": 110.3, "x": "向かった先は南米のペルーです。"}, {"t": 112.45, "x": "同じ1960年、力道山はブラジルで\n17歳の猪木をスカウトしています。"}, {"t": 118.35, "x": "日本を出ていく若者がいました。"}, {"t": 120.48333333333333, "x": "日本へ連れてこられる若者もいました。"}, {"t": 122.95, "x": "それが同じ年だったことになります。"}, {"t": 125.16666666666667, "x": "ペルーで名乗ったリングネームは、\nエルネスト・コジマでした。"}, {"t": 128.76666666666668, "x": "そこから北へ上がり、\nメキシコでもリングに立っています。"}, {"t": 132.51666666666668, "x": "メキシコでは覆面レスラーの英雄、\nエル・サントとも対戦しました。"}, {"t": 137.08333333333334, "x": "1961年、小島はアメリカに入ります。"}, {"t": 141.11666666666667, "x": "このとき現地のプロモーターが付けた名前が\n「マツダ」でした。"}, {"t": 144.4, "x": "グレート・マツダなど、\nいくつかの名前を経ています。"}, {"t": 147.71666666666667, "x": "最後に落ち着いたのがヒロ・マツダです。"}, {"t": 150.13333333333333, "x": "アメリカではカール・ゴッチのもとで\n技術を学んでいます。"}, {"t": 153.48333333333332, "x": "そして1962年、マツダは\nフロリダ州に住まいを定めました。"}, {"t": 158.65, "x": "拠点はタンパです。"}, {"t": 160.03333333333333, "x": "市内には「スポートトリアム」\nという古い会場がありました。"}, {"t": 163.46666666666667, "x": "マツダはそこで若い選手たちに\n稽古もつけるようになります。"}, {"t": 167.08333333333334, "x": "日本を出てから、まだ2年しかたっていません。"}, {"t": 170.23333333333332, "x": "マツダはこのあと、フロリダで長く戦い続けます。"}, {"t": 173.73333333333332, "x": "WWEの公式紹介によると、\n南部ヘビー級王座を4回取っています。"}, {"t": 179.45, "x": "NWAのタッグ王座は、\n合わせて11回取っています。"}, {"t": 183.73333333333332, "x": "ここで、1964年にマツダが\n倒した相手のことを見ておきます。"}, {"t": 188.75, "x": "ダニー・ホッジは1932年に\nオクラホマ州で生まれました。"}, {"t": 192.86666666666667, "x": "1952年のヘルシンキ・オリンピックにも\n出場しています。"}, {"t": 197.11666666666667, "x": "1956年のメルボルン・オリンピックでは、\n銀メダルを取りました。"}, {"t": 201.95, "x": "種目はレスリングの\nフリースタイル、ミドル級です。"}, {"t": 205.61666666666667, "x": "1958年にはボクシングにも出ています。"}, {"t": 208.98333333333332, "x": "シカゴ・ゴールデングローブの\nヘビー級を制しました。"}, {"t": 212.05, "x": "レスリングとボクシングの両方で、\n頂点近くまで行った男です。"}, {"t": 216.58333333333334, "x": "その男がプロレスに転じました。"}, {"t": 218.73333333333332, "x": "そして1960年7月22日に、\nNWA世界ジュニアヘビー級王者になります。"}, {"t": 225.48333333333332, "x": "ホッジの1回目の保持は、\n記録の上で1450日続きました。"}, {"t": 230.38333333333333, "x": "これは3年と11か月にあたります。"}, {"t": 232.96666666666667, "x": "その長い保持を終わらせたのがマツダでした。"}, {"t": 235.63333333333333, "x": "1964年7月11日、タンパでのことです。"}, {"t": 240.2, "x": "王座の記録をまとめた資料は、\nどれもこの日付を載せています。"}, {"t": 244.4, "x": "場所もタンパです。"}, {"t": 245.65, "x": "ただ、試合の中身を詳しく伝える資料は、\n日付が食い違っています。"}, {"t": 250.81666666666666, "x": "そのため今回は扱いません。"}, {"t": 252.91666666666666, "x": "その7か月前の1963年12月に、\n力道山は亡くなっていました。"}, {"t": 258.68333333333334, "x": "マツダが入門した日本プロレスの、\nあの力道山です。"}, {"t": 262.5, "x": "英語版の資料もWWEの公式紹介も、\nマツダを同じように書いています。"}, {"t": 268.21666666666664, "x": "「NWAのシングルの王座を\n初めて取った日本人」です。"}, {"t": 271.98333333333335, "x": "ベルトを取ったあとです。"}, {"t": 273.5, "x": "マツダはオクラホマシティに乗り込みました。"}, {"t": 275.81666666666666, "x": "ホッジの本拠地です。"}, {"t": 277.28333333333336, "x": "地元紙をもとにした試合記録が残っています。"}, {"t": 280.25, "x": "1964年10月30日。"}, {"t": 283.1333333333333, "x": "会場はストックヤーズ・コロシアムです。"}, {"t": 285.56666666666666, "x": "マツダとホッジは90分を戦いました。"}, {"t": 288.28333333333336, "x": "1本ずつを取り合い、引き分けでした。"}, {"t": 291.03333333333336, "x": "1週間後の11月6日には、\n同じ会場で再戦しています。"}, {"t": 295.73333333333335, "x": "この試合は1対1のまま無効試合になりました。"}, {"t": 298.9, "x": "王座の記録には、ベルトを\n失った日も載っています。"}, {"t": 302.5, "x": "1964年11月13日です。"}, {"t": 305.8833333333333, "x": "場所はオクラホマシティでした。"}, {"t": 307.65, "x": "相手は別の選手です。"}, {"t": 309.3833333333333, "x": "保持した日数は125日です。"}, {"t": 311.8833333333333, "x": "ところが、その日の地元紙の書き方は違います。"}, {"t": 315.21666666666664, "x": "この試合を「タイトルの懸からない試合」と\n書いていました。"}, {"t": 318.35, "x": "ベルトがどの試合で移ったのかは、\n記録の間で食い違いが残っています。"}, {"t": 323.26666666666665, "x": "1966年1月、マツダはテネシー州の\n団体でタッグを組みました。"}, {"t": 329.01666666666665, "x": "相手は日本から来た若い選手です。"}, {"t": 331.48333333333335, "x": "現地での名前はカンジ・イノキ。"}, {"t": 333.5, "x": "のちのアントニオ猪木です。"}, {"t": 335.18333333333334, "x": "2人はNWA世界タッグ王座の\nテネシー版を獲得しています。"}, {"t": 339.56666666666666, "x": "しかし同じ年の2月、猪木がけがをします。"}, {"t": 342.95, "x": "2人はこのベルトを返上しました。"}, {"t": 345.1666666666667, "x": "WWEの公式紹介は、猪木をマツダの\n「親しい友人」と書いています。"}, {"t": 350.6, "x": "1966年5月、マツダは\n日本プロレスに戻ってきます。"}, {"t": 355.56666666666666, "x": "日本を出てから6年がたっていました。"}, {"t": 357.93333333333334, "x": "力道山が亡くなってからは、\n2年5か月がたっています。"}, {"t": 361.78333333333336, "x": "5月26日、札幌中島スポーツセンター。"}, {"t": 365.85, "x": "マツダは吉村道明と組み、\nアジアタッグ王座を取りました。"}, {"t": 370.23333333333335, "x": "この王座は6月27日に、\n名古屋市金山体育館で失っています。"}, {"t": 375.53333333333336, "x": "同じ1966年の10月5日です。"}, {"t": 378.8, "x": "吉原功が日本プロレスを離れました。"}, {"t": 381.56666666666666, "x": "そして新しい団体を作ります。"}, {"t": 383.9, "x": "国際プロレスです。"}, {"t": 385.28333333333336, "x": "マツダはこの新団体に迎えられました。"}, {"t": 387.81666666666666, "x": "役は2つです。"}, {"t": 389.05, "x": "試合の組み方を決めるブッカーと、\n看板のエースでした。"}, {"t": 392.96666666666664, "x": "このときマツダは、\n日本人選手3人とともに合流しています。"}, {"t": 397.21666666666664, "x": "国際プロレスの旗揚げ戦は、\n1967年1月5日です。"}, {"t": 402.4166666666667, "x": "会場は大阪府立体育会館でした。"}, {"t": 405.2, "x": "猪木が作った東京プロレスとの合同興行でした。"}, {"t": 408.56666666666666, "x": "しかしマツダは、借金の処理を\nめぐって吉原と対立します。"}, {"t": 412.8833333333333, "x": "そして国際プロレスを離れ、\nアメリカへ戻りました。"}, {"t": 416.7, "x": "アメリカでは、テキサス州アマリロでも\n試合をしています。"}, {"t": 420.51666666666665, "x": "1968年、相手は\nドリー・ファンク・ジュニアでした。"}, {"t": 424.75, "x": "のちにNWA世界ヘビー級王者になる男です。"}, {"t": 428.25, "x": "2人は1時間戦って引き分けました。"}, {"t": 430.8, "x": "会場はドリーの父親が仕切っていた、\nアマリロの団体のリングでした。"}, {"t": 435.43333333333334, "x": "ドリーは後に、マツダについてこう話しています。"}, {"t": 438.8, "x": "「会って知り合えば、王子のような男だった」。"}, {"t": 441.93333333333334, "x": "フロリダの団体については、こう語っています。"}, {"t": 445.26666666666665, "x": "「団体を率いた人物は、マツダの技量を\n土台にしてフロリダの地区を作り上げた」。"}, {"t": 450.65, "x": "ドリーの話では、マツダはフロリダで\nブッカーも務めていました。"}, {"t": 454.78333333333336, "x": "1999年の訃報記事にも、\nマツダの名前があります。"}, {"t": 459.5, "x": "ジャック・ブリスコがフロリダに来る前の話です。"}, {"t": 462.43333333333334, "x": "この団体の一番の看板は\nマツダだったと書いています。"}, {"t": 465.85, "x": "1974年12月2日、\n馬場がNWA世界ヘビー級王座を"}, {"t": 471.43333333333334, "x": "奪う相手が、このブリスコです。"}, {"t": 473.76666666666665, "x": "フロリダで一緒に戦った別の選手も、\nマツダを振り返っています。"}, {"t": 478.3666666666667, "x": "「本物の紳士で、一緒にいて楽しい人だった」。"}, {"t": 481.9, "x": "1975年6月14日、\nフロリダ州セントピーターズバーグ。"}, {"t": 487.1166666666667, "x": "37歳のマツダは、\nNWA世界ジュニアヘビー級王座を"}, {"t": 491.78333333333336, "x": "取り戻しました。"}, {"t": 492.75, "x": "11年ぶりです。"}, {"t": 494.15, "x": "2度目の戴冠です。"}, {"t": 495.56666666666666, "x": "このベルトを奪い返しに来たのは、またしても\nダニー・ホッジでした。"}, {"t": 499.6666666666667, "x": "1976年3月2日、\nルイジアナ州シュリーブポート。"}, {"t": 504.4, "x": "ホッジがマツダを破ります。"}, {"t": 506.15, "x": "そのわずか13日後の3月15日です。"}, {"t": 509.23333333333335, "x": "ホッジは試合帰りに車を運転していました。"}, {"t": 512.183333 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];

a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
