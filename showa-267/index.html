<script>
const D={"name": "ストロング小林の最期", "file": "267_編集用", "dur": 827.2, "segs": [], "subs": [{"t": 0.0, "x": "2022年1月6日の夜、東京スポーツの\nウェブ版がひとつの死を伝えました。"}, {"t": 5.716666666666667, "x": "知らせが出たのは、亡くなってから\n6日もたってからのことです。"}, {"t": 9.65, "x": "亡くなっていたのは、かつて国際プロレスの\nエースだった男でした。"}, {"t": 13.883333333333333, "x": "名前はストロング小林。"}, {"t": 15.683333333333334, "x": "大みそかの日に、青梅市内の\n病院で息を引き取っていました。"}, {"t": 19.833333333333332, "x": "81歳でした。"}, {"t": 21.366666666666667, "x": "この男がシリーズの試合に最後に出たのは、\n1981年10月16日です。"}, {"t": 27.516666666666666, "x": "そのあとの40年のうち、リングに\n上がったのはたったひと晩しかありません。"}, {"t": 32.516666666666666, "x": "しかも最後の10年ほどは、\nプロレスの世界からも離れていました。"}, {"t": 36.916666666666664, "x": "芸能の世界からも離れていました。"}, {"t": 39.266666666666666, "x": "エースと呼ばれた男は、リングから消えた\nあとの40年をどう過ごしていたのでしょうか？"}, {"t": 44.833333333333336, "x": "今回は、ストロング小林がリングを\n降りてから亡くなるまでを追っていきます。"}, {"t": 49.666666666666664, "x": "猪木との試合の話は短くまとめます。"}, {"t": 52.38333333333333, "x": "その後の日付と、本人や周りの\n人の言葉をもとに辿っていきます。"}, {"t": 57.0, "x": "最後までご覧いただければ幸いです。"}, {"t": 59.5, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 65.08333333333333, "x": "はじめに、この男がどんな姿で\nリングに出てきたかを見ておきます。"}, {"t": 69.53333333333333, "x": "デビューは1967年7月27日です。"}, {"t": 73.4, "x": "場所は名古屋の大会でした。"}, {"t": 75.28333333333333, "x": "リングネームは覆面太郎です。"}, {"t": 77.3, "x": "日本人で初めての、覆面レスラーでした。"}, {"t": 80.5, "x": "身長は188センチ。"}, {"t": 82.71666666666667, "x": "体重は117キロと記録されています。"}, {"t": 85.51666666666667, "x": "覆面をかぶっていても、\n本名は公開されていました。"}, {"t": 89.35, "x": "本名は、小林省三です。"}, {"t": 91.93333333333334, "x": "本人はデビューの前にこう話しています。"}, {"t": 94.61666666666666, "x": "最初マスクをかぶることには\n抵抗を感じましたが、やる以上は"}, {"t": 98.9, "x": "デビュー戦からガンガン暴れる。"}, {"t": 100.66666666666667, "x": "相手は、キャリアが1年以上上の選手でした。"}, {"t": 104.2, "x": "決め手はボディースラムからのニードロップです。"}, {"t": 106.71666666666667, "x": "デビュー戦は勝ちでした。"}, {"t": 108.28333333333333, "x": "試合のあとには、こんな言葉も残っています。"}, {"t": 111.63333333333334, "x": "汗さえマスクにたまらなかったら、もっと\nいいファイトができた。"}, {"t": 115.51666666666667, "x": "当時を知る評論家は、のちにこう話しています。"}, {"t": 118.88333333333334, "x": "彼は上半身は立派だった。"}, {"t": 121.01666666666667, "x": "ただマスクに関しては、試合ができないから、\n評判としてはあまり良くなかった。"}, {"t": 126.48333333333333, "x": "覆面をつけていたのは半年足らずでした。"}, {"t": 129.21666666666667, "x": "1968年1月3日からは\n素顔で試合に出ています。"}, {"t": 133.73333333333332, "x": "この日は、TBSのテレビ中継が\n始まった日でもありました。"}, {"t": 138.0, "x": "その年の10月からは\nヨーロッパへ遠征に出ています。"}, {"t": 141.38333333333333, "x": "このマスクのことは、\n話の最後にもう一度出てきます。"}, {"t": 145.05, "x": "ここで1974年の出来事を\n短く振り返っておきます。"}, {"t": 149.38333333333333, "x": "1974年2月のことです。"}, {"t": 152.05, "x": "小林は東京・高田馬場の\n喫茶店で記者会見を開きました。"}, {"t": 156.33333333333334, "x": "1人だけの会見です。"}, {"t": 157.98333333333332, "x": "社長に辞表を出したことを、\n自分の口で話しました。"}, {"t": 161.81666666666666, "x": "フリーになることも明かしています。"}, {"t": 163.78333333333333, "x": "東京スポーツの記者で、\n国際プロレスを担当していた人がいます。"}, {"t": 168.25, "x": "その記者でさえ、退団を\nまったく知らなかったと書いています。"}, {"t": 172.41666666666666, "x": "団体のエースが、ある日\n突然いなくなったことになります。"}, {"t": 176.33333333333334, "x": "1か月後の3月19日です。"}, {"t": 178.75, "x": "小林は蔵前国技館でアントニオ猪木に挑みました。"}, {"t": 182.33333333333334, "x": "この写真は、その日の\n蔵前国技館で撮られたものです。"}, {"t": 186.33333333333334, "x": "試合は、猪木の勝ちでした。"}, {"t": 188.68333333333334, "x": "12月12日の再戦も猪木が勝っています。"}, {"t": 191.8, "x": "その後、小林は新日本プロレスに\n正式に入りました。"}, {"t": 195.98333333333332, "x": "試合の中身は過去の回で詳しく扱っています。"}, {"t": 199.23333333333332, "x": "新日本に入ってからの小林には相棒がいました。"}, {"t": 202.58333333333334, "x": "坂口征二です。"}, {"t": 203.96666666666667, "x": "2人は組んで、北米タッグ王座を取っています。"}, {"t": 207.4, "x": "坂口はのちに、小林とは性格が\n似ていたと話しています。"}, {"t": 211.75, "x": "ただ、リングの上での立場は\n少しずつ変わっていきました。"}, {"t": 215.53333333333333, "x": "文春オンラインは当時の様子をこう伝えています。"}, {"t": 218.8, "x": "若い選手が伸びてきたこと。"}, {"t": 220.63333333333333, "x": "猪木がほかの競技の選手と\n戦う路線を本格的に進めたこと。"}, {"t": 224.85, "x": "この2つが重なりました。"}, {"t": 226.51666666666668, "x": "小林は役員でした。"}, {"t": 228.28333333333333, "x": "それでも、リングの本流からは外れていきます。"}, {"t": 231.68333333333334, "x": "小林自身は、お金のことでも\n口を出さなかったと話しています。"}, {"t": 236.16666666666666, "x": "僕はギャラの面でも何も言わなかったから。"}, {"t": 238.8, "x": "腰もこのころから悪くしていました。"}, {"t": 240.95, "x": "その腰が、最後の試合を決めることになります。"}, {"t": 244.31666666666666, "x": "1981年10月、小林は\n新日本のシリーズに出ていました。"}, {"t": 249.8, "x": "この月、ハルク・ホーガンとの\n試合が何度も組まれています。"}, {"t": 253.7, "x": "10月10日は横浜でした。"}, {"t": 255.75, "x": "12日は高知です。"}, {"t": 257.3333333333333, "x": "どちらもホーガンとの1対1でした。"}, {"t": 259.68333333333334, "x": "どちらも小林が負けています。"}, {"t": 261.7, "x": "そして10月16日、大分県立総合体育館です。"}, {"t": 266.2, "x": "小林はこの日、ホーガンらとの\nタッグマッチに出ました。"}, {"t": 269.9, "x": "これがシリーズで出た最後の試合になりました。"}, {"t": 272.6333333333333, "x": "持病の腰痛が悪くなったためです。"}, {"t": 275.03333333333336, "x": "小林はこのまま試合から離れます。"}, {"t": 277.5, "x": "そのあとは、「セミリタイヤ状態」でした。"}, {"t": 280.4, "x": "文春オンラインは、そう書いています。"}, {"t": 283.18333333333334, "x": "引退の発表はありませんでした。"}, {"t": 285.4, "x": "さよならの試合もありません。"}, {"t": 287.3333333333333, "x": "41歳になる2か月前のことです。"}, {"t": 290.0, "x": "試合に出なくなった小林は、\n別の名前を名乗るようになります。"}, {"t": 294.3666666666667, "x": "ストロング金剛です。"}, {"t": 295.93333333333334, "x": "芸能の仕事を始めたのは、引退と同じころです。"}, {"t": 299.7, "x": "文春オンラインは、そう伝えています。"}, {"t": 302.6, "x": "最初は映画への出演でした。"}, {"t": 304.71666666666664, "x": "そこからドラマとバラエティーへ\n仕事が広がっていきます。"}, {"t": 307.98333333333335, "x": "正式に引退したのは1984年です。"}, {"t": 311.48333333333335, "x": "地元の福生で大会が開かれました。"}, {"t": 313.98333333333335, "x": "その大会で引退のセレモニーが行われています。"}, {"t": 317.2, "x": "最後の試合から、およそ3年がたっていました。"}, {"t": 320.6666666666667, "x": "デビューから数えると、\nリングにいたのは14年あまりです。"}, {"t": 324.5833333333333, "x": "本人はのちに「不完全燃焼」\nだったと認めています。"}, {"t": 328.3333333333333, "x": "引退した年に始まった番組があります。"}, {"t": 331.1, "x": "特撮番組の超電子バイオマンです。"}, {"t": 333.75, "x": "1984年から\n1985年にかけて放送されました。"}, {"t": 338.75, "x": "ストロング金剛は敵の幹部の1人を演じています。"}, {"t": 342.01666666666665, "x": "役の名前はモンスターです。"}, {"t": 343.9166666666667, "x": "ビッグスリーと呼ばれた3人のうちの1人でした。"}, {"t": 346.78333333333336, "x": "訃報が伝えられた日のことです。"}, {"t": 348.8, "x": "子ども向け雑誌の公式アカウントが、\nこう書き込んでいます。"}, {"t": 352.81666666666666, "x": "引退後はタレントとして\n超電子バイオマン敵幹部モンスター役等でも活躍。"}, {"t": 357.65, "x": "同じころの代表作が、\nTBSの風雲！たけし城です。"}, {"t": 362.8666666666667, "x": "コーナーの名前は悪魔の館です。"}, {"t": 365.1166666666667, "x": "挑戦者を捕まえる悪魔の役でした。"}, {"t": 367.6333333333333, "x": "頭をそり上げた姿で、\n怪人の役として人気を集めています。"}, {"t": 372.23333333333335, "x": "1985年、小林は埼玉県川口市の\n病院を訪ねています。"}, {"t": 378.0, "x": "入院していたのは国際プロレスの\n吉原功社長でした。"}, {"t": 381.85, "x": "1974年に辞表を出した相手です。"}, {"t": 385.01666666666665, "x": "文春オンラインによると、\n吉原は小林にこう話しました。"}, {"t": 389.43333333333334, "x": "いちばん自分のことを\n思ってくれた選手だった、という言葉です。"}, {"t": 393.8, "x": "小林は涙を流しました。"}, {"t": 395.8, "x": "そして社長の手を握ったと伝えられています。"}, {"t": 398.6333333333333, "x": "吉原は、その後まもなく亡くなりました。"}, {"t": 401.53333333333336, "x": "55歳でした。"}, {"t": 402.85, "x": "団体を出てから11年がたっていました。"}, {"t": 405.5833333333333, "x": "その11年目に、\n2人は会っていたことになります。"}, {"t": 409.18333333333334, "x": "ストロング金剛としての\n芸能の仕事は長く続きました。"}, {"t": 412.8666666666667, "x": "本人はのちに、その理由をこう話しています。"}, {"t": 416.28333333333336, "x": "プロレスのあと、芸能界で15年も\n仕事ができたのは、やっぱり"}, {"t": 421.1166666666667, "x": "あの猪木戦があったからですよ。"}, {"t": 422.95, "x": "1992年3月1日、横浜アリーナです。"}, {"t": 427.45, "x": "新日本プロレスの旗揚げ20周年の\n大会が開かれました。"}, {"t": 431.5, "x": "この大会に、小林が呼ばれます。"}, {"t": 434.31666666666666, "x": "引退から、8年がたっていました。"}, {"t": 437.0, "x": "リングに上がるのは、およそ10年ぶりでした。"}, {"t": 440.06666666666666, "x": "組んだ相手は坂口征二です。"}, {"t": 442.1666666666667, "x": "新日本の時代の相棒でした。"}, {"t": 444.35, "x": "向かいのコーナーには、\nタイガー・ジェット・シンが立ちました。"}, {"t": 447.9, "x": "もう1人は上田馬之助です。"}, {"t": 449.8666666666667, "x": "試合は7分たたずに終わっています。"}, {"t": 452.4, "x": "文春オンラインの記録では、\n坂口と小林の反則勝ちでした。"}, {"t": 456.96666666666664, "x": "小林はこの試合の運び方を残念がっていました。"}, {"t": 460.3333333333333, "x": "最初から場外乱闘でお茶を\n濁すような展開、という言葉です。"}, {"t": 465.01666666666665, "x": "この日、猪木は国会議員になっていました。"}, {"t": 468.15, "x": "会場では社長ではなく会長と呼ばれていました。"}, {"t": 471.26666666666665, "x": "いたのは特別室です。"}, {"t": 472.9, "x": "小林はあいさつに行く気になれませんでした。"}, {"t": 475.65, "x": "この日、猪木とは話していません。"}, {"t": 478.18333333333334, "x": "これがストロング小林の\n最後のひと晩になりました。"}, {"t": 481.3333333333333, "x": "リングに立ったのは、この日が最後です。"}, {"t": 484.0833333333333, "x": "その後、小林は少しずつ表に出なくなります。"}, {"t": 487.68333333333334, "x": "亡 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
