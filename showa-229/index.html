<style>

<script>
const D={"name": "猪木引退試合", "file": "229_編集用", "dur": 902.76665625, "segs": [], "subs": [{"t": 0.0, "x": "1998年4月4日、東京ドーム。"}, {"t": 4.033333333333333, "x": "午後8時26分、その日11試合目の\nゴングが鳴りました。"}, {"t": 8.65, "x": "イメージ映像"}, {"t": 8.65, "x": "会場の発表は7万人。"}, {"t": 10.7, "x": "立ち見席1500枚を求めて、前の晩から\n300人が並んでいたと記録されています。"}, {"t": 16.55, "x": "リングに上がったのは、デビューから\n38年目のアントニオ猪木です。"}, {"t": 21.25, "x": "イメージ映像"}, {"t": 21.25, "x": "向かい合った相手は、\nプロレスラーではありませんでした。"}, {"t": 24.75, "x": "アメリカの総合格闘技の選手、ドン・フライ。"}, {"t": 28.133333333333333, "x": "2年前にアルティメット大会を\n勝ち上がってきた男です。"}, {"t": 31.583333333333332, "x": "そして猪木の引退試合は、\n4分9秒で終わりました。"}, {"t": 35.68333333333333, "x": "この日の相手には、小川直也と藤波辰爾と\n長州力の名前が挙がっていました。"}, {"t": 41.15, "x": "それでもリングに立ったのはフライでした。"}, {"t": 43.516666666666666, "x": "イメージ映像"}, {"t": 43.516666666666666, "x": "今回は、1998年4月4日という1日を、\n確認できた日付と数字だけで辿っていきます。"}, {"t": 51.15, "x": "最後までご覧いただければ幸いです。"}, {"t": 53.65, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 59.233333333333334, "x": "イメージ映像"}, {"t": 59.233333333333334, "x": "まず、この日に行き着くまでに\n何年かかったのかを確認します。"}, {"t": 63.56666666666667, "x": "猪木は1989年に参議院議員に当選し、\n新日本プロレスの社長を坂口征二に譲りました。"}, {"t": 71.25, "x": "イメージ映像"}, {"t": 71.25, "x": "レスラーとしては、\n大きな会場だけに出る形になります。"}, {"t": 75.15, "x": "そこから引退へ向けた動きが\n始まったのが1994年です。"}, {"t": 79.66666666666667, "x": "3月16日、東京体育館の試合の時点で、\nファイナル・カウントダウンが宣言されています。"}, {"t": 86.71666666666667, "x": "番号を打った大会は、\nここから7回行われました。"}, {"t": 90.58333333333333, "x": "第1弾は1994年5月1日、福岡ドーム。"}, {"t": 95.51666666666667, "x": "イメージ映像"}, {"t": 95.51666666666667, "x": "相手はグレート・ムタで、20分12秒、\n体固めで猪木が勝っています。"}, {"t": 101.05, "x": "第2弾は1994年9月23日、横浜アリーナ。"}, {"t": 106.3, "x": "相手は1976年に異種格闘技戦で\n戦った柔道のウィリエム・ルスカでした。"}, {"t": 111.81666666666666, "x": "11分37秒、裸絞め。"}, {"t": 114.73333333333333, "x": "このとき猪木は51歳、ルスカは54歳です。"}, {"t": 118.68333333333334, "x": "第3弾は1995年1月4日、東京ドーム。"}, {"t": 123.45, "x": "イメージ映像"}, {"t": 123.45, "x": "4選手による格闘技トーナメントの形になり、\n猪木は1日に2試合を戦いました。"}, {"t": 129.3, "x": "1回戦はジェラルド・ゴルドーに6分37秒、\n決勝はスティングに10分26秒、"}, {"t": 135.41666666666666, "x": "いずれも裸絞めです。"}, {"t": 137.23333333333332, "x": "第4弾は1995年3月19日、愛知県体育館。"}, {"t": 142.55, "x": "イメージ映像"}, {"t": 142.55, "x": "相手は直弟子の藤原喜明で、\n18分5秒、体固め。"}, {"t": 147.68333333333334, "x": "第5弾は1996年1月4日、東京ドーム。"}, {"t": 152.45, "x": "イメージ映像"}, {"t": 152.45, "x": "相手はビッグバン・ベイダーで、\n14分16秒、腕ひしぎ逆十字固め。"}, {"t": 158.2, "x": "第6弾は1997年1月4日、東京ドーム。"}, {"t": 163.03333333333333, "x": "相手は空手のウィリー・ウィリアムスで、\n17年ぶりの対戦でした。"}, {"t": 167.45, "x": "イメージ映像"}, {"t": 167.45, "x": "この試合は、猪木はコブラツイスト、ウィリーは\n正拳と、決め技を限定して行われています。"}, {"t": 174.58333333333334, "x": "決着は4分13秒、グラウンド・コブラでした。"}, {"t": 178.38333333333333, "x": "第7弾は1997年4月12日、東京ドーム。"}, {"t": 183.36666666666667, "x": "相手はタイガーキング、\n初代タイガーマスクの佐山聡です。"}, {"t": 187.55, "x": "6分46秒、コブラツイスト。"}, {"t": 190.45, "x": "カウントダウンは、\nこの第7弾で打ち止めになりました。"}, {"t": 194.08333333333334, "x": "イメージ映像"}, {"t": 194.08333333333334, "x": "つまり引退までの助走は、\n1994年から1998年までの4年間です。"}, {"t": 200.81666666666666, "x": "その間、番号を打った大会は7回。"}, {"t": 203.88333333333333, "x": "イメージ映像"}, {"t": 203.88333333333333, "x": "猪木のリング上での最後の試合は、\n1997年7月6日の"}, {"t": 209.08333333333334, "x": "札幌真駒内アイスアリーナでの\nタッグマッチでした。"}, {"t": 212.11666666666667, "x": "引退が表に出たのは1997年12月27日です。"}, {"t": 216.88333333333333, "x": "この日、東京スポーツをはじめとする各紙が\n猪木の引退を報じました。"}, {"t": 221.7, "x": "イメージ映像"}, {"t": 221.7, "x": "報道の中では、翌年4月4日の東京ドームが\n最後の舞台になると書かれています。"}, {"t": 227.5, "x": "このとき挙がっていた相手の候補が4人です。"}, {"t": 230.28333333333333, "x": "元プロボクシング世界ヘビー級王者の\nジョージ・フォアマン。"}, {"t": 233.61666666666667, "x": "ヒクソン・グレイシー。小川直也。橋本真也。"}, {"t": 237.05, "x": "イメージ映像"}, {"t": 237.05, "x": "ただしこれは報道の段階で、\n本人からの発表ではありませんでした。"}, {"t": 241.8, "x": "イメージ映像"}, {"t": 241.8, "x": "正式な表明は1998年1月4日、\n東京ドームです。"}, {"t": 247.35, "x": "この日は第5試合で長州力の\n引退試合が行われていました。"}, {"t": 251.51666666666668, "x": "イメージ映像"}, {"t": 251.51666666666668, "x": "その後、リングに上がった猪木は長州と\n握手を交わし、マイクを取ります。"}, {"t": 256.96666666666664, "x": "「私と長州のカウントダウンが\n逆さになってしまいました」"}, {"t": 260.18333333333334, "x": "「その中で私のカウントダウンも\n最後になりました」"}, {"t": 262.96666666666664, "x": "「4月4日、この東京ドームにおいて最後の\n試合をさせていただきます」そして"}, {"t": 267.85, "x": "「いつ何時誰の挑戦でも受ける」と\n付け加えました。"}, {"t": 270.7, "x": "相手の決め方が決まったのは\n1998年2月9日です。"}, {"t": 275.18333333333334, "x": "イメージ映像"}, {"t": 275.18333333333334, "x": "引退試合の相手を、8人による\nトーナメントで決めることが発表されました。"}, {"t": 280.28333333333336, "x": "同じ日に、モハメド・アリが\n特別ゲストとして来場することも決まっています。"}, {"t": 285.15, "x": "2月24日には、出場が取り沙汰されていた\n天龍源一郎が不参加を表明しました。"}, {"t": 291.26666666666665, "x": "最終的な8人が固まったのが3月2日です。"}, {"t": 294.73333333333335, "x": "小川直也、ドン・フライ、藤田和之、\n藤原喜明、山崎一夫、イゴール・メインダート、"}, {"t": 302.35, "x": "ブライアン・ジョンストン、\nデイブ・ベネトゥー。"}, {"t": 305.25, "x": "イメージ映像"}, {"t": 305.25, "x": "この間に、猪木とフライは一度ぶつかっています。"}, {"t": 308.6333333333333, "x": "イメージ映像"}, {"t": 308.6333333333333, "x": "1998年2月15日、日本武道館。"}, {"t": 312.95, "x": "挨拶のため来場した猪木が放送席から\n見守る中、小川とフライが対戦しました。"}, {"t": 318.76666666666665, "x": "小川が関節技で勝ったあと、\nフライが背後から小川に殴りかかります。"}, {"t": 323.6666666666667, "x": "イメージ映像"}, {"t": 323.6666666666667, "x": "猪木はリングに上がり、\nフライに鉄拳を見舞いました。"}, {"t": 327.28333333333336, "x": "シャツを脱いで睨み合うところまで\n発展しています。"}, {"t": 330.3333333333333, "x": "トーナメントの1回戦は1998年3月22日、\n愛知県体育館で行われました。"}, {"t": 337.55, "x": "小川直也が5分15秒、腕ひしぎ逆十字固めで\nデイブ・ベネトゥーに勝利。"}, {"t": 342.95, "x": "イメージ映像"}, {"t": 342.95, "x": "ドン・フライが5分11秒、\nKOで山崎一夫に勝利。"}, {"t": 347.25, "x": "イメージ映像"}, {"t": 347.25, "x": "ブライアン・ジョンストンが7分49秒、\nTKOで藤原喜明に勝利。"}, {"t": 352.7, "x": "イゴール・メインダートが6分33秒、\nKOで藤田和之に勝利。"}, {"t": 357.68333333333334, "x": "この日、猪木自身も正道会館の角田信朗と\n公開スパーリングを行っています。"}, {"t": 363.4166666666667, "x": "レフェリー不在、制限時間なしで、\n4分30秒でした。"}, {"t": 368.1333333333333, "x": "そして1998年4月4日です。"}, {"t": 371.3666666666667, "x": "開始は午後4時。"}, {"t": 372.5833333333333, "x": "準決勝は、小川直也が3分30秒、\n腕ひしぎ逆十字固めでジョンストンに勝利。"}, {"t": 379.3, "x": "イメージ映像"}, {"t": 379.3, "x": "ドン・フライが3分57秒、後頭部への\nパンチの連打によるKOでメインダートに勝利。"}, {"t": 385.3833333333333, "x": "決勝は小川とフライの顔合わせになりました。"}, {"t": 388.26666666666665, "x": "イメージ映像"}, {"t": 388.26666666666665, "x": "フライのパンチで小川がダウンし、\n馬乗りからの連打を受けます。"}, {"t": 392.53333333333336, "x": "セコンドについていた佐山聡が\nタオルを投げ入れ、5分0秒でTKO。"}, {"t": 397.9, "x": "猪木の最後の相手は、こうして決まりました。"}, {"t": 400.95, "x": "引退試合までの間に、3つの\nタイトルマッチが組まれています。"}, {"t": 405.35, "x": "IWGPジュニアヘビー級選手権は、\n獣神サンダー・ライガーがケンドー・カシンを"}, {"t": 411.1666666666667, "x": "15分28秒で下して初防衛。"}, {"t": 413.9, "x": "IWGPタッグ選手権は、\n武藤敬司と蝶野正洋が橋本真也と西村修を"}, {"t": 420.25, "x": "18分23秒で退けて2度目の防衛。"}, {"t": 423.5, "x": "IWGPヘビー級選手権は、\n藤波辰爾が佐々木健介を21分18秒、"}, {"t": 429.95, "x": "原爆固めで破って第21代王者になりました。"}, {"t": 433.6666666666667, "x": "メインイベントの入場では、タキシード姿の\nモハメド・アリが先に登場しています。"}, {"t": 439.15, "x": "イメージ映像"}, {"t": 439.15, "x": "アリは入場ゲート横に\n用意された聖火台に火を灯しました。"}, {"t": 443.05, "x": "イメージ映像"}, {"t": 443.05, "x": "テレビ朝日の中継の実況は古舘伊知郎です。"}, {"t": 446.4, "x": "イメージ映像"}, {"t": 446.4, "x": "古舘のプロレス実況は、\n1988年8月8日の猪木対藤波の"}, {"t": 452.06666666666666, "x": "60分ドロー以来、9年半ぶりでした。"}, {"t": 455.2, "x": "中継は2日後の4月6日、\n午後7時から2時間枠で放送されています。"}, {"t": 460.6333333333333, "x": "イメージ映像"}, {"t": 460.6333333333333, "x": "試合の内容を確認します。"}, {"t": 462.75, "x": "イメージ映像"}, {"t": 462.75, "x": "フライがパンチで前に出て、\n猪木が離れ際の浴びせ蹴りで返します。"}, {"t": 467.4166666666667, "x": "イメージ映像"}, {"t": 467.4166666666667, "x": "フライの水車落としから、\nグラウンドの攻防になりました。"}, {"t": 471.23333333333335, "x": "フライが仕掛けたヒールホールドを、\n猪木は同じ技で返します。"}, {"t": 475.51666666666665, "x": "イメージ映像"}, {"t": 475.51666666666665, "x": "フライはロープに逃げました。"}, {"t": 477.26666666666665, "x": "猪木がスリーパーで捕らえ、\nフライが返して馬乗りのパンチ。"}, {"t": 481.28333333333336, "x": "イメージ映像"}, {"t": 481.28333333333336, "x": "猪木は体を入れ替え、\n逆にマウントからパンチを見舞います。"}, {"t": 485.6333333333333, "x": "離れ際に顔面への蹴り。"}, {"t": 487.46666666666664, "x": "イメージ映像"}, {"t": 487.46666666666664, "x": "立ち上がったフライに延髄斬り。"}, {"t": 489.46666666666664, "x": "最後はコブラツイストから、\nそのまま寝かせる形に移行して"}, {"t": 493.3333333333333, "x": "ギブアップを奪いました。4分9秒。"}, {"t": 496.0833333333333, "x": "決まり手の呼び名は資料によって揺れがあり、\nグラウンド・コブラツイスト、"}, {"t": 500.5, "x": "グランド・コブラの両方の表記が残っています。"}, {"t": 503.68333333333334, "x": "この技は、1997年1月4日の\nウィリー・ウィリアムス戦でも使われた技でした。"}, {"t": 510.0, "x": "観衆の数字についても、\n記録の残り方を整理しておきます。"}, {"t function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';

const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}

sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
