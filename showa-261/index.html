<script>
const D={"name": "谷津嘉章", "file": "261_編集用", "dur": 866.91665625, "segs": [], "subs": [{"t": 0.0, "x": "2021年6月6日、さいたまスーパーアリーナ。"}, {"t": 4.016666666666667, "x": "4つの団体が合同で大会を開きました。"}, {"t": 6.966666666666667, "x": "始まりに組まれたのは、時間差で\n選手が入るバトルロイヤルです。"}, {"t": 11.25, "x": "1番目にリングへ入ったのは、64歳の男でした。"}, {"t": 15.333333333333334, "x": "胸には輪が8つ描かれています。"}, {"t": 17.583333333333332, "x": "オリンピックの五輪のマークに、\n輪を3つ足した図柄です。"}, {"t": 21.4, "x": "名前は「やつりん」と付けられていました。"}, {"t": 23.716666666666665, "x": "男の名前は谷津嘉章。"}, {"t": 25.633333333333333, "x": "右足は、膝から下が義足です。"}, {"t": 28.333333333333332, "x": "2年前の6月に、病気で切断しました。"}, {"t": 31.8, "x": "41年前の夏にも、失ったものがあります。"}, {"t": 35.56666666666667, "x": "代表に選ばれていたモスクワオリンピックです。"}, {"t": 38.45, "x": "日本はその大会に、\n選手を1人も送りませんでした。"}, {"t": 42.38333333333333, "x": "オリンピックに行けなかった男は、なぜ\n義足を着けてまでリングに戻ったのでしょうか？"}, {"t": 47.86666666666667, "x": "今回は谷津嘉章が、2つのものを\n失ってからたどった道を追います。"}, {"t": 52.78333333333333, "x": "本人が語った言葉と、\n具体的な日付をもとに辿っていきます。"}, {"t": 57.2, "x": "最後までご覧いただければ幸いです。"}, {"t": 59.68333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 65.26666666666667, "x": "1980年5月24日、\n東京・原宿の岸記念体育会館。"}, {"t": 71.06666666666666, "x": "地下3階の大講堂に人が集まりました。"}, {"t": 73.85, "x": "日本オリンピック委員会の臨時総会です。"}, {"t": 76.78333333333333, "x": "この日は最終期限の日でした。"}, {"t": 78.86666666666666, "x": "モスクワ大会に出るかどうかを伝える期限です。"}, {"t": 81.85, "x": "採決は挙手で行われます。"}, {"t": 83.93333333333334, "x": "参加は13票。"}, {"t": 85.43333333333334, "x": "不参加は29票。"}, {"t": 87.06666666666666, "x": "棄権は2票でした。"}, {"t": 88.55, "x": "日本はこの日、モスクワ大会に\n出ないと決めました。"}, {"t": 92.2, "x": "数字は笹川スポーツ財団の記録によります。"}, {"t": 95.26666666666667, "x": "話は5か月前にさかのぼります。"}, {"t": 97.66666666666667, "x": "1979年12月27日のことです。"}, {"t": 101.43333333333334, "x": "ソ連の軍隊がアフガニスタンに入りました。"}, {"t": 104.2, "x": "翌年の1月4日には、\nアメリカのカーター大統領が動きます。"}, {"t": 108.78333333333333, "x": "モスクワ大会のボイコットをほのめかしたのです。"}, {"t": 111.65, "x": "1月20日には、日本やイギリスにも\n同じ動きを呼びかけました。"}, {"t": 116.1, "x": "4月12日、アメリカの\nオリンピック委員会が不参加を決めます。"}, {"t": 120.83333333333333, "x": "カナダと西ドイツも不参加を決めました。"}, {"t": 123.3, "x": "イギリスとフランスは参加を選んでいます。"}, {"t": 125.88333333333334, "x": "日本では4月21日に、\n緊急の会議が開かれました。"}, {"t": 130.21666666666667, "x": "場所は同じ岸記念体育会館です。"}, {"t": 132.86666666666667, "x": "選手を強くする係のコーチが集められました。"}, {"t": 135.95, "x": "選手の代表も同じ席に着いています。"}, {"t": 138.6, "x": "レスリングの選手は、\n涙を流して思いを話しました。"}, {"t": 142.55, "x": "柔道の山下泰裕は、\n大会に出させてほしいと訴えました。"}, {"t": 147.1, "x": "選ばれていた代表には、のちに\n認定書が送られています。"}, {"t": 151.08333333333334, "x": "モスクワ大会に行けない代表であることを\n認める書類です。"}, {"t": 154.73333333333332, "x": "委員会の公式の記録にも、\nそのことが書かれています。"}, {"t": 158.5, "x": "多くの選手やコーチが参加を\n訴えるなかで決めた、という記録です。"}, {"t": 163.13333333333333, "x": "当時の日本オリンピック委員会は、\n独立した組織ではありません。"}, {"t": 167.75, "x": "日本体育協会の中にある、委員会の1つでした。"}, {"t": 171.63333333333333, "x": "体育協会の会長を通じて、\n当時の内閣の考えが伝えられました。"}, {"t": 176.63333333333333, "x": "笹川スポーツ財団は、そう記録しています。"}, {"t": 180.05, "x": "この経緯は、1989年の独立に\nつながったとされています。"}, {"t": 185.11666666666667, "x": "5月24日に道を断たれた選手の\n中に、谷津嘉章がいました。"}, {"t": 189.88333333333333, "x": "谷津は1956年7月19日に生まれました。"}, {"t": 193.8, "x": "生まれたのは群馬県の明和町です。"}, {"t": 196.21666666666667, "x": "レスリングを始めたのは、\n栃木県足利市の高校です。"}, {"t": 200.25, "x": "足利工業大学の附属高校でした。"}, {"t": 203.06666666666666, "x": "その後、日本大学に進みました。"}, {"t": 205.73333333333332, "x": "1976年には、カナダのモントリオールで\nオリンピックが開かれます。"}, {"t": 211.0, "x": "谷津はレスリングの\nフリースタイル90キロ級に出ました。"}, {"t": 214.5, "x": "成績は8位入賞です。"}, {"t": 216.5, "x": "4年後のモスクワ大会でも、\n谷津は代表に選ばれます。"}, {"t": 220.63333333333333, "x": "今度は金メダルの候補とみられていました。"}, {"t": 223.3, "x": "当時の所属は足利工業大学です。"}, {"t": 225.98333333333332, "x": "モスクワ大会は\n1980年7月19日に始まりました。"}, {"t": 230.5, "x": "閉会は8月3日です。"}, {"t": 232.45, "x": "参加したのは80の国と地域でした。"}, {"t": 235.1, "x": "日本の選手は1人もいません。"}, {"t": 237.18333333333334, "x": "金メダルはソ連が80個でした。"}, {"t": 239.53333333333333, "x": "東ドイツは47個です。"}, {"t": 241.66666666666666, "x": "谷津には「幻の金メダリスト」\nという呼び名が付きます。"}, {"t": 245.45, "x": "本人は41年後の取材で、こう答えています。"}, {"t": 249.38333333333333, "x": "「オリンピック＝人生でしたから。"}, {"t": 251.26666666666668, "x": "長年、モスクワに\n出られなかった悔いはありました。」"}, {"t": 254.88333333333333, "x": "大会が終わって2か月後の1980年10月。"}, {"t": 258.68333333333334, "x": "谷津はプロレスへの転向を決めます。"}, {"t": 261.05, "x": "スポーツ報知の記事では、そう書かれています。"}, {"t": 264.1666666666667, "x": "入ったのはアントニオ猪木の\n新日本プロレスでした。"}, {"t": 267.48333333333335, "x": "最初の試合は日本ではありません。"}, {"t": 269.85, "x": "1980年12月29日、ニューヨークの\nマディソン・スクエア・ガーデンです。"}, {"t": 275.56666666666666, "x": "日本での初めての試合は、半年後でした。"}, {"t": 278.8833333333333, "x": "1981年6月24日、東京の蔵前国技館です。"}, {"t": 284.3333333333333, "x": "パートナーは猪木本人でした。"}, {"t": 286.3333333333333, "x": "相手はスタン・ハンセンと\nアブドーラ・ザ・ブッチャーの組です。"}, {"t": 289.51666666666665, "x": "谷津はこの試合で、額から大量の血を流しました。"}, {"t": 293.31666666666666, "x": "最後はハンセンのラリアットを受けました。"}, {"t": 295.85, "x": "そのままフォールされています。"}, {"t": 297.6666666666667, "x": "本人はのちに、こう振り返りました。"}, {"t": 300.48333333333335, "x": "「俺の今までのプロレスを通して、良くも\n悪くも一番インパクトがあった試合だね。」"}, {"t": 305.95, "x": "その後の谷津は、いくつもの団体を渡ります。"}, {"t": 309.1666666666667, "x": "1984年には長州力の側について、\n新日本を離れました。"}, {"t": 314.55, "x": "次の主な舞台は、ジャイアント馬場の\n全日本プロレスです。"}, {"t": 318.71666666666664, "x": "1986年2月5日、札幌中島体育センター。"}, {"t": 323.76666666666665, "x": "谷津は長州と組みました。"}, {"t": 325.55, "x": "相手はジャンボ鶴田と天龍源一郎の組です。"}, {"t": 328.6666666666667, "x": "この試合に勝って、インターナショナル・タッグの\n第37代王者になりました。"}, {"t": 333.85, "x": "本人の話では、この日の外は吹雪でした。"}, {"t": 337.2, "x": "会場の中は熱気に包まれていたそうです。"}, {"t": 340.05, "x": "同じ1986年に、谷津は\nアマチュアのマットにも立ちました。"}, {"t": 344.9, "x": "レスリングの全日本選手権に出たのです。"}, {"t": 347.6666666666667, "x": "プロになって6年目のことでした。"}, {"t": 349.71666666666664, "x": "全日本プロレスでは、のちに鶴田と組みます。"}, {"t": 352.9, "x": "2人ともオリンピックのレスリング代表でした。"}, {"t": 355.71666666666664, "x": "そのため、この組は「五輪コンビ」と呼ばれます。"}, {"t": 359.45, "x": "1988年6月4日、2人は\nPWF世界タッグの王座を取りました。"}, {"t": 365.81666666666666, "x": "2010年11月30日、東京・新宿FACE。"}, {"t": 370.06666666666666, "x": "500人の客の前で、\n谷津は引退試合に臨みました。"}, {"t": 374.18333333333334, "x": "全国6か所を回った引退ツアーの、\n最後の大会です。"}, {"t": 378.28333333333336, "x": "プロのリングに立って30年がたっていました。"}, {"t": 381.06666666666666, "x": "試合後に、本人はこう話しています。"}, {"t": 384.06666666666666, "x": "「ジャンボ鶴田とか\nジャイアント馬場さんとやってみたかった。"}, {"t": 387.21666666666664, "x": "みんな死んじゃったけどね。」"}, {"t": 388.75, "x": "ここまでが、1つ目の喪失のあとの30年です。"}, {"t": 392.51666666666665, "x": "2つ目の喪失は、2019年にやってきます。"}, {"t": 396.1333333333333, "x": "本人の話では、糖尿病と\n分かったのは35歳の時でした。"}, {"t": 400.9, "x": "医者からはこう言われたそうです。"}, {"t": 402.9, "x": "「20年後には間違いなく\nインスリン打ってる。」その後は、"}, {"t": 406.73333333333335, "x": "糖尿病の薬を飲んで過ごしてきました。"}, {"t": 409.6666666666667, "x": "引退のあとも、谷津はリングに上がっていました。"}, {"t": 413.01666666666665, "x": "2019年6月2日には、\n愛媛で試合に出ています。"}, {"t": 417.35, "x": "異変は右足の親指から始まりました。"}, {"t": 420.1, "x": "爪の中に小さな血豆ができていたのです。"}, {"t": 422.8333333333333, "x": "週刊誌の記事では、そこから\n細菌が入ったと書かれています。"}, {"t": 427.06666666666666, "x": "そして壊死が進みました。"}, {"t": 428.73333333333335, "x": "6月23日に、谷津は足の切断を告げられます。"}, {"t": 432.85, "x": "手術は2日後の6月25日でした。"}, {"t": 435.68333333333334, "x": "右足は、膝の下7センチを\n残して切り落とされました。"}, {"t": 439.6, "x": "62歳の時のことです。"}, {"t": 441.53333333333336, "x": "切断から数日後に、\n谷津は週刊誌の取材に応じました。"}, {"t": 445.8833333333333, "x": "「参ったよな。"}, {"t": 446.8833333333333, "x": "足を切られちゃってさ。」「6月2日には、\n愛媛で普通に試合をしたのに、"}, {"t": 452.25, "x": "23日には『切断です』と言われて、25日には\n手術でしょ。」そして、こうも話しています。"}, {"t": 459.6666666666667, "x": "「だって、こんなの隠しきれないじゃん？」"}, {"t": 462.45, "x": "4年後の取材では、\n切断した直後の気持ちを語りました。"}, {"t": 466.6, "x": "ひとことでした。"}, {"t": 467.68333333333334, "x": "「喪失感がひどかった。」"}, {"t": 469.3333333333333, "x": "ここでもう一度、\nオリンピックが谷津の前に現れます。"}, {"t": 473.1, "x": "2020年には東京オリンピックが\n開かれる予定でした。"}, {"t": 476.8833333333333, "x": "谷津は聖火ランナーに選ばれます。"}, {"t": 479.0833333333333, "x": "走る場所は栃木県足利市です。"}, {"t": 481.48333333333335, "x": "モスクワ代表のころに、\n足利工業大学にいた縁でした。"}, {"t": 485.76666666666665, "x": "走る予定の日は、2020年3月29日です。"}, {"t": 489.73333333333335, "x": "ところが、新型コロナウイルスが広がりました。"}, {"t": 492.98333333333335, "x": "3月24日の夜に、\nオリンピックの延期が決まります。"}, {"t": 497.1333333333333, "x": "谷津が、足利の市長にあいさつに行った日でした。"}, {"t": 500.73333333333335, "x": "本人はのちに、取材にこう話しています。"}, {"t": 503.93333333333334, "x": "「『実際に走れなくても切符はもらった』\n『俺は五輪に縁がない男だ』と割り切る const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
