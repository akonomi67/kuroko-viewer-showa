<script>
const D={"name": "木村健悟", "file": "270_編集用", "dur": 874.0, "segs": [], "subs": [{"t": 0.0, "x": "1987年1月2日、東京の後楽園ホール。"}, {"t": 4.816666666666666, "x": "リングの上で、3つのカウントが入りました。"}, {"t": 8.016666666666667, "x": "勝ったのは木村健吾です。"}, {"t": 9.766666666666667, "x": "決め技は稲妻レッグラリアットでした。"}, {"t": 12.266666666666667, "x": "ところが、その勝ちは記録に残っていません。"}, {"t": 15.366666666666667, "x": "すねを守るレガースの中に、\n鉄のパイプが隠されていたからです。"}, {"t": 19.716666666666665, "x": "カウントのあと、パイプは\nリングの上に残っていました。"}, {"t": 23.3, "x": "裁定は無効試合に変わりました。"}, {"t": 25.65, "x": "その日のテレビ中継は、そこで終わっています。"}, {"t": 28.9, "x": "相手は、同じ年に生まれた藤波辰巳でした。"}, {"t": 32.36666666666667, "x": "この年、2人はともに33歳です。"}, {"t": 35.6, "x": "2人はそのとき、タッグの\nベルトを一緒に巻く仲間でした。"}, {"t": 39.75, "x": "この男は、のちに字を\n改めて木村健悟と名乗ります。"}, {"t": 43.583333333333336, "x": "そしてリングを降りたあと、\n品川区議会の議場に座ります。"}, {"t": 47.78333333333333, "x": "藤波の隣にいた男は、なぜ鉄のパイプを\n持ち込むところまで行ったのでしょうか？"}, {"t": 53.2, "x": "そして、どうやってリングから\n区議会までたどり着いたのでしょうか？"}, {"t": 57.516666666666666, "x": "今回は、木村健悟という1人の\nプロレスラーの31年を追います。"}, {"t": 62.416666666666664, "x": "リングを降りたあとの道のりも追います。"}, {"t": 64.75, "x": "新聞と雑誌に残った日付と、\n本人の言葉をもとに辿っていきます。"}, {"t": 69.65, "x": "最後までご覧いただければ幸いです。"}, {"t": 72.13333333333334, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 77.71666666666667, "x": "木村健悟は1953年、\n愛媛県新居浜市に生まれました。"}, {"t": 82.85, "x": "16歳で入ったのはプロレスではありません。"}, {"t": 85.71666666666667, "x": "相撲の部屋でした。"}, {"t": 87.13333333333334, "x": "ただし、相撲は1年でやめています。"}, {"t": 90.06666666666666, "x": "次に門をたたいたのが日本プロレスです。"}, {"t": 92.65, "x": "1972年のことでした。"}, {"t": 95.08333333333333, "x": "その直前の1971年12月には、\nアントニオ猪木が日本プロレスを追われています。"}, {"t": 101.75, "x": "理由は、会社を\n乗っ取ろうとしたというものでした。"}, {"t": 105.2, "x": "本人は、入った頃の会場の\n様子をこう書き残しています。"}, {"t": 109.53333333333333, "x": "毎日毎日、会場の客席が\nガラガラだったので、さすがにこのさき"}, {"t": 114.7, "x": "どうなるかと心細さを感じました。"}, {"t": 116.86666666666666, "x": "木村が付き人を務めたのは坂口征二です。"}, {"t": 119.83333333333333, "x": "1972年7月には、エースの\nジャイアント馬場も日本プロレスを去りました。"}, {"t": 125.6, "x": "残った坂口は翌年、猪木の\n新日本プロレスと手を組みます。"}, {"t": 130.15, "x": "1973年3月、木村は\n坂口とともに新日本へ移りました。"}, {"t": 135.75, "x": "新日本は、猪木がその前の年に\n旗揚げしたばかりの団体です。"}, {"t": 140.43333333333334, "x": "本人は、付き人として坂口と\n行動をともにすることになったと書いています。"}, {"t": 145.38333333333333, "x": "日本プロレスはこのあと、\nまもなく幕を閉じました。"}, {"t": 148.93333333333334, "x": "新日本での若手時代、木村には\n変わった役目が回ってきます。"}, {"t": 153.4, "x": "猪木の練習相手です。"}, {"t": 155.06666666666666, "x": "猪木は、ボクシングの世界王者モハメド・アリとの\n試合を控えていました。"}, {"t": 159.75, "x": "その試合で猪木が使ったのが、\n寝転んだ姿勢から足を蹴る戦法です。"}, {"t": 164.61666666666667, "x": "のちにアリキックと呼ばれる蹴りです。"}, {"t": 166.73333333333332, "x": "木村は練習で、その蹴りを受ける側に立ちました。"}, {"t": 170.33333333333334, "x": "本人はこう振り返っています。"}, {"t": 172.48333333333332, "x": "強敵を病院送りにしたアリキックは、\nサポーターをつけた状態で"}, {"t": 176.93333333333334, "x": "受けても相当なダメージが残った。"}, {"t": 179.08333333333334, "x": "最初にベルトをつかんだのは海の向こうでした。"}, {"t": 181.93333333333334, "x": "1978年12月のことです。"}, {"t": 184.93333333333334, "x": "場所はメキシコの団体EMLLです。"}, {"t": 187.55, "x": "NWA世界ライトヘビー級の王者になっています。"}, {"t": 190.98333333333332, "x": "1980年7月には、NWAインターナショナル・\nジュニアヘビー級の王座を取りました。"}, {"t": 197.53333333333333, "x": "体の軽い選手が闘う階級でのベルトです。"}, {"t": 200.63333333333333, "x": "1982年、木村はヘビー級に上がります。"}, {"t": 204.75, "x": "ところが、そこには長州力たちがいました。"}, {"t": 207.8, "x": "雑誌Numberの写真記者は、\n長州らの人気に押された木村が陰の"}, {"t": 212.31666666666666, "x": "存在として扱われ続けたと書いています。"}, {"t": 214.91666666666666, "x": "ここに1枚の写真があります。"}, {"t": 217.0, "x": "1982年12月19日、\n後楽園ホールで撮られたものです。"}, {"t": 222.48333333333332, "x": "藤波の持つWWFインターナショナル・ヘビー級の\nベルトに、木村が挑んだ夜でした。"}, {"t": 228.41666666666666, "x": "それでも、藤波と組めば話は別でした。"}, {"t": 231.6, "x": "1985年5月24日、神戸。"}, {"t": 235.6, "x": "2人はアメリカの2人組を破ります。"}, {"t": 238.03333333333333, "x": "手にしたのは\nWWFインターナショナル・タッグの王座でした。"}, {"t": 242.0, "x": "同じ年の12月12日、\n宮城県スポーツセンター。"}, {"t": 246.2, "x": "新しくできたIWGPタッグの、\nリーグ戦の決勝です。"}, {"t": 251.58333333333334, "x": "相手はアントニオ猪木と坂口征二の組でした。"}, {"t": 254.66666666666666, "x": "この写真は、その夜のリングで撮られたものです。"}, {"t": 258.06666666666666, "x": "藤波と木村はこの2人を破りました。"}, {"t": 260.6166666666667, "x": "初代のIWGPタッグ王者の誕生です。"}, {"t": 264.93333333333334, "x": "かつての付き人が、仕えた相手を倒した夜です。"}, {"t": 268.4, "x": "それでも記者の目には、木村は藤波の\n下に見えていたと記録されています。"}, {"t": 273.23333333333335, "x": "木村が動いたのは1986年10月でした。"}, {"t": 276.9166666666667, "x": "タッグのベルトは持ったままでした。"}, {"t": 279.0, "x": "相棒の藤波に、1対1の勝負を求めたのです。"}, {"t": 282.8833333333333, "x": "そのときの言葉が残っています。"}, {"t": 285.0, "x": "このままではいつまでも藤波を超えられない。"}, {"t": 287.6666666666667, "x": "12月10日、大阪城ホール。"}, {"t": 290.35, "x": "2人のシングルマッチは、\nおよそ4年ぶりでした。"}, {"t": 293.71666666666664, "x": "勝ったのは藤波です。"}, {"t": 295.28333333333336, "x": "決まり手は回転エビ固めでした。"}, {"t": 297.4, "x": "木村は納得しません。"}, {"t": 299.01666666666665, "x": "もう1度の勝負を求めます。"}, {"t": 300.96666666666664, "x": "そして冒頭の1987年1月2日、\n後楽園ホールです。"}, {"t": 306.35, "x": "試合の前、木村はマイクを握りました。"}, {"t": 309.46666666666664, "x": "無様な試合をしたら、オレは日本を離れる。"}, {"t": 312.7, "x": "ゴングの前から、\n木村は藤波に向かっていきました。"}, {"t": 316.26666666666665, "x": "場外では藤波の反撃を受けて血を流します。"}, {"t": 319.56666666666666, "x": "最後は稲妻レッグラリアットで押さえました。"}, {"t": 322.4166666666667, "x": "試合時間は16分2秒でした。"}, {"t": 324.9, "x": "そして、レガースの中のパイプが見つかります。"}, {"t": 328.15, "x": "勝ちは消えました。"}, {"t": 329.3833333333333, "x": "中継もそこで終わりました。"}, {"t": 331.2, "x": "翌日の1月3日、同じ後楽園ホール。"}, {"t": 334.75, "x": "今度は藤波が荒れました。"}, {"t": 336.6, "x": "カードを変えての一戦です。"}, {"t": 338.43333333333334, "x": "藤波は珍しく反則で暴走しました。"}, {"t": 341.28333333333336, "x": "結果は藤波の反則負けです。"}, {"t": 343.56666666666666, "x": "1月4日、埼玉県川越市での大会に、\n木村の姿はありませんでした。欠場です。"}, {"t": 350.56666666666666, "x": "決着の場は、1月12日の\nテレビ中継で知らされました。"}, {"t": 354.95, "x": "1月14日の後楽園ホールです。"}, {"t": 357.5833333333333, "x": "行うのは2人の試合1つだけ。"}, {"t": 359.8, "x": "1つの興行に試合が1つだけ。"}, {"t": 362.1333333333333, "x": "この形は、日本のプロレスで初めてでした。"}, {"t": 365.25, "x": "切符は前売りなしの当日券だけでした。"}, {"t": 367.93333333333334, "x": "料金は大人2000円、子ども1000円です。"}, {"t": 371.4166666666667, "x": "席は全部が自由席でした。"}, {"t": 373.46666666666664, "x": "一番乗りの客が並んだのは朝6時30分。"}, {"t": 376.73333333333335, "x": "正午には、列の長さが\n約700メートルになっていました。"}, {"t": 380.85, "x": "用意した1900枚は午後2時に売り切れます。"}, {"t": 383.98333333333335, "x": "追加の300枚もすぐになくなりました。"}, {"t": 386.5833333333333, "x": "発表された観衆は超満員の2200人です。"}, {"t": 390.1666666666667, "x": "それでも、入れなかった客が約700人いました。"}, {"t": 393.93333333333334, "x": "東京スポーツはそう伝えています。"}, {"t": 396.21666666666664, "x": "特別レフェリーは上田馬之助です。"}, {"t": 398.53333333333336, "x": "この写真には、藤波と木村と上田の\n3人がリングに並んでいます。"}, {"t": 403.3333333333333, "x": "上田は試合の前に、2人に握手をさせました。"}, {"t": 406.8, "x": "リングは、マットの下の\nばねを抜いた硬いつくりでした。"}, {"t": 410.56666666666666, "x": "17分32秒。"}, {"t": 412.28333333333336, "x": "藤波のバックドロップから、\n逆片エビ固めが決まります。"}, {"t": 416.25, "x": "木村はギブアップしました。"}, {"t": 417.93333333333334, "x": "試合のあと、木村は涙を流しています。"}, {"t": 421.1666666666667, "x": "レスリングを続けるかどうかも\n含めて、しばらく考えたい。"}, {"t": 425.0833333333333, "x": "そう話したと、東京スポーツは伝えています。"}, {"t": 428.4166666666667, "x": "雑誌Numberの写真記者の記事にも、\n木村の言葉が残っています。"}, {"t": 432.96666666666664, "x": "見出しになった言葉です。"}, {"t": 434.56666666666666, "x": "死んだオヤジに申し訳ない。"}, {"t": 436.46666666666664, "x": "数字も残りました。"}, {"t": 437.85, "x": "入ったお金は、会場を\n借りる料金のおよそ5倍でした。"}, {"t": 442.03333333333336, "x": "2つの金額は、東京スポーツの\n記事に残っています。"}, {"t": 445.98333333333335, "x": "関係者からは、\n両国国技館にすればよかったという声も"}, {"t": 450.0, "x": "出ています。"}, {"t": 450.6666666666667, "x": "木村は日本を離れました。"}, {"t": 452.48333333333335, "x": "向かったのはアメリカのロサンゼルスです。"}, {"t": 454.8333333333333, "x": "ジェットセンターというジムで、\n打撃の練習を積みました。"}, {"t": 458.9, "x": "1987年3月に帰国します。"}, {"t": 462.0833333333333, "x": "リングでの姿は変わっていました。"}, {"t": 464.1666666666667, "x": "長いパンタロンをはいています。"}, {"t": 466.1166666666667, "x": "蹴りを中心に組み立てる形です。"}, {"t": 468.3833333333333, "x": "本人は、この時期の思いをこう語っています。"}, {"t": 471.71666666666664, "x": "上のものを食って、再浮上したい。"}, {"t": 474.3333333333333, "x": "上の者と向き合う場面は、すぐに来ました。"}, {"t": 477.43333333333334, "x": "1987年6月12日、両国国技館。"}, {"t": 481.96666666666664, "x": "猪木がシリーズで優勝した直後の\nリングに、長州力が上がります。"}, {"t": 486.53333333333336, "x": "長州は上の世代と下の世代の\n争いを呼びかけました。"}, {"t": 490.1, "x": "その場で、猪木の張り手が木村の顔に飛びます。"}, {"t": 493.51666666666665, "x": "この写真は、その瞬間を\n両国国技館で撮ったものです。"}, {"t": 497.76666666666665, "x": "控室に戻った木村は、 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
