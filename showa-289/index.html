<script>
const D={"name": "三沢光晴が去ったあとの夏", "file": "289_編集用", "dur": 928.6, "segs": [], "subs": [{"t": 0.0, "x": "2009年6月13日、\n広島県立総合体育館グリーンアリーナです。"}, {"t": 5.716666666666667, "x": "プロレスリング・ノアの大会のメインで、\n1人の選手が動かなくなりました。"}, {"t": 10.3, "x": "三沢光晴、46歳です。"}, {"t": 13.116666666666667, "x": "ノアの社長であり、看板の選手でもありました。"}, {"t": 16.616666666666667, "x": "この夜の午後10時10分に、\n広島の病院で死亡が確認されました。"}, {"t": 21.616666666666667, "x": "社長を失った団体は、\n次の日もリングに上がっています。"}, {"t": 25.75, "x": "残された選手たちは、次の日の\n大会をどうしたのでしょうか？"}, {"t": 30.016666666666666, "x": "最後の試合の相手は、その後の\n日々で何を背負ったのでしょうか？"}, {"t": 34.583333333333336, "x": "今回は、2009年6月13日の夜から始めます。"}, {"t": 38.833333333333336, "x": "そして、9月27日の日本武道館までを追います。"}, {"t": 42.983333333333334, "x": "試合の時間と会場は、当時の新聞や\nスポーツの記事で確かめていきます。"}, {"t": 48.13333333333333, "x": "人々の言葉も、記事に\n残った形のまま見ていきます。"}, {"t": 52.03333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 54.53333333333333, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 60.1, "x": "まず三沢光晴の歩みを短く見ておきます。"}, {"t": 63.21666666666667, "x": "三沢は1962年6月18日に\n北海道の夕張で生まれました。"}, {"t": 68.51666666666667, "x": "1981年8月21日に\n全日本プロレスでデビューしています。"}, {"t": 73.7, "x": "1984年からは、2代目の\nタイガーマスクとして、リングに上がりました。"}, {"t": 79.38333333333334, "x": "1990年5月14日にマスクを脱いだ話は、\n以前の動画で取り上げました。"}, {"t": 85.38333333333334, "x": "2000年に、全日本プロレスを離れました。"}, {"t": 88.61666666666666, "x": "そしてプロレスリング・ノアを旗揚げします。"}, {"t": 91.11666666666666, "x": "この話も以前の動画で取り上げています。"}, {"t": 93.8, "x": "三沢は社長になりました。"}, {"t": 95.53333333333333, "x": "そして同時に、リングの\n真ん中にも立ち続けました。"}, {"t": 99.0, "x": "2009年の春、ノアには\n大きな変化がありました。"}, {"t": 102.73333333333333, "x": "日本テレビのノアの中継が\n3月で打ち切られたのです。"}, {"t": 106.2, "x": "日刊スポーツがそう書いています。"}, {"t": 108.33333333333333, "x": "ここに1枚の写真があります。"}, {"t": 110.41666666666667, "x": "三沢と若いレスラーが、\n並んで手を握っています。"}, {"t": 113.96666666666667, "x": "撮った人の記録では、\n2009年5月6日の日本武道館です。"}, {"t": 118.6, "x": "隣にいるのは潮崎豪です。"}, {"t": 120.7, "x": "6月13日の広島の試合でも、\n潮崎は三沢と組んでいました。"}, {"t": 125.65, "x": "6月13日の広島の大会のメインは、\nタッグの試合でした。"}, {"t": 130.45, "x": "GHCタッグ王座がかけられていました。"}, {"t": 133.25, "x": "挑んだのは三沢と潮崎の組です。"}, {"t": 135.68333333333334, "x": "王者は日本のレスラーと\n外国人のレスラーの組でした。"}, {"t": 139.15, "x": "試合が始まったのは、午後8時10分ごろです。"}, {"t": 142.7, "x": "デイリースポーツがそう書いています。"}, {"t": 144.85, "x": "午後8時45分ごろ、三沢は相手の\nバックドロップを受けました。"}, {"t": 149.46666666666667, "x": "頭を強く打ちました。"}, {"t": 151.05, "x": "三沢はそのまま動かなくなりました。"}, {"t": 153.31666666666666, "x": "リングの上で医師が\n心臓マッサージを続けています。"}, {"t": 156.6, "x": "試合は27分3秒でレフェリーが\n止めて終わりました。"}, {"t": 160.3, "x": "三沢は救急車で広島大学病院に運ばれました。"}, {"t": 163.96666666666667, "x": "広島県警によると、午後10時10分に\n死亡が確認されています。"}, {"t": 168.9, "x": "最後の試合の相手は、のちに話しています。"}, {"t": 172.2, "x": "この夜のことです。"}, {"t": 173.48333333333332, "x": "病院の廊下で医師から\n亡くなったと告げられました。"}, {"t": 176.53333333333333, "x": "本人の言葉です。"}, {"t": 177.93333333333334, "x": "信じられませんでした。"}, {"t": 179.53333333333333, "x": "あの三沢さんが。"}, {"t": 180.78333333333333, "x": "医師の許しを得て、\n朝まで三沢と同じ部屋にいました。"}, {"t": 184.76666666666668, "x": "記事はそう書いています。"}, {"t": 186.3, "x": "翌日の6月14日、広島県警の\n中央署が死因を明らかにしました。"}, {"t": 191.86666666666667, "x": "診断名は頸髄離断です。"}, {"t": 194.0, "x": "警察は事件性はありません、と話しました。"}, {"t": 197.5, "x": "日刊スポーツによると、\n三沢は首に古い傷を抱えていました。"}, {"t": 201.91666666666666, "x": "最近は肩と腰とひじも痛めていたそうです。"}, {"t": 204.91666666666666, "x": "副社長は泣き言を言わなかった、と\n振り返っています。"}, {"t": 208.9, "x": "6月14日、ノアには福岡で\n大会が入っていました。"}, {"t": 213.15, "x": "会場は博多スターレーンです。"}, {"t": 215.2, "x": "団体はこの大会を中止にしませんでした。"}, {"t": 218.06666666666666, "x": "副社長の話が日刊スポーツに残っています。"}, {"t": 221.21666666666667, "x": "ファンのためにも社長は中止を望んでいない。"}, {"t": 223.98333333333332, "x": "選手全員でそう確かめ合ったそうです。"}, {"t": 226.61666666666667, "x": "会場は満員でした。"}, {"t": 228.25, "x": "試合の前に追悼のゴングが鳴らされました。"}, {"t": 231.13333333333333, "x": "三沢の入場の曲が流れました。"}, {"t": 233.45, "x": "観客は一斉にミサワと声を送りました。"}, {"t": 236.3, "x": "同じ14日は、東京の後楽園ホールでも、\n大会がありました。"}, {"t": 241.4, "x": "新日本プロレスの大会です。"}, {"t": 243.53333333333333, "x": "デイリースポーツによると、第1試合の前に、\n1分の黙とうがささげられています。"}, {"t": 249.78333333333333, "x": "ノアの事務所は、東京の有明にあります。"}, {"t": 252.86666666666667, "x": "その扉は閉ざされていました。"}, {"t": 254.85, "x": "その前には、ファンが花束や\n手紙を手向けています。"}, {"t": 258.5, "x": "広島大学病院にも約10人のファンが訪れました。"}, {"t": 262.1166666666667, "x": "試合の会場だったグリーンアリーナにも、\n花束が置かれたそうです。"}, {"t": 266.56666666666666, "x": "博多のリングには最後の試合の相手も立ちました。"}, {"t": 269.6666666666667, "x": "試合の前から涙を流していたと\n記事は書いています。"}, {"t": 273.06666666666666, "x": "試合のあと、会場に置かれた三沢の\n遺影に向かいました。"}, {"t": 277.1333333333333, "x": "そしてリングの上で、\n涙ながらに土下座をしました。"}, {"t": 280.73333333333335, "x": "日刊スポーツはその言葉を残しています。"}, {"t": 283.45, "x": "引退も考えた。"}, {"t": 284.85, "x": "でも社長は弱音を吐くと怒るので。"}, {"t": 287.15, "x": "どんな十字架でも背負う。"}, {"t": 288.81666666666666, "x": "同じ夜の博多で、潮崎は\nGHCヘビー級王座に挑みました。"}, {"t": 293.65, "x": "相手はノアの仲間のレスラーでした。"}, {"t": 295.9, "x": "潮崎はこの試合に勝って、\n初めてこのベルトを取りました。"}, {"t": 299.95, "x": "潮崎は最初の挑戦者に、\n最後の試合の相手を指名しています。"}, {"t": 304.8, "x": "指名された側は、のちにこう話しました。"}, {"t": 307.85, "x": "始めは自分には挑戦する資格はないと思いました。"}, {"t": 311.26666666666665, "x": "この夜、三沢の遺体は\n広島から東京へ運ばれました。"}, {"t": 315.4, "x": "6月15日にはテレビの話も動いています。"}, {"t": 318.55, "x": "CS放送のチャンネルが、\n広島の試合を流す予定でした。"}, {"t": 323.05, "x": "放送は6月17日の予定です。"}, {"t": 325.65, "x": "チャンネルは、入場から選手の名前の\nコールまでを、流すと決めました。"}, {"t": 330.8833333333333, "x": "試合の場面は流さないことになりました。"}, {"t": 333.55, "x": "日刊スポーツは、映像は\nお蔵入りになる見込みが高いと書いています。"}, {"t": 338.25, "x": "6月19日には、別のCS放送の\nチャンネルが、追悼番組を組みました。"}, {"t": 344.1666666666667, "x": "長さは4時間15分です。"}, {"t": 346.26666666666665, "x": "6月18日は、三沢が\n生きていれば47歳になる日でした。"}, {"t": 350.9166666666667, "x": "この日、東京の自民党本部で\n会議が開かれています。"}, {"t": 354.96666666666664, "x": "プロレスの団体の人たちが招かれました。"}, {"t": 357.51666666666665, "x": "話し合ったのは事故を繰り返さない方法と、\n選手の体の管理です。"}, {"t": 362.23333333333335, "x": "議員からは、こんな声が出ました。"}, {"t": 364.81666666666666, "x": "プロレス業界として、統一した協会がない。"}, {"t": 368.21666666666664, "x": "ノアの幹部は、レフェリーや\n対戦相手について話しました。"}, {"t": 372.1666666666667, "x": "試合の中で、相手の\n様子を見る技術を身に付けてほしい。"}, {"t": 376.43333333333334, "x": "全日本プロレスの社長は、こう話しています。"}, {"t": 379.75, "x": "統一的な機構ができるかどうか、考えたい。"}, {"t": 383.0833333333333, "x": "6月19日、東京の中野区の\n宝仙寺で告別式が営まれました。"}, {"t": 388.31666666666666, "x": "近い人だけの密葬でしたが、\n約200人が参列しています。"}, {"t": 392.8333333333333, "x": "前の日には100人ほどの席を\n用意していたそうです。"}, {"t": 396.1333333333333, "x": "遺影はリングの姿ではありませんでした。"}, {"t": 398.78333333333336, "x": "レーシングスーツを着て満面の\n笑みを浮かべた写真です。"}, {"t": 402.26666666666665, "x": "三沢は2000年に1度だけ、\n筑波のナイター耐久レースに出ています。"}, {"t": 406.98333333333335, "x": "その前に、撮られた1枚でした。"}, {"t": 409.6166666666667, "x": "祭壇には人形が並びました。"}, {"t": 411.8333333333333, "x": "ウルトラマンや仮面ライダーです。"}, {"t": 413.81666666666666, "x": "三沢が、生前に集めていたものです。"}, {"t": 416.78333333333336, "x": "午後0時11分、霊きゅう車が\nクラクションを鳴らして、寺を出ました。"}, {"t": 421.85, "x": "ひつぎは、9人のレスラーに\n担がれて運ばれました。"}, {"t": 425.55, "x": "その中には潮崎もいました。"}, {"t": 427.5833333333333, "x": "この日、7月4日にお別れの会を\n開くことが正式に決まりました。"}, {"t": 432.46666666666664, "x": "7月4日、場所は東京のディファ有明です。"}, {"t": 436.1, "x": "ノアが旗揚げの大会を開いた会場でした。"}, {"t": 439.0, "x": "会の名前は三沢光晴お別れ会デパーチャーです。"}, {"t": 442.4166666666667, "x": "一般の受付は午後2時から午後6時まででした。"}, {"t": 445.5833333333333, "x": "スポーツナビによると、\nファンの列は長く伸びました。"}, {"t": 448.96666666666664, "x": "最寄りの有明テニスの森駅を、越えていきました。"}, {"t": 452.4166666666667, "x": "そして隣の隣の駅まで伸びたそうです。"}, {"t": 455.1333333333333, "x": "会場の中の献花が終わったのは、\n午後7時30分過ぎでした。"}, {"t": 459.7, "x": "祭壇には、三沢の大きな写真が置かれました。"}, {"t": 463.21666666666664, "x": "GHCヘビー級のベルトを、腰に巻いた姿です。"}, {"t": 467.1333333333333, "x": "その前にはノアの緑色のリングがありました。"}, {"t": 470.03333333333336, "x": "入場の曲のスパルタンXが流れ続けました。"}, {"t": 473.25, "x": "追悼の10カウントのゴングが鳴らされました。"}, {"t": 476.03333333333336, "x": "そして最後のリングコールがありました。"}, {"t": 478.45, "x": "赤コーナー、250パウンド、三沢光晴。"}, {"t": 482.3333333333333, "x": "友人の代表は、アナウンサーでした。"}, {"t": 485.31666666666666, "x": "その人が弔辞を読みました。"}, {"t": 487.1666666666667, "x": "君ほど私利私欲を考えず、\nプロレス界のことを考えた人はいなかった。"}, {"t": 492.05, "x": "アナウンサーは三沢のことを、\n心の友と書いて心友、とも呼んでいます。"}, {"t": 497.25, "x": "実行委員長の副社長は、会の前に、\n1万人は超えるのではと話していました。"}, {"t": 503.4, "x": "最後の発表は2万5千人でした。"}, {"t": 506.0, "x": "供えられた花も1000を超えています。"}, {"t": 508.3333333333333, "x": "会場にはほかの団体のレスラーたちも\n来賓として訪れました。"}, {"t": 512.3166666   d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
