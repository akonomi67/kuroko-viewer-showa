<script>
const D={"name": "WARの8年", "file": "299_編集用", "dur": 958.16665625, "segs": [], "subs": [{"t": 0.0, "x": "1992年7月14日、\n東京の後楽園ホールです。"}, {"t": 5.216666666666667, "x": "この夜、新しいプロレス団体が\n旗揚げの大会を開きました。"}, {"t": 9.683333333333334, "x": "名前はWARです。"}, {"t": 11.516666666666667, "x": "団体の顔は天龍源一郎でした。"}, {"t": 14.15, "x": "天龍はこのとき42歳です。"}, {"t": 16.433333333333334, "x": "メインのリングには天龍が立ちました。"}, {"t": 18.816666666666666, "x": "それから8年がたちます。"}, {"t": 20.6, "x": "2000年7月、同じ後楽園ホールです。"}, {"t": 23.983333333333334, "x": "WARは旗揚げ8周年の大会を開きました。"}, {"t": 27.583333333333332, "x": "この大会を最後に、WARは活動を止めます。"}, {"t": 31.816666666666666, "x": "後楽園ホールで始まった団体は、\n後楽園ホールで止まったのです。"}, {"t": 36.63333333333333, "x": "旗揚げの夜から8年目の夏までに、\n何があったのでしょうか？"}, {"t": 41.2, "x": "天龍が団体の顔のまま、\nWARはなぜ止まったのでしょうか？"}, {"t": 46.333333333333336, "x": "今回はWARを追います。"}, {"t": 48.516666666666666, "x": "1992年の夏から2000年の夏までです。"}, {"t": 52.166666666666664, "x": "日付と数字は、新聞の記事や当時の\n大会の記録と照らし合わせます。"}, {"t": 57.016666666666666, "x": "資料によって日付が違うところは、\nどちらの資料かを言ってから進みます。"}, {"t": 61.96666666666667, "x": "最後までご覧いただければ幸いです。"}, {"t": 64.46666666666667, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 70.03333333333333, "x": "始まりは1つ前の団体です。"}, {"t": 72.16666666666667, "x": "名前はSWSでした。"}, {"t": 74.18333333333334, "x": "SWSは1990年5月に生まれた団体です。"}, {"t": 78.4, "x": "眼鏡の会社のメガネスーパーがお金を出しました。"}, {"t": 81.51666666666667, "x": "天龍は全日本プロレスを離れて\nSWSのエースになりました。"}, {"t": 85.76666666666667, "x": "このころ週刊プロレスは、\n天龍がお金で動いたと書きました。"}, {"t": 90.06666666666666, "x": "この言葉は、のちのWARにも関わってきます。"}, {"t": 93.63333333333334, "x": "SWSでマッチメーカーを務めたのは\nザ・グレート・カブキです。"}, {"t": 97.55, "x": "カブキはのちに東京スポーツの連載で、\nSWSのころを振り返っています。"}, {"t": 103.25, "x": "社長は、お金は出すけど口は出さない人でした。"}, {"t": 106.78333333333333, "x": "カブキはそう話しています。"}, {"t": 108.55, "x": "1991年4月1日、神戸の大会で\n1つの試合が問題になりました。"}, {"t": 114.78333333333333, "x": "天龍とカブキは責任を取って、\n社長に辞表を出します。"}, {"t": 118.9, "x": "辞表は受け取られませんでした。"}, {"t": 120.86666666666666, "x": "それでもカブキは役職を外れました。"}, {"t": 123.3, "x": "SWSは2年ほどで割れました。"}, {"t": 125.76666666666667, "x": "1992年5月、谷津嘉章が会見を開きます。"}, {"t": 130.66666666666666, "x": "谷津は選手会長を辞めてSWSを\n退団すると発表しました。"}, {"t": 135.13333333333333, "x": "選手は天龍の側とそれ以外の側に分かれます。"}, {"t": 138.36666666666667, "x": "SWSの最後の試合は、\n1992年6月19日の長崎の大会でした。"}, {"t": 144.96666666666667, "x": "長崎が最後になったのは日程の都合でした。"}, {"t": 148.05, "x": "解散の大会という空気はありませんでした。"}, {"t": 150.83333333333334, "x": "お客さんは入りましたね、と\nカブキは話しています。"}, {"t": 154.38333333333333, "x": "長崎の大会から25日後です。"}, {"t": 156.96666666666667, "x": "天龍の側の選手たちが、\nWARとして旗揚げします。"}, {"t": 161.61666666666667, "x": "旗揚げの大会は2日続きでした。"}, {"t": 164.01666666666668, "x": "7月14日と15日です。"}, {"t": 166.26666666666668, "x": "会場はどちらも後楽園ホールでした。"}, {"t": 168.9, "x": "14日のメインはタッグの試合です。"}, {"t": 171.33333333333334, "x": "天龍の組む相手は折原昌夫でした。"}, {"t": 173.88333333333333, "x": "折原は全日本プロレスのころ、\n天龍の最後の付け人だった選手です。"}, {"t": 178.86666666666667, "x": "SWSにも天龍について移りました。"}, {"t": 181.78333333333333, "x": "SWSが割れる直前は、\nメキシコに遠征していました。"}, {"t": 186.11666666666667, "x": "この夜は帰ってきて最初の試合です。"}, {"t": 188.66666666666666, "x": "天龍が自分で選んだパートナーでした。"}, {"t": 191.18333333333334, "x": "相手はカブキと北原辰巳の組でした。"}, {"t": 193.76666666666668, "x": "試合では折原が続けて攻められました。"}, {"t": 196.38333333333333, "x": "北原は顔へのキックを何度も入れました。"}, {"t": 199.06666666666666, "x": "カブキはラリアットを4発続けて、\nパワーボムを出します。"}, {"t": 203.03333333333333, "x": "これは天龍が割って入って止めました。"}, {"t": 205.46666666666667, "x": "最後はカブキのタイガードライバーで、\n折原が3つ数えられます。"}, {"t": 209.93333333333334, "x": "試合のあと、折原は控室で大の字になりました。"}, {"t": 213.7, "x": "そして救急車で運ばれていきました。"}, {"t": 216.16666666666666, "x": "東京スポーツのカメラマンが、\nこの夜の写真を残しています。"}, {"t": 220.43333333333334, "x": "折原はのちにWARで新しい技を作っています。"}, {"t": 224.23333333333332, "x": "コーナーの一番上から投げるジャーマンです。"}, {"t": 226.91666666666666, "x": "WARを動かすお金は、\nどこから出たのでしょうか。"}, {"t": 230.73333333333332, "x": "天龍はのちに、こう明かしています。"}, {"t": 233.43333333333334, "x": "新日本で稼いでいたお金は、\n全部WARにつぎ込んでいました。"}, {"t": 238.25, "x": "妻の家の財産も、全部WARにつぎ込みました。"}, {"t": 242.3, "x": "天龍の妻はWARの\nチーフとして団体を支えました。"}, {"t": 246.2, "x": "WARの社長は武井という人が務めました。"}, {"t": 249.45, "x": "旗揚げのあと、天龍は\nファンにこう呼びかけました。"}, {"t": 253.01666666666668, "x": "「だまされたと思って俺についてきてよ。"}, {"t": 255.4, "x": "絶対損はさせない」。"}, {"t": 256.93333333333334, "x": "WARが目を付けたのは、\nほかの団体との試合でした。"}, {"t": 260.96666666666664, "x": "相手は新日本プロレスです。"}, {"t": 262.98333333333335, "x": "1992年10月、\nWARは新日本と戦い始めます。"}, {"t": 268.75, "x": "10月23日の後楽園ホールには、\n天龍と北原の組が出ました。"}, {"t": 273.9166666666667, "x": "相手は新日本の越中詩郎と木村健悟の組でした。"}, {"t": 277.55, "x": "ここから新日本との戦いが続いていきます。"}, {"t": 280.48333333333335, "x": "天龍は新日本のリングで\nシングルの試合を重ねました。"}, {"t": 284.1333333333333, "x": "相手は長州力、橋本真也、\n藤波辰爾、グレート・ムタです。"}, {"t": 289.73333333333335, "x": "東京スポーツは、この名前を並べて書いています。"}, {"t": 293.26666666666665, "x": "百科事典の記事は、1993年の\nシングルの試合を月ごとに並べています。"}, {"t": 299.3333333333333, "x": "1月に長州、2月に木村です。"}, {"t": 302.23333333333335, "x": "6月と8月に橋本、9月に蝶野正洋と馳浩です。"}, {"t": 306.85, "x": "12月は藤波でした。"}, {"t": 308.6666666666667, "x": "記事では、どれも天龍の勝ちとされています。"}, {"t": 311.76666666666665, "x": "戦いの中で、WARから離れた選手もいました。"}, {"t": 316.0833333333333, "x": "カブキです。"}, {"t": 316.96666666666664, "x": "1992年11月17日、\n福井県の鯖江で会見が開かれました。"}, {"t": 323.1, "x": "新日本の大会がある日の数時間前です。"}, {"t": 326.1166666666667, "x": "越中たちのグループとカブキが\n手を組むという発表でした。"}, {"t": 329.65, "x": "越中は、天龍を倒すことで\n気持ちが一致したと話しました。"}, {"t": 333.93333333333334, "x": "カブキは、自分はフリーの立場だと話しました。"}, {"t": 337.3833333333333, "x": "WARの会社も言葉を出しています。"}, {"t": 340.1, "x": "カブキはフリーなので\n答えられない、というものでした。"}, {"t": 343.6333333333333, "x": "後にわかったことがあります。"}, {"t": 345.43333333333334, "x": "カブキの移籍は、新日本からの\n申し出による交換でした。"}, {"t": 349.55, "x": "WARには新日本から\nスーパー・ストロング・マシンが来ています。"}, {"t": 353.6666666666667, "x": "1994年2月5日、札幌です。"}, {"t": 357.5, "x": "WARと越中たちのグループが戦いました。"}, {"t": 360.68333333333334, "x": "7人ずつのシングルの対抗戦です。"}, {"t": 363.26666666666665, "x": "結果は越中たちの4勝3敗でした。"}, {"t": 366.0, "x": "越中たちは次の日も戦いました。"}, {"t": 368.31666666666666, "x": "新日本の本隊との7人ずつの\n対抗戦にも勝っています。"}, {"t": 372.23333333333335, "x": "そして、天龍がずっと\n口にしていた相手がいました。"}, {"t": 375.8333333333333, "x": "アントニオ猪木です。"}, {"t": 377.25, "x": "天龍は1992年7月に、\n猪木への挑戦を口にしています。"}, {"t": 382.6666666666667, "x": "WARの旗揚げと同じ月です。"}, {"t": 385.21666666666664, "x": "1993年1月4日の東京ドームで、\n猪木がこれを受けました。"}, {"t": 390.68333333333334, "x": "試合はその1年後です。"}, {"t": 392.6, "x": "1994年1月4日、東京ドームです。"}, {"t": 396.81666666666666, "x": "猪木はチョーク・スリーパーで\n天龍を締め落とす場面を見せました。"}, {"t": 400.7, "x": "それでも最後は天龍のパワーボムでした。"}, {"t": 403.3666666666667, "x": "15分56秒、エビ固めです。"}, {"t": 406.5, "x": "天龍は猪木から3つ数えて勝ちました。"}, {"t": 409.1333333333333, "x": "百科事典の記事は、天龍をこう書いています。"}, {"t": 412.6, "x": "馬場と猪木の両方から3つを取った、\nただ1人の日本人です。"}, {"t": 417.18333333333334, "x": "天龍は新日本のほかの団体とも戦いました。"}, {"t": 420.35, "x": "1994年3月2日は両国国技館です。"}, {"t": 424.28333333333336, "x": "天龍は阿修羅・原と組みました。"}, {"t": 426.45, "x": "相手は大仁田厚とターザン後藤の組でした。"}, {"t": 429.43333333333334, "x": "5月には、FMWのリングで大仁田と\n電流爆破の試合をしています。"}, {"t": 434.6666666666667, "x": "百科事典の記事に、そう書かれています。"}, {"t": 437.7, "x": "この1994年に、WARを離れた人もいました。"}, {"t": 442.75, "x": "石川敬士です。"}, {"t": 444.06666666666666, "x": "石川は自分の団体として東京プロレスを\n立ち上げます。"}, {"t": 447.73333333333335, "x": "カブキは1994年7月、\n新日本との契約を終えました。"}, {"t": 452.8833333333333, "x": "カブキはWARには戻らず、\n東京プロレスに移りました。"}, {"t": 457.3, "x": "WARの顔ぶれは少しずつ変わっていきます。"}, {"t": 460.5, "x": "1995年4月2日、東京ドームで\n大きな大会が開かれました。"}, {"t": 466.06666666666666, "x": "名前は「夢の懸け橋」です。"}, {"t": 468.45, "x": "13の団体が集まった大会でした。"}, {"t": 471.06666666666666, "x": "主催は週刊プロレスを出している\nベースボール・マガジン社です。"}, {"t": 474.76666666666665, "x": "大会を作ったのは週刊プロレスの\nターザン山本でした。"}, {"t": 478.4166666666667, "x": "発表の観客は6万人です。"}, {"t": 480.76666666666665, "x": "メインでは橋本真也が蝶野を破りました。"}, {"t": 483.6666666666667, "x": "橋本が山本をリングに呼び込むと、\n場内からブーイングが起きました。"}, {"t": 488.43333333333334, "x": "この大会にWARの名前はありませんでした。"}, {"t": 491.6666666666667, "x": "WARは同じ日に、後楽園ホールで\n大会を開いていたのです。"}, {"t": 496.43333333333334, "x": "山本はのちに、東京スポーツの\n取材にこう話しています。"}, {"t": 500.55, "x": "WARにはお金の条件も伝えました。"}, {"t": 503.46666666666664, "x": "後楽園ホールが満員になったときの\n売り上げを払う、という条件です。"}, {"t": 508.5, "x": "その形で、ドームに出てほしいと頼みました。"}, {"t": 511.75, "x": "WARの社長は断りました。"}, {" const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';

  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
