<script>
const D={"name": "ロード・ウォリアーズ初来日", "file": "215_編集用", "dur": 825.1333125, "segs": [], "subs": [{"t": 0.0, "x": "1985年3月8日、千葉県船橋市。"}, {"t": 4.25, "x": "イメージ映像"}, {"t": 4.25, "x": "全日本プロレスのシリーズ「激闘! \nエキサイティング・ウォーズ」の一戦です。"}, {"t": 8.833333333333334, "x": "日本側に立っていたのは、アニマル\n浜口とキラー・カーンの2人でした。"}, {"t": 13.433333333333334, "x": "相手は、この日が日本での最初の\n試合になる外国人のタッグチームです。"}, {"t": 18.5, "x": "試合は3分39秒で終わりました。"}, {"t": 21.45, "x": "肩に大きなトゲの付いた防具を着け、\n顔にペイントを入れた2人組です。"}, {"t": 26.383333333333333, "x": "名前をロード・ウォリアーズといいます。"}, {"t": 28.6, "x": "ホークとアニマル。"}, {"t": 29.666666666666668, "x": "そしてマネージャーのポール・エラリング。"}, {"t": 31.783333333333335, "x": "この3人が、前日の3月7日に\n成田空港に降りていました。"}, {"t": 36.333333333333336, "x": "到着の日に空港で開かれた記者会見には、\nプロレスの専門誌だけでなく、"}, {"t": 41.38333333333333, "x": "一般の週刊誌の記者も集まっています。"}, {"t": 44.31666666666667, "x": "イメージ映像"}, {"t": 44.31666666666667, "x": "日本で試合をする前から、\nこの2人の名前は知られていました。"}, {"t": 48.6, "x": "今回は、1985年3月7日の成田空港から、\n彼らが全日本プロレスに来なくなる1989"}, {"t": 57.1, "x": "年3月までを、具体的な日付と\n記録をもとに辿っていきます。"}, {"t": 61.38333333333333, "x": "最後までご覧いただければ幸いです。"}, {"t": 63.86666666666667, "x": "それでは本編に入る前に、チャンネル\n登録と高評価をよろしくお願いいたします。"}, {"t": 69.45, "x": "まず、この2人が何者だったのかから始めます。"}, {"t": 73.0, "x": "ホークの本名はマイケル・ジェイムズ・\nヘグストランドといいます。"}, {"t": 76.48333333333333, "x": "1957年9月12日生まれ。"}, {"t": 79.56666666666666, "x": "ミネソタ州ミネアポリスの出身です。"}, {"t": 82.1, "x": "イメージ映像"}, {"t": 82.1, "x": "身長は191センチ、全盛期の体重は\n125キロと記録されています。"}, {"t": 88.01666666666667, "x": "アニマルの本名はジョセフ・マイケル・\nロウリネイティスといいます。"}, {"t": 91.51666666666667, "x": "1960年生まれ。"}, {"t": 93.5, "x": "ペンシルベニア州フィラデルフィアの出身です。"}, {"t": 96.28333333333333, "x": "身長は189センチ、全盛期の体重は\n135キロと記録されています。"}, {"t": 102.38333333333334, "x": "イメージ映像"}, {"t": 102.38333333333334, "x": "2人はどちらも、ミネソタで同じ\nトレーナーから指導を受けています。"}, {"t": 106.75, "x": "アニマルのデビューは1982\n年9月と記録されています。"}, {"t": 110.95, "x": "ホークは1983年、カナダのバンクーバーで、\nクラッシャー・フォン・ヘイグという別の"}, {"t": 117.35, "x": "リングネームでデビューしました。"}, {"t": 118.98333333333333, "x": "イメージ映像"}, {"t": 118.98333333333333, "x": "つまり2人は、それぞれ別の名前で、\n別の場所で試合を始めた選手でした。"}, {"t": 124.55, "x": "2人が組んだのは1983年です。"}, {"t": 127.75, "x": "アメリカ南部のジョージア地区で、\n当時この団体で試合を組む立場にいた人物が、"}, {"t": 133.03333333333333, "x": "2人をタッグチームにしました。"}, {"t": 135.21666666666667, "x": "チームの名前は、1981年に\n公開された映画から取られています。"}, {"t": 140.66666666666666, "x": "原題を「マッドマックス2 ザ・\nロード・ウォリアー」といいます。"}, {"t": 144.33333333333334, "x": "荒れ果てた世界を走り回る荒くれ者たちが\n出てくる映画です。"}, {"t": 148.2, "x": "見た目もその映画に寄せて作られました。"}, {"t": 150.68333333333334, "x": "マネージャーには、選手を引退した\nポール・エラリングが就いています。"}, {"t": 154.96666666666667, "x": "エラリングは1953年8月22日生まれ。"}, {"t": 158.88333333333333, "x": "現役時代の身長は183センチ、\n体重は110キロと記録されています。"}, {"t": 165.03333333333333, "x": "イメージ映像"}, {"t": 165.03333333333333, "x": "ただし、組んだ当初の見た目は、後に日本で\n知られることになる姿とは違っていました。"}, {"t": 171.1, "x": "サングラスをかけ、革のベストと制帽を\n身に着けた、暴走族のような格好です。"}, {"t": 177.25, "x": "顔にペイントを入れるようになったのは\nその後のことでした。"}, {"t": 180.43333333333334, "x": "ペイントは、当時アメリカで団体を\n運営していたビル・ワッツの提案で"}, {"t": 184.91666666666666, "x": "始まったと記録されています。"}, {"t": 186.63333333333333, "x": "髪型も変えています。"}, {"t": 188.15, "x": "アニマルが頭の真ん中を残して両側を\n刈り上げる形、ホークがその逆で、"}, {"t": 193.38333333333333, "x": "真ん中を刈って両側を残す形にしました。"}, {"t": 196.5, "x": "入場のときに流れていた曲は、\nイギリスのロックバンド、ブラック・"}, {"t": 201.25, "x": "サバスの「アイアン・マン」です。"}, {"t": 202.73333333333332, "x": "そして試合の入り方も特徴的でした。"}, {"t": 205.28333333333333, "x": "リングの一番下のロープの下から\n滑り込むように入り、名前を呼ばれるのを"}, {"t": 210.3, "x": "待たずにそのまま相手に向かっていく。"}, {"t": 212.36666666666667, "x": "イメージ映像"}, {"t": 212.36666666666667, "x": "試合そのものも短く、彼らの試合時間は\nアメリカでも秒単位で伝えられていました。"}, {"t": 218.13333333333333, "x": "2人は組んだその年、1983年\n6月10日にNWAナショナル・"}, {"t": 223.8, "x": "タッグ王座の王者になりました。"}, {"t": 225.63333333333333, "x": "この王座はこの後、通算3回獲っています。"}, {"t": 229.01666666666668, "x": "1984年7月、2人はミネソタを\n本拠地とするAWAという団体に移りました。"}, {"t": 236.01666666666668, "x": "そして1984年8月25日、ネバダ州\nラスベガスでクラッシャー・リソワスキーと"}, {"t": 242.38333333333333, "x": "バロン・フォン・ラシクの2人を破り、\nAWA世界タッグ王座を獲得しています。"}, {"t": 247.86666666666667, "x": "日本に来る半年前の時点で、\n彼らはアメリカの世界タッグ王者でした。"}, {"t": 252.96666666666667, "x": "では、なぜ試合をする前から日本で\n名前が知られていたのでしょうか。"}, {"t": 257.65, "x": "当時、テレビ東京で「世界のプロレス」と\nいう番組が放送されていました。"}, {"t": 262.6166666666667, "x": "海外のプロレスの映像を紹介する番組です。"}, {"t": 265.8, "x": "イメージ映像"}, {"t": 265.8, "x": "この番組で2人の試合が流れたことで、来日が\n待たれる存在になっていたと記録されています。"}, {"t": 271.95, "x": "天龍源一郎は、2人の初来日の直前に、\nこの番組の解説を務めていた評論家に「"}, {"t": 278.55, "x": "イメージ映像"}, {"t": 278.55, "x": "ロード・ウォリアーズを知りたい」と言って、\n番組のテープを借りたと伝えられています。"}, {"t": 283.3333333333333, "x": "初来日のときには、2人について\nこういう触れ込みも流されました。"}, {"t": 287.8, "x": "シカゴで用心棒をしていた。"}, {"t": 289.76666666666665, "x": "貧しかった頃はネズミを食べていた。"}, {"t": 292.06666666666666, "x": "スラム街でゴミ箱をあさっているところを\nエラリングにスカウトされた。"}, {"t": 295.98333333333335, "x": "イメージ映像"}, {"t": 295.98333333333335, "x": "これらは当時の宣伝の\n文句として記録が残っているものです。"}, {"t": 299.71666666666664, "x": "事実として確認されたものではありません。"}, {"t": 302.31666666666666, "x": "そして1985年3月7日、成田空港。"}, {"t": 306.56666666666666, "x": "翌3月8日、船橋での初戦。"}, {"t": 309.45, "x": "3分39秒。"}, {"t": 311.15, "x": "この日から2日後の3月9日、\n彼らは東京・両国のリングに立ちます。"}, {"t": 316.28333333333336, "x": "会場は両国国技館でした。"}, {"t": 318.5, "x": "イメージ映像"}, {"t": 318.5, "x": "ただし、当時の両国国技館は、\nまだできたばかりの建物です。"}, {"t": 323.46666666666664, "x": "前年1984年11月30日に完成し、\n1985年1月9日に落成式が行われています。"}, {"t": 332.6, "x": "相撲でこの建物が使われ始めたのが、\n1985年1月場所からでした。"}, {"t": 338.48333333333335, "x": "そして1985年3月9日の全日本\nプロレスの大会が、この新しい両国国技館で"}, {"t": 345.46666666666664, "x": "行われた最初のプロレス興行でした。"}, {"t": 347.8333333333333, "x": "その日のメインイベントに組まれたのが、\nジャンボ鶴田と天龍源一郎が持っていた"}, {"t": 352.8333333333333, "x": "インターナショナル・タッグ王座への挑戦です。"}, {"t": 355.4, "x": "挑戦者がロード・ウォリアーズでした。"}, {"t": 357.55, "x": "イメージ映像"}, {"t": 357.55, "x": "新しくできた建物の、プロレスとしての最初の日。"}, {"t": 361.05, "x": "そのいちばん最後の試合が、来日3日目の\n外国人チームの王座挑戦だったことになります。"}, {"t": 367.3333333333333, "x": "この日、ベルトは動きませんでした。"}, {"t": 369.96666666666664, "x": "イメージ映像"}, {"t": 369.96666666666664, "x": "その5日後の1985年3\n月14日、愛知県体育館。"}, {"t": 375.3666666666667, "x": "今度は自分たちが持っていたAWA\n世界タッグ王座の防衛戦です。"}, {"t": 380.1333333333333, "x": "挑戦者は長州力とキラー・カーンでした。"}, {"t": 382.8833333333333, "x": "この試合も王座は動いていません。"}, {"t": 385.1, "x": "初来日のときの2人の待遇についても、\n当時の記録が残っています。"}, {"t": 389.96666666666664, "x": "「週刊プロレス」「週刊ゴング」\n「東京スポーツ」によれば、"}, {"t": 393.21666666666664, "x": "マネージャーのエラリングを含めた3人で、\n1週間あたり3万ドルだったとされています。"}, {"t": 399.25, "x": "当時の全日本プロレスの外国人選手の\n中で、この額は破格でした。"}, {"t": 404.2, "x": "ブルーザー・ブロディが全日本プロレスを\n離れて新日本プロレスへ移ったことについて、"}, {"t": 409.2, "x": "ロード・ウォリアーズへの厚遇に対する不満に\nよるものだった、という見方も残されています。"}, {"t": 415.23333333333335, "x": "イメージ映像"}, {"t": 415.23333333333335, "x": "ただし、これは移籍の\n理由として挙げられているうちの一つであって、"}, {"t": 419.6666666666667, "x": "断定されているものではありません。"}, {"t": 422.2, "x": "ここから、彼らが全日本\nプロレスで残した記録を並べます。"}, {"t": 426.3833333333333, "x": "1987年3月12日、日本武道館。"}, {"t": 430.76666666666665, "x": "ロード・ウォリアーズは、ジャンボ鶴田と\n天龍源一郎の組を破り、インターナショナル・"}, {"t": 436.45, "x": "タッグ王座を獲得しました。"}, {"t": 438.23333333333335, "x": "2年前の1985年3月9日に挑戦して届かなかった\nベルトを、2年後に獲ったことになります。"}, {"t": 445.56666666666666, "x": "この王座は長く保持されました。"}, {"t": 447.6333333333333, "x": "手放したのは1988年6月10日です。"}, {"t": 451.31666666666666, "x": "相手はジャンボ鶴田と谷津嘉章の組でした。"}, {"t": 454.18333333333334, "x": "保持期間は1年を超えています。"}, {"t": 456.3833333333333, "x": "日本に来ていた同じ時期、\n2人はアメリカでも試合を続けています。"}, {"t": 460.9, "x": "1985年7月16日、アメリカで\n行われた「グレート・アメリカン・"}, {"t": 466.51666666666665, "x": "バッシュ」という大会に登場しました。"}, {"t": 468.6333333333333, "x": "1985年9月28日には、\nファビュラス・フリーバーズのマイケル・"}, {"t": 473.76666666666665, "x": "ヘイズとテリー・ゴーディの組を下して\nAWA世界タッグ王座を防衛しています。"}, {"t": 478.6, "x": "ただしその翌日、9月29日に\n王座から陥落しました。"}, {"t": 482.95, "x": "1986年4月19日には、タッグ\nチームのトーナメントで優勝しています。"}, {"t": 489.1333333333333, "x": "1988年10月29日には、\nNWA世界タッグ王座を獲得しました。"}, {"t": 495.75, "x": "その1988年には、けがの記録も残っています。"}, {"t": 500.23333333333335, "x": "1月28日の試合中の事故で、\nアニマルが鼻の骨と頬の骨を折りました。"}, {"t": 505.9166666666667, "x": "翌月いっぱい試合を休み、3月に\n戻ってきた後しばらくは、アイスホッケーの"}, {"t": 511.6333333333333, "x": "防具のマスクを着けて試合に出ています。"}, {"t": 513.9833333333333, "x": "またこの時期、2人はアメリカで天龍源一郎と\n組み、3人1組で争う王座も獲得しています。"}, {"t": 521.1, "x": "日本のリングで戦っていた相手と、アメリカでは\n同じ側に立っていたことになります。 const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
