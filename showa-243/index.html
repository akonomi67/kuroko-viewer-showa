<script>
const D={"name": "剛竜馬", "file": "243_編集用", "dur": 889.4333125, "segs": [], "subs": [{"t": 0.0, "x": "1986年3月2日、\n岩手県の陸前高田市民体育館。"}, {"t": 5.683333333333334, "x": "全日本プロレスの地方大会で、1人の選手が\nいつも通りリングに上がっていました。"}, {"t": 11.2, "x": "名前は剛竜馬。"}, {"t": 12.583333333333334, "x": "この日の試合が、\n全日本での最後の試合になります。"}, {"t": 16.433333333333334, "x": "この大会を最後に、\n剛は同じ軍団の仲間2人とともに、"}, {"t": 20.666666666666668, "x": "全日本プロレスを解雇されました。"}, {"t": 23.15, "x": "参戦から、わずか1年4か月でした。"}, {"t": 26.35, "x": "そしてこの男は、6年後にもう一度、\n自分の団体から追い出されることになります。"}, {"t": 32.21666666666667, "x": "なぜ剛竜馬は、全日本プロレスを\n追われることになったのでしょうか。"}, {"t": 36.68333333333333, "x": "今回は、剛竜馬という男の歩みを、\n具体的な日付と証言をもとに辿っていきます。"}, {"t": 43.0, "x": "最後までご覧いただければ幸いです。"}, {"t": 45.5, "x": "それでは本編に入る前に、チャンネル登録と\n高評価をよろしくお願いいたします。"}, {"t": 51.06666666666667, "x": "まず、この人がどこから来たのかを\n確認しておきます。"}, {"t": 54.86666666666667, "x": "本名は八木宏。"}, {"t": 56.38333333333333, "x": "1956年3月23日、東京都新宿区の\n生まれで、兵庫県神戸市で育ちました。"}, {"t": 64.06666666666666, "x": "身長185センチ、体重108キロです。"}, {"t": 68.13333333333334, "x": "プロレスの世界に入ったのは、\n10代の半ばでした。"}, {"t": 71.71666666666667, "x": "最初に門を叩いたのは、\n国際プロレスではありません。"}, {"t": 75.48333333333333, "x": "1971年3月、中学を卒業すると、\n日本プロレスに押しかけて入門したと"}, {"t": 82.38333333333334, "x": "伝えられています。"}, {"t": 83.43333333333334, "x": "しかし若手が多く、練習生のまま給料も\n出なかったため、兵庫に戻りました。"}, {"t": 89.3, "x": "その後、国際プロレスが行った新人の\n公募に選ばれて入団しています。"}, {"t": 94.4, "x": "デビューは1972年9月9日、\n群馬県の藤岡市立体育館でした。"}, {"t": 100.4, "x": "16歳でのデビューです。"}, {"t": 102.15, "x": "若い頃は、団体の期待の星と見られていました。"}, {"t": 105.61666666666666, "x": "ただし、試合運びが単調で技の失敗も多く、\n前座に甘んじることが増えたと記録されています。"}, {"t": 112.7, "x": "デビュー2年目には、異例の早さで\nヨーロッパへの海外修行に出されています。"}, {"t": 117.8, "x": "そして帰国後、ファンの公募で\n決まった剛竜馬というリングネームに改めました。"}, {"t": 122.86666666666666, "x": "その国際プロレスは、この頃、\n経営難に陥っていました。"}, {"t": 127.41666666666667, "x": "給料の未払いが起き、主力の選手や\nスタッフの退団が相次ぎます。"}, {"t": 132.23333333333332, "x": "1978年4月16日、広島県の\n東広島市での大会で、剛は選手会長の"}, {"t": 139.86666666666667, "x": "ラッシャー木村に、退団を申し出ました。"}, {"t": 142.66666666666666, "x": "話を聞いた国際プロレスの社長は、\n4月18日、巡業先の長崎県島原市まで向かい、"}, {"t": 149.75, "x": "剛と話し合いの席を持っています。"}, {"t": 152.46666666666667, "x": "しかし剛の気持ちは変わりませんでした。"}, {"t": 155.06666666666666, "x": "1978年5月5日、\n国際プロレスを退団します。"}, {"t": 160.01666666666668, "x": "ここで、この後の話に\nつながる出来事が1つあります。"}, {"t": 163.88333333333333, "x": "退団から6日後の1978年5月11日。"}, {"t": 167.93333333333334, "x": "剛は、全日本プロレスの大阪府立体育館大会に\n姿を見せ、フリーになることを宣言しました。"}, {"t": 175.38333333333333, "x": "実はこのとき、剛はすでに\n新日本プロレスとの話を進めており、"}, {"t": 180.1, "x": "そのつながりを隠すために、あえて全日本の\n会場で宣言したと伝えられています。"}, {"t": 186.16666666666666, "x": "のちに解雇されることになる全日本の\nリングと、剛の最初の接点です。"}, {"t": 191.18333333333334, "x": "ただし、剛が実際に上がったのは、\n新日本プロレスのリングでした。"}, {"t": 196.43333333333334, "x": "アメリカのフロリダで修行を積んだあと、\n1978年7月27日、日本武道館で藤波辰巳の"}, {"t": 204.36666666666667, "x": "WWWFジュニアヘビー級王座に挑戦します。"}, {"t": 208.16666666666666, "x": "24歳の王者と、22歳の挑戦者でした。"}, {"t": 212.0, "x": "会場は冷房の効きが悪く、\n熱気がこもっていたと伝えられています。"}, {"t": 216.78333333333333, "x": "そのなかで、新日本のファンと\n国際プロレスのファンが、それぞれに"}, {"t": 221.46666666666667, "x": "声援を送る応援合戦になりました。"}, {"t": 223.93333333333334, "x": "終身雇用が当たり前だった時代に、\n団体を飛び出したフリーの選手という立場が、"}, {"t": 229.36666666666667, "x": "若いファンを引き付けたとも記録されています。"}, {"t": 232.33333333333334, "x": "結果は藤波の防衛でした。"}, {"t": 234.45, "x": "4か月後の1978年11月30日、\n広島県立体育館で再戦が組まれます。"}, {"t": 241.73333333333332, "x": "剛は最初から攻め込みましたが、\n攻め急いだところにパイルドライバーを"}, {"t": 246.26666666666668, "x": "受け、最後は17分56秒、藤波の\nドラゴン・スープレックスに敗れました。"}, {"t": 252.15, "x": "藤波にとっては、11度目の防衛でした。"}, {"t": 255.53333333333333, "x": "そして1979年10月2日、大阪府立体育会館。"}, {"t": 260.7, "x": "試合の終盤、剛はプランチャで流れを変え、\n最後は逆さ押さえ込みで3カウントを奪いました。"}, {"t": 267.8333333333333, "x": "3度目の挑戦で藤波を破り、23歳で\nWWFジュニアヘビー級王座を獲得しました。"}, {"t": 274.95, "x": "ところが2日後の10月4日、蔵前国技館での\nリターンマッチに敗れ、ベルトを失っています。"}, {"t": 281.9166666666667, "x": "わずか2日間の王者でした。"}, {"t": 283.8333333333333, "x": "新日本プロレスへの参戦は、\n1984年2月9日まで、"}, {"t": 289.01666666666665, "x": "5年9か月に及びました。"}, {"t": 291.3, "x": "ただし、最後までメインイベントの\n選手にはなれなかったと記録されています。"}, {"t": 296.28333333333336, "x": "次に向かったのは、1984年4月に\n旗揚げした新団体、UWFです。"}, {"t": 302.9166666666667, "x": "剛は旗揚げのメンバーの1人でした。"}, {"t": 305.43333333333334, "x": "しかし外国人選手の呼び寄せをめぐるトラブルが\n起き、わずか4か月で団体を離れています。"}, {"t": 311.8333333333333, "x": "そして1984年11月。"}, {"t": 314.6666666666667, "x": "剛は全日本プロレスに参戦しました。"}, {"t": 317.45, "x": "ここで再び合流したのが、国際プロレス時代の\n選手会長、ラッシャー木村です。"}, {"t": 323.45, "x": "木村もまたUWFに参加していましたが、\n1984年10月5日にUWFを離れ、"}, {"t": 330.56666666666666, "x": "全日本に上がっていました。"}, {"t": 332.6333333333333, "x": "国際プロレスでデビューした2人が、\nUWFを経て、そろって全日本の"}, {"t": 338.03333333333336, "x": "リングに立ったことになります。"}, {"t": 339.6, "x": "1984年12月8日、愛知県体育館。"}, {"t": 344.01666666666665, "x": "ジャンボ鶴田、天龍源一郎を相手にした試合の\n最中に、ラッシャー木村が突然、"}, {"t": 350.1166666666667, "x": "ジャイアント馬場にラリアットを放ちました。"}, {"t": 353.03333333333336, "x": "そこへ剛と、元国際プロレスの\n仲間が乱入し、木村に加勢します。"}, {"t": 358.5, "x": "こうして結成されたのが、国際血盟軍です。"}, {"t": 361.95, "x": "標的は、団体の社長でもある馬場でした。"}, {"t": 365.2, "x": "木村はこの造反について、\n自分の意思で動いたのは、これが"}, {"t": 369.7, "x": "初めてだった、と後に述懐しています。"}, {"t": 372.6333333333333, "x": "では、全日本での剛の立場は\nどうだったのでしょうか。"}, {"t": 376.46666666666664, "x": "記録に残っている評価は、厳しいものです。"}, {"t": 379.78333333333336, "x": "華のない試合ぶりで、前座の\n戦線に定着した、とされています。"}, {"t": 384.76666666666665, "x": "さらに1985年からは、長州力が\n率いるジャパンプロレスが全日本の"}, {"t": 390.4, "x": "リングに上がるようになりました。"}, {"t": 392.0833333333333, "x": "選手の数が一気に増え、剛の存在感は\n薄くなっていったと伝えられています。"}, {"t": 397.65, "x": "当時の専門誌の編集長は、\n剛についてこう振り返っています。"}, {"t": 402.3666666666667, "x": "剛は、全日本に革命を起こすと語っていた。"}, {"t": 405.98333333333335, "x": "しかし、考え方に柔軟性を感じなかった。"}, {"t": 409.65, "x": "同じ軍団にいた仲間も、\n剛についてこう語っています。"}, {"t": 413.71666666666664, "x": "剛はよくグチるから。"}, {"t": 415.3333333333333, "x": "酒を飲むとグチばっかだから。"}, {"t": 417.25, "x": "そして1986年3月2日。"}, {"t": 420.3, "x": "陸前高田市民体育館の大会を最後に、剛は\n国際血盟軍の仲間2人とともに解雇されました。"}, {"t": 427.4, "x": "解雇の理由として記録に残っているものは、\n1つではありません。"}, {"t": 431.6166666666667, "x": "1つ目は、選手の数です。"}, {"t": 433.93333333333334, "x": "当時の全日本は選手が余っている状態で、\n人を減らす必要があったとされています。"}, {"t": 439.71666666666664, "x": "同じ時期には、3人組の\nカルガリー・ハリケーンズの"}, {"t": 443.1333333333333, "x": "参戦が決まっていました。"}, {"t": 444.6333333333333, "x": "ハリケーンズの全日本での初戦は、\n1986年4月1日の上越大会です。"}, {"t": 451.06666666666666, "x": "その参戦と入れ替わる形で、\n血盟軍の3人が外されたことになります。"}, {"t": 456.2, "x": "2つ目は、人間関係です。"}, {"t": 458.65, "x": "剛の解雇の原因は、馬場や複数のレフェリーとの\n関係が悪くなったことだとされています。"}, {"t": 464.65, "x": "3つ目は、一緒に\n解雇された仲間の1人の発言です。"}, {"t": 468.6666666666667, "x": "馬場との食事の席で、馬場のプロレス観を\n否定するような発言をしたことが"}, {"t": 473.6666666666667, "x": "原因だった、という説があります。"}, {"t": 476.26666666666665, "x": "ただし、この説について当の本人は、\n馬場と食事をしたことも、馬場に"}, {"t": 482.0, "x": "反論したこともない、と強く否定しています。"}, {"t": 485.15, "x": "この動画では、どれが\n決め手だったのかは断定しません。"}, {"t": 488.9, "x": "確かなのは、参戦から1年4か月で、\n剛が全日本のリングを去ったという事実です。"}, {"t": 495.31666666666666, "x": "全日本を離れたあと、剛はすぐには\n表舞台に戻れませんでした。"}, {"t": 500.05, "x": "建設の内装業で下働きをしながら、\n生活費を稼いでいたと伝えられています。"}, {"t": 505.76666666666665, "x": "16歳でデビューし、藤波からベルトを\n奪ったこともある選手が、30歳を過ぎて"}, {"t": 511.8833333333333, "x": "リングの外で働いていたことになります。"}, {"t": 514.1666666666666, "x": "次に名前が大きく出るのは、\n2年半以上あとのことです。"}, {"t": 518.15, "x": "1988年11月15日。"}, {"t": 521.3166666666667, "x": "剛は、一緒に全日本を解雇された2人とともに、\n新団体、パイオニア戦志の設立を発表しました。"}, {"t": 529.7666666666667, "x": "所属選手は3人だけの団体です。"}, {"t": 532.3333333333334, "x": "のちに、インディー団体の\n先駆けと呼ばれることになります。"}, {"t": 536.1333333333333, "x": "旗揚げ戦は1989年4月30日、後楽園ホール。"}, {"t": 541.4833333333333, "x": "組まれた試合は、わずか2試合です。"}, {"t": 544.2333333333333, "x": "それでも会場は満員となり、\n観客は1,600人でした。"}, {"t": 548.7, "x": "メインイベントは、\n剛竜馬と大仁田厚の一騎打ちです。"}, {"t": 552.7166666666667, "x": "剛がアキレス腱固めを極めたところで、\nレフェリーが試合を止めました。"}, {"t": 557.3, "x": "しかし大仁田はこう主張しています。"}, {"t": 559.6333333333333, "x": "ギブアップしていない。"}, {"t": 560.9666666666667, "x": "納得のいかない観客からは、金返せの声が\n上がり、紙コップがリングに投げ込まれました。"}, {"t": 567.4166666666666, "x": "この旗揚げ戦は、藤波からも\n酷評されたと記録されています。"}, {"t": 571.8666666666667, "x": "1990年12月、剛は藤波との\nシングルマッチに臨みます。"}, {"t": 577.35, "x": "負けた方が追放されるという条件の試合でした。"}, {"t": 580.5833333333334, "x": "結果は剛の敗北です。"}, {"t": 582.35, "x": "パイオニア戦志は資金難に陥り、\n1991年1月29日に解散しました。"}, {"t": 589.5166666666667, "x": "1992年6月、剛は新団体、\nオリエンタルプ 6666666666, "x": "1956年3月23日、\n東京都新宿区に生まれる。"}, {"t": 745.4166666666666, "x": "本名は八木宏。"}, {"t": 746.9333333333333, "x": "1972年9月9日、\n国際プロレスでデビュー。16歳。"}, {"t": 752.2, "x": "1978年5月5日、国際プロレスを退団。"}, {"t": 756.8, "x": "5月11日、全日本の大阪大会でフリーを宣言。"}, {"t": 761.2, "x": "1979年10月2日、藤波を破り\nWWFジュニアヘビー級王座を獲得。"}, {"t": 768.1333333333333, "x": "2日後に失う。"}, {"t": 769.3833333333333, "x": "1984年2月9日、新日本を退団。"}, {"t": 773.6, "x": "4月、UWF旗揚げに参加し、4か月で離脱。"}, {"t": 778.4666666666667, "x": "1984年11月、全日本に参戦。"}, {"t": 782.6833333333333, "x": "12月8日、国際血盟軍を結成。"}, {"t": 786.0833333333334, "x": "1986年3月2日、\n陸前高田大会を最後に全日本を解雇。"}, {"t": 791.9833333333333, "x": "参戦から1年4か月。"}, {"t": 793.9666666666667, "x": "1988年11月15日、\nパイオニア戦志の設立を発表。"}, {"t": 800.3166666666667, "x": "1989年4月30日、\n後楽園ホールで旗揚げ戦。"}, {"t": 805.6333333333333, "x": "観客1,600人。"}, {"t": 807.1833333333333, "x": "1992年11月、\nオリエンタルプロレスの選手会から永久追放。"}, {"t": 812.9166666666666, "x": "1994年8月1日、後楽園ホールの\n自主興行で、プロレスバカの呼び名が定着。"}, {"t": 820.3333333333334, "x": "2009年10月18日、\n敗血症のため53歳で死去。"}, {"t": 825.3166666666667, "x": "全日本からの解雇について、\n記録が挙げている理由は、選手の余り、"}, {"t": 830.4333333333333, "x": "馬場やレフェリーとの関係、\n仲間の発言という3つでした。"}, {"t": 835.2, "x": "どれか1つに絞れる資料はありません。"}, {"t": 837.6, "x": "ただ、ジャパンプロレスの参戦で選手が\n一気に増え、前座に定着していた剛の居"}, {"t": 843.5, "x": "場所が小さくなっていたことは、\n記録から読み取れます。"}, {"t": 846.9833333333333, "x": "全日本に革命を起こすと語った剛と、\n柔軟性を感じなかったという周囲の評価。"}, {"t": 852.9666666666667, "x": "その食い違いが、人を減らす局面で\n表に出たのではないでしょうか。"}, {"t": 857.4833333333333, "x": "全日本を追われ、その後も自分で\n作った団体から追放されながら、剛は"}, {"t": 863.2833333333333, "x": "リングを降りることなく興行を打ち続けます。"}, {"t": 865.8333333333334, "x": "東京ドームの6万人が発した、\nショアとバカという声。"}, {"t": 869.7, "x": "最後に定着したのは、誰にも奪われない\n「プロレスバカ」という呼び名でした。"}, {"t": 874.6, "x": "剛竜馬という選手の歩みを、\n確認できた日付と証言でたどってきました。"}, {"t": 879.7166666666667, "x": "ご視聴、ありがとうございました。"}, {"t": 882.2666666666667, "x": "次の1人の記録も追っていきますので、\nチャンネル登録と高評価で"}, {"t": 886.5166666666667, "x": "見届けていただければ幸いです。"}], "w": 720, "h": 405, "n_cuts": 0, "noimage": true};
const a=document.getElementById('a');
const now=document.getElementById('now'), nl=document.getElementById('nextline');
const pp=document.getElementById('pp'), sk=document.getElementById('sk');
const tm=document.getElementById('tm'), bdg=document.getElementById('bdg');
const SMOOTH=matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth';
document.getElementById('ttl').innerHTML=D.name+
  '<span class="meta">'+fmt(D.dur)+'　字幕'+D.subs.length+'　（音声＋字幕だけ）</span>';

function fmt(s){s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')}
function subIdx(t){let lo=0,hi=D.subs.length-1,r=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(D.subs[m].t<=t){r=m;lo=m+1}else hi=m-1} return r}

let cur=-2;
function paint(t){
  const i=subIdx(t);
  if(i!==cur){cur=i;
    now.textContent = i<0 ? (D.subs.length?'（ここはまだ字幕がありません）'
                                          :'（この回に字幕はありません）')
                         : D.subs[i].x;
    const n=D.subs[i+1]; nl.textContent = n ? '次　'+n.x : '';
    bdg.textContent = D.subs.length ? '字幕 '+(i+1)+' / '+D.subs.length : '字幕なし';
    mark('subs',i);
  }
  tm.textContent=fmt(t)+' / '+fmt(D.dur);
  if(!sk.dragging) sk.value=Math.round(t/D.dur*1000);
}
function mark(pane,i){
  const el=document.getElementById(pane);
  if(el.dataset.on==i) return; el.dataset.on=i;
  el.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));
  const t=el.children[i]; if(!t) return; t.classList.add('on');
  if(!el.hidden){const r=t.offsetTop-el.clientHeight/2; el.scrollTo({top:r,behavior:SMOOTH})}
}

D.subs.forEach(s=>{const d=document.createElement('div');d.className='row';
  d.innerHTML='<b></b><span></span>';
  d.querySelector('b').textContent=fmt(s.t);
  d.querySelector('span').textContent=s.x;
  d.onclick=()=>go(s.t); document.getElementById('subs').appendChild(d)});
const mk=document.getElementById('mk');
D.subs.forEach(s=>{const i=document.createElement('i');
  i.style.left=(s.t/D.dur*100)+'%'; mk.appendChild(i)});

function go(t){a.currentTime=Math.min(Math.max(0,t)+0.01,Math.max(0.05,D.dur-0.05)); paint(a.currentTime)}
pp.onclick=()=>a.paused?a.play():a.pause();
const SPEEDS=[1,1.25,1.5,1.75,2,3,0.75],SPN=['等速','1.25倍','1.5倍','1.75倍','2倍','3倍','0.75倍'];
let si=0; const sp=document.getElementById('sp');
sp.onclick=()=>{si=(si+1)%SPEEDS.length; a.playbackRate=SPEEDS[si];
  a.preservesPitch=a.mozPreservesPitch=a.webkitPreservesPitch=true; sp.textContent=SPN[si]};
a.onplay=()=>pp.textContent='❚❚ 停止'; a.onpause=()=>pp.textContent='▶ 再生';
a.ontimeupdate=()=>paint(a.currentTime);
sk.oninput=()=>{sk.dragging=1; go(sk.value/1000*D.dur)};
sk.onchange=()=>sk.dragging=0;
document.getElementById('pv').onclick=()=>{const i=subIdx(a.currentTime);
  go(i>0?D.subs[i-1].t:0)};
document.getElementById('nx').onclick=()=>{const i=subIdx(a.currentTime);
  if(i+1<D.subs.length) go(D.subs[i+1].t)};
addEventListener('keydown',e=>{const k=e.key;
  if(k===' '){e.preventDefault();pp.onclick()}
  else if(k==='ArrowRight')go(a.currentTime+5); else if(k==='ArrowLeft')go(a.currentTime-5);
  else if(k==='ArrowDown'){e.preventDefault();document.getElementById('nx').onclick()}
  else if(k==='ArrowUp'){e.preventDefault();document.getElementById('pv').onclick()}
  else if(k==='s'||k==='S')sp.onclick()});
paint(0);
</script>
